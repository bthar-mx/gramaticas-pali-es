const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/\p{M}/gu,'').replace(/[*]/g,'').toLowerCase();
const root=document.documentElement;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const mq=c=>{try{return !!(window.matchMedia&&matchMedia(c).matches)}catch(e){return false}};
function paliLang(){const g=store.get('pali_lang');if(g==='en'||g==='es')return g;
  const n=(navigator.languages&&navigator.languages[0])||navigator.language||'';return /^en\b/i.test(n)?'en':'es'}
const QS=new URLSearchParams(location.search);
let lang=(QS.get('lang')||paliLang())==='en'?'en':'es';
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]||o.es||''));
const lq=()=>lang==='en'?'?lang=en':'';

/* «§N» y «Kacc. §N» llevan a la página del sutta; los de Rūpasiddhi,
   Saddanīti o Niruttidīpanī («Rū. §352», «Rū. 199, §352») no. */
function enlazar(h){
  /* tampoco los § de Rūpasiddhi o Saddanīti que la revisión escribe sin «Rū.»: «Rū. §330 (p. 178) y §341»,
     «Rū. §357–§358», «Rūpasiddhi (§349)», «Saddanīti las da en §702» (sin un punto de por medio) */
  return h.replace(/((?:Rū|Sad|Nir)\.\s*(?:\d+,\s*)?§\s?\d+(?:\s*\([^()]*\))?(?:\s*(?:–|y|,)\s*§\s?\d+)*|(?:Rūpasiddhi|Saddanīti|Niruttidīpanī)[^§.;]{0,60}?§\s?\d+)|((?:Kacc?\.\s*)?§\s?(\d+))/g,(m,otra,k,n)=>otra?otra:
    `<a class="k" href="../../s/${n}/${lq()}"${kTip(n)}>${k}</a>`);
}
function kTip(n){const x=(D.ktip||{})[n];if(!x)return '';const v=x[lang]||x.es;return tipAttr(TX[lang].kacc(n),v.pali,v.glosa)}
function md(s){
  return enlazar(esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>'))
    .replace(/\[\^(\w+)\]/g,(m,n)=>`<sup class="fn notranslate" translate="no"><a href="#nota-${n}" id="ll-${n}">${n}</a></sup>`)
    .replace(/\n/g,'<br>').replace(/^[\s\S]*$/,h=>tipCitas(h));
}
/* la referencia que la revisión añadió al final de un rótulo: «… (upamānuttarapada) (Kacc. §324; Rū. §339 (pp. 186–187))» */
const REF_FIN=/\s*\((?:Kacc?|Rū|Sad|Nir)\.[^()]*(?:\([^()]*\)[^()]*)*\)\s*$/;
function partirRef(s){const m=REF_FIN.exec(s);return m?[s.slice(0,m.index),m[0].trim()]:[s,'']}
const chipI=b=>b.iebh?`<span class="chip iebh" title="${esc(T[lang].iebh_tit+(b.fuente?' · '+T[lang].fuente+': '+b.fuente:''))}">IEBH${b.clase&&L(b.clase)?`<span class="ck">· ${esc(L(b.clase))}</span>`:''}</span>`:'';
/* la fuente a la vista sólo en las tablas del IEBH: los párrafos ya citan en el texto (y la llevan en la etiqueta) */
const fuenteI=b=>b.iebh&&b.fuente&&(b.tipo==='ejemplos'||b.tipo==='tabla')?`<p class="fuente chica"><b>${T[lang].fuente}</b>${md(b.fuente)}</p>`:'';
/* lo que el IEBH añade a un bloque (una referencia, una atestación, la fuente de una resolución) */
const anexosI=b=>(b.anexos||[]).map(x=>`<p class="il-anexo">${b.iebh&&!x.clase?'':chipI({iebh:1,fuente:x.fuente,clase:x.clase})}${md(L(x))}</p>`).join('');

/* ── los datos, recorridos una vez: subtipo de cada bloque, pestaña de cada
   id, y el banco de la práctica ─────────────────────────────────── */
const SECC=[{id:'intro',bloques:D.intro}].concat(CL.map(c=>({id:c.id,bloques:c.bloques})));
const TAB_DE={}, SUB_DE={};
SECC.forEach(s=>{let h2=null,h3=null;s.bloques.forEach(b=>{
  TAB_DE[b.id]=s.id;
  if(b.tipo==='h'){if(b.nivel===2){h2=b;h3=null}else h3=b}
  else if(b.def){h2=b;h3=null}
  SUB_DE[b.id]=h3?(h2&&h2!==h3?[h2,h3]:[h3]):(h2?[h2]:[]);
})});
function subTexto(b){return (SUB_DE[b.id]||[]).map(x=>x.def?'*'+x.def+'*':L(x.texto)).join(' · ')}
const sinGlosa=t=>!t.g||!L(t.g);
function resolucionDe(v){return v.filter(t=>!/^[,;.]+$/.test(t.p)).map(t=>t.p).join(' ')}
const BANCO=[];
(function(){const vistos=new Set();
  CL.forEach(c=>c.bloques.forEach(b=>{
    if(b.tipo==='interlineal'&&b.compuesto){
      const res=resolucionDe(b.viggaha);const k=c.id+'|'+b.compuesto+'|'+res;if(vistos.has(k))return;vistos.add(k);
      BANCO.push({c:c.id,id:b.id,comp:b.compuesto,trad:b.traduccion,res,b,sub:subTexto(b)});
    }else if(b.tipo==='ejemplos'){let se=null;
      b.filas.forEach((f,i)=>{if(L(f.sentido))se=f.sentido;
        const cs=f.compuesto.split('\n'),rs=f.resolucion.split('\n'),ts=(f.traduccion.es||'').split('\n'),te=(f.traduccion.en||'').split('\n');
        cs.forEach((x,j)=>{if(!x.trim())return;const k=c.id+'|'+x+'|'+(rs[j]||'');if(vistos.has(k))return;vistos.add(k);
          BANCO.push({c:c.id,id:b.id+'-f'+(i+1),comp:x.trim(),trad:{es:ts[j]||'',en:te[j]||''},res:(rs[j]||'').trim(),sentido:se,sub:subTexto(b)})})})}
  }))})();
const N_SUB=CL.reduce((a,c)=>a+c.bloques.filter(b=>b.tipo==='h'||b.def).length,0);

/* ── pintar los bloques ───────────────────────────────────────────── */
function token(t){
  const sep=/^[,;.]+$/.test(t.p);
  return `<span class="tk${sep?' sep':''}${t.r?' r':''}${sinGlosa(t)?' sinG':''}"><span class="p">${esc(t.p)}</span><span class="g">${md(L(t.g))||'&nbsp;'}</span></span>`;
}
function trad(s){/* «a\nb»: salto real sólo si la segunda parte es un paréntesis */
  return md(String(s||'').replace(/\n(?!\()/g,' '));
}
function interlineal(b,extra){
  const t=T[lang];
  if(!b.compuesto){return `<div class="il glosa ancho" id="${b.id}" data-b="${b.id}"><div class="il-v"><span class="lv">${t.porPalabra}</span>${b.viggaha.map(token).join('')}</div></div>`}
  const ancho=b.viggaha.length>6||b.alternativas;
  let h=`<article class="il${ancho?' ancho':''}${b.iebh?' iebh':''}${extra||''}" id="${b.id}" data-b="${b.id}">${chipI(b)}<div class="il-cab"><span class="il-c" lang="pi">${esc(b.compuesto)}</span>${L(b.traduccion)?`<span class="il-t">${trad(L(b.traduccion))}</span>`:''}</div>`;
  if(b.viggaha.length) h+=`<div class="il-v"><span class="lv">${t.viggaha}</span>${b.viggaha.map(token).join('')}</div>`;
  else if(!b.resto) h+=`<p class="il-sin">${t.sinViggaha}</p>`;
  (b.alternativas||[]).forEach(a=>{h+=`<div class="il-v il-alt"><span class="lv">${t.otra}</span>${a.viggaha.map(token).join('')}</div>`});
  if(b.resto) h+=`<p class="il-resto">${md(L(b.resto))}</p>`;
  h+=anexosI(b)+fuenteI(b)+`<a class="ancla" href="#${b.id}" aria-label="L${esc(b.L)}" title="L${esc(b.L)}">¶</a></article>`;
  return h;
}
function ejemplos(b){
  const t=T[lang],cuatro=b.columnas===4,cols=cuatro?t.cols4:t.cols3;
  let h=`<div class="ej-w" id="${b.id}" data-b="${b.id}">${chipI(b)}<table class="ejt"><thead><tr>${cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>`;
  b.filas.forEach((f,i)=>{
    const cs=f.compuesto.split('\n'),rs=f.resolucion.split('\n'),ts=L(f.traduccion).split('\n');
    const n=Math.max(cs.length,rs.length,ts.length),se=L(f.sentido);
    for(let j=0;j<n;j++){
      const id=j===0?` id="${b.id}-f${i+1}"`:'';
      const ch=j===0&&f.iebh?chipI({iebh:1,fuente:f.fuente}):'';
      h+=`<tr${id} class="${j?'sigue':''}${j===0&&se&&i?' grupo':''}${f.iebh?' iebh':''}">`+(cuatro?`<td class="se">${j===0?ch+md(se):''}</td>`:'')+
        `<td class="re" lang="pi">${cuatro?'':ch}${esc(rs[j]||'')}</td><td class="co" lang="pi">${esc(cs[j]||'')}</td><td class="tr">${md(ts[j]||'')}</td></tr>`;
    }
  });
  return h+'</tbody></table></div>'+fuenteI(b);
}
function bloque(b){
  const t=T[lang];
  switch(b.tipo){
  case 'h':{const tag=b.nivel===3?'h4':'h3';const [t0,ref]=partirRef(L(b.texto));
    const tx=md(t0).replace(/\(([^()]+)\)\s*$/,'<span class="pal">($1)</span>')+(ref?` <span class="ref-h">${md(ref)}</span>`:'');
    return `<${tag} class="st${b.iebh?' iebh':''}" id="${b.id}" data-b="${b.id}"><a class="ancla" href="#${b.id}" aria-label="§">§</a>${tx}${chipI(b)}</${tag}>`+fuenteI(b)}
  case 'p':
    if(b.def) return `<div class="def${b.iebh?' iebh':''}" id="${b.id}" data-b="${b.id}"><a class="ancla" href="#${b.id}" aria-label="§">§</a>${md(L(b.texto))}${chipI(b)}${anexosI(b)}</div>`+fuenteI(b);
    if(b.verso) return `<div class="bl iebh verso-u" data-b="${b.id}" id="${b.id}">${chipI(b)}${md(L(b.texto))}<p class="verso" lang="pi">${esc(L(b.verso)).replace(/\n/g,'<br>')}</p><p class="verso-t">${md(L(b.traduccion_verso))}</p></div>`;
    if(b.iebh) return `<p class="bl iebh" data-b="${b.id}" id="${b.id}">${chipI(b)}${md(L(b.texto))}</p>`+anexosI(b);
    return `<p class="bl" data-b="${b.id}" id="${b.id}">${md(L(b.texto))}</p>`+anexosI(b);
  case 'lista':
    if(b.forma==='pares'){let h=`<dl class="pares" data-b="${b.id}" id="${b.id}">`;for(let i=0;i<b.items.length;i+=2)h+=`<dt>${md(L(b.items[i]))}</dt><dd>${md(L(b.items[i+1]||''))}</dd>`;return h+'</dl>'+fuenteI(b)}
    return `<ul class="lst" data-b="${b.id}" id="${b.id}">${b.items.map(x=>`<li>${md(L(x))}</li>`).join('')}</ul>${chipI(b)}`+fuenteI(b);
  case 'paradigma':
    return `<div class="rc-desliza" data-b="${b.id}" id="${b.id}"><table class="ptab"><thead><tr>${b.cabecera.map(x=>`<th>${md(L(x))}</th>`).join('')}</tr></thead><tbody>`+
      b.filas.map(f=>`<tr>${f.map((x,i)=>i?`<td class="f" lang="pi">${esc(x)}</td>`:`<td>${md(L(x))}</td>`).join('')}</tr>`).join('')+'</tbody></table></div>'+fuenteI(b);
  case 'tabla':
    return `<div class="rc-desliza" data-b="${b.id}" id="${b.id}"><table class="gtab"><tbody>`+b.filas.map(f=>`<tr>${f.map(x=>`<td>${md(L(x))}</td>`).join('')}</tr>`).join('')+'</tbody></table></div>'+fuenteI(b);
  case 'ejemplos': return ejemplos(b);
  case 'interlineal': return interlineal(b);
  }
  return '';
}
function bloques(bs){
  let h='',grid=null;
  const cerrar=()=>{if(grid!==null){h+=`<div class="ilgrid">${grid}</div>`;grid=null}};
  bs.forEach((b,i)=>{if(b.tipo==='interlineal'){if(grid===null)grid='';grid+=interlineal(b)}
    /* una nota del IEBH sobre varias tarjetas, entre tarjetas: a todo lo ancho, dentro de la rejilla */
    else if(grid!==null&&b.iebh&&b.tipo==='p'&&bs[i+1]&&bs[i+1].tipo==='interlineal'){grid+=bloque(b)}
    else{cerrar();h+=bloque(b)}});
  cerrar();return h;
}
function notasDe(bs,extra){
  const txt=JSON.stringify(bs)+(extra||'');const ns=[...new Set([...txt.matchAll(/\[\^(\w+)\]/g)].map(m=>m[1]))];
  if(!ns.length)return '';
  const t=T[lang];
  return `<div class="gnotas"><h3>${t.notas_h}</h3>`+ns.map(n=>{const v=D.notas[n];if(!v)return '';
    const add=(Array.isArray(v.iebh)?v.iebh:[]).map(x=>`<span class="nadd">${chipI({iebh:1,fuente:x.fuente})}${md(L(x))}</span>`).join('');
    return `<p id="nota-${n}"${v.iebh===true?' class="niebh"':''}><a class="nn" href="#ll-${n}">${n}</a>${v.iebh===true?chipI({iebh:1,fuente:v.fuente}):''}${md(L(v))}${add}</p>`}).join('')+'</div>';
}
function nEjemplos(c){return BANCO.filter(x=>x.c===c.id).length}
function cabClase(c){
  const t=T[lang];
  return `<header class="clcab"><span class="num">${c.n}</span><h2 lang="pi">${esc(c.pali)}</h2><p class="sub">${esc(lang==='en'?t.clLargo[c.id]:(L(c.titulo)||t.clLargo[c.id]))}</p>
    <div class="meta">${c.kacc.map(k=>`<a class="ref-k" href="../../s/${k}/${lq()}"${kTip(k)||` title="${esc(t.kacc_tit)}"`}>Kacc. §${k}</a>`).join('')}${c.ref&&c.ref.replace(/^Kacc\. §\d+;?\s*/,"")?`<span class="dato">${md(c.ref.replace(/^Kacc\. §\d+;?\s*/,""))}</span>`:""}
    <span class="dato">${t.ejemplos(nEjemplos(c))}</span><span class="dato">· ${t.subtipos(c.bloques.filter(b=>b.tipo==='h'||b.def).length)}</span></div></header>`;
}
function mapa(){
  const t=T[lang];
  return `<h2 class="sec">${t.mapa_t}<small>${t.mapa_s}</small></h2><div class="mapa">`+CL.map(c=>{
    const e=BANCO.find(x=>x.c===c.id);
    return `<a class="mc" href="?c=${c.id}${lang==='en'?'&lang=en':''}" data-ir="${c.id}"><span class="mn">${c.n}</span><span class="mp" lang="pi">${esc(c.pali)}</span><span class="ms">${esc(t.clLargo[c.id])}</span>
      <span class="mx">Kacc. §${c.kacc.join(', §')} · ${t.ejemplos(nEjemplos(c))}</span>${e?`<span class="mv"><i>${esc(e.comp)}</i>${L(e.trad)?' «'+esc(L(e.trad).replace(/\n/g,' '))+'»':''}</span>`:''}</a>`}).join('')+'</div>';
}
function resumen(){
  const t=T[lang],r=D.resumen;if(!r)return '';
  const cl=CL.map(c=>c.id);
  return `<h2 class="sec">${t.resumen_t}<small>${t.resumen_s}</small></h2><div class="rc-desliza" data-b="resumen" id="resumen"><table class="gtab"><thead><tr>${r.cabecera.map(x=>`<th>${md(L(x))}</th>`).join('')}</tr></thead><tbody>`+
    r.filas.map((f,i)=>{const ns=r.significado?(r.cols_pali||f.length-1):-1;return `<tr>${f.map((x,j)=>{const s=L(x)||(ns>=0&&j>=ns?(x.es||''):'');if(!s.trim())return `<td class="vacia" title="${esc(t.vaciaCelda)}">—</td>`;
      if(ns>=0&&j>=ns)return `<td>${md(s)}</td>`;
      if(j===1&&cl[i])return `<td><a href="?c=${cl[i]}" data-ir="${cl[i]}">${md(s)}</a></td>`;return `<td${j>=2?' lang="pi"':''}>${j>=2?'<i>'+esc(s)+'</i>':md(s)}</td>`}).join('')}</tr>`}).join('')+'</tbody></table></div>'+notasDe([r]);
}

/* ── las pestañas ─────────────────────────────────────────────────── */
const TABS=['intro'].concat(CL.map(c=>c.id),['resumen']);
const HERR=['practicar','cual'];
let cl=(()=>{const c=QS.get('c');if(TABS.includes(c)||HERR.includes(c))return c;
  const h=decodeURIComponent(location.hash.slice(1));if(TAB_DE[h])return TAB_DE[h];return 'intro'})();
/* el texto de búsqueda de cada bloque, una vez por lengua */
const BUSCA={};
function textoBloque(b){const k=b.id+lang;if(BUSCA[k]!=null)return BUSCA[k];
  return BUSCA[k]=norm(JSON.stringify(b,(kk,v)=>kk==='en'&&lang==='es'&&!v?undefined:v)).replace(/[{}\[\]":,]+/g,' ')}
function bloquesDe(tab){if(tab==='intro')return D.intro;if(tab==='resumen')return D.resumen?[Object.assign({id:'resumen'},D.resumen)]:[];return byId[tab]?byId[tab].bloques:[]}
function q(){return norm(document.getElementById('q').value.trim())}
function hitsDe(tab,qq){if(!qq)return null;return bloquesDe(tab).filter(b=>b.tipo!=='h'&&textoBloque(b).includes(qq)).length}
function pestañas(){
  const t=T[lang],qq=q();
  document.getElementById('tabs').innerHTML=TABS.map(id=>{
    const sel=id===cl,h=hitsDe(id,qq),cero=qq&&h===0?' cero':'';
    const hits=qq?`<span class="hits">${h}</span>`:'<span class="hits"></span>';
    if(id==='intro'||id==='resumen')return `<button role="tab" data-c="${id}" aria-selected="${sel}" class="${cero}">${esc(t[id][0])}${hits}</button>`;
    const c=byId[id];return `<button role="tab" data-c="${id}" aria-selected="${sel}" class="${cero}" title="${esc(t.clLargo[id])}"><span class="tn">${c.n}</span><span class="tp">${esc(c.pali)}</span><span class="te">${esc(t.cl[id])}</span>${hits}</button>`}).join('');
  document.getElementById('tabs-herr').innerHTML=HERR.map(id=>`<button role="tab" data-c="${id}" aria-selected="${id===cl}"><span class="ic">${id==='practicar'?'✦':'?'}</span>${esc(t[id])}</button>`).join('');
}
/* el índice lateral: los subtipos de la pestaña */
function indice(){
  const t=T[lang];let h='';
  if(byId[cl]){
    const bs=byId[cl].bloques.filter(b=>b.tipo==='h'||b.def);
    h=`<p class="sb-tit">${esc(byId[cl].pali)}</p>`+(bs.length?bs.map(b=>{
      let tx;
      if(b.def)tx=`<i>${esc(b.def)}</i>`;
      else{const s=partirRef(L(b.texto).replace(/\[\^\w+\]/g,'').trim())[0],m=/^(\([0-9ivx]+\))\s*(.*?)\s*\(([^()]+)\)$/.exec(s);
        tx=m?`<span class="sn">${esc(m[1])}</span><i>${esc(m[3])}</i><span class="sd">${md(m[2])}</span>`:md(s)}
      return `<a href="#${b.id}" data-c="${b.id}" class="${b.nivel===3?'n3':''}">${tx}</a>`}).join(''):`<p class="sb-vacio">${t.sb_vacio}</p>`);
  }
  h+=`<p class="sb-tit">${t.sb_clases}</p>`+CL.map(c=>`<a href="?c=${c.id}" data-ir="${c.id}" class="${c.id===cl?'on':''}"><span class="sn">${c.n}</span><i>${esc(c.pali)}</i></a>`).join('')+
    `<a href="?c=resumen" data-ir="resumen"><span class="sn">∑</span>${esc(t.resumen[0])}</a><a href="?c=practicar" data-ir="practicar"><span class="sn">✦</span>${esc(t.practicar)}</a><a href="?c=cual" data-ir="cual"><span class="sn">?</span>${esc(t.cual)}</a>`;
  document.getElementById('sb-list').innerHTML=h;
}
function render(){
  const t=T[lang];let h='';
  if(cl==='intro'){h=bloques(D.intro)+mapa()+notasDe(D.intro)}
  else if(cl==='resumen'){h=resumen()}
  else if(cl==='practicar'){h=practicaHTML()}
  else if(cl==='cual'){h=cualHTML()}
  else{const c=byId[cl];const todo=c.bloques.length&&c.bloques.every(b=>b.iebh);
    h=cabClase(c)+(c.bloques.length?(todo?`<div class="solo-iebh">${t.solo_iebh}</div><div class="todo-iebh">${bloques(c.bloques)}</div>`:bloques(c.bloques)):`<div class="vacio-cl">${t.vacio}</div>`)+notasDe(c.bloques)}
  document.getElementById('out').innerHTML=h;
  indice();
  if(cl==='practicar')practicaIniciar();
  if(cl==='cual')cualPintar();
  filtrar();
}
/* buscar: se ocultan los bloques que no coinciden; un subtítulo se queda si
   coincide algo de su sección */
function filtrar(){
  const t=T[lang],qq=q(),herr=HERR.includes(cl);
  document.querySelector('.bar input').disabled=false;
  let n=0;
  if(!herr){
    const bs=bloquesDe(cl),vis={};
    bs.forEach(b=>{vis[b.id]=!qq||(b.tipo!=='h'&&textoBloque(b).includes(qq));if(vis[b.id]&&b.tipo!=='h')n++});
    if(qq)bs.forEach(b=>{if(vis[b.id])(SUB_DE[b.id]||[]).forEach(s=>vis[s.id]=true)});
    document.querySelectorAll('#out [data-b]').forEach(el=>{const v=vis[el.dataset.b];if(v!==undefined)el.hidden=!v});
    document.querySelectorAll('#out .ilgrid').forEach(g=>{g.hidden=!g.querySelector('.il:not([hidden])')});
    document.querySelectorAll('#out .mapa,#out h2.sec,#out .vacio-cl').forEach(e=>{if(cl!=='resumen')e.hidden=!!qq});
    document.querySelectorAll('#out .gnotas').forEach(e=>e.hidden=!!qq);
    document.querySelectorAll('#sb-list a[data-c]').forEach(a=>{const el=document.getElementById(a.dataset.c);a.hidden=!el||el.hidden});
    const otras=qq?TABS.filter(x=>x!==cl).reduce((a,x)=>a+hitsDe(x,qq),0):0;
    document.getElementById('count').textContent=qq?(otras?t.hits_otras(n,otras):n+''):(byId[cl]?t.ejemplos(nEjemplos(byId[cl])):'');
    document.getElementById('empty').hidden=!(qq&&!n);
    document.getElementById('empty-t').textContent=otras?t.empty_otras:t.empty;
  }else{document.getElementById('count').textContent='';document.getElementById('empty').hidden=true}
  pestañas();espiar();
}

/* ── practicar ────────────────────────────────────────────────────── */
const PR_K='compuestos_practica';
let PR=(()=>{try{const v=JSON.parse(store.get(PR_K)||'null');if(v&&typeof v==='object')return Object.assign({ok:0,n:0,racha:0,modo:'clase',fil:[],por:{}},v)}catch(e){}return {ok:0,n:0,racha:0,modo:'clase',fil:[],por:{}}})();
let prCur=null,prHecho=false;
const guardaPR=()=>store.set(PR_K,JSON.stringify(PR));
function prPool(){return BANCO.filter(x=>!PR.fil.length||PR.fil.includes(x.c))}
function practicaHTML(){
  const p=P[lang];
  return `<section class="pr"><div class="pr-cab"><div><h2>${p.tit}</h2><p>${p.sub}</p></div><div class="pr-marc" id="pr-marc"></div></div>
  <div class="pr-op"><span class="lbl">${p.modo}</span><div class="filtros" id="pr-modo"><button data-m="clase">${p.mClase}</button><button data-m="res">${p.mRes}</button></div></div>
  <div class="pr-op"><span class="lbl">${p.clases}</span><div class="filtros pr-filtro" id="pr-fil"><button data-f="">${p.todas}</button>${CL.map(c=>`<button data-f="${c.id}"><span class="tp">${esc(c.pali)}</span></button>`).join('')}</div></div>
  <div class="pr-tarj" id="pr-tarj" aria-live="polite"></div>
  <p class="pr-teclas">${p.teclas}</p>
  <p class="lbl" style="margin-top:20px">${p.stats}</p><div class="pr-stats" id="pr-stats"></div></section>`;
}
function prMarcador(){
  const p=P[lang];
  document.getElementById('pr-marc').innerHTML=`<span><b>${PR.ok}</b>${p.aciertos} ${p.de} ${PR.n}</span><span><b>${PR.racha}</b>${p.racha}</span><button id="pr-reset">${p.reset}</button>`;
  document.getElementById('pr-reset').onclick=()=>{PR.ok=0;PR.n=0;PR.racha=0;PR.por={};guardaPR();prMarcador();prStats()};
  document.querySelectorAll('#pr-modo button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===PR.modo));
  document.querySelectorAll('#pr-fil button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f?PR.fil.includes(b.dataset.f):!PR.fil.length));
}
function prStats(){
  document.getElementById('pr-stats').innerHTML=CL.map(c=>{const s=PR.por[c.id]||{ok:0,n:0};const pc=s.n?Math.round(100*s.ok/s.n):0;
    return `<div><i>${esc(c.pali)}</i><br>${s.ok}/${s.n}<span class="prb"><span style="width:${pc}%"></span></span></div>`}).join('');
}
function prNuevo(){
  const pool=prPool(),p=P[lang],box=document.getElementById('pr-tarj');
  if(!pool.length){box.innerHTML=`<p class="pr-nada">${p.nada}</p>`;prCur=null;return}
  let x;do{x=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&prCur&&x.comp===prCur.comp);
  prCur=x;prHecho=false;
  let h=`<p class="pr-q">${PR.modo==='clase'?p.qClase:p.qRes}</p><p class="pr-c" lang="pi">${esc(x.comp)}</p><p class="pr-t">${L(x.trad)?'«'+trad(L(x.trad))+'»':''}</p>`;
  if(PR.modo==='clase') h+=`<div class="pr-ops" id="pr-ops">${CL.map(c=>`<button data-c="${c.id}"><span class="n">${c.n}</span><span><span class="tp" lang="pi">${esc(c.pali)}</span> <span class="te">${esc(T[lang].cl[c.id])}</span></span></button>`).join('')}</div>`;
  else h+=`<form class="pr-esc" id="pr-esc" autocomplete="off"><input id="pr-in" lang="pi" spellcheck="false" autocapitalize="off" placeholder="${esc(p.ph)}" aria-label="${esc(p.qRes)}"><button class="btn" type="submit">${p.comprobar}</button></form>`;
  h+='<div id="pr-res"></div>';
  box.innerHTML=h;
  if(PR.modo==='clase')document.querySelectorAll('#pr-ops button').forEach(b=>b.onclick=()=>prClase(b.dataset.c));
  else{document.getElementById('pr-esc').onsubmit=e=>{e.preventDefault();prRes()};
    if(innerWidth>700)setTimeout(()=>{const i=document.getElementById('pr-in');if(i)i.focus({preventScroll:true})},0)}
}
function prApunta(ok){PR.n++;if(ok){PR.ok++;PR.racha++}else PR.racha=0;const s=PR.por[prCur.c]||(PR.por[prCur.c]={ok:0,n:0});s.n++;if(ok)s.ok++;guardaPR();prMarcador();prStats()}
function prSolucion(veredicto,tuya){
  const p=P[lang],x=prCur,c=byId[x.c];
  let h=`<div class="pr-res">${veredicto}`;
  if(tuya!=null)h+=`<p class="pr-tuya">${p.tuya}: ${esc(tuya)||'—'}</p>`;
  h+=`<dl class="pr-sol"><dt>${p.dl.clase}</dt><dd><b>${c.n}</b> · <i lang="pi">${esc(c.pali)}</i> — ${esc(T[lang].clLargo[c.id])}</dd>`;
  if(x.sub)h+=`<dt>${p.dl.sub}</dt><dd>${md(x.sub)}</dd>`;
  if(x.sentido&&L(x.sentido))h+=`<dt>${p.dl.sentido}</dt><dd>${md(L(x.sentido))}</dd>`;
  if(!x.b){h+=`<dt>${p.dl.res}</dt><dd><i lang="pi">${esc(x.res)}</i></dd>`;if(L(x.trad))h+=`<dt>${p.dl.tr}</dt><dd>${trad(L(x.trad))}</dd>`}
  h+='</dl>';
  if(x.b)h+=interlineal(x.b).replace(/ id="[^"]*"/,'').replace(/<a class="ancla"[^>]*>¶<\/a>/,'');
  h+=`<div class="pr-acc"><button class="btn" id="pr-sig">${p.sig}</button><a href="?c=${x.c}#${x.id}" data-ir-id="${x.id}">${p.verla}</a></div></div>`;
  document.getElementById('pr-res').innerHTML=h;
  document.getElementById('pr-sig').onclick=prNuevo;
  prHecho=true;
  setTimeout(()=>{const s=document.getElementById('pr-sig');if(s)s.focus({preventScroll:true})},0);
}
function prClase(id){
  if(prHecho||!prCur)return;const p=P[lang],ok=id===prCur.c;
  document.querySelectorAll('#pr-ops button').forEach(b=>{b.disabled=true;if(b.dataset.c===prCur.c)b.classList.add('bien');else if(b.dataset.c===id)b.classList.add('mal');else b.classList.add('atenua')});
  prApunta(ok);
  prSolucion(`<p class="pr-ver"><span class="v ${ok?'bien':'mal'}">${ok?p.bien:p.mal}</span></p>`);
}
const limpiaRes=s=>String(s||'').normalize('NFC').toLowerCase().replace(/[^\p{L}\p{M}\s]/gu,' ').replace(/\s+/g,' ').trim();
function prRes(){
  if(prHecho||!prCur)return;const p=P[lang],tuya=document.getElementById('pr-in').value.trim();
  document.querySelector('#pr-esc input').disabled=true;document.querySelector('#pr-esc button').disabled=true;
  const a=limpiaRes(tuya),b=limpiaRes(prCur.res);
  if(a&&a===b){prApunta(true);return prSolucion(`<p class="pr-ver"><span class="v bien">${p.bien}</span></p>`,tuya)}
  if(a&&norm(a)===norm(b)){prApunta(true);return prSolucion(`<p class="pr-ver"><span class="v casi">${p.casi}</span>${p.casiT}</p>`,tuya)}
  prSolucion(`<p class="pr-ver">${p.igual} <button class="btn sec" id="pr-si">${p.si}</button> <button class="btn sec" id="pr-no">${p.no}</button></p>`,tuya);
  prHecho='duda';
  const fin=ok=>{prApunta(ok);const v=document.querySelector('#pr-res .pr-ver');v.innerHTML=`<span class="v ${ok?'bien':'mal'}">${ok?p.bien:p.mal}</span>`;prHecho=true;const s=document.getElementById('pr-sig');if(s)s.focus({preventScroll:true})};
  document.getElementById('pr-si').onclick=()=>fin(true);document.getElementById('pr-no').onclick=()=>fin(false);
}
function practicaIniciar(){
  prMarcador();prStats();prNuevo();
  document.getElementById('pr-modo').onclick=e=>{const b=e.target.closest('button');if(!b)return;PR.modo=b.dataset.m;guardaPR();prMarcador();prNuevo()};
  document.getElementById('pr-fil').onclick=e=>{const b=e.target.closest('button');if(!b)return;const f=b.dataset.f;
    if(!f)PR.fil=[];else PR.fil=PR.fil.includes(f)?PR.fil.filter(x=>x!==f):PR.fil.concat(f);
    if(PR.fil.length===CL.length)PR.fil=[];guardaPR();prMarcador();prNuevo()};
}
addEventListener('keydown',e=>{
  if(cl!=='practicar'||e.altKey||e.ctrlKey||e.metaKey)return;
  const enInput=e.target.closest&&e.target.closest('input,textarea');
  if(PR.modo==='clase'&&!prHecho&&/^[1-6]$/.test(e.key)&&!enInput){const c=CL[+e.key-1];if(c){e.preventDefault();prClase(c.id)}}
  else if(e.key==='Enter'&&prHecho===true&&!e.target.closest('a,button')){e.preventDefault();prNuevo()}
});

/* ── ¿qué compuesto es? ───────────────────────────────────────────── */
let cualCamino=[],cualPrueba=null;
function cualHTML(){

function cualPintar(){

    if(!r){h+=`<p class="ej">${g.ej}: ${enlazarL(L(paso.ej))}</p><div class="sino"><button class="btn" data-r="si">${g.si}</button><button class="btn sec" data-r="no">${g.no}</button>${i?`<button class="btn sec" data-r="atras">${g.atras}</button>`:''}</div></li>`;break}

  f.innerHTML=`<div class="cual-fin">${veredicto}<h3 lang="pi">${c?esc(c.pali):'—'}${c?`<small>${esc(t.clLargo[c.id])} · <a class="k" href="../../s/${c.kacc[0]}/${lq()}"${kTip(c.kacc[0])}>Kacc. §${c.kacc[0]}</a></small>`:''}</h3>
    <p>${enlazarL(tx.p)}</p><p class="ojo"><b>${g.ojo}</b>${enlazarL(tx.o)}</p>${cmp}
    <div class="cual-acc"><button class="btn" id="cual-de-nuevo">${g.deNuevo}</button>${c?`<a href="?c=${c.id}" data-ir="${c.id}">${g.ir('<i>'+esc(c.pali)+'</i>')}</a>`:`<a href="?c=tappurisa" data-ir="tappurisa">${g.ir('<i>tappurisa</i>')}</a>`}${cualPrueba?` <a href="?c=${cualPrueba.c}#${cualPrueba.id}" data-ir-id="${cualPrueba.id}">${P[lang].verla}</a>`:''}</div></div>`;

const tipAttr=(tk,tp,txt)=>` data-tk="${esc(tk)}" data-tip="${esc(txt)}"${tp?` data-tp="${esc(tp)}"`:''}`;
function pags(r){const m=[...r.matchAll(/pp?\.\s*(\d+(?:\s*[–-]\s*\d+)?)/g)].map(x=>x[1]);return m}

/* el sutta citado: Rū. §N (o el sutta que se comenta en esa página), Sad. §N o (Smith p. N),

function textoBloque(b){if(!b)return '';let t=L(b.texto)||L(b.titulo)||'';
  if(!t&&b.filas&&b.filas[0])t=b.filas.map(f=>Array.isArray(f)?f.map(L).join(' · '):[f.compuesto,L(f.traduccion)].filter(Boolean).join(' — ')).slice(0,2).join(' / ');

/* sólo en el texto que no está ya dentro de un enlace o de un emergente; tres pasadas */
function enTexto(h,f){
  let dentro=0;
  return h.split(/(<[^>]+>)/).map(seg=>{
    if(seg.startsWith('<')){if(/^<(a|span class="rt")\b/.test(seg))dentro++;else if(/^<\/(a|span)>/.test(seg)&&dentro)dentro--;return seg}
    return dentro?seg:f(seg)}).join('');
}
function tipCitas(h){

    const [tp,ds]=infoCita(kk,r);return `<span class="rt" tabindex="0"${tipAttr(o[lang==='en'?1:0],tp,ds||m)}>${m}</span>`}));
  h=enTexto(h,seg=>seg.replace(RE_CANON,(m,pre,sig,vp,_p,pts)=>{const o=OBRAS_T[sig];if(!o)return m;
    return `${pre}<span class="rt" tabindex="0"${tipAttr(o[lang==='en'?1:0],'',descCanon(vp,pts))}>${m.slice(pre.length)}</span>`}));
  h=enTexto(h,seg=>seg.replace(/\bL(\d{4})\b/g,(m,n)=>{const x=tipL(n);
    return x?`<a class="k" href="?c=${TAB_DE[x.id]}#${x.id}" data-ir-id="${x.id}"${tipAttr(x.tk,'',x.tx)}>${m}</a>`:m}));

let spyF=0;
function espiar(){
  const links=document.querySelectorAll('#sb-list a[data-c]');let cur=null;const lim=barEl.getBoundingClientRect().bottom+40;
  for(const a of links){if(a.hidden)continue;const el=document.getElementById(a.dataset.c);if(!el)continue;if(el.getBoundingClientRect().top<=lim)cur=a;else break}
  links.forEach(a=>a.classList.toggle('on',a===cur));
}
const topBtn=document.getElementById('top-btn');
addEventListener('scroll',()=>{topBtn.classList.toggle('show',scrollY>600);if(!spyF)spyF=requestAnimationFrame(()=>{spyF=0;espiar()})},{passive:true});
topBtn.onclick=()=>scrollTo({top:0});
textos();render();
function irAncla(){const id=decodeURIComponent(location.hash.slice(1));if(!id)return;
  if(/^nota-|^ll-/.test(id)){const t=document.getElementById(id);if(t)setTimeout(()=>t.scrollIntoView(),0);return}
  const tab=TAB_DE[id]||TAB_DE[id.replace(/-f\d+$/,'')];if(tab&&tab!==cl){cl=tab;render()}
  const t=document.getElementById(id);if(t)setTimeout(()=>{t.scrollIntoView();t.classList.add('foco');setTimeout(()=>t.classList.remove('foco'),1800)},0)}
addEventListener('hashchange',irAncla);irAncla();
})();
