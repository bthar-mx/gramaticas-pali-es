i” (M. iii 57 (PTS iii 6); S. ii 127 (PTS iii 156)).","fuente":"Tipiṭaka","L":"0169b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-lohitacandanam"},{"tipo":"interlineal","origen":"tabla","compuesto":"setahatthī","traduccion":{"es":"elefante blanco","en":"white elephant"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"seto","g":{"es":"blanco","en":"white"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"hatthī","g":{"es":"elefante","en":"elephant"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0173","hasta":"0176","anexos":[{"es":"Este compuesto es facultativo (vibhāsā), de modo que a veces no se forma: «puṇṇo Mantāniputto», «citto gahapati», «sakko devarājā» (Rū. §339; Nir. 234 añade «brahmā sahampati»).","en":"This compound is facultative (vibhāsā), so that it is sometimes not formed: “puṇṇo Mantāniputto”, “citto gahapati”, “sakko devarājā” (Rū. §339; Nir. 234 adds “brahmā sahampati”).","fuente":"Rūpasiddhi · Niruttidīpanī","L":"0176b"}],"id":"c-setahatthi"},{"tipo":"interlineal","origen":"tabla","compuesto":"puṅkokilo","traduccion":{"es":"cuclillo macho","en":"male cuckoo"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"pumā","g":{"es":"macho","en":"male"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"kokilo","g":{"es":"cuclillo","en":"cuckoo"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0180","hasta":"0183","anexos":[{"es":"En compuesto, ante «liṅga», etc., «puma» pierde su a final (Kacc. §222; Rū. §342), y la m pasa a niggahīta (Kacc. §82; Rū. §149: «Aṃ-mo niggahitaṃ jha-la-pehi»). Así lo deriva Nandisena en Kacc. §222: «Puṅkokilo = puma + kokilo (‘a’ de “puma” se elide (§222); ‘m’ se sustituye por ‘ṃ’ (§82); ‘ṃ’ se sustituye por ‘ṅ’ (§31))»; el último paso es «Vaggantaṃ vā vagge» (Kacc. §31). Rūpasiddhi da del mismo modo «punnāgo» (Rū. §342).","en":"In a compound, before “liṅga”, etc., “puma” loses its final a (Kacc. §222; Rū. §342), and the m becomes niggahīta (Kacc. §82; Rū. §149: “Aṃ-mo niggahitaṃ jha-la-pehi”). This is how Nandisena derives it at Kacc. §222: “Puṅkokilo = puma + kokilo (‘a’ of ‘puma’ is elided (§222); ‘m’ is substituted by ‘ṃ’ (§82); ‘ṃ’ is substituted by ‘ṅ’ (§31))”; the last step is “Vaggantaṃ vā vagge” (Kacc. §31). Rūpasiddhi gives “punnāgo” in the same way (Rū. §342).","fuente":"Rūpasiddhi · Kaccāyana","L":"0183b"}],"id":"c-punkokilo"},{"tipo":"interlineal","origen":"tabla","compuesto":"khattiyakaññā","traduccion":{"es":"muchacha noble","en":"noble girl"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"Khattiyā","g":{"es":"noble","en":"noble"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"sā","g":{"es":"ésta (es)","en":"this one (is)"}},{"p":"kaññā","g":{"es":"muchacha","en":"girl"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0187","hasta":"0190","anexos":[{"es":"«khattiyakaññā vā brāhmaṇakaññā vā gahapatikaññā vā» (M. i 122 (PTS i 88)).","en":"“khattiyakaññā vā brāhmaṇakaññā vā gahapatikaññā vā” (M. i 122 (PTS i 88)).","fuente":"Tipiṭaka","L":"0190b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-khattiyakanna"},{"tipo":"interlineal","origen":"tabla","compuesto":"rattalatā","traduccion":{"es":"enredadera roja","en":"red creeper"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"rattā","g":{"es":"roja","en":"red"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"sā","g":{"es":"ésta (es)","en":"this one (is)"}},{"p":"latā","g":{"es":"enredadera","en":"creeper"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0194","hasta":"0197","id":"c-rattalata"},{"tipo":"interlineal","origen":"tabla","compuesto":"brāhmaṇadārikā","traduccion":{"es":"niña brahmán","en":"brahmin girl"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"brāhmaṇī","g":{"es":"brahmán","en":"brahmin"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"sā","g":{"es":"ésta (es)","en":"this one (is)"}},{"p":"dārikā","g":{"es":"niña","en":"girl"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0201","hasta":"0204","id":"c-brahmanadarika"},{"tipo":"p","texto":{"es":"En «khattiyakaññā», «rattalatā» y «brāhmaṇadārikā», el primer miembro es un femenino que indicó masculino (bhāsitapuma) y, ante un último miembro femenino que se refiere a la misma cosa, se considera como masculino y pierde el sufijo femenino: khattiyā → khattiya, brāhmaṇī → brāhmaṇa (Kacc. §332; Rū. §343). Esto vale sólo para el primer miembro: en «khattiyakumārī» o «taruṇabrāhmaṇī» el último conserva el sufijo femenino. Y no se aplica si la palabra no se usa en masculino: «gaṅgānadī», «pathavīdhātu» (Rū. §343).","en":"In “khattiyakaññā”, “rattalatā” and “brāhmaṇadārikā”, the first member is a feminine that indicated masculine (bhāsitapuma) and, before a feminine last member that refers to the same thing, it is regarded as masculine and loses the feminine suffix: khattiyā → khattiya, brāhmaṇī → brāhmaṇa (Kacc. §332; Rū. §343). This holds only for the first member: in “khattiyakumārī” or “taruṇabrāhmaṇī” the last member keeps the feminine suffix. And it does not apply if the word is not used in the masculine: “gaṅgānadī”, “pathavīdhātu” (Rū. §343)."},"L":"0204b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"kammadharaya-l0204b"},{"tipo":"interlineal","origen":"tabla","compuesto":"katamanikāyo","traduccion":{"es":"cuál colección","en":"which collection"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"katamo","g":{"es":"cuál","en":"which"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"ésta (es)","en":"this one (is)"}},{"p":"nikāyo","g":{"es":"colección","en":"collection"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0208","hasta":"0211","id":"c-katamanikayo"},{"tipo":"interlineal","origen":"tabla","compuesto":"hetupaccayo","traduccion":{"es":"condición de raíz","en":"root condition"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"hetu","g":{"es":"raíz","en":"root"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"ésta (es)","en":"this one (is)"}},{"p":"paccayo","g":{"es":"condición","en":"condition"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0215","hasta":"0218","anexos":[{"es":"Rūpasiddhi da este ejemplo como visesanapubbapada y lo escribe «hetuppaccayo» (Rū., p. 186); el Paṭṭhāna escribe «hetupaccayo». Niruttidīpanī, en cambio, lo pone entre los sambhāvanāpubbapada: «Hetu hutvā paccayo hetupaccayo», la condición que es raíz (Nir. 234).","en":"Rūpasiddhi gives this example as visesanapubbapada and writes it “hetuppaccayo” (Rū., p. 186); the Paṭṭhāna writes “hetupaccayo”. Niruttidīpanī, on the other hand, places it among the sambhāvanāpubbapada: “Hetu hutvā paccayo hetupaccayo”, the condition that is a root (Nir. 234).","fuente":"Rūpasiddhi · Niruttidīpanī","L":"0218b"}],"id":"c-hetupaccayo"},{"tipo":"interlineal","origen":"tabla","compuesto":"jīvitanavakaṃ","traduccion":{"es":"el grupo de nueve en el que predomina la\nfacultad vital","en":"the group of nine in which the\nvital faculty predominates"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"jīvitappadhānaṃ","g":{"es":"en el que predomina la facultad vital","en":"in which the vital faculty predominates"}},{"p":"navakaṃ","g":{"es":"grupo de nueve","en":"group of nine"}}],"L":"0222","hasta":"0225","id":"c-jivitanavakam"},{"tipo":"h","nivel":2,"texto":{"es":"(2) El último miembro califica al primer miembro (visesanuttarapada) (Kacc. §324; Rū. §339 (p. 186))","en":"(2) The last member qualifies the first member (visesanuttarapada) (Kacc. §324; Rū. §339 (p. 186))"},"L":"0228","id":"kammadharaya-visesanuttarapada"},{"tipo":"p","texto":{"es":"El miembro que califica, *thera*, *ācariya*, maestro, *paṇḍita*, sabio, etc., se coloca al final.","en":"The qualifying member, *thera*, *ācariya*, teacher, *paṇḍita*, sage, etc., is placed at the end."},"L":"0230","id":"kammadharaya-l0230"},{"tipo":"p","texto":{"es":"Según Rūpasiddhi, el calificativo va al final para no contradecir la palabra del Jina (jinavacanānuparodhato), es decir, porque así lo dice el texto. Se da también el orden inverso: «ācariyaguttilo» (Rū., p. 186; Sad. (Smith p. 751)).","en":"According to Rūpasiddhi, the qualifier goes at the end so as not to contradict the word of the Jina (jinavacanānuparodhato), that is, because the text says so. The reverse order also occurs: “ācariyaguttilo” (Rū., p. 186; Sad. (Smith p. 751))."},"L":"0230b","iebh":true,"fuente":"Rūpasiddhi · Saddanīti","id":"kammadharaya-l0230b"},{"tipo":"interlineal","origen":"tabla","compuesto":"Sāriputtatthero","traduccion":{"es":"el thera Sāriputta","en":"the thera Sāriputta"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"Sāriputto","g":{"es":"Sāriputta","en":"Sāriputta"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"thero","g":{"es":"thera","en":"thera"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0231","hasta":"0234","anexos":[{"es":"Tipiṭaka (lectura de la edición del Sexto Concilio): «āyasmato sāriputtattherassa sīse pahāraṃ adāsi» (Ud. 124 (PTS p. 40)).","en":"Tipiṭaka (reading of the Sixth Council edition): “āyasmato sāriputtattherassa sīse pahāraṃ adāsi” (Ud. 124 (PTS p. 40)).","fuente":"Tipiṭaka","L":"0234b"}],"id":"c-sariputtatthero"},{"tipo":"interlineal","origen":"tabla","compuesto":"Buddhaghosācariyo","traduccion":{"es":"el maestro Buddhaghosa","en":"the teacher Buddhaghosa"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"Buddhaghoso","g":{"es":"Buddhaghosa","en":"Buddhaghosa"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"ācariyo","g":{"es":"maestro","en":"teacher"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0239","hasta":"0242","id":"c-buddhaghosacariyo"},{"tipo":"interlineal","origen":"tabla","compuesto":"Mahosadhapaṇḍito","traduccion":{"es":"el sabio Mahosadha","en":"the sage Mahosadha"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"Mahosadho","g":{"es":"Mahosadha","en":"Mahosadha"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"paṇḍito","g":{"es":"sabio","en":"sage"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0244","hasta":"0247","id":"c-mahosadhapandito"},{"tipo":"interlineal","origen":"tabla","compuesto":"purisuttamo","traduccion":{"es":"el mejor hombre","en":"the best man"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"puriso","g":{"es":"hombre","en":"man"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"uttamo","g":{"es":"el mejor","en":"the best"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0251","hasta":"0254","id":"c-purisuttamo"},{"tipo":"p","texto":{"es":"Este ejemplo no está en Rūpasiddhi; Niruttidīpanī lo da entre los visesanuttarapada, con «purisavaro» y «purisaviseso» (Nir. 234). Tipiṭaka: «Namo te purisājañña, namo te purisuttama» (D. iii 160 (PTS iii 197)).","en":"This example is not in Rūpasiddhi; Niruttidīpanī gives it among the visesanuttarapada, with “purisavaro” and “purisaviseso” (Nir. 234). Tipiṭaka: “Namo te purisājañña, namo te purisuttama” (D. iii 160 (PTS iii 197))."},"L":"0254b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī · Tipiṭaka","id":"kammadharaya-l0254b"},{"tipo":"h","nivel":2,"texto":{"es":"(3) Ambos miembros califican (visesanobhayapada) (Kacc. §324; Rū. §339 (p. 186))","en":"(3) Both members qualify (visesanobhayapada) (Kacc. §324; Rū. §339 (p. 186))"},"L":"0260","id":"kammadharaya-visesanobhayapada"},{"tipo":"interlineal","origen":"tabla","compuesto":"sītuṇhaṃ","traduccion":{"es":"(algo que es) frío y caliente","en":"(something that is) cold and hot"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"sītañ","g":{"es":"frío","en":"cold"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"taṃ","g":{"es":"esto (es)","en":"this (is)"}},{"p":"uṇhañ","g":{"es":"caliente","en":"hot"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0263","hasta":"0266","id":"c-situnham"},{"tipo":"p","texto":{"es":"Los dos miembros califican a una tercera cosa, que puede quedar expresa: «siniddho ca so uṇho cā ti siniddhuṇho» māso, (frijol) graso y caliente (Rū., p. 186); «gilāno ca so vuṭṭhito cā ti gilānavuṭṭhito», «gilāno hutvā gelaññā vuṭṭhito», el que estuvo enfermo y se recuperó (Sad. (Smith p. 751)). Otros ejemplos de Rūpasiddhi: khañjakhujjo, chiddāvachiddaṃ, uccāvacaṃ, chinnabhinnaṃ.","en":"The two members qualify a third thing, which may remain expressed: “siniddho ca so uṇho cā ti siniddhuṇho” māso, (bean) oily and hot (Rū., p. 186); “gilāno ca so vuṭṭhito cā ti gilānavuṭṭhito”, “gilāno hutvā gelaññā vuṭṭhito”, one who was ill and has recovered (Sad. (Smith p. 751)). Other examples from Rūpasiddhi: khañjakhujjo, chiddāvachiddaṃ, uccāvacaṃ, chinnabhinnaṃ."},"L":"0266b","iebh":true,"fuente":"Rūpasiddhi · Saddanīti","id":"kammadharaya-l0266b"},{"tipo":"p","texto":{"es":"La diferencia entre este tipo de compuesto y el compuesto copulativo (**dvanda**) es que en este último cada miembro se toma individualmente. Ej., *sītañ ca uṇhañ ca* = *sītuṇhaṃ*, frío y calor.","en":"The difference between this kind of compound and the copulative compound (**dvanda**) is that in the latter each member is taken individually. E.g., *sītañ ca uṇhañ ca* = *sītuṇhaṃ*, cold and heat."},"L":"0272","id":"kammadharaya-l0272"},{"tipo":"p","texto":{"es":"Saddanīti llama a estos compuestos de doble interpretación (dvādhippāyika): «sītañ ca taṃ uṇhañ cā ti sītuṇhaṃ» bhattaṃ, comida fría y caliente, es kammadhāraya; «sītañ ca uṇhañ ca sītuṇhaṃ», el frío y el calor, como en «sītaṃ uṇhaṃ paṭihanati», es dvanda; y «katākataṃ» y semejantes se resuelven también de las dos maneras (Sad. (Smith p. 753)).","en":"Saddanīti calls these compounds of double interpretation (dvādhippāyika): “sītañ ca taṃ uṇhañ cā ti sītuṇhaṃ” bhattaṃ, cold and hot food, is kammadhāraya; “sītañ ca uṇhañ ca sītuṇhaṃ”, cold and heat, as in “sītaṃ uṇhaṃ paṭihanati”, is dvanda; and “katākataṃ” and the like are also resolved in both ways (Sad. (Smith p. 753))."},"L":"0272b","iebh":true,"fuente":"Saddanīti","id":"kammadharaya-l0272b"},{"tipo":"interlineal","origen":"tabla","compuesto":"andhabadhiro","traduccion":{"es":"(alguien que es) ciego y sordo","en":"(someone who is) blind and deaf"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"andho","g":{"es":"ciego","en":"blind"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"badhiro","g":{"es":"sordo","en":"deaf"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0274","hasta":"0277","id":"c-andhabadhiro"},{"tipo":"interlineal","origen":"tabla","compuesto":"katākataṃ","traduccion":{"es":"(algo que es) hecho y no hecho","en":"(something that is) done and not done"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"katañ","g":{"es":"hecho","en":"done"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"tañ","g":{"es":"esto (es)","en":"this (is)"}},{"p":"akatañ","g":{"es":"no hecho","en":"not done"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0279","hasta":"0282","anexos":[{"es":"«Na paresaṃ vilomāni, na paresaṃ katākataṃ» (Dh. 20 (PTS p. 7)).","en":"“Na paresaṃ vilomāni, na paresaṃ katākataṃ” (Dh. 20 (PTS p. 7)).","fuente":"Tipiṭaka","L":"0282b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-katakatam"},{"tipo":"interlineal","origen":"tabla","compuesto":"sittasammaṭṭhaṃ","traduccion":{"es":"(algo que es) asperjado y barrido","en":"(something that is) sprinkled and swept"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"sittañ","g":{"es":"asperjado","en":"sprinkled"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"tañ","g":{"es":"esto (es)","en":"this (is)"}},{"p":"sammaṭṭhañ","g":{"es":"barrido","en":"swept"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0284","hasta":"0287","id":"c-sittasammattham"},{"tipo":"interlineal","origen":"tabla","compuesto":"gatapaccāgataṃ","traduccion":{"es":"(algo que ha) ido y vuelto","en":"(something that has) gone and returned"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"gatañ","g":{"es":"ido","en":"gone"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"tam","g":{"es":"esto (ha)","en":"this (has)"}},{"p":"paccāgatañ","g":{"es":"vuelto","en":"returned"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0289","hasta":"0292","id":"c-gatapaccagatam"},{"tipo":"h","nivel":2,"texto":{"es":"(4) El último miembro es la comparación (upamāna) que califica al primer miembro (upamānuttarapada) (Kacc. §324; Rū. §339 (pp. 186–187))","en":"(4) The last member is the standard of comparison (upamāna) that qualifies the first member (upamānuttarapada) (Kacc. §324; Rū. §339 (pp. 186–187))"},"L":"0294","id":"kammadharaya-upamanuttarapada"},{"tipo":"p","texto":{"es":"El segundo miembro es una comparación y se usa la partícula *viya*, como, para explicar el segundo miembro. Ej., *sīho viya sīho*, león (significa) como un león.","en":"The second member is a comparison, and the particle *viya*, like, is used to explain the second member. E.g., *sīho viya sīho*, lion (means) like a lion."},"L":"0296","id":"kammadharaya-l0296"},{"tipo":"interlineal","origen":"tabla","compuesto":"munisīho","traduccion":{"es":"sabio como un león","en":"a sage like a lion"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"muni","g":{"es":"sabio","en":"sage"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"sīho","g":{"es":"como un león","en":"like a lion"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0298","hasta":"0301","id":"c-munisiho"},{"tipo":"p","texto":{"es":"*Ādicco viya ādicco*, sol (significa) como el sol.","en":"*Ādicco viya ādicco*, sun (means) like the sun."},"L":"0306","id":"kammadharaya-l0306"},{"tipo":"interlineal","origen":"tabla","compuesto":"Buddhādicco","traduccion":{"es":"Buddha que es como el sol","en":"Buddha who is like the sun"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"Buddho","g":{"es":"Buddha","en":"Buddha"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"ādicco","g":{"es":"como el sol","en":"like the sun"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0308","hasta":"0311","anexos":[{"es":"«Buddhacande anuppanne, buddhādicce anuggate» (V. v 157 (PTS Vin v 86)).","en":"“Buddhacande anuppanne, buddhādicce anuggate” (V. v 157 (PTS Vin v 86)).","fuente":"Tipiṭaka","L":"0311b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-buddhadicco"},{"tipo":"p","texto":{"es":"*Raṃsi viya raṃsi*, rayo de luz (significa) como un rayo de luz.","en":"*Raṃsi viya raṃsi*, ray of light (means) like a ray of light."},"L":"0313","id":"kammadharaya-l0313"},{"tipo":"interlineal","origen":"tabla","compuesto":"saddhammaraṃsi","traduccion":{"es":"el buen Dhamma que es como un rayo de luz","en":"the good Dhamma that is like a ray of light"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"saddhammo","g":{"es":"buen Dhamma","en":"good Dhamma"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"raṃsi","g":{"es":"como un rayo de luz","en":"like a ray of light"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0315","hasta":"0318","id":"c-saddhammaramsi"},{"tipo":"p","texto":{"es":"*Sāgaro viya sāgaro*, el océano (significa) como el océano.","en":"*Sāgaro viya sāgaro*, the ocean (means) like the ocean."},"L":"0321","id":"kammadharaya-l0321"},{"tipo":"interlineal","origen":"tabla","compuesto":"vinayasāgaro","traduccion":{"es":"el Vinaya que es como el océano","en":"the Vinaya that is like the ocean"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"vinayo","g":{"es":"Vinaya","en":"Vinaya"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"sāgaro","g":{"es":"como el océano","en":"like the ocean"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0323","hasta":"0326","id":"c-vinayasagaro"},{"tipo":"p","texto":{"es":"*Cando viya cando*, la luna (significa) como la luna.","en":"*Cando viya cando*, the moon (means) like the moon."},"L":"0328","id":"kammadharaya-l0328"},{"tipo":"interlineal","origen":"tabla","compuesto":"mukhacando","traduccion":{"es":"un rostro como la luna","en":"a face like the moon"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"mukhañ","g":{"es":"rostro","en":"face"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"taṃ","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"cando","g":{"es":"como la luna","en":"like the moon"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0330","hasta":"0333","id":"c-mukhacando"},{"tipo":"p","texto":{"es":"*Padumo viya padumo*, loto (significa) como un loto.","en":"*Padumo viya padumo*, lotus (means) like a lotus."},"L":"0338","id":"kammadharaya-l0338"},{"tipo":"interlineal","origen":"tabla","compuesto":"samaṇapadumo","traduccion":{"es":"un asceta como un loto","en":"an ascetic like a lotus"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"samaṇo","g":{"es":"asceta","en":"ascetic"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"padumo","g":{"es":"como un loto","en":"like a lotus"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0340","hasta":"0343","anexos":[{"es":"Rūpasiddhi da también «puṇḍarīkam iva puṇḍarīko, samaṇo ca so puṇḍarīko cā ti samaṇapuṇḍarīko» (Rū., p. 187). Tipiṭaka: «Katamo ca puggalo samaṇapadumo? Idh’ ekacco puggalo tiṇṇaṃ saṃyojanānaṃ parikkhayā rāgadosamohānaṃ tanuttā sakadāgāmī hoti…», y a continuación «samaṇapuṇḍarīko» (Pu. 173 (PTS p. 63)).","en":"Rūpasiddhi also gives “puṇḍarīkam iva puṇḍarīko, samaṇo ca so puṇḍarīko cā ti samaṇapuṇḍarīko” (Rū., p. 187). Tipiṭaka: “Katamo ca puggalo samaṇapadumo? Idh’ ekacco puggalo tiṇṇaṃ saṃyojanānaṃ parikkhayā rāgadosamohānaṃ tanuttā sakadāgāmī hoti…”, followed by “samaṇapuṇḍarīko” (Pu. 173 (PTS p. 63)).","fuente":"Rūpasiddhi · Tipiṭaka","L":"0343b"}],"id":"c-samanapadumo"},{"tipo":"h","nivel":2,"texto":{"es":"(5) El primer miembro expresa lo que se considera o se atribuye (sambhāvanāpubbapada)","en":"(5) The first member expresses what is considered or attributed (sambhāvanāpubbapada)"},"L":"0346","id":"kammadharaya-sambhavanapubbapada"},{"tipo":"p","texto":{"es":"Las nueve clases de kammadhāraya las enumera Rūpasiddhi al introducir Rū. §339 (= Kacc. §324, «Dvipade tulyādhikaraṇe kammadhārayo»), p. 183; el sambhāvanāpubbapada, en la p. 187. Saddanīti las da en §702: Sad. (Smith pp. 751–752).","en":"The nine kinds of kammadhāraya are listed by Rūpasiddhi when introducing Rū. §339 (= Kacc. §324, “Dvipade tulyādhikaraṇe kammadhārayo”), p. 183; the sambhāvanāpubbapada, on p. 187. Saddanīti gives them at §702: Sad. (Smith pp. 751–752)."},"L":"0346b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti","clase":{"es":"Referencia","en":"Reference"},"id":"kammadharaya-l0346b"},{"tipo":"p","texto":{"es":"Para la resolución de este tipo de compuesto se utiliza la partícula *iti*, así. Esta partícula \"eleva\" el primer miembro al nivel del segundo. También se utiliza *hutvā*, *bhūta*, siendo.","en":"For the resolution of this kind of compound the particle *iti*, thus, is used. This particle “raises” the first member to the level of the second. *hutvā*, *bhūta*, being, are also used."},"L":"0348","id":"kammadharaya-l0348"},{"tipo":"p","texto":{"es":"Suttaniddesa explica el nombre: el compuesto se llama sambhāvana porque su resolución («guṇo iti buddhi») va unida a la partícula «iti», que muestra la consideración («es guṇa»). Niruttidīpanī (Nir. 235) define la sambhāvanā como «la exaltación del significado del último miembro, que es general, haciéndolo firme; muestra su naturaleza específica, no una mera cualidad». Sus ejemplos son los de «hutvā» y «bhūta» (hetu hutvā paccayo hetupaccayo; ariyabhūto saṅgho ariyasaṅgho), de donde proceden los dos últimos de esta sección; y de los ejemplos con «iti» que traen los maestros (garū; la edición remite a Rū. §343) —dhammabuddhi, dhammasaññā, aniccasaññā, attadiṭṭhi…— dice que convienen más como compuestos determinativos de la primera inflexión con «iti» elidido, como saraṇaṅgato. Rūpasiddhi, por su parte, no pone hetuppaccayo en esta clase, sino entre los ejemplos de visesanapubbapada que siguen a Rū. §343 (p. 186: puratthimakāyo, purāṇavihāro…).","en":"Suttaniddesa explains the name: the compound is called sambhāvana because its resolution (“guṇo iti buddhi”) is joined to the particle “iti”, which shows the consideration (“it is guṇa”). Niruttidīpanī (Nir. 235) defines sambhāvanā as “the exaltation of the meaning of the last member, which is general, by making it firm; it shows its specific nature, not a mere quality”. Its examples are those with “hutvā” and “bhūta” (hetu hutvā paccayo hetupaccayo; ariyabhūto saṅgho ariyasaṅgho), from which the last two of this section come; and of the examples with “iti” brought forward by the teachers (garū; the edition refers to Rū. §343) —dhammabuddhi, dhammasaññā, aniccasaññā, attadiṭṭhi…— it says that they fit better as determinative compounds in the first inflection with “iti” elided, like saraṇaṅgato. Rūpasiddhi, for its part, does not put hetuppaccayo in this class, but among the examples of visesanapubbapada that follow Rū. §343 (p. 186: puratthimakāyo, purāṇavihāro…)."},"L":"0348b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī · Suttaniddesa","id":"kammadharaya-l0348b"},{"tipo":"interlineal","origen":"tabla","compuesto":"dhammabuddhi","traduccion":{"es":"entendimiento de que es dhamma","en":"understanding that it is dhamma"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"dhammo","g":{"es":"dhamma","en":"dhamma"}},{"p":"iti","g":{"es":"así","en":"thus"}},{"p":"buddhi","g":{"es":"entendimiento","en":"understanding"}}],"L":"0350","hasta":"0353","anexos":[{"es":"La resolución «dhammo iti buddhi» muestra que «dhammabuddhi» no es «el entendimiento del dhamma» —eso sería «dhammassa buddhi», un compuesto determinativo en la sexta inflexión—, sino el entender algo como dhamma; así también «dhammasaññā», la percepción [de algo] como dhamma (Rū., p. 187). «Dhamma» y «buddhi» son cosas distintas; según explica U Sīlānanda (clase de Rūpasiddhi n.º 43), la partícula «iti» lleva el primer miembro al nivel del segundo, de modo que los dos se refieran a lo mismo.","en":"The resolution “dhammo iti buddhi” shows that “dhammabuddhi” is not “the understanding of the dhamma” —that would be “dhammassa buddhi”, a determinative compound in the sixth inflection— but the understanding of something as dhamma; so also “dhammasaññā”, the perception [of something] as dhamma (Rū., p. 187). “Dhamma” and “buddhi” are different things; as U Sīlānanda explains (Rūpasiddhi class no. 43), the particle “iti” brings the first member to the level of the second, so that the two refer to the same thing.","fuente":"Rūpasiddhi · U Sīlānanda","L":"0353b"}],"id":"c-dhammabuddhi"},{"tipo":"interlineal","origen":"tabla","compuesto":"dhammasaññā","traduccion":{"es":"la percepción de que es dhamma","en":"the perception that it is dhamma"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"dhammo","g":{"es":"dhamma","en":"dhamma"}},{"p":"iti","g":{"es":"así","en":"thus"}},{"p":"saññā","g":{"es":"percepción","en":"perception"}}],"L":"0358","hasta":"0361","id":"c-dhammasanna"},{"tipo":"interlineal","origen":"tabla","compuesto":"dhammasaṅkhāto","traduccion":{"es":"considerado como dhamma","en":"regarded as dhamma"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"dhammo","g":{"es":"dhamma","en":"dhamma"}},{"p":"iti","g":{"es":"así","en":"thus"}},{"p":"saṅkhāto","g":{"es":"considerado","en":"regarded"}}],"L":"0366","hasta":"0369","id":"c-dhammasankhato"},{"tipo":"interlineal","origen":"tabla","compuesto":"aniccasaññā","traduccion":{"es":"la percepción de que es impermanente","en":"the perception that it is impermanent"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"aniccaṃ","g":{"es":"impermanente","en":"impermanent"}},{"p":"iti","g":{"es":"así","en":"thus"}},{"p":"saññā","g":{"es":"percepción","en":"perception"}}],"L":"0374","hasta":"0377","anexos":[{"es":"Aniccasaññā, D. iii 201 (PTS iii 243): «aniccasaññā, anicce dukkhasaññā, dukkhe anattasaññā…».","en":"Aniccasaññā, D. iii 201 (PTS iii 243): “aniccasaññā, anicce dukkhasaññā, dukkhe anattasaññā…”.","fuente":"Tipiṭaka","L":"0377b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-aniccasanna"},{"tipo":"interlineal","origen":"tabla","compuesto":"attadiṭṭhi","traduccion":{"es":"la noción de que es *atta* (entidad permanente)","en":"the notion that it is *atta* (a permanent entity)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"attā","g":{"es":"alma","en":"soul"}},{"p":"iti","g":{"es":"así","en":"thus"}},{"p":"diṭṭhi","g":{"es":"noción","en":"notion"}}],"L":"0379","hasta":"0382","id":"c-attaditthi"},{"tipo":"interlineal","origen":"tabla","compuesto":"hetupaccayo","traduccion":{"es":"condición de raíz (la condición que es raíz)","en":"root condition (the condition that is a root)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"hetu","g":{"es":"raíz","en":"root"}},{"p":"hutvā","g":{"es":"siendo","en":"being"}},{"p":"paccayo","g":{"es":"condición","en":"condition"}}],"L":"0385","hasta":"0388","anexos":[{"es":"Hetupaccayo es la primera de las veinticuatro condiciones, Paṭṭh. i 1 («Hetupaccayo, ārammaṇapaccayo, adhipatipaccayo…»).","en":"Hetupaccayo is the first of the twenty-four conditions, Paṭṭh. i 1 (“Hetupaccayo, ārammaṇapaccayo, adhipatipaccayo…”).","fuente":"Tipiṭaka","L":"0388b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-hetupaccayo-2"},{"tipo":"interlineal","origen":"tabla","compuesto":"ariyasaṅgho","traduccion":{"es":"Saṅgha Noble","en":"Noble Saṅgha"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"ariyabhūto","g":{"es":"que es Noble","en":"which is Noble"}},{"p":"saṅgho","g":{"es":"Saṅgha","en":"Saṅgha"}}],"L":"0390","hasta":"0393","id":"c-ariyasangho"},{"tipo":"h","nivel":2,"texto":{"es":"(6) El primer miembro restringe al segundo miembro (avadhāraṇapubbapada) (Rū., p. 187 (clases de kammadhāraya tras Rū. §339 = Kacc. §324); Nir. 234–235; Sad. (Smith p. 752))","en":"(6) The first member restricts the second member (avadhāraṇapubbapada) (Rū., p. 187 (kinds of kammadhāraya after Rū. §339 = Kacc. §324); Nir. 234–235; Sad. (Smith p. 752))"},"L":"0400","id":"kammadharaya-avadharanapubbapada"},{"tipo":"p","texto":{"es":"Para resolver este tipo de compuesto se utiliza la partícula *eva*, misma. El primer miembro restringe al segundo miembro.","en":"To resolve this kind of compound the particle *eva*, itself, is used. The first member restricts the second member."},"L":"0402","id":"kammadharaya-l0402"},{"tipo":"interlineal","origen":"tabla","compuesto":"guṇadhanaṃ","traduccion":{"es":"la cualidad misma es riqueza","en":"the quality itself is wealth"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"guṇo","g":{"es":"la cualidad","en":"the quality"}},{"p":"eva","g":{"es":"misma (es)","en":"itself (is)"}},{"p":"dhanaṃ","g":{"es":"riqueza","en":"wealth"}}],"L":"0405","hasta":"0408","id":"c-gunadhanam"},{"tipo":"interlineal","origen":"tabla","compuesto":"cakkhundriyaṃ","traduccion":{"es":"facultad del ojo (el ojo mismo es la facultad)","en":"eye faculty (the eye itself is the faculty)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"cakkhu","g":{"es":"el ojo","en":"the eye"}},{"p":"eva","g":{"es":"mismo (es)","en":"itself (is)"}},{"p":"indriyaṃ","g":{"es":"facultad","en":"faculty"}}],"L":"0413","hasta":"0416","anexos":[{"es":"«Eva» excluye lo demás: «guṇo eva dhanaṃ na maṇisuvaṇṇādī», la cualidad es la riqueza, no las gemas, el oro, etc. (Nir. 235). Saddanīti —Sad. (Smith p. 752)— objeta la resolución «cakkhu eva indriyaṃ» que da Rūpasiddhi, porque parecería negar que el oído y las demás sean facultades; en «saddhā eva dhanaṃ» no hay ese defecto, porque lo que se excluye es la riqueza que el mundo tiene por tal (oro, plata, ropas).","en":"“Eva” excludes the rest: “guṇo eva dhanaṃ na maṇisuvaṇṇādī”, quality is wealth, not gems, gold, etc. (Nir. 235). Saddanīti —Sad. (Smith p. 752)— objects to the resolution “cakkhu eva indriyaṃ” given by Rūpasiddhi, because it would seem to deny that the ear and the others are faculties; in “saddhā eva dhanaṃ” there is no such defect, because what is excluded is the wealth that the world takes as such (gold, silver, clothes).","fuente":"Rūpasiddhi · Saddanīti · Niruttidīpanī","L":"0416b"}],"id":"c-cakkhundriyam"},{"tipo":"interlineal","origen":"tabla","compuesto":"rūpārammaṇaṃ","traduccion":{"es":"objeto visible (la misma forma visible es objeto)","en":"visible object (visible form itself is the object)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"rūpaṃ","g":{"es":"la forma visual","en":"the visual form"}},{"p":"eva","g":{"es":"misma (es)","en":"itself (is)"}},{"p":"ārammaṇaṃ","g":{"es":"objeto","en":"object"}}],"L":"0418","hasta":"0421","id":"c-ruparammanam"},{"tipo":"p","texto":{"es":"Cakkhundriyaṃ, Dhs. 147 (PTS p. 126): «Atthi rūpaṃ cakkhundriyaṃ, atthi rūpaṃ na cakkhundriyaṃ»; rūpārammaṇaṃ, Dhs. 17 (PTS p. 9): «rūpārammaṇaṃ vā saddārammaṇaṃ vā…».","en":"Cakkhundriyaṃ, Dhs. 147 (PTS p. 126): “Atthi rūpaṃ cakkhundriyaṃ, atthi rūpaṃ na cakkhundriyaṃ”; rūpārammaṇaṃ, Dhs. 17 (PTS p. 9): “rūpārammaṇaṃ vā saddārammaṇaṃ vā…”."},"L":"0421b","iebh":true,"fuente":"Tipiṭaka","clase":{"es":"Atestación","en":"Attestation"},"id":"kammadharaya-l0421b"},{"tipo":"h","nivel":2,"texto":{"es":"(7) El primer miembro es la partícula 'na' (nanipātapubbapada)","en":"(7) The first member is the particle ‘na’ (nanipātapubbapada)"},"L":"0423","id":"kammadharaya-nanipatapubbapada"},{"tipo":"p","texto":{"es":"El primer miembro es la partícula 'na', no. Esta partícula de negación se reemplaza por 'a' antes de una consonante y por 'an' antes de una vocal. Ej., *na* + *kusala* = *akusala*, no sano, insano; *na* + *ariyo* = *anariyo*, no noble, innoble.","en":"The first member is the particle ‘na’, not. This negative particle is replaced by ‘a’ before a consonant and by ‘an’ before a vowel. E.g., *na* + *kusala* = *akusala*, not wholesome, unwholesome; *na* + *ariyo* = *anariyo*, not noble, ignoble."},"L":"0425","id":"kammadharaya-l0425"},{"tipo":"p","texto":{"es":"Son Kacc. §333 (Rū. §344), «Attaṃ n’ assa tappurise», y Kacc. §334 (Rū. §345), «Sare an». Rūpasiddhi forma primero el compuesto adjetivo (na brāhmaṇo) y le da el nombre de compuesto determinativo por «Ubhe tappurisā» (Kacc. §326, Rū. §341), porque los dos suttas sólo actúan en un tappurisa.","en":"These are Kacc. §333 (Rū. §344), “Attaṃ n’ assa tappurise”, and Kacc. §334 (Rū. §345), “Sare an”. Rūpasiddhi first forms the adjectival compound (na brāhmaṇo) and gives it the name of determinative compound by “Ubhe tappurisā” (Kacc. §326, Rū. §341), because the two suttas operate only in a tappurisa."},"L":"0425b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"kammadharaya-l0425b"},{"tipo":"p","texto":{"es":"La partícula de negación *a* puede tener los siguientes significados:","en":"The negative particle *a* can have the following meanings:"},"L":"0427","id":"kammadharaya-l0427"},{"tipo":"lista","items":[{"es":"Negación (paṭisedhana):","en":"Negation (paṭisedhana):"},{"es":"asuta, no oído.","en":"asuta, not heard."},{"es":"Incremento (vuddhi):","en":"Increase (vuddhi):"},{"es":"asekkhā dhammā (Dhs. 2), estados del que ya no está en entrenamiento (del arahant).","en":"asekkhā dhammā (Dhs. 2), states of one who is no longer in training (of the arahant)."},{"es":"Ese estado (tabbhāva):","en":"That state (tabbhāva):"},{"es":"anavajjaṃ, irreprochable.","en":"anavajjaṃ, blameless."},{"es":"Otro (añña):","en":"Other (añña):"},{"es":"abyākatā dhammā (Dhs. 1 (PTS p. 1)), estados indeterminados.","en":"abyākatā dhammā (Dhs. 1 (PTS p. 1)), indeterminate states."},{"es":"Parecido, semejante (sadisa):","en":"Similar, resembling (sadisa):"},{"es":"amanusso (D. ii 195 (PTS ii 243)), parecido a un humano = un espíritu o deva.","en":"amanusso (D. ii 195 (PTS ii 243)), resembling a human = a spirit or deva."},{"es":"Opuesto (viruddha):","en":"Opposite (viruddha):"},{"es":"akusalā dhammā (Dhs. 1), estados insanos.","en":"akusalā dhammā (Dhs. 1), unwholesome states."},{"es":"Reproche (garaha):","en":"Reproach (garaha):"},{"es":"arājā, no rey.","en":"arājā, no king."},{"es":"Vacío (suñña):","en":"Void (suñña):"},{"es":"abhāvo (Vis. i 327), inexistencia, ausencia.","en":"abhāvo (Vis. i 327), non-existence, absence."},{"es":"Carente (viraha):","en":"Lacking (viraha):"},{"es":"aputtakaṃ (V. i 20 (PTS Vin iii 18)), sin hijo.","en":"aputtakaṃ (V. i 20 (PTS Vin iii 18)), without a son."},{"es":"Poco (appaka):","en":"Little (appaka):"},{"es":"anudarā kaññā (Vis-ṭ. ii 264), muchacha con poco vientre.","en":"anudarā kaññā (Vis-ṭ. ii 264), a girl with little belly."}],"L":"0429","hasta":"0448","forma":"pares","id":"kammadharaya-l0429"},{"tipo":"p","texto":{"es":"Otro sentido, fuera de la lista: mera partícula (nipātamatta): khipiṃ anantakaṃ (Vv. 108 (PTS p. 117); VvA. 290 (PTS p. 309)), le puse en la mano el trapo [en que llevaba atadas las gachas] (anantakaṃ = nantakaṃ, «trapo»); na cā pi apunappunaṃ (J. i 34), ni nunca más.","en":"Another sense, outside the list: mere particle (nipātamatta): khipiṃ anantakaṃ (Vv. 108 (PTS p. 117); VvA. 290 (PTS p. 309)), I put into his hand the rag [in which I carried the gruel tied up] (anantakaṃ = nantakaṃ, “rag”); na cā pi apunappunaṃ (J. i 34), nor ever again."},"L":"0448b","iebh":true,"fuente":"Tipiṭaka · Aṭṭhakathā","id":"kammadharaya-l0448b"},{"tipo":"p","texto":{"es":"La lista de diez significados no está en Rūpasiddhi, que sólo distingue los sentidos de semejante, otro, opuesto y ausencia («taṃsadisatadaññatabbiruddhatadabhāvesu pi», Rū. §344 (p. 188)). Coincide, en el mismo orden, con una estrofa que cita Apadāna-aṭṭhakathā (ApA. ii 143 (PTS p. 430): «paṭisedhe vuddhitabbhāve…pe… akāro virahappake’’ ti evaṃ vuttesu dasasu atthesu») y que Sīmavisodhanī (p. 49) da entera: «Paṭisedhe vuddhitabbhāve, aññatthe sadise pi ca; viruddhe garahe suññe, akāro viraha’ppake». Varios de los ejemplos (amanusso, anudarā kaññā, asekkhā dhammā) están en el análisis de la negación de Visuddhimagga-mahāṭīkā (Vis-ṭ. ii 264), con otra terminología.","en":"The list of ten meanings is not in Rūpasiddhi, which distinguishes only the senses of similar, other, opposite and absence (“taṃsadisatadaññatabbiruddhatadabhāvesu pi”, Rū. §344 (p. 188)). It coincides, in the same order, with a stanza quoted by the Apadāna-aṭṭhakathā (ApA. ii 143 (PTS p. 430): “paṭisedhe vuddhitabbhāve…pe… akāro virahappake’’ ti evaṃ vuttesu dasasu atthesu”) and given in full by Sīmavisodhanī (p. 49): “Paṭisedhe vuddhitabbhāve, aññatthe sadise pi ca; viruddhe garahe suññe, akāro viraha’ppake”. Several of the examples (amanusso, anudarā kaññā, asekkhā dhammā) are in the analysis of negation in the Visuddhimagga-mahāṭīkā (Vis-ṭ. ii 264), with other terminology."},"L":"0448e","iebh":true,"fuente":"Rūpasiddhi · Sīmavisodhanī · Visuddhimagga-mahāṭīkā · Aṭṭhakathā","id":"kammadharaya-l0448e"},{"tipo":"p","texto":{"es":"En *a-sūriya-passā rājadārā*, las esposas del rey no ven el sol, la partícula *a* niega a *passā*, ven, y no a *sūriya*, sol. Éste es uno de los usos de la partícula de negación cuando forma un compuesto con otras palabras. Esto se denomina *pasajjappaṭisedha*, impedir después de alcanzar. Es decir, la partícula *a* ignora *sūriya*, sol, y niega el último miembro del compuesto *passā*, ven. Otros ejemplos, *akatvā*, no habiendo hecho; *puññaṃ akaronto*, no haciendo mérito.","en":"In *a-sūriya-passā rājadārā*, the king’s wives do not see the sun, the particle *a* negates *passā*, see, and not *sūriya*, sun. This is one of the uses of the particle of negation when it forms a compound with other words. This is called *pasajjappaṭisedha*, preventing after reaching. That is, the particle *a* ignores *sūriya*, sun, and negates the last member of the compound, *passā*, see. Other examples: *akatvā*, not having done; *puññaṃ akaronto*, not doing merit."},"L":"0450","id":"kammadharaya-l0450"},{"tipo":"p","texto":{"es":"En *a-brāhmaṇa*, como un brahmán. Éste es otro uso de la partícula de negación cuando forma un compuesto. Esto se denomina *pariyudāsa*, rechazar el significado del último miembro del compuesto después de tomar lo que es similar; es decir, indica similitud. En el ejemplo anterior, *a-brāhmaṇa*, como un brahmán (similar pero no un brahmán); *an-assa*, como un caballo (= burro, mula); *amanussa*, como un humano (= espíritu, divinidad); *assamaṇo*, como un monje (similar pero no monje).","en":"In *a-brāhmaṇa*, like a brahmin. This is another use of the particle of negation when it forms a compound. This is called *pariyudāsa*, rejecting the meaning of the last member of the compound after taking up what is similar; that is, it indicates similarity. In the preceding example, *a-brāhmaṇa*, like a brahmin (similar to, but not, a brahmin); *an-assa*, like a horse (= donkey, mule); *amanussa*, like a human (= spirit, deity); *assamaṇo*, like a monk (similar to, but not, a monk)."},"L":"0452","id":"kammadharaya-l0452"},{"tipo":"p","texto":{"es":"Rūpasiddhi (§344, p. 188) lo resume en una estrofa: «Pasajjappaṭisedhassa, lakkhaṇaṃ vatthunatthitā; vatthuto aññatra vutti, pariyudāsalakkhaṇaṃ», la característica del pasajjappaṭisedha es la inexistencia de la cosa; la característica del pariyudāsa es la aplicación a algo distinto de la cosa. Niruttidīpanī (Nir. 237) precisa que el pasajjappaṭisedha niega sólo la acción (kriyāmattanisedha: akatvā, akātuṃ, akaronto) y el pariyudāsa niega la cosa (dabbanisedha: abrāhmaṇo, asamaṇo, amitto).","en":"Rūpasiddhi (§344, p. 188) sums it up in a stanza: “Pasajjappaṭisedhassa, lakkhaṇaṃ vatthunatthitā; vatthuto aññatra vutti, pariyudāsalakkhaṇaṃ”, the characteristic of pasajjappaṭisedha is the non-existence of the thing; the characteristic of pariyudāsa is the application to something other than the thing. Niruttidīpanī (Nir. 237) specifies that pasajjappaṭisedha negates only the action (kriyāmattanisedha: akatvā, akātuṃ, akaronto) and pariyudāsa negates the thing (dabbanisedha: abrāhmaṇo, asamaṇo, amitto)."},"L":"0452b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī","id":"kammadharaya-l0452b"},{"tipo":"p","texto":{"es":"Rūpasiddhi plantea la dificultad en una estrofa: «Na nisedho sato yutto, desādiniyamaṃ vinā; asato c’ āphalo tasmā, katham abrāhmaṇo ti ce?», no es apropiado negar lo que existe sin precisar el lugar, etc., y negar lo que no existe es inútil; entonces, ¿cómo [puede decirse] «abrāhmaṇo»? Y responde: «Nisedhatthānuvādena, paṭisedhavidhi kvaci; parassa micchāñāṇattā-khyāpanāyopapajjate», a veces la negación, repitiendo lo que se niega, es apropiada para hacer saber a otro que su conocimiento es erróneo (Rū. §344 (p. 187)). Como explica U Sīlānanda (clase de Rūpasiddhi n.º 43), se dice «no es un brahmán» a quien toma por brahmán a alguien que sólo lo parece; por eso concluye Rūpasiddhi: «abrāhmaṇo ti brāhmaṇasadiso ti vuttaṃ hoti», «abrāhmaṇo» quiere decir «semejante a un brahmán» (Rū., p. 188).","en":"Rūpasiddhi raises the difficulty in a stanza: “Na nisedho sato yutto, desādiniyamaṃ vinā; asato c’ āphalo tasmā, katham abrāhmaṇo ti ce?”, it is not appropriate to negate what exists without specifying the place, etc., and to negate what does not exist is useless; then how [can one say] “abrāhmaṇo”? And it answers: “Nisedhatthānuvādena, paṭisedhavidhi kvaci; parassa micchāñāṇattā-khyāpanāyopapajjate”, sometimes negation, repeating what is negated, is appropriate for making known to another that his knowledge is mistaken (Rū. §344 (p. 187)). As U Sīlānanda explains (Rūpasiddhi class no. 43), one says “he is not a brahmin” to someone who takes for a brahmin a person who only looks like one; that is why Rūpasiddhi concludes: “abrāhmaṇo ti brāhmaṇasadiso ti vuttaṃ hoti”, “abrāhmaṇo” means “resembling a brahmin” (Rū., p. 188)."},"L":"0452e","iebh":true,"fuente":"Rūpasiddhi · U Sīlānanda","id":"kammadharaya-l0452e"},{"tipo":"p","texto":{"es":"Otros ejemplos:","en":"Other examples:"},"L":"0454","id":"kammadharaya-l0454"},{"tipo":"interlineal","origen":"tabla","compuesto":"abyākatā","traduccion":{"es":"no declarados (= indeterminados)\n(otros aparte de los declarados)","en":"not declared (= indeterminate)\n(other than the declared)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"na","g":{"es":"no","en":"not"}},{"p":"byākatā","g":{"es":"declarados","en":"declared"}}],"L":"0456","hasta":"0459","id":"c-abyakata"},{"tipo":"interlineal","origen":"tabla","compuesto":"akusalā","traduccion":{"es":"no sanos\n(opuestos de los sanos)","en":"not wholesome\n(opposites of the wholesome)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"na","g":{"es":"no","en":"not"}},{"p":"kusalā","g":{"es":"sanos","en":"wholesome"}}],"L":"0464","hasta":"0467","id":"c-akusala"},{"tipo":"interlineal","origen":"tabla","compuesto":"amitto","traduccion":{"es":"no amigo\n(= enemigo)","en":"not a friend\n(= enemy)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"na","g":{"es":"no","en":"not"}},{"p":"mitto","g":{"es":"amigo","en":"friend"}}],"L":"0473","hasta":"0476","anexos":[{"es":"Amitto, D. iii 151 (PTS iii 185): «aññadatthuharo amitto mittapatirūpako veditabbo». Rūpasiddhi lo da con el sentido de opuesto (tabbiruddha: «Evaṃ alobho, amitto»); Niruttidīpanī (Nir. 237), como pariyudāsa («amitto, mittadhammavidhuro»).","en":"Amitto, D. iii 151 (PTS iii 185): “aññadatthuharo amitto mittapatirūpako veditabbo”. Rūpasiddhi gives it in the sense of the opposite (tabbiruddha: “Evaṃ alobho, amitto”); Niruttidīpanī (Nir. 237), as pariyudāsa (“amitto, mittadhammavidhuro”).","fuente":"Rūpasiddhi · Niruttidīpanī · Tipiṭaka","L":"0476b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-amitto"},{"tipo":"interlineal","origen":"tabla","compuesto":"anādāya","traduccion":{"es":"no habiendo tomado","en":"not having taken"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"na","g":{"es":"no","en":"not"}},{"p":"ādāya","g":{"es":"habiendo tomado","en":"having taken"}}],"L":"0482","hasta":"0485","anexos":[{"es":"Anādāya es ejemplo de Kacc. §334 (Rū. §345), «Sare an». Como akatvā, niega sólo la acción (kriyāmattanisedha, Nir. 237).","en":"Anādāya is an example of Kacc. §334 (Rū. §345), “Sare an”. Like akatvā, it negates only the action (kriyāmattanisedha, Nir. 237).","fuente":"Rūpasiddhi · Kaccāyana · Niruttidīpanī","L":"0485b","clase":{"es":"Referencia","en":"Reference"}}],"id":"c-anadaya"},{"tipo":"h","nivel":2,"texto":{"es":"(8) El primer miembro es 'ku' (kupubbapada)","en":"(8) The first member is ‘ku’ (kupubbapada)"},"L":"0491","id":"kammadharaya-kupubbapada"},{"tipo":"p","texto":{"es":"Cuando el segundo miembro comienza en vocal, *ku* se substituye por *kad*. *Ku* se explica como *kucchita*, malo, despreciable. También *ku* se sustituye por *kā* para significar *appaka*, poco, insuficiente. Pero también puede tener el significado de \"malo\" como en *kāpuriso*, hombre despreciable.","en":"When the second member begins with a vowel, *ku* is substituted by *kad*. *Ku* is explained as *kucchita*, bad, contemptible. *Ku* is also substituted by *kā* to signify *appaka*, little, insufficient. But it can also have the meaning of “bad”, as in *kāpuriso*, contemptible man."},"L":"0493","id":"kammadharaya-l0493"},{"tipo":"p","texto":{"es":"Son Kacc. §335 (Rū. §346), «Kad kussa», y Kacc. §336 (Rū. §347), «Kā ’ppatthesu ca»; el sentido de «malo» con «kā» lo da el plural del sutta («bahuvacanuccāraṇato kucchitatthe ca kvaci»). Según Rūpasiddhi este compuesto es siempre compuesto (nicca-samāsa) y por eso se resuelve con otra palabra: «kucchitam annan ti niccasamāsattā aññapadena viggaho» (Rū., p. 189). Ante consonante «ku» se conserva: kudārā, kuputtā, kudāsā, kudiṭṭhi son los contraejemplos de «sare» en Rū. §346.","en":"These are Kacc. §335 (Rū. §346), “Kad kussa”, and Kacc. §336 (Rū. §347), “Kā ’ppatthesu ca”; the sense of “bad” with “kā” is given by the plural of the sutta (“bahuvacanuccāraṇato kucchitatthe ca kvaci”). According to Rūpasiddhi this compound is always a compound (nicca-samāsa), and therefore it is resolved with another word: “kucchitam annan ti niccasamāsattā aññapadena viggaho” (Rū., p. 189). Before a consonant “ku” is retained: kudārā, kuputtā, kudāsā, kudiṭṭhi are the counter-examples to “sare” in Rū. §346."},"L":"0493b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"kammadharaya-l0493b"},{"tipo":"interlineal","origen":"tabla","compuesto":"kadannaṃ","traduccion":{"es":"mala comida","en":"bad food"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"kucchitaṃ","g":{"es":"mala","en":"bad"}},{"p":"annaṃ","g":{"es":"comida","en":"food"}}],"L":"0495","hasta":"0498","id":"c-kadannam"},{"tipo":"interlineal","origen":"tabla","compuesto":"kudārā","traduccion":{"es":"malas esposas","en":"bad wives"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"kucchitā","g":{"es":"malas","en":"bad"}},{"p":"dārā","g":{"es":"esposas","en":"wives"}}],"L":"0503","hasta":"0506","anexos":[{"es":"Kacc. §335, en la edición publicada, resuelve kudārā como compuesto relativo (bahubbīhi): «kucchitā dārā yesaṃ te hontī ti kudārā», los que tienen malas esposas. Saddanīti —Sad. (Smith p. 753)— admite las dos resoluciones («kucchitā dārā kudārā … atha vā kucchitā dārā yesaṃ te kudārā»); aquí se sigue la de compuesto adjetivo.","en":"Kacc. §335, in the published edition, resolves kudārā as a relative compound (bahubbīhi): “kucchitā dārā yesaṃ te hontī ti kudārā”, those who have bad wives. Saddanīti—Sad. (Smith p. 753)—admits both resolutions (“kucchitā dārā kudārā … atha vā kucchitā dārā yesaṃ te kudārā”); here the adjectival compound resolution is followed.","fuente":"Kaccāyana · Saddanīti","L":"0506b"}],"id":"c-kudara"},{"tipo":"interlineal","origen":"tabla","compuesto":"kudiṭṭhi","traduccion":{"es":"mala creencia","en":"bad belief"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"kucchitā","g":{"es":"mala","en":"bad"}},{"p":"diṭṭhi","g":{"es":"creencia","en":"belief"}}],"L":"0510","hasta":"0513","id":"c-kuditthi"},{"tipo":"interlineal","origen":"tabla","compuesto":"kālavaṇaṃ","traduccion":{"es":"poca sal","en":"little salt"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"appakaṃ","g":{"es":"poca","en":"little"}},{"p":"lavaṇaṃ","g":{"es":"sal","en":"salt"}}],"L":"0517","hasta":"0520","id":"c-kalavanam"},{"tipo":"p","texto":{"es":"Con el sentido de «malo» (Rū. §347): kucchito puriso kāpuriso, kupuriso vā, hombre despreciable (atestado: «sakkāro kāpurisena dujjaho», Thag. 247 (PTS p. 18)); y con el de «poco»: kāpupphaṃ, pocas flores (Kacc. §336).","en":"With the sense of “bad” (Rū. §347): kucchito puriso kāpuriso, kupuriso vā, contemptible man (attested: “sakkāro kāpurisena dujjaho”, Thag. 247 (PTS p. 18)); and with that of “little”: kāpupphaṃ, few flowers (Kacc. §336)."},"L":"0520b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"kammadharaya-l0520b"},{"tipo":"h","nivel":2,"texto":{"es":"(9) El primer miembro es el prefijo 'pa' y otros (pādipubbapada)","en":"(9) The first member is the prefix ‘pa’ and others (pādipubbapada)"},"L":"0525","id":"kammadharaya-padipubbapada"},{"tipo":"p","texto":{"es":"No tiene sutta propio. Según Rūpasiddhi, «Pādipubbapado ca niccasamāso ’va» (Rū., p. 189): es siempre compuesto, y la resolución se hace con otra palabra que da el sentido del prefijo (padhānaṃ, bhusaṃ, vividhā, adhiko, sobhanaṃ…). Niruttidīpanī (Nir. 239) señala el alargamiento de pāvacanaṃ («pakaṭṭhaṃ vacanaṃ pāvacanaṃ, dīghattaṃ»).","en":"It has no sutta of its own. According to Rūpasiddhi, “Pādipubbapado ca niccasamāso ’va” (Rū., p. 189): it is always a compound, and the resolution is made with another word that gives the sense of the prefix (padhānaṃ, bhusaṃ, vividhā, adhiko, sobhanaṃ…). Niruttidīpanī (Nir. 239) points out the lengthening in pāvacanaṃ (“pakaṭṭhaṃ vacanaṃ pāvacanaṃ, dīghattaṃ”)."},"L":"0525b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī","id":"kammadharaya-l0525b"},{"tipo":"interlineal","origen":"tabla","compuesto":"pāvacanaṃ","traduccion":{"es":"las Escrituras","en":"the Scriptures"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"padhānaṃ","g":{"es":"principal","en":"principal"}},{"p":"vacanaṃ","g":{"es":"palabra","en":"word"}}],"L":"0527","hasta":"0530","anexos":[{"es":"Cf. «atītasatthukaṃ pāvacanaṃ», D. ii 126 (PTS ii 154).","en":"Cf. “atītasatthukaṃ pāvacanaṃ”, D. ii 126 (PTS ii 154).","fuente":"Tipiṭaka","L":"0530a","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-pavacanam"},{"tipo":"interlineal","origen":"tabla","compuesto":"pavaddhaṃ","traduccion":{"es":"muy crecido (el cuerpo)","en":"greatly grown (the body)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"bhusaṃ","g":{"es":"mucho","en":"much"}},{"p":"vaddhaṃ","g":{"es":"crecido","en":"grown"}},{"p":"(sarīraṃ)","g":{"es":"(el cuerpo)","en":"(the body)"}}],"L":"0534","hasta":"0537","id":"c-pavaddham"},{"tipo":"interlineal","origen":"tabla","compuesto":"samādhānaṃ","traduccion":{"es":"concentración\n(el fijar por igual, o correctamente)","en":"concentration\n(the fixing evenly, or rightly)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"samaṃ (sammā vā)","g":{"es":"por igual (o correctamente)","en":"evenly (or rightly)"}},{"p":"ādhānaṃ","g":{"es":"fijar","en":"fixing"}}],"L":"0542","hasta":"0545","id":"c-samadhanam"},{"tipo":"interlineal","origen":"tabla","compuesto":"vimati","traduccion":{"es":"ideas diversas\n(= duda)","en":"various ideas\n(= doubt)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"vividhā","g":{"es":"diversas","en":"various"}},{"p":"mati","g":{"es":"ideas","en":"ideas"}}],"L":"0551","hasta":"0554","id":"c-vimati"},{"tipo":"interlineal","origen":"tabla","compuesto":"atidevo","traduccion":{"es":"super-dios","en":"super-god"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"adhiko","g":{"es":"superior","en":"superior"}},{"p":"devo","g":{"es":"dios","en":"god"}}],"L":"0559","hasta":"0562","id":"c-atidevo"},{"tipo":"interlineal","origen":"tabla","compuesto":"sukataṃ","traduccion":{"es":"bien hecho","en":"well done"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"sobhanaṃ","g":{"es":"bueno","en":"good"}},{"p":"kataṃ","g":{"es":"hecho","en":"done"}}],"L":"0567","hasta":"0570","anexos":[{"es":"Rūpasiddhi da además: vividho kappo, visiṭṭho vā kappo vikappo, disposición diversa o especial (= alternativa); adhidevo, adhisīlaṃ; sundaro gandho sugandho, buen olor; asobhanaṃ kataṃ dukkaṭaṃ, mal hecho. Sukataṃ y dukkaṭaṃ, juntos en Dh. 58 (PTS p. 45): «Akataṃ dukkaṭaṃ seyyo, pacchā tappati dukkaṭaṃ; katañ ca sukataṃ seyyo, yaṃ katvā n’ ānutappati».","en":"Rūpasiddhi also gives: vividho kappo, visiṭṭho vā kappo vikappo, diverse or special arrangement (= alternative); adhidevo, adhisīlaṃ; sundaro gandho sugandho, good smell; asobhanaṃ kataṃ dukkaṭaṃ, badly done. Sukataṃ and dukkaṭaṃ, together in Dh. 58 (PTS p. 45): “Akataṃ dukkaṭaṃ seyyo, pacchā tappati dukkaṭaṃ; katañ ca sukataṃ seyyo, yaṃ katvā n’ ānutappati”.","fuente":"Rūpasiddhi · Tipiṭaka","L":"0578b"}],"id":"c-sukatam"},{"tipo":"interlineal","origen":"tabla","compuesto":"duggandho","traduccion":{"es":"mal olor","en":"bad smell"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"kucchito","g":{"es":"mal","en":"bad"}},{"p":"gandho","g":{"es":"olor","en":"smell"}}],"L":"0575","hasta":"0578","id":"c-duggandho"},{"tipo":"p","texto":{"es":"En *apunageyyā gāthā*, verso que no ha de recitarse de nuevo, y *alavaṇabhojī*, (persona) que no come sal, la partícula de negación no está ligada en significado con el miembro siguiente sino con el último miembro del compuesto. Estos tipos de compuestos se denominan *ayuttattha-samāsa*, tipo de compuesto cuyos miembros no están ligados en significado.","en":"In *apunageyyā gāthā*, a verse that is not to be recited again, and *alavaṇabhojī*, (a person) who does not eat salt, the particle of negation is not connected in meaning with the following member but with the last member of the compound. These kinds of compounds are called *ayuttattha-samāsa*, a kind of compound whose members are not connected in meaning."},"L":"0584","id":"kammadharaya-l0584"},{"tipo":"p","texto":{"es":"Según Rūpasiddhi (p. 190), estos nombres, partículas y prefijos cuya regla no se ha dado se componen por división del sutta «nāmānaṃ samāso» (Kacc. §316, Rū. §331), porque, al no estar ligados en significado, no pueden componerse por otra regla («ayuttatthattā n’ āññena samāso»). Niruttidīpanī (Nir. 238) lo atribuye al alcance amplio de la regla («bahulādhikārā ayuttatthānam pi samāso hoti») y da también la resolución que los vuelve compuestos de significado ligado: «puna gāyitabbā ti punageyyā, na punageyyā apunageyyā».","en":"According to Rūpasiddhi (p. 190), these nouns, particles and prefixes for which no rule has been given are compounded by division of the sutta “nāmānaṃ samāso” (Kacc. §316, Rū. §331), because, not being connected in meaning, they cannot be compounded by any other rule (“ayuttatthattā n’ āññena samāso”). Niruttidīpanī (Nir. 238) attributes it to the wide scope of the rule (“bahulādhikārā ayuttatthānam pi samāso hoti”) and also gives the resolution that turns them into compounds of connected meaning: “puna gāyitabbā ti punageyyā, na punageyyā apunageyyā”."},"L":"0584b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Niruttidīpanī","id":"kammadharaya-l0584b"},{"tipo":"interlineal","origen":"tabla","compuesto":"diṭṭhapubbo","traduccion":{"es":"alguien que ha visto en el pasado\n(al Tathāgata)","en":"someone who has seen in the past\n(the Tathāgata)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"diṭṭho","g":{"es":"(alguien) que ha visto","en":"(someone) who has seen"}},{"p":"pubbaṃ","g":{"es":"en el pasado","en":"in the past"}}],"L":"0586","hasta":"0589","id":"c-ditthapubbo"},{"tipo":"interlineal","origen":"tabla","compuesto":"sutapubbo","traduccion":{"es":"alguien que ha oído en el pasado\n(al Dhamma)","en":"someone who has heard in the past\n(the Dhamma)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"suto","g":{"es":"(alguien) que ha oído","en":"(someone) who has heard"}},{"p":"pubbaṃ","g":{"es":"en el pasado","en":"in the past"}}],"L":"0591","hasta":"0594","id":"c-sutapubbo"},{"tipo":"interlineal","origen":"tabla","compuesto":"gatapubbo","traduccion":{"es":"alguien que ha ido en el pasado\n(por el camino)","en":"someone who has gone in the past\n(along the road)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"gato","g":{"es":"(alguien) que ha ido","en":"(someone) who has gone"}},{"p":"pubbaṃ","g":{"es":"en el pasado","en":"in the past"}}],"L":"0596","hasta":"0599","id":"c-gatapubbo"},{"tipo":"p","texto":{"es":"En los ejemplos anteriores, *diṭṭha*, *suta* y *gata*, tienen significado activo. En los siguientes ejemplos, el significado es pasivo.","en":"In the preceding examples, *diṭṭha*, *suta* and *gata* have an active meaning. In the following examples, the meaning is passive."},"L":"0601","id":"kammadharaya-l0601"},{"tipo":"interlineal","origen":"tabla","compuesto":"diṭṭhapubbā","traduccion":{"es":"(divinidades) vistas en el pasado","en":"(deities) seen in the past"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"diṭṭhā","g":{"es":"vistas","en":"seen"}},{"p":"pubbaṃ","g":{"es":"en el pasado","en":"in the past"}}],"L":"0602","hasta":"0605","id":"c-ditthapubba"},{"tipo":"interlineal","origen":"tabla","compuesto":"sutapubbā","traduccion":{"es":"(Dhammas) oídos en el pasado","en":"(Dhammas) heard in the past"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"sutā","g":{"es":"oídos","en":"heard"}},{"p":"pubbaṃ","g":{"es":"en el pasado","en":"in the past"}}],"L":"0609","hasta":"0612","id":"c-sutapubba"},{"tipo":"interlineal","origen":"tabla","compuesto":"gatapubbā","traduccion":{"es":"(direcciones) recorridas en el pasado","en":"(directions) traversed in the past"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"gatā","g":{"es":"recorridas","en":"traversed"}},{"p":"pubbaṃ","g":{"es":"en el pasado","en":"in the past"}}],"L":"0618","hasta":"0621","id":"c-gatapubba"},{"tipo":"p","texto":{"es":"Rūpasiddhi (p. 190) da a continuación estos compuestos, y también pahāro, parābhavo, vihāro, āhāro, upahāro. Saddanīti —Sad. (Smith p. 753)—, que los recoge de sus maestros (garū), observa que en diṭṭhapubbo y los demás no se ve la misma referencia de los dos miembros (tulyādhikaraṇa) y que queda por buscar la razón por la que son compuestos adjetivos.","en":"Rūpasiddhi (p. 190) then gives these compounds, and also pahāro, parābhavo, vihāro, āhāro, upahāro. Saddanīti—Sad. (Smith p. 753)—, which takes them from its teachers (garū), observes that in diṭṭhapubbo and the others the two members are not seen to refer to the same thing (tulyādhikaraṇa), and that the reason why they are adjectival compounds remains to be sought."},"L":"0621b","iebh":true,"fuente":"Rūpasiddhi · Saddanīti","id":"kammadharaya-l0621b"}],"ref":"Kacc. §324; Rū. §339"},{"id":"digu","n":3,"pali":"digu","titulo":{"es":"Compuesto numérico (digu-samāsa)","en":"Numerical compound (digu-samāsa)"},"kacc":[325],"L":"0626","bloques":[{"tipo":"p","texto":{"es":"Este tipo de compuesto tiene un numeral como primer miembro y puede ser incluido dentro de la categoría de compuestos adjetivos porque ambos miembros están en la misma inflexión.","en":"This kind of compound has a numeral as its first member and can be included within the category of adjectival compounds because both members are in the same inflection."},"L":"0628","id":"digu-l0628"},{"tipo":"p","texto":{"es":"Kacc. §325 (Rū. §348) «Saṅkhyāpubbo digu»: «Saṅkhyāpubbo kammadhārayasamāso digusañño hoti» —el compuesto adjetivo (kammadhāraya, Kacc. §324; Rū. §339) que tiene un numeral como primer miembro recibe el nombre «digu»—. Por Kacc. §326 (Rū. §341) «Ubhe tappurisā», el digu y el kammadhāraya reciben además el nombre «tappurisa».","en":"Kacc. §325 (Rū. §348) “Saṅkhyāpubbo digu”: “Saṅkhyāpubbo kammadhārayasamāso digusañño hoti”—the adjectival compound (kammadhāraya, Kacc. §324; Rū. §339) that has a numeral as its first member receives the name “digu”. By Kacc. §326 (Rū. §341) “Ubhe tappurisā”, the digu and the kammadhāraya also receive the name “tappurisa”."},"L":"0628b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"digu-l0628b"},{"tipo":"p","texto":{"es":"Hay dos clases: (1) colectivo (samāhāra-digu) y (2) no colectivo (asamāhāra-digu).","en":"There are two kinds: (1) collective (samāhāra-digu) and (2) non-collective (asamāhāra-digu)."},"L":"0630","id":"digu-l0630"},{"tipo":"p","texto":{"es":"Sobre el nombre «digu» Rūpasiddhi da dos explicaciones. (1) «Dve gāvo digu»: «digu» es el compuesto «dos vacas», y este compuesto se llama así por su semejanza con esa palabra (digusadisattā). Saddanīti precisa la semejanza: la palabra «digu» tiene un numeral delante y es neutra y singular, y lo mismo ocurre, por lo general (yebhuyyena), con este compuesto. (2) Se lo conoce (gato, avagato) por dos rasgos (dvīhi lakkhaṇehi): tener un numeral como primer miembro y ser neutro y singular; o bien «procede por dos rasgos» (dvīhi lakkhaṇehi gacchati pavattati). Niruttidīpanī añade que en «digu» la o de «go» pasa a u.","en":"On the name “digu” Rūpasiddhi gives two explanations. (1) “Dve gāvo digu”: “digu” is the compound “two cows”, and this compound is so called because of its resemblance to that word (digusadisattā). Saddanīti specifies the resemblance: the word “digu” has a numeral in front and is neuter and singular, and the same holds, as a rule (yebhuyyena), for this compound. (2) It is known (gato, avagato) by two features (dvīhi lakkhaṇehi): having a numeral as its first member and being neuter and singular; or else “it proceeds by two features” (dvīhi lakkhaṇehi gacchati pavattati). Niruttidīpanī adds that in “digu” the o of “go” becomes u."},"L":"0630b","iebh":true,"fuente":"Rūpasiddhi · Saddanīti · Niruttidīpanī","id":"digu-l0630b"},{"tipo":"h","nivel":2,"texto":{"es":"(1) Colectivo (samāhāra-digu)","en":"(1) Collective (samāhāra-digu)"},"L":"0632","id":"digu-samahara-digu"},{"tipo":"p","texto":{"es":"Compuesto numérico colectivo. Este tipo de compuesto expresa la totalidad y tiene terminación singular neutra. Ej., *tayo + lokā* = *tilokaṃ*, los tres mundos (planos) colectivamente.","en":"Collective numerical compound. This kind of compound expresses totality and has a neuter singular ending. E.g., *tayo + lokā* = *tilokaṃ*, the three worlds (planes) collectively."},"L":"0634","id":"digu-l0634"},{"tipo":"interlineal","origen":"tabla","compuesto":"tilokaṃ","traduccion":{"es":"tres mundos","en":"three worlds"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"tayo","g":{"es":"tres","en":"three"}},{"p":"lokā","g":{"es":"mundos","en":"worlds"}},{"p":"samāhaṭā","g":{"es":"agrupados","en":"grouped"}}],"L":"0636","hasta":"0639","id":"c-tilokam"},{"tipo":"p","texto":{"es":"Kacc. §321 (Rū. §349) «Diguss’ ekattaṃ»: «Digussa samāsassa ekattaṃ hoti, napuṃsakaliṅgattañ ca» —el digu está en singular y en género neutro—. Rūpasiddhi resuelve el compuesto de dos maneras: «tayo lokā samāhaṭā cittena sampiṇḍitā» (los tres mundos reunidos, agrupados por la mente) o «tiṇṇaṃ lokānaṃ samāhāro» (la reunión de los tres mundos). Y precisa que la regla vale para el colectivo: «Samāhāradiguss’ etaṃ gahaṇaṃ».","en":"Kacc. §321 (Rū. §349) “Diguss’ ekattaṃ”: “Digussa samāsassa ekattaṃ hoti, napuṃsakaliṅgattañ ca”—the digu is in the singular and in the neuter gender. Rūpasiddhi resolves the compound in two ways: “tayo lokā samāhaṭā cittena sampiṇḍitā” (the three worlds gathered together, grouped by the mind) or “tiṇṇaṃ lokānaṃ samāhāro” (the gathering of the three worlds). And it specifies that the rule applies to the collective: “Samāhāradiguss’ etaṃ gahaṇaṃ”."},"L":"0639b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"digu-l0639b"},{"tipo":"p","texto":{"es":"En las dos resoluciones de Rūpasiddhi (Rū. §348 (p. 190); Kacc. §325), es la palabra «samāhaṭā» o «samāhāro» la que distingue en la resolución el colectivo del no colectivo: sin ella, Rūpasiddhi resuelve igual «catasso disā catuddisaṃ», colectivo, y «catasso disā catuddisā», no colectivo (Rū., p. 191), y sólo el número y el género del compuesto muestran la clase.","en":"In Rūpasiddhi’s two resolutions (Rū. §348 (p. 190); Kacc. §325), it is the word “samāhaṭā” or “samāhāro” that distinguishes the collective from the non-collective in the resolution: without it, Rūpasiddhi resolves in the same way “catasso disā catuddisaṃ”, collective, and “catasso disā catuddisā”, non-collective (Rū., p. 191), and only the number and gender of the compound show the kind."},"L":"0639e","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"digu-l0639e"},{"tipo":"p","texto":{"es":"Paradigma de declinación aplicable a todos los compuestos colectivos.","en":"Declension paradigm applicable to all collective compounds."},"L":"0644","id":"digu-l0644"},{"tipo":"p","texto":{"es":"Es el paradigma que da Rūpasiddhi (§349): «Tilokaṃ, he tiloka, tilokaṃ, tilokena, tilokassa, tilokā tilokasmā tilokamhā, tilokassa, tiloke tilokamhi tilokasmiṃ». Sólo hay singular, porque en el colectivo «sabbatth’ ekavacanam eva hoti» (Rū. §349); Niruttidīpanī lo resume así: «Imasmiṃ samāhāradigumhi sabbaṃ napuṃsakam eva rassantam eva ekavacanantam eva». Los ejemplos que siguen, todos con final -a, se declinan igual.","en":"This is the paradigm Rūpasiddhi gives (§349): “Tilokaṃ, he tiloka, tilokaṃ, tilokena, tilokassa, tilokā tilokasmā tilokamhā, tilokassa, tiloke tilokamhi tilokasmiṃ”. There is only the singular, because in the collective “sabbatth’ ekavacanam eva hoti” (Rū. §349); Niruttidīpanī sums it up thus: “Imasmiṃ samāhāradigumhi sabbaṃ napuṃsakam eva rassantam eva ekavacanantam eva”. The examples that follow, all ending in -a, are declined in the same way."},"L":"0644b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī","id":"digu-l0644b"},{"tipo":"paradigma","cabecera":[{"es":"infl.","en":"infl."},{"es":"singular","en":"singular"}],"filas":[[{"es":"primera","en":"first"},"tilokaṃ"],[{"es":"vocativo","en":"vocative"},"tiloka"],[{"es":"segunda","en":"second"},"tilokaṃ"],[{"es":"tercera","en":"third"},"tilokena"],[{"es":"cuarta","en":"fourth"},"tilokassa"],[{"es":"quinta","en":"fifth"},"tilokā, tilokasmā, tilokamhā"],[{"es":"sexta","en":"sixth"},"tilokassa"],[{"es":"séptima","en":"seventh"},"tiloke, tilokamhi, tilokasmiṃ"]],"L":"0646","hasta":"0656","id":"digu-l0646"},{"tipo":"interlineal","origen":"tabla","compuesto":"timalaṃ","traduccion":{"es":"tres impurezas","en":"three impurities"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"tīṇi","g":{"es":"tres","en":"three"}},{"p":"malāni","g":{"es":"impurezas","en":"impurities"}},{"p":"samāhaṭāni","g":{"es":"agrupadas","en":"grouped"}}],"L":"0657","hasta":"0660","anexos":[{"es":"Rūpasiddhi da también «tiṇṇaṃ malānaṃ samāhāro» (§349). La única aparición de timalaṃ en el canon, «Ekamūlaṃ dvirāvaṭṭaṃ, timalaṃ pañcapattharaṃ» (S. i 30 (PTS i 32)), no es este compuesto numérico sino un bahubbīhi que califica a la taṇhā: «Sā ca rāgādīhi tīhi malehi timalā» (SA. i 79 (PTS i 84)).","en":"Rūpasiddhi also gives “tiṇṇaṃ malānaṃ samāhāro” (§349). The only occurrence of timalaṃ in the canon, “Ekamūlaṃ dvirāvaṭṭaṃ, timalaṃ pañcapattharaṃ” (S. i 30 (PTS i 32)), is not this numerical compound but a bahubbīhi qualifying taṇhā: “Sā ca rāgādīhi tīhi malehi timalā” (SA. i 79 (PTS i 84)).","fuente":"Rūpasiddhi · Tipiṭaka · Aṭṭhakathā","L":"0660b"}],"id":"c-timalam"},{"tipo":"interlineal","origen":"tabla","compuesto":"catussaccaṃ","traduccion":{"es":"cuatro verdades","en":"four truths"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"cattāri","g":{"es":"cuatro","en":"four"}},{"p":"saccāni","g":{"es":"verdades","en":"truths"}},{"p":"samāhaṭāni","g":{"es":"agrupadas","en":"grouped"}}],"L":"0665","hasta":"0668","anexos":[{"es":"Saddanīti da esta misma resolución («cattāri saccāni samāhaṭāni catusaccaṃ», Sad. (Smith p. 754)), con una sola s, como Niruttidīpanī y Payogasiddhi; Rūpasiddhi escribe catussaccaṃ. En el canon predomina catusaccaṃ: «Catusaccaṃ pakāsento, varadhammappavattako» (Ap. i 121 (PTS i 109)); con doble s sólo se lee una vez: «Tajjito brahmadaṇḍena, catussaccaṃ apāpuṇi» (V. iv 490 (PTS Vin ii 293)).","en":"Saddanīti gives this same resolution (“cattāri saccāni samāhaṭāni catusaccaṃ”, Sad. (Smith p. 754)), with a single s, as do Niruttidīpanī and Payogasiddhi; Rūpasiddhi writes catussaccaṃ. In the canon catusaccaṃ predominates: “Catusaccaṃ pakāsento, varadhammappavattako” (Ap. i 121 (PTS i 109)); with double s it is found only once: “Tajjito brahmadaṇḍena, catussaccaṃ apāpuṇi” (V. iv 490 (PTS Vin ii 293)).","fuente":"Rūpasiddhi · Saddanīti · Niruttidīpanī · Payogasiddhi · Tipiṭaka","L":"0668b"}],"id":"c-catussaccam"},{"tipo":"interlineal","origen":"tabla","compuesto":"dvirattaṃ","traduccion":{"es":"dos noches","en":"two nights"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"dve","g":{"es":"dos","en":"two"}},{"p":"rattiyo","g":{"es":"noches","en":"nights"}}],"L":"0672","hasta":"0675","anexos":[{"es":"Formación (Rū. §350): dve rattiyo → dvi + ratti (kammadhāraya, Kacc. §324; Rū. §339; elisión de las inflexiones, Kacc. §317; Rū. §332; forma original, Kacc. §318; Rū. §333) → digu (Kacc. §325; Rū. §348), singular y neutro (Kacc. §321; Rū. §349) → dviratta (Kacc. §337; Rū. §350) → dviratta + si → dviratta + aṃ («Si ’ṃ», Kacc. §219; Rū. §195) → dvirattaṃ (se elide la a anterior, «Saralopo…», Kacc. §83; Rū. §67). Kacc. §337 dice «kvaci» (a veces), y Rūpasiddhi lo lee de dos maneras, y las dos dan dviratta: (1) la vocal final pasa a «a», que es lo que dice la vutti de Kaccāyana: dviratti → dviratta; (2) «a» es un sufijo (a ca ko ca akā), y entonces se elide la vocal anterior por «Saralopo…» (Kacc. §83; Rū. §67): dviratti + a → dviratt + a = dviratta. Esta segunda es la que Rūpasiddhi detalla para dvirattaṃ. Lo mismo vale para tisso rattiyo tirattaṃ, dve aṅguliyo dvaṅgulaṃ y satta godāvariyo sattagodāvaraṃ: según Rūpasiddhi, Kacc. §337 se aplica aquí al final de ratti, aṅguli y godāvarī. Payogasiddhi da para estas voces reglas propias tras numeral.","en":"Formation (Rū. §350): dve rattiyo → dvi + ratti (kammadhāraya, Kacc. §324; Rū. §339; elision of the inflections, Kacc. §317; Rū. §332; original form, Kacc. §318; Rū. §333) → digu (Kacc. §325; Rū. §348), singular and neuter (Kacc. §321; Rū. §349) → dviratta (Kacc. §337; Rū. §350) → dviratta + si → dviratta + aṃ (“Si ’ṃ”, Kacc. §219; Rū. §195) → dvirattaṃ (the preceding a is elided, “Saralopo…”, Kacc. §83; Rū. §67). Kacc. §337 says “kvaci” (sometimes), and Rūpasiddhi reads it in two ways, both of which give dviratta: (1) the final vowel becomes “a”, which is what Kaccāyana’s vutti says: dviratti → dviratta; (2) “a” is a suffix (a ca ko ca akā), and then the preceding vowel is elided by “Saralopo…” (Kacc. §83; Rū. §67): dviratti + a → dviratt + a = dviratta. This second reading is the one Rūpasiddhi details for dvirattaṃ. The same holds for tisso rattiyo tirattaṃ, dve aṅguliyo dvaṅgulaṃ and satta godāvariyo sattagodāvaraṃ: according to Rūpasiddhi, Kacc. §337 applies here to the end of ratti, aṅguli and godāvarī. Payogasiddhi gives rules of its own for these words after a numeral.","fuente":"Rūpasiddhi · Kaccāyana · Payogasiddhi","L":"0675b"},{"es":"El canon lo escribe con di-, dentro del compuesto copulativo «dirattatirattaṃ»: «anujānāmi, bhikkhave, anupasampannena dirattatirattaṃ sahaseyyaṃ kappetuṃ» (V. ii 27 (PTS Vin iv 16)). Kaccāyana da esa forma: por el «ca» de Kacc. §386 «Tiye du-tāpi ca» (Rū. §410), dvi pasa a di («Caggahaṇena dvi icc etassa dikāro hoti. Dirattaṃ, diguṇaṃ…»); y por el «tu» de Kacc. §380 (Rū. §255), dvi pasa a du, di o do (durattaṃ, dirattaṃ).","en":"The canon writes it with di-, within the copulative compound “dirattatirattaṃ”: “anujānāmi, bhikkhave, anupasampannena dirattatirattaṃ sahaseyyaṃ kappetuṃ” (V. ii 27 (PTS Vin iv 16)). Kaccāyana provides that form: by the “ca” of Kacc. §386 “Tiye du-tāpi ca” (Rū. §410), dvi becomes di (“Caggahaṇena dvi icc etassa dikāro hoti. Dirattaṃ, diguṇaṃ…”); and by the “tu” of Kacc. §380 (Rū. §255), dvi becomes du, di or do (durattaṃ, dirattaṃ).","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"0675e"}],"id":"c-dvirattam"},{"tipo":"interlineal","origen":"tabla","compuesto":"sattāhaṃ","traduccion":{"es":"siete días","en":"seven days"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"satta","g":{"es":"siete","en":"seven"}},{"p":"ahāni","g":{"es":"días","en":"days"}}],"L":"0679","hasta":"0682","anexos":[{"es":"Kacc. §337 lo da entre los ejemplos de la «a» final («pañca ahāni pañcāhaṃ, sattāhaṃ»). En el canon: «bhagavā bodhirukkhamūle sattāhaṃ ekapallaṅkena nisīdi» (V. iii 1 (PTS Vin i 1)); «bhagavā sattāhaṃ ekapallaṅkena nisinno hoti» (Ud. 77 (PTS p. 1)).","en":"Kacc. §337 gives it among the examples of the final “a” (“pañca ahāni pañcāhaṃ, sattāhaṃ”). In the canon: “bhagavā bodhirukkhamūle sattāhaṃ ekapallaṅkena nisīdi” (V. iii 1 (PTS Vin i 1)); “bhagavā sattāhaṃ ekapallaṅkena nisinno hoti” (Ud. 77 (PTS p. 1)).","fuente":"Kaccāyana · Tipiṭaka","L":"0682b"}],"id":"c-sattaham"},{"tipo":"interlineal","origen":"tabla","compuesto":"aṭṭhasīlaṃ","traduccion":{"es":"ocho preceptos","en":"eight precepts"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"aṭṭha","g":{"es":"ocho","en":"eight"}},{"p":"sīlāni","g":{"es":"preceptos","en":"precepts"}}],"L":"0687","hasta":"0690","id":"c-atthasilam"},{"tipo":"interlineal","origen":"tabla","compuesto":"satayojanaṃ","traduccion":{"es":"cien yojanas","en":"one hundred yojanas"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"sataṃ","g":{"es":"cien","en":"one hundred"}},{"p":"yojanāni","g":{"es":"yojanas","en":"yojanas"}}],"L":"0694","hasta":"0697","id":"c-satayojanam"},{"tipo":"p","texto":{"es":"Rūpasiddhi (§349) da además: tayo daṇḍā tidaṇḍaṃ (tres bastones), tilakkhaṇaṃ (tres características), catasso disā catuddisaṃ (cuatro direcciones), pañcasikkhāpadaṃ (cinco reglas de entrenamiento), saḷāyatanaṃ (seis āyatana), navalokuttaraṃ (nueve [dhammas] supramundanos), dasasīlaṃ (diez preceptos), y, con la «a» de Kacc. §337, tirattaṃ, dvaṅgulaṃ, sattagodāvaraṃ y pañcagavaṃ. En catuddisaṃ, la ā de disā se acorta por Kacc. §342 (Rū. §337) «Saro rasso napuṃsake»: Kaccāyana la enuncia para el abyayībhāva, pero Rūpasiddhi advierte que ahí no ha de arrastrarse «abyayībhāva», de modo que el acortamiento vale también en el digu, el dvanda y el bahubbīhi neutros. Catuddisaṃ se lee en el canon: «cattāro naṃ devaputtā catuddisaṃ rakkhāya upagacchanti» (D. ii 11 (PTS ii 12)).","en":"Rūpasiddhi (§349) also gives: tayo daṇḍā tidaṇḍaṃ (three sticks), tilakkhaṇaṃ (three characteristics), catasso disā catuddisaṃ (four directions), pañcasikkhāpadaṃ (five training rules), saḷāyatanaṃ (six āyatana), navalokuttaraṃ (nine supramundane [dhammas]), dasasīlaṃ (ten precepts), and, with the “a” of Kacc. §337, tirattaṃ, dvaṅgulaṃ, sattagodāvaraṃ and pañcagavaṃ. In catuddisaṃ, the ā of disā is shortened by Kacc. §342 (Rū. §337) “Saro rasso napuṃsake”: Kaccāyana states it for the abyayībhāva, but Rūpasiddhi warns that “abyayībhāva” is not to be carried over into it, so that the shortening also holds in the neuter digu, dvanda and bahubbīhi. Catuddisaṃ is found in the canon: “cattāro naṃ devaputtā catuddisaṃ rakkhāya upagacchanti” (D. ii 11 (PTS ii 12))."},"L":"0697b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"digu-l0697b"},{"tipo":"h","nivel":2,"texto":{"es":"(2) No-colectivo (asamāhāra-digu)","en":"(2) Non-collective (asamāhāra-digu)"},"L":"0702","id":"digu-asamahara-digu"},{"tipo":"p","texto":{"es":"Compuesto numérico no-colectivo. Este tipo de compue
