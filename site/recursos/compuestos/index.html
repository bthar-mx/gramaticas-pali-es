,"en":"heap of grain"},"viggaha":[{"p":"dhaññānaṃ","g":{"es":"de granos","en":"of grains"}},{"p":"rāsi","g":{"es":"montón","en":"heap"}}],"L":"0923","texto":{"es":"dhaññarāsi (montón de granos): dhaññānaṃ (de granos) rāsi (montón)","en":"dhaññarāsi (heap of grain): dhaññānaṃ (of grains) rāsi (heap)"},"id":"c-dhannarasi"},{"tipo":"interlineal","origen":"linea","compuesto":"pupphagandho","traduccion":{"es":"fragancia de flores","en":"fragrance of flowers"},"viggaha":[{"p":"pupphānaṃ","g":{"es":"de flores","en":"of flowers"}},{"p":"gandho","g":{"es":"fragancia","en":"fragrance"}}],"L":"0924","texto":{"es":"pupphagandho (fragancia de flores): pupphānaṃ (de flores) gandho (fragancia)","en":"pupphagandho (fragrance of flowers): pupphānaṃ (of flowers) gandho (fragrance)"},"id":"c-pupphagandho"},{"tipo":"interlineal","origen":"linea","compuesto":"maraṇassati","traduccion":{"es":"atención de la muerte","en":"mindfulness of death"},"viggaha":[{"p":"maraṇassa","g":{"es":"de la muerte","en":"of death"}},{"p":"sati","g":{"es":"atención plena","en":"mindfulness"}}],"L":"0925","texto":{"es":"maraṇassati (atención de la muerte): maraṇassa (de la muerte) sati (atención plena)","en":"maraṇassati (mindfulness of death): maraṇassa (of death) sati (mindfulness)"},"id":"c-maranassati"},{"tipo":"interlineal","origen":"linea","compuesto":"rukkhamūlaṃ","traduccion":{"es":"al pie del árbol","en":"at the foot of the tree"},"viggaha":[{"p":"rukkhassa","g":{"es":"del árbol","en":"of the tree"}},{"p":"mūlaṃ","g":{"es":"pie, raíz","en":"foot, root"}}],"L":"0926","texto":{"es":"rukkhamūlaṃ (al pie del árbol): rukkhassa (del árbol) mūlaṃ (pie, raíz)","en":"rukkhamūlaṃ (at the foot of the tree): rukkhassa (of the tree) mūlaṃ (foot, root)"},"id":"c-rukkhamulam"},{"tipo":"interlineal","origen":"linea","compuesto":"ayopatto","traduccion":{"es":"cuenco de hierro","en":"bowl of iron"},"viggaha":[{"p":"ayassa","g":{"es":"de hierro","en":"of iron"}},{"p":"patto","g":{"es":"cuenco","en":"bowl"}}],"L":"0927","texto":{"es":"ayopatto (cuenco de hierro): ayassa (de hierro) patto (cuenco)","en":"ayopatto (bowl of iron): ayassa (of iron) patto (bowl)"},"id":"c-ayopatto"},{"tipo":"interlineal","origen":"linea","compuesto":"ācariyapūjako","traduccion":{"es":"uno que reverencia a su maestro","en":"one who reveres his teacher"},"viggaha":[{"p":"ācariyassa","g":{"es":"al maestro","en":"the teacher"}},{"p":"pūjako","g":{"es":"uno que reverencia","en":"one who reveres"}}],"L":"0928","texto":{"es":"ācariyapūjako (uno que reverencia a su maestro): ācariyassa (al maestro) pūjako (uno que reverencia)","en":"ācariyapūjako (one who reveres his teacher): ācariyassa (the teacher) pūjako (one who reveres)"},"id":"c-acariyapujako"},{"tipo":"interlineal","origen":"linea","compuesto":"devarājo","traduccion":{"es":"rey de las divinidades","en":"king of the devas"},"viggaha":[{"p":"devānaṃ","g":{"es":"de las divinidades","en":"of the devas"}},{"p":"rājā","g":{"es":"rey","en":"king"}}],"L":"0929","texto":{"es":"devarājo (rey de las divinidades): devānaṃ (de las divinidades) rājā (rey)","en":"devarājo (king of the devas): devānaṃ (of the devas) rājā (king)"},"anexos":[{"es":"En el compuesto, «rājan» puede tomar ‘a’ final por «Kvaci samāsantagatānam akāranto» (Kacc. §337; Rū. §350), y entonces se declina como «purisa»: devarājo, devarājaṃ, devarāje. Si no la toma, se declina como «rājā»: so devarājā, te devarājāno. Lo mismo ocurre con devānaṃ sakhā: devasakho o devasakhā (Rū., p. 196).","en":"In the compound, “rājan” may take a final ‘a’ by “Kvaci samāsantagatānam akāranto” (Kacc. §337; Rū. §350), and it is then declined like “purisa”: devarājo, devarājaṃ, devarāje. If it does not take it, it is declined like “rājā”: so devarājā, te devarājāno. The same happens with devānaṃ sakhā: devasakho or devasakhā (Rū., p. 196).","fuente":"Rūpasiddhi · Kaccāyana","L":"0929b"}],"id":"c-devarajo"},{"tipo":"interlineal","origen":"linea","compuesto":"pulliṅgaṃ","traduccion":{"es":"género masculino","en":"masculine gender"},"viggaha":[{"p":"pumassa","g":{"es":"del varón","en":"of the male"}},{"p":"liṅgaṃ","g":{"es":"el género","en":"the gender"}}],"L":"0930","texto":{"es":"pulliṅgaṃ (género masculino): pumassa (del varón) liṅgaṃ (el género)","en":"pulliṅgaṃ (masculine gender): pumassa (of the male) liṅgaṃ (the gender)"},"id":"c-pullingam"},{"tipo":"interlineal","origen":"linea","compuesto":"itthirūpaṃ","traduccion":{"es":"forma de mujer","en":"form of a woman"},"viggaha":[{"p":"itthiyā","g":{"es":"de mujer","en":"of a woman"}},{"p":"rūpaṃ","g":{"es":"forma","en":"form"}}],"L":"0931","texto":{"es":"itthirūpaṃ (forma de mujer): itthiyā (de mujer) rūpaṃ (forma)","en":"itthirūpaṃ (form of a woman): itthiyā (of a woman) rūpaṃ (form)"},"id":"c-itthirupam"},{"tipo":"interlineal","origen":"linea","compuesto":"bhikkhunisaṃgho","traduccion":{"es":"la Orden de bhikkhunis","en":"the Order of bhikkhunis"},"viggaha":[{"p":"bhikkhunīnaṃ","g":{"es":"de bhikkhunis","en":"of bhikkhunis"}},{"p":"saṃgho","g":{"es":"Orden","en":"Order"}}],"L":"0932","texto":{"es":"bhikkhunisaṃgho (la Orden de bhikkhunis): bhikkhunīnaṃ (de bhikkhunis) saṃgho (Orden)","en":"bhikkhunisaṃgho (the Order of bhikkhunis): bhikkhunīnaṃ (of bhikkhunis) saṃgho (Order)"},"id":"c-bhikkhunisamgho"},{"tipo":"interlineal","origen":"linea","compuesto":"jambusākhā","traduccion":{"es":"rama de pomarrosa","en":"branch of the rose apple"},"viggaha":[{"p":"jambuyā","g":{"es":"de pomarrosa","en":"of the rose apple"}},{"p":"sākhā","g":{"es":"rama","en":"branch"}}],"L":"0933","texto":{"es":"jambusākhā (rama de pomarrosa): jambuyā (de pomarrosa) sākhā (rama)","en":"jambusākhā (branch of the rose apple): jambuyā (of the rose apple) sākhā (branch)"},"id":"c-jambusakha"},{"tipo":"p","texto":{"es":"El compuesto exige que los significados estén conectados (yuttattha). En «bhaṭo rañño, putto devadattassa» (el soldado del rey, el hijo de Devadatta) no se forma «rājaputto», porque «rañño» se relaciona con «bhaṭo» y no con «putto». En «kosalassa rañño putto» (el hijo del rey de Kosala) tampoco se forma, porque «rañño» necesita otra palabra (sāpekkha). Pero con los nombres de relación (sambandhī-sadda) sí hay compuesto, porque el sentido se entiende: devadattassa gurukulaṃ (la casa del maestro de Devadatta), bhagavato sāvakasaṅgho (la comunidad de discípulos del Bhagavā) (Kacc. §316; Rū. §351 (p. 197)).","en":"A compound requires the meanings to be connected (yuttattha). In “bhaṭo rañño, putto devadattassa” (the soldier of the king, the son of Devadatta) “rājaputto” is not formed, because “rañño” is related to “bhaṭo” and not to “putto”. In “kosalassa rañño putto” (the son of the king of Kosala) it is not formed either, because “rañño” needs another word (sāpekkha). But with relational nouns (sambandhī-sadda) there is a compound, because the sense is understood: devadattassa gurukulaṃ (the house of Devadatta’s teacher), bhagavato sāvakasaṅgho (the community of disciples of the Bhagavā) (Kacc. §316; Rū. §351 (p. 197))."},"L":"0933b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"tappurisa-l0933b"},{"tipo":"h","nivel":2,"texto":{"es":"(6) En la séptima inflexión (sattamī-tappurisa)","en":"(6) In the seventh inflection (sattamī-tappurisa)"},"L":"0935","id":"tappurisa-sattami-tappurisa"},{"tipo":"p","texto":{"es":"El primer miembro está en la séptima inflexión. (Rū. §351 (pp. 197–198))","en":"The first member is in the seventh inflection. (Rū. §351 (pp. 197–198))"},"L":"0937","id":"tappurisa-l0937"},{"tipo":"interlineal","origen":"linea","compuesto":"saṃsāradukkhaṃ","traduccion":{"es":"sufrimiento en el ciclo de renacimientos","en":"suffering in the round of rebirths"},"viggaha":[{"p":"saṃsāre","g":{"es":"en el ciclo de renacimientos","en":"in the round of rebirths"}},{"p":"dukkhaṃ","g":{"es":"sufrimiento","en":"suffering"}}],"L":"0939","texto":{"es":"saṃsāradukkhaṃ (sufrimiento en el ciclo de renacimientos): saṃsāre (en el ciclo de renacimientos) dukkhaṃ (sufrimiento)","en":"saṃsāradukkhaṃ (suffering in the round of rebirths): saṃsāre (in the round of rebirths) dukkhaṃ (suffering)"},"id":"c-samsaradukkham"},{"tipo":"interlineal","origen":"linea","compuesto":"cakkhuviññāṇaṃ","traduccion":{"es":"conciencia del ojo","en":"consciousness of the eye"},"viggaha":[{"p":"cakkhumhi","g":{"es":"en el ojo","en":"in the eye"}},{"p":"sannissitaṃ","g":{"es":"basada","en":"based"}},{"p":"viññāṇaṃ","g":{"es":"conciencia","en":"consciousness"}}],"L":"0940","texto":{"es":"cakkhuviññāṇaṃ (conciencia del ojo): cakkhumhi (en el ojo) sannissitaṃ (basada) viññāṇaṃ (conciencia)","en":"cakkhuviññāṇaṃ (consciousness of the eye): cakkhumhi (in the eye) sannissitaṃ (based) viññāṇaṃ (consciousness)"},"anexos":[{"es":"«cakkhuviññāṇaṃ» en el Abhidhamma: «vipākaṃ cakkhuviññāṇaṃ uppannaṃ hoti upekkhāsahagataṃ rūpārammaṇaṃ» (Dhs. 104 (PTS p. 87)). Como en «assaratho», hay una palabra intermedia elidida (sannissitaṃ).","en":"“cakkhuviññāṇaṃ” in the Abhidhamma: “vipākaṃ cakkhuviññāṇaṃ uppannaṃ hoti upekkhāsahagataṃ rūpārammaṇaṃ” (Dhs. 104 (PTS p. 87)). As in “assaratho”, there is an elided intermediate word (sannissitaṃ).","fuente":"Tipiṭaka","L":"0940b"}],"id":"c-cakkhuvinnanam"},{"tipo":"interlineal","origen":"linea","compuesto":"araññavāso","traduccion":{"es":"residencia en el bosque","en":"dwelling in the forest"},"viggaha":[{"p":"araññe","g":{"es":"en el bosque","en":"in the forest"}},{"p":"vāso","g":{"es":"residencia","en":"dwelling"}}],"L":"0941","texto":{"es":"araññavāso (residencia en el bosque): araññe (en el bosque) vāso (residencia)","en":"araññavāso (dwelling in the forest): araññe (in the forest) vāso (dwelling)"},"id":"c-arannavaso"},{"tipo":"interlineal","origen":"linea","compuesto":"samuddamaccho","traduccion":{"es":"pez en el mar","en":"fish in the sea"},"viggaha":[{"p":"samudde","g":{"es":"en el mar","en":"in the sea"}},{"p":"maccho","g":{"es":"pez","en":"fish"}}],"L":"0942","texto":{"es":"samuddamaccho (pez en el mar): samudde (en el mar) maccho (pez)","en":"samuddamaccho (fish in the sea): samudde (in the sea) maccho (fish)"},"id":"c-samuddamaccho"},{"tipo":"interlineal","origen":"linea","compuesto":"titthanāvā","traduccion":{"es":"nave en el puerto","en":"ship in the port"},"viggaha":[{"p":"titthe","g":{"es":"en el puerto","en":"in the port"}},{"p":"nāvā","g":{"es":"nave","en":"ship"}}],"L":"0943","texto":{"es":"titthanāvā (nave en el puerto): titthe (en el puerto) nāvā (nave)","en":"titthanāvā (ship in the port): titthe (in the port) nāvā (ship)"},"id":"c-titthanava"},{"tipo":"interlineal","origen":"linea","compuesto":"itthidhutto","traduccion":{"es":"corruptor de mujeres","en":"corrupter of women"},"viggaha":[{"p":"itthīsu","g":{"es":"en mujeres","en":"in women"}},{"p":"dhutto","g":{"es":"corruptor","en":"corrupter"}}],"L":"0944","texto":{"es":"itthidhutto (corruptor de mujeres): itthīsu (en mujeres) dhutto (corruptor)","en":"itthidhutto (corrupter of women): itthīsu (in women) dhutto (corrupter)"},"id":"c-itthidhutto"},{"tipo":"interlineal","origen":"linea","compuesto":"dhammarato","traduccion":{"es":"deleitado en el Dhamma","en":"delighted in the Dhamma"},"viggaha":[{"p":"dhamme","g":{"es":"en el Dhamma","en":"in the Dhamma"}},{"p":"rato","g":{"es":"deleitado","en":"delighted"}}],"L":"0945","texto":{"es":"dhammarato (deleitado en el Dhamma): dhamme (en el Dhamma) rato (deleitado)","en":"dhammarato (delighted in the Dhamma): dhamme (in the Dhamma) rato (delighted)"},"id":"c-dhammarato"},{"tipo":"interlineal","origen":"linea","compuesto":"vikālabhojanaṃ","traduccion":{"es":"comida en el tiempo erróneo","en":"eating at the wrong time"},"viggaha":[{"p":"vikāle","g":{"es":"en tiempo erróneo","en":"at the wrong time"}},{"p":"bhojanaṃ","g":{"es":"comida","en":"food"}}],"L":"0946","texto":{"es":"vikālabhojanaṃ (comida en el tiempo erróneo): vikāle (en tiempo erróneo) bhojanaṃ (comida)","en":"vikālabhojanaṃ (eating at the wrong time): vikāle (at the wrong time) bhojanaṃ (eating)"},"anexos":[{"es":"El canon lo usa en la quinta inflexión: «ekabhattiko hoti rattūparato virato vikālabhojanā» (D. i 60 (PTS i 64)).","en":"The canon uses it in the fifth inflection: “ekabhattiko hoti rattūparato virato vikālabhojanā” (D. i 60 (PTS i 64)).","fuente":"Tipiṭaka","L":"0946b"}],"id":"c-vikalabhojanam"},{"tipo":"interlineal","origen":"linea","compuesto":"vanapupphaṃ","traduccion":{"es":"flor en el bosque","en":"flower in the forest"},"viggaha":[{"p":"vane","g":{"es":"en el bosque","en":"in the forest"}},{"p":"pupphaṃ","g":{"es":"flor","en":"flower"}}],"L":"0947","texto":{"es":"vanapupphaṃ (flor en el bosque): vane (en el bosque) pupphaṃ (flor)","en":"vanapupphaṃ (flower in the forest): vane (in the forest) pupphaṃ (flower)"},"id":"c-vanapuppham"},{"tipo":"interlineal","origen":"linea","compuesto":"maggaṭṭho","traduccion":{"es":"que existe en el Sendero","en":"who exists on the Path"},"viggaha":[{"p":"magge","g":{"es":"en el Sendero","en":"on the Path"}},{"p":"tiṭṭhati","g":{"es":"existe o se halla","en":"exists or is found"}}],"L":"0948","texto":{"es":"maggaṭṭho (que existe en el Sendero): magge (en el Sendero) tiṭṭhati (existe o se halla)","en":"maggaṭṭho (who exists on the Path): magge (on the Path) tiṭṭhati (exists or is found)"},"id":"c-maggattho"},{"tipo":"interlineal","origen":"linea","compuesto":"kucchisayo","traduccion":{"es":"que yace en el vientre","en":"which lies in the womb"},"viggaha":[{"p":"kucchimhi","g":{"es":"en el vientre","en":"in the womb"}},{"p":"sayati","g":{"es":"yace","en":"lies"}}],"L":"0949","texto":{"es":"kucchisayo (que yace en el vientre): kucchimhi (en el vientre) sayati (yace)","en":"kucchisayo (which lies in the womb): kucchimhi (in the womb) sayati (lies)"},"id":"c-kucchisayo"},{"tipo":"interlineal","origen":"linea","compuesto":"paṅkajaṃ","traduccion":{"es":"nacido en el barro","en":"born in the mud"},"viggaha":[{"p":"paṅke","g":{"es":"en el barro","en":"in the mud"}},{"p":"jātaṃ","g":{"es":"nacido","en":"born"}}],"L":"0950","texto":{"es":"paṅkajaṃ (nacido en el barro): paṅke (en el barro) jātaṃ (nacido)","en":"paṅkajaṃ (born in the mud): paṅke (in the mud) jātaṃ (born)"},"id":"c-pankajam"},{"tipo":"p","texto":{"es":"Los tres últimos (maggaṭṭho, kucchisayo, paṅkajaṃ) son upapada: sólo hay compuesto, como en vanacaro (vane caratī ti, que anda por el bosque) y thalaṭṭho (que está en tierra firme). A la inversa, en «bhojane mattaññutā» (moderación en la comida), «indriyesu guttadvāratā» (guarda de las puertas de los sentidos) y «āsane nisinno» (sentado en el asiento) sólo hay frase, sin compuesto (Rū. §351 (pp. 197–198)).","en":"The last three (maggaṭṭho, kucchisayo, paṅkajaṃ) are upapada: there is only the compound, as in vanacaro (vane caratī ti, who wanders in the forest) and thalaṭṭho (which stands on dry land). Conversely, in “bhojane mattaññutā” (moderation in eating), “indriyesu guttadvāratā” (guarding of the doors of the senses) and “āsane nisinno” (seated on the seat) there is only the phrase, without a compound (Rū. §351 (pp. 197–198))."},"L":"0950b","iebh":true,"fuente":"Rūpasiddhi","id":"tappurisa-l0950b"},{"tipo":"h","nivel":2,"texto":{"es":"Compuestos determinativos irregulares","en":"Irregular determinative compounds"},"L":"0952","id":"tappurisa-compuestos-determinativos-irregulares"},{"tipo":"p","texto":{"es":"Este tipo de compuesto se denomina *amādipara-tappurisa*, compuesto determinativo que tiene como último miembro una voz que termina en *aṃ*, etc. Es decir, hay una transposición entre los miembros del compuesto. (Rū. §351 (p. 198))","en":"This type of compound is called *amādipara-tappurisa*, a determinative compound that has as its last member a word ending in *aṃ*, etc. That is, there is a transposition between the members of the compound. (Rū. §351 (p. 198))"},"L":"0954","id":"tappurisa-l0954"},{"tipo":"interlineal","origen":"linea","compuesto":"ativelo","traduccion":{"es":"tiempo excedido","en":"exceeded time"},"viggaha":[{"p":"velaṃ","g":{"es":"tiempo","en":"time"}},{"p":"atikkanto","g":{"es":"sobrepasando","en":"surpassing"}}],"L":"0957","texto":{"es":"ativelo (tiempo excedido): velaṃ (tiempo) atikkanto (sobrepasando)","en":"ativelo (exceeded time): velaṃ (time) atikkanto (exceeding)"},"id":"c-ativelo"},{"tipo":"interlineal","origen":"linea","compuesto":"anvatthaṃ","traduccion":{"es":"de acuerdo con el significado","en":"in accordance with the meaning"},"viggaha":[{"p":"atthaṃ","g":{"es":"significado","en":"meaning"}},{"p":"anugataṃ","g":{"es":"que sigue","en":"which follows"}}],"L":"0958","texto":{"es":"anvatthaṃ (de acuerdo con el significado): atthaṃ (significado) anugataṃ (que sigue)","en":"anvatthaṃ (in accordance with the meaning): atthaṃ (meaning) anugataṃ (which follows)"},"id":"c-anvattham"},{"tipo":"interlineal","origen":"linea","compuesto":"nibbānaṃ","traduccion":{"es":"salido del deseo","en":"gone out from desire"},"viggaha":[{"p":"vānato","g":{"es":"del deseo","en":"from desire"}},{"p":"nikkhantaṃ","g":{"es":"salido","en":"gone out"}}],"L":"0959","texto":{"es":"nibbānaṃ (salido del deseo): vānato (del deseo) nikkhantaṃ (salido)","en":"nibbānaṃ (gone out from desire): vānato (from desire) nikkhantaṃ (gone out)"},"id":"c-nibbanam"},{"tipo":"interlineal","origen":"linea","compuesto":"rājahaṃso","traduccion":{"es":"rey de los cisnes","en":"king of the swans"},"viggaha":[{"p":"haṃsānaṃ","g":{"es":"de los cisnes","en":"of the swans"}},{"p":"rājā","g":{"es":"rey","en":"king"}}],"L":"0960","texto":{"es":"rājahaṃso (rey de los cisnes): haṃsānaṃ (de los cisnes) rājā (rey)","en":"rājahaṃso (king of the swans): haṃsānaṃ (of the swans) rājā (king)"},"id":"c-rajahamso"},{"tipo":"interlineal","origen":"linea","compuesto":"addhamāsaṃ","traduccion":{"es":"medio mes; quincena","en":"half a month; fortnight"},"viggaha":[{"p":"māsassa","g":{"es":"de un mes","en":"of a month"}},{"p":"addhaṃ","g":{"es":"medio","en":"half"}}],"L":"0961","texto":{"es":"addhamāsaṃ (medio mes; quincena): māsassa (de un mes) addhaṃ (medio)","en":"addhamāsaṃ (half a month; fortnight): māsassa (of a month) addhaṃ (half)"},"id":"c-addhamasam"},{"tipo":"interlineal","origen":"linea","compuesto":"pācariyo","traduccion":{"es":"maestro del maestro","en":"teacher of the teacher"},"viggaha":[{"p":"ācariyato","g":{"es":"del maestro/de los maestros","en":"of the teacher/of the teachers"}},{"p":"paro","g":{"es":"otro","en":"other"}}],"L":"0962","texto":{"es":"pācariyo (maestro del maestro): ācariyato (del maestro/de los maestros) paro (otro)","en":"pācariyo (teacher of the teacher): ācariyato (of the teacher/of the teachers) paro (other)"},"id":"c-pacariyo"},{"tipo":"interlineal","origen":"linea","compuesto":"payyako","traduccion":{"es":"bisabuelo","en":"great-grandfather"},"viggaha":[{"p":"ayyakato","g":{"es":"de abuelo","en":"of a grandfather"}},{"p":"paro","g":{"es":"otro","en":"other"}}],"L":"0963","texto":{"es":"payyako (bisabuelo): ayyakato (de abuelo) paro (otro)","en":"payyako (great-grandfather): ayyakato (of a grandfather) paro (other)"},"id":"c-payyako"},{"tipo":"interlineal","origen":"linea","compuesto":"addhāmalakaṃ","traduccion":{"es":"la mitad de un mirobálano","en":"half of a myrobalan"},"viggaha":[{"p":"āmalakassa","g":{"es":"de mirobálano","en":"of a myrobalan"}},{"p":"addhaṃ","g":{"es":"medio","en":"half"}}],"L":"0964","texto":{"es":"addhāmalakaṃ (la mitad de un mirobálano): āmalakassa (de mirobálano) addhaṃ (medio)","en":"addhāmalakaṃ (half of a myrobalan): āmalakassa (of a myrobalan) addhaṃ (half)"},"id":"c-addhamalakam"},{"tipo":"interlineal","origen":"linea","compuesto":"pubbarattaṃ","traduccion":{"es":"parte previa de la noche","en":"earlier part of the night"},"viggaha":[{"p":"rattiyā","g":{"es":"de la noche","en":"of the night"}},{"p":"pubbaṃ","g":{"es":"previa parte","en":"earlier part"}}],"L":"0965","texto":{"es":"pubbarattaṃ (parte previa de la noche): rattiyā (de la noche) pubbaṃ (previa parte)","en":"pubbarattaṃ (earlier part of the night): rattiyā (of the night) pubbaṃ (earlier part)"},"id":"c-pubbarattam"},{"tipo":"p","texto":{"es":"En pubbarattaṃ, la ‘i’ final de «ratti» deviene ‘a’ por «Kvaci samāsantagatānam akāranto» (Kacc. §337). Del mismo tipo: accantaṃ (antaṃ atikkantaṃ, que sobrepasa el límite), paccakkhaṃ (akkhaṃ patigataṃ, presente ante los ojos), pubbanhaṃ (ahassa pubbaṃ, la parte anterior del día, la mañana), donde «aha» se sustituye por «anha»; Niruttidīpanī y el canon escriben pubbaṇha. Rūpasiddhi admite también el orden normal: haṃsarājā junto a rājahaṃso, māsaddhaṃ junto a addhamāsaṃ (Rū. §351 (p. 198)).","en":"In pubbarattaṃ, the final ‘i’ of “ratti” becomes ‘a’ by “Kvaci samāsantagatānam akāranto” (Kacc. §337). Of the same type: accantaṃ (antaṃ atikkantaṃ, which goes beyond the limit), paccakkhaṃ (akkhaṃ patigataṃ, present before the eyes), pubbanhaṃ (ahassa pubbaṃ, the earlier part of the day, the morning), where “aha” is replaced by “anha”; Niruttidīpanī and the canon write pubbaṇha. Rūpasiddhi also admits the normal order: haṃsarājā alongside rājahaṃso, māsaddhaṃ alongside addhamāsaṃ (Rū. §351 (p. 198))."},"L":"0965b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Niruttidīpanī · Tipiṭaka","id":"tappurisa-l0965b"},{"tipo":"h","nivel":2,"texto":{"es":"Compuestos determinativos donde la inflexión del primer miembro no se elide","en":"Determinative compounds in which the inflection of the first member is not elided"},"L":"0967","id":"tappurisa-compuestos-determinativos-donde-la-inflexion-del-primer-miem"},{"tipo":"p","texto":{"es":"Este tipo de compuesto se denomina *alopa-tappurisa* o *alutta-tappurisa*, compuesto determinativo sin elisión.","en":"This type of compound is called *alopa-tappurisa* or *alutta-tappurisa*, determinative compound without elision."},"L":"0969","id":"tappurisa-l0969"},{"tipo":"p","texto":{"es":"La inflexión no se elide por el «ca» de «Tesaṃ vibhattiyo lopā ca» (Kacc. §317; Rū. §332), como explica Rūpasiddhi (Rū., p. 199). Ej., pabhaṅkaro (pabhaṃ karotī ti, hacedor de luz), attanopadaṃ (voz para sí).","en":"The inflection is not elided owing to the “ca” of “Tesaṃ vibhattiyo lopā ca” (Kacc. §317; Rū. §332), as Rūpasiddhi explains (Rū., p. 199). E.g., pabhaṅkaro (pabhaṃ karotī ti, maker of light), attanopadaṃ (voice for oneself)."},"L":"0969b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"tappurisa-l0969b"},{"tipo":"p","texto":{"es":"La vutti de Kaccāyana da como ejemplos de esta regla, junto a Pabhaṅkaro y amatandado, también Medhaṅkaro y Dīpaṅkaro (Kacc. §317), que Rūpasiddhi explica en cambio con la inserción ‘nu’ de los nombres propios (Rū. §565–§566); véanse los nombres propios en el compuesto determinativo en segunda inflexión.","en":"The Kaccāyana vutti gives as examples of this rule, besides Pabhaṅkaro and amatandado, also Medhaṅkaro and Dīpaṅkaro (Kacc. §317), which Rūpasiddhi instead explains with the insertion ‘nu’ of proper names (Rū. §565–§566); see the proper names under the determinative compound in the second inflection."},"L":"0969d","iebh":true,"fuente":"Kaccāyana · Rūpasiddhi","id":"tappurisa-l0969d"},{"tipo":"interlineal","origen":"linea","compuesto":"paratoghoso","traduccion":{"es":"voz de otro","en":"voice of another"},"viggaha":[{"p":"parato","g":{"es":"de otro","en":"of another"}},{"p":"ghoso","g":{"es":"voz","en":"voice"}}],"L":"0971","texto":{"es":"paratoghoso (voz de otro): parato (de otro) ghoso (voz)","en":"paratoghoso (voice of another): parato (of another) ghoso (voice)"},"id":"c-paratoghoso"},{"tipo":"interlineal","origen":"linea","compuesto":"bhayatūpaṭṭhānaṃ","traduccion":{"es":"manifestación como miedo/peligro","en":"manifestation as fear/danger"},"viggaha":[{"p":"bhayato","g":{"es":"como miedo/peligro","en":"as fear/danger"}},{"p":"upaṭṭhānaṃ","g":{"es":"manifestación","en":"manifestation"}}],"L":"0972","texto":{"es":"bhayatūpaṭṭhānaṃ (manifestación como miedo/peligro): bhayato (como miedo/peligro) upaṭṭhānaṃ (manifestación)","en":"bhayatūpaṭṭhānaṃ (manifestation as fear/danger): bhayato (as fear/danger) upaṭṭhānaṃ (manifestation)"},"id":"c-bhayatupatthanam"},{"tipo":"interlineal","origen":"linea","compuesto":"amatandado","traduccion":{"es":"dador de inmortalidad","en":"giver of the Deathless"},"viggaha":[{"p":"amataṃ","g":{"es":"la inmortalidad","en":"the Deathless"}},{"p":"dadāti","g":{"es":"da","en":"gives"}}],"L":"0973","texto":{"es":"amatandado (dador de inmortalidad): amataṃ (la inmortalidad) dadāti (da)","en":"amatandado (giver of the Deathless): amataṃ (the Deathless) dadāti (gives)"},"id":"c-amatandado"},{"tipo":"interlineal","origen":"linea","compuesto":"antevāsiko","traduccion":{"es":"discípulo","en":"disciple"},"viggaha":[{"p":"ante","g":{"es":"adentro","en":"inside"}},{"p":"vāsiko","g":{"es":"que reside","en":"who resides"}}],"L":"0974","texto":{"es":"antevāsiko (discípulo); ante (adentro) vāsiko (que reside)","en":"antevāsiko (pupil); ante (inside) vāsiko (who resides)"},"anexos":[{"es":"Rūpasiddhi da también «antevāsī», junto a «antevāsiko»; las dos están en el canon, p. ej. «suppiyassa pana paribbājakassa antevāsī brahmadatto māṇavo» (D. i 1 (PTS i 1)).","en":"Rūpasiddhi also gives “antevāsī”, alongside “antevāsiko”; both are in the canon, e.g. “suppiyassa pana paribbājakassa antevāsī brahmadatto māṇavo” (D. i 1 (PTS i 1)).","fuente":"Rūpasiddhi · Tipiṭaka","L":"0974b"}],"id":"c-antevasiko"},{"tipo":"interlineal","origen":"linea","compuesto":"parassapadaṃ","traduccion":{"es":"voz para otro","en":"voice for another"},"viggaha":[{"p":"parassa","g":{"es":"para otro","en":"for another"}},{"p":"padaṃ","g":{"es":"voz","en":"voice"}}],"L":"0975","texto":{"es":"parassapadaṃ (voz para otro): parassa (para otro) padaṃ (voz)","en":"parassapadaṃ (voice for another): parassa (for another) padaṃ (voice)"},"id":"c-parassapadam"},{"tipo":"interlineal","origen":"linea","compuesto":"manasikāro","traduccion":{"es":"atención","en":"attention"},"viggaha":[{"p":"manasi","g":{"es":"en la mente","en":"in the mind"}},{"p":"karoti","g":{"es":"hace","en":"makes"}}],"L":"0976","texto":{"es":"manasikāro (atención): manasi (en la mente) karoti (hace)","en":"manasikāro (attention): manasi (in the mind) karoti (makes)"},"id":"c-manasikaro"},{"tipo":"interlineal","origen":"linea","compuesto":"urasilomo","traduccion":{"es":"vello en el pecho","en":"hair on the chest"},"viggaha":[{"p":"urasi","g":{"es":"en el pecho","en":"on the chest"}},{"p":"lomo","g":{"es":"vello","en":"hair"}}],"L":"0977","texto":{"es":"urasilomo (vello en el pecho): urasi (en el pecho) lomo (vello)","en":"urasilomo (hair on the chest): urasi (on the chest) lomo (hair)"},"id":"c-urasilomo"},{"tipo":"interlineal","origen":"linea","compuesto":"pubbenivāso","traduccion":{"es":"existencia previa","en":"previous existence"},"viggaha":[{"p":"pubbe","g":{"es":"antes, en el pasado","en":"before, in the past"}},{"p":"nivāso","g":{"es":"morada, existencia","en":"abode, existence"}}],"L":"0978","texto":{"es":"pubbenivāso (existencia previa): pubbe (antes, en el pasado) nivāso (morada, existencia)","en":"pubbenivāso (previous existence): pubbe (before, in the past) nivāso (abode, existence)"},"id":"c-pubbenivaso"},{"tipo":"p","texto":{"es":"Rūpasiddhi da también «pubbenivāsānussati», que es la primera de las tres vijjā: «pubbenivāsānussati ñāṇaṃ vijjā» (Dhs. 265 (PTS p. 234)).","en":"Rūpasiddhi also gives “pubbenivāsānussati”, which is the first of the three vijjā: “pubbenivāsānussati ñāṇaṃ vijjā” (Dhs. 265 (PTS p. 234))."},"L":"0978b","iebh":true,"fuente":"Rūpasiddhi · Tipiṭaka","id":"tappurisa-l0978b"},{"tipo":"interlineal","origen":"linea","compuesto":"majjhekalyāṇaṃ","traduccion":{"es":"bueno en el medio","en":"good in the middle"},"viggaha":[{"p":"majjhe","g":{"es":"en el medio","en":"in the middle"}},{"p":"kalyāṇaṃ","g":{"es":"bueno","en":"good"}}],"L":"0979","texto":{"es":"majjhekalyāṇaṃ (bueno en el medio): majjhe (en el medio) kalyāṇaṃ (bueno)","en":"majjhekalyāṇaṃ (good in the middle): majjhe (in the middle) kalyāṇaṃ (good)"},"id":"c-majjhekalyanam"},{"tipo":"interlineal","origen":"linea","compuesto":"sarasijaṃ","traduccion":{"es":"nacido en el lago","en":"born in the lake"},"viggaha":[{"p":"sarasi","g":{"es":"en el lago","en":"in the lake"}},{"p":"jātaṃ","g":{"es":"nacido","en":"born"}}],"L":"0980","texto":{"es":"sarasijaṃ (nacido en el lago): sarasi (en el lago) jātaṃ (nacido)","en":"sarasijaṃ (born in the lake): sarasi (in the lake) jātaṃ (born)"},"id":"c-sarasijam"}]},{"id":"bahubbihi","n":5,"pali":"bahubbīhi","titulo":{"es":"Compuesto relativo (bahubbīhi-samāsa)","en":"Relative compound (bahubbīhi-samāsa)"},"kacc":[328],"L":"0981","bloques":[{"tipo":"p","texto":{"es":"Compuesto que denota algo diferente de lo que cada uno de sus miembros representan. *Bahubbīhi* que significa un lugar donde hay mucho grano ejemplifica este tipo de compuesto (*bahu*, mucho, y *vīhi*, grano).[^8] Los miembros individuales no son suficientes para explicar el significado del compuesto. Se requiere el uso de otra palabra (aññapada),[^9] *ya*, *ta*, *eta* e *ima*, para la resolución del compuesto. En un compuesto relativo el significado de la otra palabra es predominante.","en":"A compound that denotes something different from what each of its members represents. *Bahubbīhi*, which means a place where there is much grain, exemplifies this type of compound (*bahu*, much, and *vīhi*, grain).[^8] The individual members are not sufficient to explain the meaning of the compound. The use of the other word (aññapada),[^9] *ya*, *ta*, *eta* and *ima*, is required for the resolution of the compound. In a relative compound the meaning of the other word predominates."},"L":"0983","id":"bahubbihi-l0983"},{"tipo":"p","texto":{"es":"Este compuesto tiene el género de la otra palabra (aññapada).","en":"This compound has the gender of the other word (aññapada)."},"L":"0983b","iebh":true,"fuente":"Nandisena, «Qué género tienen cada uno de los seis compuestos» (2004) · Rūpasiddhi · Kaccāyana · U Sīlānanda","id":"bahubbihi-l0983b"},{"tipo":"p","texto":{"es":"Cualquier tipo de compuesto, adverbial, adjetivo, numérico, determinativo y copulativo, si es usado como adjetivo, se convierte en un compuesto relativo. El compuesto relativo debe concordar en número, género y caso gramatical con el nombre que califica.","en":"Any kind of compound, adverbial, adjectival, numerical, determinative and copulative, if it is used as an adjective, becomes a relative compound. The relative compound must agree in number, gender and grammatical case with the noun it qualifies."},"L":"0985","id":"bahubbihi-l0985"},{"tipo":"p","texto":{"es":"Kaccāyana ilustra compuestos relativos que contienen otros compuestos, p. ej. sayaṃpatitapaṇṇapupphaphalavāyutoyāhārā isayo: «Éste es un compuesto relativo que tiene la misma localización (tulyādhikaraṇabahubbīhi) y que contiene un compuesto copulativo y un compuesto adjetivo (dvanda-kammadhāraya-gabbho)» (Kacc. §328).","en":"Kaccāyana illustrates relative compounds that contain other compounds, e.g. sayaṃpatitapaṇṇapupphaphalavāyutoyāhārā isayo: “This is a relative compound which has the same location (tulyādhikaraṇabahubbīhi) and which has a copulative compound and an adjectival compound in it (dvanda-kammadhāraya-gabbho)” (Kacc. §328)."},"L":"0985b","iebh":true,"fuente":"Kaccāyana","id":"bahubbihi-l0985b"},{"tipo":"p","texto":{"es":"Hay nueve clases de compuesto relativo: (1) dos miembros que tienen la misma localización (dvipada-tulyādhikaraṇa), (2) dos miembros que no tienen la misma localización (dvipada-bhinnādhikaraṇa), (3) tres miembros (tipada), (4) la partícula *na* es el primer miembro (nanipāta-pubbapada), (5) *saha* es el primer miembro (saha-pubbapada), (6) el primer miembro es una comparación (upamāna-pubbapada), (7) ambos miembros son numerales (saṅkhyobhayapada), (8) se refiere a los puntos intermedios de la brújula (disantarāḷattha), (9) indica una acción recíproca (byatihāralakkhaṇa).[^10]","en":"There are nine classes of relative compound: (1) two members which have the same location (dvipada-tulyādhikaraṇa), (2) two members which do not have the same location (dvipada-bhinnādhikaraṇa), (3) three members (tipada), (4) the particle *na* is the first member (nanipāta-pubbapada), (5) *saha* is the first member (saha-pubbapada), (6) the first member is a comparison (upamāna-pubbapada), (7) both members are numerals (saṅkhyobhayapada), (8) it refers to the intermediate points of the compass (disantarāḷattha), (9) it indicates a reciprocal action (byatihāralakkhaṇa).[^10]"},"L":"0987","id":"bahubbihi-l0987"},{"tipo":"h","nivel":2,"texto":{"es":"(1) Dos miembros que tienen la misma localización (dvipada-tulyādhikaraṇa) (Rū. §352 (pp. 199–204))","en":"(1) Two members which have the same location (dvipada-tulyādhikaraṇa) (Rū. §352 (pp. 199–204))"},"L":"0990","id":"bahubbihi-dvipada-tulyadhikarana"},{"tipo":"p","texto":{"es":"Este tipo consiste en dos miembros que se refieren a la misma cosa y están en la misma inflexión. Hay 6 clases de acuerdo con la inflexión de la otra palabra (aññapada): (i) en la segunda inflexión, (ii) en la tercera inflexión, (iii) en la cuarta inflexión, (iv) en la quinta inflexión, (v) en la sexta inflexión, (vi) en la séptima inflexión.[^11]","en":"This type consists of two members that refer to the same thing and are in the same inflection. There are 6 classes according to the inflection of the other word (aññapada): (i) in the second inflection, (ii) in the third inflection, (iii) in the fourth inflection, (iv) in the fifth inflection, (v) in the sixth inflection, (vi) in the seventh inflection.[^11]"},"L":"0992","id":"bahubbihi-l0992"},{"tipo":"p","texto":{"es":"Además de estas seis, las gramáticas cuentan el compuesto relativo en el significado de la primera inflexión: son las clases (5) a (9) —la (6) también en la sexta—. Rūpasiddhi cierra esas clases con «Paṭhamāvibhatyatthabahubbīhi» (Rū., p. 207), y Niruttidīpanī cuenta así siete clases según la inflexión (Nir. 242). Según Thitzana, ésta es la clasificación más fácil para el principiante.","en":"In addition to these six, the grammars count the relative compound in the meaning of the first inflection: these are classes (5) to (9) —(6) also in the sixth—. Rūpasiddhi closes those classes with “Paṭhamāvibhatyatthabahubbīhi” (Rū., p. 207), and Niruttidīpanī thus counts seven classes according to the inflection (Nir. 242). According to Thitzana, this is the easiest classification for the beginner."},"L":"0992b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī · Thitzana","id":"bahubbihi-l0992b"},{"tipo":"h","nivel":3,"texto":{"es":"(i) En la segunda inflexión","en":"(i) In the second inflection"},"L":"0994","id":"bahubbihi-i-en-la-segunda-inflexion"},{"tipo":"p","texto":{"es":"Tienen el mismo género, número y caso que el significado denotado (abhidheyya).","en":"They have the same gender, number and case as what is denoted (abhidheyya)."},"L":"0996","id":"bahubbihi-l0996"},{"tipo":"interlineal","origen":"par","compuesto":"āgatasamaṇo","traduccion":{"es":"monasterio del Saṃgha a donde vinieron los monjes","en":"monastery of the Saṃgha where the monks came"},"viggaha":[{"p":"āgatā","g":{"es":"venidos","en":"come"}},{"p":"samaṇā","g":{"es":"monjes","en":"monks"}},{"p":"imaṃ","g":{"es":"a este","en":"to this"}},{"p":"saṃghārāmaṃ","g":{"es":"monasterio del Saṃgha","en":"monastery of the Saṃgha"}},{"p":",","g":{"es":"","en":""}},{"p":"so","g":{"es":"éste","en":"this one"}},{"p":"āgatasamaṇo Saṃghārāmo","g":{"es":"monasterio del Saṃgha a donde vinieron los monjes","en":"monastery of the Saṃgha where the monks came"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"āgatā (venidos) samaṇā (monjes) imaṃ (a este) saṃghārāmaṃ (monasterio del Saṃgha), so (éste) āgatasamaṇo Saṃghārāmo (monasterio del Saṃgha a donde vinieron los monjes).","en":"āgatā (come) samaṇā (monks) imaṃ (to this) saṃghārāmaṃ (monastery of the Saṃgha), so (this one) āgatasamaṇo Saṃghārāmo (monastery of the Saṃgha where the monks came)."},"L":"0998","L_resolucion":"0999","id":"c-agatasamano"},{"tipo":"interlineal","origen":"par","compuesto":"āgatasamaṇā","traduccion":{"es":"Sāvatthī a donde los monjes vinieron","en":"Sāvatthī where the monks came"},"viggaha":[{"p":"āgatā","g":{"es":"venidos","en":"come"}},{"p":"samaṇā","g":{"es":"monjes","en":"monks"}},{"p":"imaṃ","g":{"es":"a este","en":"to this"}},{"p":"Sāvatthiṃ","g":{"es":"Sāvatthī","en":"Sāvatthī"}},{"p":",","g":{"es":"","en":""}},{"p":"sā","g":{"es":"ésta","en":"this one"}},{"p":"āgatasamaṇā Sāvatthī","g":{"es":"Sāvatthī a donde los monjes vinieron","en":"Sāvatthī where the monks came"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"āgatā (venidos) samaṇā (monjes) imaṃ (a este) Sāvatthiṃ (Sāvatthī), sā (ésta) āgatasamaṇā Sāvatthī (Sāvatthī a donde los monjes vinieron).","en":"āgatā (come) samaṇā (monks) imaṃ (to this) Sāvatthiṃ (Sāvatthī), sā (this one) āgatasamaṇā Sāvatthī (Sāvatthī where the monks came)."},"L":"1001","L_resolucion":"1002","id":"c-agatasamana"},{"tipo":"interlineal","origen":"par","compuesto":"āgatasamaṇaṃ","traduccion":{"es":"Jetavana a donde los monjes vinieron","en":"Jetavana where the monks came"},"viggaha":[{"p":"āgatā","g":{"es":"venidos","en":"come"}},{"p":"samaṇā","g":{"es":"monjes","en":"monks"}},{"p":"imaṃ","g":{"es":"a este","en":"to this"}},{"p":"Jetavanaṃ","g":{"es":"Jetavana","en":"Jetavana"}},{"p":",","g":{"es":"","en":""}},{"p":"taṃ","g":{"es":"éste","en":"this one"}},{"p":"āgatasamaṇaṃ Jetavanaṃ","g":{"es":"Jetavana a donde los monjes vinieron","en":"Jetavana where the monks came"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"āgatā (venidos) samaṇā (monjes) imaṃ (a este) Jetavanaṃ (Jetavana), taṃ (éste) āgatasamaṇaṃ Jetavanaṃ (Jetavana a donde los monjes vinieron).","en":"āgatā (come) samaṇā (monks) imaṃ (to this) Jetavanaṃ (Jetavana), taṃ (this one) āgatasamaṇaṃ Jetavanaṃ (Jetavana where the monks came)."},"L":"1004","L_resolucion":"1005","id":"c-agatasamanam"},{"tipo":"p","texto":{"es":"En los tres ejemplos anteriores, *Saṃghārāmo*, monasterio del Saṃgha, *Sāvatthī* y *Jetavana*, son los significados denotados (abhidheyya) por el compuesto y la otra palabra (aññapada), en este caso *imaṃ*. Debido a que están en el significado de la segunda inflexión, se dice que este tipo de compuesto pertenece a la segunda inflexión.","en":"In the three preceding examples, *Saṃghārāmo*, monastery of the Saṃgha, *Sāvatthī* and *Jetavana* are what is denoted (abhidheyya) by the compound and the other word (aññapada), in this case *imaṃ*. Because they are in the meaning of the second inflection, this type of compound is said to belong to the second inflection."},"L":"1007","id":"bahubbihi-l1007"},{"tipo":"p","texto":{"es":"Rūpasiddhi explica por qué «saṃghārāmo» no lleva la segunda inflexión: āgata y samaṇa dejan su propio significado y se aplican al de la otra palabra, que es el de la segunda inflexión; «saṃghārāmo» se añade sólo para aclarar ese significado, y como el compuesto ya expresa el significado del objeto, no se repite la segunda. El pronombre «imaṃ» no se emplea con el compuesto, y así en todos los casos (Rū. §352 (p. 200)); en el ejemplo, Rūpasiddhi (p. 200) y Niruttidīpanī (ed. VRI) leen «āgatasamaṇā sāvatthi», como escribe por lo general el nominativo la edición del Sexto Concilio (p. ej. M. i 200 (PTS i 146): «yena sāvatthi tena cārikaṃ pakkāmi»); aquí se escribe «Sāvatthī», la forma del tema femenino en -ī, como en Sad. (Smith p. 760).","en":"Rūpasiddhi explains why “saṃghārāmo” does not take the second inflection: āgata and samaṇa give up their own meaning and are applied to that of the other word, which is that of the second inflection; “saṃghārāmo” is added only to clarify that meaning, and since the compound already expresses the meaning of the object, the second [inflection] is not repeated. The pronoun “imaṃ” is not used with the compound, and so in all cases (Rū. §352 (p. 200)); in the example, Rūpasiddhi (p. 200) and Niruttidīpanī (VRI ed.) read “āgatasamaṇā sāvatthi”, as the Sixth Council edition generally writes the nominative (e.g. M. i 200 (PTS i 146): “yena sāvatthi tena cārikaṃ pakkāmi”); here “Sāvatthī” is written, the form of the feminine stem in -ī, as in Sad. (Smith p. 760)."},"L":"1007b","iebh":true,"fuente":"Rūpasiddhi · Saddanīti · Niruttidīpanī","id":"bahubbihi-l1007b"},{"tipo":"p","texto":{"es":"Otros ejemplos:","en":"Other examples:"},"L":"1009","id":"bahubbihi-l1009"},{"tipo":"interlineal","origen":"par","compuesto":"paṭipannaddhiko","traduccion":{"es":"el camino donde los viajeros entraron","en":"the road on which the travellers entered"},"viggaha":[{"p":"paṭipannā","g":{"es":"entrados","en":"entered"}},{"p":"addhikā","g":{"es":"viajeros","en":"travellers"}},{"p":"yaṃ","g":{"es":"en ese","en":"on that"}},{"p":"pathaṃ","g":{"es":"camino","en":"road"}},{"p":",","g":{"es":"","en":""}},{"p":"so ayaṃ","g":{"es":"éste","en":"this one"}},{"p":"paṭipannaddhiko patho","g":{"es":"el camino donde los viajeros entraron","en":"the road on which the travellers entered"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"paṭipannā (entrados) addhikā (viajeros) yaṃ (en ese) pathaṃ (camino), so ayaṃ (éste) paṭipannaddhiko patho (el camino donde los viajeros entraron).","en":"paṭipannā (entered) addhikā (travellers) yaṃ (on that) pathaṃ (road), so ayaṃ (this one) paṭipannaddhiko patho (the road on which the travellers entered)."},"L":"1011","L_resolucion":"1012","id":"c-patipannaddhiko"},{"tipo":"interlineal","origen":"par","compuesto":"abhiruḷhavāṇijā","traduccion":{"es":"la nave donde los mercaderes subieron","en":"the ship onto which the merchants climbed"},"viggaha":[{"p":"abhiruḷhā","g":{"es":"subidos","en":"climbed"}},{"p":"vāṇijā","g":{"es":"mercaderes","en":"merchants"}},{"p":"yaṃ","g":{"es":"en esa","en":"onto that"}},{"p":"nāvaṃ","g":{"es":"nave","en":"ship"}},{"p":",","g":{"es":"","en":""}},{"p":"sā","g":{"es":"ésa","en":"that one"}},{"p":"abhiruḷhavāṇijā nāvā","g":{"es":"la nave donde los mercaderes subieron","en":"the ship onto which the merchants climbed"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"abhiruḷhā (subidos) vāṇijā (mercaderes) yaṃ (en esa) nāvaṃ (nave), sā (ésa) abhiruḷhavāṇijā nāvā (la nave donde los mercaderes subieron).","en":"abhiruḷhā (climbed) vāṇijā (merchants) yaṃ (onto that) nāvaṃ (ship), sā (that one) abhiruḷhavāṇijā nāvā (the ship onto which the merchants climbed)."},"L":"1014","L_resolucion":"1015","id":"c-abhirulhavanija"},{"tipo":"interlineal","origen":"par","compuesto":"sampattagāmiko","traduccion":{"es":"poblado donde los viajeros arribaron","en":"village at which the travellers arrived"},"viggaha":[{"p":"sampattā","g":{"es":"arribados","en":"arrived"}},{"p":"gāmikā","g":{"es":"viajeros","en":"travellers"}},{"p":"yaṃ","g":{"es":"a ese","en":"to that"}},{"p":"gāmaṃ","g":{"es":"poblado","en":"village"}},{"p":",","g":{"es":"","en":""}},{"p":"so","g":{"es":"éste","en":"this one"}},{"p":"sampattagāmiko gāmo","g":{"es":"poblado donde los viajeros arribaron","en":"village at which the travellers arrived"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"sampattā (arribados) gāmikā (viajeros) yaṃ (a ese) gāmaṃ (poblado), so (éste) sampattagāmiko gāmo (poblado donde los viajeros arribaron).","en":"sampattā (arrived) gāmikā (travellers) yaṃ (to that) gāmaṃ (village), so (this one) sampattagāmiko gāmo (village at which the travellers arrived)."},"L":"1017","L_resolucion":"1018","id":"c-sampattagamiko"},{"tipo":"h","nivel":3,"texto":{"es":"(ii) En la tercera inflexión","en":"(ii) In the third inflection"},"L":"1020","id":"bahubbihi-ii-en-la-tercera-inflexion"},{"tipo":"interlineal","origen":"par","compuesto":"jitindriyo","traduccion":{"es":"monje cuyas facultades han sido subyugadas","en":"monk whose faculties have been subdued"},"viggaha":[{"p":"jitāni","g":{"es":"subyugadas","en":"subdued"}},{"p":"indriyāni","g":{"es":"facultades","en":"faculties"}},{"p":"yena","g":{"es":"por este","en":"by this"}},{"p":"samaṇena","g":{"es":"monje","en":"monk"}},{"p":",","g":{"es":"","en":""}},{"p":"so ayaṃ","g":{"es":"éste","en":"this one"}},{"p":"jit e de) rāgo (pasión) assa (de ése) ti (por lo tanto) vītarāgo (uno que está libre de pasión).","en":"vīto (free from) rāgo (passion) assa (of that one) ti (therefore) vītarāgo (one who is free from passion)."},"L":"1068","L_resolucion":"1069","anexos":[{"es":"«Yo n’ āccasārī na paccasārī, sabbaṃ vitatham idan ti vītarāgo», Sn. 280 (PTS p. 2).","en":"“Yo n’ āccasārī na paccasārī, sabbaṃ vitatham idan ti vītarāgo”, Sn. 280 (PTS p. 2).","fuente":"Tipiṭaka","L":"1069b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-vitarago"},{"tipo":"interlineal","origen":"par","compuesto":"dvipado","traduccion":{"es":"uno que tiene dos patas","en":"one that has two feet"},"viggaha":[{"p":"dve","g":{"es":"dos","en":"two"}},{"p":"padāni","g":{"es":"patas","en":"feet"}},{"p":"assa","g":{"es":"de ése","en":"of that one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"dvipado","g":{"es":"uno que tiene dos patas","en":"one that has two feet"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"dve (dos) padāni (patas) assa (de ése) ti (por lo tanto) dvipado (uno que tiene dos patas).","en":"dve (two) padāni (feet) assa (of that one) ti (therefore) dvipado (one that has two feet)."},"L":"1071","L_resolucion":"1072","id":"c-dvipado"},{"tipo":"interlineal","origen":"par","compuesto":"idappaccayā","traduccion":{"es":"aquellos que tienen esta condición","en":"those which have this condition"},"viggaha":[{"p":"ayaṃ","g":{"es":"esta","en":"this"}},{"p":"paccayo","g":{"es":"condición","en":"condition"}},{"p":"etesaṃ","g":{"es":"de éstos","en":"of these"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"idappaccayā","g":{"es":"aquellos que tienen esta condición","en":"those which have this condition"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"ayaṃ (esta) paccayo (condición) etesaṃ (de éstos) ti (por lo tanto) idappaccayā (aquellos que tienen esta condición).","en":"ayaṃ (this) paccayo (condition) etesaṃ (of these) ti (therefore) idappaccayā (those which have this condition)."},"L":"1074","L_resolucion":"1075","id":"c-idappaccaya"},{"tipo":"interlineal","origen":"par","compuesto":"duggandhaṃ","traduccion":{"es":"un cadáver que tiene olor fétido","en":"a corpse that has a fetid smell"},"viggaha":[{"p":"kucchito","g":{"es":"fétido","en":"fetid"}},{"p":"gandho","g":{"es":"olor","en":"smell"}},{"p":"assa","g":{"es":"de ése","en":"of that one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"duggandhaṃ kuṇapaṃ","g":{"es":"un cadáver que tiene olor fétido","en":"a corpse that has a fetid smell"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"kucchito (fétido) gandho (olor) assa (de ése) ti (por lo tanto) duggandhaṃ kuṇapaṃ (un cadáver que tiene olor fétido).","en":"kucchito (fetid) gandho (smell) assa (of that one) ti (therefore) duggandhaṃ kuṇapaṃ (a corpse that has a fetid smell)."},"L":"1077","L_resolucion":"1078","id":"c-duggandham"},{"tipo":"interlineal","origen":"par","compuesto":"tapodhano","traduccion":{"es":"uno que tiene el ascetismo como su propia riqueza","en":"one who has asceticism as his own wealth"},"viggaha":[{"p":"tapo","g":{"es":"el ascetismo","en":"asceticism"}},{"p":"eva","g":{"es":"su propia","en":"his own"}},{"p":"dhanaṃ","g":{"es":"riqueza","en":"wealth"}},{"p":"assa","g":{"es":"de ése","en":"of that one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"tapodhano","g":{"es":"uno que tiene el ascetismo como su propia riqueza","en":"one who has asceticism as his own wealth"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"tapo (el ascetismo) eva (su propia) dhanaṃ (riqueza) assa (de ése) ti (por lo tanto) tapodhano (uno que tiene el ascetismo como su propia riqueza).","en":"tapo (asceticism) eva (his own) dhanaṃ (wealth) assa (of that one) ti (therefore) tapodhano (one who has asceticism as his own wealth)."},"L":"1080","L_resolucion":"1081","id":"c-tapodhano"},{"tipo":"p","texto":{"es":"Otros ejemplos (Rū., p. 201). Rūpasiddhi los da sin resolución; la de khīṇāsavo sigue el modelo de chinnahattho, y la de dasabalo es la de Kacc. §328.","en":"Other examples (Rū., p. 201). Rūpasiddhi gives them without resolution; that of khīṇāsavo follows the model of chinnahattho, and that of dasabalo is that of Kacc. §328."},"L":"1081b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"bahubbihi-l1081b"},{"tipo":"interlineal","origen":"par","compuesto":"khīṇāsavo","traduccion":{"es":"uno cuyos āsavas están destruidos","en":"one whose āsavas are destroyed"},"viggaha":[{"p":"khīṇā","g":{"es":"destruidos","en":"destroyed"}},{"p":"āsavā","g":{"es":"āsavas","en":"āsavas"}},{"p":"assa","g":{"es":"de éste","en":"of this one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"khīṇāsavo","g":{"es":"uno cuyos āsavas están destruidos","en":"one whose āsavas are destroyed"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"khīṇā (destruidos) āsavā (āsavas) assa (de éste) ti (por lo tanto) khīṇāsavo (uno cuyos āsavas están destruidos).","en":"khīṇā (destroyed) āsavā (āsavas) assa (of this one) ti (therefore) khīṇāsavo (one whose āsavas are destroyed)."},"L":"1081d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1081e","anexos":[{"es":"«Bhikkhu arahaṃ khīṇāsavo vusitavā», M. i 5 (PTS i 4).","en":"“Bhikkhu arahaṃ khīṇāsavo vusitavā”, M. i 5 (PTS i 4).","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"1081f"}],"id":"c-khinasavo"},{"tipo":"interlineal","origen":"par","compuesto":"dasabalo","traduccion":{"es":"el Sublime, uno que tiene los diez poderes","en":"the Blessed One, one who has the ten powers"},"viggaha":[{"p":"dasa","g":{"es":"diez","en":"ten"}},{"p":"balāni","g":{"es":"poderes","en":"powers"}},{"p":"yassa","g":{"es":"de ese","en":"of that"}},{"p":",","g":{"es":"","en":""}},{"p":"so ’yaṃ","g":{"es":"ése es","en":"that is"}},{"p":"dasabalo Bhagavā","g":{"es":"el Sublime, uno que tiene los diez poderes","en":"the Blessed One, one who has the ten powers"},"r":true}],"texto":{"es":"dasa (diez) balāni (poderes) yassa (de ese), so ’yaṃ (ése es) dasabalo Bhagavā (el Sublime, uno que tiene los diez poderes) (Kacc. §328).","en":"dasa (ten) balāni (powers) yassa (of that), so ’yaṃ (that is) dasabalo Bhagavā (the Blessed One, one who has the ten powers) (Kacc. §328)."},"L":"1081h","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1081i","resto":{"es":"(Kacc. §328) .","en":"(Kacc. §328) ."},"anexos":[{"es":"«Pun’ āparaṃ dasabalo, yadā carati cārikaṃ», Bv. 346 (PTS p. 37).","en":"“Pun’ āparaṃ dasabalo, yadā carati cārikaṃ”, Bv. 346 (PTS p. 37).","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"1081j"}],"id":"c-dasabalo"},{"tipo":"p","texto":{"es":"Sobre «Itthiyaṃ bhāsitapum’-itthī pumā ’va ce» (Kacc. §331; Rū. §353) y «Kvac’ ādi-majjh’-uttarānaṃ dīgha-rassā paccayesu ca» (Kacc. §403; Rū. §354). En dīghajaṅgho, de dīghā jaṅghā yassa, el primer miembro es un femenino que indicó masculino (bhāsitapuma) y sigue una palabra en femenino que tiene el mismo locus; se lo trata como masculino, de modo que pierde el sufijo femenino: dīgha (§331). Y, por ser compuesto relativo en masculino, se abrevia la vocal final del último miembro: jaṅgha (§403). Así dīghajaṅgho puriso, hombre de piernas largas; igualmente pahūtajivho Bhagavā y mahāpañño, éste con mahā por «Mahataṃ mahā tulyādhikaraṇe pade» (Kacc. §330) (Rū., pp. 202–203). No ocurre si la palabra femenina no se usa en masculino: saddhādhuro (Rū., p. 203).","en":"On “Itthiyaṃ bhāsitapum’-itthī pumā ’va ce” (Kacc. §331; Rū. §353) and “Kvac’ ādi-majjh’-uttarānaṃ dīgha-rassā paccayesu ca” (Kacc. §403; Rū. §354). In dīghajaṅgho, from dīghā jaṅghā yassa, the first member is a feminine that indicated masculine (bhāsitapuma) and it is followed by a word in the feminine having the same locus; it is treated as masculine, so that it loses the feminine suffix: dīgha (§331). And, since it is a relative compound in the masculine, the final vowel of the last member is shortened: jaṅgha (§403). Thus dīghajaṅgho puriso, a man with long legs; likewise pahūtajivho Bhagavā and mahāpañño, the latter with mahā by “Mahataṃ mahā tulyādhikaraṇe pade” (Kacc. §330) (Rū., pp. 202–203). This does not occur if the feminine word is not used in the masculine: saddhādhuro (Rū., p. 203)."},"L":"1081m","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"bahubbihi-l1081m"},{"tipo":"p","texto":{"es":"Sobre «Dhanumh’ ā ca» (Kacc. §340; Rū. §355). Al final de un compuesto hay el sufijo ‘ā’ después de dhanu, y la u pasa a v por «Vam od-udantānaṃ» (Kacc. §18): gāṇḍīvo dhanu yassa so ’yaṃ gāṇḍīvadhanvā (uno que tiene un arco con muchas junturas). Por el «ca», también después de dhamma: paccakkhadhammā. Según Rūpasiddhi ocurre sólo a veces (kvaci): sahassathāmadhanu, paccakkhadhammo (Rū., p. 203), y lee gāṇṭhivadhanvā.","en":"On “Dhanumh’ ā ca” (Kacc. §340; Rū. §355). At the end of a compound there is the suffix ‘ā’ after dhanu, and the u becomes v by “Vam od-udantānaṃ” (Kacc. §18): gāṇḍīvo dhanu yassa so ’yaṃ gāṇḍīvadhanvā (one who has a bow with many joints). By the “ca”, also after dhamma: paccakkhadhammā. According to Rūpasiddhi it occurs only sometimes (kvaci): sahassathāmadhanu, paccakkhadhammo (Rū., p. 203), and it reads gāṇṭhivadhanvā."},"L":"1081p","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"bahubbihi-l1081p"},{"tipo":"h","nivel":3,"texto":{"es":"(vi) En la séptima inflexión","en":"(vi) In the seventh inflection"},"L":"1083","id":"bahubbihi-vi-en-la-septima-inflexion"},{"tipo":"interlineal","origen":"par","compuesto":"sampannasasso","traduccion":{"es":"un distrito con abundantes granos","en":"a district with abundant grains"},"viggaha":[{"p":"sampannāni","g":{"es":"abundantes","en":"abundant"}},{"p":"sassāni","g":{"es":"granos","en":"grains"}},{"p":"yasmiṃ","g":{"es":"en este","en":"in this"}},{"p":"janapade","g":{"es":"distrito","en":"district"}},{"p":",","g":{"es":"","en":""}},{"p":"so ayaṃ","g":{"es":"este","en":"this"}},{"p":"sampannasasso janapado","g":{"es":"un distrito con abundantes granos","en":"a district with abundant grains"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"sampannāni (abundantes) sassāni (granos) yasmiṃ (en este) janapade (distrito), so ayaṃ (este) sampannasasso janapado (un distrito con abundantes granos).","en":"sampannāni (abundant) sassāni (grains) yasmiṃ (in this) janapade (district), so ayaṃ (this) sampannasasso janapado (a district with abundant grains)."},"L":"1085","L_resolucion":"1086","id":"c-sampannasasso"},{"tipo":"interlineal","origen":"par","compuesto":"sulabhapiṇḍo","traduccion":{"es":"una región donde es fácil de obtener comida","en":"a region where food is easy to obtain"},"viggaha":[{"p":"sulabho","g":{"es":"fácil de obtener","en":"easy to obtain"}},{"p":"piṇḍo","g":{"es":"comida","en":"food"}},{"p":"imasmiṃ","g":{"es":"en éste","en":"in this one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"sulabhapiṇḍo deso","g":{"es":"una región donde es fácil de obtener comida","en":"a region where food is easy to obtain"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"sulabho (fácil de obtener) piṇḍo (comida) imasmiṃ (en éste) ti (por lo tanto) sulabhapiṇḍo deso (una región donde es fácil de obtener comida).","en":"sulabho (easy to obtain) piṇḍo (food) imasmiṃ (in this one) ti (therefore) sulabhapiṇḍo deso (a region where food is easy to obtain)."},"L":"1088","L_resolucion":"1089","id":"c-sulabhapindo"},{"tipo":"interlineal","origen":"par","compuesto":"bahutāpaso","traduccion":{"es":"una ermita donde hay muchos ascetas","en":"a hermitage where there are many ascetics"},"viggaha":[{"p":"bahavo","g":{"es":"muchos","en":"many"}},{"p":"tāpasā","g":{"es":"ascetas","en":"ascetics"}},{"p":"etasmiṃ","g":{"es":"en éste","en":"in this one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"bahutāpaso assamo","g":{"es":"una ermita donde hay muchos ascetas","en":"a hermitage where there are many ascetics"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"bahavo (muchos) tāpasā (ascetas) etasmiṃ (en éste) ti (por lo tanto) bahutāpaso assamo (una ermita donde hay muchos ascetas).","en":"bahavo (many) tāpasā (ascetics) etasmiṃ (in this one) ti (therefore) bahutāpaso assamo (a hermitage where there are many ascetics)."},"L":"1091","L_resolucion":"1092","id":"c-bahutapaso"},{"tipo":"p","texto":{"es":"Sobre «Nadimhā ca» (Kacc. §338; Rū. §356). Al final de un compuesto hay el sufijo ‘ka’ después de una palabra llamada nadī —según Rūpasiddhi, término de otros gramáticos para los femeninos en ī y ū—, y por el «ca» también después de lo que termina en tu; según Rūpasiddhi, es obligatorio (niccatthaṃ vacanaṃ). Ante ‘ka’ la vocal de nadī se abrevia por Kacc. §403 (Rū. §354): bahū nadiyo asmiṃ, bahunadiko janapado (un distrito que tiene muchos ríos); igualmente bahujambukaṃ vanaṃ y, con tu, bahukattuko deso (Rū., p. 204). Rūpasiddhi no nombra aquí el paso de bahū a bahu.","en":"On “Nadimhā ca” (Kacc. §338; Rū. §356). At the end of a compound there is the suffix ‘ka’ after a word called nadī—according to Rūpasiddhi, a term of other grammarians for feminines in ī and ū—and, by the “ca”, also after what ends in tu; according to Rūpasiddhi, it is obligatory (niccatthaṃ vacanaṃ). Before ‘ka’ the vowel of the nadī is shortened by Kacc. §403 (Rū. §354): bahū nadiyo asmiṃ, bahunadiko janapado (a district that has many rivers); likewise bahujambukaṃ vanaṃ and, with tu, bahukattuko deso (Rū., p. 204). Rūpasiddhi does not mention here the change of bahū to bahu."},"L":"1092b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"bahubbihi-l1092b"},{"tipo":"p","texto":{"es":"**dvipada-bhinnādhikaraṇa**, una de las 9 clases de compuestos relativos (**bahubbīhi**). Consiste en dos miembros los cuales antes de formar el compuesto tienen diferentes inflexiones. Ej., *chattaṃ pāṇimhi assa iti chattapāṇi puriso*, hay una sombrilla en su mano, entonces es un hombre con una sombrilla en su mano. Aquí, *chatta*, sombrilla y *pāṇi*, mano, antes de formar el compuesto tienen diferentes inflexiones. (Rū. §352 (pp. 204–205))","en":"**dvipada-bhinnādhikaraṇa**, one of the 9 kinds of relative compounds (**bahubbīhi**). It consists of two members which, before forming the compound, have different inflections. E.g., *chattaṃ pāṇimhi assa iti chattapāṇi puriso*, there is an umbrella in his hand, so he is a man with an umbrella in his hand. Here, *chatta*, umbrella, and *pāṇi*, hand, have different inflections before forming the compound. (Rū. §352 (pp. 204–205))"},"L":"1098","def":"dvipada-bhinnādhikaraṇa","id":"bahubbihi-dvipada-bhinnadhikarana"},{"tipo":"p","texto":{"es":"Otros ejemplos (Rū., pp. 204–205):","en":"Other examples (Rū., pp. 204–205):"},"L":"1098b","iebh":true,"fuente":"Rūpasiddhi · Tipiṭaka","id":"bahubbihi-l1098b"},{"tipo":"interlineal","origen":"par","compuesto":"ekarattivāso","traduccion":{"es":"uno que se queda una noche","en":"one who stays one night"},"viggaha":[{"p":"ekarattiṃ","g":{"es":"una noche","en":"one night"}},{"p":"vāso","g":{"es":"estadía","en":"stay"}},{"p":"assa","g":{"es":"de éste","en":"of this one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"ekarattivāso","g":{"es":"uno que se queda una noche","en":"one who stays one night"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"ekarattiṃ (una noche) vāso (estadía) assa (de éste) ti (por lo tanto) ekarattivāso (uno que se queda una noche).","en":"ekarattiṃ (one night) vāso (stay) assa (of this one) ti (therefore) ekarattivāso (one who stays one night)."},"L":"1098d","iebh":true,"fuente":"Rūpasiddhi · Tipiṭaka","L_resolucion":"1098e","anexos":[{"es":"«Anutīre mahiy’ ekarattivāso» (mahiyā + ekarattivāso), Sn. 282 (PTS p. 3).","en":"“Anutīre mahiy’ ekarattivāso” (mahiyā + ekarattivāso), Sn. 282 (PTS p. 3).","fuente":"Rūpasiddhi · Tipiṭaka","L":"1098f"}],"id":"c-ekarattivaso"},{"tipo":"interlineal","origen":"par","compuesto":"dānajjhāsayo","traduccion":{"es":"uno que está inclinado a la generosidad","en":"one who is inclined to generosity"},"viggaha":[{"p":"dāne","g":{"es":"en la generosidad","en":"in generosity"}},{"p":"ajjhāsayo","g":{"es":"inclinación","en":"inclination"}},{"p":"assa","g":{"es":"de éste","en":"of this one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"dānajjhāsayo","g":{"es":"uno que está inclinado a la generosidad","en":"one who is inclined to generosity"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"dāne (en la generosidad) ajjhāsayo (inclinación) assa (de éste) ti (por lo tanto) dānajjhāsayo (uno que está inclinado a la generosidad).","en":"dāne (in generosity) ajjhāsayo (inclination) assa (of this one) ti (therefore) dānajjhāsayo (one who is inclined to generosity)."},"L":"1098h","iebh":true,"fuente":"Rūpasiddhi · Tipiṭaka","L_resolucion":"1098i","id":"c-danajjhasayo"},{"tipo":"p","texto":{"es":"**tipada**, una de las 9 clases de compuestos relativos (**bahubbīhi**). Consiste en 3 miembros. Ej., *sīhassa pubbaddhaṃ viya kāyo assa iti sīhapubbaddhakāyo*, su cuerpo es como la parte anterior de un león, por lo tanto se llama uno cuyo cuerpo es como la parte anterior de un león. Este compuesto relativo está formado por 3 miembros: (1) *sīha*, león, (2) *pubbaddha*, parte anterior, y (3) *kāya*, cuerpo. (Rū. §352 (p. 205))","en":"**tipada**, one of the 9 kinds of relative compounds (**bahubbīhi**). It consists of 3 members. E.g., *sīhassa pubbaddhaṃ viya kāyo assa iti sīhapubbaddhakāyo*, his body is like the front half of a lion, therefore he is called one whose body is like the front half of a lion. This relative compound is formed of 3 members: (1) *sīha*, lion, (2) *pubbaddha*, front half, and (3) *kāya*, body. (Rū. §352 (p. 205))"},"L":"1100","def":"tipada","id":"bahubbihi-tipada"},{"tipo":"p","texto":{"es":"Otros ejemplos (Rū., p. 205):","en":"Other examples (Rū., p. 205):"},"L":"1100b","iebh":true,"fuente":"Rūpasiddhi","id":"bahubbihi-l1100b"},{"tipo":"interlineal","origen":"par","compuesto":"parakkamādhigatasampadā","traduccion":{"es":"grandes hombres que han alcanzado la prosperidad por el esfuerzo","en":"great men who have attained prosperity through effort"},"viggaha":[{"p":"parakkamena","g":{"es":"por el esfuerzo","en":"through effort"}},{"p":"adhigatā","g":{"es":"alcanzada","en":"attained"}},{"p":"sampadā","g":{"es":"la prosperidad","en":"prosperity"}},{"p":"yehi","g":{"es":"por éstos","en":"by these"}},{"p":"te","g":{"es":"éstos","en":"these"}},{"p":"bhavanti","g":{"es":"son","en":"are"}},{"p":"parakkamādhigatasampadā mahāpurisā","g":{"es":"grandes hombres que han alcanzado la prosperidad por el esfuerzo","en":"great men who have attained prosperity through effort"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"parakkamena (por el esfuerzo) adhigatā (alcanzada) sampadā (la prosperidad) yehi (por éstos) te (éstos) bhavanti (son) parakkamādhigatasampadā mahāpurisā (grandes hombres que han alcanzado la prosperidad por el esfuerzo).","en":"parakkamena (through effort) adhigatā (attained) sampadā (prosperity) yehi (by these) te (these) bhavanti (are) parakkamādhigatasampadā mahāpurisā (great men who have attained prosperity through effort)."},"L":"1100d","iebh":true,"fuente":"Rūpasiddhi","L_resolucion":"1100e","id":"c-parakkamadhigatasampada"},{"tipo":"interlineal","origen":"par","compuesto":"mattabahumātaṅgaṃ","traduccion":{"es":"un bosque donde hay muchos elefantes embriagados","en":"a forest where there are many intoxicated elephants"},"viggaha":[{"p":"mattā","g":{"es":"embriagados","en":"intoxicated"}},{"p":"bahavo","g":{"es":"muchos","en":"many"}},{"p":"mātaṅgā","g":{"es":"elefantes","en":"elephants"}},{"p":"asmiṃ","g":{"es":"en éste","en":"in this one"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"mattabahumātaṅgaṃ vanaṃ","g":{"es":"un bosque donde hay muchos elefantes embriagados","en":"a forest where there are many intoxicated elephants"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"mattā (embriagados) bahavo (muchos) mātaṅgā (elefantes) asmiṃ (en éste) ti (por lo tanto) mattabahumātaṅgaṃ vanaṃ (un bosque donde hay muchos elefantes embriagados).","en":"mattā (intoxicated) bahavo (many) mātaṅgā (elephants) asmiṃ (in this one) ti (therefore) mattabahumātaṅgaṃ vanaṃ (a forest where there are many intoxicated elephants)."},"L":"1100g","iebh":true,"fuente":"Rūpasiddhi","L_resolucion":"1100h","id":"c-mattabahumatangam"},{"tipo":"p","texto":{"es":"**nanipāta-pubbapada**, una de las 9 clases de compuestos relativos (**bahubbīhi**). Tiene la partícula *na* como primer miembro. Ej., *natthi etassa puttā ti aputtako*, no tiene hijos, entonces es (un hombre) sin hijos. (Rū. §352 (p. 205))","en":"**nanipāta-pubbapada**, one of the 9 kinds of relative compounds (**bahubbīhi**). It has the particle *na* as first member. E.g., *natthi etassa puttā ti aputtako*, he has no sons, so he is (a man) without sons. (Rū. §352 (p. 205))"},"L":"1102","def":"nanipāta-pubbapada","id":"bahubbihi-nanipata-pubbapada"},{"tipo":"p","texto":{"es":"Otros ejemplos (Rū., p. 205):","en":"Other examples (Rū., p. 205):"},"L":"1102b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"bahubbihi-l1102b"},{"tipo":"interlineal","origen":"par","compuesto":"asamo","traduccion":{"es":"el Sublime, que no tiene igual","en":"the Blessed One, who has no equal"},"viggaha":[{"p":"natthi","g":{"es":"no hay","en":"there is not"}},{"p":"etassa","g":{"es":"de éste","en":"of this one"}},{"p":"samo","g":{"es":"igual","en":"equal"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"asamo Bhagavā","g":{"es":"el Sublime, que no tiene igual","en":"the Blessed One, who has no equal"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"natthi (no hay) etassa (de éste) samo (igual) ti (por lo tanto) asamo Bhagavā (el Sublime, que no tiene igual).","en":"natthi (there is not) etassa (of this one) samo (equal) ti (therefore) asamo Bhagavā (the Blessed One, who has no equal)."},"L":"1102d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1102e","anexos":[{"es":"Na pasa a a por «Attaṃ n’ assa tappurise» (Kacc. §333), tomado aparte (yogavibhāga).","en":"Na becomes a by “Attaṃ n’ assa tappurise” (Kacc. §333), taken separately (yogavibhāga).","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"1102f"}],"id":"c-asamo"},{"tipo":"interlineal","origen":"par","compuesto":"anuttaro","traduccion":{"es":"uno que no tiene superior","en":"one who has no superior"},"viggaha":[{"p":"natthi","g":{"es":"no hay","en":"there is not"}},{"p":"etassa","g":{"es":"de éste","en":"of this one"}},{"p":"uttaro","g":{"es":"superior","en":"superior"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"anuttaro","g":{"es":"uno que no tiene superior","en":"one who has no superior"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"natthi (no hay) etassa (de éste) uttaro (superior) ti (por lo tanto) anuttaro (uno que no tiene superior).","en":"natthi (there is not) etassa (of this one) uttaro (superior) ti (therefore) anuttaro (one who has no superior)."},"L":"1102h","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1102i","anexos":[{"es":"Ante vocal, na pasa a an por «Sare an» (Kacc. §334). «Lokavidū anuttaro purisadammasārathi», D. i 46 (PTS i 49).","en":"Before a vowel, na becomes an by “Sare an” (Kacc. §334). “Lokavidū anuttaro purisadammasārathi”, D. i 46 (PTS i 49).","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"1102j"}],"id":"c-anuttaro"},{"tipo":"p","texto":{"es":"**saha-pubbapada**, una de las 9 clases de compuestos relativos (**bahubbīhi**). Tiene la partícula *saha* como primer miembro. Este tipo de compuesto tiene la primera inflexión. Ej., *saha hetunā yo vattate ti sahetuko*, aquello que surge con una raíz se denomina con raíz. (Rū. §352 (pp. 205–206))","en":"**saha-pubbapada**, one of the 9 kinds of relative compounds (**bahubbīhi**). It has the particle *saha* as first member. This type of compound has the first inflection. E.g., *saha hetunā yo vattate ti sahetuko*, that which arises with a root is designated as having a root. (Rū. §352 (pp. 205–206))"},"L":"1104","def":"saha-pubbapada","id":"bahubbihi-saha-pubbapada"},{"tipo":"p","texto":{"es":"Otros ejemplos (Rū., pp. 205–206). En sahetuko, saha pasa a sa por «Tesu vuddhi…» (Kacc. §404) y se añade ‘ka’ por «Kvaci samāsantagatānam akāranto» (Kacc. §337); también es correcto sahetu. «Hetu c’ eva sahetuko ca», Dhs. 218 (PTS p. 192).","en":"Other examples (Rū., pp. 205–206). In sahetuko, saha becomes sa by “Tesu vuddhi…” (Kacc. §404) and ‘ka’ is added by “Kvaci samāsantagatānam akāranto” (Kacc. §337); sahetu is also correct. “Hetu c’ eva sahetuko ca”, Dhs. 218 (PTS p. 192)."},"L":"1104b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"bahubbihi-l1104b"},{"tipo":"interlineal","origen":"par","compuesto":"sappītikā","traduccion":{"es":"acompañados de pīti","en":"accompanied by pīti"},"viggaha":[{"p":"saha","g":{"es":"con","en":"with"}},{"p":"pītiyā","g":{"es":"pīti","en":"pīti"}},{"p":"ime","g":{"es":"éstos","en":"these"}},{"p":"vattanti","g":{"es":"surgen","en":"arise"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"sappītikā","g":{"es":"acompañados de pīti","en":"accompanied by pīti"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"saha (con) pītiyā (pīti) ime (éstos) vattanti (surgen) ti (por lo tanto) sappītikā (acompañados de pīti).","en":"saha (with) pītiyā (pīti) ime (these) vattanti (arise) ti (therefore) sappītikā (accompanied by pīti)."},"L":"1104d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1104e","anexos":[{"es":"«Katame dhammā sappītikā?», Dhs. 252 (PTS p. 222).","en":"“Katame dhammā sappītikā?”, Dhs. 252 (PTS p. 222).","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"1104f"}],"id":"c-sappitika"},{"tipo":"interlineal","origen":"par","compuesto":"samūluddhato","traduccion":{"es":"un árbol arrancado de raíz","en":"a tree pulled up by the root"},"viggaha":[{"p":"saha","g":{"es":"con","en":"with"}},{"p":"mūlena","g":{"es":"la raíz","en":"the root"}},{"p":"uddhato","g":{"es":"arrancado","en":"pulled up"}},{"p":"samūluddhato rukkho","g":{"es":"un árbol arrancado de raíz","en":"a tree pulled up by the root"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"saha (con) mūlena (la raíz) uddhato (arrancado) samūluddhato rukkho (un árbol arrancado de raíz).","en":"saha (with) mūlena (the root) uddhato (pulled up) samūluddhato rukkho (a tree pulled up by the root)."},"L":"1104h","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1104i","id":"c-samuluddhato"},{"tipo":"p","texto":{"es":"**upamāna-pubbapada**, una de las 9 clases de compuestos relativos (**bahubbīhi**). Tiene como primer miembro una palabra de comparación. Este compuesto está en la primera y sexta inflexión. Ej., *kāko viya sūro ayaṃ iti kākasūro*, éste es audaz como un cuervo, entonces se llama \"audaz como un cuervo\". (Rū. §352 (p. 206))","en":"**upamāna-pubbapada**, one of the 9 kinds of relative compounds (**bahubbīhi**). It has a word of comparison as first member. This compound is in the first and the sixth inflection. E.g., *kāko viya sūro ayaṃ iti kākasūro*, this one is bold like a crow, so he is called “bold as a crow”. (Rū. §352 (p. 206))"},"L":"1106","def":"upamāna-pubbapada","id":"bahubbihi-upamana-pubbapada"},{"tipo":"p","texto":{"es":"Otros ejemplos (Rū., p. 206; Kacc. §328):","en":"Other examples (Rū., p. 206; Kacc. §328):"},"L":"1106b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"bahubbihi-l1106b"},{"tipo":"interlineal","origen":"par","compuesto":"nigrodhaparimaṇḍalo","traduccion":{"es":"el príncipe cuya circunferencia es como la del baniano","en":"the prince whose circumference is like that of the banyan tree"},"viggaha":[{"p":"nigrodho","g":{"es":"el baniano","en":"the banyan tree"}},{"p":"iva","g":{"es":"como","en":"like"}},{"p":"parimaṇḍalo","g":{"es":"circunferencia","en":"circumference"}},{"p":"yo","g":{"es":"el","en":"the"}},{"p":"rājakumāro","g":{"es":"príncipe","en":"prince"}},{"p":",","g":{"es":"","en":""}},{"p":"so ’yaṃ","g":{"es":"éste","en":"this one"}},{"p":"nigrodhaparimaṇḍalo rājakumāro","g":{"es":"el príncipe cuya circunferencia es como la del baniano","en":"the prince whose circumference is like that of the banyan tree"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"nigrodho (el baniano) iva (como) parimaṇḍalo (circunferencia) yo (el) rājakumāro (príncipe), so ’yaṃ (éste) nigrodhaparimaṇḍalo rājakumāro (el príncipe cuya circunferencia es como la del baniano).","en":"nigrodho (the banyan tree) iva (like) parimaṇḍalo (circumference) yo (the) rājakumāro (prince), so ’yaṃ (this one) nigrodhaparimaṇḍalo rājakumāro (the prince whose circumference is like that of the banyan tree)."},"L":"1106d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1106e","anexos":[{"es":"En la primera inflexión. D. ii 15 (PTS ii 18).","en":"In the first inflection. D. ii 15 (PTS ii 18).","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"1106f"}],"id":"c-nigrodhaparimandalo"},{"tipo":"interlineal","origen":"par","compuesto":"suvaṇṇavaṇṇo","traduccion":{"es":"el Sublime, cuya tez es como el color dorado","en":"the Blessed One, whose complexion is like the golden colour"},"viggaha":[{"p":"suvaṇṇavaṇṇo","g":{"es":"el color dorado","en":"the golden colour"}},{"p":"viya","g":{"es":"como","en":"like"}},{"p":"vaṇṇo","g":{"es":"tez","en":"complexion"}},{"p":"yassa","g":{"es":"de este","en":"of this"}},{"p":"Bhagavato","g":{"es":"Sublime","en":"Blessed One"}},{"p":",","g":{"es":"","en":""}},{"p":"so ’yaṃ","g":{"es":"éste","en":"this one"}},{"p":"suvaṇṇavaṇṇo Bhagavā","g":{"es":"el Sublime, cuya tez es como el color dorado","en":"the Blessed One, whose complexion is like the golden colour"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"suvaṇṇavaṇṇo (el color dorado) viya (como) vaṇṇo (tez) yassa (de este) Bhagavato (Sublime), so ’yaṃ (éste) suvaṇṇavaṇṇo Bhagavā (el Sublime, cuya tez es como el color dorado).","en":"suvaṇṇavaṇṇo (the golden colour) viya (like) vaṇṇo (complexion) yassa (of this) Bhagavato (Blessed One), so ’yaṃ (this one) suvaṇṇavaṇṇo Bhagavā (the Blessed One, whose complexion is like the golden colour)."},"L":"1106h","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1106i","anexos":[{"es":"En la sexta inflexión, con elisión del último miembro (uttarapadalopa). «Kumāro suvaṇṇavaṇṇo kañcanasannibhattaco», D. ii 15 (PTS ii 17).","en":"In the sixth inflection, with elision of the last member (uttarapadalopa). “Kumāro suvaṇṇavaṇṇo kañcanasannibhattaco”, D. ii 15 (PTS ii 17).","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"1106j"}],"id":"c-suvannavanno"},{"tipo":"p","texto":{"es":"**saṅkhyobhayapada**, una de las 9 clases de compuestos relativos (**bahubbīhi**). En este compuesto los miembros son numerales. (Rū. §352 (pp. 206–207))","en":"**saṅkhyobhayapada**, one of the 9 kinds of relative compounds (**bahubbīhi**). In this compound the members are numerals. (Rū. §352 (pp. 206–207))"},"L":"1108","def":"saṅkhyobhayapada","id":"bahubbihi-sankhyobhayapada"},{"tipo":"p","texto":{"es":"Ejemplos (Rū., pp. 206–207). Este compuesto está en el significado de «vā» (o):","en":"Examples (Rū., pp. 206–207). This compound is in the meaning of “vā” (or):"},"L":"1108b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Tipiṭaka","id":"bahubbihi-l1108b"},{"tipo":"interlineal","origen":"par","compuesto":"dvattipattā","traduccion":{"es":"dos o tres cuencos","en":"two or three bowls"},"viggaha":[{"p":"dve","g":{"es":"dos","en":"two"}},{"p":"vā","g":{"es":"o","en":"or"}},{"p":"tayo","g":{"es":"tres","en":"three"}},{"p":"vā","g":{"es":"o","en":"or"}},{"p":"pattā","g":{"es":"cuencos","en":"bowls"}},{"p":"dvattipattā","g":{"es":"dos o tres cuencos","en":"two or three bowls"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"dve (dos) vā (o) tayo (tres) vā (o) pattā (cuencos) dvattipattā (dos o tres cuencos).","en":"dve (two) vā (or) tayo (three) vā (or) pattā (bowls) dvattipattā (two or three bowls)."},"L":"1108d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Tipiṭaka","L_resolucion":"1108e","anexos":[{"es":"La vocal final de dvi pasa a ā por «Dv’-ek’-aṭṭhānam ākāro vā» (Kacc. §383) y luego se abrevia (Rū.); la duplicación de t (dvatti-) no la nombra Rūpasiddhi. Cf. «dvattipattapūrā paṭiggahetabbā», V. ii 108 (PTS Vin iv 80).","en":"The final vowel of dvi becomes ā by “Dv’-ek’-aṭṭhānam ākāro vā” (Kacc. §383) and is then shortened (Rū.); the doubling of t (dvatti-) is not mentioned by Rūpasiddhi. Cf. “dvattipattapūrā paṭiggahetabbā”, V. ii 108 (PTS Vin iv 80).","fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Tipiṭaka","L":"1108f"}],"id":"c-dvattipatta"},{"tipo":"interlineal","origen":"par","compuesto":"chappañcavācā","traduccion":{"es":"cinco o seis palabras","en":"five or six words"},"viggaha":[{"p":"cha","g":{"es":"seis","en":"six"}},{"p":"vā","g":{"es":"o","en":"or"}},{"p":"pañca","g":{"es":"cinco","en":"five"}},{"p":"vā","g":{"es":"o","en":"or"}},{"p":"vācā","g":{"es":"palabras","en":"words"}},{"p":"chappañcavācā","g":{"es":"cinco o seis palabras","en":"five or six words"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"cha (seis) vā (o) pañca (cinco) vā (o) vācā (palabras) chappañcavācā (cinco o seis palabras).","en":"cha (six) vā (or) pañca (five) vā (or) vācā (words) chappañcavācā (five or six words)."},"L":"1108h","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Tipiṭaka","L_resolucion":"1108i","id":"c-chappancavaca"},{"tipo":"p","texto":{"es":"Aquí la otra palabra es «vā», y su significado indeterminado es el significado de la otra palabra; por eso es compuesto relativo (Sad. (Smith p. 762); Nir. 244).","en":"Here the other word is “vā”, and its indeterminate meaning is the meaning of the other word; that is why it is a relative compound (Sad. (Smith p. 762); Nir. 244)."},"L":"1108k","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Tipiṭaka","id":"bahubbihi-l1108k"},{"tipo":"p","texto":{"es":"**disantarāḷattha**, una de las 9 clases de compuestos relativos (**bahubbīhi**). Se refiere a los puntos intermedios de la brújula. Ej., *pubbassā ca dakkhiṇassā ca disāya yad antarāḷaṃ sā ’yaṃ pubbadakkhiṇā vidisā*, aquello que está entre la dirección este y sur, ésta es la dirección intermedia del sureste. (Rū. §352 (p. 207))","en":"**disantarāḷattha**, one of the 9 kinds of relative compounds (**bahubbīhi**). It refers to the intermediate points of the compass. E.g., *pubbassā ca dakkhiṇassā ca disāya yad antarāḷaṃ sā ’yaṃ pubbadakkhiṇā vidisā*, that which lies between the east and the south directions, this is the intermediate direction of the south-east. (Rū. §352 (p. 207))"},"L":"1110","def":"disantarāḷattha","id":"bahubbihi-disantaralattha"},{"tipo":"p","texto":{"es":"Otros ejemplos (Rū., p. 207): pubbuttarā (noreste), aparadakkhiṇā (suroeste), pacchimuttarā (noroeste). Aquí no hay tratamiento del femenino como masculino (pumbhāvātidesa), porque no sigue una palabra que tenga el mismo locus; la vocal final del primer miembro se abrevia por Kacc. §403 (Rū. §354). Si se entiende «dakkhiṇā ca sā pubbā ca», es compuesto adjetivo (kammadhāraya), y entonces sí lo hay, y también la declinación pronominal: dakkhiṇapubbassā, dakkhiṇapubbassaṃ (Rū., p. 207).","en":"Other examples (Rū., p. 207): pubbuttarā (north-east), aparadakkhiṇā (south-west), pacchimuttarā (north-west). Here there is no treatment of the feminine as masculine (pumbhāvātidesa), because no word having the same locus follows; the final vowel of the first member is shortened by Kacc. §403 (Rū. §354). If “dakkhiṇā ca sā pubbā ca” is understood, it is an adjectival compound (kammadhāraya), and then that treatment does occur, and so does the pronominal declension: dakkhiṇapubbassā, dakkhiṇapubbassaṃ (Rū., p. 207)."},"L":"1110b","i
