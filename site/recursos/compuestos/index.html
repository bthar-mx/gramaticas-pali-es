<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<title>Compuestos (samāsa)</title>
<meta name="version" content="0.6">
<meta name="version-date" content="2026-10-18">
<meta name="description" content="Los compuestos (samāsa) del pāḷi en sus seis clases —abyayībhāva, kammadhāraya, digu, tappurisa, bahubbīhi y dvanda—, con la resolución (viggaha) de cada ejemplo palabra por palabra: el documento de Bhikkhu Nandisena (2004–2005), en revisión por IEBH. Con un modo de práctica y una guía para reconocer la clase.">
<!-- cabecera:inicio -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="../../assets/base.css?v=70c73f6b" rel="stylesheet"/>
<link href="../../assets/recursos.css?v=70c73f6b" rel="stylesheet"/>
<!-- cabecera:fin -->
<style>
/* La paleta, la letra, el bloque del título, el índice lateral, la barra
   de mandos, el ↑ y el pie son comunes: site/assets/base.css y
   site/assets/recursos.css (etapa 4b). Aquí, lo que sólo tiene esta página. */
html{scroll-padding-top:calc(var(--cabecera-h,0px) + var(--barh,74px) + 12px)}
main.wrap{min-height:40vh}
.sidebar a{padding:3px 18px;font-size:14px;line-height:1.35}
.sidebar a.n3{padding-left:32px;font-size:13.5px;color:var(--text2)}
.sidebar a i{font-style:italic}
.sidebar a .sd{display:block;font-size:12px;line-height:1.3;color:var(--text3);margin-top:1px;white-space:normal}
.sidebar a.on .sd{color:inherit;opacity:.8}
.sidebar a .sn{font:600 10px/1 var(--mono);color:var(--text3);margin-right:6px}
.sidebar a[hidden]{display:none}
.sb-vacio{padding:6px 18px;font-size:13.5px;color:var(--text2)}

/* el aviso y el enlace a la guía */
.aviso{margin:14px 0 0;max-width:70ch;font-size:14.5px;color:var(--text2);border-left:2px solid var(--rakta);padding-left:10px}
.guia-l{margin:10px 0 0;font-size:15px}
.guia-l a{color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor}
.guia-l a:hover{color:var(--haritala)}

/* las pestañas: el texto (introducción, seis clases, resumen) y las dos
   herramientas (practicar, ¿qué compuesto es?) */
.tabs-fila{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;margin:18px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0}
.tabs.herr{margin-left:auto}
.tabs button{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid var(--border);background:var(--bg2);
  color:var(--text2);padding:6px 10px;border-radius:2px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.tabs button .tn{color:var(--haritala)}
.tabs button .tp{font-family:var(--serif);font-style:italic;font-weight:400;font-size:14px;letter-spacing:0;color:var(--text)}
.tabs button .te{font-weight:500}
.tabs button[aria-selected=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs button[aria-selected=true] .tn,.tabs button[aria-selected=true] .tp{color:var(--bg)}
.tabs button .hits{font-size:10px;color:var(--accent);min-width:0}
.tabs button .hits:empty{display:none}
.tabs button[aria-selected=true] .hits{color:var(--bg)}
.tabs button.cero{background:transparent;border-style:dashed}
.tabs button.cero,.tabs button.cero .tn,.tabs button.cero .tp,.tabs button.cero .hits{color:var(--text3)}
.tabs.herr button{border-style:dashed;border-color:var(--border2)}
.tabs.herr button .ic{color:var(--haritala);font-size:12px}
.tabs.herr button[aria-selected=true]{border-style:solid}
.tabs.herr button[aria-selected=true] .ic{color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* la cabecera de una clase */
.clcab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px;align-items:end;margin:30px 0 8px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.clcab .num{grid-row:1/3;font:700 64px/0.85 var(--serif);color:var(--haritala);opacity:.9}
.clcab h2{margin:0;font:italic 700 34px/1.1 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
.clcab .sub{margin:4px 0 0;font-size:17px;color:var(--text2)}
.clcab .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:12px;font:11px/1.4 var(--mono);color:var(--text2)}
.ref-k{color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:1px 9px;background:var(--bg2)}
.ref-k:hover{background:var(--accent-bg)}
.clcab .meta .dato{padding:2px 0}

/* los bloques de texto */
.bl{margin:12px 0 0;max-width:76ch;line-height:1.62}
a.k{color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor}
h3.st,h4.st{scroll-margin-top:calc(var(--cabecera-h,0px) + var(--barh,74px) + 12px);position:relative}
h3.st{margin:38px 0 4px;font:700 21px/1.3 var(--serif);max-width:60ch}
h3.st::before{content:'';display:block;width:34px;height:2px;background:var(--haritala);margin-bottom:12px}
h4.st{margin:28px 0 2px;font:600 17.5px/1.35 var(--serif);color:var(--haritala);padding-left:12px;border-left:2px solid var(--haritala)}
.st .pal{font-style:italic;color:var(--text2);font-weight:400}
.st .ref-h{font:400 13.5px/1.4 var(--sans);color:var(--text3);white-space:normal}
.todo-iebh .ej-w>.chip.iebh{display:none}
a.ancla{position:absolute;left:-22px;top:auto;opacity:0;color:var(--text3);text-decoration:none;font:400 15px/1 var(--mono);padding:2px}
.st:hover a.ancla,.il:hover a.ancla,.def:hover a.ancla{opacity:1}
ul.lst{margin:10px 0 0;padding-left:22px;max-width:74ch}
ul.lst li{margin:3px 0;line-height:1.5}
dl.pares{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:6px 22px;margin:12px 0 0;max-width:74ch;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:3px}
dl.pares dt{font:600 13px/1.5 var(--sans);color:var(--text2)}
dl.pares dd{margin:0;line-height:1.5}
.def{position:relative;margin:18px 0 0;max-width:76ch;padding:12px 16px;border-left:3px solid var(--haritala);background:var(--bg2);line-height:1.6;scroll-margin-top:calc(var(--cabecera-h,0px) + var(--barh,74px) + 12px)}
.def b:first-child{font-style:italic;font-size:18px}
.vacio-cl{margin:24px 0 0;max-width:66ch;padding:16px 18px;border:1px dashed var(--border2);border-radius:3px;color:var(--text2)}
.vacio-cl p{margin:0 0 8px}
.vacio-cl p:last-child{margin:0}
.chip{display:inline-block;font:600 10px/1.5 var(--mono);letter-spacing:.05em;border-radius:2px;padding:0 6px;vertical-align:2px;margin-left:6px;cursor:help;white-space:nowrap}
.chip.iebh{color:var(--bg2);background:var(--haritala)}
.chip .ck{font-weight:400;letter-spacing:.02em;opacity:.9;margin-left:4px}
/* lo que añade el IEBH: rotulado, pero más callado que el texto de Nandisena */
.bl.iebh{font-size:14.5px;line-height:1.55;color:var(--text2);padding:1px 0 1px 12px;border-left:2px solid var(--border2);max-width:80ch}
.bl.iebh .chip.iebh,.il-anexo .chip.iebh,.ejt .chip.iebh,.gtab .chip.iebh{margin:0 7px 0 0;vertical-align:1px;font-size:9px;padding:0 5px;opacity:.85}
.def.iebh{background:none;border-left-color:var(--border2)}
h3.st.iebh::before{background:var(--border2)}
.il.iebh{border-style:dashed}
.il.iebh .il-cab{padding-right:46px}
.il-anexo{margin:8px 0 0;font-size:13.5px;line-height:1.45;color:var(--text2)}
.il .il-anexo .chip{position:static}
.ilgrid>.bl.iebh{grid-column:1/-1;margin:2px 0}
.verso-u .verso{margin:8px 0 6px 18px;font-style:italic;font-size:16px;line-height:1.6;color:var(--text)}
.verso-u .verso-t{margin:0}
.td-iebh{box-shadow:inset 2px 0 0 var(--border2)}
.ejt tr.iebh td.re,.ejt tr.iebh td.co,.ejt tr.iebh td.tr{opacity:.88}
.ejt tr.iebh td:first-child{box-shadow:inset 2px 0 0 var(--border2)}
.fuente.chica{font-size:12.5px;border-left-color:var(--border2);color:var(--text3)}
.solo-iebh{margin:18px 0 0;max-width:72ch;font-size:14.5px;color:var(--text2);padding:10px 14px;border:1px dashed var(--border2);border-radius:3px}
.solo-iebh .chip{margin:0 4px 0 0}
/* en una sección que sólo tiene texto del IEBH (dvanda), el texto va a tamaño normal */
.todo-iebh .bl.iebh{font-size:inherit;line-height:1.62;color:var(--text);border-left:0;padding-left:0;max-width:76ch}
.todo-iebh .bl.iebh>.chip.iebh,.todo-iebh h3.st>.chip.iebh,.todo-iebh h4.st>.chip.iebh{display:none}
.todo-iebh h3.st.iebh::before{background:var(--haritala)}
.fuente{margin:6px 0 0;font-size:13.5px;color:var(--text2);border-left:2px solid var(--haritala);padding-left:9px;max-width:76ch}
.fuente b{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--haritala);margin-right:6px}
sup.fn a{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:.72em;padding:0 1px}

/* la resolución palabra por palabra */
.ilgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin:14px 0 0}
.il{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:14px 16px 13px;min-width:0;
  scroll-margin-top:calc(var(--cabecera-h,0px) + var(--barh,74px) + 12px);transition:border-color .15s,box-shadow .15s}
.il.ancho{grid-column:1/-1}
.il:hover{border-color:var(--border2)}
.il.foco{border-color:var(--haritala);box-shadow:0 0 0 2px var(--hl)}
.il-cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding-right:18px}
.il-c{font:italic 700 23px/1.2 var(--serif);color:var(--text);overflow-wrap:anywhere}
.il-t{font-size:16px;line-height:1.4;color:var(--text2)}
.il-t::before{content:'«'}
.il-t::after{content:'»'}
.il-v{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 14px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--border)}
.il-v .lv{flex:0 0 100%;font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:-2px}
.tk{display:inline-flex;flex-direction:column;min-width:0;max-width:100%}
.tk .p{font:italic 17.5px/1.25 var(--serif);color:var(--accent);overflow-wrap:anywhere}
.tk .g{margin-top:3px;padding-top:3px;border-top:1px solid var(--border);font:400 12.5px/1.3 var(--sans);color:var(--text2);max-width:20ch}
.tk.sinG .g{border-top-color:transparent}
.tk.sep{margin-left:-10px}
.tk.sep .p{color:var(--text2);font-style:normal}
.tk.r .p{color:var(--haritala);font-weight:700}
.tk.r .g{border-top:2px solid var(--haritala);color:var(--text)}
.il-alt{margin-top:8px}
.il-alt .lv{color:var(--text3)}
.il-resto{margin:8px 0 0;font-size:14.5px;color:var(--text2)}
.il-sin{margin:9px 0 0;font-size:13.5px;color:var(--text3);font-style:italic}
.il .chip{position:absolute;top:10px;right:12px;margin:0}
.il a.ancla{left:auto;right:8px;top:auto;bottom:6px;font-size:13px}
.il.glosa{background:none;border-style:dashed;justify-self:start;max-width:100%}
.il.glosa .il-v{margin-top:0;padding-top:0;border-top:0}

/* ejemplos en tabla: sentido · resolución · compuesto · traducción */
.ejt{width:100%;border-collapse:collapse;margin:14px 0 0;font-size:15.5px}
.ejt th{text-align:left;font:600 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text2);padding:8px 10px;border-bottom:1px solid var(--text2);vertical-align:bottom}
.ejt td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:baseline}
.ejt tr:has(+ tr.sigue) td{border-bottom-style:dotted}
.ejt td.se{color:var(--text2);font-size:14.5px;width:22%}
.ejt td.re{font-style:italic;color:var(--accent)}
.ejt td.co{font-style:italic;font-weight:700;white-space:nowrap}
.ejt td.tr{color:var(--text2)}
.ejt tr.grupo td{border-top:1px solid var(--border2)}
.ejt tbody tr:target td,.ejt tbody tr.foco td{background:var(--hl)}
@media (max-width:700px){
  .ejt thead{display:none}
  .ejt,.ejt tbody,.ejt tr,.ejt td{display:block;width:auto}
  .ejt tr{display:flex;flex-wrap:wrap;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border)}
  .ejt td.se{order:0;flex:0 0 100%}.ejt td.co{order:1}.ejt td.tr{order:2}.ejt td.re{order:3;flex:0 0 100%}
  .ejt td{border:0;padding:0}
  .ejt td.se{width:auto;font:600 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--haritala);margin-bottom:4px}
  .ejt td.se:empty{display:none}
  .ejt td.co{font-size:19px;white-space:normal;display:inline}
  .ejt td.tr{display:inline;margin-left:8px}
  .ejt td.tr:not(:empty)::before{content:'«'}
  .ejt td.tr:not(:empty)::after{content:'»'}
  .ejt td.re{margin-top:4px}
  .ejt td.re::before{content:'= ';font-style:normal;color:var(--text3)}
  .ejt tr.grupo td{border-top:0}
}

/* paradigmas y tablas */
.ptab{border-collapse:collapse;font-size:15.5px;margin:14px 0 0;min-width:min(100%,420px)}
.ptab th{text-align:left;font:600 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text2);padding:7px 12px;border-bottom:1px solid var(--text2)}
.ptab td{padding:6px 12px;border-bottom:1px solid var(--border);vertical-align:baseline}
.ptab td:first-child{font:500 12px/1.4 var(--mono);color:var(--text2);white-space:nowrap}
.ptab td.f{font-style:italic}
.gtab{border-collapse:collapse;font-size:15px;margin:14px 0 0;width:100%}
.gtab td,.gtab th{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:baseline}
.gtab th{font:600 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text2);border-bottom-color:var(--text2)}
.gtab td.vacia{color:var(--text3)}
.gtab td a{color:var(--accent);text-decoration:none}

/* las notas de cada pestaña */
.gnotas{margin:34px 0 0;padding:10px 0 0;border-top:1px dashed var(--border);font-size:14.5px;color:var(--text2);max-width:78ch}
.gnotas h3{font:600 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;color:var(--text2)}
.gnotas p{margin:4px 0;line-height:1.55;scroll-margin-top:calc(var(--cabecera-h,0px) + var(--barh,74px) + 12px)}
.gnotas p:target{background:var(--hl)}
.gnotas .nn{font:600 10.5px/1 var(--mono);color:var(--accent);margin-right:7px}
.gnotas .nadd{display:block;margin:4px 0 0 18px;font-size:13.5px}
.gnotas .chip.iebh{margin:0 6px 0 0;font-size:9px;padding:0 5px;vertical-align:1px;opacity:.85}

/* el mapa de las clases (introducción) */
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;margin:18px 0 0}
.mapa a.mc{display:block;text-decoration:none;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:14px 16px 12px;transition:border-color .15s}
.mapa a.mc:hover{border-color:var(--haritala)}
.mc .mn{font:700 13px/1 var(--mono);color:var(--haritala)}
.mc .mp{display:block;margin-top:6px;font:italic 700 21px/1.2 var(--serif)}
.mc .ms{display:block;margin-top:2px;font-size:15px;color:var(--text2)}
.mc .mx{display:block;margin-top:10px;font:11px/1.5 var(--mono);color:var(--text2)}
.mc .mv{display:block;margin-top:8px;font-size:14px;color:var(--text2);border-top:1px dashed var(--border);padding-top:8px}
.mc .mv i{color:var(--accent)}
h2.sec{margin:34px 0 0;font:700 22px/1.25 var(--serif)}
h2.sec small{display:block;font:400 15px/1.4 var(--serif);color:var(--text2);margin-top:2px}

/* practicar */
.pr{margin:22px 0 0;max-width:820px}
.pr-cab{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.pr-cab h2{margin:0;font:700 26px/1.2 var(--serif)}
.pr-cab p{margin:4px 0 0;color:var(--text2);max-width:58ch;font-size:15.5px}
.pr-marc{display:flex;gap:18px;align-items:baseline;font:12px/1.3 var(--mono);color:var(--text2)}
.pr-marc b{font:700 24px/1 var(--serif);color:var(--text);margin-right:4px}
.pr-marc button{font:600 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;background:none;color:var(--text2);border:1px solid var(--border);border-radius:2px;padding:5px 7px;cursor:pointer}
.pr-op{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 0}
.pr-op .lbl{margin-right:2px}
.pr-filtro button .tp{font-family:var(--serif);font-style:italic;font-weight:400;font-size:13px;letter-spacing:0;text-transform:none}
.pr-tarj{margin:16px 0 0;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:26px 26px 22px;box-shadow:0 6px 24px var(--shadow)}
.pr-q{font:600 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin:0}
.pr-c{margin:12px 0 0;font:italic 700 clamp(30px,6vw,46px)/1.1 var(--serif);overflow-wrap:anywhere;color:var(--text)}
.pr-t{margin:6px 0 0;font-size:18px;color:var(--text2)}
.pr-t:empty{display:none}
.pr-ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px;margin:20px 0 0}
.pr-ops button{display:flex;align-items:baseline;gap:9px;text-align:left;font:15px/1.3 var(--serif);color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:11px 13px;cursor:pointer;min-height:44px}
.pr-ops button .n{font:700 12px/1 var(--mono);color:var(--haritala)}
.pr-ops button .tp{font-style:italic;font-weight:700}
.pr-ops button .te{color:var(--text2);font-size:13.5px}
.pr-ops button:hover:not(:disabled){border-color:var(--text2)}
.pr-ops button:disabled{cursor:default}
.pr-ops button.bien{border-color:var(--marakata);background:var(--green-bg);box-shadow:inset 3px 0 0 var(--marakata)}
.pr-ops button.mal{border-color:var(--rakta);background:var(--hl-ce);box-shadow:inset 3px 0 0 var(--rakta)}
.pr-ops button.atenua{opacity:.5}
.pr-esc{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.pr-esc input{flex:1 1 280px;min-width:0;font:italic 18px/1.3 var(--serif);color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:2px;padding:10px 12px}
.pr-esc input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--bg2);border:1px solid var(--accent);border-radius:2px;padding:11px 15px;cursor:pointer;min-height:42px}
.btn.sec{background:var(--bg);color:var(--text);border-color:var(--border2)}
.btn:focus-visible{outline:2px solid var(--haritala);outline-offset:2px}
.pr-res{margin:20px 0 0;padding:16px 0 0;border-top:1px solid var(--border)}
.pr-ver{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px;font-size:17px}
.pr-ver .v{font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:2px}
.pr-ver .v.bien{background:var(--marakata);color:var(--bg2)}
.pr-ver .v.mal{background:var(--rakta);color:var(--bg2)}
.pr-ver .v.casi{background:var(--haritala);color:var(--bg2)}
.pr-sol{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:15.5px;margin:0 0 6px}
.pr-sol dt{font:600 10px/1.9 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}
.pr-sol dd{margin:0}
.pr-sol dd i{color:var(--accent)}
.pr-res .il{margin-top:10px;background:var(--bg)}
.pr-acc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 0}
.pr-acc a{color:var(--accent);font-size:15px}
.pr-tuya{font-style:italic;color:var(--text2)}
.pr-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr));gap:8px;margin:18px 0 0}
.pr-stats div{font:11px/1.4 var(--mono);color:var(--text2)}
.pr-stats i{font-family:var(--serif);font-size:14px;color:var(--text)}
.pr-stats .prb{display:block;position:relative;height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}
.pr-stats .prb span{position:absolute;left:0;top:0;bottom:0;background:var(--marakata)}
.pr-teclas{margin:10px 0 0;font:11px/1.4 var(--mono);color:var(--text3)}
.pr-nada{padding:30px 0;color:var(--text2)}
kbd{font:600 10px/1 var(--mono);border:1px solid var(--border2);border-bottom-width:2px;border-radius:3px;padding:1px 4px;background:var(--bg)}

/* ¿qué compuesto es? */
.cual{margin:22px 0 0;max-width:780px}
.cual h2{margin:0;font:700 26px/1.2 var(--serif)}
.cual .intro{margin:6px 0 0;color:var(--text2);max-width:62ch}
.cual .aviso-g{margin:10px 0 0;font-size:13.5px;color:var(--text2);border-left:2px solid var(--haritala);padding-left:9px;max-width:62ch}
.cual-prueba{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 0;padding:12px 14px;border:1px dashed var(--border2);border-radius:3px}
.cual-prueba .il-c{font-size:21px}
.cual-prueba .il-t{font-size:15px}
.cual-prueba .vacio{color:var(--text2);font-size:15px}
.cual-prueba .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);flex-basis:100%}
.cual .cual-prueba{margin:10px 0 14px}
.camino{list-style:none;margin:18px 0 0;padding:0;counter-reset:paso}
.camino li{position:relative;margin:0 0 10px;padding:0 0 0 42px;counter-increment:paso}
.camino li::before{content:counter(paso);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:700 12px/1 var(--mono);background:var(--bg2);border:1px solid var(--border2);color:var(--text2)}
.camino li.hecho{opacity:.72}
.camino li.hecho::before{background:var(--text2);color:var(--bg2);border-color:var(--text2)}
.camino li.ahora::before{background:var(--haritala);color:var(--bg2);border-color:var(--haritala)}
.camino .pq{margin:0;font-size:17.5px;line-height:1.45}
.camino .ej{margin:6px 0 0;font-size:14.5px;color:var(--text2)}
.camino .ej i{color:var(--accent)}
.camino .resp{margin-left:8px;font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--haritala)}
.camino .sino{display:flex;gap:8px;margin:10px 0 2px}
.camino .sino button{min-width:84px}
.cual-fin{margin:6px 0 0 42px;padding:18px 20px;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--haritala);border-radius:3px}
.cual-fin .lbl{display:block}
.cual-fin h3{margin:4px 0 0;font:italic 700 28px/1.15 var(--serif)}
.cual-fin h3 small{display:block;font:400 16px/1.4 var(--serif);font-style:normal;color:var(--text2);margin-top:2px}
.cual-fin p{margin:10px 0 0;line-height:1.55}
.cual-fin .ojo{font-size:14.5px;color:var(--text2)}
.cual-fin .ojo b{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--haritala);margin-right:6px}
.cual-fin .cmp{margin-top:12px;font-size:15px}
.cual-fin .cmp.bien{color:var(--marakata)}
.cual-fin .cmp.mal{color:var(--rakta)}
.cual-acc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 0}
.cual-acc a{color:var(--accent)}

footer.rc-pie p{max-width:78ch}
.vacia-s{color:var(--text3)}

  .tabs button .te{display:none}

  dl.pares{grid-template-columns:1fr;gap:0 0;padding:10px 12px}

}

<script>
(function(){
const D={"meta":{"version":"0.6","fecha":"2026-10-18","estado":{"es":"Borrador revisado (pendiente de aprobación del IEBH)","en":"Revised draft (pending IEBH approval)"},"atribucion":{"es":"Bhikkhu Nandisena, edición revisada por IEBH","en":"Bhikkhu Nandisena, edited by IEBH"},"titulo_doc":"Compuesto (samāsa)","fuente":"texto-revisado.txt","nota_version":{"es":"Revisión del IEBH completa: todas las propuestas aplicadas según el consejo verificado (correcciones, referencias y añadidos rotulados IEBH); el género de cada clase, según la nota de Nandisena «Qué género tienen cada uno de los seis compuestos» (2004); el pāḷi citado, con el sandhi en edición moderna según la edición de Kaccāyana del IEBH; edición inglesa de la página, en borrador (sin revisar por el IEBH). v0.5 (2026-10-18): nombres propios con la inserción ‘nu’ (arindamo, vessantaro, taṇhaṅkaro, medhaṅkaro, saraṇaṅkaro, dīpaṅkaro, purindado), con las dos lecturas de las fuentes sobre la elisión de la inflexión. v0.6 (2026-10-18): el otro nombre de los compuestos con miembro precedente, kitanta-samāsa (Glosario de Nandisena; Suttaniddesa).","en":"IEBH review complete: all proposals applied according to the verified advice (corrections, references and additions labelled IEBH); the gender of each class, according to Nandisena’s note «Qué género tienen cada uno de los seis compuestos» (2004); the quoted Pāḷi, with the sandhi in the modern edition according to IEBH’s edition of Kaccāyana; English edition of the page, as a draft (not yet reviewed by IEBH). v0.5 (2026-10-18): proper names with the insertion ‘nu’ (arindamo, vessantaro, taṇhaṅkaro, medhaṅkaro, saraṇaṅkaro, dīpaṅkaro, purindado), with the two readings of the sources on the elision of the inflection. v0.6 (2026-10-18): the other name of the compounds with a preceding member, kitanta-samāsa (Nandisena’s Glosario; Suttaniddesa)."}},"intro":[{"tipo":"p","texto":{"es":"El compuesto (samāsa) se considera como parte del nombre (nāma) porque generalmente es una combinación de nombres que están mutuamente relacionados y porque depende del nombre.[^1]","en":"The compound (samāsa) is regarded as part of the noun (nāma) because it is generally a combination of nouns that are mutually related and because it depends on the noun.[^1]"},"L":"0003","id":"intro-l0003"},{"tipo":"p","texto":{"es":"Rūpasiddhi da dos razones para tratar el compuesto inmediatamente después del nombre: porque depende del nombre (nāmanissitattā) y porque él mismo es nominal (sayañ ca nāmikattā) (Rū., p. 176). En Kaccāyana, el capítulo de compuestos es una sección del capítulo del nombre: «Iti nāma-kappe samāsa-kappo sattamo kaṇḍo».","en":"Rūpasiddhi gives two reasons for treating the compound immediately after the noun: because it depends on the noun (nāmanissitattā) and because it is itself nominal (sayañ ca nāmikattā) (Rū., p. 176). In Kaccāyana, the chapter on compounds is a section of the chapter on the noun: “Iti nāma-kappe samāsa-kappo sattamo kaṇḍo”."},"L":"0003b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"intro-l0003b"},{"tipo":"p","texto":{"es":"Un compuesto es una abreviación de palabras (samāso padasaṅkhepo; Kacc. §316; Rū. §331). Generalmente cada uno de los componentes del compuesto, excepto el último miembro, pierde su inflexión. En *rāja-putto*, hijo del rey, se elide la inflexión del primer miembro *rāja*, rey. Por lo tanto, para poder entender correctamente un compuesto se requiere la \"resolución\" (viggaha, vākya) del mismo en sus partes constituyentes; *rāja-putto*, hijo del rey, se \"resuelve\" en *rañño*, del rey, y *putto*, hijo. Además, la resolución del compuesto permite conocer la clase a la que el compuesto pertenece porque cada clase de compuesto tiene una peculiar forma de resolución.","en":"A compound is an abbreviation of words (samāso padasaṅkhepo; Kacc. §316; Rū. §331). Generally each of the components of the compound, except the last member, loses its inflection. In *rāja-putto*, son of the king, the inflection of the first member *rāja*, king, is elided. Therefore, in order to understand a compound correctly, its “resolution” (viggaha, vākya) into its constituent parts is required; *rāja-putto*, son of the king, is “resolved” into *rañño*, of the king, and *putto*, son. Moreover, the resolution of the compound makes it possible to know the class to which the compound belongs, because each class of compound has a peculiar form of resolution."},"L":"0005","id":"intro-l0005"},{"tipo":"p","texto":{"es":"**La resolución (viggaha).** La resolución, también llamada viggaha-vākya, es la frase desplegada, con la inflexión propia de cada miembro, de la que el compuesto es la abreviación. Moggallāna-pañcikā-ṭīkā (Sāratthavilāsinī) explica el término así: «visesena gayhati ñāyaty anenā ti viggaho … visesena vā gahaṇaṃ viggaho, tadatthaṃ vākyaṃ viggahavākyaṃ», se denomina viggaha porque por medio de él [el significado] se capta y se conoce de manera distinta; o bien viggaha es la captación distinta, y la frase que tiene ese propósito es la viggaha-vākya (Mogg-p-ṭ., pp. 145–146). Rūpasiddhi llama vākya a la expresión no compuesta: «tadaññaṃ vākyam iti ruḷhaṃ», lo otro [lo que no es compuesto] se conoce convencionalmente como vākya (Rū. §331); frente a ella, la forma compuesta se llama vutti (sutta 364; Nir. 261). La misma ṭīkā cita la diferencia entre ambas: «samāse visesanaṃ visessam anupavīsati ekībhavati visesanaṃ, vākye tu visesanaṃ visessato visuṃyevā vatiṭṭhate», en el compuesto el calificativo entra en lo calificado y se hace uno con él; en la frase permanece separado de lo calificado (Mogg-p-ṭ., p. 145).","en":"**The resolution (viggaha).** The resolution, also called viggaha-vākya, is the unfolded phrase, with the proper inflection of each member, of which the compound is the abbreviation. Moggallāna-pañcikā-ṭīkā (Sāratthavilāsinī) explains the term thus: “visesena gayhati ñāyaty anenā ti viggaho … visesena vā gahaṇaṃ viggaho, tadatthaṃ vākyaṃ viggahavākyaṃ”, it is called viggaha because by means of it [the meaning] is grasped and known distinctly; or else viggaha is the distinct grasping, and the phrase that has that purpose is the viggaha-vākya (Mogg-p-ṭ., pp. 145–146). Rūpasiddhi calls the uncompounded expression vākya: “tadaññaṃ vākyam iti ruḷhaṃ”, the other [what is not a compound] is conventionally known as vākya (Rū. §331); in contrast to it, the compounded form is called vutti (sutta 364; Nir. 261). The same ṭīkā cites the difference between the two: “samāse visesanaṃ visessam anupavīsati ekībhavati visesanaṃ, vākye tu visesanaṃ visessato visuṃyevā vatiṭṭhate”, in the compound the qualifier enters into the qualified and becomes one with it; in the phrase it remains separate from the qualified (Mogg-p-ṭ., p. 145)."},"L":"0005b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Moggallāna-pañcikā-ṭīkā","id":"intro-l0005b"},{"tipo":"p","texto":{"es":"Hay compuestos que son siempre compuestos (niccasamāsa) y otros que no lo son (aniccasamāsa) (Sad. (Smith p. 745)); el que es siempre compuesto no se resuelve con sus propias palabras: «niccayamāsāna maviggaho [léase niccasamāsānam aviggaho], asakapadaviggaho vā yutto», al compuesto obligatorio le corresponde no tener resolución, o tenerla con una palabra ajena (Mogg-p-ṭ., p. 147). Así el compuesto adverbial: nagarassa samīpaṃ, upanagaraṃ, cerca de la ciudad, con samīpaṃ en lugar de upa (véase la nota 3). La vutti de Kaccāyana lo resuelve en cambio nagarassa samīpe pavattati kathā iti upanagaraṃ, la conversación que surge cerca de la ciudad [se denomina] upanagaraṃ (Kacc. §319); las palabras así añadidas se conocen «samāsasāmatthiyena», por la fuerza del compuesto (sutta 336; Nir. 217).","en":"There are compounds that are always compounds (niccasamāsa) and others that are not (aniccasamāsa) (Sad. (Smith p. 745)); the one that is always a compound is not resolved with its own words: “niccayamāsāna maviggaho [read niccasamāsānam aviggaho], asakapadaviggaho vā yutto”, it befits the obligatory compound to have no resolution, or to have one with a word not its own (Mogg-p-ṭ., p. 147). Thus the adverbial compound: nagarassa samīpaṃ, upanagaraṃ, near the city, with samīpaṃ in place of upa (see note 3). The vutti of Kaccāyana, by contrast, resolves it as nagarassa samīpe pavattati kathā iti upanagaraṃ, the talk that arises near the city [is called] upanagaraṃ (Kacc. §319); the words added in this way are known “samāsasāmatthiyena”, by the force of the compound (sutta 336; Nir. 217)."},"L":"0005d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Moggallāna-pañcikā-ṭīkā","id":"intro-l0005d"},{"tipo":"p","texto":{"es":"Un mismo compuesto puede admitir más de una resolución y, con ellas, más de una clase; Saddanīti los llama «dvādhippāyika» (Sad. (Smith p. 753)) y advierte: «yo yo yujjati, so so attho nayaññūhi gahetabbo», el sentido que convenga, ése han de tomar los que conocen el método (Sad. (Smith p. 748)). Cuál es la lectura de un pasaje no lo decide la gramática, que sólo muestra que ambas son posibles, sino el texto y su comentario. La resolución existe también para los derivados primarios (kitaka) y secundarios (taddhita).","en":"One and the same compound may admit more than one resolution and, with them, more than one class; Saddanīti calls them “dvādhippāyika” (Sad. (Smith p. 753)) and warns: “yo yo yujjati, so so attho nayaññūhi gahetabbo”, whichever sense fits, that is the one those who know the method should take (Sad. (Smith p. 748)). Which reading a passage has is decided not by grammar, which only shows that both are possible, but by the text and its commentary. The resolution also exists for primary (kitaka) and secondary (taddhita) derivatives."},"L":"0005f","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Moggallāna-pañcikā-ṭīkā","id":"intro-l0005f"},{"tipo":"p","texto":{"es":"Cuando se forma un compuesto hay (1) agrupación de voces (sadda-samasana) y (2) agrupación de significado (attha-samasana). En el caso de un compuesto donde la inflexión del primer miembro no se elide (alutta-samāsa), solamente existe agrupación de significado.[^2] Pero cuando la terminación del primer miembro se elide (lutta-samāsa), existe tanto agrupación de voces como agrupación de significado.","en":"When a compound is formed there is (1) combination of words (sadda-samasana) and (2) combination of meaning (attha-samasana). In the case of a compound where the inflection of the first member is not elided (alutta-samāsa), there is only combination of meaning.[^2] But when the ending of the first member is elided (lutta-samāsa), there is both combination of words and combination of meaning."},"L":"0007","id":"intro-l0007"},{"tipo":"p","texto":{"es":"Rūpasiddhi añade que también en el compuesto sin elisión pueden darse las dos agrupaciones, porque sus miembros llegan a ser una sola palabra: «tatthā pi vā ekapadattūpagamanato duvidham pi labbhat’ eva» (Rū. §331); lo mismo dice Nyāsa ad Kacc. §316. Saddanīti da como ejemplos de agrupación de significado en compuestos sin elisión «dūre-nidānaṃ», «gavam-pati», «urasi-lomo» y «devānaṃ-piya-Tisso» (Sad. (Smith p. 741)).","en":"Rūpasiddhi adds that the two combinations may also occur in the compound without elision, because its members come to be a single word: “tatthā pi vā ekapadattūpagamanato duvidham pi labbhat’ eva” (Rū. §331); Nyāsa ad Kacc. §316 says the same. Saddanīti gives as examples of combination of meaning in compounds without elision “dūre-nidānaṃ”, “gavam-pati”, “urasi-lomo” and “devānaṃ-piya-Tisso” (Sad. (Smith p. 741))."},"L":"0007b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Nyāsa","id":"intro-l0007b"},{"tipo":"p","texto":{"es":"Se dice que hay dos ventajas en la formación de un compuesto: (1) la condición de una única palabra y (2) la condición de una única inflexión (ekapadatta, ekavibhattitta; Rū. §331).","en":"Two advantages are said to exist in the formation of a compound: (1) the condition of being a single word and (2) the condition of having a single inflection (ekapadatta, ekavibhattitta; Rū. §331)."},"L":"0009","id":"intro-l0009"},{"tipo":"p","texto":{"es":"Cada una de las voces, antes de unirse para formar un compuesto, posee diferente significado. Pero cuando se unen y forman un compuesto, éstas pierden su significado individual para adquirir un único significado: el significado del compuesto. Ésta se dice que es la característica de un compuesto.","en":"Each of the words, before joining to form a compound, has a different meaning. But when they join and form a compound, they lose their individual meaning to acquire a single meaning: the meaning of the compound. This is said to be the characteristic of a compound."},"L":"0011","id":"intro-l0011"},{"tipo":"p","texto":{"es":"La característica es la de Rūpasiddhi: «bhinnatthānaṃ ekatthībhāvo samāsalakkhaṇaṃ», el que voces de significados distintos lleguen a tener un solo significado (Rū. §331). Saddanīti la atribuye a «algunos» (keci) y da como suya otra: «nānāpadānaṃ ekapadattūpagamanaṃ samāsalakkhaṇaṃ», el que varias palabras lleguen a ser una sola palabra (Sad. (Smith p. 745)).","en":"The characteristic is that of Rūpasiddhi: “bhinnatthānaṃ ekatthībhāvo samāsalakkhaṇaṃ”, that words of different meanings come to have a single meaning (Rū. §331). Saddanīti attributes it to “some” (keci) and gives another as its own: “nānāpadānaṃ ekapadattūpagamanaṃ samāsalakkhaṇaṃ”, that several words come to be a single word (Sad. (Smith p. 745))."},"L":"0011b","iebh":true,"fuente":"Rūpasiddhi · Saddanīti","id":"intro-l0011b"},{"tipo":"p","texto":{"es":"El compuesto es de seis clases (saññāvasena chabbidho; Rū., p. 176):","en":"The compound is of six classes (saññāvasena chabbidho; Rū., p. 176):"},"L":"0016","id":"intro-l0016"},{"tipo":"lista","items":[{"es":"Compuesto adverbial (abyayībhāva-samāsa),","en":"Adverbial compound (abyayībhāva-samāsa),"},{"es":"Compuesto adjetivo (kammadhāraya-samāsa),","en":"Adjectival compound (kammadhāraya-samāsa),"},{"es":"Compuesto numérico (digu-samāsa),","en":"Numerical compound (digu-samāsa),"},{"es":"Compuesto determinativo (tappurisa-samāsa),","en":"Determinative compound (tappurisa-samāsa),"},{"es":"Compuesto relativo (bahubbīhi-samāsa),","en":"Relative compound (bahubbīhi-samāsa),"},{"es":"Compuesto copulativo o agregativo (dvanda-samāsa).","en":"Copulative or aggregative compound (dvanda-samāsa)."}],"L":"0018","hasta":"0023","id":"intro-l0018"},{"tipo":"p","texto":{"es":"Rūpasiddhi cierra el capítulo de compuestos con dos estrofas que lo clasifican de otro modo. Por el miembro cuyo significado predomina, el compuesto es de cuatro clases: con predominio del significado del primer miembro (pubbapadatthappadhāna), del último miembro (uttarapadatthappadhāna), de ambos (ubhayapadatthappadhāna) o de otra palabra (aññapadatthappadhāna); con el compuesto numérico y el compuesto adjetivo, de seis. Son, respectivamente, el compuesto adverbial, el compuesto determinativo, el compuesto copulativo y el compuesto relativo (Sad. (Smith pp. 746, 754, 759, 768); para el adverbial y el determinativo, también Rū. §330 (p. 178) y §341 (p. 184)). Por sus subdivisiones, el compuesto adverbial es de dos clases, el compuesto adjetivo de nueve, el compuesto numérico de dos, el compuesto determinativo de ocho, el compuesto relativo de nueve y el compuesto copulativo de dos: en total, treinta y dos (caturaṭṭhadhā, «cuatro veces ocho») (Rū., pp. 214–215). La tradición de Kaccāyana cuenta veintisiete (el compuesto adjetivo de seis clases y el relativo de siete) y, según algunos, veintiocho si se añade el compuesto determinativo de primera inflexión (Suttaniddesa, ad Kacc. §316; cf. Sad. (Smith p. 745), «sattavīsatividho aṭṭhavīsatividho»).","en":"Rūpasiddhi closes the chapter on compounds with two stanzas that classify it in another way. By the member whose meaning predominates, the compound is of four classes: in which the meaning of the first member predominates (pubbapadatthappadhāna), of the last member (uttarapadatthappadhāna), of both (ubhayapadatthappadhāna) or of another word (aññapadatthappadhāna); with the numerical compound and the adjectival compound, of six. They are, respectively, the adverbial compound, the determinative compound, the copulative compound and the relative compound (Sad. (Smith pp. 746, 754, 759, 768); for the adverbial and the determinative, also Rū. §330 (p. 178) and §341 (p. 184)). By its subdivisions, the adverbial compound is of two classes, the adjectival compound of nine, the numerical compound of two, the determinative compound of eight, the relative compound of nine and the copulative compound of two: in all, thirty-two (caturaṭṭhadhā, “four times eight”) (Rū., pp. 214–215). The Kaccāyana tradition counts twenty-seven (the adjectival compound of six classes and the relative of seven) and, according to some, twenty-eight if the determinative compound of the first inflection is added (Suttaniddesa, ad Kacc. §316; cf. Sad. (Smith p. 745), “sattavīsatividho aṭṭhavīsatividho”)."},"L":"0023b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Suttaniddesa","id":"intro-l0023b"},{"tipo":"p","texto":{"es":"Lo que se dice del género en cada clase («Este compuesto tiene el género…») procede de otra nota de Nandisena, «Qué género tienen cada uno de los seis compuestos» (6 de febrero de 2004). Coincide en lo esencial, y en el mismo orden, con el repaso del género con que U Sīlānanda cierra el capítulo de compuestos de Kaccāyana (clase de Kaccāyana n.º 10), salvo en dos precisiones propias de la nota («el género del primer miembro», «generalmente»); la grabación termina antes del compuesto copulativo. Las precisiones de las fuentes van en cada clase, rotuladas IEBH.","en":"What is said about gender in each class (“This compound has the gender…”) comes from another note by Nandisena, «Qué género tienen cada uno de los seis compuestos» (6 February 2004). It agrees in substance, and in the same order, with the review of gender with which U Sīlānanda closes the compound chapter of Kaccāyana (Kaccāyana class no. 10), except for two qualifications of the note’s own (“the gender of the first member”, “generally”); the recording ends before the copulative compound. The qualifications from the sources are given in each class, labelled IEBH."},"L":"0023e","iebh":true,"fuente":"Nandisena, «Qué género tienen cada uno de los seis compuestos» (2004) · Kaccāyana · U Sīlānanda","id":"intro-l0023e"}],"clases":[{"id":"abyayibhava","n":1,"pali":"abyayībhāva","titulo":{"es":"Compuesto Adverbial (abyayībhāva-samāsa)","en":"Adverbial Compound (abyayībhāva-samāsa)"},"kacc":[319],"L":"0026","bloques":[{"tipo":"p","texto":{"es":"Este tipo de compuesto tiene un indeclinable (abyaya)—un prefijo (upasagga) o una partícula (nipāta)—como primer miembro.[^3]","en":"This kind of compound has an indeclinable (abyaya)—a prefix (upasagga) or a particle (nipāta)—as its first member.[^3]"},"L":"0028","id":"abyayibhava-l0028"},{"tipo":"p","texto":{"es":"En este tipo de compuesto el primer miembro, el indeclinable, predomina. El segundo (último) miembro del compuesto generalmente tiene la primera inflexión neutra (aṃ) y es indeclinable.","en":"In this kind of compound the first member, the indeclinable, predominates. The second (last) member of the compound generally has the neuter first inflection (aṃ) and is indeclinable."},"L":"0030","id":"abyayibhava-l0030"},{"tipo":"p","texto":{"es":"«Pubbapadatthappadhāno hi abyayībhāvo»: en el compuesto adverbial predomina el significado del primer miembro (Rū. §330). Rūpasiddhi explica el nombre de dos maneras: «abyayānaṃ atthaṃ vibhāvayatī ti abyayībhāvo», porque pone de manifiesto el significado de los indeclinables, o «anabyayaṃ abyayaṃ bhavatī ti», porque lo que no es indeclinable se vuelve indeclinable (Rū. §330). Según Suttaniddesa, el predominio del primer miembro vale «en la mayoría de los casos» (yebhuyyavasena), y hay compuestos adverbiales con predominio del último miembro o de otra palabra (Suttaniddesa, ad Kacc. §319).","en":"“Pubbapadatthappadhāno hi abyayībhāvo”: in the adverbial compound the meaning of the first member predominates (Rū. §330). Rūpasiddhi explains the name in two ways: “abyayānaṃ atthaṃ vibhāvayatī ti abyayībhāvo”, because it makes manifest the meaning of the indeclinables, or “anabyayaṃ abyayaṃ bhavatī ti”, because what is not indeclinable becomes indeclinable (Rū. §330). According to Suttaniddesa, the predominance of the first member holds “in most cases” (yebhuyyavasena), and there are adverbial compounds in which the last member or another word predominates (Suttaniddesa, ad Kacc. §319)."},"L":"0030b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Suttaniddesa","id":"abyayibhava-l0030b"},{"tipo":"p","texto":{"es":"En rigor, es el compuesto entero el que se considera neutro («So napuṃsakaliṅgo», Kacc. §320; Rū. §335), y después del compuesto adverbial que termina en «a» las inflexiones devienen «aṃ» sólo «a veces» (kvaci; Kacc. §341; Rū. §336): de ahí las formas opcionales en -ena, -ehi, -ā, -assa, etc. del paradigma siguiente. Después del que no termina en «a» las inflexiones se eliden (Kacc. §343; Rū. §338).","en":"Strictly speaking, it is the whole compound that is regarded as neuter (“So napuṃsakaliṅgo”, Kacc. §320; Rū. §335), and after an adverbial compound ending in “a” the inflections become “aṃ” only “sometimes” (kvaci; Kacc. §341; Rū. §336): hence the optional forms in -ena, -ehi, -ā, -assa, etc., in the following paradigm. After one not ending in “a” the inflections are elided (Kacc. §343; Rū. §338)."},"L":"0030e","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"abyayibhava-l0030e"},{"tipo":"p","texto":{"es":"Este compuesto tiene el género del primer miembro, neutro.","en":"This compound has the gender of the first member, neuter."},"L":"0030g","iebh":true,"fuente":"Nandisena, «Qué género tienen cada uno de los seis compuestos» (2004)","id":"abyayibhava-l0030g"},{"tipo":"p","texto":{"es":"Nandisena dice «el género del primer miembro»; pero el primer miembro, un indeclinable, no tiene género propio: se llama abyaya porque no cambia aunque cambien el género y el número («liṅgavacanabhede pi byayarahitattā», Rū. §330). Lo que fija la regla es que el compuesto entero se considera neutro, aunque el último miembro sea femenino: adhikumāri, upavadhu, upagaṅgaṃ (Kacc. §320; Rū. §335). Saddanīti, al explicar por qué en este compuesto la palabra femenina no se trata como masculina, da la razón de fondo: el compuesto adverbial tiene la naturaleza del indeclinable y no toma el género ni el número de lo que designa («tassa avyayalakkhaṇattā anabhidheyyaliṅgavacanattā ca», Sad. (Smith p. 775)). Así lo explica también U Sīlānanda (clase de Kaccāyana n.º 7).","en":"Nandisena says “the gender of the first member”; but the first member, an indeclinable, has no gender of its own: it is called abyaya because it does not change even when gender and number change (“liṅgavacanabhede pi byayarahitattā”, Rū. §330). What fixes the rule is that the whole compound is regarded as neuter, even when the last member is feminine: adhikumāri, upavadhu, upagaṅgaṃ (Kacc. §320; Rū. §335). Saddanīti, explaining why in this compound the feminine word is not treated as masculine, gives the underlying reason: the adverbial compound has the nature of an indeclinable and does not take the gender or number of what it denotes (“tassa avyayalakkhaṇattā anabhidheyyaliṅgavacanattā ca”, Sad. (Smith p. 775)). U Sīlānanda explains it the same way (Kaccāyana class no. 7)."},"L":"0030j","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · U Sīlānanda","id":"abyayibhava-l0030j"},{"tipo":"p","texto":{"es":"El siguiente es un paradigma de las posibles inflexiones del compuesto *upanagaraṃ* (Kacc. §341; Rū. §336).[^4] Este paradigma es aplicable a otros compuestos adverbiales terminados en *aṃ* como *upakumbhaṃ*, cerca de la vasija, etc.","en":"The following is a paradigm of the possible inflections of the compound *upanagaraṃ* (Kacc. §341; Rū. §336).[^4] This paradigm applies to other adverbial compounds ending in *aṃ*, such as *upakumbhaṃ*, near the water pot, etc."},"L":"0032","id":"abyayibhava-l0032"},{"tipo":"paradigma","cabecera":[{"es":"infl.","en":"infl."},{"es":"singular","en":"singular"},{"es":"plural","en":"plural"}],"filas":[[{"es":"primera","en":"first"},"upanagaraṃ","upanagaraṃ"],[{"es":"vocativo","en":"vocative"},"upanagaraṃ","upanagaraṃ"],[{"es":"segunda","en":"second"},"upanagaraṃ","upanagaraṃ"],[{"es":"tercera","en":"third"},"upanagaraṃ, upanagarena","upanagaraṃ, upanagarehi"],[{"es":"cuarta","en":"fourth"},"upanagaraṃ","upanagaraṃ"],[{"es":"quinta","en":"fifth"},"upanagarā, upanagaramhā, upanagarasmā","upanagarehi"],[{"es":"sexta","en":"sixth"},"upanagaraṃ, upanagarassa","upanagaraṃ, upanagarānaṃ"],[{"es":"séptima","en":"seventh"},"upanagaraṃ, upanagare, upanagaramhi, upanagarasmiṃ","upanagaraṃ, upanagaresu"]],"L":"0034","hasta":"0044","id":"abyayibhava-l0034"},{"tipo":"h","nivel":2,"texto":{"es":"Tipos de compuestos adverbiales con prefijos (upasaggapubbaka)","en":"Kinds of adverbial compounds with prefixes (upasaggapubbaka)"},"L":"0047","id":"abyayibhava-upasaggapubbaka"},{"tipo":"p","texto":{"es":"En la resolución de este tipo de compuesto se utiliza otro término, el cual explica el significado del prefijo.","en":"In the resolution of this kind of compound another term is used, which explains the meaning of the prefix."},"L":"0049","id":"abyayibhava-l0049"},{"tipo":"ejemplos","columnas":4,"filas":[{"sentido":{"es":"cercanía (samīpa)","en":"proximity (samīpa)"},"resolucion":"nagarassa samīpaṃ","compuesto":"upanagaraṃ","traduccion":{"es":"cerca de la ciudad","en":"near the city"}},{"sentido":{"es":"cercanía (samīpa)","en":"proximity (samīpa)"},"resolucion":"gaṅgāya samīpaṃ\nmaṇikāya samīpaṃ","compuesto":"upagaṅgaṃ\nupamaṇikaṃ","traduccion":{"es":"cerca del Ganges\ncerca de la vasija grande","en":"near the Ganges\nnear the big vessel"},"iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti","L":"0053a"},{"sentido":{"es":"ausencia (abhāva)","en":"absence (abhāva)"},"resolucion":"darathānaṃ abhāvo\nmasakānaṃ abhāvo","compuesto":"niddarathaṃ\nnimmasakaṃ","traduccion":{"es":"ausencia de aflicción\nausencia de mosquitos","en":"absence of distress\nabsence of mosquitoes"}},{"sentido":{"es":"después (pacchā)","en":"after (pacchā)"},"resolucion":"rathassa pacchā\nvātassa pacchā","compuesto":"anurathaṃ\nanuvātaṃ","traduccion":{"es":"después del carruaje\nen la dirección del viento","en":"after the chariot\nin the direction of the wind"}},{"sentido":{"es":"conveniencia (yoggatā)","en":"suitability (yoggatā)"},"resolucion":"rūpassa yoggaṃ","compuesto":"anurūpaṃ","traduccion":{"es":"adecuado, conveniente","en":"suitable, appropriate"}},{"sentido":{"es":"repetición (vicchā)","en":"distributive repetition (vicchā)"},"resolucion":"attānaṃ attānaṃ pati\naddhamāsaṃ addhamāsaṃ anu","compuesto":"paccattaṃ\nanvaddhamāsaṃ","traduccion":{"es":"individualmente\ndos veces al mes","en":"individually\ntwice a month"}},{"sentido":{"es":"sucesión (anupubba)","en":"succession (anupubba)"},"resolucion":"jeṭṭhānaṃ anupubbo","compuesto":"anujeṭṭhaṃ","traduccion":{"es":"de acuerdo a la antigüedad","en":"according to seniority"}},{"sentido":{"es":"opuesto (paṭiloma)","en":"opposition (paṭiloma)"},"resolucion":"sotassa paṭilomaṃ\nvātassa paṭilomaṃ","compuesto":"paṭisotaṃ\npaṭivātaṃ","traduccion":{"es":"contra la corriente\ncontra el viento","en":"against the current\nagainst the wind"}},{"sentido":{"es":"con referencia a (adhikicca pavatti)","en":"referring to (adhikicca pavatti)"},"resolucion":"attānaṃ adhikicca pavattaṃ\ncittaṃ adhikicca pavattanti te dhammā","compuesto":"ajjhattaṃ\nadhicittaṃ","traduccion":{"es":"interno, con referencia a uno mismo\n[los dhammas] que existen con referencia a la mente","en":"internal, referring to oneself\n[the dhammas] that exist referring to the mind"},"iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti","L":"0059a"},{"sentido":{"es":"límite excluyente o incluyente (mariyādā, abhividhi)","en":"exclusive or inclusive limit (mariyādā, abhividhi)"},"resolucion":"ā pāṇakoṭiyā\nākumārehi yaso kaccāyanassa","compuesto":"āpāṇakoṭikaṃ\nākumāraṃ","traduccion":{"es":"hasta el término de la vida\nla fama de Kaccāyana [llega] hasta los niños","en":"up to the end of life\nthe fame of Kaccāyana [reaches] as far as the children"},"iebh":true,"fuente":"Kaccāyana","L":"0059b"},{"sentido":{"es":"logro (samiddhi)","en":"abundance (samiddhi)"},"resolucion":"bhikkhāya samiddhi","compuesto":"subhikkhaṃ","traduccion":{"es":"abundante comida","en":"abundant food"}}],"cabecera":[{"es":"término","en":"term"},{"es":"resolución del compuesto","en":"resolution of the compound"},{"es":"compuesto","en":"compound"},{"es":"traducción","en":"translation"}],"L":"0051","hasta":"0061","id":"abyayibhava-l0051"},{"tipo":"p","texto":{"es":"«Masaka», «nimmasakaṃ» es la lectura de Rūpasiddhi y de Saddanīti; Kaccāyana lee «makasānaṃ abhāvo nimmakasaṃ» (Kacc. §319), y en el canon sólo se encuentra «makasa» (p. ej. «ḍaṃsamakasavātātapasarīsapasamphassānaṃ», D. iii 107 (PTS iii 130)).","en":"“Masaka”, “nimmasakaṃ” is the reading of Rūpasiddhi and of Saddanīti; Kaccāyana reads “makasānaṃ abhāvo nimmakasaṃ” (Kacc. §319), and in the canon only “makasa” is found (e.g. “ḍaṃsamakasavātātapasarīsapasamphassānaṃ”, D. iii 107 (PTS iii 130))."},"L":"0061b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Tipiṭaka","id":"abyayibhava-l0061b"},{"tipo":"p","texto":{"es":"En «subhikkhaṃ» la «ā» final de «bhikkhā» se acorta porque el compuesto es neutro (Kacc. §342; Rū. §337) y la inflexión deviene «aṃ» (Kacc. §341; Rū. §336). Rūpasiddhi trata este ejemplo precisamente bajo «Saro rasso napuṃsake». En el canon: «subhikkhaṃ bhavissati, dubbhikkhaṃ bhavissati», habrá abundancia de comida, habrá escasez (D. i 10 (PTS i 11)).","en":"In “subhikkhaṃ” the final “ā” of “bhikkhā” is shortened because the compound is neuter (Kacc. §342; Rū. §337), and the inflection becomes “aṃ” (Kacc. §341; Rū. §336). Rūpasiddhi treats this example precisely under “Saro rasso napuṃsake”. In the canon: “subhikkhaṃ bhavissati, dubbhikkhaṃ bhavissati”, there will be abundance of food, there will be scarcity (D. i 10 (PTS i 11))."},"L":"0061e","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"abyayibhava-l0061e"},{"tipo":"p","texto":{"es":"Ejemplos de compuestos que no terminan en *aṃ*. Estos compuestos son invariables; es decir, siempre tienen la misma inflexión (Kacc. §343; Rū. §338).","en":"Examples of compounds that do not end in *aṃ*. These compounds are invariable; that is, they always have the same inflection (Kacc. §343; Rū. §338)."},"L":"0063","id":"abyayibhava-l0063"},{"tipo":"ejemplos","columnas":3,"filas":[{"sentido":{"es":"","en":""},"resolucion":"itthīsu adhikicca kathā pavattati","compuesto":"adhitthi","traduccion":{"es":"conversación que ocurrió con relación a las mujeres","en":"talk that arose with reference to women"}},{"sentido":{"es":"","en":""},"resolucion":"vadhuyā samīpaṃ","compuesto":"upavadhu","traduccion":{"es":"cerca de la nuera","en":"near the daughter-in-law"}},{"sentido":{"es":"","en":""},"resolucion":"gunnaṃ samīpaṃ","compuesto":"upagu","traduccion":{"es":"cerca del ganado","en":"near the cattle"}}],"L":"0065","hasta":"0069","id":"abyayibhava-l0065"},{"tipo":"p","texto":{"es":"En los tres, la vocal final se acorta porque el compuesto es neutro (Kacc. §342; Rū. §337): itthī → adhitthi, vadhū → upavadhu; en «upagu», la «o» de «go» se acorta en «u» («okārassa rassattaṃ ukāro», Rū. §338).","en":"In all three, the final vowel is shortened because the compound is neuter (Kacc. §342; Rū. §337): itthī → adhitthi, vadhū → upavadhu; in “upagu”, the “o” of “go” is shortened to “u” (“okārassa rassattaṃ ukāro”, Rū. §338)."},"L":"0069b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"abyayibhava-l0069b"},{"tipo":"h","nivel":2,"texto":{"es":"Tipos de compuestos adverbiales con partículas (nipātapubbaka)","en":"Kinds of adverbial compounds with particles (nipātapubbaka)"},"L":"0073","id":"abyayibhava-nipatapubbaka"},{"tipo":"ejemplos","columnas":4,"filas":[{"sentido":{"es":"orden, sucesión (paṭipāṭi)","en":"order, succession (paṭipāṭi)"},"resolucion":"vuḍḍhānaṃ paṭipāṭi","compuesto":"yathāvuḍḍhaṃ","traduccion":{"es":"de acuerdo con la antigüedad","en":"in accordance with seniority"}},{"sentido":{"es":"repetición (vicchā)","en":"distributive repetition (vicchā)"},"resolucion":"ye ye vuḍḍhā","compuesto":"yathāvuḍḍhaṃ","traduccion":{"es":"de acuerdo con la antigüedad","en":"in accordance with seniority"}},{"sentido":{"es":"No traspasando el significado de la palabra (padatthānatikkama)","en":"Not going beyond the meaning of the word (padatthānatikkama)"},"resolucion":"kamaṃ anatikkamma pavattanaṃ","compuesto":"yathākkamaṃ","traduccion":{"es":"de acuerdo al orden","en":"according to order"}},{"sentido":{"es":"","en":""},"resolucion":"sattiṃ anatikkamma pavattanaṃ","compuesto":"yathāsatti","traduccion":{"es":"de acuerdo a la habilidad","en":"according to ability"}},{"sentido":{"es":"","en":""},"resolucion":"balam anatikkamitvā karoti","compuesto":"yathābalaṃ","traduccion":{"es":"de acuerdo a la fuerza","en":"according to strength"}},{"sentido":{"es":"límite (pariccheda)","en":"limit (pariccheda)"},"resolucion":"jīvassa yattako paricchedo","compuesto":"yāvajīvaṃ","traduccion":{"es":"hasta el fin de la vida","en":"until the end of life"}},{"sentido":{"es":"","en":""},"resolucion":"yattakena attho","compuesto":"yāvadatthaṃ","traduccion":{"es":"tanto como se necesite","en":"as much as is needed"}},{"sentido":{"es":"la otra parte (parabhāga)","en":"the other side (parabhāga)"},"resolucion":"pabbatassa parabhāgo","compuesto":"tiropabbataṃ","traduccion":{"es":"al otro lado de la montaña","en":"on the other side of the mountain"}},{"sentido":{"es":"","en":""},"resolucion":"kuṭṭassa parabhāgo","compuesto":"tirokuṭṭaṃ","traduccion":{"es":"al otro lado del muro","en":"on the other side of the wall"}},{"sentido":{"es":"","en":""},"resolucion":"pāsādassa anto","compuesto":"antopāsādaṃ","traduccion":{"es":"dentro de la mansión","en":"inside the mansion"}},{"sentido":{"es":"","en":""},"resolucion":"nagarassa anto","compuesto":"antonagaraṃ","traduccion":{"es":"dentro de la ciudad","en":"inside the city"}},{"sentido":{"es":"","en":""},"resolucion":"vassassa anto","compuesto":"antovassaṃ","traduccion":{"es":"dentro de las lluvias","en":"within the rains"}},{"sentido":{"es":"","en":""},"resolucion":"nagarato bahi","compuesto":"bahinagaraṃ","traduccion":{"es":"fuera de la ciudad","en":"outside the city"}},{"sentido":{"es":"","en":""},"resolucion":"pāsādassa upari","compuesto":"uparipāsādaṃ","traduccion":{"es":"arriba de la mansión","en":"above the mansion"}},{"sentido":{"es":"","en":""},"resolucion":"mañcassa heṭṭhā","compuesto":"heṭṭhāmañcaṃ","traduccion":{"es":"debajo de la cama","en":"under the bed"}},{"sentido":{"es":"","en":""},"resolucion":"bhattassa pure","compuesto":"purebhattaṃ","traduccion":{"es":"antes de la comida","en":"before the meal"}},{"sentido":{"es":"","en":""},"resolucion":"bhattassa pacchā","compuesto":"pacchābhattaṃ","traduccion":{"es":"después de la comida","en":"after the meal"}},{"sentido":{"es":"significando todo (sākallattha)","en":"totality (sākallattha)"},"resolucion":"saha makkhikāya","compuesto":"samakkhikaṃ","traduccion":{"es":"con moscas (incluyendo las moscas)[^5]","en":"with flies (including the flies)[^5]"}},{"sentido":{"es":"","en":""},"resolucion":"saha tiṇena","compuesto":"satiṇaṃ","traduccion":{"es":"con pasto (incluyendo el pasto)","en":"with grass (including the grass)"}},{"sentido":{"es":"otros ejemplos","en":"other examples"},"resolucion":"Gaṅgāya oraṃ","compuesto":"oragaṅgaṃ","traduccion":{"es":"en esta orilla del Ganges","en":"on this bank of the Ganges"}},{"sentido":{"es":"","en":""},"resolucion":"samuddassa majjhe","compuesto":"majjhesamuddaṃ","traduccion":{"es":"en el medio del mar","en":"in the middle of the sea"}}],"L":"0075","hasta":"0097","id":"abyayibhava-l0075"},{"tipo":"p","texto":{"es":"Los dos, con «tiropākāraṃ», están atestiguados juntos en la descripción del poder supranormal: «tirokuṭṭaṃ tiropākāraṃ tiropabbataṃ asajjamāno gacchati seyyathā pi ākāse», pasa sin obstáculo al otro lado de un muro, de una muralla, de una montaña, como por el espacio (D. i 73 (PTS i 78)).","en":"The two, together with “tiropākāraṃ”, are attested together in the description of the supernormal power: “tirokuṭṭaṃ tiropākāraṃ tiropabbataṃ asajjamāno gacchati seyyathā pi ākāse”, he passes unhindered to the other side of a wall, of a rampart, of a mountain, as though through space (D. i 73 (PTS i 78))."},"L":"0097b","iebh":true,"fuente":"Tipiṭaka","id":"abyayibhava-l0097b"},{"tipo":"p","texto":{"es":"Saddanīti explica con este compuesto que el compuesto adverbial puede ser indeclinable sólo en parte (ekadesena): «samuddassa majjhe majjhe-samuddaṃ, tasmiṃ majjhe-samuddasmiṃ», con séptima inflexión, como en el verso «Ko ’yaṃ majjhe samuddasmiṃ, apassaṃ tīram āyuhe» (Sad. (Smith p. 746); J. ii 159 (Mahājanaka-jātaka); JA. vi 44 (PTS vi 35)). La edición del Sexto Concilio imprime «majjhe samuddasmiṃ» en dos palabras.","en":"Saddanīti uses this compound to explain that the adverbial compound may be indeclinable only in part (ekadesena): “samuddassa majjhe majjhe-samuddaṃ, tasmiṃ majjhe-samuddasmiṃ”, with the seventh inflection, as in the verse “Ko ’yaṃ majjhe samuddasmiṃ, apassaṃ tīram āyuhe” (Sad. (Smith p. 746); J. ii 159 (Mahājanaka-jātaka); JA. vi 44 (PTS vi 35)). The Sixth Council edition prints “majjhe samuddasmiṃ” as two words."},"L":"0097e","iebh":true,"fuente":"Saddanīti · Tipiṭaka · Aṭṭhakathā","id":"abyayibhava-l0097e"},{"tipo":"p","texto":{"es":"No todos los compuestos adverbiales se resuelven con otra palabra (véase la nota 3). Varios compuestos de esta tabla se resuelven con la misma partícula: «pāsādassa anto», «mañcassa heṭṭhā» (Rū., p. 182), «bhattassa pacchā», y también, en la primera tabla, «addhamāsaṃ addhamāsaṃ anu» (Rū., p. 181). Otros, como upanagaraṃ («nagarassa samīpaṃ») y yathāvuḍḍhaṃ («vuḍḍhānaṃ paṭipāṭi»), sólo se resuelven con otra palabra. Así lo explica U Sīlānanda (clase de Rūpasiddhi n.º 42).","en":"Not all adverbial compounds are resolved with another word (see note 3). Several compounds in this table are resolved with the same particle: “pāsādassa anto”, “mañcassa heṭṭhā” (Rū., p. 182), “bhattassa pacchā”, and also, in the first table, “addhamāsaṃ addhamāsaṃ anu” (Rū., p. 181). Others, such as upanagaraṃ (“nagarassa samīpaṃ”) and yathāvuḍḍhaṃ (“vuḍḍhānaṃ paṭipāṭi”), are resolved only with another word. This is how U Sīlānanda explains it (Rūpasiddhi class no. 42)."},"L":"0097h","iebh":true,"fuente":"Rūpasiddhi · U Sīlānanda","id":"abyayibhava-l0097h"}],"ref":"Kacc. §319; Rū. §330"},{"id":"kammadharaya","n":2,"pali":"kammadhāraya","titulo":{"es":"Compuesto adjetivo (kammadhāraya-samāsa)","en":"Adjectival compound (kammadhāraya-samāsa)"},"kacc":[324],"L":"0100","bloques":[{"tipo":"p","texto":{"es":"Cuando dos nombres se refieren a la misma cosa (tulyādhikaraṇa),[^6] el compuesto se denomina *kammadhāraya*,[^7] compuesto adjetivo. Generalmente en este tipo de compuesto se combinan dos palabras diferentes, una que califica (adjetivo) y otra que es calificada (sustantivo), las cuales al formar el compuesto adquieren un significado único.","en":"When two nouns refer to the same thing (tulyādhikaraṇa),[^6] the compound is called *kammadhāraya*,[^7] adjectival compound. Generally, in this kind of compound two different words are combined, one that qualifies (adjective) and another that is qualified (noun), which on forming the compound acquire a single meaning."},"L":"0102","id":"kammadharaya-l0102"},{"tipo":"p","texto":{"es":"Este compuesto tiene el género del último miembro (generalmente).","en":"This compound has the gender of the last member (generally)."},"L":"0102b","iebh":true,"fuente":"Nandisena, «Qué género tienen cada uno de los seis compuestos» (2004)","id":"kammadharaya-l0102b"},{"tipo":"p","texto":{"es":"El compuesto adjetivo (kammadhāraya) y el compuesto numérico (digu) reciben también el nombre de compuesto determinativo (tappurisa-samāsa) (Kacc. §326; Rū. §341), donde el significado del último miembro es predominante; además, el género está determinado por el último miembro y, a diferencia del compuesto adverbial, pueden ser singular y plural y asumir diferentes inflexiones.","en":"The adjectival compound (kammadhāraya) and the numerical compound (digu) are also called determinative compound (tappurisa-samāsa) (Kacc. §326; Rū. §341), in which the meaning of the last member is predominant; moreover, the gender is determined by the last member and, unlike the adverbial compound, they can be singular and plural and take different inflections."},"L":"0104","id":"kammadharaya-l0104"},{"tipo":"p","texto":{"es":"Según Rūpasiddhi, se llaman así por su semejanza con la propia palabra «tappurisa» («tassa puriso», el hombre de él), en la que predomina el significado del último miembro; y este compuesto toma el número de lo que designa (abhidheyyavacana) y el género del último miembro (paraliṅga) (Rū. §341).","en":"According to Rūpasiddhi, they are so called because of their resemblance to the word “tappurisa” itself (“tassa puriso”, his man), in which the meaning of the last member predominates; and this compound takes the number of what it denotes (abhidheyyavacana) and the gender of the last member (paraliṅga) (Rū. §341)."},"L":"0104b","iebh":true,"fuente":"Rūpasiddhi","id":"kammadharaya-l0104b"},{"tipo":"p","texto":{"es":"Niruttidīpanī lo dice también sin restricción («Ayam pi kammadhārayasamāso abhidheyyavacano parapadaliṅgo ca», Nir. 239). Cuando ambos miembros califican (visesanobhayapada), el último no tiene género propio y el compuesto toma el de lo que califica: «siniddho ca so uṇho cā ti siniddhuṇho», māso (Rū., p. 186); «sītañ ca taṃ uṇhañ cā ti sītuṇhaṃ», bhattaṃ (Sad. (Smith p. 753)). Y el compuesto numérico colectivo, que Nandisena incluye arriba con el adjetivo, no toma el género del último miembro: es neutro y singular (Kacc. §321; Rū. §349).","en":"Niruttidīpanī also states it without restriction (“Ayam pi kammadhārayasamāso abhidheyyavacano parapadaliṅgo ca”, Nir. 239). When both members qualify (visesanobhayapada), the last has no gender of its own and the compound takes that of what it qualifies: “siniddho ca so uṇho cā ti siniddhuṇho”, māso (Rū., p. 186); “sītañ ca taṃ uṇhañ cā ti sītuṇhaṃ”, bhattaṃ (Sad. (Smith p. 753)). And the collective numerical compound, which Nandisena includes above with the adjectival, does not take the gender of the last member: it is neuter and singular (Kacc. §321; Rū. §349)."},"L":"0104d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī","id":"kammadharaya-l0104d"},{"tipo":"p","texto":{"es":"Para la resolución de este tipo de compuesto y para mostrar que ambos miembros se refieren a la misma cosa se usa el pronombre-artículo *ta*, éste/ésta, y la partícula *ca*, y. El compuesto *mahāpuriso*, gran hombre, se resuelve de la siguiente manera:","en":"For the resolution of this kind of compound, and to show that both members refer to the same thing, the pronoun-article *ta*, this one (masc./fem.), and the particle *ca*, and, are used. The compound *mahāpuriso*, great man, is resolved as follows:"},"L":"0107","id":"kammadharaya-l0107"},{"tipo":"interlineal","origen":"tabla","compuesto":"","traduccion":{"es":"","en":""},"viggaha":[{"p":"mahanto","g":{"es":"grande","en":"great"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"puriso","g":{"es":"hombre","en":"man"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0110","hasta":"0113","id":"kammadharaya-l0110"},{"tipo":"p","texto":{"es":"Según Rūpasiddhi, «ca» y «ta» se emplean en la resolución para dejar claro que las dos palabras se refieren a la misma cosa; una vez formado el compuesto ya no se emplean, porque el compuesto mismo lo expresa: no se emplea lo que ya está dicho (vuttatthānam appayogo) (Rū. §339).","en":"According to Rūpasiddhi, “ca” and “ta” are used in the resolution to make clear that the two words refer to the same thing; once the compound is formed they are no longer used, because the compound itself expresses this: what has already been expressed is not used (vuttatthānam appayogo) (Rū. §339)."},"L":"0113b","iebh":true,"fuente":"Rūpasiddhi","id":"kammadharaya-l0113b"},{"tipo":"p","texto":{"es":"En la resolución, el pronombre «ta» toma el género del primer miembro: «mahanto ca so puriso ca», «nīlañ ca taṃ uppalañ ca», «brāhmaṇī ca sā dārikā ca» (Kacc. §324), también cuando el segundo miembro es de otro género: «mukhañ ca taṃ cando ca» (Rū., p. 187), «vinayo ca so pariyatti ca», «avijjā ca sā paccayo ca», «sīlañ ca taṃ guṇo ca» (Niruttidīpanī p. 126). Así lo enseña U Sīlānanda (clase de Kaccāyana n.º 8).","en":"In the resolution, the pronoun “ta” takes the gender of the first member: “mahanto ca so puriso ca”, “nīlañ ca taṃ uppalañ ca”, “brāhmaṇī ca sā dārikā ca” (Kacc. §324), also when the second member is of another gender: “mukhañ ca taṃ cando ca” (Rū., p. 187), “vinayo ca so pariyatti ca”, “avijjā ca sā paccayo ca”, “sīlañ ca taṃ guṇo ca” (Niruttidīpanī p. 126). This is how U Sīlānanda teaches it (Kaccāyana class no. 8)."},"L":"0113e","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Niruttidīpanī · U Sīlānanda","id":"kammadharaya-l0113e"},{"tipo":"p","texto":{"es":"Tres maneras de resolver el compuesto adjetivo, según Niruttidīpanī: «mahā ca so puriso cā ti mahāpuriso»; con mahanta y sin palabras auxiliares, «mahanto puriso mahāpuriso»; o completa, «mahanto ca so puriso cā ti mahāpuriso» (sutta 346; Nir. 233). Explica también qué indica cada palabra auxiliar: «dvīhi casaddehi dvinnaṃ padānaṃ sakatthanānāttaṃ dīpeti. Taṃsaddena sakatthanānātte pi sakatthānaṃ adhikaraṇabhūtassa dabbatthassa ekattaṃ dīpeti» (sutta 346; Nir. 233): los dos «ca» muestran que cada palabra tiene su propio significado; «ta», que ambos significados residen en una sola cosa. Por eso desaparecen en el compuesto, que ya expresa esa unidad (Rū. §339, p. 184).","en":"Three ways of resolving the adjectival compound, according to Niruttidīpanī: “mahā ca so puriso cā ti mahāpuriso”; with mahanta and without auxiliary words, “mahanto puriso mahāpuriso”; or in full, “mahanto ca so puriso cā ti mahāpuriso” (sutta 346; Nir. 233). It also explains what each auxiliary word indicates: “dvīhi casaddehi dvinnaṃ padānaṃ sakatthanānāttaṃ dīpeti. Taṃsaddena sakatthanānātte pi sakatthānaṃ adhikaraṇabhūtassa dabbatthassa ekattaṃ dīpeti” (sutta 346; Nir. 233): the two “ca” show that each word has its own meaning; “ta”, that both meanings reside in a single thing. That is why they disappear in the compound, which already expresses that unity (Rū. §339, p. 184)."},"L":"0113h","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī","id":"kammadharaya-l0113h"},{"tipo":"p","texto":{"es":"Hay nueve clases (Rū., p. 183; Sad. (Smith p. 751)):","en":"There are nine kinds (Rū., p. 183; Sad. (Smith p. 751)):"},"L":"0115","id":"kammadharaya-l0115"},{"tipo":"lista","items":[{"es":"(1) el primer miembro califica al último miembro (visesanapubbapada),","en":"(1) the first member qualifies the last member (visesanapubbapada),"},{"es":"(2) el último miembro califica al primer miembro (visesanuttarapada),","en":"(2) the last member qualifies the first member (visesanuttarapada),"},{"es":"(3) ambos miembros califican (visesanobhayapada),","en":"(3) both members qualify (visesanobhayapada),"},{"es":"(4) el último miembro es la comparación (upamāna) que califica al primer miembro (upamānuttarapada),","en":"(4) the last member is the standard of comparison (upamāna) that qualifies the first member (upamānuttarapada),"},{"es":"(5) el primer miembro expresa lo que se considera o se atribuye (sambhāvanāpubbapada),","en":"(5) the first member expresses what is considered or attributed (sambhāvanāpubbapada),"},{"es":"(6) el primer miembro restringe al segundo miembro (avadhāraṇapubbapada),","en":"(6) the first member restricts the second member (avadhāraṇapubbapada),"},{"es":"(7) el primer miembro es la partícula 'na' (nanipātapubbapada),","en":"(7) the first member is the particle ‘na’ (nanipātapubbapada),"},{"es":"(8) el primer miembro es 'ku' (kupubbapada),","en":"(8) the first member is ‘ku’ (kupubbapada),"},{"es":"(9) el primer miembro es el prefijo 'pa' y otros (pādipubbapada).","en":"(9) the first member is the prefix ‘pa’ and others (pādipubbapada)."}],"L":"0116","hasta":"0124","id":"kammadharaya-l0116"},{"tipo":"h","nivel":2,"texto":{"es":"(1) El primer miembro califica al último miembro (visesanapubbapada) (Kacc. §324; Rū. §339 (pp. 183–186))","en":"(1) The first member qualifies the last member (visesanapubbapada) (Kacc. §324; Rū. §339 (pp. 183–186))"},"L":"0126","id":"kammadharaya-visesanapubbapada"},{"tipo":"interlineal","origen":"tabla","compuesto":"mahāpuriso","traduccion":{"es":"gran hombre","en":"great man"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"mahanto","g":{"es":"grande","en":"great"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"puriso","g":{"es":"hombre","en":"man"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0129","hasta":"0132","anexos":[{"es":"«Idha, bhikkhave, mahāpuriso suppatiṭṭhitapādo hoti» (D. iii 117 (PTS iii 143)).","en":"“Idha, bhikkhave, mahāpuriso suppatiṭṭhitapādo hoti” (D. iii 117 (PTS iii 143)).","fuente":"Tipiṭaka","L":"0132b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-mahapuriso"},{"tipo":"interlineal","origen":"tabla","compuesto":"mahābalaṃ","traduccion":{"es":"gran fuerza","en":"great strength"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"mahantañ","g":{"es":"grande","en":"great"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"tam","g":{"es":"ésta (es)","en":"this one (is)"}},{"p":"balañ","g":{"es":"fuerza","en":"strength"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0134","hasta":"0137","id":"c-mahabalam"},{"tipo":"interlineal","origen":"tabla","compuesto":"mahabbhayaṃ","traduccion":{"es":"gran miedo/peligro","en":"great fear/danger"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"mahantañ","g":{"es":"grande","en":"great"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"tam","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"bhayañ","g":{"es":"miedo","en":"fear"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0139","hasta":"0142","id":"c-mahabbhayam"},{"tipo":"p","texto":{"es":"En «mahābalaṃ», «mahanta» se sustituye por «mahā» ante una palabra que se refiere a la misma cosa (Kacc. §330; Rū. §340). En «mahabbhayaṃ» se sustituye por «maha»: el sutta dice «mahataṃ», en plural, y con ello enseña que a veces la sustitución es «maha» (Rū. §340); Rūpasiddhi no da más paso que éste (Rū., p. 184: «mahabbhayaṃ, mahaādeso»). Tipiṭaka: «Satto saṃsāram āpādi, dukkham assa mahabbhayaṃ» (S. i 34 (PTS i 37)).","en":"In “mahābalaṃ”, “mahanta” is replaced by “mahā” before a word that refers to the same thing (Kacc. §330; Rū. §340). In “mahabbhayaṃ” it is replaced by “maha”: the sutta says “mahataṃ”, in the plural, and thereby teaches that the substitution is sometimes “maha” (Rū. §340); Rūpasiddhi gives no step beyond this (Rū., p. 184: “mahabbhayaṃ, mahaādeso”). Tipiṭaka: “Satto saṃsāram āpādi, dukkham assa mahabbhayaṃ” (S. i 34 (PTS i 37))."},"L":"0142b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"kammadharaya-l0142b"},{"tipo":"interlineal","origen":"tabla","compuesto":"sappuriso","traduccion":{"es":"buen hombre","en":"good man"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"santo","g":{"es":"pacífico","en":"peaceful"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"puriso","g":{"es":"hombre","en":"man"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0145","hasta":"0148","anexos":[{"es":"«santa» se sustituye por «sa» por el «ca» del sutta «Santasaddassa so bhe bo c’ ante», aunque no siga bh (Rū., p. 184, que remite a Rū. §112 = Kacc. §185; allí el «ca» da sólo la sustitución por «sa»: «Caggahaṇaṃ kvaci sakārass’ eva pasiddhatthaṃ. Sakkāro, sakkato»). Saddanīti da dos explicaciones: «sobhano puriso sappuriso», hombre bueno, tomando «saṃ» en el sentido de «sobhana», como pādipubbapada, con la niggahīta convertida en p ante p (Sad. (Smith pp. 752–753)); o bien «santo puriso sappuriso, santacitto puriso», hombre de mente serena (Sad. (Smith p. 753)). Tipiṭaka: «sabbā disā sappuriso pavāyati» (Dh. 21 (PTS p. 8)); «Katamo ca puggalo sappuriso? Idh’ ekacco puggalo pāṇātipātā paṭivirato hoti…» (Pu. 144 (PTS p. 39)).","en":"“santa” is replaced by “sa” by virtue of the “ca” of the sutta “Santasaddassa so bhe bo c’ ante”, even though bh does not follow (Rū., p. 184, which refers to Rū. §112 = Kacc. §185; there the “ca” gives only the substitution by “sa”: “Caggahaṇaṃ kvaci sakārass’ eva pasiddhatthaṃ. Sakkāro, sakkato”). Saddanīti gives two explanations: “sobhano puriso sappuriso”, good man, taking “saṃ” in the sense of “sobhana”, as pādipubbapada, with the niggahīta changed to p before p (Sad. (Smith pp. 752–753)); or else “santo puriso sappuriso, santacitto puriso”, man of serene mind (Sad. (Smith p. 753)). Tipiṭaka: “sabbā disā sappuriso pavāyati” (Dh. 21 (PTS p. 8)); “Katamo ca puggalo sappuriso? Idh’ ekacco puggalo pāṇātipātā paṭivirato hoti…” (Pu. 144 (PTS p. 39)).","fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Tipiṭaka","L":"0148b"}],"id":"c-sappuriso"},{"tipo":"interlineal","origen":"tabla","compuesto":"kaṇhasappo","traduccion":{"es":"serpiente negra (Cobra)","en":"black snake (cobra)"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"kaṇho","g":{"es":"negra","en":"black"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"ésta (es)","en":"this one (is)"}},{"p":"sappo","g":{"es":"serpiente","en":"snake"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0152","hasta":"0155","anexos":[{"es":"«Pañc’ ime, bhikkhave, ādīnavā kaṇhasappe» (A. ii 227 (PTS iii 260)). Según Niruttidīpanī, este compuesto es a veces obligatorio (niccasamāsa): «Kvaci niccasamāso, kaṇhasappo, lohitamālaṃ» (Nir. 234).","en":"“Pañc’ ime, bhikkhave, ādīnavā kaṇhasappe” (A. ii 227 (PTS iii 260)). According to Niruttidīpanī, this compound is sometimes obligatory (niccasamāsa): “Kvaci niccasamāso, kaṇhasappo, lohitamālaṃ” (Nir. 234).","fuente":"Niruttidīpanī · Tipiṭaka","L":"0155b","clase":{"es":"Atestación","en":"Attestation"}}],"id":"c-kanhasappo"},{"tipo":"interlineal","origen":"tabla","compuesto":"nīluppalaṃ","traduccion":{"es":"ninfea azul","en":"blue lily"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"nīlañ","g":{"es":"azul","en":"blue"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"tam","g":{"es":"ésta (es)","en":"this one (is)"}},{"p":"uppalañ","g":{"es":"ninfea","en":"lily"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0159","hasta":"0162","id":"c-niluppalam"},{"tipo":"interlineal","origen":"tabla","compuesto":"lohitacandanaṃ","traduccion":{"es":"sándalo rojo","en":"red sandal"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"lohitañ","g":{"es":"rojo","en":"red"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"tañ","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"candanañ","g":{"es":"sándalo","en":"sandal"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0166","hasta":"0169","anexos":[{"es":"«ye keci sāragandhā, lohitacandanaṃ tesaṃ aggam akkhāyati» (M. iii 57 (PTS iii 6); S. ii 127 (PTS iii 156)).","en":"“ye keci sāragandhā, lohitacandanaṃ tesaṃ aggam akkhāyat
