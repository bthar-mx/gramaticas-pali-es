ebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"bahubbihi-l1110b"},{"tipo":"p","texto":{"es":"**byatihāralakkhaṇa**, una de las 9 clases de compuestos relativos (**bahubbīhi**). Indica una acción recíproca. Ej., *daṇḍehi ca daṇḍehi ca paharitvā idaṃ yuddhaṃ pavattati ti daṇḍādaṇḍi*, una pelea donde se golpean mutuamente con palos, se denomina *daṇḍādaṇḍi*, palos con palos. (Rū. §352 (p. 207))","en":"**byatihāralakkhaṇa**, one of the 9 kinds of relative compounds (**bahubbīhi**). It indicates a reciprocal action. E.g., *daṇḍehi ca daṇḍehi ca paharitvā idaṃ yuddhaṃ pavattati ti daṇḍādaṇḍi*, a fight in which they strike one another with sticks is called *daṇḍādaṇḍi*, sticks with sticks. (Rū. §352 (p. 207))"},"L":"1112","def":"byatihāralakkhaṇa","id":"bahubbihi-byatiharalakkhana"},{"tipo":"p","texto":{"es":"Otro ejemplo (Rū., p. 207):","en":"Another example (Rū., p. 207):"},"L":"1112b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"bahubbihi-l1112b"},{"tipo":"interlineal","origen":"par","compuesto":"kesākesi","traduccion":{"es":"pelea en que se agarran mutuamente de los cabellos","en":"fight in which they seize one another by the hair"},"viggaha":[{"p":"kesesu","g":{"es":"de los cabellos","en":"by the hair"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"kesesu","g":{"es":"de los cabellos","en":"by the hair"}},{"p":"ca gahetvā","g":{"es":"agarrando","en":"seizing"}},{"p":"idaṃ","g":{"es":"esta","en":"this"}},{"p":"yuddhaṃ","g":{"es":"pelea","en":"fight"}},{"p":"pavattati","g":{"es":"sucede","en":"takes place"}},{"p":"ti","g":{"es":"por lo tanto","en":"therefore"}},{"p":"kesākesi","g":{"es":"pelea en que se agarran mutuamente de los cabellos","en":"fight in which they seize one another by the hair"},"r":true},{"p":".","g":{"es":"","en":""}}],"texto":{"es":"kesesu (de los cabellos) ca (y) kesesu (de los cabellos) ca gahetvā (agarrando) idaṃ (esta) yuddhaṃ (pelea) pavattati (sucede) ti (por lo tanto) kesākesi (pelea en que se agarran mutuamente de los cabellos).","en":"kesesu (by the hair) ca (and) kesesu (by the hair) ca gahetvā (seizing) idaṃ (this) yuddhaṃ (fight) pavattati (takes place) ti (therefore) kesākesi (fight in which they seize one another by the hair)."},"L":"1112d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L_resolucion":"1112e","anexos":[{"es":"La vocal del medio se alarga por Kacc. §403 (Rū. §354) y la final pasa a i por «Tesu vuddhi…» (Kacc. §404). Ni kesākesi ni daṇḍādaṇḍi se encuentran en el Tipiṭaka con sus comentarios del Sexto Concilio; sólo en las gramáticas.","en":"The middle vowel is lengthened by Kacc. §403 (Rū. §354) and the final one becomes i by “Tesu vuddhi…” (Kacc. §404). Neither kesākesi nor daṇḍādaṇḍi is found in the Tipiṭaka with its commentaries of the Sixth Council; only in the grammars.","fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","L":"1112f"}],"id":"c-kesakesi"},{"tipo":"p","texto":{"es":"Resolución de los compuestos complejos. Un compuesto que contiene otros compuestos (gabbha) se resuelve por pasos, cada uno con su propia resolución, y el último paso da la clase del conjunto. Rūpasiddhi resuelve así nānādumapatitapupphavāsitasānu, [el monte] de valles perfumados por las flores caídas de varios árboles: «nānappakārā dumā nānādumā, nānādumehi patitāni nānādumapatitāni, nānādumapatitāni ca tāni pupphāni cā ti nānādumapatitapupphāni, tehi vāsitā nānādumapatitapupphavāsitā, nānādumapatitapupphavāsitā sānū yassa pabbatassa so ’yaṃ nānādumapatitapupphavāsitasānu pabbato. Ayaṃ pana kammadhārayatappurisagabbho tulyādhikaraṇabahubbīhi», éste es un compuesto relativo que tiene la misma localización y que contiene un compuesto adjetivo y un compuesto determinativo (Rū., pp. 203–204). La vutti de Kaccāyana trae una docena de casos semejantes, casi todos con una segunda resolución como compuesto relativo que no tiene la misma localización (bhinnādhikaraṇabahubbīhi): «Vāsitā sānū vāsitasānu; sāpekkhatte sati pi gamakattā samāso», valles perfumados [se llaman] vāsitasānu; aunque mira a otro lugar, porque puede transmitir el significado, es un compuesto (Kacc. §328).","en":"Resolution of complex compounds. A compound that contains other compounds (gabbha) is resolved in steps, each with its own resolution, and the last step gives the class of the whole. Rūpasiddhi resolves in this way nānādumapatitapupphavāsitasānu, [the mountain] of valleys perfumed by the flowers fallen from various trees: “nānappakārā dumā nānādumā, nānādumehi patitāni nānādumapatitāni, nānādumapatitāni ca tāni pupphāni cā ti nānādumapatitapupphāni, tehi vāsitā nānādumapatitapupphavāsitā, nānādumapatitapupphavāsitā sānū yassa pabbatassa so ’yaṃ nānādumapatitapupphavāsitasānu pabbato. Ayaṃ pana kammadhārayatappurisagabbho tulyādhikaraṇabahubbīhi”, this is a relative compound which has the same location and which contains an adjectival compound and a determinative compound (Rū., pp. 203–204). The vutti of Kaccāyana gives a dozen similar cases, almost all with a second resolution as a relative compound which does not have the same location (bhinnādhikaraṇabahubbīhi): “Vāsitā sānū vāsitasānu; sāpekkhatte sati pi gamakattā samāso”, perfumed valleys [are called] vāsitasānu; although it is looking to another place, because it can convey the meaning, it is a compound (Kacc. §328)."},"L":"1112i","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"bahubbihi-l1112i"}],"ref":"Kacc. §328; Rū. §352"},{"id":"dvanda","n":6,"pali":"dvanda","titulo":{"es":"Compuesto copulativo (dvanda-samāsa)","en":"Copulative compound (dvanda-samāsa)"},"kacc":[329],"L":"1125","bloques":[{"tipo":"p","texto":{"es":"Este tipo de compuesto une dos o más nombres que están en la misma inflexión, que se refieren a cosas diferentes y que están relacionados por su significado (yuttattha). En la resolución cada miembro va seguido de la partícula *ca*, y; en el compuesto la partícula no se usa, porque el compuesto mismo ya expresa ese significado (*vuttatthānam appayogo*, no se usa lo que ya está expresado). Ej., *Sāriputto ca Moggallāno ca* = *Sāriputtamoggallānā*, Sāriputta y Moggallāna.","en":"This type of compound joins two or more nouns that are in the same inflection, that refer to different things and that are connected in meaning (yuttattha). In the resolution each member is followed by the particle *ca*, and; in the compound the particle is not used, because the compound itself already expresses that meaning (*vuttatthānam appayogo*, what has already been expressed is not used). E.g., *Sāriputto ca Moggallāno ca* = *Sāriputtamoggallānā*, Sāriputta and Moggallāna."},"L":"1125c","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Moggallāna","id":"dvanda-l1125c"},{"tipo":"p","texto":{"es":"La regla es *Nāmānaṃ samuccayo dvando*: la colección (samuccaya) de nombres [que tienen la misma inflexión] recibe el nombre *dvanda* (compuesto copulativo) (Kacc. §329; Rū. §357). En este compuesto el significado de ambos miembros es predominante (ubhayapadatthappadhāna). Rūpasiddhi explica el nombre: *dve dve padāni dvandā*, las palabras de dos en dos se llaman *dvanda*, par; por su semejanza con un par, este compuesto también se llama *dvanda*.","en":"The rule is *Nāmānaṃ samuccayo dvando*: the collection (samuccaya) of nouns [having the same inflection] has the name *dvanda* (copulative compound) (Kacc. §329; Rū. §357). In this compound the meaning of both members predominates (ubhayapadatthappadhāna). Rūpasiddhi explains the name: *dve dve padāni dvandā*, words in twos are called *dvanda*, pair; owing to its resemblance to a pair, this compound is also called *dvanda*."},"L":"1125e","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Moggallāna","id":"dvanda-l1125e"},{"tipo":"p","texto":{"es":"Este compuesto no debe confundirse con el compuesto adjetivo en que ambos miembros califican (visesanobhayapada), véase arriba. En el compuesto adjetivo los dos miembros se refieren a una misma cosa (tulyādhikaraṇa) y la resolución lleva el pronombre *ta*: *sītañ ca taṃ uṇhañ ca* = *sītuṇhaṃ*, (algo que es) frío y caliente. En el compuesto copulativo cada miembro se refiere a una cosa diferente y la resolución lleva solamente *ca*: *sītañ ca uṇhañ ca* = *sītuṇhaṃ*, el frío y el calor.[^12]","en":"This compound must not be confused with the adjectival compound in which both members are qualifiers (visesanobhayapada), see above. In the adjectival compound the two members refer to the same thing (tulyādhikaraṇa) and the resolution has the pronoun *ta*: *sītañ ca taṃ uṇhañ ca* = *sītuṇhaṃ*, (something that is) cold and hot. In the copulative compound each member refers to a different thing and the resolution has only *ca*: *sītañ ca uṇhañ ca* = *sītuṇhaṃ*, cold and heat.[^12]"},"L":"1125h","iebh":true,"fuente":"Rūpasiddhi","id":"dvanda-l1125h"},{"tipo":"p","texto":{"es":"La colección (samuccaya), es decir, la acción de reunir (sampiṇḍana), es de cuatro clases según el significado: (1) colección simple (kevalasamuccaya), (2) adición secundaria (anvācaya), (3) unión de uno con otro (itarītarayoga) y (4) colectivo (samāhāra). En las dos primeras no se forma compuesto, porque cada nombre depende del verbo y no de los otros nombres: *cīvaraṃ piṇḍapātañ ca paccayaṃ sayanāsanaṃ adāsi*, dio la túnica, la comida, el requisito [de medicinas] y el alojamiento (colección simple); *dānañ ca dehi, sīlañ ca rakkhāhi*, da dádivas y guarda la moralidad (adición secundaria). El compuesto se forma solamente en las dos últimas, porque en ellas los nombres están conectados entre sí.[^13]","en":"The collection (samuccaya), that is, the act of bringing together (sampiṇḍana), is of four kinds according to meaning: (1) simple collection (kevalasamuccaya), (2) secondary addition (anvācaya), (3) union of one with another (itarītarayoga) and (4) collective (samāhāra). In the first two no compound is formed, because each noun depends on the verb and not on the other nouns: *cīvaraṃ piṇḍapātañ ca paccayaṃ sayanāsanaṃ adāsi*, he gave the robe, the food, the requisite [of medicines] and the lodging (simple collection); *dānañ ca dehi, sīlañ ca rakkhāhi*, give gifts and guard morality (secondary addition). The compound is formed only in the last two, because in them the nouns are connected with one another.[^13]"},"L":"1125l","iebh":true,"fuente":"Rūpasiddhi","id":"dvanda-l1125l"},{"tipo":"p","texto":{"es":"Por lo tanto, hay dos clases de compuesto copulativo: (1) individual (itarītarayoga-dvanda) y (2) colectivo (samāhāra-dvanda). (Rū. §357)","en":"Therefore there are two kinds of copulative compound: (1) individual (itarītarayoga-dvanda) and (2) collective (samāhāra-dvanda). (Rū. §357)"},"L":"1125n","iebh":true,"fuente":"Rūpasiddhi","id":"dvanda-l1125n"},{"tipo":"p","texto":{"es":"Este compuesto tiene el género de ambos miembros.","en":"This compound has the gender of both members."},"L":"1125p","iebh":true,"fuente":"Nandisena, «Qué género tienen cada uno de los seis compuestos» (2004)","id":"dvanda-l1125p"},{"tipo":"p","texto":{"es":"Las gramáticas lo precisan así. En el compuesto copulativo individual, el compuesto toma el género del último miembro («parass’ eva liṅgañ ca», Rū. §357 (p. 209); «ekattābhāve bahuvacanaṃ, parass’ eva liṅgañ ca», Rū. §360 (p. 213)): mātāpitaro, masculino, como pitā; bhikkhubhikkhuniyo, femenino, como bhikkhunī («evam eva mayhaṃ bhikkhubhikkhuniyo», S. ii 501 (PTS iv 315)). En el colectivo es neutro y singular, sea cual sea el género de los miembros: mukhanāsikaṃ, de mukha, neutro, y nāsikā, femenino (Kacc. §322; Rū. §359). La frase de Nandisena se cumple tal cual sólo en el individual cuyos dos miembros tienen el mismo género: Sāriputtamoggallānā, samaṇabrāhmaṇā.","en":"The grammars qualify it as follows. In the individual copulative compound, the compound takes the gender of the last member (“parass’ eva liṅgañ ca”, Rū. §357 (p. 209); “ekattābhāve bahuvacanaṃ, parass’ eva liṅgañ ca”, Rū. §360 (p. 213)): mātāpitaro, masculine, like pitā; bhikkhubhikkhuniyo, feminine, like bhikkhunī (“evam eva mayhaṃ bhikkhubhikkhuniyo”, S. ii 501 (PTS iv 315)). In the collective it is neuter and singular, whatever the gender of the members: mukhanāsikaṃ, from mukha, neuter, and nāsikā, feminine (Kacc. §322; Rū. §359). Nandisena’s sentence holds as it stands only in the individual compound whose two members have the same gender: Sāriputtamoggallānā, samaṇabrāhmaṇā."},"L":"1125s","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"dvanda-l1125s"},{"tipo":"h","nivel":2,"texto":{"es":"(1) Individual (itarītarayoga-dvanda)","en":"(1) Individual (itarītarayoga-dvanda)"},"L":"1125x","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Moggallāna","id":"dvanda-itaritarayoga-dvanda"},{"tipo":"p","texto":{"es":"En este tipo cada miembro conserva su propio significado y es predominante (avayavappadhāna); por eso el compuesto está siempre en plural [salvo cuando depende de «yuga», par: véase la nota], en todas las inflexiones, y tiene el género del último miembro: *Sāriputtamoggallānā*, *Sāriputtamoggallāne*, *Sāriputtamoggallānehi*, etc. (Rū. §357)[^14]","en":"In this type each member keeps its own meaning and predominates (avayavappadhāna); that is why the compound is always in the plural [except when it depends on “yuga”, pair: see the note], in all the inflections, and has the gender of the last member: *Sāriputtamoggallānā*, *Sāriputtamoggallāne*, *Sāriputtamoggallānehi*, etc. (Rū. §357)[^14]"},"L":"1125z","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Moggallāna","id":"dvanda-l1125z"},{"tipo":"ejemplos","columnas":3,"filas":[{"sentido":{"es":"","en":""},"resolucion":"Sāriputto ca Moggallāno ca","compuesto":"Sāriputtamoggallānā","traduccion":{"es":"Sāriputta y Moggallāna","en":"Sāriputta and Moggallāna"}},{"sentido":{"es":"","en":""},"resolucion":"samaṇo ca brāhmaṇo ca","compuesto":"samaṇabrāhmaṇā","traduccion":{"es":"ascetas y brahmanes","en":"ascetics and brahmins"}},{"sentido":{"es":"","en":""},"resolucion":"devā ca manussā ca","compuesto":"devamanussā","traduccion":{"es":"devas y seres humanos","en":"devas and human beings"}},{"sentido":{"es":"","en":""},"resolucion":"candimā ca sūriyo ca","compuesto":"candimasūriyā","traduccion":{"es":"la luna y el sol","en":"the moon and the sun"}},{"sentido":{"es":"","en":""},"resolucion":"brāhmaṇo ca gahapatiko ca","compuesto":"brāhmaṇagahapatikā","traduccion":{"es":"brahmanes y dueños de casa","en":"brahmins and householders"}},{"sentido":{"es":"","en":""},"resolucion":"mātā ca pitā ca","compuesto":"mātāpitaro","traduccion":{"es":"madre y padre","en":"mother and father"}},{"sentido":{"es":"","en":""},"resolucion":"pitā ca putto ca","compuesto":"pitāputtā","traduccion":{"es":"padre e hijo","en":"father and son"}}],"cabecera":[{"es":"resolución","en":"resolution"},{"es":"compuesto","en":"compound"},{"es":"traducción","en":"translation"}],"L":"1125ab","hasta":"1125ak","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Moggallāna","id":"dvanda-l1125ab"},{"tipo":"p","texto":{"es":"En *mātāpitaro* y *pitāputtā* la *u* final del primer miembro (*mātu*, *pitu*) se convierte en *ā* en el compuesto copulativo, por la regla *Tesu vuddhi…* (Kacc. §404; Rū. §370).","en":"In *mātāpitaro* and *pitāputtā* the final *u* of the first member (*mātu*, *pitu*) becomes *ā* in the copulative compound, by the rule *Tesu vuddhi…* (Kacc. §404; Rū. §370)."},"L":"1125am","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Moggallāna","id":"dvanda-l1125am"},{"tipo":"p","texto":{"es":"Orden de los miembros. Generalmente el miembro más venerable (accitatara) se coloca primero: *Sāriputtamoggallānā*, *samaṇabrāhmaṇā*, *devamanussā*, *mātāpitaro*. A veces se coloca primero el miembro de menos vocales (appasara): *cando ca sūriyo ca* = *candasūriyā*, la luna y el sol; *nigamā ca janapadā ca* = *nigamajanapadā*, pueblos y distritos. A veces se coloca primero el miembro terminado en *i* o en *u*: *aggi ca dhūmo ca* = *aggidhūmā*, fuego y humo; *dhātavo ca liṅgāni ca* = *dhātuliṅgāni*, raíces y bases. A veces, entre miembros terminados en *a*, se coloca primero el que empieza con vocal: *attho ca dhammo ca* = *atthadhammā*, el significado y el Dhamma; también *atthasaddā* o *saddatthā*, el significado y la palabra. Cuando los miembros son muchos, no hay un orden fijo. (Rū. §357–§358)","en":"Order of the members. Generally the more honoured member (accitatara) is placed first: *Sāriputtamoggallānā*, *samaṇabrāhmaṇā*, *devamanussā*, *mātāpitaro*. Sometimes the member with fewer vowels (appasara) is placed first: *cando ca sūriyo ca* = *candasūriyā*, the moon and the sun; *nigamā ca janapadā ca* = *nigamajanapadā*, towns and districts. Sometimes the member ending in *i* or in *u* is placed first: *aggi ca dhūmo ca* = *aggidhūmā*, fire and smoke; *dhātavo ca liṅgāni ca* = *dhātuliṅgāni*, roots and bases. Sometimes, between members ending in *a*, the one beginning with a vowel is placed first: *attho ca dhammo ca* = *atthadhammā*, the meaning and the Dhamma; also *atthasaddā* or *saddatthā*, the meaning and the word. When the members are many, there is no fixed order. (Rū. §357–§358)"},"L":"1125aq","iebh":true,"fuente":"Rūpasiddhi","id":"dvanda-l1125aq"},{"tipo":"p","texto":{"es":"Rūpasiddhi lo resume en un verso:","en":"Rūpasiddhi sums it up in a verse:"},"verso":{"es":"Accitappasaraṃ pubbaṃ, ivaṇṇuvaṇṇakaṃ kvaci;\ndvande sarādyakārantaṃ, bahūsv aniyamo bhave.","en":"Accitappasaraṃ pubbaṃ, ivaṇṇuvaṇṇakaṃ kvaci;\ndvande sarādyakārantaṃ, bahūsv aniyamo bhave."},"traduccion_verso":{"es":"En el compuesto copulativo [generalmente] va primero [el miembro] más venerable y el de menos vocales; a veces, el terminado en *i* o en *u*; [y] el terminado en *a* que empieza con vocal; cuando son muchos, no hay regla fija.","en":"In the copulative compound [generally] the more honoured [member] and the one with fewer vowels come first; sometimes, the one ending in *i* or in *u*; [and] the one ending in *a* that begins with a vowel; when they are many, there is no fixed rule."},"L":"1125as","iebh":true,"fuente":"Rūpasiddhi","id":"dvanda-l1125as"},{"tipo":"p","texto":{"es":"Cuando sigue *pati*, esposo, a *jāyā*, esposa, a veces se reemplaza por *tudaṃ* o por *jāni* (Kacc. §339; Rū. §358): *jāyā ca pati ca* = *tudaṃpati*, *jānipati*, esposa y esposo. También *jayampatikā*, donde se añade el niggahīta y se acorta la vocal.[^15]","en":"When *pati*, husband, follows *jāyā*, wife, it is sometimes replaced by *tudaṃ* or by *jāni* (Kacc. §339; Rū. §358): *jāyā ca pati ca* = *tudaṃpati*, *jānipati*, wife and husband. Also *jayampatikā*, where the niggahīta is added and the vowel is shortened.[^15]"},"L":"1125av","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125av"},{"tipo":"p","texto":{"es":"Moggallāna no admite «tudaṃpati». Da «jayampatī», y «jānipatī», «dampatī», «jampatī» como palabras distintas, no como sustituciones de «jāyā»: «‘jānipatī’ ti pakatantarena siddhaṃ, tathā ‘dampatī, jampatī’ ti» (Moggallāna, p. 137). Según su ṭīkā, la Pañcikā excluye expresamente el uso «tudampati», y con «aññehi ca», «y por otros», se refiere a Rūpasiddhi: «nā ’yam payogo ti tudampatippayogaṃ nivattetvā … aññehi cā ti iminā rūpasiddhiṃ gaṇhāti» (Mogg-p-ṭ., p. 185).","en":"Moggallāna does not admit “tudaṃpati”. He gives “jayampatī”, and “jānipatī”, “dampatī”, “jampatī” as distinct words, not as substitutions of “jāyā”: “‘jānipatī’ ti pakatantarena siddhaṃ, tathā ‘dampatī, jampatī’ ti” (Moggallāna, p. 137). According to its ṭīkā, the Pañcikā expressly excludes the usage “tudampati”, and with “aññehi ca”, “and by others”, refers to Rūpasiddhi: “nā ’yam payogo ti tudampatippayogaṃ nivattetvā … aññehi cā ti iminā rūpasiddhiṃ gaṇhāti” (Mogg-p-ṭ., p. 185)."},"L":"1125az","iebh":true,"fuente":"Rūpasiddhi · Moggallāna-pañcikā-ṭīkā · Moggallāna","id":"dvanda-l1125az"},{"tipo":"h","nivel":2,"texto":{"es":"(2) Colectivo (samāhāra-dvanda)","en":"(2) Collective (samāhāra-dvanda)"},"L":"1125bc","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-samahara-dvanda"},{"tipo":"p","texto":{"es":"Compuesto copulativo colectivo. Los miembros se toman como un conjunto y no individualmente; por eso, igual que el compuesto numérico colectivo (samāhāra-digu), este compuesto está en singular y en género neutro. Ej., *cakkhu ca sotañ ca* = *cakkhusotaṃ*, ojo y oído. (Kacc. §322; Rū. §359)","en":"Collective copulative compound. The members are taken as a whole and not individually; that is why, like the collective numerical compound (samāhāra-digu), this compound is in the singular and in the neuter gender. E.g., *cakkhu ca sotañ ca* = *cakkhusotaṃ*, eye and ear. (Kacc. §322; Rū. §359)"},"L":"1125be","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125be"},{"tipo":"p","texto":{"es":"Se declina en singular según el paradigma de *tilokaṃ*, aplicable a todos los compuestos colectivos (véase el compuesto numérico): *cakkhusotaṃ, he cakkhusota, cakkhusotaṃ, cakkhusotena*, etc. (Rū. §359).[^16]","en":"It is declined in the singular following the paradigm of *tilokaṃ*, which applies to all collective compounds (see the numerical compound): *cakkhusotaṃ, he cakkhusota, cakkhusotaṃ, cakkhusotena*, etc. (Rū. §359).[^16]"},"L":"1125bg","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125bg"},{"tipo":"p","texto":{"es":"El compuesto copulativo es colectivo, por regla y no facultativamente, cuando sus miembros significan partes de los seres, instrumentos musicales, partes de un vehículo, partes de un ejército, criaturas pequeñas, diversos enemigos y cosas distintas pero afines (visabhāga),[^17] etc. (*Tathā dvande pāṇitūriyayoggasenaṅga-khuddajantuka-vividhaviruddha-visabhāgatthādīnañ ca*, Kacc. §322; Rū. §359). Sin embargo, formas como *hatthapādā*, manos y pies, y *maṃsalohitāni*, carne y sangre, se explican como compuesto copulativo individual (Rū. §359).[^18]","en":"The copulative compound is collective, by rule and not facultatively, when its members signify parts of beings, musical instruments, parts of a vehicle, parts of an army, small creatures, different enemies and things different but alike (visabhāga),[^17] etc. (*Tathā dvande pāṇitūriyayoggasenaṅga-khuddajantuka-vividhaviruddha-visabhāgatthādīnañ ca*, Kacc. §322; Rū. §359). However, forms such as *hatthapādā*, hands and feet, and *maṃsalohitāni*, flesh and blood, are explained as an individual copulative compound (Rū. §359).[^18]"},"L":"1125bk","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125bk"},{"tipo":"ejemplos","columnas":4,"filas":[{"sentido":{"es":"partes de los seres (pāṇyaṅga)","en":"parts of beings (pāṇyaṅga)"},"resolucion":"cakkhu ca sotañ ca","compuesto":"cakkhusotaṃ","traduccion":{"es":"ojo y oído","en":"eye and ear"}},{"sentido":{"es":"","en":""},"resolucion":"mukhañ ca nāsikā ca","compuesto":"mukhanāsikaṃ","traduccion":{"es":"boca y nariz","en":"mouth and nose"}},{"sentido":{"es":"","en":""},"resolucion":"chavi ca maṃsañ ca lohitañ ca","compuesto":"chavimaṃsalohitaṃ","traduccion":{"es":"piel, carne y sangre","en":"skin, flesh and blood"}},{"sentido":{"es":"instrumentos musicales (tūriyaṅga)","en":"musical instruments (tūriyaṅga)"},"resolucion":"gītañ ca vāditañ ca","compuesto":"gītavāditaṃ","traduccion":{"es":"canto y música instrumental","en":"singing and instrumental music"}},{"sentido":{"es":"","en":""},"resolucion":"saṅkho ca paṇavo ca","compuesto":"saṅkhapaṇavaṃ","traduccion":{"es":"concha y tambor pequeño","en":"conch and small drum"}},{"sentido":{"es":"partes de un vehículo (yoggaṅga)","en":"parts of a vehicle (yoggaṅga)"},"resolucion":"yugañ ca naṅgalañ ca","compuesto":"yuganaṅgalaṃ","traduccion":{"es":"yugo y arado","en":"yoke and plough"}},{"sentido":{"es":"","en":""},"resolucion":"phālo ca pācanañ ca","compuesto":"phālapācanaṃ","traduccion":{"es":"reja de arado y aguijada","en":"ploughshare and goad"}},{"sentido":{"es":"partes de un ejército (senaṅga)","en":"parts of an army (senaṅga)"},"resolucion":"hatthino ca assā ca","compuesto":"hatthiassaṃ","traduccion":{"es":"elefantes y caballos","en":"elephants and horses"}},{"sentido":{"es":"","en":""},"resolucion":"asi ca cammañ ca","compuesto":"asicammaṃ","traduccion":{"es":"espada y escudo","en":"sword and shield"}},{"sentido":{"es":"criaturas pequeñas (khuddajantuka)","en":"small creatures (khuddajantuka)"},"resolucion":"ḍaṃsā ca makasā ca","compuesto":"ḍaṃsamakasaṃ","traduccion":{"es":"moscas y mosquitos","en":"flies and mosquitoes"}},{"sentido":{"es":"","en":""},"resolucion":"kuntho ca kipilliko ca","compuesto":"kunthakipillikaṃ","traduccion":{"es":"hormiga y hormiga blanca","en":"ant and white ant"}},{"sentido":{"es":"diversos enemigos (vividhaviruddha)","en":"different enemies (vividhaviruddha)"},"resolucion":"ahi ca nakulo ca","compuesto":"ahinakulaṃ","traduccion":{"es":"serpiente y mangosta","en":"snake and mongoose"}},{"sentido":{"es":"","en":""},"resolucion":"kāko ca ulūko ca","compuesto":"kākolūkaṃ","traduccion":{"es":"cuervo y búho","en":"crow and owl"}},{"sentido":{"es":"cosas distintas pero afines (visabhāga)","en":"things different but akin (visabhāga)"},"resolucion":"sīlañ ca paññāṇañ ca","compuesto":"sīlapaññāṇaṃ","traduccion":{"es":"virtud y sabiduría","en":"virtue and wisdom"}},{"sentido":{"es":"","en":""},"resolucion":"samatho ca vipassanā ca","compuesto":"samathavipassanaṃ","traduccion":{"es":"tranquilidad e introspección","en":"tranquillity and insight"}},{"sentido":{"es":"","en":""},"resolucion":"nāmañ ca rūpañ ca","compuesto":"nāmarūpaṃ","traduccion":{"es":"nāma y rūpa","en":"nāma and rūpa"}},{"sentido":{"es":"","en":""},"resolucion":"hiri ca ottappañ ca","compuesto":"hirottappaṃ","traduccion":{"es":"hiri y ottappa","en":"hiri and ottappa"}}],"cabecera":[{"es":"significado","en":"meaning"},{"es":"resolución","en":"resolution"},{"es":"compuesto","en":"compound"},{"es":"traducción","en":"translation"}],"L":"1125bm","hasta":"1125cf","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125bm"},{"tipo":"p","texto":{"es":"Por la palabra *ādi*, etc., del aforismo, Rūpasiddhi incluye también: nombres que se distinguen por el género (aññoññaliṅgavisesita), números y medidas (saṅkhyāparimāṇa), gente de baja condición (pacanacaṇḍāla) y direcciones (disā). (Rū. §359)","en":"By the word *ādi*, etc., of the aphorism, Rūpasiddhi also includes: nouns distinguished by gender (aññoññaliṅgavisesita), numbers and measures (saṅkhyāparimāṇa), people of low standing (pacanacaṇḍāla) and directions (disā). (Rū. §359)"},"L":"1125cj","iebh":true,"fuente":"Rūpasiddhi","id":"dvanda-l1125cj"},{"tipo":"ejemplos","columnas":4,"filas":[{"sentido":{"es":"distinguidos por el género (aññoññaliṅgavisesita)","en":"distinguished by gender (aññoññaliṅgavisesita)"},"resolucion":"dāsī ca dāso ca","compuesto":"dāsidāsaṃ","traduccion":{"es":"esclava y esclavo","en":"female and male slave"}},{"sentido":{"es":"","en":""},"resolucion":"itthī ca pumā ca","compuesto":"itthipumaṃ","traduccion":{"es":"mujer y hombre","en":"woman and man"}},{"sentido":{"es":"","en":""},"resolucion":"patto ca cīvarañ ca","compuesto":"pattacīvaraṃ","traduccion":{"es":"cuenco y túnica","en":"bowl and robe"}},{"sentido":{"es":"números y medidas (saṅkhyāparimāṇa)","en":"numbers and measures (saṅkhyāparimāṇa)"},"resolucion":"ekakañ ca dukañ ca","compuesto":"ekakadukaṃ","traduccion":{"es":"la unidad y la díada","en":"the unit and the dyad"}},{"sentido":{"es":"","en":""},"resolucion":"tikañ ca catukkañ ca","compuesto":"tikacatukkaṃ","traduccion":{"es":"tríada y tétrada","en":"triad and tetrad"}},{"sentido":{"es":"","en":""},"resolucion":"dīgho ca majjhimo ca","compuesto":"dīghamajjhimaṃ","traduccion":{"es":"largo y mediano[^19]","en":"long and middle[^19]"}},{"sentido":{"es":"gente de baja condición (pacanacaṇḍāla)","en":"people of low standing (pacanacaṇḍāla)"},"resolucion":"orabbhikā ca sūkarikā ca","compuesto":"orabbhikasūkarikaṃ","traduccion":{"es":"carniceros de ovejas y de cerdos","en":"butchers of sheep and of pigs"}},{"sentido":{"es":"","en":""},"resolucion":"sākuṇiko ca māgaviko ca","compuesto":"sākuṇikamāgavikaṃ","traduccion":{"es":"pajarero y cazador","en":"fowler and hunter"}},{"sentido":{"es":"direcciones (disā)","en":"directions (disā)"},"resolucion":"pubbā ca aparā ca","compuesto":"pubbāparaṃ","traduccion":{"es":"este y oeste","en":"east and west"}},{"sentido":{"es":"","en":""},"resolucion":"dakkhiṇā ca uttarā ca","compuesto":"dakkhiṇuttaraṃ","traduccion":{"es":"sur y norte","en":"south and north"}}],"cabecera":[{"es":"significado","en":"meaning"},{"es":"resolución","en":"resolution"},{"es":"compuesto","en":"compound"},{"es":"traducción","en":"translation"}],"L":"1125cl","hasta":"1125cx","iebh":true,"fuente":"Rūpasiddhi","id":"dvanda-l1125cl"},{"tipo":"p","texto":{"es":"En los compuestos de números el número menor va primero: *ekakadukaṃ*, *dukatikaṃ*, *tikacatukkaṃ*. En *dāsidāsaṃ* se acorta la vocal del medio (*dāsī* → *dāsi*).","en":"In compounds of numbers the smaller number comes first: *ekakadukaṃ*, *dukatikaṃ*, *tikacatukkaṃ*. In *dāsidāsaṃ* the middle vowel is shortened (*dāsī* → *dāsi*)."},"L":"1125cz","iebh":true,"fuente":"Rūpasiddhi","id":"dvanda-l1125cz"},{"tipo":"p","texto":{"es":"En «pacanacaṇḍāla», «pacana» no es aquí «cocinar». Según U Sīlānanda (clase de Rūpasiddhi n.º 50), se dice en sentido figurado de los que dañan a otros seres, como si los quemaran, como los que matan ovejas, cerdos, aves y animales de caza (orabbhika, sūkarika, sākuṇika, māgavika); y «caṇḍāla» es el nombre de un grupo de gente que hacía trabajos despreciables, como cuidar los cementerios y quemar los cadáveres. Rūpasiddhi y Niruttidīpanī dan la clase y sus ejemplos sin explicar el nombre (Rū. §359 (p. 212); Niruttidīpanī p. 135).","en":"In “pacanacaṇḍāla”, “pacana” does not mean “cooking” here. According to U Sīlānanda (Rūpasiddhi class no. 50), it is said figuratively of those who harm other beings, as if they burned them, such as those who kill sheep, pigs, birds and game animals (orabbhika, sūkarika, sākuṇika, māgavika); and “caṇḍāla” is the name of a group of people who did despised work, such as tending the cemeteries and burning the corpses. Rūpasiddhi and Niruttidīpanī give the class and its examples without explaining the name (Rū. §359 (p. 212); Niruttidīpanī p. 135)."},"L":"1125dd","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī · U Sīlānanda","id":"dvanda-l1125dd"},{"tipo":"p","texto":{"es":"Con los nombres de árboles, hierbas, animales, riquezas, granos y distritos, etc., el compuesto copulativo es colectivo facultativamente: está en singular y en género neutro o, si no, en plural y con el género del último miembro (*Vibhāsā rukkha-tiṇa-pasu-dhana-dhañña-janapadādīnañ ca*, Kacc. §323; Rū. §360).","en":"With the names of trees, grasses, animals, wealth, grains and districts, etc., the copulative compound is facultatively collective: it is in the singular and in the neuter gender or, otherwise, in the plural and with the gender of the last member (*Vibhāsā rukkha-tiṇa-pasu-dhana-dhañña-janapadādīnañ ca*, Kacc. §323; Rū. §360)."},"L":"1125dg","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125dg"},{"tipo":"ejemplos","columnas":4,"filas":[{"sentido":{"es":"árboles (rukkha)","en":"trees (rukkha)"},"resolucion":"assatthā ca kapitthā ca","compuesto":"assatthakapitthaṃ, assatthakapitthā vā","traduccion":{"es":"higueras sagradas y manzanos de madera","en":"sacred fig trees and wood-apple trees"}},{"sentido":{"es":"hierbas (tiṇa)","en":"grasses (tiṇa)"},"resolucion":"usīrāni ca bīraṇāni ca","compuesto":"usīrabīraṇaṃ, usīrabīraṇāni vā","traduccion":{"es":"usīra y bīraṇa (hierbas)","en":"usīra and bīraṇa (grasses)"}},{"sentido":{"es":"animales (pasu)","en":"animals (pasu)"},"resolucion":"ajā ca eḷakā ca","compuesto":"ajeḷakaṃ, ajeḷakā vā","traduccion":{"es":"cabras y ovejas","en":"goats and sheep"}},{"sentido":{"es":"","en":""},"resolucion":"hatthī ca gāvo ca assā ca vaḷavā ca","compuesto":"hatthigavassavaḷavaṃ, hatthigavassavaḷavā vā","traduccion":{"es":"elefantes, vacas, caballos y yeguas","en":"elephants, cows, horses and mares"}},{"sentido":{"es":"riquezas (dhana)","en":"wealth (dhana)"},"resolucion":"hiraññañ ca suvaṇṇañ ca","compuesto":"hiraññasuvaṇṇaṃ, hiraññasuvaṇṇāni vā","traduccion":{"es":"plata y oro","en":"silver and gold"}},{"sentido":{"es":"granos (dhañña)","en":"grains (dhañña)"},"resolucion":"sālī ca yavā ca","compuesto":"sāliyavaṃ, sāliyavā vā","traduccion":{"es":"arroz y cebada","en":"rice and barley"}},{"sentido":{"es":"distritos (janapada)","en":"districts (janapada)"},"resolucion":"kāsī ca kosalā ca","compuesto":"Kāsikosalaṃ, Kāsikosalā vā","traduccion":{"es":"Kāsī y Kosalā","en":"Kāsī and Kosalā"}},{"sentido":{"es":"","en":""},"resolucion":"vajjī ca mallā ca","compuesto":"Vajjimallaṃ, Vajjimallā vā","traduccion":{"es":"Vajjī y Mallā","en":"Vajjī and Mallā"}}],"cabecera":[{"es":"significado","en":"meaning"},{"es":"resolución","en":"resolution"},{"es":"compuesto","en":"compound"},{"es":"traducción","en":"translation"}],"L":"1125di","hasta":"1125ds","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125di"},{"tipo":"p","texto":{"es":"Por la palabra *ādi*, etc., Rūpasiddhi incluye aquí también los opuestos (aññoññappaṭipakkhadhamma) y las aves (sakuṇa):[^20]","en":"By the word *ādi*, etc., Rūpasiddhi here also includes opposites (aññoññappaṭipakkhadhamma) and birds (sakuṇa):[^20]"},"L":"1125du","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125du"},{"tipo":"ejemplos","columnas":4,"filas":[{"sentido":{"es":"opuestos (aññoññappaṭipakkhadhamma)","en":"opposites (aññoññappaṭipakkhadhamma)"},"resolucion":"kusalañ ca akusalañ ca","compuesto":"kusalākusalaṃ, kusalākusalā vā","traduccion":{"es":"kusala y akusala","en":"kusala and akusala"}},{"sentido":{"es":"","en":""},"resolucion":"sukhañ ca dukkhañ ca","compuesto":"sukhadukkhaṃ, sukhadukkhāni vā","traduccion":{"es":"placer y dolor","en":"pleasure and pain"}},{"sentido":{"es":"","en":""},"resolucion":"ratti ca divā ca","compuesto":"rattindivaṃ, rattindivā vā","traduccion":{"es":"noche y día","en":"night and day"}},{"sentido":{"es":"","en":""},"resolucion":"ahañ ca ratti ca","compuesto":"ahorattaṃ, ahorattā vā","traduccion":{"es":"día y noche","en":"day and night"}},{"sentido":{"es":"aves (sakuṇa)","en":"birds (sakuṇa)"},"resolucion":"haṃsā ca bakā ca","compuesto":"haṃsabakaṃ, haṃsabakā vā","traduccion":{"es":"cisnes y garzas","en":"swans and herons"}}],"cabecera":[{"es":"significado","en":"meaning"},{"es":"resolución","en":"resolution"},{"es":"compuesto","en":"compound"},{"es":"traducción","en":"translation"}],"L":"1125dw","hasta":"1125ed","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1125dw"},{"tipo":"p","texto":{"es":"Para las precisiones de las fuentes sobre el género véase cada clase: en el compuesto adverbial es el compuesto entero el que se considera neutro (Kacc. §320; Rū. §335); el compuesto numérico no colectivo va en singular con «eka» (ekapuggalo, Rū. §350); en el compuesto copulativo, Rūpasiddhi da el género del último miembro para el individual y el neutro singular para el colectivo (Rū. §357; Rū. §359).","en":"For the qualifications from the sources on gender, see each class: in the adverbial compound it is the whole compound that is regarded as neuter (Kacc. §320; Rū. §335); the non-collective numerical compound is singular with “eka” (ekapuggalo, Rū. §350); in the copulative compound, Rūpasiddhi gives the gender of the last member for the individual and the neuter singular for the collective (Rū. §357; Rū. §359)."},"L":"1139b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"dvanda-l1139b"}],"ref":"Kacc. §329; Rū. §357 (pp. 207–208); Sad. (Smith p. 767)"}],"resumen":{"tipo":"resumen","cabecera":[{"es":"#","en":"#"},{"es":"Tipo de compuesto","en":"Type of compound"},{"es":"Compuesto (samāsa)","en":"Compound (samāsa)"},{"es":"Resolución (viggaha, vākya)","en":"Resolution (viggaha, vākya)"},{"es":"Significado","en":"Meaning"},{"es":"Género","en":"Gender"}],"filas":[[{"es":"1","en":"1"},{"es":"Compuesto adverbial (abyayībhāva-samāsa)","en":"Adverbial compound (abyayībhāva-samāsa)"},{"es":"upanagaraṃ","en":"upanagaraṃ"},{"es":"nagarassa samīpaṃ","en":"nagarassa samīpaṃ"},{"es":"cerca de la ciudad","en":"near the city"},{"es":"el género del primer miembro, neutro","en":"the gender of the first member, neuter"}],[{"es":"2","en":"2"},{"es":"Compuesto adjetivo (kammadhāraya-samāsa)","en":"Adjectival compound (kammadhāraya-samāsa)"},{"es":"Buddhaghosācariyo","en":"Buddhaghosācariyo"},{"es":"Buddhaghoso ca so ācariyo ca","en":"Buddhaghoso ca so ācariyo ca"},{"es":"el maestro Buddhaghosa","en":"the teacher Buddhaghosa"},{"es":"el género del último miembro (generalmente)","en":"the gender of the last member (generally)"}],[{"es":"3","en":"3"},{"es":"Compuesto numérico (digu-samāsa)","en":"Numerical compound (digu-samāsa)"},{"es":"tilokaṃ","en":"tilokaṃ"},{"es":"tayo lokā samāhaṭā","en":"tayo lokā samāhaṭā"},{"es":"los tres mundos","en":"the three worlds"},{"es":"colectivo (samāhāra-digu): neutro singular; no colectivo (asamāhāra-digu): el género del último miembro y es plural","en":"collective (samāhāra-digu): neuter singular; non-collective (asamāhāra-digu): the gender of the last member, and plural"}],[{"es":"4","en":"4"},{"es":"Compuesto determinativo (tappurisa-samāsa)","en":"Determinative compound (tappurisa-samāsa)"},{"es":"rājaputto","en":"rājaputto"},{"es":"rañño putto","en":"rañño putto"},{"es":"hijo del rey","en":"son of the king"},{"es":"el género del último miembro","en":"the gender of the last member"}],[{"es":"5","en":"5"},{"es":"Compuesto relativo (bahubbīhi-samāsa)","en":"Relative compound (bahubbīhi-samāsa)"},{"es":"chinnahattho","en":"chinnahattho"},{"es":"chinnā hatthā yassa so","en":"chinnā hatthā yassa so"},{"es":"(hombre) cuyas manos han sido cortadas","en":"(a man) whose hands have been cut off"},{"es":"el género de la otra palabra (aññapada)","en":"the gender of the other word (aññapada)"}],[{"es":"6","en":"6"},{"es":"Compuesto copulativo (dvanda-samāsa)","en":"Copulative compound (dvanda-samāsa)"},{"es":"Sāriputtamoggallānā","en":"Sāriputtamoggallānā"},{"es":"Sāriputto ca Moggallāno ca","en":"Sāriputto ca Moggallāno ca"},{"es":"Sāriputta y Moggallāna","en":"Sāriputta and Moggallāna"},{"es":"el género de ambos miembros","en":"the gender of both members"}]],"significado":true,"cols_pali":4,"filas_iebh":[2,3,4,5],"celdas_iebh":{"2":[2,3],"3":[2,3],"4":[2,3],"5":[2,3]},"fuente_iebh":"Rūpasiddhi","L":"1131","hasta":"1139"},"notas":{"1":{"es":"Rūpasiddhi 177.","en":"Rūpasiddhi 177.","iebh":[{"es":"En la edición del Sexto Concilio, CST, el comienzo del Samāsakaṇḍa está en la p. 176.","en":"In the Sixth Council edition, CST, the beginning of the Samāsakaṇḍa is on p. 176.","fuente":"Rūpasiddhi"}]},"2":{"es":"Ejemplo: *pabhaṃ karoti* = *pabhaṅkaro*, haciendo luz, el sol (Kacc. §317; Rū. §332).","en":"Example: *pabhaṃ karoti* = *pabhaṅkaro*, making light, the sun (Kacc. §317; Rū. §332)."},"3":{"es":"También se denomina *nicca-samāsa*, siempre compuesto; esto significa que los miembros del compuesto no pueden ser separados y seguir teniendo el mismo significado. Ej., *upa-nagaraṃ*, cerca de la ciudad; este significado se obtiene solamente cuando los dos componentes (*upa* y *nagara*) forman un compuesto; no es posible lograr este significado separando los dos miembros como *upa nagaraṃ* o *nagaraṃ upa*. Para expresar ese significado (cerca de la ciudad) se debe usar otra voz diferente a la usada en el compuesto; *upanagaraṃ* se define como *nagarassa samīpaṃ*. En este caso *samīpaṃ*, cerca, es la otra voz.","en":"It is also called *nicca-samāsa*, always a compound; this means that the members of the compound cannot be separated and still have the same meaning. E.g., *upa-nagaraṃ*, near the city; this meaning is obtained only when the two components (*upa* and *nagara*) form a compound; it is not possible to obtain this meaning by separating the two members as *upa nagaraṃ* or *nagaraṃ upa*. To express that meaning (near the city) a word different from the one used in the compound must be used; *upanagaraṃ* is defined as *nagarassa samīpaṃ*. In this case *samīpaṃ*, near, is the other word.","iebh":[{"es":"Por eso dice Rūpasiddhi: «So ca niccasamāso ti assapadaviggaho», y éste, por ser compuesto obligatorio (niccasamāsa), se resuelve con palabras que no son las suyas (assapadaviggaha; Saddanīti escribe «asapada-») (Rū., p. 176; Sad. (Smith p. 752)). Según Suttaniddesa, el compuesto adverbial es obligatorio «en la mayoría de los casos» (yebhūyyena), y hay unos pocos que no lo son, como «majjhe samuddasmiṃ» y «tiro pabbataṃ» (Suttaniddesa, ad Kacc. §319).","en":"That is why Rūpasiddhi says: “So ca niccasamāso ti assapadaviggaho”, and this, being an obligatory compound (niccasamāsa), is resolved with words that are not its own (assapadaviggaha; Saddanīti writes “asapada-”) (Rū., p. 176; Sad. (Smith p. 752)). According to Suttaniddesa, the adverbial compound is obligatory “in most cases” (yebhūyyena), and there are a few that are not, such as “majjhe samuddasmiṃ” and “tiro pabbataṃ” (Suttaniddesa, ad Kacc. §319).","fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Suttaniddesa"}]},"4":{"es":"En la quinta inflexión no hay terminación en *aṃ*; en la tercera, sexta y séptima la inflexión *aṃ* es opcional; en las restantes inflexiones solamente la terminación es *aṃ*.","en":"In the fifth inflection there is no ending in *aṃ*; in the third, sixth and seventh the inflection *aṃ* is optional; in the remaining inflections the ending is only *aṃ*.","iebh":[{"es":"Así lo dice la estrofa de Rūpasiddhi: «Na pañcamyāyam ambhāvo, kvaci ti adhikārato; tatiyāsattamī-chaṭṭhīnan tu hoti vikappato», en la quinta no hay este «aṃ», porque rige «kvaci» (adhikāra); en la tercera, la séptima y la sexta ocurre opcionalmente (Rū. §336).","en":"So says the stanza of Rūpasiddhi: “Na pañcamyāyam ambhāvo, kvaci ti adhikārato; tatiyāsattamī-chaṭṭhīnan tu hoti vikappato”, in the fifth there is not this “aṃ”, because “kvaci” governs (adhikāra); in the third, the seventh and the sixth it occurs optionally (Rū. §336).","fuente":"Rūpasiddhi"}]},"5":{"es":"*Samakkhikaṃ bhuñjati*, él come hasta las moscas.","en":"*Samakkhikaṃ bhuñjati*, he eats even the flies.","iebh":[{"es":"Es decir, no deja nada aparte («na kiñci parivajjetī ti attho», Rū. §338). En el canon: «Sakaṇṭakaṃ so gilati, jaccandho ’va samakkhikaṃ», [el rey que castiga sin examinar] traga [la comida] con espinas, como el ciego de nacimiento [come] con moscas (J. i 253, Mahāpaduma-jātaka; JA. iv 192 (PTS iv 192)).","en":"That is, he leaves nothing aside (“na kiñci parivajjetī ti attho”, Rū. §338). In the canon: “Sakaṇṭakaṃ so gilati, jaccandho ’va samakkhikaṃ”, [the king who punishes without examining] swallows [the food] with thorns, as one blind from birth [eats] with flies (J. i 253, Mahāpaduma-jātaka; JA. iv 192 (PTS iv 192)).","fuente":"Rūpasiddhi · Tipiṭaka · Aṭṭhakathā"}]},"6":{"es":"*Tulyaṃ samānaṃ adhikaraṇaṃ attho yassa padadvayassa taṃ tulyādhikaraṇaṃ*. Esto significa que ambos miembros del compuesto se refieren a la misma cosa (Rū. §339).","en":"*Tulyaṃ samānaṃ adhikaraṇaṃ attho yassa padadvayassa taṃ tulyādhikaraṇaṃ*. This means that both members of the compound refer to the same thing (Rū. §339).","iebh":[{"es":"Rūpasiddhi añade: «Bhinnappavattinimittānaṃ dvinnaṃ padānaṃ visesanavisesitabbabhāvena ekasmiṃ atthe pavatti tulyādhikaraṇatā», es decir, hay tulyādhikaraṇatā cuando dos palabras que se aplican por motivos distintos (pavattinimitta) se aplican a una sola cosa, una como calificativo (visesana) y la otra como lo calificado (visesitabba) (Rū. §339; igual en Sad. (Smith p. 751)).","en":"Rūpasiddhi adds: “Bhinnappavattinimittānaṃ dvinnaṃ padānaṃ visesanavisesitabbabhāvena ekasmiṃ atthe pavatti tulyādhikaraṇatā”, that is, there is tulyādhikaraṇatā when two words that apply for different reasons (pavattinimitta) apply to a single thing, one as the qualifier (visesana) and the other as the qualified (visesitabba) (Rū. §339; likewise in Sad. (Smith p. 751)).","fuente":"Rūpasiddhi · Saddanīti"}]},"7":{"es":"*Kammaṃ iva dvayaṃ dhārayati*: contiene un par como el objeto.","en":"*Kammaṃ iva dvayaṃ dhārayati*: it contains a pair, like the object.","iebh":[{"es":"Rūpasiddhi lo explica así: «Así como el objeto (kamma) sostiene dos cosas, la acción y su finalidad —porque si hay objeto hay acción y hay finalidad—, así este compuesto sostiene dos nombres de una sola cosa, porque si hay compuesto hay dos nombres que expresan un solo significado» (Rū. §339; igual en Sad. (Smith p. 751)). Suttaniddesa lo ilustra con «kaṭaṃ karoti», hace una estera: el objeto, la estera, sostiene la acción de hacerla y su finalidad, sentarse en ella (Suttaniddesa, ad Kacc. §324).","en":"Rūpasiddhi explains it thus: “Just as the object (kamma) holds two things, the action and its purpose—because if there is an object there is an action and there is a purpose—so this compound holds two names of a single thing, because if there is a compound there are two names that express a single meaning” (Rū. §339; likewise in Sad. (Smith p. 751)). Suttaniddesa illustrates it with “kaṭaṃ karoti”, he makes a mat: the object, the mat, holds the action of making it and its purpose, sitting on it (Suttaniddesa, ad Kacc. §324).","fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Suttaniddesa"}]},"8":{"es":"\"Bahavo (muchos) vīhayo (granos) yassa (de éste), éste (so) [es un lugar donde hay] muchos granos (bahubbīhi)\". (Rū. §352).","en":"“Bahavo (many) vīhayo (grains) yassa (of this one), this one (so) [is a place where there are] many grains (bahubbīhi)”. (Rū. §352)."},"9":{"es":"aññapada, lit., otra palabra. Término técnico usado para referirse a *ya*, *ta*, *eta* y *ima*. Estos pronombres se usan en la resolución (viggaha) de los compuestos relativos (bahubbīhi). Ej., *chinno hattho yassa so ti chinnahattho*, mano cortada de éste, él es (un hombre de) mano cortada. En este ejemplo, *yassa* se denomina *aññapada* y se utiliza para resolver el compuesto. (Kacc. §328; Rū. §352; Nir. 247)","en":"aññapada, lit., other word. A technical term used to refer to *ya*, *ta*, *eta* and *ima*. These pronouns are used in the resolution (viggaha) of relative compounds (bahubbīhi). E.g., *chinno hattho yassa so ti chinnahattho*, cut-off hand of this one, he is (a man of) cut-off hand. In this example, *yassa* is called *aññapada* and is used to resolve the compound. (Kacc. §328; Rū. §352; Nir. 247)"},"10":{"es":"Ref. (Rū. 199, §352).","en":"Ref. (Rū. 199, §352)."},"11":{"es":"A su vez el compuesto relativo es de dos clases: (1) Atagguṇasaṃviññāṇa, tipo de compuesto relativo donde lo que califica al significado no se trae cuando se trae el significado de la otra palabra. Lo que califica al significado no está incluido en el significado de la otra palabra. Ej., *bahudhanaṃ ānaya*, traiga (al hombre de) mucha riqueza. Aquí, lo que califica, mucha riqueza, no se trae cuando se trae al hombre. (2) Tagguṇasaṃviññāṇa, tipo de compuesto relativo donde lo que califica al significado se trae cuando se trae el significado de la otra palabra. Lo que califica al significado está incluido en el significado de la otra palabra. Ej., *lambakaṇṇaṃ ānaya*, traiga (al hombre que tiene) orejas largas. Aquí, lo que califica, orejas largas, se trae cuando se trae al hombre. (Rū. §352)","en":"In turn, the relative compound is of two classes: (1) Atagguṇasaṃviññāṇa, a type of relative compound where what qualifies the meaning is not brought when the meaning of the other word is brought. What qualifies the meaning is not included in the meaning of the other word. E.g., *bahudhanaṃ ānaya*, bring (the man of) much wealth. Here, what qualifies, much wealth, is not brought when the man is brought. (2) Tagguṇasaṃviññāṇa, a type of relative compound where what qualifies the meaning is brought when the meaning of the other word is brought. What qualifies the meaning is included in the meaning of the other word. E.g., *lambakaṇṇaṃ ānaya*, bring (the man who has) long ears. Here, what qualifies, long ears, is brought when the man is brought. (Rū. §352)","iebh":[{"es":"Saddanīti distingue las dos clases por la resolución: es tagguṇasaṃviññāṇa «yattha avayavena viggaho samudāyo samāsattho», cuando se resuelve con la parte y el sentido del compuesto es el conjunto (lambakaṇṇo); y atagguṇasaṃviññāṇa «yattha pana samudāyena viggaho samudāyo samāsattho», cuando se resuelve con el conjunto (bahudhano) (Sad. (Smith p. 760)).","en":"Saddanīti distinguishes the two classes by the resolution: it is tagguṇasaṃviññāṇa “yattha avayavena viggaho samudāyo samāsattho”, when it is resolved with the part and the sense of the compound is the whole (lambakaṇṇo); and atagguṇasaṃviññāṇa “yattha pana samudāyena viggaho samudāyo samāsattho”, when it is resolved with the whole (bahudhano) (Sad. (Smith p. 760)).","fuente":"Saddanīti"},{"es":"Las gramáticas asignan tagguṇa o atagguṇa a cada ejemplo, no a cada clase según la inflexión. Niruttidīpanī da chinnahattho puriso como tagguṇasaṃviññāṇa y dinnasuṅko rājā como atagguṇasaṃviññāṇa (Nir. 242). Saddanīti llama atagguṇasaṃviññāṇa a āgatasamaṇo saṃghārāmo, y tagguṇasaṃviññāṇa a jitindriyo samaṇo, porque el asceta se toma junto con sus facultades, que son parte de él (Sad. (Smith p. 760)).","en":"The grammars assign tagguṇa or atagguṇa to each example, not to each class according to the inflection. Niruttidīpanī gives chinnahattho puriso as tagguṇasaṃviññāṇa and dinnasuṅko rājā as atagguṇasaṃviññāṇa (Nir. 242). Saddanīti calls āgatasamaṇo saṃghārāmo atagguṇasaṃviññāṇa, and jitindriyo samaṇo tagguṇasaṃviññāṇa, because the ascetic is taken together with his faculties, which are part of him (Sad. (Smith p. 760)).","fuente":"Saddanīti · Niruttidīpanī"},{"es":"En estos nombres, «guṇa» no significa «virtud» sino el calificativo: es el significado secundario de los miembros del compuesto, que, por calificar al significado de la otra palabra, se llama «su cualidad» (tagguṇa); y «saṃviññāṇa» es el entenderse junto con: tagguṇasaṃviññāṇa es el compuesto relativo en el que el significado de la otra palabra se entiende junto con su calificativo, sin dejarlo («tagguṇaṃ amuñcitvā tagguṇena sah’ eva viññāṇo aññapadattho yasmin ti tagguṇasaṃviññāṇo», Nir. 129; cf. Rū. §352 (p. 200)). Así lo explica también U Sīlānanda (clase de Rūpasiddhi n.º 47).","en":"In these names, “guṇa” does not mean “virtue” but the qualifier: it is the secondary meaning of the members of the compound, which, because it qualifies the meaning of the other word, is called “its quality” (tagguṇa); and “saṃviññāṇa” is being understood together with: tagguṇasaṃviññāṇa is the relative compound in which the meaning of the other word is understood together with its qualifier, without leaving it (“tagguṇaṃ amuñcitvā tagguṇena sah’ eva viññāṇo aññapadattho yasmin ti tagguṇasaṃviññāṇo”, Nir. 129; cf. Rū. §352 (p. 200)). U Sīlānanda also explains it thus (Rūpasiddhi class no. 47).","fuente":"Rūpasiddhi · Niruttidīpanī · U Sīlānanda"}]},"12":{"es":"En el canon el compuesto copulativo aparece en la Therīgāthā: *Sītuṇhena ca ḍayhantī*, atormentada por el frío y el calor (Thī. 393 (PTS p. 135)), que la Aṭṭhakathā resuelve *sītena ca uṇhena ca* (ThīA. 125 (PTS p. 121)). La resolución sin compuesto también está en el canon: *Yo ’dha sītañ ca uṇhañ ca, tiṇā bhiyyo na maññati* (D. iii 151 (PTS iii 185)).","en":"In the canon the copulative compound appears in the Therīgāthā: *Sītuṇhena ca ḍayhantī*, tormented by cold and heat (Thī. 393 (PTS p. 135)), which the Aṭṭhakathā resolves as *sītena ca uṇhena ca* (ThīA. 125 (PTS p. 121)). The resolution without a compound is also in the canon: *Yo ’dha sītañ ca uṇhañ ca, tiṇā bhiyyo na maññati* (D. iii 151 (PTS iii 185)).","iebh":true,"L":"1125j","fuente":"Tipiṭaka · Aṭṭhakathā"},"13":{"es":"Moggallāna da para las dos primeras otros ejemplos: *dhave ca khadire ca palāse ca chinda*, corta los dhava, los khadira y los palāsa (colección simple), y *bhikkhañ cara gāvo cānaye*, ve por limosna y trae las vacas (adición secundaria). Niruttidīpanī (sutta 357; Nir. 251) no acepta del todo la restricción: la colección simple también forma compuesto, como en *cīvarapiṇḍapātasenāsanagilānappaccayabhesajjaparikkhārānaṃ* (M. i 39 (PTS i 33)), y también la adición secundaria, como en *mālāgandhavilepanadhāraṇamaṇḍanavibhūsanaṭṭhānā* (D. i 5 (PTS i 5)).","en":"For the first two Moggallāna gives other examples: *dhave ca khadire ca palāse ca chinda*, cut the dhava, the khadira and the palāsa (simple collection), and *bhikkhañ cara gāvo cānaye*, go for alms and bring the cows (secondary addition). Niruttidīpanī (sutta 357; Nir. 251) does not wholly accept the restriction: simple collection also forms a compound, as in *cīvarapiṇḍapātasenāsanagilānappaccayabhesajjaparikkhārānaṃ* (M. i 39 (PTS i 33)), and so does secondary addition, as in *mālāgandhavilepanadhāraṇamaṇḍanavibhūsanaṭṭhānā* (D. i 5 (PTS i 5)).","iebh":true,"L":"1125v","fuente":"Niruttidīpanī · Moggallāna · Tipiṭaka"},"14":{"es":"En el canon: *Pesalā Sāriputtamoggallānā*, Sāriputta y Moggallāna son de buena conducta (S. i 151 (PTS i 149)), y el locativo *Sāriputtamoggallānesu* en el mismo pasaje; *Yathā vā pan’ eke bhonto samaṇabrāhmaṇā* (D. i 6 (PTS i 6)); *tāva naṃ dakkhanti devamanussā*, mientras tanto lo verán los devas y los seres humanos (D. i 42 (PTS i 46)); *yato ca candimasūriyā uggacchanti* (D. i 226 (PTS i 240)); *mātāpitaro sukhenti pīṇenti* (D. i 48 (PTS i 51)). Cuando el compuesto depende de *yuga*, par, el canon lo usa en singular: *Sāriputtamoggallānaṃ nāma sāvakayugaṃ*, el par de discípulos llamado Sāriputta y Moggallāna (D. ii 4 (PTS ii 5)); Saddanīti lo señala (Sad. (Smith p. 768)).","en":"In the canon: *Pesalā Sāriputtamoggallānā*, Sāriputta and Moggallāna are of good conduct (S. i 151 (PTS i 149)), and the locative *Sāriputtamoggallānesu* in the same passage; *Yathā vā pan’ eke bhonto samaṇabrāhmaṇā* (D. i 6 (PTS i 6)); *tāva naṃ dakkhanti devamanussā*, for so long will devas and human beings see him (D. i 42 (PTS i 46)); *yato ca candimasūriyā uggacchanti* (D. i 226 (PTS i 240)); *mātāpitaro sukhenti pīṇenti* (D. i 48 (PTS i 51)). When the compound depends on *yuga*, pair, the canon uses it in the singular: *Sāriputtamoggallānaṃ nāma sāvakayugaṃ*, the pair of disciples named Sāriputta and Moggallāna (D. ii 4 (PTS ii 5)); Saddanīti points this out (Sad. (Smith p. 768)).","iebh":true,"L":"1125ao","fuente":"Saddanīti · Moggallāna · Tipiṭaka"},"15":{"es":"En el canon aparecen en plural, como compuestos copulativos individuales: *dve jāyampatikā*, dos esposos (S. i 322 (PTS ii 98)), donde la edición del VRI lee *jāyampatikā* y anota la variante *jayampatikā*; y *Te honti jānipatayo* (A. i 370 (PTS ii 59)). *Tudaṃpati* no se encuentra en los textos canónicos de la edición del Sexto Concilio; sólo en las gramáticas y en una ṭīkā que remite a Kaccāyana.","en":"In the canon they appear in the plural, as individual copulative compounds: *dve jāyampatikā*, two spouses (S. i 322 (PTS ii 98)), where the VRI edition reads *jāyampatikā* and notes the variant *jayampatikā*; and *Te honti jānipatayo* (A. i 370 (PTS ii 59)). *Tudaṃpati* is not found in the canonical texts of the Sixth Council edition; only in the grammars and in a ṭīkā that refers to Kaccāyana.","iebh":true,"L":"1125ax","fuente":"Kaccāyana · Tipiṭaka"},"16":{"es":"En el canon: *Aguttaṃ cakkhusotasmiṃ*, desprotegido en el ojo y el oído (A. i 284 (PTS i 281)), con la séptima inflexión singular del paradigma. Rūpasiddhi advierte que a veces el compuesto colectivo no es neutro, como lo muestra la forma *aṃmo* del aforismo *Aṃ-mo niggahitaṃ jha-la-pehi* (Kacc. §82; Rū. §149); así *ādhipaccaparivāro*, *chandapārisuddhi*, *paṭisandhippavattiyaṃ* (Rū. §359). Suttaniddesa da también *cittuppādo* (Suttaniddesa, ad Kacc. §82).","en":"In the canon: *Aguttaṃ cakkhusotasmiṃ*, unguarded in the eye and the ear (A. i 284 (PTS i 281)), with the seventh inflection singular of the paradigm. Rūpasiddhi notes that sometimes the collective compound is not neuter, as the form *aṃmo* of the aphorism *Aṃ-mo niggahitaṃ jha-la-pehi* (Kacc. §82; Rū. §149) shows; thus *ādhipaccaparivāro*, *chandapārisuddhi*, *paṭisandhippavattiyaṃ* (Rū. §359). Suttaniddesa also gives *cittuppādo* (Suttaniddesa, ad Kacc. §82).","iebh":true,"L":"1125bi","fuente":"Rūpasiddhi · Kaccāyana · Suttaniddesa · Tipiṭaka"},"17":{"es":"*Visabhāga* no significa aquí *opuesto*. Rūpasiddhi lo explica: *vividhā ca te lakkhaṇato sabhāgā ca kiccato*, son diferentes por su característica y semejantes por su función (samatho ca vipassanā ca, nāmarūpaṃ, hirottappaṃ). Niruttidīpanī llama a esta clase *sabhāgadvanda*, compuesto copulativo de cosas afines, y reserva el nombre *vividhaviruddha* para los opuestos, como *kusalākusalaṃ* (véase más abajo).","en":"*Visabhāga* does not mean *opposite* here. Rūpasiddhi explains it: *vividhā ca te lakkhaṇato sabhāgā ca kiccato*, they are different in their characteristic and alike in their function (samatho ca vipassanā ca, nāmarūpaṃ, hirottappaṃ). Niruttidīpanī calls this class *sabhāgadvanda*, copulative compound of akin things, and reserves the name *vividhaviruddha* for opposites, such as *kusalākusalaṃ* (see below).","iebh":true,"L":"1125a","fuente":"Rūpasiddhi · Niruttidīpanī"},"18":{"es":"En el canon: *samathavipassanaṃ yuganaddhaṃ bhāveti*, desarrolla la tranquilidad y la introspección unidas (A. i 475 (PTS ii 157)), frente a la resolución *samatho ca vipassanā ca* (D. iii 179 (PTS iii 213)); *viññāṇapaccayā nāmarūpaṃ* (D. ii 28 (PTS ii 32)); *tibbaṃ me hirottappaṃ paccupaṭṭhitaṃ bhavissati* (S. i 420 (PTS ii 220)).","en":"In the canon: *samathavipassanaṃ yuganaddhaṃ bhāveti*, he develops tranquillity and insight yoked together (A. i 475 (PTS ii 157)), as against the resolution *samatho ca vipassanā ca* (D. iii 179 (PTS iii 213)); *viññāṇapaccayā nāmarūpaṃ* (D. ii 28 (PTS ii 32)); *tibbaṃ me hirottappaṃ paccupaṭṭhitaṃ bhavissati* (S. i 420 (PTS ii 220)).","iebh":true,"L":"1125ch","fuente":"Tipiṭaka"},"19":{"es":"Niruttidīpanī entiende *dīghamajjhimaṃ* de otra manera: lo pone en una clase propia, la de las colecciones de una misma recitación (ekasaṅgītidvanda), junto con *aṅguttarasaṃyuttakaṃ* y *khandhakavibhaṅgaṃ*; es decir, el Dīgha y el Majjhima. En el canon, compuestos colectivos de esta clase y de la siguiente aparecen juntos en un solo pasaje: *Puttabhariyaṃ … dāsidāsaṃ jātidhammaṃ, ajeḷakaṃ jātidhammaṃ, kukkuṭasūkaraṃ jātidhammaṃ, hatthigavāssavaḷavaṃ jātidhammaṃ, jātarūparajataṃ jātidhammaṃ* (M. i 217 (PTS i 162)); y *pattacīvaraṃ paṭiggahesuṃ* (M. i 228 (PTS i 171)).","en":"Niruttidīpanī understands *dīghamajjhimaṃ* differently: it places it in a class of its own, that of the collections of one and the same recitation (ekasaṅgītidvanda), together with *aṅguttarasaṃyuttakaṃ* and *khandhakavibhaṅgaṃ*; that is, the Dīgha and the Majjhima. In the canon, collective compounds of this class and of the next appear together in a single passage: *Puttabhariyaṃ … dāsidāsaṃ jātidhammaṃ, ajeḷakaṃ jātidhammaṃ, kukkuṭasūkaraṃ jātidhammaṃ, hatthigavāssavaḷavaṃ jātidhammaṃ, jātarūparajataṃ jātidhammaṃ* (M. i 217 (PTS i 162)); and *pattacīvaraṃ paṭiggahesuṃ* (M. i 228 (PTS i 171)).","iebh":true,"L":"1125db","fuente":"Niruttidīpanī · Tipiṭaka"},"20":{"es":"Rūpasiddhi cuenta *kusalākusalaṃ* entre los facultativos (Rū. §360), y Kaccāyana pone del mismo modo *sāvajjānavajjaṃ*, *hīnapaṇītaṃ* y *kaṇhasukkaṃ* bajo el *ādi* de este aforismo (Kacc. §323). En cambio, para Saddanīti es un caso de los diversos enemigos (vividhaviruddha) (Sad. (Smith p. 750)), y Niruttidīpanī (sutta 358; Nir. 253) lo pone entre los opuestos (vividhaviruddha), que distingue de los enemigos (niccaveri); para ambos el colectivo es obligatorio. En el canon el plural aparece sólo como calificativo (*kusalākusalānaṃ dhammānaṃ vipākā*, Dhs. 145 (PTS p. 124)); como nombre aparece en singular: *saṃkhittena kusalākusalaṃ desetu*, que me enseñe brevemente el kusala y el akusala (M. ii 157 (PTS i 489)). Otras atestaciones: *rājā pasenadi kosalo kāsikosalaṃ ajjhāvasati* (D. i 217 (PTS i 227)); *pahūtaṃ hiraññasuvaṇṇaṃ ohāya* (D. i 108 (PTS i 115)); *imaṃ rattindivaṃ vītināmeyya* (M. i 16 (PTS i 13)); *Ahorattaṃ anuyuñjaṃ* (S. i 123 (PTS i 122)).","en":"Rūpasiddhi counts *kusalākusalaṃ* among the facultative ones (Rū. §360), and Kaccāyana likewise places *sāvajjānavajjaṃ*, *hīnapaṇītaṃ* and *kaṇhasukkaṃ* under the *ādi* of this aphorism (Kacc. §323). By contrast, for Saddanīti it is a case of the different enemies (vividhaviruddha) (Sad. (Smith p. 750)), and Niruttidīpanī (sutta 358; Nir. 253) places it among the opposites (vividhaviruddha), which it distinguishes from the enemies (niccaveri); for both, the collective is obligatory. In the canon the plural appears only as a qualifier (*kusalākusalānaṃ dhammānaṃ vipākā*, Dhs. 145 (PTS p. 124)); as a noun it appears in the singular: *saṃkhittena kusalākusalaṃ desetu*, may he teach me kusala and akusala briefly (M. ii 157 (PTS i 489)). Other attestations: *rājā pasenadi kosalo kāsikosalaṃ ajjhāvasati* (D. i 217 (PTS i 227)); *pahūtaṃ hiraññasuvaṇṇaṃ ohāya* (D. i 108 (PTS i 115)); *imaṃ rattindivaṃ vītināmeyya* (M. i 16 (PTS i 13)); *Ahorattaṃ anuyuñjaṃ* (S. i 123 (PTS i 122)).","iebh":true,"L":"1125ef","fuente":"Rūpasiddhi · Kaccāyana · Saddanīti · Niruttidīpanī · Tipiṭaka"}},"refs":{"ru":{"67":{"pali":"Saralopo ‘mādesa-paccayādimhi saralope tu pakati.","kacc":83,"cst":"Saralopo’mādesappaccayādimhi saralope tu pakati","fuente":"Nandisena"},"112":{"pali":"Santasaddassa so bhe bo c’ ante.","kacc":185,"cst":"Santasaddassa so bhe bo cante","fuente":"Nandisena"},"149":{"pali":"Aṃ-mo niggahītaṃ jha-la-pehi.","kacc":82,"cst":"Aṃ mo niggahītaṃ jhalapehi","fuente":"Nandisena"},"195":{"pali":"Si ‘ṃ.","kacc":219,"cst":"Siṃ","fuente":"Nandisena"},"255":{"pali":"Vīsati-dasesu bā dvissa tu.","kacc":380,"cst":"Vīsatidasesu bā dvissa tu","fuente":"Nandisena"},"324":{"pali":"Kamma-karaṇa-nimittatthesu sattamī.","kacc":310,"cst":"Kammakaraṇanimittatthesu sattamī","fuente": ."}},"31":{"es":{"pali":"Vaggantaṃ vā vagge","glosa":"Opcionalmente, cuando una [consonante] agrupada sigue, la final del grupo."},"en":{"pali":"Vaggantaṃ vā vagge","glosa":"Optionally, when a grouped [consonant] follows, the end of the group."}},"82":{"es":{"pali":"Aṃ-mo niggahitaṃ jha-la-pehi","glosa":"Después de ‘jha’, ‘la’ y ‘pa’, niggahita [de] ‘aṃ’ y ‘ma’."},"en":{"pali":"Aṃ-mo niggahitaṃ jha-la-pehi","glosa":"After ‘jha’, ‘la’ and ‘pa’, niggahita [of] ‘aṃ’ and ‘ma’."}},"83":{"es":{"pali":"Saralopo ’mādesa-paccayādimhi saralope tu pakati","glosa":"Cuando siguen ‘aṃ’, una sustitución, un sufijo, etc., [hay] elisión de la vocal; cuando hay elisión de la vocal, [la vocal restante permanece] natural."},"en":{"pali":"Saralopo ’mādesa-paccayādimhi saralope tu pakati","glosa":"When ‘aṃ’, a substitution, a suffix, etc., follow, [there is] elision of the vowel; when there is elision of the vowel, [the remaining vowel remains] natural."}},"185":{"es":{"pali":"Santasaddassa so bhe bo c’ ante","glosa":"Cuando sigue ‘bh’, [hay] ‘sa’ de la palabra “santa”, y ‘b’ al final."},"en":{"pali":"Santasaddassa so bhe bo c’ ante","glosa":"When ‘bh’ follows, [there is] ‘sa’ of the word “santa”, and ‘b’ at the end."}},"219":{"es":{"pali":"Si ’ṃ","glosa":"‘Si’ [deviene] ‘aṃ’."},"en":{"pali":"Si ’ṃ","glosa":"‘Si’ [becomes] ‘aṃ’."}},"222":{"es":{"pali":"Pumassa liṅgādīsu samāsesu","glosa":"En los compuestos de “puma”, cuando [la palabra] “liṅga”, etc."},"en":{"pali":"Pumassa liṅgādīsu samāsesu","glosa":"In the compounds of “puma”, when [the word] “liṅga”, etc."}},"310":{"es":{"pali":"Kamma-karaṇa-nimittatthesu sattamī","glosa":"La séptima [inflexión] en los significados de objeto, instrumento y causa."},"en":{"pali":"Kamma-karaṇa-nimittatthesu sattamī","glosa":"The seventh [inflection] in the meanings of object, instrument and cause."}},"316":{"es":{"pali":"Nāmānaṃ samāso yuttattho","glosa":"El significado conectado de nombres [recibe el nombre] “samāsa” (compuesto)."},"en":{"pali":"Nāmānaṃ samāso yuttattho","glosa":"The connected meaning of nouns [has the name] “samāsa” (compound)."}},"317":{"es":{"pali":"Tesaṃ vibhattiyo lopā ca","glosa":"Y las inflexiones de esos se eliden."},"en":{"pali":"Tesaṃ vibhattiyo lopā ca","glosa":"And the inflections of those are elided."}},"318":{"es":{"pali":"Pakati c’ assa sarantassa","glosa":"Y hay la forma natural de los que terminan en vocal."},"en":{"pali":"Pakati c’ assa sarantassa","glosa":"And there is the original form of those that end in a vowel."}},"319":{"es":{"pali":"Upasagga-nipātapubbako abyayībhāvo","glosa":"Ese que tiene delante un prefijo o una partícula es un “abyayībhāva” (compuesto adverbial)."},"en":{"pali":"Upasagga-nipātapubbako abyayībhāvo","glosa":"That which has a prefix or a particle in front is an “abyayībhāva” (adverbial compound)."}},"320":{"es":{"pali":"So napuṃsakaliṅgo","glosa":"Éste tiene el género neutro."},"en":{"pali":"So napuṃsakaliṅgo","glosa":"It has the neuter gender."}},"321":{"es":{"pali":"Diguss’ ekattaṃ","glosa":"Hay el estado de uno de un “digu” (compuesto numérico)."},"en":{"pali":"Diguss’ ekattaṃ","glosa":"There is the state of one of a “digu” (numerical compound)."}},"322":{"es":{"pali":"Tathā dvande pāṇitūriyayoggasenaṅga-khuddajantuka-vividhaviruddha-visabhāgatthādīnañ ca","glosa":"Asimismo, en un compuesto copulativo (dvanda) hay también [singular y género neutro] de las partes de los seres (pāṇi-aṅga), los instrumentos musicales (tūriya-aṅga), las partes de un vehículo (yogga-aṅga), las partes de un ejército (senaṅga), las criaturas pequeñas (khuddajantuka), los diversos enemigos (vividhaviruddha), el significado opuesto (visabhāgattha), etcétera (ādi)."},"en":{"pali":"Tathā dvande pāṇitūriyayoggasenaṅga-khuddajantuka-vividhaviruddha-visabhāgatthādīnañ ca","glosa":"Likewise, in a copulative compound (dvanda) there is also [singular and neuter gender] of parts of beings (pāṇi-aṅga), musical instruments (tūriya-aṅga), parts of a vehicle (yogga-aṅga), parts of an army (senaṅga), small creatures (khuddajantuka), different enemies (vividhaviruddha), opposite meaning (visabhāgattha), etc. (ādi)."}},"323":{"es":{"pali":"Vibhāsā rukkha-tiṇa-pasu-dhana-dhañña-janapadādīnañ ca","glosa":"Y facultativamente de “rukkha” (árbol), “tiṇa” (hierba), “pasu” (animal), “dhana” (riqueza), “dhañña” (grano), “janapada” (distrito), etcétera."},"en":{"pali":"Vibhāsā rukkha-tiṇa-pasu-dhana-dhañña-janapadādīnañ ca","glosa":"And facultatively of “rukkha” (tree), “tiṇa” (grass), “pasu” (beast), “dhana” (wealth), “dhañña” (grain), “janapada” (district), etc."}},"324":{"es":{"pali":"Dvipade tulyādhikaraṇe kammadhārayo","glosa":"Cuando dos palabras que se refieren a la misma cosa [forman un compuesto], hay un “kammadhāraya” (compuesto adjetivo)."},"en":{"pali":"Dvipade tulyādhikaraṇe kammadhārayo","glosa":"When two words referring to the same thing [are compounded], there is a “kammadhāraya” (adjectival compound)."}},"325":{"es":{"pali":"Saṅkhyāpubbo digu","glosa":"[El compuesto adjetivo] que tiene un numeral como primer miembro es un “digu” (compuesto numérico)."},"en":{"pali":"Saṅkhyāpubbo digu","glosa":"[The adjectival compound] that has a numeral as its first member is a “digu” (numerical compound)."}},"326":{"es":{"pali":"Ubhe tappurisā","glosa":"Ambos son “tappurisa” (compuestos determinativos)."},"en":{"pali":"Ubhe tappurisā","glosa":"Both are “tappurisa” (determinative compounds)."}},"327":{"es":{"pali":"Amādayo parapadebhi","glosa":"‘Aṃ’, etc., con los nombres siguientes."},"en":{"pali":"Amādayo parapadebhi","glosa":"‘Aṃ’, etc., with the following nouns."}},"328":{"es":{"pali":"Aññapadatthesu bahubbīhi","glosa":"En los significados de otras palabras hay un “bahubbīhi” (compuesto relativo)."},"en":{"pali":"Aññapadatthesu bahubbīhi","glosa":"In the meaning of other words there is a “bahubbīhi” (relative compound)."}},"329":{"es":{"pali":"Nāmānaṃ samuccayo dvando","glosa":"Una colección de nombres [recibe el nombre] “dvanda” (compuesto copulativo)."} ,"glosa":"Cuando sigue “pati”, hay “tudaṃ” y “jāni” de “jāyā”."},"en":{"pali":"Jāyāya tudaṃ-jāni","glosa":"When “pati” follows, there are “tudaṃ” and “jāni” of “jāyā”."}},"340":{"es":{"pali":"Dhanumh’ ā ca","glosa":"Y hay ‘ā’ después de “dhanu”."},"en":{"pali":"Dhanumh’ ā ca","glosa":"Also there is ‘ā’ after “dhanu”."}},"341":{"es":{"pali":"Aṃ vibhattīnam akārantā abyayībhāvā","glosa":"Después de un compuesto adverbial que termina en ‘a’, las inflexiones devienen ‘aṃ’."},"en":{"pali":"Aṃ vibhattīnam akārantā abyayībhāvā","glosa":"After an adverbial compound that ends in ‘a’, the inflections become ‘aṃ’."}},"342":{"es":{"pali":"Saro rasso napuṃsake","glosa":"En el neutro hay vocal corta."},"en":{"pali":"Saro rasso napuṃsake","glosa":"In the neuter there is a short vowel."}},"343":{"es":{"pali":"Aññasmā lopo ca","glosa":"Y hay elisión después de otros."},"en":{"pali":"Aññasmā lopo ca","glosa":"Also there is elision after others."}},"344":{"es":{"pali":"Vā ṇ’ apacce","glosa":"Opcionalmente, [hay] ‘ṇa’ en [el significado de] descendiente."},"en":{"pali":"Vā ṇ’ apacce","glosa":"Optionally, [there is] ‘ṇa’ in [the meaning of] offspring."}},"349":{"es":{"pali":"Ṇera vidhavādito","glosa":"Tras “vidhavā” y otros, [hay] ‘ṇera’."},"en":{"pali":"Ṇera vidhavādito","glosa":"After “vidhavā” and others, [there is] ‘ṇera’."}},"350":{"es":{"pali":"Yena vā saṃsaṭṭhaṃ tarati carati vahati ṇiko","glosa":"[Hay] ‘ṇika’ [en estos significados]: mezclado con eso, cruza con eso, va con eso, transporta con eso."},"en":{"pali":"Yena vā saṃsaṭṭhaṃ tarati carati vahati ṇiko","glosa":"[There is] ‘ṇika’ [in these meanings]: mixed with that, he crosses by that, he goes by that, he carries by that."}},"380":{"es":{"pali":"Vīsati-dasesu bā dvissa tu","glosa":"Pero cuando siguen “vīsati” (veinte) y “dasa” (diez), [hay] ‘bā’ de “dvi”."},"en":{"pali":"Vīsati-dasesu bā dvissa tu","glosa":"But when “vīsati” (twenty) and “dasa” (ten) follow, [there is] ‘bā’ of “dvi”."}},"383":{"es":{"pali":"Dv’-ek’-aṭṭhānam ākāro vā","glosa":"Opcionalmente, [hay] ‘ā’ de “dvi” (dos), “eka” (uno) y “aṭṭha” (ocho)."},"en":{"pali":"Dv’-ek’-aṭṭhānam ākāro vā","glosa":"Optionally, [there is] ‘ā’ of “dvi” (two), “eka” (one) and “aṭṭha” (eight)."}},"386":{"es":{"pali":"Tiye du-tāpi ca","glosa":"Y también, cuando sigue ‘tiya’, [hay] ‘du’ y ‘ta’."},"en":{"pali":"Tiye du-tāpi ca","glosa":"And also, when ‘tiya’ follows, [there are] ‘du’ and ‘ta’."}},"403":{"es":{"pali":"Kvac’ ādi-majjh’-uttarānaṃ dīgha-rassā paccayesu ca","glosa":"Y a veces, cuando siguen sufijos, [las vocales] iniciales, medias y finales [se vuelven] largas o cortas."},"en":{"pali":"Kvac’ ādi-majjh’-uttarānaṃ dīgha-rassā paccayesu ca","glosa":"And sometimes, when suffixes follow, the initial, middle and final [vowels] [become] long or short."}},"404":{"es":{"pali":"Tesu vuddhi-lopāgama-vikāra-viparītādesā ca","glosa":"Y en esos [lugares hay] fortalecimiento, elisión, inserción, cambio, inversión y sustitución."},"en":{"pali":"Tesu vuddhi-lopāgama-vikāra-viparītādesā ca","glosa":"And in those [places there are] strengthening, elision, insertion, change, reversal and substitution."}}}};

  vacio:'<p>Bhikkhu Nandisena dejó esta sección sin redactar: el documento tiene el rótulo y nada más, y en la tabla del resumen la fila del <i>dvanda</i> también está en blanco.</p><p>Mientras tanto, el sutta que define la clase está en Kaccāyana: <a class="k" href="../../s/329/">Kacc. §329</a>, <i>Nāmānaṃ samuccayo dvando</i>.</p>',
  resumen_t:'Tabla de resumen',resumen_s:'La tabla con la que Nandisena cierra el documento. Él sólo llenó las dos primeras filas; las otras cuatro las completa el IEBH. La columna del significado da las glosas de Nandisena; la del género, su nota «Qué género tienen cada uno de los seis compuestos» (2004).',
  vaciaCelda:'en blanco en el original',
  mapa_t:'Las seis clases',mapa_s:'Cada tarjeta lleva a su pestaña. El ejemplo es el primero que da el documento.',
  sb_clases:'Las clases',sb_vacio:'Esta pestaña no tiene subtítulos.',
  hero:(a,b,c)=>`<div><b>${a}</b> clases</div><div><b>${b}</b> subtipos</div><div><b>${c}</b> compuestos resueltos</div>`,
  lic:'Material del Instituto de Estudios Buddhistas Hispano (IEBH), a partir de la obra de Bhikkhu Nandisena.<br>Este material puede ser reproducido para uso personal y distribuido de forma gratuita.<br>Copyright © 2026 Instituto de Estudios Buddhistas Hispano (IEBH). Publicado bajo licencia <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.es" rel="license noopener" target="_blank">CC&nbsp;BY-NC-ND&nbsp;4.0</a>.',
  notas_sum:'Notas y fuentes',ver:'Versión',
  notas:()=>`<p><strong>Qué es esta página.</strong> El documento <i>${esc(M.titulo_doc)}</i> de Bhikkhu Nandisena (2004–2005), escrito a partir de Rūpasiddhi (Rū.) y de Kaccāyana (Kacc.), que el autor dejó sin terminar: la sección del compuesto copulativo (<i>dvanda</i>) y la tabla final no estaban redactadas; las completa el IEBH. Atribución: ${esc(M.atribucion.es)}.</p>
  <p><strong>El texto.</strong> Es el del documento con la revisión aplicada según el consejo verificado, pendiente de la aprobación del IEBH: las erratas, los términos y las referencias se corrigen en el propio texto de Nandisena; todo lo añadido (notas, atestaciones, filas, la sección del <i>dvanda</i>) va aparte y rotulado <span class="chip iebh">IEBH</span>, con la fuente en el texto y en la etiqueta. Además cambia la presentación: las voces pāḷi, que el original pone entre comillas, van en cursiva (decisión del IEBH), y la ṁ se escribe ṃ. Cada bloque recuerda su línea en el texto de trabajo (L), y se puede enlazar.</p>
  <p><strong>La resolución palabra por palabra.</strong> El documento da las resoluciones de dos maneras: en tablas de dos filas —el compuesto y sus voces arriba, la traducción y las glosas abajo— y en líneas como «<i>Buddhabhāsito</i> (dicho por el Buddha): <i>Buddhena</i> (por el Buddha) <i>bhāsito</i> (dicho)». La página dispone las dos igual, cada voz con su glosa debajo; las palabras son las de Nandisena, y la disposición, de la página. En las del <i>bahubbīhi</i> se resalta la voz que lleva el propio compuesto.</p>
  <p><strong>Las referencias.</strong> Las de Rūpasiddhi son de Nandisena: por página (Rūpasiddhi 177) o por sutta (Rū. §352). El enlace al sutta de Kaccāyana de cada clase, en la numeración de Nandisena, es un añadido del IEBH; cada «Kacc. §N» lleva a la página de ese sutta.</p>
  <p><strong>«Practicar» y «¿Qué compuesto es?»</strong> son ayudas del IEBH para el estudio, no parte del documento. La práctica saca los compuestos de las resoluciones y las tablas de ejemplos de esta página, con su clase y su subtipo. Las preguntas de la guía resumen las formas de resolución que el documento da para cada clase: orientan, pero no sustituyen a las reglas de las gramáticas.</p>`},
en:{title:'Compounds (samāsa)',sb:'Compounds',
  entradilla:'The Pāḷi compounds (<i>samāsa</i>) in their six classes, with the resolution (<i>viggaha</i>) of every example word by word.',
  aviso:'This is Bhikkhu Nandisena’s document <i>Compound (samāsa)</i> (2004–2005), which follows Rūpasiddhi and Kaccāyana and was left unfinished. <b>Revised draft, pending IEBH’s approval</b>: the revision proposals have been applied according to the verified advice —errata and references corrected in the text; additions labelled <span class="chip iebh">IEBH</span> with their source—. IEBH may reverse any of them. <b>The English is a draft translation</b> by IEBH, not yet reviewed; the Spanish edition is the reference.',

  notas_h:'Notes',nota_add:'IEBH addition',fuente:'Source',iebh_tit:'Added by IEBH; not in Nandisena’s document',
  solo_iebh:'<span class="chip iebh">IEBH</span> Bhikkhu Nandisena left this section unwritten: the document has the heading and nothing else. Everything below is IEBH’s, from Rūpasiddhi and Kaccāyana (Kacc. §329; Rū. §357–§360), with its sources in the text.',
  resumen_iebh:'compound and resolution blank in the original; IEBH fills them with examples from the document itself',
  kacc_tit:'Kaccāyana sutta that defines the class (Nandisena’s numbering)',
  vacio:'<p>Bhikkhu Nandisena left this section unwritten: the document has the heading and nothing else, and the <i>dvanda</i> row of the summary table is blank too.</p><p>Meanwhile, the sutta that defines the class is in Kaccāyana: <a class="k" href="../../s/329/?lang=en">Kacc. §329</a>, <i>Nāmānaṃ samuccayo dvando</i>.</p>',
  resumen_t:'Summary table',resumen_s:'The table with which Nandisena closes the document. He filled only the first two rows; IEBH completes the other four. The meaning column gives Nandisena’s glosses; the gender column, his note «Qué género tienen cada uno de los seis compuestos» (2004).',
  vaciaCelda:'blank in the original',
  mapa_t:'The six classes',mapa_s:'Each card leads to its tab. The example is the first one the document gives.',
  sb_clases:'The classes',sb_vacio:'This tab has no subheadings.',
  hero:(a,b,c)=>`<div><b>${a}</b> classes</div><div><b>${b}</b> subtypes</div><div><b>${c}</b> resolved compounds</div>`,
  lic:'Material of the Instituto de Estudios Buddhistas Hispano (IEBH), based on the work of Bhikkhu Nandisena.<br>This material may be reproduced for personal use and distributed free of charge.<br>Copyright © 2026 Instituto de Estudios Buddhistas Hispano (IEBH). Published under the <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" rel="license noopener" target="_blank">CC&nbsp;BY-NC-ND&nbsp;4.0</a> licence.',
  notas_sum:'Notes and sources',ver:'Version',
  notas:()=>`<p><strong>What this page is.</strong> Bhikkhu Nandisena’s document <i>Compound (samāsa)</i> (2004–2005), written from Rūpasiddhi (Rū.) and Kaccāyana (Kacc.), which the author left unfinished: the section on the copulative compound (<i>dvanda</i>) and the final table were not written; IEBH completes them. Attribution: ${esc(M.atribucion.en)}. The English is a draft translation.</p>
  <p><strong>The text.</strong> It is the document with the revision applied according to the verified advice, pending IEBH’s approval: errata, terms and references are corrected in Nandisena’s own text; everything added (notes, attestations, rows, the <i>dvanda</i> section) stands apart, labelled <span class="chip iebh">IEBH</span>, with its source in the text and on the label. The presentation also changes: the Pāḷi words, which the original puts in quotation marks, are in italics (an IEBH decision), and ṁ is written ṃ. Each block records its line in the working text (L) and can be linked to.</p>
  <p><strong>The word-by-word resolution.</strong> The document gives resolutions in two ways: in two-row tables —the compound and its words above, the translation and the glosses below— and in lines such as «<i>Buddhabhāsito</i> (dicho por el Buddha): <i>Buddhena</i> (por el Buddha) <i>bhāsito</i> (dicho)». The page lays both out alike, each word with its gloss beneath; the words are Nandisena’s, the layout is the page’s. In the <i>bahubbīhi</i> resolutions the word carrying the compound itself is highlighted.</p>
  <p><strong>References.</strong> Those to Rūpasiddhi are Nandisena’s: by page (Rūpasiddhi 177) or by sutta (Rū. §352). The link to each class’s Kaccāyana sutta, in Nandisena’s numbering, is an IEBH addition; every «Kacc. §N» leads to that sutta’s page.</p>
  <p><strong>«Practise» and «Which compound is it?»</strong> are IEBH study aids, not part of the document. Practice draws the compounds from this page’s resolutions and example tables, with their class and subtype. The guide’s questions summarise the forms of resolution the document gives for each class: they orient, but do not replace the rules of the grammars.</p>`}};
