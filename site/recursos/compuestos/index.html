sto no expresa la totalidad sino los objetos individualmente. Tiene el género del último miembro y terminación plural; con «eka» (uno), terminación singular: ekapuggalo, ekadhammo, ekaputto. Ej., *tayo + bhavā* = *tibhavā* (los tres estadios de existencia).","en":"Non-collective numerical compound. This kind of compound does not express totality but the objects individually. It has the gender of the last member and a plural ending; with “eka” (one), a singular ending: ekapuggalo, ekadhammo, ekaputto. E.g., *tayo + bhavā* = *tibhavā* (the three stages of existence)."},"L":"0704","id":"digu-l0704"},{"tipo":"p","texto":{"es":"El compuesto numérico es también compuesto determinativo («Ubhe tappurisā», Kacc. §326; Rū. §341), y de éste dice Rūpasiddhi que toma el número de lo que designa y el género del último miembro («abhidheyyavacano, paraliṅgo ca», Rū. §341). Por eso, en los ejemplos de Rūpasiddhi del no colectivo, el número es el de las cosas contadas —singular con «eka»: ekapuggalo, ekadhammo, ekaputto; plural con los demás numerales: tibhavā, catuddisā, dasasahassacakkavāḷāni— y el género, el del último miembro: ekapuggalo, masculino; catuddisā, femenino; dasasahassacakkavāḷāni, neutro (Rū. §350). En el canon, en singular: «Ekadhammo, bhikkhave, bhāvito bahulīkato ekantanibbidāya virāgāya nirodhāya upasamāya abhiññāya sambodhāya nibbānāya saṃvattati» (A. i 31 (PTS i 30)).","en":"The numerical compound is also a determinative compound (“Ubhe tappurisā”, Kacc. §326; Rū. §341), and of the latter Rūpasiddhi says that it takes the number of what it denotes and the gender of the last member (“abhidheyyavacano, paraliṅgo ca”, Rū. §341). Hence, in Rūpasiddhi’s examples of the non-collective, the number is that of the things counted —singular with “eka”: ekapuggalo, ekadhammo, ekaputto; plural with the other numerals: tibhavā, catuddisā, dasasahassacakkavāḷāni— and the gender that of the last member: ekapuggalo, masculine; catuddisā, feminine; dasasahassacakkavāḷāni, neuter (Rū. §350). In the canon, in the singular: “Ekadhammo, bhikkhave, bhāvito bahulīkato ekantanibbidāya virāgāya nirodhāya upasamāya abhiññāya sambodhāya nibbānāya saṃvattati” (A. i 31 (PTS i 30))."},"L":"0704b","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Tipiṭaka","id":"digu-l0704b"},{"tipo":"interlineal","origen":"tabla","compuesto":"ekapuggalo","traduccion":{"es":"un individuo","en":"one individual"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"eko","g":{"es":"uno","en":"one"}},{"p":"ca","g":{"es":"y","en":"and"}},{"p":"so","g":{"es":"éste (es)","en":"this one (is)"}},{"p":"puggalo","g":{"es":"individuo","en":"individual"}},{"p":"ca","g":{"es":"y","en":"and"}}],"L":"0706","hasta":"0709","anexos":[{"es":"Resolución de Rūpasiddhi (§350); Niruttidīpanī da también «eko puggalo ekapuggalo». En el canon: «Ekapuggalo, bhikkhave, loke uppajjamāno uppajjati bahujanahitāya» (A. i 21 (PTS i 21–22)).","en":"Rūpasiddhi’s resolution (§350); Niruttidīpanī also gives “eko puggalo ekapuggalo”. In the canon: “Ekapuggalo, bhikkhave, loke uppajjamāno uppajjati bahujanahitāya” (A. i 21 (PTS i 21–22)).","fuente":"Rūpasiddhi · Niruttidīpanī · Tipiṭaka","L":"0709b"}],"id":"c-ekapuggalo"},{"tipo":"interlineal","origen":"tabla","compuesto":"tibhavā","traduccion":{"es":"tres estadios de existencia","en":"three stages of existence"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"tayo","g":{"es":"tres","en":"three"}},{"p":"bhavā","g":{"es":"estadios","en":"stages"}}],"L":"0713","hasta":"0716","anexos":[{"es":"En el canon: «Sabbe aniccā tibhavā upaddutā» (Thag. 360 (PTS p. 102)). Saddanīti advierte que el digu es neutro y singular sólo «por lo general» (yebhuyyena), y cita, del uso de los poetas, «tibhavo khāyate tadā», en masculino singular.","en":"In the canon: “Sabbe aniccā tibhavā upaddutā” (Thag. 360 (PTS p. 102)). Saddanīti points out that the digu is neuter and singular only “as a rule” (yebhuyyena), and quotes, from the usage of the poets, “tibhavo khāyate tadā”, in the masculine singular.","fuente":"Saddanīti · Tipiṭaka","L":"0716b"}],"id":"c-tibhava"},{"tipo":"interlineal","origen":"tabla","compuesto":"dvisatāni","traduccion":{"es":"doscientos","en":"two hundred"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"dve","g":{"es":"dos","en":"two"}},{"p":"satāni","g":{"es":"cien","en":"one hundred"}}],"L":"0720","hasta":"0723","id":"c-dvisatani"},{"tipo":"interlineal","origen":"tabla","compuesto":"tisahassāni","traduccion":{"es":"tres mil","en":"three thousand"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"tīṇi","g":{"es":"tres","en":"three"}},{"p":"sahassāni","g":{"es":"mil","en":"thousand"}}],"L":"0728","hasta":"0731","id":"c-tisahassani"},{"tipo":"p","texto":{"es":"Rūpasiddhi no da estos dos ejemplos. Niruttidīpanī los admite y da al lado el colectivo: «dve satāni dvisataṃ … tisahassaṃ», o bien «dvisatāni, dve satāni … tisahassāni, tīṇi sahassāni», «evaṃ vacanadvayañ ca vākyañ ca veditabbaṃ»; y responde a la objeción de que aquí los dos miembros son numerales: en el digu el primer miembro ha de ser numeral, el segundo puede serlo o no.","en":"Rūpasiddhi does not give these two examples. Niruttidīpanī admits them and gives the collective alongside: “dve satāni dvisataṃ … tisahassaṃ”, or else “dvisatāni, dve satāni … tisahassāni, tīṇi sahassāni”, “evaṃ vacanadvayañ ca vākyañ ca veditabbaṃ”; and it answers the objection that here both members are numerals: in the digu the first member must be a numeral, the second may or may not be one."},"L":"0731b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī","id":"digu-l0731b"},{"tipo":"interlineal","origen":"tabla","compuesto":"catuddisā","traduccion":{"es":"cuatro direcciones","en":"four directions"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"catasso","g":{"es":"cuatro","en":"four"}},{"p":"disā","g":{"es":"direcciones","en":"directions"}}],"L":"0735","hasta":"0738","anexos":[{"es":"Rūpasiddhi da catasso disā en las dos clases: catuddisaṃ (colectivo, neutro, con la vocal final acortada) y catuddisā (no colectivo, femenino plural). Añade como no colectivos ekadhammo (un dhamma), ekaputto (un hijo) y dasasahassacakkavāḷāni (diez mil sistemas de mundos). Catuddisā en el canon: «balavā saṅkhadhamo appakasiren’ eva catuddisā viññāpeyya» (D. i 234 (PTS i 251)).","en":"Rūpasiddhi gives catasso disā in both kinds: catuddisaṃ (collective, neuter, with the final vowel shortened) and catuddisā (non-collective, feminine plural). It adds as non-collective ekadhammo (one dhamma), ekaputto (one son) and dasasahassacakkavāḷāni (ten thousand world systems). Catuddisā in the canon: “balavā saṅkhadhamo appakasiren’ eva catuddisā viññāpeyya” (D. i 234 (PTS i 251)).","fuente":"Rūpasiddhi · Tipiṭaka","L":"0738b"}],"id":"c-catuddisa"}]},{"id":"tappurisa","n":4,"pali":"tappurisa","titulo":{"es":"Compuesto determinativo (tappurisa-samāsa)","en":"Determinative compound (tappurisa-samāsa)"},"kacc":[326,327],"L":"0744","bloques":[{"tipo":"p","texto":{"es":"En este tipo de compuesto el primer miembro es un nombre, en cualquier inflexión excepto la primera (nominativo o vocativo), explicando o determinando el segundo miembro. Hay seis clases: (1) en la segunda inflexión (dutiyā-tappurisa), (2) en la tercera inflexión (tatiyā-tappurisa), (3) en la cuarta inflexión (catutthī-tappurisa), (4) en la quinta inflexión (pañcamī-tappurisa), (5) en la sexta inflexión (chaṭṭhī-tappurisa) y (6) en la séptima inflexión (sattamī-tappurisa). (Kacc. §327; Rū. §351)","en":"In this kind of compound the first member is a noun, in any inflection except the first (nominative or vocative), explaining or determining the second member. There are six kinds: (1) in the second inflection (dutiyā-tappurisa), (2) in the third inflection (tatiyā-tappurisa), (3) in the fourth inflection (catutthī-tappurisa), (4) in the fifth inflection (pañcamī-tappurisa), (5) in the sixth inflection (chaṭṭhī-tappurisa) and (6) in the seventh inflection (sattamī-tappurisa). (Kacc. §327; Rū. §351)"},"L":"0746","id":"tappurisa-l0746"},{"tipo":"p","texto":{"es":"Este compuesto tiene el género del último miembro.","en":"This compound has the gender of the last member."},"L":"0746b","iebh":true,"fuente":"Nandisena, «Qué género tienen cada uno de los seis compuestos» (2004) · Niruttidīpanī","id":"tappurisa-l0746b"},{"tipo":"p","texto":{"es":"Rūpasiddhi cuenta ocho clases de *tappurisa* («Digu dudhā tappuriso, aṭṭhadhā …», Rū., p. 215): estas seis, más el *amādipara-tappurisa* y el *alopa-tappurisa*, que aquí se tratan más abajo como «compuestos determinativos irregulares» y «compuestos determinativos donde la inflexión del primer miembro no se elide».","en":"Rūpasiddhi counts eight kinds of *tappurisa* (“Digu dudhā tappuriso, aṭṭhadhā …”, Rū., p. 215): these six, plus the *amādipara-tappurisa* and the *alopa-tappurisa*, which are treated further below as “irregular determinative compounds” and “determinative compounds in which the inflection of the first member is not elided”."},"L":"0746e","iebh":true,"fuente":"Rūpasiddhi","id":"tappurisa-l0746e"},{"tipo":"p","texto":{"es":"Cuando califica a un nombre, este compuesto tiene el mismo género y número de lo que califica. Ejemplos: *so saraṇagato*, él ha ido por refugio; *te saraṇagatā*, ellos han ido por refugio; *sā saraṇagatā*, ella ha ido por refugio; *tā saraṇagatāyo*, ellas han ido por refugio; *taṃ kulaṃ saraṇagataṃ*, esa familia ha ido por refugio; *tāni kulāni saraṇagatāni*, esas familias han ido por refugio.","en":"When it qualifies a noun, this compound has the same gender and number as what it qualifies. Examples: *so saraṇagato*, he has gone for refuge; *te saraṇagatā*, they have gone for refuge; *sā saraṇagatā*, she has gone for refuge; *tā saraṇagatāyo*, they (f.) have gone for refuge; *taṃ kulaṃ saraṇagataṃ*, that family has gone for refuge; *tāni kulāni saraṇagatāni*, those families have gone for refuge."},"L":"0748","id":"tappurisa-l0748"},{"tipo":"p","texto":{"es":"Rūpasiddhi dice que este tappurisa toma el número y el género de aquello a lo que se refiere (abhidheyyavacanaliṅga), porque «gata», etc., son derivados primarios y tienen los tres géneros (Rū. §351 (p. 193)). Cuando el último miembro es un sustantivo de género fijo, el compuesto conserva el género de éste: rājaputto, rukkhamūlaṃ, itthirūpaṃ. Niruttidīpanī lo dice de todo el tipo: «abhidheyyavacano parapadaliṅgo ca», el número del referente y el género del miembro siguiente (Nir. 231).","en":"Rūpasiddhi says that this tappurisa takes the number and gender of what it denotes (abhidheyyavacanaliṅga), because “gata”, etc., are primary derivatives and have the three genders (Rū. §351 (p. 193)). When the last member is a noun of fixed gender, the compound keeps the gender of that noun: rājaputto, rukkhamūlaṃ, itthirūpaṃ. Niruttidīpanī says this of the whole type: “abhidheyyavacano parapadaliṅgo ca”, the number of what is denoted and the gender of the following member (Nir. 231)."},"L":"0748b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī","id":"tappurisa-l0748b"},{"tipo":"p","texto":{"es":"Niruttidīpanī da además una excepción, tomada de Moggallāna, que la formula con las mismas palabras: en el compuesto determinativo en la sexta inflexión con «chāyā» (sombra) y «sabhā» (asamblea), a veces el compuesto es neutro y singular («Kvac’ ekattañ ca chaṭṭhiyā», Nir. 256; Moggallāna, p. 128): salabhānaṃ chāyā salabhacchāyaṃ, sakaṭacchāyaṃ, gharacchāyaṃ, pero rukkhacchāyā, pabbatacchāyā; brahmūnaṃ sabhā brahmasabhaṃ, devasabhaṃ, pero, si la asamblea es de seres humanos, khattiyasabhā, rājasabhā. Rūpasiddhi y Kaccāyana no tienen esta regla, y fuera de las gramáticas estas formas sólo aparecen en acusativo, femenino donde se distingue: «sudhammaṃ devasabhaṃ» (S. ii 404 (PTS iv 202)).","en":"Niruttidīpanī also gives an exception, taken from Moggallāna, who states it in the same words: in the determinative compound in the sixth inflection with “chāyā” (shade) and “sabhā” (assembly), the compound is sometimes neuter and singular (“Kvac’ ekattañ ca chaṭṭhiyā”, Nir. 256; Moggallāna, p. 128): salabhānaṃ chāyā salabhacchāyaṃ, sakaṭacchāyaṃ, gharacchāyaṃ, but rukkhacchāyā, pabbatacchāyā; brahmūnaṃ sabhā brahmasabhaṃ, devasabhaṃ, but, if the assembly is of human beings, khattiyasabhā, rājasabhā. Rūpasiddhi and Kaccāyana do not have this rule, and outside the grammars these forms occur only in the accusative, feminine where it can be told: “sudhammaṃ devasabhaṃ” (S. ii 404 (PTS iv 202))."},"L":"0748d","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Niruttidīpanī · Moggallāna · Tipiṭaka","id":"tappurisa-l0748d"},{"tipo":"p","texto":{"es":"«saraṇagato» está atestiguado en Mahāniddesa: «… leṇagato leṇappatto saraṇagato saraṇappatto …» (Nidd. I 16 (PTS i 20)). La frase sin componer es la fórmula común: «buddhaṃ saraṇaṃ gato hoti» (citada en DA. i 209 (PTS i 234)).","en":"“saraṇagato” is attested in the Mahāniddesa: “… leṇagato leṇappatto saraṇagato saraṇappatto …” (Nidd. I 16 (PTS i 20)). The uncompounded phrase is the common formula: “buddhaṃ saraṇaṃ gato hoti” (quoted in DA. i 209 (PTS i 234))."},"L":"0748h","iebh":true,"fuente":"Tipiṭaka · Aṭṭhakathā","id":"tappurisa-l0748h"},{"tipo":"h","nivel":2,"texto":{"es":"(1) En la segunda inflexión (dutiyā-tappurisa)","en":"(1) In the second inflection (dutiyā-tappurisa)"},"L":"0750","id":"tappurisa-dutiya-tappurisa"},{"tipo":"p","texto":{"es":"El primer miembro está en la segunda inflexión. Ej., *gāmaṃ* + *gato* = *gāmagato*, que ha ido al poblado. El segundo miembro es *gata*, ido, *nissita*, dependiendo, *atīta*, pasado, *atikkanta*, sobrepasando, *patta*, alcanzando, *āpanna*, entrando, etc. (Rū. §351 (pp. 191–193))","en":"The first member is in the second inflection. E.g., *gāmaṃ* + *gato* = *gāmagato*, who has gone to the village. The second member is *gata*, gone, *nissita*, depending, *atīta*, past, *atikkanta*, surpassing, *patta*, reaching, *āpanna*, entering, etc. (Rū. §351 (pp. 191–193))"},"L":"0752","id":"tappurisa-l0752"},{"tipo":"interlineal","origen":"tabla","compuesto":"araññagato","traduccion":{"es":"ido al bosque","en":"gone to the forest"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"araññaṃ","g":{"es":"al bosque","en":"to the forest"}},{"p":"gato","g":{"es":"ido","en":"gone"}}],"L":"0754","hasta":"0757","id":"c-arannagato"},{"tipo":"interlineal","origen":"tabla","compuesto":"dhammanissito","traduccion":{"es":"que depende del Dhamma","en":"which depends on the Dhamma"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"dhammaṃ","g":{"es":"del Dhamma","en":"on the Dhamma"}},{"p":"nissito","g":{"es":"que depende","en":"which depends"}}],"L":"0763","hasta":"0766","id":"c-dhammanissito"},{"tipo":"interlineal","origen":"tabla","compuesto":"atthanissito","traduccion":{"es":"que depende del significado","en":"which depends on the meaning"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"atthaṃ","g":{"es":"del significado","en":"on the meaning"}},{"p":"nissito","g":{"es":"que depende","en":"which depends"}}],"L":"0770","hasta":"0773","id":"c-atthanissito"},{"tipo":"interlineal","origen":"tabla","compuesto":"bhavātīto","traduccion":{"es":"que trasciende la existencia","en":"which transcends existence"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"bhavaṃ","g":{"es":"existencia","en":"existence"}},{"p":"atīto","g":{"es":"trasciende","en":"transcends"}}],"L":"0778","hasta":"0781","id":"c-bhavatito"},{"tipo":"interlineal","origen":"tabla","compuesto":"pamāṇātikkantaṃ","traduccion":{"es":"sobrepasando la medida","en":"surpassing the measure"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"pamāṇaṃ","g":{"es":"medida","en":"measure"}},{"p":"atikkantaṃ","g":{"es":"sobrepasando","en":"surpassing"}}],"L":"0785","hasta":"0788","id":"c-pamanatikkantam"},{"tipo":"interlineal","origen":"tabla","compuesto":"sukhappatto","traduccion":{"es":"alcanzado felicidad","en":"attained happiness"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"sukhaṃ","g":{"es":"felicidad","en":"happiness"}},{"p":"patto","g":{"es":"alcanzado","en":"attained"}}],"L":"0793","hasta":"0796","id":"c-sukhappatto"},{"tipo":"interlineal","origen":"tabla","compuesto":"sotāpanno","traduccion":{"es":"entrado en la corriente","en":"entered the stream"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"sotaṃ","g":{"es":"corriente","en":"stream"}},{"p":"āpanno","g":{"es":"entrado","en":"entered"}}],"L":"0801","hasta":"0804","id":"c-sotapanno"},{"tipo":"interlineal","origen":"tabla","compuesto":"nirodhasamāpanno","traduccion":{"es":"entrado en cesación","en":"entered cessation"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"nirodhaṃ","g":{"es":"cesación","en":"cessation"}},{"p":"samāpanno","g":{"es":"entrado","en":"entered"}}],"L":"0808","hasta":"0811","id":"c-nirodhasamapanno"},{"tipo":"interlineal","origen":"tabla","compuesto":"rathāruḷho","traduccion":{"es":"subido al carruaje","en":"mounted on the carriage"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"rathaṃ","g":{"es":"carruaje","en":"carriage"}},{"p":"āruḷho","g":{"es":"subido","en":"mounted"}}],"L":"0815","hasta":"0818","id":"c-ratharulho"},{"tipo":"interlineal","origen":"tabla","compuesto":"sabbarattisobhano","traduccion":{"es":"hermoso toda la noche","en":"beautiful for the whole night"},"rotulo":{"es":"resolución del compuesto","en":"resolution of the compound"},"viggaha":[{"p":"sabbarattiṃ","g":{"es":"toda la noche","en":"the whole night"}},{"p":"sobhano","g":{"es":"hermoso","en":"beautiful"}}],"L":"0823","hasta":"0826","id":"c-sabbarattisobhano"},{"tipo":"interlineal","origen":"linea","compuesto":"muhuttasukhaṃ","traduccion":{"es":"felicidad por un momento","en":"happiness for a moment"},"viggaha":[],"L":"0831","texto":{"es":"muhuttasukhaṃ (felicidad por un momento)","en":"muhuttasukhaṃ (happiness for a moment)"},"id":"c-muhuttasukham"},{"tipo":"p","texto":{"es":"Los siguientes compuestos se denominan *upapada-samāsa* o *upapada-tappurisa*. Este tipo especial de compuesto no admite resolución como los restantes compuestos.","en":"The following compounds are called *upapada-samāsa* or *upapada-tappurisa*. This special kind of compound does not admit a resolution like the other compounds."},"L":"0833","id":"tappurisa-l0833"},{"tipo":"p","texto":{"es":"Rūpasiddhi da la razón: en el upapada-samāsa «sólo hay compuesto (vutti), porque es obligatorio (nicca)» (Rū. §351 (p. 193)). Por eso la resolución se hace con el verbo («kammaṃ karotī ti kammakāro») y no con los dos miembros del compuesto. Niruttidīpanī lo dice de los derivados primarios formados con un objeto como miembro precedente: «niccasamāso yeva» (Nir. 224).","en":"Rūpasiddhi gives the reason: in the upapada-samāsa “there is only the compound (vutti), because it is obligatory (nicca)” (Rū. §351 (p. 193)). Therefore the resolution is made with the verb (“kammaṃ karotī ti kammakāro”) and not with the two members of the compound. Niruttidīpanī says this of the primary derivatives formed with an object as preceding member: “niccasamāso yeva” (Nir. 224)."},"L":"0833b","iebh":true,"fuente":"Rūpasiddhi · Niruttidīpanī","id":"tappurisa-l0833b"},{"tipo":"p","texto":{"es":"Estos compuestos se llaman también kitanta-samāsa. Nandisena lo define así: «un tipo de compuesto que tiene *kita*, un derivativo primario, como último miembro. Estos compuestos son fijos (nicca-samāsa), es decir, sus miembros no pueden ser separados. Ej., *kumbhakāro*, alfarero» (Glosario de Nandisena, p. 11; también p. 8, s. v. upapada). Suttaniddesa usa los dos nombres juntos: «ime kammapubbikā kammakārādipayogā niccavasena kitantasamāsā», estas formas con objeto delante, como kammakāro, son compuestos de derivado primario y obligatorios (Suttaniddesa, ad «Dhātuyā kammādimhi ṇo»). El nombre no implica que la inflexión del primer miembro se elida: Suttaniddesa llama a vassaṃvuttho «aluttakitantasamāso», compuesto de derivado primario sin elisión (Suttaniddesa, ad «Vasato uttha»).","en":"These compounds are also called kitanta-samāsa. Nandisena defines it thus: “a kind of compound that has *kita*, a primary derivative, as its last member. These compounds are fixed (nicca-samāsa), that is, their members cannot be separated. E.g., *kumbhakāro*, potter” (Nandisena’s Glosario, p. 11; also p. 8, s.v. upapada). Suttaniddesa uses both names together: “ime kammapubbikā kammakārādipayogā niccavasena kitantasamāsā”, these forms with an object in front, such as kammakāro, are compounds of a primary derivative and obligatory (Suttaniddesa, on “Dhātuyā kammādimhi ṇo”). The name does not imply that the inflection of the first member is elided: Suttaniddesa calls vassaṃvuttho “aluttakitantasamāso”, a compound of a primary derivative without elision (Suttaniddesa, on “Vasato uttha”)."},"L":"0833d","iebh":true,"fuente":"Glosario de Nandisena · Suttaniddesa","id":"tappurisa-l0833d"},{"tipo":"interlineal","origen":"linea","compuesto":"kammakāro","traduccion":{"es":"trabajador","en":"worker"},"viggaha":[{"p":"kammaṃ","g":{"es":"trabajo","en":"work"}},{"p":"karoti","g":{"es":"hace","en":"makes"}},{"p":".","g":{"es":"","en":""}}],"L":"0835","texto":{"es":"kammakāro (trabajador): kammaṃ (trabajo) karoti (hace).","en":"kammakāro (worker): kammaṃ (work) karoti (makes)."},"id":"c-kammakaro"},{"tipo":"interlineal","origen":"linea","compuesto":"kumbhakāro","traduccion":{"es":"alfarero","en":"potter"},"viggaha":[{"p":"kumbhaṃ","g":{"es":"vasijas","en":"pots"}},{"p":"karoti","g":{"es":"hace","en":"makes"}}],"L":"0836","texto":{"es":"kumbhakāro (alfarero): kumbhaṃ (vasijas) karoti (hace)","en":"kumbhakāro (potter): kumbhaṃ (pots) karoti (makes)"},"id":"c-kumbhakaro"},{"tipo":"interlineal","origen":"linea","compuesto":"atthakāmo","traduccion":{"es":"que desea beneficio","en":"who desires benefit"},"viggaha":[{"p":"atthaṃ","g":{"es":"beneficio","en":"benefit"}},{"p":"kāmeti","g":{"es":"desea","en":"desires"}}],"L":"0837","texto":{"es":"atthakāmo (que desea beneficio): atthaṃ (beneficio) kāmeti (desea)","en":"atthakāmo (who desires benefit): atthaṃ (benefit) kāmeti (desires)"},"id":"c-atthakamo"},{"tipo":"interlineal","origen":"linea","compuesto":"saccavādī","traduccion":{"es":"que habla la verdad","en":"who speaks the truth"},"viggaha":[{"p":"saccaṃ","g":{"es":"la verdad","en":"the truth"}},{"p":"vadituṃ","g":{"es":"decir","en":"to speak"}},{"p":"sīlaṃ","g":{"es":"es el hábito","en":"is the habit"}},{"p":"assa","g":{"es":"de éste","en":"of this one"}}],"L":"0838","texto":{"es":"saccavādī (que habla la verdad): saccaṃ (la verdad) vadituṃ (decir) sīlaṃ (es el hábito) assa (de éste)","en":"saccavādī (who speaks the truth): saccaṃ (the truth) vadituṃ (to speak) sīlaṃ (is the habit) assa (of this one)"},"id":"c-saccavadi"},{"tipo":"p","texto":{"es":"Con los derivados primarios en «tavantu», «māna», «anta», etc., no se forma compuesto: sólo existe la frase. Ej., odanaṃ bhuttavā (que ha comido el arroz), dhammaṃ suṇamāno, dhammaṃ suṇanto (que escucha el Dhamma) (Rū. §351 (p. 193)).","en":"With primary derivatives in “tavantu”, “māna”, “anta”, etc., no compound is formed: only the phrase exists. E.g., odanaṃ bhuttavā (who has eaten the rice), dhammaṃ suṇamāno, dhammaṃ suṇanto (who listens to the Dhamma) (Rū. §351 (p. 193))."},"L":"0838b","iebh":true,"fuente":"Rūpasiddhi","id":"tappurisa-l0838b"},{"tipo":"p","texto":{"es":"Sólo compuesto (vutti yeva) y sólo frase (vākyam eva). Con upapada, un derivado primario como segundo miembro, no se usa la frase: «upapadasamāse pana vutti yeva tassa niccattā» (kammaṃ karotī ti kammakāro, atthaṃ kāmetī ti atthakāmo) (Rū. §351 (p. 193); Kacc. §327); así también urago, pādapo, kammajaṃ, vanacaro (Rū., pp. 194, 196, 197). Con los participios en -tavantu, -māna y -anta no se usa el compuesto: «tavantumānantādikitantehi vākyam eva … odanaṃ bhuttavā, dhammaṃ suṇamāno» (Rū., p. 193); también «parasunā chinnavā, kākehi pātabbā, dassanena pahātabbā» (Rū., p. 194). Saddanīti da una razón: «asukhuccāraṇe aviditatthe ca vākyam eva» —sólo frase cuando el compuesto sería difícil de pronunciar o no se entendería su sentido— (Sad. (Smith p. 742)).","en":"Only the compound (vutti yeva) and only the phrase (vākyam eva). With upapada, a primary derivative as second member, the phrase is not used: “upapadasamāse pana vutti yeva tassa niccattā” (kammaṃ karotī ti kammakāro, atthaṃ kāmetī ti atthakāmo) (Rū. §351 (p. 193); Kacc. §327); likewise urago, pādapo, kammajaṃ, vanacaro (Rū., pp. 194, 196, 197). With the participles in -tavantu, -māna and -anta the compound is not used: “tavantumānantādikitantehi vākyam eva … odanaṃ bhuttavā, dhammaṃ suṇamāno” (Rū., p. 193); also “parasunā chinnavā, kākehi pātabbā, dassanena pahātabbā” (Rū., p. 194). Saddanīti gives a reason: “asukhuccāraṇe aviditatthe ca vākyam eva”—only the phrase when the compound would be difficult to pronounce or its sense would not be understood—(Sad. (Smith p. 742))."},"L":"0838e","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Saddanīti","id":"tappurisa-l0838e"},{"tipo":"h","nivel":2,"texto":{"es":"Nombres propios con la inserción ‘nu’","en":"Proper names with the insertion ‘nu’"},"L":"0838g","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","id":"tappurisa-nombres-propios-con-la-insercion-nu"},{"tipo":"p","texto":{"es":"Cuando el compuesto con miembro precedente es un nombre propio (saññā), la raíz toma el sufijo ‘a’ y al final del miembro precedente se inserta ‘nu’: «Saññāyam a nu» (Rū. §565). Al final de la palabra, esa ‘nu’ se convierte en la niggahita, «Nu niggahītaṃ padante» (Rū. §566), y la niggahita, ante una consonante agrupada, en la nasal de su grupo (Kacc. §31): ari-nu-dama → ariṃdama → arindama. Como los anteriores, son compuestos obligatorios y se resuelven con el verbo. El sufijo ‘a’ no lleva ‘ṇ’ y por eso no hay fortalecimiento (vuddhi): dama, no dāma, «vuddhābhāvo ’va viseso» (Rū. §566).","en":"When a compound with a preceding member is a proper name (saññā), the root takes the suffix ‘a’ and ‘nu’ is inserted at the end of the preceding member: “Saññāyam a nu” (Rū. §565). At the end of the word that ‘nu’ becomes the niggahita, “Nu niggahītaṃ padante” (Rū. §566), and the niggahita, before a consonant of a group, becomes the nasal of its group (Kacc. §31): ari-nu-dama → ariṃdama → arindama. Like the preceding ones, they are obligatory compounds and are resolved with the verb. The suffix ‘a’ has no ‘ṇ’, so there is no strengthening (vuddhi): dama, not dāma, “vuddhābhāvo ’va viseso” (Rū. §566)."},"L":"0838h","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Nyāsa","id":"tappurisa-l0838h"},{"tipo":"interlineal","origen":"linea","compuesto":"Arindamo","traduccion":{"es":"el que somete a los enemigos, nombre de un rey","en":"subduer of enemies, name of a king"},"viggaha":[{"p":"ariṃ","g":{"es":"al enemigo","en":"the enemy"}},{"p":"dameti","g":{"es":"somete","en":"subdues"}}],"L":"0838j","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","texto":{"es":"Arindamo (el que somete a los enemigos, nombre de un rey): ariṃ (al enemigo) dameti (somete)","en":"Arindamo (subduer of enemies, name of a king): ariṃ (the enemy) dameti (subdues)"},"id":"c-arindamo"},{"tipo":"interlineal","origen":"linea","compuesto":"Vessantaro","traduccion":{"es":"nombre de un rey","en":"name of a king"},"viggaha":[{"p":"vessaṃ","g":{"es":"la calle de los mercaderes","en":"the merchants’ street"}},{"p":"tarati","g":{"es":"cruza","en":"crosses"}}],"L":"0838k","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Thitzana","texto":{"es":"Vessantaro (nombre de un rey): vessaṃ (la calle de los mercaderes) tarati (cruza)","en":"Vessantaro (name of a king): vessaṃ (the merchants’ street) tarati (crosses)"},"id":"c-vessantaro"},{"tipo":"interlineal","origen":"linea","compuesto":"Taṇhaṅkaro","traduccion":{"es":"nombre de un Buddha","en":"name of a Buddha"},"viggaha":[{"p":"taṇhaṃ","g":{"es":"el ansia","en":"craving"}},{"p":"karoti","g":{"es":"destruye","en":"destroys"}}],"L":"0838l","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","texto":{"es":"Taṇhaṅkaro (nombre de un Buddha): taṇhaṃ (el ansia) karoti (destruye)","en":"Taṇhaṅkaro (name of a Buddha): taṇhaṃ (craving) karoti (destroys)"},"anexos":[{"es":"Aquí «karoti» significa «destruye»: «taṇhaṃ karoti hiṃsatī ti Taṇhaṅkaro» (Rū. §566).","en":"Here “karoti” means “destroys”: “taṇhaṃ karoti hiṃsatī ti Taṇhaṅkaro” (Rū. §566).","fuente":"Rūpasiddhi","L":"0838m"}],"id":"c-tanhankaro"},{"tipo":"interlineal","origen":"linea","compuesto":"Medhaṅkaro","traduccion":{"es":"nombre de un Buddha","en":"name of a Buddha"},"viggaha":[{"p":"medhaṃ","g":{"es":"la sabiduría","en":"wisdom"}},{"p":"karoti","g":{"es":"hace","en":"makes"}}],"L":"0838n","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","texto":{"es":"Medhaṅkaro (nombre de un Buddha): medhaṃ (la sabiduría) karoti (hace)","en":"Medhaṅkaro (name of a Buddha): medhaṃ (wisdom) karoti (makes)"},"id":"c-medhankaro"},{"tipo":"interlineal","origen":"linea","compuesto":"Saraṇaṅkaro","traduccion":{"es":"nombre de un Buddha","en":"name of a Buddha"},"viggaha":[{"p":"saraṇaṃ","g":{"es":"el refugio","en":"refuge"}},{"p":"karoti","g":{"es":"hace","en":"makes"}}],"L":"0838o","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","texto":{"es":"Saraṇaṅkaro (nombre de un Buddha): saraṇaṃ (el refugio) karoti (hace)","en":"Saraṇaṅkaro (name of a Buddha): saraṇaṃ (refuge) karoti (makes)"},"id":"c-saranankaro"},{"tipo":"interlineal","origen":"linea","compuesto":"Dīpaṅkaro","traduccion":{"es":"nombre de un Buddha","en":"name of a Buddha"},"viggaha":[{"p":"dīpaṃ","g":{"es":"la lámpara","en":"the lamp"}},{"p":"karoti","g":{"es":"hace","en":"makes"}}],"L":"0838p","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","texto":{"es":"Dīpaṅkaro (nombre de un Buddha): dīpaṃ (la lámpara) karoti (hace)","en":"Dīpaṅkaro (name of a Buddha): dīpaṃ (the lamp) karoti (makes)"},"id":"c-dipankaro"},{"tipo":"interlineal","origen":"linea","compuesto":"Purindado","traduccion":{"es":"nombre de Sakka, rey de los devas","en":"name of Sakka, king of the devas"},"viggaha":[{"p":"pure","g":{"es":"antes","en":"formerly"}},{"p":"dānaṃ","g":{"es":"dádivas","en":"gifts"}},{"p":"adāsi","g":{"es":"dio","en":"gave"}}],"L":"0838q","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana","texto":{"es":"Purindado (nombre de Sakka, rey de los devas): pure (antes) dānaṃ (dádivas) adāsi (dio)","en":"Purindado (name of Sakka, king of the devas): pure (formerly) dānaṃ (gifts) adāsi (gave)"},"anexos":[{"es":"Aquí no hay ‘nu’: con «pura» delante de la raíz «dada», la ‘a’ final de «pura» se sustituye por ‘iṃ’, «Pure dadā ca iṃ» (Rū. §567), y también esa sustitución se hace después de elidir la inflexión: «idhā pi vibhattilope kate yeva iṃādeso» (Rū. §567).","en":"Here there is no ‘nu’: with “pura” before the root “dada”, the final ‘a’ of “pura” is replaced by ‘iṃ’, “Pure dadā ca iṃ” (Rū. §567), and this replacement too is made after the inflection is elided: “idhā pi vibhattilope kate yeva iṃādeso” (Rū. §567).","fuente":"Rūpasiddhi · Kaccāyana","L":"0838r"}],"id":"c-purindado"},{"tipo":"p","texto":{"es":"¿Se elide aquí la inflexión? En arindamo, taṇhaṅkaro o dīpaṅkaro parece que el primer miembro conserva el acusativo (ariṃ, taṇhaṃ, dīpaṃ). Las fuentes lo explican de dos maneras. Para Rūpasiddhi la inflexión se elide y la nasal es la inserción ‘nu’: «ayaṃ pana nvāgamo samāsaṃ katvā upapadavibhattilope kate yeva hoti», esta inserción se hace sólo después de formar el compuesto y elidir la inflexión del miembro precedente (Rū. §565); Nyāsa deriva arindamo del mismo modo. Son, así, compuestos con inflexión elidida (lutta-samāsa). En cambio, la vutti de Kaccāyana da Medhaṅkaro y Dīpaṅkaro también como ejemplos de que la inflexión no se elide, por el «ca» de «Tesaṃ vibhattiyo lopā ca» (Kacc. §317), y Niruttidīpanī pone dīpaṅkaro, pabhaṅkaro, purindado y vessantaro entre los compuestos determinativos sin elisión (aluttatappurisa) (Nir., «Aluttatappurisa»). Véase más abajo el compuesto determinativo donde la inflexión del primer miembro no se elide.","en":"Is the inflection elided here? In arindamo, taṇhaṅkaro or dīpaṅkaro the first member seems to keep its accusative (ariṃ, taṇhaṃ, dīpaṃ). The sources explain this in two ways. For Rūpasiddhi the inflection is elided and the nasal is the insertion ‘nu’: “ayaṃ pana nvāgamo samāsaṃ katvā upapadavibhattilope kate yeva hoti”, this insertion is made only after the compound is formed and the inflection of the preceding member is elided (Rū. §565); Nyāsa derives arindamo in the same way. They are thus compounds with the inflection elided (lutta-samāsa). The Kaccāyana vutti, on the other hand, also gives Medhaṅkaro and Dīpaṅkaro as examples of the inflection not being elided, by the “ca” of “Tesaṃ vibhattiyo lopā ca” (Kacc. §317), and Niruttidīpanī places dīpaṅkaro, pabhaṅkaro, purindado and vessantaro among the determinative compounds without elision (aluttatappurisa) (Nir., “Aluttatappurisa”). See below the determinative compound in which the inflection of the first member is not elided."},"L":"0838t","iebh":true,"fuente":"Rūpasiddhi · Kaccāyana · Nyāsa · Niruttidīpanī","id":"tappurisa-l0838t"},{"tipo":"h","nivel":2,"texto":{"es":"(2) En la tercera inflexión (tatiyā-tappurisa)","en":"(2) In the third inflection (tatiyā-tappurisa)"},"L":"0841","id":"tappurisa-tatiya-tappurisa"},{"tipo":"p","texto":{"es":"El primer miembro está en la tercera inflexión. El segundo miembro es un derivado primario (kitaka), *pubba* (previo), *sadisa* (similar), *sama* (igual), *ūna* (deficiente, menos), *kalaha* (disputa), *nipuṇa* (hábil, diestro), *missa* (mezclado), *sakhila* (afable). (Rū. §351 (pp. 193–194))","en":"The first member is in the third inflection. The second member is a primary derivative (kitaka), *pubba* (previous), *sadisa* (similar), *sama* (equal), *ūna* (deficient, less), *kalaha* (dispute), *nipuṇa* (skilled, adept), *missa* (mixed), *sakhila* (affable). (Rū. §351 (pp. 193–194))"},"L":"0843","id":"tappurisa-l0843"},{"tipo":"h","nivel":3,"texto":{"es":"Con derivados primarios","en":"With primary derivatives"},"L":"0845","id":"tappurisa-con-derivados-primarios"},{"tipo":"interlineal","origen":"linea","compuesto":"Buddhabhāsito","traduccion":{"es":"dicho por el Buddha","en":"spoken by the Buddha"},"viggaha":[{"p":"Buddhena","g":{"es":"por el Buddha","en":"by the Buddha"}},{"p":"bhāsito","g":{"es":"dicho","en":"spoken"}}],"L":"0847","texto":{"es":"Buddhabhāsito (dicho por el Buddha): Buddhena (por el Buddha) bhāsito (dicho)","en":"Buddhabhāsito (spoken by the Buddha): Buddhena (by the Buddha) bhāsito (spoken)"},"anexos":[{"es":"«buddhabhāsito» está atestiguado en el Vinaya: «Dhammo nāma buddhabhāsito, sāvakabhāsito, isibhāsito, devatābhāsito» (V. ii 26 (PTS Vin iv 15)).","en":"“buddhabhāsito” is attested in the Vinaya: “Dhammo nāma buddhabhāsito, sāvakabhāsito, isibhāsito, devatābhāsito” (V. ii 26 (PTS Vin iv 15)).","fuente":"Tipiṭaka","L":"0848b"}],"id":"c-buddhabhasito"},{"tipo":"interlineal","origen":"linea","compuesto":"Satthuvaṇṇito","traduccion":{"es":"elogiado por el Maestro","en":"praised by the Teacher"},"viggaha":[{"p":"Satthārā","g":{"es":"por el Maestro","en":"by the Teacher"}},{"p":"vaṇṇito","g":{"es":"elogiado","en":"praised"}}],"L":"0848","texto":{"es":"Satthuvaṇṇito (elogiado por el Maestro): Satthārā (por el Maestro) vaṇṇito (elogiado)","en":"Satthuvaṇṇito (praised by the Teacher): Satthārā (by the Teacher) vaṇṇito (praised)"},"id":"c-satthuvannito"},{"tipo":"interlineal","origen":"linea","compuesto":"viññugarahito","traduccion":{"es":"criticado por los que conocen","en":"criticised by those who know"},"viggaha":[{"p":"viññūhi","g":{"es":"por los que conocen","en":"by those who know"}},{"p":"garahito","g":{"es":"criticado","en":"criticised"}}],"L":"0849","texto":{"es":"viññugarahito (criticado por los que conocen): viññūhi (por los que conocen) garahito (criticado)","en":"viññugarahito (criticised by those who know): viññūhi (by those who know) garahito (criticised)"},"id":"c-vinnugarahito"},{"tipo":"interlineal","origen":"linea","compuesto":"issarakataṃ","traduccion":{"es":"hecho por el creador","en":"made by the creator"},"viggaha":[{"p":"issarena","g":{"es":"por el creador","en":"by the creator"}},{"p":"kataṃ","g":{"es":"hecho","en":"done"}}],"L":"0850","texto":{"es":"issarakataṃ (hecho por el creador): issarena (por el creador) kataṃ (hecho)","en":"issarakataṃ (made by the creator): issarena (by the creator) kataṃ (made)"},"id":"c-issarakatam"},{"tipo":"interlineal","origen":"linea","compuesto":"rājahato","traduccion":{"es":"matado por el rey","en":"killed by the king"},"viggaha":[{"p":"raññā","g":{"es":"por el rey","en":"by the king"}},{"p":"hato","g":{"es":"matado","en":"killed"}}],"L":"0851","texto":{"es":"rājahato (matado por el rey): raññā (por el rey) hato (matado)","en":"rājahato (killed by the king): raññā (by the king) hato (killed)"},"id":"c-rajahato"},{"tipo":"interlineal","origen":"linea","compuesto":"rogapīḷito","traduccion":{"es":"oprimido por enfermedad","en":"oppressed by illness"},"viggaha":[{"p":"rogena","g":{"es":"por enfermedad","en":"by illness"}},{"p":"pīḷito","g":{"es":"oprimido","en":"oppressed"}}],"L":"0852","texto":{"es":"rogapīḷito (oprimido por enfermedad): rogena (por enfermedad) pīḷito (oprimido)","en":"rogapīḷito (oppressed by illness): rogena (by illness) pīḷito (oppressed)"},"id":"c-rogapilito"},{"tipo":"interlineal","origen":"linea","compuesto":"sīlasampanno","traduccion":{"es":"dotado de virtud","en":"endowed with virtue"},"viggaha":[{"p":"sīlena","g":{"es":"de virtud","en":"with virtue"}},{"p":"sampanno","g":{"es":"dotado","en":"endowed"}}],"L":"0853","texto":{"es":"sīlasampanno (dotado de virtud): sīlena (de virtud) sampanno (dotado)","en":"sīlasampanno (endowed with virtue): sīlena (with virtue) sampanno (endowed)"},"anexos":[{"es":"«sīlasampanno» es frecuentísimo en el canon, p. ej. «parisuddhājīvo sīlasampanno» (D. i 59 (PTS i 63)).","en":"“sīlasampanno” is extremely frequent in the canon, e.g. “parisuddhājīvo sīlasampanno” (D. i 59 (PTS i 63)).","fuente":"Tipiṭaka","L":"0853b"}],"id":"c-silasampanno"},{"tipo":"interlineal","origen":"linea","compuesto":"sukhasahagataṃ","traduccion":{"es":"asociado con placer","en":"associated with pleasure"},"viggaha":[{"p":"sukhena","g":{"es":"con placer","en":"with pleasure"}},{"p":"sahagataṃ","g":{"es":"asociado","en":"associated"}}],"L":"0854","texto":{"es":"sukhasahagataṃ (asociado con placer): sukhena (con placer) sahagataṃ (asociado)","en":"sukhasahagataṃ (associated with pleasure): sukhena (with pleasure) sahagataṃ (associated)"},"id":"c-sukhasahagatam"},{"tipo":"interlineal","origen":"linea","compuesto":"piyavippayogo","traduccion":{"es":"separación de lo querido","en":"separation from what is dear"},"viggaha":[{"p":"piyehi","g":{"es":"de los queridos","en":"from the dear ones"}},{"p":"vippayogo","g":{"es":"separación","en":"separation"}}],"L":"0855","texto":{"es":"piyavippayogo (separación de lo querido): piyehi (de los queridos) vippayogo (separación)","en":"piyavippayogo (separation from what is dear): piyehi (from the dear ones) vippayogo (separation)"},"anexos":[{"es":"La frase sin componer, con la tercera inflexión, está en la definición de la Primera Noble Verdad: «piyehi vippayogo pi dukkho» (D. ii 243 (PTS ii 305)).","en":"The uncompounded phrase, with the third inflection, is found in the definition of the First Noble Truth: “piyehi vippayogo pi dukkho” (D. ii 243 (PTS ii 305)).","fuente":"Tipiṭaka","L":"0855b"}],"id":"c-piyavippayogo"},{"tipo":"interlineal","origen":"linea","compuesto":"pādapo","traduccion":{"es":"árbol","en":"tree"},"viggaha":[{"p":"pādena","g":{"es":"con las patas-raíces","en":"with the feet-roots"}},{"p":"pivati","g":{"es":"bebe","en":"drinks"}}],"L":"0856","texto":{"es":"pādapo (árbol): pādena (con las patas-raíces) pivati (bebe)","en":"pādapo (tree): pādena (with the feet-roots) pivati (drinks)"},"anexos":[{"es":"En «pādapo», como en «urago» (urena gacchatī ti, que va con el pecho, la serpiente), sólo hay compuesto (vutti); la resolución se hace con el verbo. A la inversa, a veces sólo hay frase y no se forma compuesto: parasunā chinnavā (que ha cortado con el hacha), kākehi pātabbā (que pueden beber los cuervos), dassanena pahātabbā (que han de abandonarse por la visión) (Rū. §351 (p. 194)).","en":"In “pādapo”, as in “urago” (urena gacchatī ti, that which goes with the chest, the snake), there is only the compound (vutti); the resolution is made with the verb. Conversely, sometimes there is only the phrase and no compound is formed: parasunā chinnavā (who has cut with the axe), kākehi pātabbā (which crows can drink), dassanena pahātabbā (which are to be abandoned by seeing) (Rū. §351 (p. 194)).","fuente":"Rūpasiddhi","L":"0856b"}],"id":"c-padapo"},{"tipo":"h","nivel":3,"texto":{"es":"Con *pubba*, etc.","en":"With *pubba*, etc."},"L":"0858","id":"tappurisa-con-pubba-etc"},{"tipo":"interlineal","origen":"linea","compuesto":"māsapubbo","traduccion":{"es":"mayor por un mes","en":"older by a month"},"viggaha":[{"p":"māsena","g":{"es":"por un mes","en":"by a month"}},{"p":"pubbo","g":{"es":"previo","en":"prior"}}],"L":"0860","texto":{"es":"māsapubbo (mayor por un mes): māsena (por un mes) pubbo (previo)","en":"māsapubbo (older by a month): māsena (by a month) pubbo (prior)"},"id":"c-masapubbo"},{"tipo":"interlineal","origen":"linea","compuesto":"mātusadiso","traduccion":{"es":"similar a la madre","en":"similar to the mother"},"viggaha":[{"p":"mātarā","g":{"es":"con la madre","en":"with the mother"}},{"p":"sadiso","g":{"es":"similar","en":"similar"}}],"L":"0861","texto":{"es":"mātusadiso (similar a la madre): mātarā (con la madre) sadiso (similar)","en":"mātusadiso (similar to the mother): mātarā (with the mother) sadiso (similar)"},"id":"c-matusadiso"},{"tipo":"interlineal","origen":"linea","compuesto":"pitusamo","traduccion":{"es":"igual al padre","en":"equal to the father"},"viggaha":[{"p":"pitarā","g":{"es":"con el padre","en":"with the father"}},{"p":"samo","g":{"es":"igual","en":"equal"}}],"L":"0862","texto":{"es":"pitusamo (igual al padre): pitarā (con el padre) samo (igual)","en":"pitusamo (equal to the father): pitarā (with the father) samo (equal)"},"id":"c-pitusamo"},{"tipo":"interlineal","origen":"linea","compuesto":"ekūnavīsati","traduccion":{"es":"diecinueve","en":"nineteen"},"viggaha":[{"p":"ekena","g":{"es":"con uno","en":"by one"}},{"p":"ūnā","g":{"es":"deficiente","en":"deficient"}},{"p":"vīsati","g":{"es":"veinte","en":"twenty"}}],"L":"0863","texto":{"es":"ekūnavīsati (diecinueve): ekena (con uno) ūnā (deficiente) vīsati (veinte)","en":"ekūnavīsati (nineteen): ekena (by one) ūnā (deficient) vīsati (twenty)"},"id":"c-ekunavisati"},{"tipo":"interlineal","origen":"linea","compuesto":"sīlavikalo","traduccion":{"es":"deficiente en virtud","en":"deficient in virtue"},"viggaha":[{"p":"sīlena","g":{"es":"con virtud","en":"with virtue"}},{"p":"vikalo","g":{"es":"deficiente","en":"deficient"}}],"L":"0864","texto":{"es":"sīlavikalo (deficiente en virtud): sīlena (con virtud) vikalo (deficiente)","en":"sīlavikalo (deficient in virtue): sīlena (with virtue) vikalo (deficient)"},"id":"c-silavikalo"},{"tipo":"interlineal","origen":"linea","compuesto":"asikalaho","traduccion":{"es":"disputa con sables","en":"dispute with swords"},"viggaha":[{"p":"asīhi","g":{"es":"con sables","en":"with swords"}},{"p":"kalaho","g":{"es":"disputa","en":"dispute"}}],"L":"0865","texto":{"es":"asikalaho (disputa con sables): asīhi (con sables) kalaho (disputa)","en":"asikalaho (dispute with swords): asīhi (with swords) kalaho (dispute)"},"id":"c-asikalaho"},{"tipo":"interlineal","origen":"linea","compuesto":"vācānipuṇo","traduccion":{"es":"hábil con palabras","en":"skilled with words"},"viggaha":[{"p":"vācāya","g":{"es":"con palabra","en":"with speech"}},{"p":"nipuṇo","g":{"es":"hábil","en":"skilled"}}],"L":"0866","texto":{"es":"vācānipuṇo (hábil con palabras): vācāya (con palabra) nipuṇo (hábil)","en":"vācānipuṇo (skilled with words): vācāya (with speech) nipuṇo (skilled)"},"id":"c-vacanipuno"},{"tipo":"interlineal","origen":"linea","compuesto":"yāvakālikasammissaṃ","traduccion":{"es":"mezclado con comida que puede ser comida en la mañana","en":"mixed with food that can be eaten in the morning"},"viggaha":[{"p":"yāvakālikena","g":{"es":"con comida que puede ser comida en la mañana","en":"with food that can be eaten in the morning"}},{"p":"sammissaṃ","g":{"es":"mezclado","en":"mixed"}}],"L":"0867","texto":{"es":"yāvakālikasammissaṃ (mezclado con comida que puede ser comida en la mañana): yāvakālikena (con comida que puede ser comida en la mañana) sammissaṃ (mezclado)","en":"yāvakālikasammissaṃ (mixed with food that can be eaten in the morning): yāvakālikena (with food that can be eaten in the morning) sammissaṃ (mixed)"},"id":"c-yavakalikasammissam"},{"tipo":"interlineal","origen":"linea","compuesto":"vācāsakhilo","traduccion":{"es":"afable en el hablar","en":"affable in speech"},"viggaha":[{"p":"vācāya","g":{"es":"con palabra","en":"with speech"}},{"p":"sakhilo","g":{"es":"afable","en":"affable"}}],"L":"0868","texto":{"es":"vācāsakhilo (afable en el hablar): vācāya (con palabra) sakhilo (afable)","en":"vācāsakhilo (affable in speech): vācāya (with speech) sakhilo (affable)"},"id":"c-vacasakhilo"},{"tipo":"interlineal","origen":"linea","compuesto":"puññatthiko","traduccion":{"es":"que desea mérito","en":"desiring merit"},"viggaha":[{"p":"puññena","g":{"es":"con mérito","en":"with merit"}},{"p":"atthiko","g":{"es":"que desea","en":"who desires"}}],"L":"0869","texto":{"es":"puññatthiko (que desea mérito): puññena (con mérito) atthiko (que desea)","en":"puññatthiko (desiring merit): puññena (with merit) atthiko (who desires)"},"id":"c-punnatthiko"},{"tipo":"interlineal","origen":"linea","compuesto":"guṇādhiko","traduccion":{"es":"que excede en cualidades","en":"exceeding in qualities"},"viggaha":[{"p":"guṇena","g":{"es":"en cualidades","en":"in qualities"}},{"p":"adhiko","g":{"es":"que excede","en":"which exceeds"}}],"L":"0870","texto":{"es":"guṇādhiko (que excede en cualidades): guṇena (en cualidades) adhiko (que excede)","en":"guṇādhiko (exceeding in qualities): guṇena (in qualities) adhiko (which exceeds)"},"anexos":[{"es":"Según Niruttidīpanī: «guṇena adhiko guṇādhiko».","en":"According to Niruttidīpanī: “guṇena adhiko guṇādhiko”.","fuente":"Niruttidīpanī","L":"0870a"}],"id":"c-gunadhiko"},{"tipo":"interlineal","origen":"linea","compuesto":"guḷodano","traduccion":{"es":"arroz con melaza","en":"rice with molasses"},"viggaha":[{"p":"guḷena","g":{"es":"con melaza","en":"with molasses"}},{"p":"saṃsaṭṭho","g":{"es":"mezclado","en":"mixed"}},{"p":"odano","g":{"es":"arroz","en":"rice"}}],"L":"0871","texto":{"es":"guḷodano (arroz con melaza): guḷena (con melaza) saṃsaṭṭho (mezclado) odano (arroz)","en":"guḷodano (rice with molasses): guḷena (with molasses) saṃsaṭṭho (mixed) odano (rice)"},"id":"c-gulodano"},{"tipo":"interlineal","origen":"linea","compuesto":"assaratho","traduccion":{"es":"carruaje con caballo","en":"chariot with a horse"},"viggaha":[{"p":"assena","g":{"es":"con caballo","en":"with a horse"}},{"p":"yutto","g":{"es":"enyugado","en":"yoked"}},{"p":"ratho","g":{"es":"carruaje","en":"carriage"}}],"L":"0872","texto":{"es":"assaratho (carruaje con caballo): assena (con caballo) yutto (enyugado) ratho (carruaje)","en":"assaratho (chariot with a horse): assena (with a horse) yutto (yoked) ratho (chariot)"},"id":"c-assaratho"},{"tipo":"interlineal","origen":"linea","compuesto":"maggacittaṃ","traduccion":{"es":"conciencia del Sendero","en":"consciousness of the Path"},"viggaha":[{"p":"maggena","g":{"es":"con el Sendero","en":"with the Path"}},{"p":"sampayuttaṃ","g":{"es":"asociada","en":"associated"}},{"p":"cittaṃ","g":{"es":"conciencia","en":"consciousness"}}],"L":"0873","texto":{"es":"maggacittaṃ (conciencia del Sendero): maggena (con el Sendero) sampayuttaṃ (asociada) cittaṃ (conciencia)","en":"maggacittaṃ (consciousness of the Path): maggena (with the Path) sampayuttaṃ (associated) cittaṃ (consciousness)"},"anexos":[{"es":"La palabra «sampayuttaṃ» de la resolución es de Niruttidīpanī.","en":"The word “sampayuttaṃ” in the resolution is from Niruttidīpanī.","fuente":"Niruttidīpanī","L":"0873a"}],"id":"c-maggacittam"},{"tipo":"p","texto":{"es":"En guḷodano y assaratho la resolución lleva una palabra que no figura en el compuesto (saṃsaṭṭho, yutto); Niruttidīpanī lo llama «majjhepadalopo», elisión de la palabra del medio, y resuelve igual «maggena sampayuttaṃ cittaṃ maggacittaṃ» (sutta 345; Nir. 225). Moggallāna explica por qué el compuesto es válido aunque falte esa palabra: «vuttipadenevopasittādikiriyāyākhyāpanato natthāyuttatthatā», como la propia forma compuesta expresa la acción (upasitta, etc.), no hay falta de conexión de sentido (Mogg., p. 120).","en":"In guḷodano and assaratho the resolution contains a word that does not appear in the compound (saṃsaṭṭho, yutto); Niruttidīpanī calls this “majjhepadalopo”, elision of the middle word, and resolves in the same way “maggena sampayuttaṃ cittaṃ maggacittaṃ” (sutta 345; Nir. 225). Moggallāna explains why the compound is valid even though that word is missing: “vuttipadenevopasittādikiriyāyākhyāpanato natthāyuttatthatā”, since the compound form itself expresses the action (upasitta, etc.), there is no lack of connection of meaning (Mogg., p. 120)."},"L":"0873c","iebh":true,"fuente":"Niruttidīpanī · Moggallāna","id":"tappurisa-l0873c"},{"tipo":"interlineal","origen":"linea","compuesto":"ekādasa","traduccion":{"es":"once","en":"eleven"},"viggaha":[{"p":"ekena","g":{"es":"por uno","en":"by one"}},{"p":"adhikā","g":{"es":"excedidos","en":"exceeded"}},{"p":"dasa","g":{"es":"diez","en":"ten"}}],"L":"0874","texto":{"es":"ekādasa (once): ekena (por uno) adhikā (excedidos) dasa (diez)","en":"ekādasa (eleven): ekena (by one) adhikā (exceeded) dasa (ten)"},"id":"c-ekadasa"},{"tipo":"interlineal","origen":"linea","compuesto":"jaccandho","traduccion":{"es":"ciego de nacimiento","en":"blind from birth"},"viggaha":[{"p":"jātiyā","g":{"es":"por nacimiento","en":"by birth"}},{"p":"andho","g":{"es":"ciego","en":"blind"}}],"L":"0875","texto":{"es":"jaccandho (ciego de nacimiento): jātiyā (por nacimiento) andho (ciego)","en":"jaccandho (blind from birth): jātiyā (by birth) andho (blind)"},"id":"c-jaccandho"},{"tipo":"interlineal","origen":"linea","compuesto":"pakatimedhāvī","traduccion":{"es":"sabio por naturaleza","en":"wise by nature"},"viggaha":[{"p":"pakatiyā","g":{"es":"por naturaleza","en":"by nature"}},{"p":"medhāvī","g":{"es":"sabio","en":"sage"}}],"L":"0876","texto":{"es":"pakatimedhāvī (sabio por naturaleza): pakatiyā (por naturaleza) medhāvī (sabio)","en":"pakatimedhāvī (wise by nature): pakatiyā (by nature) medhāvī (wise)"},"id":"c-pakatimedhavi"},{"tipo":"h","nivel":2,"texto":{"es":"(3) En la cuarta inflexión (catutthī-tappurisa)","en":"(3) In the fourth inflection (catutthī-tappurisa)"},"L":"0879","id":"tappurisa-catutthi-tappurisa"},{"tipo":"p","texto":{"es":"El primer miembro tiene la cuarta inflexión. Se utiliza para indicar propósito (tadattha), para (attha), beneficio, bienestar (hita), aquello a ser dado (deyya), etc. (Rū. §351 (pp. 194–195))","en":"The first member has the fourth inflection. It is used to indicate purpose (tadattha), for (attha), benefit, welfare (hita), what is to be given (deyya), etc. (Rū. §351 (pp. 194–195))"},"L":"0881","id":"tappurisa-l0881"},{"tipo":"interlineal","origen":"linea","compuesto":"kathinadussaṃ","traduccion":{"es":"tela para kathina","en":"cloth sterio para la Orden de bhikkhus","en":"a monastery for the Order of bhikkhus"},"viggaha":[{"p":"bhikkhusaṃghassa","g":{"es":"para la Orden de bhikkhus","en":"for the Order of bhikkhus"}},{"p":"atthāya","g":{"es":"para","en":"for"}},{"p":"vihāro","g":{"es":"monasterio","en":"monastery"}}],"L":"0890","texto":{"es":"bhikkhusaṃghattho vihāro (un monasterio para la Orden de bhikkhus): bhikkhusaṃghassa (para la Orden de bhikkhus) atthāya (para) vihāro (monasterio)","en":"bhikkhusaṃghattho vihāro (a monastery for the Order of bhikkhus): bhikkhusaṃghassa (for the Order of bhikkhus) atthāya (for) vihāro (monastery)"},"id":"c-bhikkhusamghattho-viharo"},{"tipo":"interlineal","origen":"linea","compuesto":"bhikkhusaṃghatthā yāgu","traduccion":{"es":"sopa de arroz para la Orden de bhikkhus","en":"rice gruel for the Order of bhikkhus"},"viggaha":[{"p":"bhikkhusaṃghassa","g":{"es":"para la Orden de bhikkhus","en":"for the Order of bhikkhus"}},{"p":"atthāya","g":{"es":"para","en":"for"}},{"p":"yāgu","g":{"es":"sopa de arroz","en":"rice gruel"}}],"L":"0891","texto":{"es":"bhikkhusaṃghatthā yāgu (sopa de arroz para la Orden de bhikkhus): bhikkhusaṃghassa (para la Orden de bhikkhus) atthāya (para) yāgu (sopa de arroz)","en":"bhikkhusaṃghatthā yāgu (rice gruel for the Order of bhikkhus): bhikkhusaṃghassa (for the Order of bhikkhus) atthāya (for) yāgu (rice gruel)"},"id":"c-bhikkhusamghattha-yagu"},{"tipo":"interlineal","origen":"linea","compuesto":"bhikkhusaṃghatthaṃ cīvaraṃ","traduccion":{"es":"hábito para la Orden de bhikkhus","en":"robe for the Order of bhikkhus"},"viggaha":[{"p":"bhikkhusaṃghassa","g":{"es":"para la Orden de bhikkhus","en":"for the Order of bhikkhus"}},{"p":"atthāya","g":{"es":"para","en":"for"}},{"p":"cīvaraṃ","g":{"es":"hábito","en":"robe"}}],"L":"0892","texto":{"es":"bhikkhusaṃghatthaṃ cīvaraṃ (hábito para la Orden de bhikkhus): bhikkhusaṃghassa (para la Orden de bhikkhus) atthāya (para) cīvaraṃ (hábito)","en":"bhikkhusaṃghatthaṃ cīvaraṃ (robe for the Order of b ato","traduccion":{"es":"salido de la ciudad","en":"gone out of the city"},"viggaha":[{"p":"nagarasmā","g":{"es":"de la ciudad","en":"from the city"}},{"p":"niggato","g":{"es":"salido","en":"gone out"}}],"L":"0900","texto":{"es":"nagaraniggato (salido de la ciudad): nagarasmā (de la ciudad) niggato (salido)","en":"nagaraniggato (gone out of the city): nagarasmā (from the city) niggato (gone out)"},"id":"c-nagaraniggato"},{"tipo":"interlineal","origen":"linea","compuesto":"āpattivuṭṭhānaṃ","traduccion":{"es":"emergencia de las faltas","en":"emergence from the offences"},"viggaha":[{"p":"āpattito","g":{"es":"de faltas","en":"from offences"}},{"p":"vuṭṭhānaṃ","g":{"es":"emergencia","en":"emergence"}}],"L":"0901","texto":{"es":"āpattivuṭṭhānaṃ (emergencia de las faltas): āpattito (de faltas) vuṭṭhānaṃ (emergencia)","en":"āpattivuṭṭhānaṃ (emergence from the offences): āpattito (from offences) vuṭṭhānaṃ (emergence)"},"id":"c-apattivutthanam"},{"tipo":"interlineal","origen":"linea","compuesto":"rukkhaggapatito","traduccion":{"es":"caído de la parte alta del árbol","en":"fallen from the top of the tree"},"viggaha":[{"p":"rukkhaggā","g":{"es":"de la parte alta del árbol","en":"from the top of the tree"}},{"p":"patito","g":{"es":"caído","en":"fallen"}}],"L":"0902","texto":{"es":"rukkhaggapatito (caído de la parte alta del árbol): rukkhaggā (de la parte alta del árbol) patito (caído)","en":"rukkhaggapatito (fallen from the top of the tree): rukkhaggā (from the top of the tree) patito (fallen)"},"id":"c-rukkhaggapatito"},{"tipo":"interlineal","origen":"linea","compuesto":"sāsanacuto","traduccion":{"es":"cesado de la religión","en":"ceased from the religion"},"viggaha":[{"p":"sāsanato","g":{"es":"de la religión","en":"from the religion"}},{"p":"cuto","g":{"es":"cesado, muerto","en":"ceased, dead"}}],"L":"0903","texto":{"es":"sāsanacuto (cesado de la religión): sāsanato (de la religión) cuto (cesado, muerto)","en":"sāsanacuto (ceased from the religion): sāsanato (from the religio
