is de los suttas»"],"en":["<b>Byākaraṇasiromaṇi Visuddhāyuṃ Kaccāyana-suttanak-ṭīkā<\/b>","Ashin Aggañāṇābhivaṃsa, Si-shin Nāyaka Sayadaw","2004 (BE 1366)","Mandalay; printed Yangon, Dept. of Religious Affairs","Burmese study guide to Kaccāyana, sutta by sutta","— (later than Ñ)","<span class=\"propio\"><a href=\"../analisis/\">Analysis of the Kaccāyana suttas (draft)<\/a><\/span><br>Not online; used by the IEBH for its «Análisis de los suttas»"]},{"id":"o47","nombre":"Sannayas cingaleses","es":["<b>Sannayas cingaleses<\/b>","Muchos","s. XIV en adelante","Sri Lanka","Glosas (p. ej., Kaccāyanasandhikappapadavigrahasannaya, Kaccāyanasūtrabhāvasannaya, Kaccāyanabhedasannaya de Jinavaṃsa Paññāsāra, s. XIX)","5.1.3; 5.4.13","No se halló texto en línea"],"en":["<b>Sinhala sannayas<\/b>","Many","14th c. onward","Sri Lanka","Glosses (e.g. Kaccāyanasandhikappapadavigrahasannaya, Kaccāyanasūtrabhāvasannaya, Kaccāyanabhedasannaya by Jinavaṃsa Paññāsāra, 19th c.)","5.1.3; 5.4.13","No online text located"]},{"id":"o48","nombre":"Obras tailandesas y de Lanna sobre el Mūlakaccāyana","es":["<b>Obras tailandesas y de Lanna sobre el Mūlakaccāyana<\/b>","Muchos (p. ej., Mūlakaccāyanagaṇṭhi de Mahādebakāvī)","—","Tailandia","Comentarios de currículo, yojanā y nissayas","5.1.1","No se halló texto en línea"],"en":["<b>Thai and Lanna works on the Mūlakaccāyana<\/b>","Many (e.g. Mūlakaccāyanagaṇṭhi by Mahādebakāvī)","—","Thailand","Curriculum commentaries, yojanā and nissayas","5.1.1","No online text located"]}]},{"id":"sec5","titulo":{"es":"Notas","en":"Notes"},"prosa":{"es":[{"t":"ol","html":"Las fechas son aproximadas (c. = circa; ? = dudoso). Donde las fuentes discrepan, se dan las alternativas principales. Fechas y atribuciones según Bode, el Dictionary of Pāli Proper Names, von Hinüber, Pind, Ruiz-Falqués y Ñāṇatusita."},{"t":"ol","html":"<b>Nyāsappadīpa y Saṃpyaṅ-ṭīkā.<\/b> La versión anterior de esta tabla trataba el Nyāsappadīpa, la Saṃpyaṅ-ṭīkā y la Thanbyin-ṭīkā como una sola obra. Ñāṇatusita registra el Nyāsappadīpa (Thanbyin, por encargo de Narapatisithu) en 5.1.11 y, aparte, una «Mukhamattadīpanī-purāṇaṭīkā, Saṃpyaṅ-ṭīkā» en 5.1.112. La cuestión sigue abierta; aquí se mantienen en dos filas hasta cotejar las ediciones impresas (1913, 1925)."},{"t":"ol","html":"<b>Saddabindu.<\/b> Ñāṇatusita, siguiendo a Lottermoser (JPTS XI, 1987), lo atribuye a Rājaguru Nārada (1481) y dice expresamente que «no es del rey Kyaswa». La atribución tradicional a Kyaswa se mantiene como alternativa."},{"t":"ol","html":"<b>Kaccāyanasāra y sus ṭīkās.<\/b> Ñāṇatusita fecha el Kaccāyanasāra en los s. XIV–XV, pero sus dos ṭīkās de Siri Saddhammavilāsa en el s. XIII, y las dos cosas no pueden ser ciertas a la vez. Se dan las fechas de las ṭīkās tal como él las trae; hay que comprobarlas."},{"t":"ol","html":"Los enlaces a GRETIL se comprobaron con una copia del árbol de archivos de GRETIL en octubre de 2026. GRETIL se está trasladando al repositorio TextGrid; si un enlace falla, la misma ruta existe en el repositorio INDOLOGY/GRETIL-mirror de GitHub, y todo el corpus pāḷi está en <a href=\"https://gretil.sub.uni-goettingen.de/gretil/2_pali.zip\" rel=\"noopener\" target=\"_blank\">https://gretil.sub.uni-goettingen.de/gretil/2_pali.zip<\/a>."},{"t":"ol","html":"«No se halló texto en línea» significa que la búsqueda anterior no encontró texto electrónico ni escaneo gratuito. «Sin buscar» marca las filas añadidas en esta revisión, para las que no se hizo búsqueda. Las ediciones birmanas impresas pueden estar digitalizadas con títulos en escritura birmana."}],"en":[{"t":"ol","html":"Dates are approximate (c. = circa; ? = doubtful). Where sources disagree, the main alternatives are given. Dates and attributions follow Bode, the Dictionary of Pāli Proper Names, von Hinüber, Pind, Ruiz-Falqués and Ñāṇatusita."},{"t":"ol","html":"<b>Nyāsappadīpa and Saṃpyaṅ-ṭīkā.<\/b> The earlier version of this chart treated the Nyāsappadīpa, the Saṃpyaṅ-ṭīkā and the Thanbyin-ṭīkā as one work. Ñāṇatusita lists the Nyāsappadīpa (Thanbyin, commissioned by Narapatisithu) under 5.1.11 and a separate «Mukhamattadīpanī-purāṇaṭīkā, Saṃpyaṅ-ṭīkā» under 5.1.112. The question is open; the two rows are kept separate here until the printed editions (1913, 1925) are compared."},{"t":"ol","html":"<b>Saddabindu.<\/b> Ñāṇatusita, following Lottermoser (JPTS XI, 1987), ascribes it to Rājaguru Nārada (1481) and states explicitly that it is «not by King Kyaswa». The traditional ascription to Kyaswa is kept as an alternative."},{"t":"ol","html":"<b>Kaccāyanasāra and its ṭīkās.<\/b> Ñāṇatusita dates the Kaccāyanasāra to the 14th–15th c. but its two ṭīkās by Siri Saddhammavilāsa to the 13th c., which cannot both be right. The dates of the ṭīkās are given as he has them; they need checking."},{"t":"ol","html":"GRETIL links were verified against a snapshot of GRETIL's file tree in October 2026. GRETIL is migrating to the TextGrid repository; if a link fails, the same path exists in the INDOLOGY/GRETIL-mirror repository on GitHub, and the whole Pāli corpus is at <a href=\"https://gretil.sub.uni-goettingen.de/gretil/2_pali.zip\" rel=\"noopener\" target=\"_blank\">https://gretil.sub.uni-goettingen.de/gretil/2_pali.zip<\/a>."},{"t":"ol","html":"«No online text located» means no free e-text or scan was found in the earlier search. «Not checked» marks rows added in this revision, for which no search was made. Burmese printed editions may be digitized under Burmese-script titles."}]}},{"id":"sec6","titulo":{"es":"Cambios en esta revisión (según Ñāṇatusita)","en":"Changes in this revision (from Ñāṇatusita)"},"prosa":{"es":[{"t":"ul","html":"<b>Corregido:<\/b> la «Saddhammanāsinī» no es una ṭīkā aparte sobre Kaccāyana: Ñāṇatusita la da como otro nombre de la Sammohavināsinī, la ṭīkā nueva sobre el Kaccāyanasāra (filas fusionadas). Dhātumañjūsā: Sri Lanka, s. XIV (antes «fecha incierta»). Kaccāyanavaṇṇanā: 1626/1627. Sāratthavikāsinī: Ariyālaṅkāra II, Sagaing, 1606. Niruttisāramañjūsā: Sagaing, mediados del s. XVII."},{"t":"ul","html":"<b>Alternativas añadidas:<\/b> fecha del Nyāsa (s. XI–XII); autor y fecha del Saddabindu; autor del Vibhattyattha; autor de la Abhinavacūḷanirutti; el Suttaniddesa marcado como cingalés; el Nyāsappadīpa encargado por Narapatisithu."},{"t":"ul","html":"<b>Filas añadidas:<\/b> Atthavyākhyāna; Kaccāyananissaya; Mukhamattadīpanī-purāṇaṭīkā; Mukhamattasāraṭīkā; Rūpasiddhi-sannaya y Sandehavighātinī; Kaccāyanarūpadīpanī; ṭīkās del Bālāvatāra (Uttama; Subodhikā); Kaccāyanabheda-mahāṭīkā (autor: Uttamasikkha, 1669; ya no «desconocido»); Kaccāyanasāraṭīkā y purāṇaṭīkā; Kārikāṭīkā; Etimāsamidīpikā; filas propias para las ṭīkās de la Saddatthabhedacintā, la Sambandhacintā y el Saddabindu; Mahānirutti, Niruttipiṭaka, Niruttimañjūsā; Kaccāyanavaṇṇanācakkakyan; la Visuddhāyuṃ (2004)."},{"t":"ul","html":"<b>Columna nueva «Ñ»<\/b>, con el número de sección de Ñāṇatusita, para poder comprobar cada fila."}],"en":[{"t":"ul","html":"<b>Corrected:<\/b> «Saddhammanāsinī» is not a separate ṭīkā on Kaccāyana: Ñāṇatusita gives it as another name of the Sammohavināsinī, the new ṭīkā on the Kaccāyanasāra (row merged). Dhātumañjūsā: Sri Lanka, 14th c. (was «date uncertain»). Kaccāyanavaṇṇanā: 1626/1627. Sāratthavikāsinī: Ariyālaṅkāra II, Sagaing, 1606. Niruttisāramañjūsā: Sagaing, mid 17th c."},{"t":"ul","html":"<b>Alternatives added:<\/b> Nyāsa date (11th–12th c.); Saddabindu author and date; Vibhattyattha author; Abhinavacūḷanirutti author; Suttaniddesa coded as Sri Lankan; Nyāsappadīpa commissioned by Narapatisithu."},{"t":"ul","html":"<b>Rows added:<\/b> Atthavyākhyāna; Kaccāyananissaya; Mukhamattadīpanī-purāṇaṭīkā; Mukhamattasāraṭīkā; Rūpasiddhi-sannaya and Sandehavighātinī; Kaccāyanarūpadīpanī; Bālāvatāra ṭīkās (Uttama; Subodhikā); Kaccāyanabheda-mahāṭīkā (author: Uttamasikkha, 1669, so no longer «unknown»); Kaccāyanasāraṭīkā and purāṇaṭīkā; Kārikāṭīkā; Etimāsamidīpikā; separate rows for the Saddatthabhedacintā, Sambandhacintā and Saddabindu ṭīkās; Mahānirutti, Niruttipiṭaka, Niruttimañjūsā; Kaccāyanavaṇṇanācakkakyan; the Visuddhāyuṃ (2004)."},{"t":"ul","html":"<b>New column «Ñ»<\/b> with Ñāṇatusita's section number, so each row can be checked."}]}},{"id":"sec7","titulo":{"es":"Cobertura: omisiones conocidas y cuestiones abiertas","en":"Completeness: known omissions and open questions"},"prosa":{"es":[{"t":"p","html":"Esta tabla recoge las obras principales de la escuela de Kaccāyana, pero no es un inventario completo."},{"t":"p","html":"<b>Por añadir o comprobar.<\/b> La Kaccāyanatthadīpanī, comentario tailandés sobre el Mūlakaccāyana, no aparece en las páginas de Ñāṇatusita leídas para esta revisión; irá en la sección D cuando se confirme su fuente. Ñāṇatusita registra además en 5.1 muchos títulos menores de los que solo se conoce el nombre (p. ej., Kaccāyana-aṭṭhakathā, Kaccāyana-atthavinicchaya, Pabhedapakaraṇa, Suttāvali, Padamālā, Kaccāyanasandhivisodhanī-ṭīkā, Sammohavighātanī sobre el Sandhikappa); se dejan fuera mientras no se sepa más de ellos."},{"t":"p","html":"<b>Obras que podrían entrar, según dónde se trace el límite de la escuela.<\/b> Ñāṇatusita agrupa varios tratados birmanos menores junto a los compendios de Kaccāyana (su 5.4, «14 textos menores»): el Saddavutti de Saddhammapāla con sus ṭīkās y el Saddavuttivivaraṇa; la Sambandhamālinī de Saddhammālaṅkāra (anterior a 1442); el Vācavācaka de Dhammadassī (s. XIV) y sus ṭīkās; el Gandhābhāraṇa de Ariyavaṃsa (1436–7); el Gandhaṭṭhi; el Bālappabodhana; el Niruttibheda; y tratados breves sobre las letras (Akkharakosalla, Akkharabheda, Akkharavisodhanī). Podrán añadirse cuando se confirme que cada uno se basa en Kaccāyana. El Liṅgatthavivaraṇa de Subhūticandana y la Saṃvaṇṇanānayadīpanī de Jambudhaja (Dictionary of Pāli Proper Names) siguen abiertos, como antes."},{"t":"p","html":"<b>Áreas no cubiertas.<\/b> La literatura vernácula —nissayas birmanos y yojanā tailandesas y de Lanna— abarca decenas de obras y aquí tiene una sola fila por tradición. Además de Ñāṇatusita, las mejores fuentes para completar la lista son el estudio de O. H. Pind sobre la gramática y los gramáticos pāḷi (JPTS XXXI, 2012) y la tesis doctoral de A. Ruiz-Falqués sobre el Suttaniddesa (Cambridge, 2016)."}],"en":[{"t":"p","html":"This chart covers the main works of the Kaccāyana school but is not a complete inventory."},{"t":"p","html":"<b>Still to add or check.<\/b> The Kaccāyanatthadīpanī, a Thai commentary on the Mūlakaccāyana, was not found in the pages of Ñāṇatusita read for this revision; it belongs in section D once its source is confirmed. Ñāṇatusita also lists many minor titles under 5.1 that are only names (e.g. Kaccāyana-aṭṭhakathā, Kaccāyana-atthavinicchaya, Pabhedapakaraṇa, Suttāvali, Padamālā, Kaccāyanasandhivisodhanī-ṭīkā, Sammohavighātanī on the Sandhikappa); they are left out unless more is known about them."},{"t":"p","html":"<b>Works that may belong, depending on where the boundary of the school is drawn.<\/b> Ñāṇatusita groups a number of minor Burmese treatises together with the Kaccāyana digests (his 5.4, «14 minor texts»): the Saddavutti of Saddhammapāla with its ṭīkās and the Saddavuttivivaraṇa; the Sambandhamālinī of Saddhammālaṅkāra (before 1442); the Vācavācaka of Dhammadassī (14th c.) and its ṭīkās; the Gandhābhāraṇa of Ariyavaṃsa (1436–7); the Gandhaṭṭhi; the Bālappabodhana; the Niruttibheda; and short treatises on letters (Akkharakosalla, Akkharabheda, Akkharavisodhanī). They could be added once it is confirmed that each is built on Kaccāyana. The Liṅgatthavivaraṇa of Subhūticandana and the Saṃvaṇṇanānayadīpanī of Jambudhaja (Dictionary of Pāli Proper Names) remain open as before."},{"t":"p","html":"<b>Areas not covered.<\/b> The vernacular literature — Burmese nissayas and Thai and Lanna yojanā — runs to dozens of works and is represented here by one row per tradition. Besides Ñāṇatusita, the best sources for completing the list are O. H. Pind's survey of Pāli grammar and grammarians (JPTS XXXI, 2012) and A. Ruiz-Falqués's Cambridge doctoral thesis on the Suttaniddesa (2016)."}]}}],"terminos":[{"clave":"kariyi","termino":"kāriyī (kārī)","formas":["kāriyī","kārī"],"def":{"es":"Aquello a lo que se realiza cierto tipo de operación gramatical.","en":"That on which a certain kind of grammatical operation is performed."},"ejemplo":{"n":12,"cap":"sandhi","nota":{"es":"«sarā» es el kāriyī.","en":"“sarā” is the kāriyī."},"sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"kariya","termino":"kāriya","formas":["kāriya"],"def":{"es":"La operación gramatical que hay que realizar.","en":"The grammatical operation to be performed."},"ejemplo":{"n":12,"cap":"sandhi","nota":{"es":"«lopaṃ» es el kāriya.","en":"“lopaṃ” is the kāriya."},"sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"nimitta","termino":"nimitta","formas":["nimitta"],"def":{"es":"Lit. signo; causa, razón. Hay dos clases: en la séptima inflexión (sattamī-nimitta) y en la quinta (pañcamī-nimitta).","en":"Lit. sign; cause, reason. There are two kinds: in the seventh inflection (sattamī-nimitta) and in the fifth (pañcamī-nimitta)."},"ejemplo":{"n":12,"cap":"sandhi","nota":{"es":"«sare» es nimitta en la 7.ª.","en":"“sare” is a nimitta in the 7th."},"sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"pancami","termino":"pañcamī-nimitta","formas":["pañcamī-nimitta"],"def":{"es":"Causa expresada en la quinta inflexión («después de…»).","en":"Cause expressed in the fifth inflection (“after…”)."},"ejemplo":{"n":13,"cap":"sandhi","nota":{"es":"«asarūpā».","en":"“asarūpā”."},"sutta":"Vā paro asarūpā","tr":{"es":"Opcionalmente, [se elide] la [vocal] siguiente después de [una vocal] disímil.","en":"Optionally, the following [vowel is elided] after a dissimilar [vowel]."}}},{"clave":"sannaroles","termino":"saññā / saññī","formas":["saññī"],"def":{"es":"En los suttas de definición, el nombre técnico (saññā) y lo que recibe ese nombre (saññī).","en":"In defining suttas, the technical name (saññā) and what bears that name (saññī)."},"ejemplo":{"n":4,"cap":"sandhi","nota":{"es":"«rassā» = saññā; «sarā» (anuvatti) = saññī.","en":"“rassā” = saññā; “sarā” (anuvatti) = saññī."},"sutta":"Lahumattā tayo rassā","tr":{"es":"Las tres [vocales] de medida leve son cortas.","en":"The three light-measured [vowels] are short."}}},{"clave":"visaya","termino":"visaya / visayī","formas":["visayī","visaya"],"def":{"es":"visaya: el lugar donde se introduce el elemento; visayī: el elemento introducido allí (cf. §42: visaya «ante [puthassa]», visayī «go»). Visuddhāyuṃ usa estos términos en los suttas de inserción (āgama) y de duplicación.","en":"visaya: the place where the element is introduced; visayī: the element introduced there (cf. §42: visaya “ante [puthassa]”, visayī “go”). Visuddhāyuṃ uses these terms in suttas of insertion (āgama) and doubling."},"ejemplo":{"n":42,"cap":"sandhi","nota":{"es":"visaya «ante [puthassa]», visayī «go».","en":"visaya “ante [puthassa]”, visayī “go”."},"sutta":"Go sare puthass’ āgamo kvaci","tr":{"es":"A veces, inserción de ‘g’ [al final] de “putha”, cuando una vocal sigue.","en":"Sometimes, insertion of ‘g’ [at the end] of “putha”, when a vowel follows."}}},{"clave":"visesana","termino":"visesana","formas":["visesana"],"def":{"es":"Calificador de una de las palabras anteriores (kāriyī, kāriya, nimitta, saññā…).","en":"Qualifier of one of the words above (kāriyī, kāriya, nimitta, saññā…)."},"ejemplo":{"n":13,"cap":"sandhi","nota":{"es":"«paro» califica al kāriyī «saro».","en":"“paro” qualifies the kāriyī “saro”."},"sutta":"Vā paro asarūpā","tr":{"es":"Opcionalmente, [se elide] la [vocal] siguiente después de [una vocal] disímil.","en":"Optionally, the following [vowel is elided] after a dissimilar [vowel]."}}},{"clave":"anuvatti","termino":"anuvatti","formas":["anuvatti"],"def":{"es":"Palabra que se trae de suttas anteriores para completar el sutta; Visuddhāyuṃ la llama aṅga.","en":"A word carried over from earlier suttas to complete the sutta; Visuddhāyuṃ calls it aṅga."},"ejemplo":{"n":14,"cap":"sandhi","nota":{"es":"anuvatti «sare», «paro saro».","en":"anuvatti “sare”, “paro saro”."},"sutta":"Kvac’ āsavaṇṇaṃ lutte","tr":{"es":"A veces, cuando [la vocal anterior] ha sido elidida [la vocal siguiente se vuelve] disímil.","en":"Sometimes, when [the previous vowel has been] elided, [the following vowel becomes] dissimilar."}}},{"clave":"sanna","termino":"saññā","formas":["saññā"],"def":{"es":"Aforismo que explica el significado de un término técnico.","en":"Aphorism that names a technical term."},"ejemplo":{"n":2,"cap":"sandhi","sutta":"Akkharā p’ ādayo ekacattālīsaṃ","tr":{"es":"Las letras son cuarenta y una, comenzando con ‘a’.","en":"Letters are forty-one beginning with ‘a’."}}},{"clave":"adhikara","termino":"adhikāra","formas":["adhikāra"],"def":{"es":"Aforismo regulativo.","en":"Governing aphorism."},"ejemplo":{"n":52,"cap":"nama","sutta":"Jinavacanayuttaṃ hi","tr":{"es":"Conforme a la palabra del Victorioso.","en":"Conforming to the Word of the Victorious One."}}},{"clave":"paribhasa","termino":"paribhāsā","formas":["paribhāsā"],"def":{"es":"Aforismo general que explica la correcta interpretación o aplicación de otras reglas.","en":"Interpretive aphorism, on how other rules are read or applied."},"ejemplo":{"n":10,"cap":"sandhi","sutta":"Pubbam adhoṭhitam assaraṃ sarena viyojaye","tr":{"es":"Se debería separar de la vocal a la [consonante] anterior, que yace debajo, desprovista de vocal.","en":"One should separate the previous vowelless [consonant] that lies below from the vowel."}}},{"clave":"vidhi","termino":"vidhi","formas":["vidhi"],"def":{"es":"Aforismo con instrucciones gramaticales.","en":"Operational aphorism."},"ejemplo":{"n":12,"cap":"sandhi","sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"ananga","termino":"anaṅga-paribhāsā","formas":["anaṅga-paribhāsā","anaṅga"],"def":{"es":"Paribhāsā que no forma parte ni de un término técnico ni de una operación; enunciado general para toda la gramática.","en":"A paribhāsā that is part of neither a technical term nor an operation; a general statement for the whole grammar."},"ejemplo":{"n":1,"cap":"sandhi","sutta":"Attho akkharasaññāto","tr":{"es":"El significado se conoce por las letras.","en":"The meaning is known by letters."}}},{"clave":"sannanga","termino":"saññaṅga-paribhāsā","formas":["saññaṅga-paribhāsā","saññaṅga"],"def":{"es":"Paribhāsā que forma parte de un término técnico (saññā): indica cómo entender los nombres técnicos.","en":"A paribhāsā that is part of a technical term (saññā): it tells how the technical names are to be taken."},"ejemplo":{"n":9,"cap":"sandhi","sutta":"Parasamaññā payoge","tr":{"es":"En caso de necesidad, [se usan] los términos de otros.","en":"In need, [are used] the terms of others."}}},{"clave":"vidhyanga","termino":"vidhyaṅga-paribhāsā","formas":["vidhyaṅga-paribhāsā","vidhyaṅga"],"def":{"es":"Paribhāsā que forma parte de una operación (vidhi): indica cómo realizar las operaciones.","en":"A paribhāsā that is part of an operation (vidhi): it tells how operations are to be carried out."},"ejemplo":{"n":10,"cap":"sandhi","sutta":"Pubbam adhoṭhitam assaraṃ sarena viyojaye","tr":{"es":"Se debería separar de la vocal a la [consonante] anterior, que yace debajo, desprovista de vocal.","en":"One should separate the previous vowelless [consonant] that lies below from the vowel."}}},{"clave":"niyama","termino":"niyama","formas":["niyama-sutta","niyama"],"def":{"es":"Regla que restringe o fija una operación que otro sutta ya permitía.","en":"A rule that restricts or fixes an operation another sutta already allowed."},"ejemplo":{"n":29,"cap":"sandhi","sutta":"Vagge ghosāghosānaṃ tatiya-paṭhamā","tr":{"es":"En las agrupadas, la primera y la tercera, de las sordas y sonoras.","en":"In the grouped, the first and third of the voiceless and voiced."}}},{"clave":"apavada","termino":"apavāda","formas":["apavāda"],"def":{"es":"Regla de excepción: desplaza a una regla general en su propio ámbito.","en":"Exception rule: it displaces a general rule within its own domain."},"ejemplo":{"n":13,"cap":"sandhi","nota":{"es":"apavāda del §12.","en":"apavāda of §12."},"sutta":"Vā paro asarūpā","tr":{"es":"Opcionalmente, [se elide] la [vocal] siguiente después de [una vocal] disímil.","en":"Optionally, the following [vowel is elided] after a dissimilar [vowel]."}}},{"clave":"pakati","termino":"pakati","formas":["pakati"],"def":{"es":"Conservación de la forma natural: la letra queda sin cambio. El sitio cuenta la pakati en la ādesa según Thitzana, salvo §24 y §30, clasificados paṭisedha según Visuddhāyuṃ.","en":"Keeping the natural form: the letter stays unchanged. The site counts pakati under ādesa following Thitzana, except §24 and §30, classified paṭisedha following Visuddhāyuṃ."},"ejemplo":{"n":23,"cap":"sandhi","sutta":"Sarā pakati byañjane","tr":{"es":"Cuando una consonante sigue, [las vocales mantienen su forma] original.","en":"When a consonant follows, [vowels keep their] original [form]."}}},{"clave":"lopa","termino":"lopa","formas":["lopa"],"def":{"es":"Elisión: una letra desaparece.","en":"Elision: a letter disappears."},"ejemplo":{"n":12,"cap":"sandhi","sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"digha","termino":"dīgha","formas":["dīgha"],"def":{"es":"Alargamiento: una vocal breve se hace larga.","en":"Lengthening: a short vowel becomes long."},"ejemplo":{"n":15,"cap":"sandhi","sutta":"Dīghaṃ","tr":{"es":"Larga.","en":"Long."}}},{"clave":"rassa","termino":"rassa","formas":["rassa"],"def":{"es":"Acortamiento: una vocal larga se hace breve.","en":"Shortening: a long vowel becomes short."},"ejemplo":{"n":26,"cap":"sandhi","sutta":"Rassaṃ","tr":{"es":"Corta.","en":"Short."}}},{"clave":"adesa","termino":"ādesa","formas":["ādesa"],"def":{"es":"Sustitución: una letra o palabra ocupa el lugar de otra. Según Thitzana incluye también vuddhi, vipariyāya, pakati, atidesa, etc., salvo donde Visuddhāyuṃ clasifica de otro modo (véanse paṭisedha, atidesa, liṅga-vacana).","en":"Substitution: a letter or word takes the place of another. According to Thitzana it also includes vuddhi, vipariyāya, pakati, atidesa, etc., except where Visuddhāyuṃ classifies otherwise (see paṭisedha, atidesa, liṅga-vacana)."},"ejemplo":{"n":17,"cap":"sandhi","sutta":"Yam edantass’ ādeso","tr":{"es":"‘Y’ [es] la sustitución de la ‘e’ final.","en":"‘Y’ [is] the substitution of the end ‘e’."}}},{"clave":"agama","termino":"āgama","formas":["āgama"],"def":{"es":"Inserción: se añade una letra que no estaba.","en":"Insertion: a letter that was not there is added."},"ejemplo":{"n":35,"cap":"sandhi","sutta":"Ya-va-ma-da-na-ta-ra-lā c’ āgamā","tr":{"es":"Y las inserciones ‘y’, ‘v’, ‘m’, ‘d’, ‘n’, ‘t’, ‘r’ y ‘l’.","en":"And the insertions ‘y’, ‘v’, ‘m’, ‘d’, ‘n’, ‘t’, ‘r’, and ‘l’."}}},{"clave":"patisedha","termino":"paṭisedha","formas":["paṭisedha"],"def":{"es":"Interdicción: impide que se aplique otra regla.","en":"Prohibition: it prevents another rule from applying."},"ejemplo":{"n":46,"cap":"sandhi","sutta":"Te na vā ivaṇṇe","tr":{"es":"Opcionalmente, cuando ‘i’ e ‘ī’ siguen, estos no [se aplican].","en":"Optionally, when ‘i’ and ‘ī’ follow, they are not [applied]."}}},{"clave":"paccaya","termino":"paccaya","formas":["paccaya"],"def":{"es":"Sufijo: se añade un sufijo a la base o a la raíz.","en":"Suffix: a suffix is added to the base or the root."},"ejemplo":{"n":237,"cap":"nama","sutta":"Itthiyam ato āpaccayo","tr":{"es":"En el femenino, tras ‘a’, [hay] el sufijo ‘ā’.","en":"In the feminine, after ‘a’, [there is] the suffix ‘ā’."}}},{"clave":"vibhatti","termino":"vibhatti","formas":["vibhatti"],"def":{"es":"Inflexión: se añade una terminación de caso a la base.","en":"Inflection: a case ending is added to the base."},"ejemplo":{"n":284,"cap":"karaka","sutta":"Liṅgatthe paṭhamā","tr":{"es":"En el significado de la base, la primera [inflexión].","en":"In the meaning of the base, the first [inflection]."}}},{"clave":"atidesa","termino":"atidesa","formas":["pumbhāvātidesa","rūpātidesa","suttātidesa","kāriyātidesa","atidesa"],"def":{"es":"Extensión: regla que extiende la operación o el nombre de una cosa a otra («trátese X como Y»). El §51 es un suttātidesa: los suttas ya enunciados se extienden a las formas no mostradas.","en":"Extension: a rule that extends the operation or name of one thing to another (“treat X as Y”). §51 is a suttātidesa: the suttas already stated extend to the forms not shown."},"ejemplo":{"n":51,"cap":"sandhi","sutta":"Anupadiṭṭhānaṃ vuttayogato","tr":{"es":"De los no mostrados, según las reglas mencionadas.","en":"Of those that have not been shown, formation according to the mentioned."}}},{"clave":"linga","termino":"liṅga-vacana","formas":["liṅga-vacana"],"def":{"es":"Género y número (liṅga = género, vacana = número): regla que fija el género y el número, p. ej. de un compuesto. Clase propia según Visuddhāyuṃ, fuera de las ocho.","en":"Gender and number (liṅga = gender, vacana = number): a rule that fixes gender and number, e.g. of a compound. A class of its own according to Visuddhāyuṃ, outside the eight."},"ejemplo":{"n":320,"cap":"samasa","sutta":"So napuṃsakaliṅgo","tr":{"es":"Éste tiene el género neutro.","en":"It has the neuter gender."}}},{"clave":"anvattha","termino":"anvattha-saññā","formas":["anvattha-saññā","anvatthasaññā"],"def":{"es":"Término técnico cuyo nombre corresponde a su significado: además de servir de rótulo, muestra la naturaleza de lo que nombra.","en":"A technical name that follows its meaning: besides serving as a label, it shows the nature of what it names."},"ejemplo":{"n":2,"cap":"sandhi","nota":{"es":"«akkhara»: «na kkharantī ti akkharā».","en":"“akkhara”: “na kkharantī ti akkharā”."},"sutta":"Akkharā p’ ādayo ekacattālīsaṃ","tr":{"es":"Las letras son cuarenta y una, comenzando con ‘a’.","en":"Letters are forty-one beginning with ‘a’."}}},{"clave":"rulhi","termino":"rūḷhī-saññā","formas":["rūḷhī-saññā","rūḷhīsaññā"],"def":{"es":"Término técnico convencional, que solo facilita la referencia.","en":"A conventional technical name that only makes reference easy."},"ejemplo":{"n":60,"cap":"nama","nota":{"es":"«gha», nombre de ā: una sola letra.","en":"“gha”, the name of ā: a single letter."},"sutta":"Ā gho","tr":{"es":"‘Ā’ [recibe el nombre de] ‘gha’.","en":"‘Ā’ [is named] ‘gha’."}}},{"clave":"sutta","termino":"sutta","formas":["sutta","suttas"],"def":{"es":"Aforismo; regla gramatical. Hay 4 clases: saññā-sutta, paribhāsā-sutta, adhikāra-sutta y vidhi-sutta.","en":"Aphorism; grammatical rule. There are four kinds: saññā-, paribhāsā-, adhikāra- and vidhi-sutta."},"ejemplo":{"n":12,"cap":"sandhi","nota":{"es":"un vidhi-sutta.","en":"a vidhi-sutta."},"sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"vutti","termino":"vutti","formas":["vutti"],"def":{"es":"Explicación (del sutta). Hay tres clases: la palabra del aforismo (sutta-vutti), la que viene de aforismos anteriores (anuvattana-vutti) y la palabra insertada (pakkhipana-vutti).","en":"Explanation (of a sutta). Three kinds: the aphorism's own words (sutta-vutti), words carried over from earlier aphorisms (anuvattana-vutti) and inserted words (pakkhipana-vutti)."},"ejemplo":{"n":2,"cap":"sandhi","nota":{"es":"su vutti pregunta «tena kvattho?».","en":"its vutti asks “tena kvattho?”."},"sutta":"Akkharā p’ ādayo ekacattālīsaṃ","tr":{"es":"Las letras son cuarenta y una, comenzando con ‘a’.","en":"Letters are forty-one beginning with ‘a’."}}},{"clave":"anga","termino":"aṅga","formas":["aṅga"],"def":{"es":"Miembro, parte. Visuddhāyuṃ abre la explicación (ခ) de cada sutta con la lista «aṅga N»: las palabras que cuenta como aṅga del sutta, sean del propio sutta o traídas de suttas anteriores (anuvatti). La columna «Aṅga» de la tabla copia esa lista tal como la da el libro.","en":"Member, part. Visuddhāyuṃ opens the explanation (ခ) of each sutta with the list «aṅga N»: the words it counts as the sutta's aṅga, whether from the sutta itself or carried over from earlier suttas (anuvatti). The table's «Aṅga» column copies that list as the book gives it."},"ejemplo":{"n":14,"cap":"sandhi","sutta":"Kvac’ āsavaṇṇaṃ lutte","tr":{"es":"A veces, cuando [la vocal anterior] ha sido elidida [la vocal siguiente se vuelve] disímil.","en":"Sometimes, when [the previous vowel has been] elided, [the following vowel becomes] dissimilar."}}},{"clave":"kappa","termino":"kappa","formas":["kappa"],"def":{"es":"Capítulo de Kaccāyana (Sandhi-Kappa, Nāma-Kappa…).","en":"A chapter of Kaccāyana (Sandhi-Kappa, Nāma-Kappa…)."},"ejemplo":{"n":1,"cap":"sandhi","nota":{"es":"abre el Sandhi-Kappa.","en":"opens the Sandhi-Kappa."},"sutta":"Attho akkharasaññāto","tr":{"es":"El significado se conoce por las letras.","en":"The meaning is known by letters."}}},{"clave":"kanda","termino":"kaṇḍa","formas":["kaṇḍa"],"def":{"es":"Sección: cada una de las partes en que se divide un capítulo de Kaccāyana (Paṭhama-kaṇḍa…); en Rūpasiddhi, cada una de sus grandes partes (Sandhi-kaṇḍa, Nāma-kaṇḍa…).","en":"Section: each part of a Kaccāyana chapter (Paṭhama-kaṇḍa…); in Rūpasiddhi, each of its main parts (Sandhi-kaṇḍa, Nāma-kaṇḍa…)."},"ejemplo":{"n":12,"cap":"sandhi","nota":{"es":"abre el Dutiya-kaṇḍa.","en":"opens the Dutiya-kaṇḍa."},"sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"pariccheda","termino":"pariccheda","formas":["pariccheda"],"def":{"es":"Sección (lit. delimitación). Visuddhāyuṃ divide así cada capítulo y marca el fin de cada una.","en":"Section (lit. delimitation). Visuddhāyuṃ divides each chapter this way and marks the end of each."},"ejemplo":{"n":11,"cap":"sandhi","nota":{"es":"cierra el primero.","en":"closes the first."},"sutta":"Naye paraṃ yutte","tr":{"es":"Cuando sea apropiado, se debería trasladar [la consonante] a la [letra] siguiente.","en":"When appropriate, one should carry [the consonant] to the following [letter]."}}},{"clave":"sihagatika","termino":"sīhagatika","formas":["sīhagatika","sīha-gatika"],"def":{"es":"Yendo o moviéndose como león. Un tipo de regla general (adhikāra) cuyo dominio se extiende hacia atrás y hacia adelante.","en":"Going or moving like a lion. A kind of general rule (adhikāra) whose domain extends both backward and forward."},"ejemplo":{"n":52,"cap":"nama","sutta":"Jinavacanayuttaṃ hi","tr":{"es":"Conforme a la palabra del Victorioso.","en":"Conforming to the Word of the Victorious One."}}},{"clave":"niddittha","termino":"niddiṭṭhavisaya","formas":["niddiṭṭhavisaya"],"def":{"es":"De ámbito definido: saññā cuyo ámbito de aplicación queda fijado (Rū 308).","en":"Of defined scope: a saññā whose field of application is fixed (Rū 308)."},"ejemplo":{"n":271,"cap":"karaka","sutta":"Yasmād apeti bhayam ādatte vā tad apādānaṃ","tr":{"es":"Aquello de lo cual [uno] se aparta, [de lo que surge] peligro o temor, o de lo que toma: eso es “apādāna”.","en":"That from which [one] moves away, [from which] danger or fear [arises], or from which one takes: that is “apādāna”."}}},{"clave":"sattami_n","termino":"sattamī-nimitta","formas":["sattamī-nimitta"],"def":{"es":"Causa expresada en la séptima inflexión («cuando sigue…»).","en":"Cause expressed in the seventh inflection (“when … follows”)."},"ejemplo":{"n":12,"cap":"sandhi","nota":{"es":"«sare».","en":"“sare”."},"sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"pubbalopa","termino":"pubbalopa","formas":["pubbalopa"],"def":{"es":"Elisión de la (vocal) precedente.","en":"Elision of the preceding (vowel)."},"ejemplo":{"n":12,"cap":"sandhi","sutta":"Sarā sare lopaṃ","tr":{"es":"Las vocales se eliden cuando una vocal sigue.","en":"When a vowel follows, vowels [come to] elision."}}},{"clave":"paralopa","termino":"paralopa","formas":["paralopa"],"def":{"es":"Elisión de la (vocal) siguiente.","en":"Elision of the following (vowel)."},"ejemplo":{"n":13,"cap":"sandhi","sutta":"Vā paro asarūpā","tr":{"es":"Opcionalmente, [se elide] la [vocal] siguiente después de [una vocal] disímil.","en":"Optionally, the following [vowel is elided] after a dissimilar [vowel]."}}},{"clave":"vibhattipaccaya","termino":"vibhatti-paccaya","formas":["vibhatti-paccaya"],"def":{"es":"Sufijos que reciben el nombre de vibhatti (§247) porque expresan un significado casual; las formas que producen son padas.","en":"Suffixes named vibhatti (§247) because they express a case meaning; the forms they produce are padas."},"ejemplo":{"n":247,"cap":"nama","sutta":"Tvādayo vibhattisaññāyo","tr":{"es":"Los que comienzan con ‘to’ se llaman “inflexiones”.","en":"Those beginning with ‘to’ are named “inflections”."}}},{"clave":"laghava","termino":"lāghava","formas":["lāghava"],"def":{"es":"Economía, brevedad: razón para formular una regla de cierta manera.","en":"Economy, brevity: a reason for wording a rule in a certain way."},"ejemplo":{"n":44,"cap":"sandhi","sutta":"Abbho abhi","tr":{"es":"‘Abhi’, ‘abbh’.","en":"‘Abhi’, ‘abbh’."}}},{"clave":"bahulam","termino":"bahulaṃ","formas":["bahulaṃ","bahula"],"def":{"es":"«Ampliamente», según el uso: la regla se aplica de modo variable —a veces sí, a veces no, a veces de otra manera—.","en":"“Widely”, according to usage: the rule applies variably —sometimes it does, sometimes not, sometimes otherwise."},"ejemplo":{"n":46,"cap":"sandhi","sutta":"Te na vā ivaṇṇe","tr":{"es":"Opcionalmente, cuando ‘i’ e ‘ī’ siguen, estos no [se aplican].","en":"Optionally, when ‘i’ and ‘ī’ follow, they are not [applied]."}}},{"clave":"pubbavakya","termino":"pubbavākya","formas":["pubbavākya"],"def":{"es":"Enunciado inicial: nombre que, según Bhāsāṭīkā, dan algunos al §1 en lugar de paribhāsā.","en":"Opening statement: the name some give to §1 instead of paribhāsā, according to Bhāsāṭīkā."},"ejemplo":{"n":1,"cap":"sandhi","sutta":"Attho akkharasaññāto","tr":{"es":"El significado se conoce por las letras.","en":"The meaning is known by letters."}}},{"clave":"vuddhi","termino":"vuddhi","formas":["vuddhi"],"def":{"es":"Incremento; vocal fortalecida o que ha sido alargada. Thitzana la cuenta dentro de la ādesa.","en":"Strengthening; a vowel that has been strengthened or lengthened. Thitzana counts it under ādesa."},"ejemplo":{"n":404,"cap":"taddhita","nota":{"es":"Kaccāyana la nombra.","en":"Kaccāyana names it."},"sutta":"Tesu vuddhi-lopāgama-vikāra-viparītādesā ca","tr":{"es":"Y en esos [lugares hay] fortalecimiento, elisión, inserción, cambio, inversión y sustitución.","en":"And in those [places there are] strengthening, elision, insertion, change, reversal and substitution."}}},{"clave":"viparita","termino":"vipariyāya / viparīta","formas":["vipariyāya","viparīta"],"def":{"es":"Cambio, reversión; transposición (vipariyāya). Cambio; reversión; transformación (viparīta). Thitzana los equipara y los cuenta en la ādesa.","en":"Change, reversal; transposition (vipariyāya). Change; reversal; transformation (viparīta). Thitzana equates the two and counts them under ādesa."},"ejemplo":{"n":404,"cap":"taddhita","sutta":"Tesu vuddhi-lopāgama-vikāra-viparītādesā ca","tr":{"es":"Y en esos [lugares hay] fortalecimiento, elisión, inserción, cambio, inversión y sustitución.","en":"And in those [places there are] strengthening, elision, insertion, change, reversal and substitution."}}},{"clave":"vikara","termino":"vikāra","formas":["vikāra"],"def":{"es":"Cambio; alteración; modificación.","en":"Change; alteration; modification."},"ejemplo":{"n":404,"cap":"taddhita","sutta":"Tesu vuddhi-lopāgama-vikāra-viparītādesā ca","tr":{"es":"Y en esos [lugares hay] fortalecimiento, elisión, inserción, cambio, inversión y sustitución.","en":"And in those [places there are] strengthening, elision, insertion, change, reversal and substitution."}}},{"clave":"nipatana","termino":"nipātana","formas":["nipātana"],"def":{"es":"Formación por cita directa: la forma que ninguna regla explica se establece tal como se encuentra en el texto.","en":"Formation by direct citation: a form no rule accounts for is established as found in the text."},"ejemplo":{"n":391,"cap":"taddhita","sutta":"Yad anupapannā nipātanā sijjhanti","tr":{"es":"Esas [palabras] no mencionadas se realizan por medio de este [sutta].","en":"Those [words] not mentioned are accomplished by means of this [sutta]."}}},{"clave":"dvebhava","termino":"dvebhāva","formas":["dvebhāva","dvibhāva"],"def":{"es":"Lit., estado de dos; duplicación de una consonante cuando va precedida por una vocal o en otros casos.","en":"Lit. “state of two”; doubling of a consonant after a vowel or in other cases."},"ejemplo":{"n":28,"cap":"sandhi","sutta":"Para dvebhāvo ṭhāne","tr":{"es":"Duplicación de la siguiente en el lugar apropiado.","en":"Doubling of the following in the appropriate place."}}},{"clave":"akkhara","termino":"akkhara","formas":["akkhara"],"def":{"es":"Fonema; letra; sílaba. Hay 41 letras en el alfabeto pali.","en":"Phoneme; letter; syllable. There are 41 letters in the Pāḷi alphabet."},"ejemplo":{"n":2,"cap":"sandhi","sutta":"Akkharā p’ ādayo ekacattālīsaṃ","tr":{"es":"Las letras son cuarenta y una, comenzando con ‘a’.","en":"Letters are forty-one beginning with ‘a’."}}},{"clave":"vanna","termino":"vaṇṇa","formas":["vaṇṇa"],"def":{"es":"Letra; sonido; fonema; vocal. Avaṇṇa, las vocales a, ā; ivaṇṇa, i, ī; uvaṇṇa, u, ū.","en":"Letter; sound; phoneme; vowel. Avaṇṇa: a, ā; ivaṇṇa: i, ī; uvaṇṇa: u, ū."},"ejemplo":{"n":21,"cap":"sandhi","nota":{"es":"«ivaṇṇo».","en":"“ivaṇṇo”."},"sutta":"Ivaṇṇo yaṃ navā","tr":{"es":"Ocasionalmente, la letra ‘i’, [se vuelve] ‘y’.","en":"Occasionally, the letter ‘i’ [becomes] ‘y’."}}},{"clave":"sara","termino":"sara","formas":["sara"],"def":{"es":"Vocal. Hay 8 vocales: a, ā; i, ī; u, ū; e, o.","en":"Vowel. There are eight: a, ā; i, ī; u, ū; e, o."},"ejemplo":{"n":3,"cap":"sandhi","sutta":"Tatth’ odantā sarā aṭṭha","tr":{"es":"Entre ellas, las ocho [letras] terminadas en ‘o’ se denominan “vocales”.","en":"Among them, the eight [letters] ending in ‘o’ are called “vowels”."}}},{"clave":"byanjana","termino":"byañjana","formas":["byañjana"],"def":{"es":"Consonante. También vyañjana.","en":"Consonant. Also vyañjana."},"ejemplo":{"n":6,"cap":"sandhi","sutta":"Sesā byañjanā","tr":{"es":"Las restantes son consonantes.","en":"The remaining are consonants."}}},{"clave":"vagga","termino":"vagga","formas":["vagga"],"def":{"es":"Grupo; las consonantes agrupadas. Son 25, en cinco grupos.","en":"Group; the grouped consonants: 25, in five groups."},"ejemplo":{"n":7,"cap":"sandhi","sutta":"Vaggā pañcapañcaso mantā","tr":{"es":"Los [grupos] de cinco en cinco, son agrupadas.","en":"The [groups of] five by five, ending in ‘ma’, are grouped."}}},{"clave":"niggahita","termino":"niggahīta","formas":["niggahīta"],"def":{"es":"La consonante nasal ṃ.","en":"The nasal consonant ṃ."},"ejemplo":{"n":8,"cap":"sandhi","sutta":"Aṃ iti niggahitaṃ","tr":{"es":"‘Ṃ’ es niggahita.","en":"‘Ṃ’ is the niggahita."}}},{"clave":"anusvara","termino":"anusvāra","formas":["anusvāra"],"def":{"es":"Nombre sánscrito del niggahīta (ṃ).","en":"The Sanskrit name for niggahīta (ṃ)."},"ejemplo":{"n":8,"cap":"sandhi","sutta":"Aṃ iti niggahitaṃ","tr":{"es":"‘Ṃ’ es niggahita.","en":"‘Ṃ’ is the niggahita."}}},{"clave":"ghosa","termino":"ghosa","formas":["ghosa"],"def":{"es":"(Consonante) sonora. Hay 21 consonantes sonoras.","en":"Voiced (consonant). There are 21."},"ejemplo":{"n":29,"cap":"sandhi","nota":{"es":"«ghosāghosānaṃ».","en":"“ghosāghosānaṃ”."},"sutta":"Vagge ghosāghosānaṃ tatiya-paṭhamā","tr":{"es":"En las agrupadas, la primera y la tercera, de las sordas y sonoras.","en":"In the grouped, the first and third of the voiceless and voiced."}}},{"clave":"aghosa","termino":"aghosa","formas":["aghosa"],"def":{"es":"Sorda; (consonante) sorda. Hay once consonantes sordas.","en":"Voiceless; voiceless (consonant). There are eleven voiceless consonants."},"ejemplo":{"n":29,"cap":"sandhi","sutta":"Vagge ghosāghosānaṃ tatiya-paṭhamā","tr":{"es":"En las agrupadas, la primera y la tercera, de las sordas y sonoras.","en":"In the grouped, the first and third of the voiceless and voiced."}}},{"clave":"usma","termino":"ūsmā","formas":["ūsmā"],"def":{"es":"Nombre que la gramática sánscrita da a las consonantes fricativas (en pāḷi, s y h); Visuddhāyuṃ lo explica en el §9 entre los términos tomados de otras gramáticas.","en":"The Sanskrit grammarians' name for the fricative consonants (in Pāḷi, s and h); Visuddhāyuṃ explains it under §9 among the terms taken from other grammars."},"ejemplo":{"n":9,"cap":"sandhi","sutta":"Parasamaññā payoge","tr":{"es":"En caso de necesidad, [se usan] los términos de otros.","en":"In need, [are used] the terms of others."}}},{"clave":"matta","termino":"mattā","formas":["mattā"],"def":{"es":"Duración; unidad de medida; una mora o instante prosódico.","en":"Duration; unit of measure; a mora."},"ejemplo":{"n":4,"cap":"sandhi","nota":{"es":"«lahumattā».","en":"“lahumattā”."},"sutta":"Lahumattā tayo rassā","tr":{"es":"Las tres [vocales] de medida leve son cortas.","en":"The three light-measured [vowels] are short."}}},{"clave":"sarupa","termino":"sarūpa","formas":["sarūpa"],"def":{"es":"Semejante; opuesto a asarūpa, «disímil». Rū 11: las vocales savaṇṇa «se llaman también sarūpa». En las notas de §2 y §55, «la forma (propia)» de las letras o de las inflexiones (lectura de Bhāsāṭīkā).","en":"Similar; the opposite of asarūpa, “dissimilar”. Rū 11: savaṇṇa vowels “are also called sarūpa”. In the notes on §2 and §55, “the (very) form” of the letters or inflections (Bhāsāṭīkā's reading)."},"ejemplo":{"n":13,"cap":"sandhi","nota":{"es":"«asarūpā».","en":"“asarūpā”."},"sutta":"Vā paro asarūpā","tr":{"es":"Opcionalmente, [se elide] la [vocal] siguiente después de [una vocal] disímil.","en":"Optionally, the following [vowel is elided] after a dissimilar [vowel]."}}},{"clave":"kvaci","termino":"kvaci","formas":["kvaci"],"def":{"es":"«A veces»: aplicación poco frecuente; una sola forma resultante, sin alternativa.","en":"“Sometimes”: infrequent application; only one resulting form, no alternative."},"ejemplo":{"n":14,"cap":"sandhi","sutta":"Kvac’ āsavaṇṇaṃ lutte","tr":{"es":"A veces, cuando [la vocal anterior] ha sido elidida [la vocal siguiente se vuelve] disímil.","en":"Sometimes, when [the previous vowel has been] elided, [the following vowel becomes] dissimilar."}}},{"clave":"nava","termino":"navā","formas":["navā"],"def":{"es":"«Ocasionalmente»: sinónimo funcional de kvaci; también una sola forma resultante.","en":"“Occasionally”: functionally the same as kvaci; one resulting form."},"ejemplo":{"n":21,"cap":"sandhi","sutta":"Ivaṇṇo yaṃ navā","tr":{"es":"Ocasionalmente, la letra ‘i’, [se vuelve] ‘y’.","en":"Occasionally, the letter ‘i’ [becomes] ‘y’."}}},{"clave":"va","termino":"vā","formas":["vā"],"def":{"es":"«Opcionalmente»: dos formas posibles, con la aplicación y sin ella.","en":"“Optionally”: two possible forms, with and without the application."},"ejemplo":{"n":13,"cap":"sandhi","sutta":"Vā paro asarūpā","tr":{"es":"Opcionalmente, [se elide] la [vocal] siguiente después de [una vocal] disímil.","en":"Optionally, the following [vowel is elided] after a dissimilar [vowel]."}}},{"clave":"vibhasa","termino":"vibhāsā","formas":["vibhāsā"],"def":{"es":"«Facultativamente»: sinónimo funcional de vā; también dos formas.","en":"“Optionally” (vibhāsā): functionally the same as vā; two forms."},"ejemplo":{"n":154,"cap":"nama","sutta":"Samāse ca vibhāsā","tr":{"es":"Y facultativamente en un compuesto.","en":"And facultatively in a compound."}}},{"clave":"ca","termino":"ca","formas":["ca"],"def":{"es":"Partícula «y». En un sutta puede arrastrar palabras o añadir operaciones que el enunciado no nombra. Cinco funciones: arrastre (anukaḍḍhana), recolección (sampiṇḍana), acumulación (samuccaya), delimitación (avadhāraṇa) y fluidez del habla (vācāsiliṭṭha).","en":"The particle “and”. In a sutta it can drag words along or add operations the wording does not name. Five functions: dragging, collecting, accumulating, delimiting, smoothness of speech."},"ejemplo":{"n":20,"cap":"sandhi","sutta":"Do dhassa ca","tr":{"es":"Y, ‘da’ de ‘dha’.","en":"Also ‘da’ of ‘dha’."}}},{"clave":"pathama","termino":"paṭhamā","formas":["paṭhamā"],"def":{"es":"El primer caso; el caso nominativo (en este sitio, caso del sujeto).","en":"The first case; the nominative (case of the subject)."},"ejemplo":{"n":55,"cap":"nama","sutta":"Si yo, aṃ yo, nā hi, sa naṃ, smā hi, sa naṃ, smiṃ su","tr":{"es":"‘Si, yo’, ‘aṃ, yo’, ‘nā, hi’, ‘sa, naṃ’, ‘smā, hi’, ‘sa, naṃ’, ‘smiṃ, su’.","en":"‘Si, yo’, ‘aṃ, yo’, ‘nā, hi’, ‘sa, naṃ’, ‘smā, hi’, ‘sa, naṃ’, ‘smiṃ, su’."}}},{"clave":"pancami_i","termino":"pañcamī","formas":["pañcamī"],"def":{"es":"La quinta inflexión: caso del punto de partida (ablativo).","en":"The fifth inflection: case of the starting point (ablative)."},"ejemplo":{"n":55,"cap":"nama","sutta":"Si yo, aṃ yo, nā hi, sa naṃ, smā hi, sa naṃ, smiṃ su","tr":{"es":"‘Si, yo’, ‘aṃ, yo’, ‘nā, hi’, ‘sa, naṃ’, ‘smā, hi’, ‘sa, naṃ’, ‘smiṃ, su’.","en":"‘Si, yo’, ‘aṃ, yo’, ‘nā, hi’, ‘sa, naṃ’, ‘smā, hi’, ‘sa, naṃ’, ‘smiṃ, su’."}}},{"clave":"sattami_i","termino":"sattamī","formas":["sattamī"],"def":{"es":"La séptima inflexión: caso del lugar (locativo).","en":"The seventh inflection: case of the place (locative)."},"ejemplo":{"n":55,"cap":"nama","sutta":"Si yo, aṃ yo, nā hi, sa naṃ, smā hi, sa naṃ, smiṃ su","tr":{"es":"‘Si, yo’, ‘aṃ, yo’, ‘nā, hi’, ‘sa, naṃ’, ‘smā, hi’, ‘sa, naṃ’, ‘smiṃ, su’.","en":"‘Si, yo’, ‘aṃ, yo’, ‘nā, hi’, ‘sa, naṃ’, ‘smā, hi’, ‘sa, naṃ’, ‘smiṃ, su’."}}},{"clave":"linga_b","termino":"liṅga","formas":["liṅga"],"def":{"es":"Según el contexto: base, tema nominal (lo que tiene significado, excluidos la raíz, el sufijo y la inflexión); género; forma final.","en":"Depending on context: base, nominal stem (what has meaning, excluding root, suffix and inflection); gender; final form."},"ejemplo":{"n":53,"cap":"nama","nota":{"es":"«la base (liṅga)».","en":"“the base (liṅga)”."},"sutta":"Liṅgañ ca nippajjate","tr":{"es":"Y la base se debe establecer.","en":"And the base should be established."}}},{"clave":"karaka","termino":"kāraka","formas":["kāraka","kārakas"],"def":{"es":"Aquello que realiza la acción; caso, relación con el verbo. En las gramáticas antiguas hay seis: kattu-, kamma-, karaṇa-, sampadāna-, apādāna- y okāsa-kāraka. El genitivo no se denomina kāraka.","en":"That which brings about the action; case relation. Six in the old grammars: agent, object, instrument, recipient, starting point, place. The genitive is not a kāraka."},"ejemplo":{"n":271,"cap":"karaka","sutta":"Yasmād apeti bhayam ādatte vā tad apādānaṃ","tr":{"es":"Aquello de lo cual [uno] se aparta, [de lo que surge] peligro o temor, o de lo que toma: eso es “apādāna”.","en":"That from which [one] moves away, [from which] danger or fear [arises], or from which one takes: that is “apādāna”."}}},{"clave":"katta","termino":"kattā","formas":["kattā"],"def":{"es":"Agente o sujeto.","en":"Agent."},"ejemplo":{"n":281,"cap":"karaka","sutta":"Yo karoti sa kattā","tr":{"es":"Ese que hace, ése es “kattā”.","en":"The one who does, he is “kattā”."}}},{"clave":"kamma","termino":"kamma","formas":["kamma"],"def":{"es":"Objeto; aquello que recibe la acción de un verbo activo (el objeto directo).","en":"Object; what receives the action of an active verb (the direct object)."},"ejemplo":{"n":280,"cap":"karaka","sutta":"Yaṃ karoti taṃ kammaṃ","tr":{"es":"[Uno] hace eso, eso es “kamma”.","en":"[One] does that, that is “kamma”."}}},{"clave":"karana","termino":"karaṇa","formas":["karaṇa"],"def":{"es":"El tercer caso; el caso instrumental. Glosa del sitio: instrumento.","en":"The third case; the instrumental. Site gloss: instrument."},"ejemplo":{"n":279,"cap":"karaka","sutta":"Yena vā kayirate taṃ karaṇaṃ","tr":{"es":"Por medio de esto [uno] hace, eso es “karaṇa”.","en":"By means of this [one] does, that is “karaṇa”."}}},{"clave":"sampadana","termino":"sampadāna","formas":["sampadāna"],"def":{"es":"El cuarto caso; el caso dativo. Glosa del sitio: destinatario.","en":"The fourth case; the dative. Site gloss: recipient."},"ejemplo":{"n":276,"cap":"karaka","sutta":"Yassa dātukāmo rocate dhārayate vā taṃ sampadānaṃ","tr":{"es":"A quien [uno] desea dar, a quien [algo] agrada, o para quien [uno] sostiene [algo]: eso es “sampadāna”.","en":"To whom [one] wants to give, to whom [something] is pleasing, or for whom [one] holds [something]: that is “sampadāna”."}}},{"clave":"apadana","termino":"apādāna","formas":["apādāna"],"def":{"es":"El quinto caso; el caso ablativo. Glosa del sitio: punto de partida.","en":"The fifth case; the ablative case. Site gloss: starting point."},"ejemplo":{"n":271,"cap":"karaka","sutta":"Yasmād apeti bhayam ādatte vā tad apādānaṃ","tr":{"es":"Aquello de lo cual [uno] se aparta, [de lo que surge] peligro o temor, o de lo que toma: eso es “apādāna”.","en":"That from which [one] moves away, [from which] danger or fear [arises], or from which one takes: that is “apādāna”."}}},{"clave":"okasa","termino":"okāsa","formas":["okāsa"],"def":{"es":"El séptimo caso; el caso locativo. Glosa del sitio: lugar.","en":"The seventh case; the locative. Site gloss: place."},"ejemplo":{"n":278,"cap":"karaka","sutta":"Yo ’dhāro tam okāsaṃ","tr":{"es":"Eso que es el receptáculo, eso es “okāsa”.","en":"That which is the receptacle, that is “okāsa”."}}},{"clave":"adhara","termino":"ādhāra","formas":["ādhāra"],"def":{"es":"Locativo; apoyo; contenedor, receptáculo, base.","en":"Locative; support; container, receptacle, base."},"ejemplo":{"n":278,"cap":"karaka","sutta":"Yo ’dhāro tam okāsaṃ","tr":{"es":"Eso que es el receptáculo, eso es “okāsa”.","en":"That which is the receptacle, that is “okāsa”."}}},{"clave":"sami","termino":"sāmī","formas":["sāmī"],"def":{"es":"El sexto caso; el caso genitivo. Glosa del sitio: poseedor.","en":"The sixth case; the genitive. Site gloss: owner."},"ejemplo":{"n":283,"cap":"karaka","sutta":"Yassa vā pariggaho taṃ sāmī","tr":{"es":"La posesión de ese, esto es “sāmī”.","en":"The possession of that, this is “sāmī”."}}},{"clave":"hetu","termino":"hetu","formas":["hetu"],"def":{"es":"Causa: el que hace actuar al agente; recibe también el nombre de kattā.","en":"Cause: the one who makes the agent act; also named kattā."},"ejemplo":{"n":282,"cap":"karaka","sutta":"Yo kāreti sa hetu","tr":{"es":"Ese que hace hacer, ése es “hetu”.","en":"The one who causes to do, he is “hetu”."}}},{"clave":"kammappavacaniya","termino":"kammappavacanīya","formas":["kammappavacanīya","kammappavacanīyas"],"def":{"es":"Nombre de ciertos prefijos (pari, pati, anu, abhi), cuya terminación va en la segunda inflexión aunque el significado sea de otra.","en":"Name of certain prefixes (pari, pati, anu, abhi) construed with the second inflection, although the meaning may belong to another."},"ejemplo":{"n":299,"cap":"karaka","sutta":"Kammappavacanīyayutte","tr":{"es":"En conexión con esos que han indicado la acción (kammappavacanīya).","en":"In connection with those that have indicated the action (kammappavacanīya)."}}},{"clave":"samasa","termino":"samāsa","formas":["samāsa"],"def":{"es":"Compuesto: la combinación de dos o más voces que forman una unidad gramatical.","en":"Compound: two or more words combined into a grammatical unit."},"ejemplo":{"n":316,"cap":"samasa","sutta":"Nāmānaṃ samāso yuttattho","tr":{"es":"El significado conectado de nombres [recibe el nombre] “samāsa” (compuesto).","en":"The connected meaning of nouns [has the name] “samāsa” (compound)."}}},{"clave":"abyayibhava","termino":"abyayībhāva","formas":["abyayībhāva"],"def":{"es":"Compuesto adverbial. El primer miembro es un indeclinable y el segundo un sustantivo.","en":"Adverbial compound. The first member is an indeclinable and the second a noun."},"ejemplo":{"n":319,"cap":"samasa","sutta":"Upasagga-nipātapubbako abyayībhāvo","tr":{"es":"Ese que tiene delante un prefijo o una partícula es un “abyayībhāva” (compuesto adverbial).","en":"That which has a prefix or a particle in front is an “abyayībhāva” (adverbial compound)."}}},{"clave":"kammadharaya","termino":"kammadhāraya","formas":["kammadhāraya"],"def":{"es":"Compuesto adjetivo, donde se combinan un adjetivo y un sustantivo.","en":"Adjective compound, combining an adjective and a noun."},"ejemplo":{"n":324,"cap":"samasa","sutta":"Dvipade tulyādhikaraṇe kammadhārayo","tr":{"es":"Cuando dos palabras que se refieren a la misma cosa [forman un compuesto], hay un “kammadhāraya” (compuesto adjetivo).","en":"When two words referring to the same thing [are compounded], there is a “kammadhāraya” (adjectival compound)."}}},{"clave":"digu","termino":"digu","formas":["digu"],"def":{"es":"Compuesto numérico determinativo.","en":"Numerical compound."},"ejemplo":{"n":325,"cap":"samasa","sutta":"Saṅkhyāpubbo digu","tr":{"es":"[El compuesto adjetivo] que tiene un numeral como primer miembro es un “digu” (compuesto numérico).","en":"[The adjectival compound] that has a numeral as its first member is a “digu” (numerical compound)."}}},{"clave":"tappurisa","termino":"tappurisa","formas":["tappurisa"],"def":{"es":"Compuesto determinativo: el primer miembro, en cualquier inflexión menos la primera, determina al segundo.","en":"Determinative compound: the first member, in any inflection but the first, determines the second."},"ejemplo":{"n":326,"cap":"samasa","sutta":"Ubhe tappurisā","tr":{"es":"Ambos son “tappurisa” (compuestos determinativos).","en":"Both are “tappurisa” (determinative compounds)."}}},{"clave":"bahubbihi","termino":"bahubbīhi","formas":["bahubbīhi"],"def":{"es":"Compuesto relativo, que denota algo diferente de lo que representa cada uno de sus miembros.","en":"Relative compound, denoting something other than what each of its members stands for."},"ejemplo":{"n":328,"cap":"samasa","sutta":"Aññapadatthesu bahubbīhi","tr":{"es":"En los significados de otras palabras hay un “bahubbīhi” (compuesto relativo).","en":"In the meaning of other words there is a “bahubbīhi” (relative compound)."}}},{"clave":"dvanda","termino":"dvanda","formas":["dvanda"],"def":{"es":"Compuesto copulativo o agregativo.","en":"Copulative compound."},"ejemplo":{"n":329,"cap":"samasa","sutta":"Nāmānaṃ samuccayo dvando","tr":{"es":"Una colección de nombres [recibe el nombre] “dvanda” (compuesto copulativo).","en":"A collection of nouns [has the name] “dvanda” (copulative compound)."}}},{"clave":"upasagga","termino":"upasagga","formas":["upasagga","upasaggas"],"def":{"es":"Prefijo. Se antepone a raíces, verbos y derivados; hay veinte.","en":"Prefix, placed before roots, verbs and derivatives; there are twenty."},"ejemplo":{"n":221,"cap":"nama","sutta":"Sabbāsam āvuso-’pasagga-nipātādīhi ca","tr":{"es":"Y tras “āvuso”, los prefijos, las partículas, etc., [hay elisión] de todas.","en":"And after “āvuso”, the prefixes, the particles, etc., [there is elision] of all."}}},{"clave":"sandhi","termino":"sandhi","formas":["sandhi"],"def":{"es":"Combinación eufónica. Según Rūpasiddhi hay cuatro clases: de vocales (sara-), natural (pakati-), de consonantes (byañjana-) y del niggahīta (niggahīta-sandhi).","en":"Euphonic combination. Rūpasiddhi has four kinds: of vowels, natural (pakati), of consonants and of the niggahīta."},"ejemplo":{"n":1,"cap":"sandhi","sutta":"Attho akkharasaññāto","tr":{"es":"El significado se conoce por las letras.","en":"The meaning is known by letters."}}},{"clave":"nama","termino":"nāma","formas":["nāma"],"def":{"es":"Nombre: incluye sustantivos y adjetivos.","en":"Noun (including adjectives)."},"ejemplo":{"n":52,"cap":"nama","sutta":"Jinavacanayuttaṃ hi","tr":{"es":"Conforme a la palabra del Victorioso.","en":"Conforming to the Word of the Victorious One."}}},{"clave":"taddhita","termino":"taddhita","formas":["taddhita"],"def":{"es":"Derivado secundario: no se forma directamente de la raíz sino de un derivado primario (kitaka).","en":"Secondary derivative: formed not directly from the root but from a primary derivative (kitaka)."},"ejemplo":{"n":344,"cap":"taddhita","sutta":"Vā ṇ’ apacce","tr":{"es":"Opcionalmente, [hay] ‘ṇa’ en [el significado de] descendiente.","en":"Optionally, [there is] ‘ṇa’ in [the meaning of] offspring."}}},{"clave":"akhyata","termino":"ākhyāta","formas":["ākhyāta"],"def":{"es":"Verbo.","en":"Verb."},"ejemplo":{"n":405,"cap":"taddhita","sutta":"A-y-uvaṇṇānañ c’ ā-y-o vuddhi","tr":{"es":"‘Ā’, ‘e’ y ‘o’ son el fortalecimiento de ‘a’, de ‘i’, ‘ī’ y de ‘u’, ‘ū’.","en":"‘Ā’, ‘e’ and ‘o’ are the strengthening of ‘a’, of ‘i’, ‘ī’ and of ‘u’, ‘ū’."}}},{"clave":"kita","termino":"kita","formas":["kita"],"def":{"es":"Nombre de los sufijos que forman derivados primarios (kitaka), y del capítulo de Kaccāyana que los trata.","en":"Name of the suffixes that form primary derivatives (kitaka), and of the Kaccāyana chapter on them."}},{"clave":"unadi","termino":"uṇādi","formas":["uṇādi"],"def":{"es":"«Los que empiezan por uṇ»: los sufijos uṇ, etc., y el último capítulo de Kaccāyana, que los trata.","en":"“Those beginning with uṇ”: the suffixes uṇ, etc., and the last chapter of Kaccāyana, on them."}},{"clave":"tika","termino":"ṭīkā","formas":["ṭīkā"],"def":{"es":"Subcomentario: comentario de segundo nivel.","en":"Sub-commentary: a second-level commentary."}},{"clave":"atthakatha","termino":"aṭṭhakathā","formas":["aṭṭhakathā"],"def":{"es":"Comentario (a los textos canónicos).","en":"Commentary (on the canonical texts)."}},{"clave":"gatha","termino":"gāthā","formas":["gāthā"],"def":{"es":"Verso; estrofa.","en":"Verse; stanza."}},{"clave":"o_kaccayana","termino":"Kaccāyana","formas":["Kaccāyana","Kaccāyanabyākaraṇaṃ"],"def":{"es":"Gramática pāḷi en suttas (aforismos); la obra que traduce este sitio, en la versión de Bhikkhu Nandisena.","en":"Pāḷi grammar in suttas (aphorisms); the work this site translates, following Bhikkhu Nandisena's version."}},{"clave":"o_vutti","termino":"Kaccāyanavutti","formas":["Kaccāyanavutti"],"def":{"es":"La explicación en prosa que acompaña a cada sutta de Kaccāyana; la tradición que recoge el prefacio de la edición de 1933 de Nyāsa la atribuye a Saṅghanandi.","en":"The prose explanation accompanying each Kaccāyana sutta; the tradition quoted in the preface to the 1933 edition of Nyāsa ascribes it to Saṅghanandi."}},{"clave":"o_rupasiddhi","termino":"Rūpasiddhi","formas":["Rūpasiddhi","Padarūpasiddhi","Rū"],"def":{"es":"Gramática que expone los suttas de Kaccāyana en su propio orden y numeración, por kaṇḍas; de Buddhappiya, también llamado Dīpaṅkara.","en":"A grammar setting out Kaccāyana's suttas in its own order and numbering, by kaṇḍas; by Buddhappiya, also called Dīpaṅkara."}},{"clave":"o_rupasiddhitika","termino":"Rūpasiddhi-ṭīkā","formas":["Rūpasiddhi-ṭīkā","Padarūpasiddhiṭīkā"],"def":{"es":"Comentario (ṭīkā) a Rūpasiddhi, atribuido a su mismo autor.","en":"Commentary (ṭīkā) on Rūpasiddhi, ascribed to its own author."}},{"clave":"o_nyasa","termino":"Nyāsa","formas":["Nyāsa","Mukhamattadīpanī"],"def":{"es":"Comentario a Kaccāyana, llamado también Mukhamattadīpanī; la edición de Yangon (Sudhammavatī, 1933) lo atribuye al thera cingalés Vimalabuddhi (Saddanīti y Vinayālaṅkāraṭīkā lo dan a Vajirabuddhi).","en":"Commentary on Kaccāyana, also called Mukhamattadīpanī; the Yangon edition (Sudhammavatī, 1933) ascribes it to the Sinhalese thera Vimalabuddhi (Saddanīti and Vinayālaṅkāraṭīkā give it to Vajirabuddhi)."}},{"clave":"o_bhasatika","termino":"Bhāsāṭīkā","formas":["Bhāsāṭīkā","Kaccāyana Bhāsāṭīkā"],"def":{"es":"Comentario a Kaccāyana en birmano; se cita por un OCR del facsímil.","en":"Commentary on Kaccāyana in Burmese; cited from an OCR of the facsimile."}},{"clave":"o_vannana","termino":"Kaccāyanavaṇṇanā","formas":["Kaccāyanavaṇṇanā"],"def":{"es":"Comentario a Kaccāyana de Mahāvijitāvī; se cita por el facsímil de Rangún, 1916.","en":"Commentary on Kaccāyana by Mahāvijitāvī; cited from the Rangoon facsimile of 1916."}},{"clave":"o_visuddhayum","termino":"Visuddhāyuṃ","formas":["Visuddhāyuṃ","Kaccāyana-ṭīkā"],"def":{"es":"Guía de estudio de Kaccāyana, sutta por sutta, en birmano, de Ashin Aggañāṇābhivaṃsa (Si-shin Nāyaka Sayadaw); primera edición, Yangon, 1366 de la era birmana (2004).","en":"A Burmese study guide to Kaccāyana, sutta by sutta, by Ashin Aggañāṇābhivaṃsa (Si-shin Nāyaka Sayadaw); first edition, Yangon, Burmese Era 1366 (2004)."}},{"clave":"o_saddaniti","termino":"Saddanīti","formas":["Saddanīti"],"def":{"es":"Gramática pāḷi de Aggavaṃsa en tres partes (Padamālā, Dhātumālā, Suttamālā); se cita por la edición de Helmer Smith.","en":"Pāḷi grammar by Aggavaṃsa in three parts (Padamālā, Dhātumālā, Suttamālā); cited from Helmer Smith's edition."}},{"clave":"o_nirutti","termino":"Niruttidīpanī","formas":["Niruttidīpanī"],"def":{"es":"Gramática de Leḍī Sayāḍo (1903).","en":"Grammar by Ledi Sayadaw (1903)."}},{"clave":"o_mogg","termino":"Moggallāna","formas":["Moggallāna"],"def":{"es":"Gramática pāḷi; el proyecto la consulta junto con Payogasiddhi.","en":"A Pāḷi grammar; the project consults it together with Payogasiddhi."}},{"clave":"o_bala","termino":"Bālāvatāra","formas":["Bālāvatāra"],"def":{"es":"Gramática pāḷi citada en las notas con la sigla Bā.","en":"A Pāḷi grammar, cited in the notes as Bā."}},{"clave":"o_thitzana","termino":"Thitzana","formas":["Thitzana"],"def":{"es":"Ven. A. Thitzana, Kaccāyana, vol. 2 (en inglés); el sitio sigue su Introducción, pp. 36–37, para las ocho vidhis.","en":"Ven. A. Thitzana, Kaccāyana, vol. 2 (in English); the site follows its Introduction, pp. 36–37, for the eight vidhis."}},{"clave":"o_silananda","termino":"U Sīlānanda","formas":["U Sīlānanda","Sīlānanda"],"def":{"es":"Clases grabadas de gramática pāḷi (Kaccāyana, Rūpasiddhi) del Ven. U Sīlānanda; se citan por clase y minuto.","en":"Recorded Pāḷi grammar classes (Kaccāyana, Rūpasiddhi) by Ven. U Sīlānanda; cited by class and minute."}},{"clave":"o_nandisena","termino":"Nandisena","formas":["Nandisena"],"def":{"es":"Bhikkhu Nandisena: autor de la traducción de Kaccāyana que sigue este sitio y de Glosario de términos gramaticales de la lengua pali (2013).","en":"Bhikkhu Nandisena: author of the Kaccāyana translation this site follows and of Glosario de términos gramaticales de la lengua pali (2013)."}},{"clave":"bhava","termino":"bhāva","formas":["bhāva"],"def":{"es":"Estado; condición; cierta clase de nombre verbal; nombre abstracto; impersonal. En el §313: la acción que señala otra.","en":"State; condition; a kind of verbal noun; abstract noun; impersonal. In §313: an action that marks another."},"ejemplo":{"n":313,"cap":"karaka","sutta":"Kāla-bhāvesu ca","tr":{"es":"Y en tiempo y estado.","en":"Also in time and state."}}},{"clave":"pamanattha","termino":"pamāṇattha","formas":["pamāṇattha"],"def":{"es":"En el sentido de medida: p. ej. el ablativo de medida (Rū 313).","en":"In the sense of measure: e.g. the ablative of measure (Rū 313)."},"ejemplo":{"n":106,"cap":"nama","sutta":"Dīgh’-orehi","tr":{"es":"Después de “dīgha” y “ora”.","en":"After “dīgha” and “ora”."}}},{"clave":"abhidheyya","termino":"abhidheyyappayojanavākya","formas":["abhidheyyappayojanavākya"],"def":{"es":"Enunciado de materia y propósito: así llama Rūpasiddhi al §1.","en":"Statement of subject-matter and purpose: Rūpasiddhi's name for §1."},"ejemplo":{"n":1,"cap":"sandhi","sutta":"Attho akkharasaññāto","tr":{"es":"El significado se conoce por las letras.","en":"The meaning is known by letters."}}},{"clave":"o_kalapatika","termino":"Kalāpa-ṭīkā","formas":["Kalāpa-ṭīkā"],"def":{"es":"Comentario (ṭīkā) a Kalāpa, gramática que Visuddhāyuṃ cita junto a Kaccāyana (aquí, en el §6).","en":"Commentary (ṭīkā) on Kalāpa, a grammar Visuddhāyuṃ cites alongside Kaccāyana (here, under §6)."}},{"clave":"o_ekakkharakosa","termino":"Ekakkharakosa","formas":["Ekakkharakosa"],"def":{"es":"Léxico (kosa) de palabras de una sílaba (ekakkhara), citado por Visuddhāyuṃ en el §31.","en":"A lexicon (kosa) of one-syllable words (ekakkhara), cited by Visuddhāyuṃ under §31."}},{"clave":"antaranga","termino":"antaraṅga","formas":["antaraṅga","antaraṅga-vidhi"],"def":{"es":"«Interno». Rótulo que Visuddhāyuṃ da a muchas vidhis de Nāma (antaraṅga-vidhi). En la tradición gramatical, operación cuyas condiciones están dentro de la forma o más cerca de ella; prevalece sobre la bāhiraṅga.","en":"“Internal”. Label Visuddhāyuṃ gives to many Nāma vidhis (antaraṅga-vidhi). In the grammatical tradition, an operation whose conditions lie within, or nearer to, the form; it prevails over a bāhiraṅga one."},"ejemplo":{"n":66,"cap":"nama","sutta":"Gho rassaṃ","tr":{"es":"‘Gha’ [se acorta].","en":"‘Gha’ [becomes short]."}}},{"clave":"bahiranga","termino":"bāhiraṅga","formas":["bāhiraṅga","bāhiraṅga-vidhi"],"def":{"es":"«Externo». Rótulo que Visuddhāyuṃ da a muchas vidhis de Nāma (bāhiraṅga-vidhi). En la tradición gramatical, operación cuyas condiciones están fuera de la forma o más lejos de ella; cede ante la antaraṅga.","en":"“External”. Label Visuddhāyuṃ gives to many Nāma vidhis (bāhiraṅga-vidhi). In the grammatical tradition, an operation whose conditions lie outside, or further from, the form; it yields to an antaraṅga one."},"ejemplo":{"n":68,"cap":"nama","sutta":"Am-ā pato smiṃ-smānaṃ vā","tr":{"es":"Opcionalmente, después de ‘pa’, ‘aṃ’ y ‘ā’ de ‘smiṃ’ y ‘smā’.","en":"Optionally, after ‘pa’, ‘aṃ’ and ‘ā’ of ‘smiṃ’ and ‘smā’."}}},{"clave":"ubhayanga","termino":"ubhayaṅga","formas":["ubhayaṅga"],"def":{"es":"«De ambos lados». Sutta con una operación antaraṅga y otra bāhiraṅga; en §83 Visuddhāyuṃ: la elisión es antaraṅga y la pakati, bāhiraṅga.","en":"“Of both sides”. A sutta with one antaraṅga and one bāhiraṅga operation; at §83 Visuddhāyuṃ says the elision is antaraṅga and the pakati bāhiraṅga."},"ejemplo":{"n":83,"cap":"nama","sutta":"Saralopo ’mādesa-paccayādimhi saralope tu pakati","tr":{"es":"Cuando siguen ‘aṃ’, una sustitución, un sufijo, etc., [hay] elisión de la vocal; cuando hay elisión de la vocal, [la vocal restante permanece] natural.","en":"When ‘aṃ’, a substitution, a suffix, etc., follow, [there is] elision of the vowel; when there is elision of the vowel, [the remaining vowel remains] natural."}}},{"clave":"sihavikkanta","termino":"sīhavikkanta-adhikāra","formas":["sīhavikkanta-adhikāra","sīhavikkanta"],"def":{"es":"Adhikāra «del paso del león»: según Visuddhāyuṃ, rige toda la obra (§52). Compárese sīhagatika.","en":"Adhikāra “of the lion's stride”: according to Visuddhāyuṃ it governs the whole work (§52). Compare sīhagatika."},"ejemplo":{"n":52,"cap":"nama","sutta":"Jinavacanayuttaṃ hi","tr":{"es":"Conforme a la palabra del Victorioso.","en":"Conforming to the Word of the Victorious One."}}},{"clave":"upaparibhasa","termino":"upaparibhāsā","formas":["upaparibhāsā","vidhyaṅga-upaparibhāsā"],"def":{"es":"Clase que Visuddhāyuṃ da a §56 (vidhyaṅga-upaparibhāsā). Sentido exacto por confirmar; en §1 el libro distingue la upari-bhāsā, que impide, de la paribhāsā, que no impide.","en":"Class Visuddhāyuṃ gives to §56 (vidhyaṅga-upaparibhāsā). Exact sense to be confirmed; at §1 the book distinguishes upari-bhāsā, which blocks, from paribhāsā, which does not."},"ejemplo":{"n":56,"cap":"nama","sutta":"Tadanuparodhena","tr":{"es":"Sin contradecir aquellas.","en":"By not contradicting those."}}},{"clave":"sampasarana","termino":"sampasāraṇa","formas":["sampasāraṇa"],"def":{"es":"«Expansión»: se restituye la forma plena de una palabra contraída. En §95, según Visuddhāyuṃ, el sutta expande la palabra contraída agni del sánscrito: aggi → aggini.","en":"“Expansion”: the full form of a contracted word is restored. At §95, according to Visuddhāyuṃ, the sutta expands the contracted Sanskrit word agni: aggi → aggini."},"ejemplo":{"n":95,"cap":"nama","sutta":"Aggiss’ ini","tr":{"es":"‘Ini’ de [la vocal final de] “aggi”.","en":"‘Ini’ of [the end vowel of] “aggi”."}}}]};

/* ---------- glosario de los globos (recursos/terminos/terminos.json) ----------
   Como en /recursos/analisis/: primera aparición de cada término por celda o
   párrafo; nunca dentro de un enlace. Los nombres de obra llevan su globo
   «obra» (sólo la descripción). */
const GL=D.terminos||[],GK={},GF=[];
GL.forEach(t=>{GK[t.clave]=t;t.formas.forEach(f=>GF.push([f,t.clave]))});
GF.sort((a,b)=>b[0].length-a[0].length);
const GFK={};GF.forEach(([f,k])=>GFK[f.toLowerCase()]=k);
/* Sólo nombres enteros (2026-10-03): una forma pegada a un guion o a un
   paréntesis forma parte de otro título —«Mukhamattadīpanī-purāṇaṭīkā» es una
   ṭīkā sobre el Nyāsa, no el Nyāsa; «Bālāvatāra-(purāṇa)ṭīkā», «Rūpasiddhi-
   sannaya»— y no lleva el globo de la obra. */
const GRE=GF.length?new RegExp('(?<![\\p{L}\\p{M}\\-‐)])('+GF.map(([f])=>f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{M}\\-‐(])','giu'):null;
function glosar(el){
  if(!GRE||!el)return;
  const vistos=new Set();
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:x=>x.parentElement.closest('a,button,[data-g]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodos=[];while(w.nextNode())nodos.push(w.currentNode);
  nodos.forEach(nd=>{
    const t=nd.nodeValue;let m,frag=null,ult=0;GRE.lastIndex=0;
    while((m=GRE.exec(t))){
      const k=GFK[m[1].toLowerCase()];if(!k||vistos.has(k))continue;
      vistos.add(k);
      frag=frag||document.createDocumentFragment();
      frag.appendChild(document.createTextNode(t.slice(ult,m.index)));
      const s=document.createElement('span');s.className='gl';s.dataset.g=k;s.tabIndex=0;s.textContent=m[1];
      frag.appendChild(s);ult=m.index+m[1].length;
    }
    if(frag){frag.appendChild(document.createTextNode(t.slice(ult)));nd.parentNode.replaceChild(frag,nd)}
  });
}
function glosaHTML(k){
  const t=GK[k];if(!t)return '';const e=t.ejemplo;
  const cab=`<span class="tn">${esc(t.termino)}</span><p class="gd">${esc(t.def[lang])}</p>`;
  if(!e)return cab;  /* obras: sólo la descripción */
  const href=(lang==='en'?'../../en/kaccayana/':'../../kaccayana/')+e.cap+'/#s'+e.n;
  return cab+
    `<p class="te">${lang==='en'?'Example':'Ejemplo'}: <a href="${href}">§${e.n}</a> <i>${esc(e.sutta||'')}</i>`+
    `${e.nota?' — '+esc(e.nota[lang]):''}${e.tr&&e.tr[lang]?` · «${esc(e.tr[lang])}»`:''}</p>`;
}

  const t=T[lang];root.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);
  document.querySelectorAll('[data-t-html]').forEach(el=>el.innerHTML=t[el.dataset.tHtml]);
  document.getElementById('q').placeholder=t.search;
  document.title=D.titulo[lang];
  document.getElementById('h1').textContent=D.titulo[lang];
  document.getElementById('entradilla').innerHTML=D.entradilla[lang];
  const m=D.meta;
  document.getElementById('atrib').innerHTML=m.atribucion[lang];
  document.getElementById('vbadge').innerHTML=`v${esc(m.version)} · <time datetime="${m.fecha}">${m.fecha}</time>`;
  document.getElementById('vfoot').innerHTML=`<strong>${t.ver} ${esc(m.version)}</strong> — <time datetime="${m.fecha}">${m.fecha}</time>. ${esc(m.nota_version[lang])}`;
  const lb=document.getElementById('lang-btn');lb.querySelectorAll('.lang-seg').forEach(x=>x.classList.toggle('lang-cur',x.dataset.l===lang));
  lb.title=lang==='en'?'Ver esta página en español':'View this page in English';lb.setAttribute('aria-label',lb.title);
  ['#entradilla','[data-t-html="how"]','#atrib','.aviso'].forEach(s=>document.querySelectorAll(s).forEach(glosar));
}
function prosa(bl){
  let h='',abierta='';
  bl.forEach(b=>{
    if(b.t!==abierta){if(abierta)h+=`</${abierta}>`;abierta=(b.t==='p')?'':b.t;if(abierta)h+=`<${abierta}>`}
    h+=b.t==='p'?`<p>${b.html}</p>`:`<li>${b.html}</li>`;
  });
  if(abierta)h+=`</${abierta}>`;
  return h;
}
function render(){
  let h='',sb='';
  D.secciones.forEach(s=>{
    sb+=`<a class="sec-l" href="#${s.id}" data-c="${s.id}">${esc(s.titulo[lang])}</a>`;
    if(s.filas){
      const cab=s.cabecera[lang];
      h+=`<section class="sec tabla" id="${s.id}"><h2>${esc(s.titulo[lang])}</h2><div class="tabla-caja" tabindex="0" role="region" aria-label="${esc(s.titulo[lang])}"><table class="co"><thead><tr>${cab.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
      s.filas.forEach(f=>{
        h+=`<tr class="r" id="${f.id}">${f[lang].map((c,i)=>`<td class="${CLS[i]}">${c}</td>`).join('')}</tr>`;
        sb+=`<a href="#${f.id}" data-c="${f.id}"><i>${esc(f.nombre.replace(/\s+\(.*$/,''))}</i></a>`;
      });
      h+='</tbody></table></div></section>';
    }else{
      h+=`<section class="sec prosa-sec" id="${s.id}"><h2>${esc(s.titulo[lang])}</h2><div class="prosa">${prosa(s.prosa[lang])}</div></section>`;
    }
  });
  document.getElementById('out').innerHTML=h;document.getElementById('sb-list').innerHTML=sb;
  /* el globo se cierra también al desplazar la tabla en horizontal */
  document.querySelectorAll('#out .tabla-caja').forEach(c=>c.addEventListener('scroll',()=>hideTip(),{passive:true}));
  document.querySelectorAll('#out td.ob, #out td.re, #out .prosa p, #out .prosa li').forEach(glosar);
  document.querySelectorAll('#out tr.r').forEach(r=>{r.dataset.t=norm(r.textContent).replace(/\s+/g,' ')});
  filtrar();
}
/* La búsqueda filtra las filas de las tablas; las secciones en prosa (notas,
   cambios, cobertura) se ocultan mientras hay búsqueda. */
function filtrar(){
  const q=norm(document.getElementById('q').value.trim());let n=0;
  document.querySelectorAll('#out tr.r').forEach(r=>{const ok=!q||r.dataset.t.includes(q);r.hidden=!ok;if(ok)n++});
  document.querySelectorAll('#out section.tabla').forEach(s=>{s.hidden=!s.querySelector('tr.r:not([hidden])')});
  document.querySelectorAll('#out section.prosa-sec').forEach(s=>{s.hidden=!!q});
  document.querySelectorAll('#sb-list a[data-c]').forEach(a=>{const el=document.getElementById(a.dataset.c);a.hidden=!el||el.hidden||!!el.closest('[hidden]')});
  document.getElementById('count').textContent=T[lang].rows(n);
  document.getElementById('empty').hidden=!!n;
  espiar();
}
document.getElementById('q').addEventListener('input',filtrar);

medirBarra();addEventListener('resize',medirBarra);
const cerrar=()=>{sbEl.classList.remove('open');scr.classList.remove('on')};
function pintarBarra(oc){root.classList.toggle('sin-barra',oc);burger.setAttribute('aria-expanded',oc?'false':'true')}
burger.onclick=()=>{if(ancha())pintarBarra(!root.classList.contains('sin-barra'));else{sbEl.classList.toggle('open');scr.classList.toggle('on')}};
document.getElementById('sbclose').onclick=()=>{if(ancha())pintarBarra(true);else cerrar()};
addEventListener('resize',()=>{if(!ancha())root.classList.remove('sin-barra')});
scr.onclick=cerrar;
addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});
sbEl.addEventListener('click',e=>{if(e.target.closest('a')&&!ancha())cerrar()});
let spyF=0;
function espiar(){
  const links=document.querySelectorAll('#sb-list a[data-c]');let cur=null;const lim=barEl.getBoundingClientRect().bottom+40;
  for(const a of links){if(a.hidden)continue;const el=document.getElementById(a.dataset.c);if(!el)continue;if(el.getBoundingClientRect().top<=lim)cur=a;else break}
  links.forEach(a=>a.classList.toggle('on',a===cur));
}
const topBtn=document.getElementById('top-btn');
addEventListener('scroll',()=>{topBtn.classList.toggle('show',scrollY>600);if(!spyF)spyF=requestAnimationFrame(()=>{spyF=0;espiar()})},{passive:true});
topBtn.onclick=()=>scrollTo({top:0});

/* globos del glosario (como en /recursos/analisis/): ratón, toque y teclado */
const tip=document.getElementById('tip');let tipT=null,tipDe=null,ocultarT=null,puntero='mouse';
addEventListener('pointerdown',e=>{puntero=e.pointerType||'mouse'},{capture:true,passive:true});
const conRaton=()=>puntero==='mouse'&&mq('(hover: hover)');
function placeTip(el){const r=el.getBoundingClientRect();tip.style.visibility='hidden';tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=r.left,y=r.bottom+8;
  if(x+w>innerWidth-12)x=innerWidth-w-12;if(x<12)x=12;if(y+h>innerHeight-12)y=r.top-h-8;if(y<8)y=8;
  tip.style.left=x+'px';tip.style.top=y+'px';tip.style.visibility=''}
function abrirTip(el){clearTimeout(ocultarT);const h=glosaHTML(el.dataset.g);if(!h)return;tip.innerHTML=h;tip.classList.add('glosa');tip.setAttribute('aria-hidden','false');placeTip(el);tipDe=el}
function hideTip(){clearTimeout(tipT);clearTimeout(ocultarT);tip.classList.remove('on','glosa');tip.setAttribute('aria-hidden','true');tipDe=null}
const programarOcultar=()=>{clearTimeout(ocultarT);ocultarT=setTimeout(hideTip,250)};
tip.addEventListener('mouseenter',()=>clearTimeout(ocultarT));tip.addEventListener('mouseleave',programarOcultar);
document.addEventListener('mouseover',e=>{if(!conRaton())return;const a=e.target.closest('[data-g]');if(!a)return;clearTimeout(tipT);tipT=setTimeout(()=>abrirTip(a),110)});
document.addEventListener('mouseout',e=>{if(conRaton()&&e.target.closest('[data-g]')){clearTimeout(tipT);programarOcultar()}});
document.addEventListener('focusin',e=>{const a=e.target.closest('[data-g]');if(a&&a.matches(':focus-visible'))abrirTip(a)});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-g]'))programarOcultar()});
document.addEventListener('click',e=>{const a=e.target.closest('[data-g]');if(a){if(conRaton())return;if(tipDe===a)hideTip();else abrirTip(a);return}if(!e.target.closest('#tip'))hideTip()});
addEventListener('scroll',()=>{if(!tip.matches(':hover'))hideTip()},{passive:true});addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});

textos();render();
/* una fila en la dirección (#o12) se resalta */
(function(){const m=/^#(o\d+)$/.exec(location.hash);if(!m)return;const r=document.getElementById(m[1]);if(!r)return;
  r.classList.add('marca');setTimeout(()=>r.scrollIntoView(),0)})();
})();
</script>
