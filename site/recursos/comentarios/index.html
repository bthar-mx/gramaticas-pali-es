<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<title>Comentarios de la escuela de Kaccāyana</title>
<meta name="version" content="0.1">
<meta name="version-date" content="2026-10-03">
<meta name="description" content="Tabla de referencia de los comentarios y tratados de la escuela gramatical de Kaccāyana: autor, fecha, lugar, relación con Kaccāyana, sección de Ñāṇatusita y texto en línea.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---- estilos copiados de recursos/analisis/plantilla.html (cabecera, barra
   lateral, barra de mandos, globos, pie) ---- */
:root{
  --ola:#E7E3D6;--ola-2:#F0EDE4;--ink:#171612;--soot:#4E4839;--hair:#BFB7A0;
  --haritala:#5C4008;--hover:rgba(255,255,255,.55);--hl:rgba(92,64,8,.16);
  --chip-k:rgba(39,65,79,.10);--nila:#27414F;--rakta:#7E2E23;--shadow:rgba(0,0,0,.08);
  --serif:"Gentium Book Plus",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --ola:#1A1917;--ola-2:#232220;--ink:#F4F1E8;--soot:#BDB5A2;--hair:#494438;
  --haritala:#EFC14E;--nila:#B6D8EE;--rakta:#F09A88;--shadow:rgba(0,0,0,.45);
  --hover:rgba(255,255,255,.055);--hl:rgba(239,193,78,.20);--chip-k:rgba(182,216,238,.13)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--cabecera-h,0px) + var(--barh,74px) + 10px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ola);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;
  background-image:radial-gradient(circle at 12% 8%,rgba(255,255,255,.55),transparent 55%);padding-left:238px;transition:padding-left .2s ease}
:root[data-theme="dark"] body{background-image:none}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
.lbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--soot)}
[hidden]{display:none!important}

/* barra lateral */
.sidebar{position:fixed;left:0;top:var(--cabecera-h,0px);bottom:0;width:238px;overflow-y:auto;z-index:60;background:var(--ola-2);
  border-right:1px solid var(--hair);padding:calc(env(safe-area-inset-top,0px) + 54px) 0 48px;transition:transform .2s ease}
.sb-brand{padding:0 18px 14px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.sb-brand b{display:block;font-size:18px;letter-spacing:-.01em;margin-bottom:3px;line-height:1.2}
.sb-brand .lbl{font-size:8.5px;letter-spacing:.1em;line-height:1.5}
.sidebar a{display:block;padding:2px 18px;color:var(--ink);text-decoration:none;font-size:13.5px;
  border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar a:hover{background:var(--ola);color:var(--nila)}
.sidebar a b{font-family:var(--mono);font-size:10.5px;color:var(--soot);margin-right:6px;font-weight:600;display:inline-block;min-width:3.2em}
.sidebar a i{font-style:italic}
.sidebar a.on{border-left-color:var(--haritala);color:var(--haritala);background:var(--ola)}
.sidebar a.on b{color:inherit}
.sb-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;font-family:var(--mono);font-size:14px;line-height:1;
  padding:6px 9px;background:var(--ola);color:var(--soot);border:1px solid var(--hair);border-radius:2px;cursor:pointer}
.sb-tools{position:absolute;top:calc(env(safe-area-inset-top,0px) + 17px);right:12px;display:flex;gap:4px}
.sb-tools button{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:1px solid var(--hair);color:var(--soot);border-radius:2px;padding:4px 6px;cursor:pointer}
.sb-close:hover,.sb-tools button:hover{color:var(--ink);border-color:var(--soot)}
.sb-ch>summary{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding:12px 14px 4px 8px;cursor:pointer;list-style:none;user-select:none}
.sb-ch>summary::-webkit-details-marker{display:none}
.sb-ch>summary::before{content:'▸';flex:0 0 12px;font-size:10px;opacity:.8}
.sb-ch[open]>summary::before{content:'▾'}
.sb-ch>summary .gl{flex:1;min-width:0}
.sb-ch>summary .n,.sb-ch>summary .rg,.sb-sec>summary .n,.sb-sec>summary .rg{color:var(--soot);font-weight:400;letter-spacing:0;text-transform:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.sb-ch>summary .n:empty,.sb-sec>summary .n:empty{display:none}
.sb-ch>summary .n,.sb-sec>summary .n{color:var(--haritala)}
/* con filtro activo: el número de aforismos visibles sustituye al rango */
.sb-ch.flt>summary .rg,.sb-sec.flt>summary .rg{display:none}
.sb-ch>summary:hover{background:var(--ola)}
.sb-ch>summary:focus-visible,.sb-sec>summary:focus-visible{outline:2px solid var(--nila);outline-offset:-2px}
.sb-ch .sb-sec>summary{padding-left:20px}
.sb-ch.on:not([open])>summary{background:var(--ola);box-shadow:inset 2px 0 0 var(--haritala)}
.sb-sec>summary{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--haritala);padding:7px 14px 5px 12px;cursor:pointer;list-style:none;user-select:none}
.sb-sec>summary::-webkit-details-marker{display:none}
.sb-sec>summary::before{content:'▸';flex:0 0 10px;font-size:9px;opacity:.8}
.sb-sec[open]>summary::before{content:'▾'}
.sb-sec>summary .gl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-sec>summary:hover{background:var(--ola)}
.sb-sec[open]{padding-bottom:6px}
.sb-sec.on:not([open])>summary{background:var(--ola);box-shadow:inset 2px 0 0 var(--haritala)}
.scrim{display:none}
html.sin-barra body{padding-left:0}
html.sin-barra .sidebar{transform:translateX(-100%)}

/* cabecera */
header{padding:52px 0 26px;border-bottom:1px solid var(--hair)}
.mast{display:flex;flex-wrap:wrap;gap:34px;align-items:flex-end;justify-content:space-between}
.mast>div:first-child{flex:1 1 420px;min-width:260px}
h1{font-size:clamp(34px,5.5vw,52px);line-height:.98;margin:10px 0 0;font-weight:700;letter-spacing:-.02em}
.tag{margin:10px 0 0;max-width:60ch;color:var(--soot);font-size:16.5px;line-height:1.45}
.version-badge{display:inline-flex;gap:6px;margin-top:12px;font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.05em;color:var(--rakta);background:var(--ola-2);border:1px solid var(--rakta);border-radius:999px;padding:4px 10px;cursor:help}
.version-badge time{opacity:.8;font-variant-numeric:tabular-nums}
.aviso{margin:0 0 16px;max-width:66ch;font-size:14.5px;color:var(--soot);border-left:2px solid var(--rakta);padding-left:10px}
.hero{font-family:var(--mono);font-size:12.5px;line-height:1.95;text-align:right;border-right:2px solid var(--haritala);padding-right:14px;white-space:nowrap}
.hero b{font-weight:700;color:var(--haritala)}
.hero .ref{color:var(--soot);font-size:10.5px}
.marca-arbol{display:inline-block;width:26px;height:26px;flex:0 0 auto;background:url(../../assets/iebh-arbol-granate.svg) center/contain no-repeat}
:root[data-theme="dark"] .marca-arbol{background-image:url(../../assets/iebh-arbol-blanco.svg)}
.marca-lockup{display:block;width:180px;height:75px;margin:0 0 16px;background:url(../../assets/iebh-imagotipo-granate.svg) left center/contain no-repeat}
:root[data-theme="dark"] .marca-lockup{background-image:url(../../assets/iebh-imagotipo-blanco.svg)}
.eyebrow-iebh{display:flex;align-items:center;gap:9px}
.volver-sitio{display:inline-block;font:400 12px/1 var(--mono);color:var(--soot);text-decoration:none;margin-bottom:14px;opacity:.85}
.volver-sitio:hover{color:var(--nila);opacity:1}

/* barra de mandos */
.bar{position:sticky;top:var(--cabecera-h,0px);z-index:20;background:var(--ola);border-bottom:1px solid var(--hair);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;margin-bottom:6px}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search]{flex:1 1 160px;min-width:0;font-family:var(--serif);font-size:16px;color:var(--ink);
  background:var(--ola-2);border:1px solid var(--hair);border-radius:2px;padding:8px 12px}
input[type=search]:focus,select:focus{outline:2px solid var(--nila);outline-offset:1px}
select{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--ola-2);border:1px solid var(--hair);border-radius:2px;padding:7px 6px}
.filtros{display:flex;border:1px solid var(--hair);border-radius:2px;overflow:hidden}
.filtros button{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:8px 9px;border:0;background:var(--ola-2);color:var(--soot);cursor:pointer;border-right:1px solid var(--hair)}
.filtros button:last-child{border-right:0}
.filtros button[aria-pressed=true]{background:var(--nila);color:var(--ola-2)}
.filtros button:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--haritala);outline-offset:-2px}
.icon-btn{font-family:var(--mono);font-size:13px;line-height:1;background:var(--ola-2);color:var(--soot);
  border:1px solid var(--hair);border-radius:2px;padding:8px 10px;cursor:pointer}
.count{font-family:var(--mono);font-size:11px;color:var(--soot);white-space:nowrap}
#ftog{display:none}
.ext{display:contents}

.icon-btn.on{background:var(--nila);color:var(--ola-2);border-color:var(--nila)}
/* ES | EN: el mismo interruptor que en los capítulos de Kaccāyana (pali.css, #lang-btn),
   tras la insignia de versión. Aquí no cambia de página: las dos lenguas viajan juntas. */
#lang-btn{position:relative;margin-left:10px;vertical-align:middle;height:26px;padding:2px;border-radius:100px;
  background:var(--ola-2);border:.5px solid var(--hair);color:var(--soot);
  font:600 11px/1 var(--mono);letter-spacing:.08em;cursor:pointer;display:inline-flex;align-items:center;gap:2px;flex:none;
  -webkit-appearance:none;appearance:none}
#lang-btn .lang-seg{display:flex;align-items:center;justify-content:center;height:100%;padding:0 9px;border-radius:100px;transition:background .15s,color .15s}
#lang-btn .lang-cur{background:var(--nila);color:var(--ola)}
#lang-btn:hover .lang-seg:not(.lang-cur){background:var(--chip-k);color:var(--ink)}
#lang-btn:focus-visible{outline:2px solid var(--haritala);outline-offset:2px}
.vline{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;margin-top:12px}
.vline .version-badge{margin-top:0}
/* ---------- tooltip de sutta (como en /recursos/sandhi/ y /recursos/paradigmas/) ---------- */
#tip{position:fixed;z-index:200;max-width:min(380px,calc(100vw - 24px));box-sizing:border-box;pointer-events:none;opacity:0;
  transform:translateY(3px);transition:opacity .12s ease,transform .12s ease;
  background:var(--ola-2);border:1px solid var(--hair);border-radius:3px;
  box-shadow:0 8px 26px var(--shadow);padding:13px 15px;font-size:15.5px;line-height:1.5}
#tip.on{opacity:1;transform:none}
#tip .tn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--nila);display:block;margin-bottom:5px}
#tip .tp{font-style:italic;font-weight:700;margin:0;font-size:16.5px}
#tip .te{margin:5px 0 0;color:var(--soot);font-size:15px}
#tip .tk{font-family:var(--mono);font-size:10.5px;color:var(--haritala);margin:8px 0 0;letter-spacing:.06em;text-transform:uppercase}
.gl{border-bottom:1px dotted var(--nila);cursor:help}
.gl:focus-visible{outline:2px solid var(--haritala);outline-offset:1px}
#tip.glosa{pointer-events:auto}
#tip .gd{margin:0;font-size:15px}
#tip .te a{color:var(--nila)}
#tip.llano{max-width:min(340px,calc(100vw - 24px));padding:11px 15px;font-size:15px;line-height:1.55}
#tip.llano p{margin:0}
#tip.llano i{font-weight:700}
mark{background:var(--hl);color:inherit;border-radius:2px;box-shadow:inset 0 -1px 0 var(--haritala)}
.empty{padding:60px 0;text-align:center;color:var(--soot)}
footer{border-top:1px solid var(--hair);margin-top:54px;padding:26px 0 58px;color:var(--soot);font-size:14px}
footer a{color:var(--nila)}
.pie-notas>summary{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--soot);cursor:pointer;list-style:none;padding:4px 0}
.pie-notas>summary::-webkit-details-marker{display:none}
.pie-notas>summary::after{content:' ▸';color:var(--haritala)}
.pie-notas[open]>summary::after{content:' ▾'}
.pie-notas p{max-width:78ch}
.version-foot{margin-top:10px;font-size:13px}
.licencia{margin-top:22px;padding-top:18px;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.65}
#top-btn{position:fixed;right:22px;bottom:22px;z-index:150;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--hair);background:var(--ola-2);color:var(--soot);font:16px/1 var(--mono);cursor:pointer;
  box-shadow:0 6px 20px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#top-btn.show{opacity:1;pointer-events:auto}

@media (max-width:900px){
  body{padding-left:0}
  .sidebar{transform:translateX(-100%);box-shadow:0 0 40px var(--shadow)}
  .sidebar.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .hero{display:none}
}
@media (prefers-reduced-motion:reduce){.sidebar,body{transition:none}}
@media print{.bar,.sidebar,#top-btn,.mas{display:none!important}body{padding-left:0}tr.det-row[hidden]{display:table-row!important}}

/* ---- propio de esta página ---- */
.wrap{max-width:1180px}
.subt{margin:6px 0 0;font-size:19px;color:var(--soot);font-style:italic}
.badge-b{display:inline-flex;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--rakta);color:var(--rakta);border-radius:2px;padding:4px 8px}
.tag{max-width:78ch}
.tag a,main a{color:var(--nila)}
.sidebar a.sec-l{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 18px 3px;white-space:normal}
/* secciones */
section.sec{margin:34px 0 0}
section.sec h2{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
section.sec[hidden]{display:none}
/* la tabla se desplaza dentro de su caja, nunca la página */
.tabla-caja{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--hair);border-radius:2px;background:var(--ola-2);margin-top:10px;max-width:100%}
table.co{border-collapse:separate;border-spacing:0;font-size:14.5px;min-width:1040px;width:100%}
table.co thead th{position:sticky;top:0;text-align:left;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--soot);background:var(--ola-2);padding:9px 10px 7px;border-bottom:1.5px solid var(--ink);vertical-align:bottom}
table.co td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.45}
table.co tr:last-child td{border-bottom:0}
table.co td.ob{width:20%;min-width:190px}
table.co td.au{width:15%}
table.co td.fe,table.co td.lu{width:9%}
table.co td.re{width:18%}
table.co td.nn{font-family:var(--mono);font-size:11.5px;color:var(--soot);white-space:nowrap;width:1%}
table.co td.tx{width:20%;min-width:210px;font-size:14px}
/* la primera columna queda fija al desplazar en horizontal */
table.co th:first-child,table.co td.ob{position:sticky;left:0;z-index:1;background:var(--ola-2);box-shadow:1px 0 0 var(--hair)}
table.co thead th:first-child{z-index:2}
table.co tr.r:hover td{background:var(--ola)}
table.co tr.r.marca td{background:var(--hl)}
table.co tr.r[hidden]{display:none}
.propio{display:inline-block;padding-left:8px;border-left:2px solid var(--haritala);margin:1px 0}
.propio.prep{color:var(--soot);font-style:italic}
details.plegable{margin:14px 0 0;max-width:86ch;border-top:1px solid var(--hair)}
details.plegable>summary{cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--soot);padding:9px 0 7px;list-style:none}
details.plegable>summary::-webkit-details-marker{display:none}
details.plegable>summary::before{content:'▸ '}
details.plegable[open]>summary::before{content:'▾ '}
details.plegable>div{font-size:15px;line-height:1.5;padding:0 0 12px}
details.plegable p{margin:0 0 8px}
.prosa{max-width:86ch;font-size:15.5px}
.prosa ol,.prosa ul{padding-left:1.4em;margin:8px 0}
.prosa li{margin:0 0 8px}
.prosa p{margin:8px 0}
.atrib{max-width:86ch;margin:0 0 10px}
@media (max-width:760px){
  .wrap{padding:0 16px}
  table.co{font-size:14px;min-width:900px}
  /* la columna fija deja ver, al lado, casi dos tercios de la caja */
  table.co th:first-child,table.co td.ob{width:40vw;min-width:130px;max-width:40vw;font-size:13.5px;padding-left:8px;padding-right:8px;overflow-wrap:break-word}
}
</style>
