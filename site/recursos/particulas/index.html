ā","cab":{"es":"**sabbadā**, (sc. *sarvadā*) (part. usada en la 7ª inflexión —tiempo) Siempre.","en":"**sabbadā**, (Skt. *sarvadā*) (particle used in the 7th case — time) Always."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"dukkho bālehi saṃvāso, amitten eva sabbadā","ref":"Dh. 44","es":"La asociación con los necios es siempre sufrimiento, como vivir con un enemigo.","en":"Living with fools is always painful, as [is living] with an enemy."}],"notas":[],"avisos_en":[]},{"id":"samam","lema":"samaṃ","cab":{"es":"**samaṃ**, (= sc.) (adv., part. 3ª inflexión) Igualmente; igual, similar; junto con.","en":"**samaṃ**, (= Skt.) (adv., particle, 3rd case) Equally; equal, similar; together with."},"caso":["3"],"nir":"","bloques":[{"tipo":"txt","es":"En la tercera inflexión:","en":"In the third case:"},{"tipo":"ej","pali":"sahassena samaṃ mitā","ref":"S. i 18","es":"un valor similar a mil.","en":"Measured as equal to a thousand."},{"tipo":"ej","pali":"tassābhisekena samaṃ","ref":"Mahāvaṃsa V 23","es":"a partir de su consagración.","en":"Simultaneously with his consecration."},{"tipo":"txt","es":"Acción simultánea (*samakriyā*).","en":"Simultaneous action (*samakriyā*)."},{"tipo":"ej","pali":"samaṃ devehi","ref":"D.ii 229","es":"junto con devas. Aquí **samaṃ** tiene el mismo significado que **saddhiṃ**.","en":"Together with the devas. Here **samaṃ** has the same meaning as **saddhiṃ**."}],"notas":[],"avisos_en":["block 2: Spanish «a partir de su consagración» ('from his consecration onward'); *samaṃ* + instr. means 'at the same time as / together with his consecration'."]},{"id":"samantato","lema":"samantato","cab":{"es":"**samantato**, (sc. *samanta*) (part. usada en la 7ª inflexión) En todas partes; todo alrededor; en todos los lados; cerca (*samīpa*).","en":"**samantato**, (Skt. *samanta*) (particle used in the 7th case) Everywhere; all around; on all sides; near (*samīpa*)."},"caso":["7"],"nir":"5","bloques":[{"tipo":"ej","pali":"samantato dvādasa yojanāni","ref":"D. ii 115","es":"doce leguas todo alrededor.","en":"Twelve yojanas all around."}],"notas":[],"avisos_en":[]},{"id":"samanta","lema":"samantā","cab":{"es":"**samantā**, (sc. *samanta*) (part. usada en la 7ª inflexión) En todas partes (*sabbadhi*); todo alrededor; en todos los lados. Véase **sāmantā**.","en":"**samantā**, (Skt. *samanta*) (particle used in the 7th case) Everywhere (*sabbadhi*); all around; on all sides. See **sāmantā**."},"caso":["7"],"nir":"5","bloques":[{"tipo":"ej","pali":"samantā vesāliṃ","ref":"D. ii 84","es":"alrededor de Vesālī.","en":"All around Vesālī."},{"tipo":"ej","pali":"samantā yojanaṃ passati divā c’ eva rattiñ ca","ref":"D. ii 17","es":"ve por una legua todo alrededor día y noche.","en":"He sees for a yojana all around, by day and by night."}],"notas":[],"avisos_en":[]},{"id":"sampati","lema":"sampati","cab":{"es":"**sampati**, (sc. *samprati*) (part. usada en la 7ª inflexión —tiempo) Ahora (*idāni*); ahora mismo; en este momento; recién.","en":"**sampati**, (Skt. *samprati*) (particle used in the 7th case — time) Now (*idāni*); right now; at this moment; just."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sampatijāto bodhisatto","ref":"D. ii 13","es":"el Bodhisatta recién nacido.","en":"The Bodhisatta, just born."}],"notas":[],"avisos_en":[]},{"id":"samma","lema":"samma","cab":{"es":"**samma**, (sc. śam) (part. voc., sg.) ¡Amigo! ¡Querido! Término familiar para dirigirse a amigos, iguales e inferiores.","en":"**samma**, (Skt. śam) (particle, voc., sg.) Friend! Dear! A familiar term for addressing friends, equals and inferiors."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"ehi tvaṃ samma vissakamma","ref":"D. ii 148","es":"venga amigo Vissakamma.","en":"Come, friend Vissakamma."},{"tipo":"ej","pali":"ajjatagge, samma dovārika, āvarāmi dvāraṃ nigaṇṭhānaṃ nigaṇṭhīnaṃ","ref":"M. ii 43","es":"Buen portero, a partir de hoy, cierro la puerta a los Nigaṇṭhas y las Nigaṇṭhīs. Aquí **samma** es usado por un superior a un inferior.","en":"From today on, good doorkeeper, I close the door to the Nigaṇṭhas and the Nigaṇṭhīs. Here **samma** is used by a superior to an inferior."}],"notas":[],"avisos_en":[]},{"id":"samma-2","lema":"sammā","cab":{"es":"**sammā**,<sup>1<\/sup> (sc. *śam*) (part. voc., pl.) ¡Amigos! ¡Queridos! Término familiar para dirigirse a amigos, iguales e inferiores.","en":"**sammā**,<sup>1<\/sup> (Skt. *śam*) (particle, voc., pl.) Friends! Dear ones! A familiar term for addressing friends, equals and inferiors."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"sammā mayaṃ aññaṃ kiñci na karissāma","ref":"DhA. i 287","es":"amigos, nosotros no haremos ninguna otra cosa.","en":"Friends, we will not do anything else."}],"notas":[],"avisos_en":[]},{"id":"samma-3","lema":"sammā","cab":{"es":"**sammā**,<sup>2<\/sup> (sc. *samyak*) (part. 3ª inflexión) correctamente; propiamente; adecuadamente; debidamente; completamente; claramente.","en":"**sammā**,<sup>2<\/sup> (Skt. *samyak*) (particle, 3rd case) correctly; properly; fittingly; duly; completely; clearly."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"sammā-sam-buddho","ref":"D. ii 2","es":"el completamente Iluminado. Aquí **sammā** significa correctamente (*aviparītena*) y **sam**, por sí mismo (*attanā*).","en":"the Rightly Self-Awakened One. Here **sammā** means correctly (*aviparītena*) and **sam**, by oneself (*attanā*)."},{"tipo":"ej","pali":"sammā dhammaṃ vipassato","ref":"Dh. 67","es":"de aquel que penetra el dhamma claramente.","en":"Of one who rightly sees the Dhamma with insight."}],"notas":[],"avisos_en":["block 0: reference (D. ii 2) sits inside the Spanish text (ref field empty); kept in the English. Rendering as in entry 'sam'."]},{"id":"sammukha","lema":"sammukhā","cab":{"es":"**sammukhā**, (= sc.) (part. 7ª inflexión) Cara a cara; de frente; en la presencia.","en":"**sammukhā**, (= Skt.) (particle, 7th case) Face to face; in front; in the presence."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sammukhā m’ etaṃ, bhante, bhagavato sutaṃ","ref":"D. ii 96","es":"Venerable Señor he oído esto en la presencia del Sublime (lit. cara a cara).","en":"Venerable Sir, I heard this in the presence of the Blessed One (lit. face to face)."}],"notas":[],"avisos_en":[]},{"id":"sayam","lema":"sayaṃ","cab":{"es":"**sayaṃ**, (sc. *svayaṃ*) (adv., part. 3ª inflexión) Uno mismo; por uno mismo. También **sāmaṃ**.","en":"**sayaṃ**, (Skt. *svayaṃ*) (adv., particle, 3rd case) Oneself; by oneself. Also **sāmaṃ**."},"caso":["3"],"nir":"1·3","bloques":[{"tipo":"ej","pali":"sayaṃ abhiññāya kam uddiseyyaṃ","ref":"M. i 227","es":"habiendo realizado por mí mismo, ¿a quién señalaría (como mi maestro)?.","en":"Having directly known [it] by myself, whom should I point to [as my teacher]?"}],"notas":[],"avisos_en":[]},{"id":"sasakkam","lema":"sasakkaṃ","cab":{"es":"**sasakkaṃ**, (sc. *sa + sakkaṃ*) (adv.) Ciertamente, realmente, verdaderamente, evidentemente, definitivamente; en el significado de definitivo, certeza (*ekaṃsattha*).","en":"**sasakkaṃ**, (Skt. *sa + sakkaṃ*) (adv.) Certainly, really, truly, evidently, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"evarūpaṃ te, rāhula, kāyena kammaṃ sasakkaṃ na karaṇīyaṃ","ref":"M. ii 79","es":"ciertamente Rāhula, tú no debes realizar este tipo de acción corporal.","en":"Certainly, Rāhula, you should not do a bodily action of such a kind."}],"notas":[],"avisos_en":[]},{"id":"saha","lema":"saha","cab":{"es":"**saha**, (= sc.) (prep., part. 3ª inflexión) Con, junto a. Puede formar la primera parte de un compuesto. Existe en los siguientes significados:","en":"**saha**, (= Skt.) (prep., particle, 3rd case) With, together with. It can form the first member of a compound. It is used in the following senses:"},"caso":["3"],"nir":"","bloques":[{"tipo":"txt","es":"Acción simultánea (*samakriyā*):","en":"Simultaneous action (*samakriyā*):"},{"tipo":"ej","pali":"puttena saha āgato","ref":"","es":"ha venido con su hijo.","en":"He has come with his son."},{"tipo":"txt","es":"Dotado con (*sampanna*):","en":"Endowed with (*sampanna*):"},{"tipo":"ej","pali":"saha vatthehi sobhati","ref":"T. i 325","es":"resplandece con los atuendos.","en":"It shines with [its] garments."},{"tipo":"txt","es":"En el sentido de la tercera inflexión:","en":"In the sense of the third case:"},{"tipo":"ej","pali":"saṃgho saha vā gaggena vinā vā gaggena uposathaṃ karissati","ref":"V. iii 166","es":"La Orden hará Uposatha con Gagga o sin Gagga.","en":"The Order will hold the Uposatha with Gagga or without Gagga."},{"tipo":"txt","es":"En forma abreviada como primera parte de un compuesto:","en":"In abbreviated form as the first member of a compound:"},{"tipo":"ej","pali":"saphala","ref":"","es":"con fruto; fructífero. Aquí **saha** está presente en su forma abreviada **sa**.","en":"With fruit; fruitful. Here **saha** is present in its abbreviated form **sa**."},{"tipo":"ej","pali":"sahaseyyā","ref":"","es":"compartiendo el cuarto.","en":"Sharing a sleeping place."}],"notas":[],"avisos_en":[]},{"id":"sadhu","lema":"sādhu","cab":{"es":"**sādhu**, (= sc.) Bien; muy bien; excelente; sí; está bien; sería bueno. Existe en los siguientes significados:","en":"**sādhu**, (= Skt.) Good; very good; excellent; yes; all right; it would be good. It is used in the following senses:"},"caso":[],"nir":"1","bloques":[{"tipo":"txt","es":"Asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*):","en":"Assent; affirmative reply; acceptance (*sampaṭicchana*):"},{"tipo":"ej","pali":"sādhū ti vatvāna pahūtakāmo, pakkāmi yakkho vidhurena saddhiṃ","ref":"J. ii 288","es":"habiendo dicho “sí”, el Yakkha, deseoso de abundancia, se marchó con Vidhura.","en":"Having said “Very well”, the yakkha, rich in sense pleasures, departed together with Vidhura."},{"tipo":"txt","es":"Elogio (*pasaṃsana*):","en":"Praise (*pasaṃsana*):"},{"tipo":"ej","pali":"sādhu sādhu, sāriputta","ref":"D. iii 226","es":"¡muy bien, muy bien, Sāriputta!","en":"Excellent, excellent, Sāriputta!"},{"tipo":"txt","es":"Petición, solicitud (*yācana*):","en":"Request, entreaty (*yācana*):"},{"tipo":"ej","pali":"sādhu me, bhante, bhagavā saṃkhittena dhammaṃ desetu","ref":"S. ii 61","es":"Venerable Señor, sería bueno que el Sublime me enseñe el Dhamma en breve.","en":"Venerable Sir, it would be good if the Blessed One would teach me the Dhamma in brief."},{"tipo":"txt","es":"Regocijo; apreciación (*anumodana*):","en":"Rejoicing; appreciation (*anumodana*):"},{"tipo":"ej","pali":"sādhu te kataṃ","ref":"DhA. ii 195","es":"bien hecho por ti [has hecho bien].","en":"Well done by you [you have done well]."}],"notas":[],"avisos_en":["block 1: *pahūtakāmo* — Spanish «deseoso de abundancia» ('desirous of abundance'); I take it as 'having abundant sense pleasures/wealth' (bahuvrīhi); uncertain."]},{"id":"samam-2","lema":"sāmaṃ","cab":{"es":"**sāmaṃ**, (adv., part. 3ª inflexión) Uno mismo; por uno mismo. Véase **sayaṃ**.","en":"**sāmaṃ**, (adv., particle, 3rd case) Oneself; by oneself. See **sayaṃ**."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"sāmaṃ saccāni abhisambujjhi","ref":"Ps. 172","es":"descubrió las verdades por sí mismo.","en":"He fully awakened to the truths by himself."}],"notas":[],"avisos_en":[]},{"id":"samanta-2","lema":"sāmantā","cab":{"es":"**sāmantā**, (sc. *samanta*) (part. usada en la 7ª inflexión) En todas partes (*samantato*); todo alrededor; en todos los lados; cerca. Véase **samantā** y **parito**.","en":"**sāmantā**, (Skt. *samanta*) (particle used in the 7th case) Everywhere (*samantato*); all around; on all sides; near. See **samantā** and **parito**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"assamassa sāmantā ekarattiṃ vasitvā pakkāmi","ref":"D. ii 270","es":"después de residir por una noche cerca de la morada del ermitaño se marchó.","en":"Having stayed one night near the hermitage, he departed."}],"notas":[],"avisos_en":[]},{"id":"sayam-2","lema":"sāyaṃ","cab":{"es":"**sāyaṃ** (= sc.) (part. usada en la 7ª inflexión —tiempo) Atardecer; en el atardecer (*atthaṅgatasamaye*).","en":"**sāyaṃ** (= Skt.) (particle used in the 7th case — time) Evening; in the evening (*atthaṅgatasamaye*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pāto anusiṭṭho sāyaṃ visesaṃ adhigamissati","ref":"M. ii 300","es":"instruido en el amanecer obtendrá distinción en el atardecer.","en":"Instructed in the morning, he will attain distinction in the evening."}],"notas":[],"avisos_en":[]},{"id":"sahu","lema":"sāhu","cab":{"es":"**sāhu**, (sc. de *sādhu*) Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien. Véase **sādhu**.","en":"**sāhu**, (Skt. from *sādhu*) Particle of assent; affirmative reply; acceptance (*sampaṭicchana*). Yes; good; all right. See **sādhu**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sāhū ti","ref":"V. iii 57","es":"sí.","en":"“Yes.”"}],"notas":[],"avisos_en":["block 0: reference (V. iii 57) sits inside the Spanish text (ref field empty); kept in the English."]},{"id":"su","lema":"su","cab":{"es":"**su**, prefijo usado en el significado de rápido (*sīgha*). También usado como mera partícula (*nipātamatta*) o expletivo (*padapūraṇa*).","en":"**su**, prefix used in the sense of quick (*sīgha*). Also used as a mere particle (*nipātamatta*) or expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"sutthu","lema":"suṭṭhu","cab":{"es":"**suṭṭhu**, (sc. *suṣṭhu*) Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*) y para expresar regocijo. Sí; bien; muy bien; ¡qué bien!; está bien.","en":"**suṭṭhu**, (Skt. *suṣṭhu*) Particle of assent; affirmative reply; acceptance (*sampaṭicchana*), and for expressing rejoicing. Yes; good; very good; how good!; all right."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*):","en":"Assent; affirmative reply; acceptance (*sampaṭicchana*):"},{"tipo":"ej","pali":"sādhu suṭṭhu saṃvarissāmi","ref":"VA. iii 345","es":"bien, muy bien, me contendré.","en":"Good, very well, I will restrain myself."},{"tipo":"txt","es":"Regocijo; apreciación (*anumodana*):","en":"Rejoicing; appreciation (*anumodana*):"},{"tipo":"ej","pali":"sādhu suṭṭhū ti","ref":"DA. iii 182","es":"¡bien, muy bien!","en":"“Good, very good!”"}],"notas":[],"avisos_en":[]},{"id":"sudam","lema":"sudaṃ","cab":{"es":"**sudaṃ**, (sc. *svid*) (part.) Expletivo (*padapūraṇa*).","en":"**sudaṃ**, (Skt. *svid*) (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"suvatthi","lema":"suvatthi","cab":{"es":"**suvatthi**, (sc. *svasti*) part. usada para expresar un deseo, aspiración o bendición (*āsīsanattha*). Bienestar; felicidad. Véase **sotthi**.","en":"**suvatthi**, (Skt. *svasti*) particle used to express a wish, aspiration or blessing (*āsīsanattha*). Well-being; happiness. See **sotthi**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"etena saccena suvatthi hotu","ref":"Khp. 5","es":"por esta verdad que haya felicidad.","en":"By this truth may there be well-being."}],"notas":[],"avisos_en":[]},{"id":"suve","lema":"suve","cab":{"es":"**suve**, (sc. *śvas*) (part. usada en la 7ª inflexión —tiempo) Mañana. Véase **sve**.","en":"**suve**, (Skt. *śvas*) (particle used in the 7th case — time) Tomorrow. See **sve**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ko jaññā maraṇaṃ suve","ref":"M. iii 226","es":"mañana la muerte, ¿quién sabe?","en":"Who knows whether death [will come] tomorrow?"}],"notas":[],"avisos_en":[]},{"id":"seyyatha-pi","lema":"seyyathā pi","cab":{"es":"**seyyathā pi**, (sc. *taṃ + yathā*) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera.","en":"**seyyathā pi**, (Skt. *taṃ + yathā*) It is used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"seyyathā pi, bhikkhave, mahārukkho","ref":"S. i 314","es":"bhikkhus, así como un gran árbol.","en":"Just as, bhikkhus, a great tree…"}],"notas":[],"avisos_en":[]},{"id":"seyyatha-pi-nama","lema":"seyyathā pi nāma","cab":{"es":"**seyyathā pi nāma**, Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera.","en":"**seyyathā pi nāma**, It is used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"seyyathā pi nāma balavā puriso samiñjitaṃ vā bāhaṃ pasāreyya, pasāritaṃ vā bāhaṃ samiñjeyya","ref":"D. ii 76","es":"así como un hombre fornido extendiera su brazo doblado o encogiera su brazo extendido.","en":"Just as a strong man might stretch out his bent arm or bend his outstretched arm."}],"notas":[],"avisos_en":[]},{"id":"seyyathidam","lema":"seyyathidaṃ","cab":{"es":"**seyyathidaṃ**, **seyyathīdaṃ**, (part.) Como sigue; es decir; a saber. Existe en los siguientes significados:","en":"**seyyathidaṃ**, **seyyathīdaṃ**, (particle) As follows; that is; namely. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Cuál es éste *(taṃ katamaṃ*). En este uso esta partícula puede significar cualquiera de los tres géneros y de los dos números.","en":"Which is this *(taṃ katamaṃ*). In this use the particle can stand for any of the three genders and either of the two numbers."},{"tipo":"ej","pali":"santi, bhante, aññāni mahānagarāni, seyyathidaṃ: campā rājagahaṃ sāvatthī sāketaṃ kosambī bārāṇasī","ref":"D. ii 121","es":"hay, Venerable Señor, otras grandes ciudades, a saber, Campā, Rājagaha, Sāvatthī, Sāketa, Kosambī y Bārāṇasī.","en":"There are, Venerable Sir, other great cities, namely: Campā, Rājagaha, Sāvatthī, Sāketa, Kosambī and Bārāṇ       u.xs.map(x=>`<a href="#${x.id}" data-c="${x.id}"><i>${md(x.lema)}</i></a>`).join('')+'</details>';
  });
  document.getElementById('out').innerHTML=h;document.getElementById('sb-list').innerHTML=sb;
  document.querySelectorAll('#sb-list .sb-sec').forEach(d=>d.addEventListener('toggle',()=>{abiertos[d.dataset.g]=d.open}));
  document.querySelectorAll('#out .card').forEach(c=>{c.dataset.t=norm(c.textContent).replace(/\s+/g,' ')});
  filtrar();
}
let caso='all';
function filtrar(){
  const q=norm(document.getElementById('q').value.trim());let n=0;
  document.querySelectorAll('#out .card').forEach(c=>{const ok=(caso==='all'||c.dataset.c.split(' ').includes(caso))&&(!q||c.dataset.t.includes(q));c.hidden=!ok;if(ok)n++});
  document.querySelectorAll('#out section.grp').forEach(s=>{s.hidden=!s.querySelector('.card:not([hidden])')});
  document.querySelectorAll('#sb-list .sb-sec').forEach(d=>{let v=0;d.querySelectorAll('a[data-c]').forEach(a=>{const el=document.getElementById(a.dataset.c);const ok=!!el&&!el.hidden;a.hidden=!ok;if(ok)v++});d.hidden=!v;d.querySelector('.n').textContent=v});
  document.getElementById('count').textContent=T[lang].rows(n);
  document.getElementById('empty').hidden=!!n;
  espiar();
}
document.getElementById('q').addEventListener('input',filtrar);
document.getElementById('f-caso').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;caso=b.dataset.v;
  document.querySelectorAll('#f-caso button').forEach(x=>x.setAttribute('aria-pressed',x===b));filtrar()});
document.getElementById('lang-btn').onclick=()=>{lang=lang==='en'?'es':'en';store.set('pali_lang',lang);textos();render()};
/* tema, compartido con el sitio (pali_dark) */
const saved=store.get('pali_dark');
if(saved==='1'||(saved===null&&mq('(prefers-color-scheme: dark)'))) root.dataset.theme='dark';
document.getElementById('theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'':'dark';store.set('pali_dark',root.dataset.theme==='dark'?'1':'0')};

/* barra lateral (como en /recursos/casos/) */
const sbEl=document.getElementById('sidebar'),scr=document.getElementById('scrim'),burger=document.getElementById('burger'),barEl=document.getElementById('bar');
const ancha=()=>innerWidth>900;
function medirBarra(){root.style.setProperty('--barh',barEl.offsetHeight+'px')}
medirBarra();addEventListener('resize',medirBarra);
if(window.ResizeObserver)new ResizeObserver(medirBarra).observe(barEl);
const cerrarSb=()=>{sbEl.classList.remove('open');scr.classList.remove('on')};
function pintarBarra(oc){root.classList.toggle('sin-barra',oc)} /* aria de los ☰: cabecera.js (rotularIndice) */
burger.onclick=()=>{if(ancha())pintarBarra(!root.classList.contains('sin-barra'));else{sbEl.classList.toggle('open');scr.classList.toggle('on')}};
document.getElementById('sbclose').onclick=()=>{if(ancha())pintarBarra(true);else cerrarSb()};
document.getElementById('volver-barra').onclick=()=>pintarBarra(false);
document.getElementById('sb-abrir').onclick=()=>document.querySelectorAll('#sb-list .sb-sec').forEach(d=>d.open=true);
document.getElementById('sb-plegar').onclick=()=>document.querySelectorAll('#sb-list .sb-sec').forEach(d=>d.open=false);
addEventListener('resize',()=>{if(!ancha())root.classList.remove('sin-barra')});
scr.onclick=cerrarSb;
addEventListener('keydown',e=>{if(e.key==='Escape')cerrarSb()});
sbEl.addEventListener('click',e=>{if(e.target.closest('a')&&!ancha())cerrarSb()});
/* el índice sigue la lectura */
let spyF=0;
function espiar(){
  const links=document.querySelectorAll('#sb-list a[data-c]');let cur=null;const lim=barEl.getBoundingClientRect().bottom+40;
  for(const a of links){if(a.hidden)continue;const el=document.getElementById(a.dataset.c);if(!el)continue;if(el.getBoundingClientRect().top<=lim)cur=a;else break}
  links.forEach(a=>a.classList.toggle('on',a===cur));
  document.querySelectorAll('#sb-list .sb-sec').forEach(d=>d.classList.toggle('on',!!cur&&d.contains(cur)));
  if(cur&&cur.closest('details').open){const r=cur.getBoundingClientRect(),s=sbEl.getBoundingClientRect();
    if(r.top<s.top+60||r.bottom>s.bottom-20) sbEl.scrollTop+=r.top-s.top-s.height/3}
}
const topBtn=document.getElementById('top-btn');
addEventListener('scroll',()=>{topBtn.classList.toggle('show',scrollY>600);if(!spyF)spyF=requestAnimationFrame(()=>{spyF=0;espiar()})},{passive:true});
topBtn.onclick=()=>scrollTo({top:0});

textos();render();
if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)setTimeout(()=>t.scrollIntoView(),0)}
})();
</script>
