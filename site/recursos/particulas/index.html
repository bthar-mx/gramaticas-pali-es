ado en la 7ª inflexión)","en":"**tra**, (suffix used in the 7th case)"},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"yatra","ref":"","es":"donde.","en":"where."},{"tipo":"ej","pali":"tatra","ref":"","es":"allí; en ese lugar.","en":"there; in that place."}],"notas":[],"avisos_en":[]},{"id":"tva","lema":"tvā","cab":{"es":"**tvā**, (sufijo) cuando hay dos acciones en la oración, la acción primaria y la acción secundaria, este sufijo se aplica al verbo que representa la acción secundaria. Véase también **tuna** y **tvāna**.","en":"**tvā**, (suffix) when there are two actions in the sentence, the primary action and the secondary action, this suffix is applied to the verb that represents the secondary action. See also **tuna** and **tvāna**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"disvā","ref":"","es":"habiendo visto o después de haber visto.","en":"Having seen or after having seen."},{"tipo":"ej","pali":"datvā","ref":"","es":"habiendo dado o después de haber dado.","en":"Having given or after having given."}],"notas":[],"avisos_en":[]},{"id":"tvana","lema":"tvāna","cab":{"es":"**tvāna**, (sufijo), cuando hay dos acciones en la oración, la acción primaria y la acción secundaria, este sufijo se aplica al verbo que representa la acción secundaria. Véase también **tuna** y **tvā**.","en":"**tvāna**, (suffix): when there are two actions in the sentence, a primary action and a secondary action, this suffix is applied to the verb expressing the secondary action. See also **tuna** and **tvā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"disvāna","ref":"","es":"habiendo visto/después de haber visto.","en":"having seen / after having seen."},{"tipo":"ej","pali":"datvāna","ref":"","es":"habiendo dado/después de haber dado.","en":"having given / after having given."}],"notas":[],"avisos_en":[]},{"id":"tha","lema":"thā","cab":{"es":"**thā**, (sufijo usado en la 7ª inflexión) Se usa con relación a lugar y tiempo.","en":"**thā**, (suffix used in the 7th case) Used with reference to place and time."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sabbathā","ref":"","es":"en todas las formas, de todas las formas.","en":"in every way; in all ways."}],"notas":[],"avisos_en":["block 0: sabbathā is an adverb of manner ('in every way'), which does not illustrate the place/time sense stated in the heading; translated as is."]},{"id":"dani","lema":"dāni","cab":{"es":"**dāni**, véase **idāni**.","en":"**dāni**, see **idāni**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"diva","lema":"divā","cab":{"es":"**divā**, (= sc.) (Adv., part. 1ª , 2ª y 7ª (tiempo) inflexión) Día; durante el día; en el día.","en":"**divā**, (= Skt.) (adv., particle in the 1st, 2nd and 7th (time) case) Day; during the day; by day."},"caso":["1","2","7"],"nir":"","bloques":[{"tipo":"txt","es":"En la 1ª inflexión:","en":"In the 1st case:"},{"tipo":"ej","pali":"rattiṃ yeva samānaṃ divā ti sañjānanti","ref":"M. i 26","es":"perciben la noche, siendo noche, como día.","en":"they perceive the night, while it is night, as day."},{"tipo":"txt","es":"En la 2ª inflexión:","en":"In the 2nd case:"},{"tipo":"ej","pali":"divā yeva samānaṃ rattī ti sañjānanti","ref":"M. i 26","es":"perciben el día, siendo día, como noche.","en":"they perceive the day, while it is day, as night."},{"tipo":"txt","es":"En la 7ª inflexión:","en":"In the 7th case:"},{"tipo":"ej","pali":"yaṃ divā pāpakammaṃ kataṃ hoti, taṃ sāyaṃ nhānena pavāhemi","ref":"S. i 185","es":"la mala acción que he hecho durante el día, la elimino en la tarde por medio del baño.","en":"the evil deed that has been done by day, I wash away in the evening by bathing."}],"notas":[],"avisos_en":[]},{"id":"dutthu","lema":"duṭṭhu","cab":{"es":"**duṭṭhu**, (sc. *duṣṭhu*) Denota repugnancia (*jigucchā*), que es despreciable, vil (*kucchita*). Mal; malo.","en":"**duṭṭhu**, (Skt. *duṣṭhu*) Denotes repugnance (*jigucchā*), that which is contemptible, vile (*kucchita*). Badly; bad."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"duṭṭhu kataṃ","ref":"","es":"mal hecho.","en":"badly done."}],"notas":[],"avisos_en":[]},{"id":"dha","lema":"dhā","cab":{"es":"**dhā**, (sufijo usado en la 3ª inflexión y partición de números (*saṅkhyāvibhāga*)).","en":"**dhā**, (suffix used in the 3rd case and in the distribution of numbers (*saṅkhyāvibhāga*))."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"ekadhā","ref":"","es":"en una forma; en un modo; en uno.","en":"in one way; in one manner; as one."},{"tipo":"ej","pali":"dvidhā","ref":"","es":"en dos formas; en dos modos; en dos.","en":"in two ways; in two manners; in two."}],"notas":[],"avisos_en":[]},{"id":"dhir-atthu","lema":"dhir atthu","cab":{"es":"**dhir atthu**, (sc. *dhik*) Interjección de reproche (*garaha*). ¡Vergüenza!","en":"**dhir atthu**, (Skt. *dhik*) Interjection of reproach (*garaha*). Shame!"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"dhir atthu taṃ janapadaṃ","ref":"J. i 4","es":"¡Vergüenza a ese país!","en":"Shame on that country!"}],"notas":[],"avisos_en":[]},{"id":"dhi","lema":"dhi","cab":{"es":"**dhi**, (sc. *dhik*) = **dhī**","en":"**dhi**, (Skt. *dhik*) = **dhī**"},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"dhi-2","lema":"dhī","cab":{"es":"**dhī**, (sc. *dhik*) Interjección de reproche (*garaha*).¡Vergüenza!","en":"**dhī**, (Skt. *dhik*) Interjection of reproach (*garaha*). Shame!"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"dhī, brāhmaṇassa hantāraṃ","ref":"Dh. 69","es":"¡Vergüenza a aquel que golpea a un brahmán!","en":"Shame on one who strikes a brahmin!"}],"notas":[],"avisos_en":[]},{"id":"dhuvam","lema":"dhuvaṃ","cab":{"es":"**dhuvaṃ**, (sc. *dhruva*) (adv.) Se usa en el significado de sólido, perdurable, firme (*thira*), para dar énfasis (*avadhāraṇa*) y expresar certidumbre (*ekaṃsa*). Ciertamente; constantemente; firmemente.","en":"**dhuvaṃ**, (Skt. *dhruva*) (adv.) Used in the sense of solid, lasting, firm (*thira*), for emphasis (*avadhāraṇa*), and to express certainty (*ekaṃsa*). Certainly; constantly; firmly."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yassa natthi dhuvaṃ ṭhiti","ref":"M. ii 252","es":"de éste ciertamente no hay nada estable.","en":"for which there is no lasting stability."},{"tipo":"ej","pali":"dhuvaṃ buddho bhavissati","ref":"Bv. 312","es":"ciertamente serás un Buddha","en":"he will certainly become a Buddha."}],"notas":[],"avisos_en":["block 0: Spanish takes dhuvaṃ as 'ciertamente' (certainly); in 'natthi dhuvaṃ ṭhiti' it more naturally qualifies ṭhiti ('no lasting/firm stability', the thira sense); English follows the Pāli.","block 1: Spanish 'serás' (2nd person), but bhavissati is 3rd sg.; English 'he will'. (The Bv. formula elsewhere has bhavissasi; worth checking the source reading.)"]},{"id":"na","lema":"na","cab":{"es":"**na**, (= sc.) (part. de neg.) No. Existe en los siguientes significados:","en":"**na**, (= Skt.) (negative particle) Not. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Negación (*paṭisedhana*):","en":"Negation (*paṭisedhana*):"},{"tipo":"ej","pali":"na hi verena verāni sammanti","ref":"Dh. 13","es":"el odio no se apacigua por medio del odio.","en":"for hatreds are not appeased by hatred."},{"tipo":"txt","es":"Comparación (*upamāna*):","en":"Comparison (*upamāna*):"},{"tipo":"ej","pali":"Yaṃ na kañcanadepiñcha, andhena tamasā gataṃ","ref":"J. ii 83","es":"oh ave de alas doradas, ida de la ciega oscuridad.","en":"like [you], O golden-winged bird, gone into blind darkness."}],"notas":[],"avisos_en":["block 3: uncertain reading/construal of 'Yaṃ na kañcanadepiñcha, andhena tamasā gataṃ'; Spanish 'ida de la ciega oscuridad' (gone FROM the darkness), whereas instr. andhena tamasā + gataṃ suggests 'gone into/overcome by blind darkness'. Needs checking against J. ii 83 and its commentary."]},{"id":"nam","lema":"naṃ","cab":{"es":"**naṃ**, (sc. *nū-naṃ*?) (part.) Expletivo (*padapūraṇa*).","en":"**naṃ**, (Skt. *nū-naṃ*?) (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"nattam","lema":"nattaṃ","cab":{"es":"**nattaṃ**, (sc. *naktam*) (part. usada en la 7ª inflexión —tiempo) Noche (*ratti*).","en":"**nattaṃ**, (Skt. *naktam*) (particle used in the 7th case —time) Night (*ratti*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"taṇhakkhayaṃ nattamahābhipassa","ref":"Sn. 440","es":"perciba la extinción del deseo día y noche. El compuesto *nattamahābhipassa* se descompone en *nattaṃ*, noche, *aho*, día, y *abhipassa*, imperativo 2ª persona singular de *abhipassati*, ver, considerar, buscar, esforzarse.","en":"contemplate the destruction of craving night and day. The compound *nattamahābhipassa* is analysed into *nattaṃ*, night, *aho*, day, and *abhipassa*, 2nd person singular imperative of *abhipassati*, to see, to consider, to seek, to strive."}],"notas":[],"avisos_en":[]},{"id":"nanu","lema":"nanu","cab":{"es":"**nanu**, (= sc.) Partícula de interrogación. Generalmente para hacer una pregunta donde se espera una respuesta afirmativa. ¿No es... ?","en":"**nanu**, (= Skt.) Interrogative particle. Generally used to ask a question to which an affirmative answer is expected. Is it not...?"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"nanu passasi devate","ref":"J. ii 160","es":"¿no ves, deva?","en":"do you not see, O deity?"},{"tipo":"ej","pali":"nanu tvaṃ, phagguna, kulaputto saddhā agārasmā anagāriyaṃ pabbajito","ref":"M. i 174","es":"¿no eres tú, Phagguna, un hijo de buena familia que ha abandonado por fe el hogar por el no-hogar?","en":"are you not, Phagguna, a son of good family who has gone forth out of faith from the home into homelessness?"}],"notas":[],"avisos_en":[]},{"id":"namo","lema":"namo","cab":{"es":"**namo**, (sc. *namas*) (part. de reverencia 1ª y 2ª inflexión) Homenaje; honor; respeto.","en":"**namo**, (Skt. *namas*) (particle of reverence, 1st and 2nd case) Homage; honour; respect."},"caso":["1","2"],"nir":"","bloques":[{"tipo":"txt","es":"En la 1ª inflexión:","en":"In the 1st case:"},{"tipo":"ej","pali":"namo te buddha vīr’ atthu, vippamutto ’si sabbadhi","ref":"S. i 48","es":"homenaje a ti, el Buddha; héroe, liberado en todas partes.","en":"homage be to you, Buddha, O hero; you are released in every respect."},{"tipo":"txt","es":"En la 2ª inflexión:","en":"In the 2nd case:"},{"tipo":"ej","pali":"namo karohi nāgassa","ref":"M. i 196","es":"hágale honor a la serpiente.","en":"pay homage to the nāga."}],"notas":[],"avisos_en":["block 3: Spanish 'serpiente'; English keeps 'nāga' (in M. i 143-4 the nāga in the anthill is a cobra standing for the arahant bhikkhu)."]},{"id":"nama","lema":"nāma","cab":{"es":"**nāma**, (= sc.) Partícula usada para expresar reproche (*garaha*), elogio (*pasaṃsana*), nombre (*saññā*), pregunta (*pañha*), énfasis.","en":"**nāma**, (= Skt.) Particle used to express reproach (*garaha*), praise (*pasaṃsana*), name (*saññā*), question (*pañha*), emphasis."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"atthi nāma, ānanda, theraṃ bhikkhuṃ vihesiyamānaṃ ajjhupekkhissatha","ref":"A. ii 170","es":"Ānanda, seréis indiferentes del venerable bhikkhu que está siendo puesto en dificultad.[^9]","en":"Ānanda, will you really look on with indifference while an elder bhikkhu is being harassed?[^9]"},{"tipo":"ej","pali":"ahaṃ bhante nāgo nāma","ref":"","es":"Venerable Señor, mi nombre es Nāga.","en":"Venerable Sir, I am called Nāga."},{"tipo":"ej","pali":"kiṃ nāma etaṃ","ref":"","es":"¿cuál es el nombre de esto?","en":"what is this called?"}],"notas":[{"n":"9","es":"**Atthi nāma** es una partícula que significa “no soportar” (*amarisanattha* = *asahanattha*). AA. iii 59.","en":"**Atthi nāma** is a particle meaning “not tolerating” (*amarisanattha* = *asahanattha*). AA. iii 59."}],"avisos_en":["block 0: Spanish is a plain statement ('seréis indiferentes'); English renders atthi nāma as an indignant question, in line with note 9 and the 'reproach' sense."]},{"id":"nanam","lema":"nānaṃ","cab":{"es":"**nānaṃ**, (sc. nānānam?) Partícula usada para significar diferenciación (*asadisa*).","en":"**nānaṃ**, (Skt. nānānam?) Particle used to signify differentiation (*asadisa*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"ekatthaṃ, byañjanam eva nānaṃ","ref":"S. i 291","es":"un mismo significado, pero diferentes nombres.","en":"the meaning is one; only the wording differs."}],"notas":[],"avisos_en":["block 0: Spanish 'diferentes nombres'; byañjana is 'wording/phrasing' rather than 'names'."]},{"id":"nana","lema":"nānā","cab":{"es":"**nānā**, (= sc.) Partícula que indica variedad de formas (*bahuppakāra*). Varias; diferentes.","en":"**nānā**, (= Skt.) Particle indicating a variety of kinds (*bahuppakāra*). Various; different."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"tumhe khvattha, vāseṭṭha, nānājaccā, nānānāmā, nānāgottā, nānākulā, agārasmā anagāriyaṃ pabbajitā","ref":"D. iii 69","es":"vosotros, Vāseṭṭha, de diferentes países, de diferentes nombres, de diferentes clanes, de diferentes familias, han renunciado del hogar a la vida sin hogar.","en":"you, Vāseṭṭha, of different births, different names, different clans, different families, have gone forth from the home into homelessness."}],"notas":[],"avisos_en":["block 0: Spanish 'de diferentes países' for nānājaccā; jacca = birth/caste, not country."]},{"id":"niccam","lema":"niccaṃ","cab":{"es":"**niccaṃ**, (sc. *nityam*) (part. usada en la 7ª inflexión —tiempo) Siempre; continuamente; constantemente (*satataṃ*).","en":"**niccaṃ**, (Skt. *nityam*) (particle used in the 7th case —time) Always; continually; constantly (*satataṃ*)."},"caso":["7"],"nir":"2","bloques":[{"tipo":"ej","pali":"niccaṃ daḷhaparakkamā","ref":"Dh. 16","es":"que siempre se esfuerzan.","en":"always firm in exertion."}],"notas":[],"avisos_en":[]},{"id":"nicam","lema":"nīcaṃ","cab":{"es":"**nīcaṃ**, (sc. *nīca*) (part. usada en la 7ª inflexión) Bajo; abajo; debajo.","en":"**nīcaṃ**, (Skt. *nīca*) (particle used in the 7th case) Low; below; beneath."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"nīcaṃ āsanaṃ gahetvā ekamantaṃ nisīdiṃsu","ref":"D. ii 75","es":"después de tomar un asiento bajo, se sentaron a un lado.","en":"having taken a low seat, they sat down to one side."}],"notas":[],"avisos_en":[]},{"id":"nu","lema":"nu","cab":{"es":"**nu**, (= sc.) (part. interrogativa) Se usa en los siguientes significados:","en":"**nu**, (= Skt.) (interrogative particle) It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Duda (*saṃsaya*):","en":"Doubt (*saṃsaya*):"},{"tipo":"ej","pali":"ahosiṃ nu kho ahaṃ atītam addhānaṃ","ref":"M. i 10","es":"¿existí en el pasado?","en":"did I exist in the past?"},{"tipo":"txt","es":"Pregunta (*pucchana*):","en":"Question (*pucchana*):"},{"tipo":"ej","pali":"ko nu tvam asi mārisa","ref":"D. ii 193","es":"¿quién es usted señor?","en":"who are you, sir?"},{"tipo":"ej","pali":"devī nu ’si tvaṃ uda mānusī nu","ref":"J. i 206","es":"¿eres tú una diosa o una mujer?","en":"are you a goddess or a human woman?"},{"tipo":"txt","es":"En el significado de la partícula **eva**, para dar énfasis:","en":"In the sense of the particle **eva**, for emphasis:"},{"tipo":"ej","pali":"māra diṭṭhigataṃ nu te","ref":"S. i 137","es":"Māra, ésta sólo es una concepción errónea tuya.","en":"Māra, this is just a wrong view of yours."},{"tipo":"txt","es":"En el significado de la partícula **nāma**:","en":"In the sense of the particle **nāma**:"},{"tipo":"ej","pali":"yaṃ nu gijjho yojanasataṃ, kuṇapāni avekkhati","ref":"J. i 41","es":"un buitre, verdaderamente, ve los cuerpos a más de cien leguas.","en":"a vulture, indeed, sees corpses a hundred yojanas away."}],"notas":[],"avisos_en":[]},{"id":"nuna","lema":"nūna","cab":{"es":"**nūna**, (sc. *nūnam*) Denota inferencia (*anumāna*), recuerdo (*anussaraṇa*), reflexión (*parivitakkana*), certeza (*ekaṃsa*). Ciertamente; realmente; supongo.","en":"**nūna**, (Skt. *nūnam*) Denotes inference (*anumāna*), recollection (*anussaraṇa*), reflection (*parivitakkana*), certainty (*ekaṃsa*). Certainly; truly; I suppose."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Inferencia (*anumāna*):","en":"Inference (*anumāna*):"},{"tipo":"ej","pali":"na hi nūna so orako dhammavinayo","ref":"D. ii 25","es":"ciertamente ésta no es una doctrina y disciplina inferior.","en":"surely that is no inferior doctrine and discipline."},{"tipo":"txt","es":"Recuerdo (*anussaraṇa*):","en":"Recollection (*anussaraṇa*):"},{"tipo":"ej","pali":"aho nūna bhagavā, aho nūna sugato, yo imesaṃ dhammānaṃ sukusalo","ref":"D. i 169","es":"¡ah, realmente, el Sublime!, ¡ah realmente el Afortunado!, él es hábil en estas doctrinas. En este contexto la persona que pronuncia estas palabras, al escuchar otras doctrinas, está recordando la enseñanza del Buddha.","en":"ah, surely the Blessed One! Ah, surely the Well-Gone One, who is so skilled in these teachings! In this context the person uttering these words, on hearing other doctrines, is recalling the teaching of the Buddha."},{"tipo":"txt","es":"Reflexión (*parivitakkana*):","en":"Reflection (*parivitakkana*):"},{"tipo":"ej","pali":"yaṃ nūnāhaṃ imaṃ samaṇaṃ jīvitā voropeyyaṃ","ref":"M. ii 302","es":"y si tomo la vida [= lo mato] de este asceta.","en":"what if I were to deprive this ascetic of life [= kill him]?"},{"tipo":"txt","es":"Certeza (*ekaṃsa*):","en":"Certainty (*ekaṃsa*):"},{"tipo":"ej","pali":"nirayaṃ nūna gacchāmi, ettha me natthi saṃsayo","ref":"J. ii 177","es":"ciertamente voy al infierno. No tengo duda de esto.","en":"surely I am going to hell; of this I have no doubt."}],"notas":[],"avisos_en":[]},{"id":"no","lema":"no","cab":{"es":"**no**, (= sc.) (part. de neg.) No. Existe en los siguientes significados:","en":"**no**, (= Skt.) (negative particle) Not. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Negación (*paṭisedhana*):","en":"Negation (*paṭisedhana*):"},{"tipo":"ej","pali":"no h’ etaṃ bhante","ref":"D. i 57","es":"ciertamente no Señor.","en":"indeed not, Venerable Sir."},{"tipo":"txt","es":"Pregunta (*pucchā*):","en":"Question (*pucchā*):"},{"tipo":"ej","pali":"Abhijānāsi no tvaṃ, mahārāja, imaṃ pañhaṃ aññe samaṇabrāhmaṇe pucchitā ti","ref":"D. i 48","es":"¿usted recuerda, oh rey, haber hecho esta pregunta a otros ascetas y brahmanes?","en":"do you recall, great king, having asked this question of other ascetics and brahmins?"},{"tipo":"txt","es":"Énfasis (*avadhāraṇa*):","en":"Emphasis (*avadhāraṇa*):"},{"tipo":"ej","pali":"na no samaṃ atthi Tathāgatena","ref":"Khu i 5","es":"no hay ninguno igual al Tathāgata. Aquí hay dos partículas negativas, **na** y **no**; **no** se usa para dar énfasis.","en":"there is none equal to the Tathāgata. Here there are two negative particles, **na** and **no**; **no** is used for emphasis."}],"notas":[],"avisos_en":[]},{"id":"paccattam","lema":"paccattaṃ","cab":{"es":"**paccattaṃ**, (sc. *pratyātmam*) (adv., part. 3ª inflexión) Individualmente, por uno mismo; separadamente.","en":"**paccattaṃ**, (Skt. *pratyātmam*) (adv., particle in the 3rd case) Individually, by oneself; separately."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"paccattaṃ veditabbo viññūhi","ref":"D. ii 80","es":"puede ser experimentado por los sabios individualmente.","en":"to be experienced by the wise, each for himself."},{"tipo":"ej","pali":"suddhī asuddhi paccattaṃ","ref":"Dh. 38","es":"la pureza o la contaminación dependen de uno mismo.","en":"purity and impurity depend on oneself."}],"notas":[],"avisos_en":[]},{"id":"paccha","lema":"pacchā","cab":{"es":"**pacchā**, (sc. *paścāt*) (part. usada en la 7ª inflexión) Después; en seguida; no antes (*apure*).","en":"**pacchā**, (Skt. *paścāt*) (particle used in the 7th case) After; afterwards; not before (*apure*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"mā pacchā vippaṭisārino ahuvattha","ref":"D. ii 122","es":"que vosotros no tengáis rem Found only in Rū. 134. There are no examples."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"parajju","lema":"parajju","cab":{"es":"**parajju**, véase **parajja**.","en":"**parajju**, see **parajja**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"parammukha","lema":"parammukhā","cab":{"es":"**parammukhā**, (sc. *parāṅ-mukha*) (part. usada en la 7ª inflexión) En la ausencia; lo opuesto de cara a cara.","en":"**parammukhā**, (Skt. *parāṅ-mukha*) (particle used in the 7th case) In [someone's] absence; the opposite of face to face."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"parammukhā dūtaṃ vā sāsanaṃ vā pesento anusāsati nāma","ref":"DhA. i 349","es":"cuando uno habla indirectamente (*parammukhā*), enviando un mensaje o mensajero, uno aconseja.","en":"when one, in [the person's] absence (*parammukhā*), sends a messenger or a message, one is said to advise."}],"notas":[],"avisos_en":[]},{"id":"parasuve","lema":"parasuve","cab":{"es":"**parasuve**, (sc. paraśvas) (part. usada en la 7ª inflexión —tiempo) Pasado mañana.","en":"**parasuve**, (Skt. paraśvas) (particle used in the 7th case —time) The day after tomorrow."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sve vā parasuve vā sāmāvatiyā pāsādatalaṃ gamissati","ref":"DhA. i 138","es":"mañana o pasado mañana él irá al piso superior de la mansión de Sāmāvatī.","en":"tomorrow or the day after tomorrow he will go to the upper floor of Sāmāvatī's mansion."}],"notas":[],"avisos_en":[]},{"id":"parito","lema":"parito","cab":{"es":"**parito**, (sc. *paritaḥ*) (part. usada en la 7ª inflexión) En todas partes (*samantato*); todo alrededor; en todos los lados. Véase **sāmantā**.","en":"**parito**, (Skt. *paritaḥ*) (particle used in the 7th case) Everywhere (*samantato*); all around; on all sides. See **sāmantā**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"api ’ssudam parito gāmesu manussā evam āhaṃsu","ref":"D. ii 212","es":"hasta tal grado que los hombres en los poblados de alrededor decían...","en":"so much so that people in the surrounding villages said..."}],"notas":[],"avisos_en":[]},{"id":"pare","lema":"pare","cab":{"es":"**pare**, (sc. ?) (part. usada en la 7ª inflexión —tiempo) Ayer; en el día pasado (*atītadine*).","en":"**pare**, (Skt. ?) (particle used in the 7th case —time) Yesterday; on the past day (*atītadine*)."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"patam","lema":"pātaṃ","cab":{"es":"**pātaṃ**, véase **pāto**.","en":"**pātaṃ**, see **pāto**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"pato","lema":"pāto","cab":{"es":"**pāto**, (sc. *prātar*) (part. usada en la 7ª inflexión —tiempo) Amanecer; en el amanecer (*pabhāte*).","en":"**pāto**, (Skt. *prātar*) (particle used in the 7th case —time) Dawn; at dawn (*pabhāte*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sāyaṃ sāyamāsāya pāto pātarāsāya bhikkhaṃ pariyesanti","ref":"A. ii 196","es":"ellos buscan la comida para la cena en el atardecer y para el almuerzo en el amanecer.","en":"in the evening they seek alms for the evening meal, and at dawn for the morning meal."},{"tipo":"sub","es":"**pāto ’va**, bien temprano.","en":"**pāto ’va**, very early."},{"tipo":"ej","pali":"atha satthā pāto ’va mahāmoggallānattheraṃ āmantesi","ref":"JA. i 368","es":"entonces, el Maestro bien temprano se dirigió al monje Mahāmoggallana.","en":"then the Teacher, very early, addressed the Elder Mahāmoggallāna."},{"tipo":"sub","es":"**pātar** antes de una vocal.","en":"**pātar** before a vowel."},{"tipo":"ej","pali":"pātarāso","ref":"","es":"la comida de la mañana, el desayuno.","en":"the morning meal, breakfast."}],"notas":[],"avisos_en":[]},{"id":"param","lema":"pāraṃ","cab":{"es":"**pāraṃ**, (sc. *pāra*) (part. usada en la 7ª inflexión) Otro lado; otra orilla; otro flanco (*parasmiṃ passe*). Opuesto de **oraṃ**.","en":"**pāraṃ**, (Skt. *pāra*) (particle used in the 7th case) The other side; the other shore; the far flank (*parasmiṃ passe*). Opposite of **oraṃ**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pāraṃ samuddassa pi patthayetha","ref":"M. ii 259","es":"y anhela el otro lado del océano.","en":"he would long even for the far side of the ocean."}],"notas":[],"avisos_en":[]},{"id":"pi","lema":"pi","cab":{"es":"**pi**, forma abreviada de **api**.","en":"**pi**, shortened form of **api**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"puthu","lema":"puthu","cab":{"es":"**puthu**, (sc. *pṛthu*) Partícula que indica variedad de formas (*bahuppakāra*) y separación (*asaṅghāta*).","en":"**puthu**, (Skt. *pṛthu*) Particle indicating a variety of kinds (*bahuppakāra*) and separateness (*asaṅghāta*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"puthu kilese janetī ti puthujjano","ref":"DA. i 59","es":"un ser ordinario (*puthujjana*) es aquel que genera muchas impurezas mentales.","en":"one who generates many defilements is an ordinary person (*puthujjana*)."},{"tipo":"ej","pali":"sabbakāmehi puthubhūto","ref":"SnA. ii 261","es":"que está separado de todos los placeres sensuales.","en":"who is separated from all sensual pleasures."}],"notas":[],"avisos_en":["block 0: the reference (DA. i 59) sits inside the Spanish translation (ref field empty); kept at the start of the English as in the source. Consider moving it to the ref field."]},{"id":"puna","lema":"puna","cab":{"es":"**puna**, (sc. *punar*) (adv.) Denota lo que no es primero (*appaṭhama*). Otra vez; de nuevo; nuevamente.","en":"**puna**, (Skt. *punar*) (adv.) Denotes what is not first (*appaṭhama*). Again; once more; anew."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"puna vadāmi","ref":"","es":"hablo de nuevo.","en":"I speak again."},{"tipo":"ej","pali":"puna gehaṃ na kāhasi","ref":"Dh. 36","es":"no construirás nuevamente la casa.","en":"you will not build the house again."},{"tipo":"sub","es":"**puna c’ aparaṃ**, y de nuevo; y de nuevo además.","en":"**puna c’ aparaṃ**, and again; and furthermore."},{"tipo":"ej","pali":"puna c’ aparaṃ, mahārājā, bhikkhu vitakkavicārānaṃ vūpasamā","ref":"D. i 70","es":"y de nuevo, Gran Rey, el bhikkhu al haber eliminado la aplicación inicial y la aplicación sostenida.","en":"and again, great king, a bhikkhu, with the stilling of applied and sustained thought..."}],"notas":[],"avisos_en":[]},{"id":"punam","lema":"punaṃ","cab":{"es":"**punaṃ**, = **puna**","en":"**punaṃ**, = **puna**"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na punaṃ jātijaraṃ upehisi","ref":"Dh. 48","es":"no volverás de nuevo al nacimiento y la vejez.","en":"you will not come again to birth and old age."}],"notas":[],"avisos_en":[]},{"id":"punappunam","lema":"punappunaṃ","cab":{"es":"**punappunaṃ**, (sc. *punar + punar*) Denota repetición, continuidad (*abhiṇha*). Una y otra vez.","en":"**punappunaṃ**, (Skt. *punar + punar*) Denotes repetition, continuity (*abhiṇha*). Again and again."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"dukkhā jāti punappunaṃ","ref":"Dh. 36","es":"nacer una y otra vez es sufrimiento.","en":"painful is birth again and again."}],"notas":[],"avisos_en":[]},{"id":"punar","lema":"punar","cab":{"es":"**punar**, = **puna**","en":"**punar**, = **puna**"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na hi jātu ggabbhaseyya punar eti","ref":"Kp. 11","es":"en verdad no regresa otra vez al vientre.","en":"truly, he does not come again to lying in a womb."}],"notas":[],"avisos_en":[]},{"id":"puno","lema":"puno","cab":{"es":"**puno**, = **puna**","en":"**puno**, = **puna**"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na puno edisakaṃ bhavissati","ref":"T. i 424","es":"no será nuevamente tal.","en":"it will not be such again."}],"notas":[],"avisos_en":[]},{"id":"pura","lema":"purā","cab":{"es":"**purā**, (= sc.) (part. usada en la 7ª inflexión —tiempo). Anteriormente; en el pasado; antes. Esta partícula puede ser usada para referirse al futuro como también **pure** y **yāva**.","en":"**purā**, (= Skt.) (particle used in the 7th case —time). Formerly; in the past; before. This particle can also be used to refer to the future, as can **pure** and **yāva**."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"pure","lema":"pure","cab":{"es":"**pure**, (sc. *puras*) (part. usada en la 7ª inflexión) Antes; en frente; previamente. Opuesto de **pacchā**. Esta partícula puede ser usada para significar el futuro (ver ejemplo).","en":"**pure**, (Skt. *puras*) (particle used in the 7th case) Before; in front; previously. Opposite of **pacchā**. This particle can be used to signify the future (see example)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pacchāvacanīyaṃ pure avaca","ref":"D. i 8","es":"aquello que debería decirse después, lo dice antes.","en":"what should be said afterwards, you said before."},{"tipo":"ej","pali":"pure adhammo dippati","ref":"V. iv 481","es":"en el futuro lo contrario al Dhamma brillará. Aquí **pure** se usa para referirse al futuro. El comentario explica que otra lectura sería: “tal vez lo contrario al Dhamma brilla”.","en":"in the future what is contrary to the Dhamma will shine. Here **pure** is used to refer to the future. The commentary explains that another reading would be: “perhaps what is contrary to the Dhamma shines”."}],"notas":[],"avisos_en":["block 0: Spanish 'lo dice' (3rd sg. present); avaca is aorist, here 2nd sg. ('you said')."]},{"id":"pecca","lema":"pecca","cab":{"es":"**pecca**, (sc. *pretya*) (part. usada en la 7ª inflexión) Después de la muerte; en el más allá; en el otro mundo (*paraloke*).","en":"**pecca**, (Skt. *pretya*) (particle used in the 7th case) After death; in the hereafter; in the other world (*paraloke*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"idha modati, pecca modati","ref":"Dh. 15","es":"en este mundo se regocija, en el otro mundo se regocija.","en":"here he rejoices, hereafter he rejoices."}],"notas":[],"avisos_en":[]},{"id":"bahi","lema":"bahi","cab":{"es":"**bahi**, (sc. *bahis*) (part. usada en la 7ª inflexión) Fuera, afuera; externo.","en":"**bahi**, (Skt. *bahis*) (particle used in the 7th case) Outside, without; external."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"anto jaṭā, bahi jaṭā","ref":"S. i 13","es":"enredo interno, enredo externo.","en":"a tangle within, a tangle without."}],"notas":[],"avisos_en":[]},{"id":"bahiddha","lema":"bahiddhā","cab":{"es":"**bahiddhā**, (sc. *bahirdhā*) (part. usada en la 7ª inflexión) Fuera, afuera; externo; externamente.","en":"**bahiddhā**, (Skt. *bahirdhā*) (particle used in the 7th case) Outside, without; external; externally."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"bahiddhā vā dhammesu dhammānupassī viharati","ref":"D. ii 251","es":"o permanece contemplando los dhammas en los dhammas externamente.","en":"or he dwells contemplating dhammas in dhammas externally."}],"notas":[],"avisos_en":[]},{"id":"bahira","lema":"bāhirā","cab":{"es":"**bāhirā**, (sc. *bāhya*) (part. usada en la 7ª inflexión) Afuera, fuera; externo; externamente.","en":"**bāhirā**, (Skt. *bāhya*) (particle used in the 7th case) Outside, without; external; externally."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pathavīdhātu siyā ajjhattikā, siyā bāhirā","ref":"M. i 242","es":"el elemento tierra puede ser interno o externo.","en":"the earth element may be internal or external."}],"notas":[],"avisos_en":[]},{"id":"bahiram","lema":"bāhiraṃ","cab":{"es":"**bāhiraṃ**, (part. usada en la 7ª inflexión) Afuera, fuera; externo; externamente.","en":"**bāhiraṃ**, (particle used in the 7th case) Outside, without; external; externally."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"bāhiraṃ parimajjasi","ref":"Dh. 69","es":"limpias afuera.","en":"you clean the outside."}],"notas":[],"avisos_en":[]},{"id":"bya","lema":"byā","cab":{"es":"**byā**, = **iva**","en":"**byā**, = **iva**"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"evaṃ byā kho ti evaṃ viya kho","ref":"MA ii 10","es":"","en":"*evaṃ byā kho* means *evaṃ viya kho*, “just so, as it were”."}],"notas":[],"avisos_en":["block 0: Spanish gives no translation (empty); English supplied as a gloss explanation."]},{"id":"bhane","lema":"bhaṇe","cab":{"es":"**bhaṇe**, (1ª per. sg. pres. de *bhaṇati* = hablar) (part. voc., sg. y pl, m.) Partícula vocativa masculina singular y plural usada para dirigirse a inferiores.","en":"**bhaṇe**, (1st pers. sg. pres. of *bhaṇati* = to speak) (voc. particle, sg. and pl., m.) Masculine singular and plural vocative particle used to address inferiors."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"gaccha, bhaṇe, ciravāsiṃ kumāraṃ jānāhi","ref":"S. ii 512","es":"vaya hombre y averigüe acerca del niño Ciravāsī.","en":"go, my man, and find out about the boy Ciravāsī."}],"notas":[],"avisos_en":[]},{"id":"bhiyyo","lema":"bhiyyo","cab":{"es":"**bhiyyo**, (sc. bhūyas) (adv., part. 1ª y 2ª inflexión) Más; mucho.","en":"**bhiyyo**, (Skt. bhūyas) (adv., particle in the 1st and 2nd case) More; much."},"caso":["1","2"],"nir":"","bloques":[{"tipo":"txt","es":"En la 1ª inflexión:","en":"In the 1st case:"},{"tipo":"ej","pali":"uppajjati sukhaṃ, sukhā bhiyyo somanassaṃ","ref":"D. ii 173","es":"agrado surge y del agrado más placer.","en":"pleasure arises, and from pleasure, still more joy."},{"tipo":"txt","es":"En la 2ª inflexión:","en":"In the 2nd case:"},{"tipo":"ej","pali":"bhiyyo pallomam āpādiṃ araññe vihārāya","ref":"M. i 21","es":"alcancé más seguridad morando en el bosque.","en":"I gained even greater confidence for dwelling in the forest."}],"notas":[],"avisos_en":[]},{"id":"bhutapubbam","lema":"bhūtapubbaṃ","cab":{"es":"**bhūtapubbaṃ**, (sc. *bhūtapūrva*) (part. usada en la 7ª inflexión —tiempo) En el pasado; en tiempos pasados; en otros tiempos; antiguamente.","en":"**bhūtapubbaṃ**, (Skt. *bhūtapūrva*) (particle used in the 7th case —time) In the past; in times past; in former times; formerly."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"bhūtapubbaṃ, bhikkhave, rājā ahosi aruṇavā nāma","ref":"S. i 157","es":"en tiempos pasados, bhikkhus, había un rey llamado Aruṇavā.","en":"in times past, bhikkhus, there was a king named Aruṇavā."}],"notas":[],"avisos_en":[]},{"id":"bho","lema":"bho","cab":{"es":"**bho**, (sc. *bhos*) (part. voc., sg. y pl., m. y f.) Partícula vocativa singular y plural usada para dirigirse a hombres o mujeres. Es un término que denota familiaridad y se usa para iguales e inferiores.","en":"**bho**, (Skt. *bhos*) (voc. particle, sg. and pl., m. and f.) Singular and plural vocative particle used to address men or women. It is a term denoting familiarity and is used towards equals and inferiors."},"caso":["1v"],"nir":"","bloques":[{"tipo":"txt","es":"Un ministro para dirigirse al Buddha:","en":"A minister addressing the Buddha:"},{"tipo":"ej","pali":"rājā, bho gotama, māgadho ajātasattu vedehiputto vajjī abhiyātukāmo","ref":"D. ii 62","es":"Venerable Gotama, el rey de Māgadha Ajātasattu, hijo de la reina Vedhi, desea aniquilar a los Vajjis.","en":"Master Gotama, the king of Magadha, Ajātasattu, son of the Videhan queen, wishes to march against the Vajjis."},{"tipo":"txt","es":"Al público en general:","en":"To the public in general:"},{"tipo":"ej","pali":"jitamha vata bho ambakāya","ref":"D. ii 82","es":"¡oh señores hemos sido derrotados por una mujer!","en":"alas, sirs, we have been defeated by a mere woman!"}],"notas":[],"avisos_en":["block 1: Spanish 'Venerable Gotama' for bho gotama (English 'Master Gotama', matching the familiar register the heading describes); Spanish 'aniquilar' for abhiyātukāmo, which means 'wishes to march against / attack'."]},{"id":"manam","lema":"manaṃ","cab":{"es":"**manaṃ**, (sc. *manāk*) Casi; un poco.","en":"**manaṃ**, (Skt. *manāk*) Almost; a little."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"nadiṃ taranto manaṃ vūḷho ahosi","ref":"V. iii 147","es":"cruzando el río, fue casi arrastrado [por la correntada].","en":"crossing the river, he was almost swept away [by the current]."},{"tipo":"ej","pali":"atipaṇḍitena puttena, manam hi upakūḷito","ref":"J. i 23","es":"fui casi quemado por su muy sabio hijo.","en":"I was almost burnt by an over-clever son."},{"tipo":"ej","pali":"manaṃ vata, bho, panassāma","ref":"M. i 234","es":"casi desaparecemos.","en":"we very nearly perished, sirs!"}],"notas":[],"avisos_en":["block 1: Spanish 'su muy sabio hijo' ('his/your very wise son'); the Pāli has no possessive and atipaṇḍita suggests 'over-clever'."]},{"id":"ma","lema":"mā","cab":{"es":"**mā**, (= sc.) (part. de neg.) No. Partícula de negación y prohibición (*paṭisedhana*).","en":"**mā**, (= Skt.) (negative particle) Not. Particle of negation and prohibition (*paṭisedhana*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"mā bhāyi","ref":"D. i 47","es":"no tema.","en":"do not be afraid."}],"notas":[],"avisos_en":[]},{"id":"marisa","lema":"mārisa","cab":{"es":"**mārisa**, (sc. *māriṣa*, *mādṛśa* = colega) (part. voc., sg.) ¡Señor! Vocativo de respeto.","en":"**mārisa**, (Skt. *māriṣa*, *mādṛśa* = colleague) (voc. particle, sg.) Sir! Vocative of respect."},"caso":["1v"],"nir":"","bloques":[{"tipo":"txt","es":"Un deva se dirige a un humano:","en":"A deva addresses a human:"},{"tipo":"ej","pali":"ahaṃ kho, mārisa, sakko devānamindo","ref":"D. ii 226","es":"yo, señor, soy Sakka, rey de los devas.","en":"I, sir, am Sakka, lord of the devas."},{"tipo":"txt","es":"Un grupo de devas a otro deva:","en":"A group of devas to another deva:"},{"tipo":"ej","pali":"icchāma mayaṃ mārisa... sotuṃ","ref":"D. ii 179","es":"nosotros señor deseamos escuchar.","en":"we, sir, wish ... to hear."}],"notas":[],"avisos_en":[]},{"id":"marisa-2","lema":"mārisā","cab":{"es":"**mārisā**, (sc. *māriṣa*, *mādṛśa* = colega) (part. voc., pl.)¡Señores! Vocativo de respeto.","en":"**mārisā**, (Skt. *māriṣa*, *mādṛśa* = colleague) (voc. particle, pl.) Sirs! Vocative of respect."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"nikkhantaṃ kho, mārisā, ekaṃ vassaṃ","ref":"D. ii 41","es":"señores, un año ha pasado.","en":"sirs, one year has gone by."}],"notas":[],"avisos_en":[]},{"id":"miccha","lema":"micchā","cab":{"es":"**micchā**, (sc. *mithyā*) (adv., part. 3ª inflexión y sin inflexión) Falsamente, erróneamente, equivocadamente; incorrectamente; mal; falsedad (*asacca*). Véase también **musā** y **alikaṃ**.","en":"**micchā**, (Skt. *mithyā*) (adv., particle in the 3rd case and uninflected) Falsely, erroneously, mistakenly; incorrectly; wrongly; falsehood (*asacca*). See also **musā** and **alikaṃ**."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"micchā paṇihitaṃ cittaṃ","ref":"Dh. 19","es":"una mente mal dirigida.","en":"a wrongly directed mind."},{"tipo":"ej","pali":"idaṃ te micchā","ref":"Kv. 4","es":"ésta es una falsedad tuya.","en":"this [claim] of yours is false."}],"notas":[],"avisos_en":[]},{"id":"musa","lema":"musā","cab":{"es":"**musā**, (sc. *mṛṣā*) (adv.) expresa aquello que no es verdadero (*asacca*). Mentira; falsedad; falso.","en":"**musā**, (Skt. *mṛṣā*) (adv.) expresses what is not true (*asacca*). Lie; falsehood; false."},"caso":[],"nir":"3","bloques":[{"tipo":"ej","pali":"na musā bhaṇati","ref":"D. iii 40","es":"no dice lo que es falso.","en":"he does not speak falsely."}],"notas":[],"avisos_en":[]},{"id":"muhum","lema":"muhuṃ","cab":{"es":"**muhuṃ**, (sc. *muhur*) (part. usada en la 7ª inflexión —tiempo) Rápido; repetidamente.","en":"**muhuṃ**, (Skt. *muhur*) (particle used in the 7th case —time) Quickly; repeatedly."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"muhuṃ muhuṃ hadayaṃ vedhamānaṃ","ref":"S. i 112","es":"perforando el corazón momento a momento.","en":"the heart trembling again and again."}],"notas":[],"avisos_en":["block 0: Spanish 'perforando' (piercing); vedhamāna is from vedhati 'to tremble, quiver', so 'trembling'."]},{"id":"muhuttam","lema":"muhuttaṃ","cab":{"es":"**muhuttaṃ**, (sc. *muhūrta*) (part. usada en la 7ª inflexión —tiempo) Un momento, un segundo, instante.","en":"**muhuttaṃ**, (Skt. *muhūrta*) (particle used in the 7th case —time) A moment, a second, an instant."},"caso":["7"],"nir":"2","bloques":[{"tipo":"ej","pali":"sādhu, bhante, bhagavā muhuttaṃ nisīdatu anukampaṃ upādāya","ref":"M. i 300","es":"sería bueno que el Sublime por compasión se siente un momento.","en":"it would be good, Venerable Sir, if the Blessed One would sit for a moment, out of compassion."}],"notas":[],"avisos_en":[]},{"id":"yagghe","lema":"yagghe","cab":{"es":"**yagghe**, (part.) Expletivo (*padapūraṇa*).","en":"**yagghe**, (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"yan-ce","lema":"yañ ce","cab":{"es":"**yañ ce**, expresa oposición (*paṭisedha*). En estos ejemplos se puede traducir como “que”.","en":"**yañ ce**, expresses opposition (*paṭisedha*). In these examples it can be translated as “than”."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"daṇḍo ’va kira me seyyo yañ ce puttā anassavā","ref":"S. i 177","es":"es mejor para mí el bastón que hijos desleales.","en":"better for me, it seems, is a staff than disobedient sons."},{"tipo":"ej","pali":"sā yeva pūjanā seyyo yañ ce vassasataṃ hutaṃ","ref":"Dh. 29","es":"este homenaje es mejor que cien años de sacrificios.","en":"that very homage is better than a hundred years of sacrifice."}],"notas":[],"avisos_en":[]},{"id":"yattha-katthaci","lema":"yattha katthaci","cab":{"es":"**yattha katthaci**, (part. usada en la 7ª inflexión) Éste es un término que incluye todo (*anavasesapariyādānavacana*).","en":"**yattha katthaci**, (particle used in the 7th case) This is an all-inclusive term (*anavasesapariyādānavacana*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"tasmā tesu yattha katthaci ekādasavidhena nimittaṃ uggahetvā","ref":"Vis. i 186","es":"por lo tanto habiendo aprehendido el signo en cada uno de éstos de acuerdo con los once modos.","en":"therefore, having grasped the sign in any one of these in the eleven ways..."}],"notas":[],"avisos_en":["block 0: Spanish 'en cada uno de éstos' (in each); yattha katthaci = 'in whichever/any one'."]},{"id":"yato-kutoci","lema":"yato kutoci","cab":{"es":"**yato kutoci**, (part. usada en la 5ª inflexión) Éste es un término que incluye todo (*anavasesapariyādānavacana*).","en":"**yato kutoci**, (particle used in the 5th case) This is an all-inclusive term (*anavasesapariyādānavacana*)."},"caso":["5"],"nir":"","bloques":[{"tipo":"ej","pali":"yato kutoci ce pi naṃ puriso ādittāya tiṇukkāya upasaṅkameyya","ref":"S. ii 392","es":"si un hombre con una antorcha ardiente hecha de paja se acercara desde cualquier dirección.","en":"if a man were to approach it from any direction whatsoever with a blazing grass torch."}],"notas":[],"avisos_en":[]},{"id":"yatha-r-iva","lema":"yatha-r-iva","cab":{"es":"**yatha-r-iva**, = **yath’ eva**.","en":"**yatha-r-iva**, = **yath’ eva**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"yatha","lema":"yathā","cab":{"es":"**yathā**, (= sc.) (part., adv.) Como; tal como; al igual que; con relación a; de acuerdo a; así como; lo mismo que. Correlativo de **tathā**. Existe en los siguientes significados:","en":"**yathā**, (= Skt.) (particle, adv.) As; just as; like; in relation to; according to; even as; the same as. Correlative of **tathā**. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Analogía; símil; semejanza (*paṭibhāga*):","en":"Analogy; simile; likeness (*paṭibhāga*):"},{"tipo":"ej","pali":"vaṃso visālo ’va yathā visatto puttesu dāresu ca yā apekkhā","ref":"Sn. 285","es":"el apego por hijos y esposas es como [un bosque de] bambú difuso y enredado.","en":"longing for sons and wives is like a wide-spreading [clump of] bamboo, entangled."},{"tipo":"ej","pali":"yathā me dhanacchedo na hoti, tathā karissāmi","ref":"DhA. i 16","es":"haré de tal forma que no haya disminución de mi riqueza.","en":"I will act in such a way that there is no loss of my wealth."},{"tipo":"ej","pali":"karoti so tath’ attānaṃ, yathā naṃ icchatī diso","ref":"Dh. 37","es":"él se hace a sí mismo lo que sólo un enemigo desea para uno.","en":"he does to himself what an enemy would wish for him."},{"tipo":"txt","es":"Adecuación, conformidad (*yogattā*):","en":"Suitability, conformity (*yogattā*):"},{"tipo":"ej","pali":"yathānurūpaṃ upasaṃharati","ref":"","es":"los reúne de acuerdo a lo adecuado.","en":"he brings them together as is fitting."},{"tipo":"txt","es":"Repetición, difusión (*vicchā*):","en":"Repetition, distribution (*vicchā*):"},{"tipo":"ej","pali":"ye ye vuḍḍhā yathāvuḍḍhaṃ","ref":"","es":"cada uno de los que son mayores de acuerdo a la antigüedad.","en":"whoever are senior, each according to seniority."},{"tipo":"txt","es":"No trascendiendo el significado de la palabra (*padatthānativatta*):","en":"Not exceeding the meaning of the word (*padatthānativatta*):"},{"tipo":"ej","pali":"yathākkamaṃ","ref":"","es":"en orden, en sucesión.","en":"in order, in sequence."},{"tipo":"txt","es":"Ilustración, ejemplo (*nidassana*):","en":"Illustration, example (*nidassana*):"},{"tipo":"ej","pali":"yathā kulūpako","ref":"A ii 120","es":"así como uno que frecuenta una familia.","en":"like one who frequents families."},{"tipo":"txt","es":"Orden, sucesión (paṭipāṭi):","en":"Order, succession (paṭipāṭi):"},{"tipo":"ej","pali":"vuḍḍhānaṃ paṭipāṭi yathāvuḍḍhaṃ","ref":"","es":"en orden de los mayores, de acuerdo a la antigüedad.","en":"the order of the seniors: according to seniority."},{"tipo":"txt","es":"Muy mucho, sumamente, extremadamente (*ativiya*):","en":"Very much, exceedingly, extremely (*ativiya*):"},{"tipo":"ej","pali":"yathā ayaṃ nimirājā paṇḍito kusalatthiko","ref":"J. ii 186","es":"este rey Nimi muy sabio, deseoso del bien. Aquí la partícula **yathā** significa “muy” y se conecta con *paṇḍito*, sabio.","en":"this King Nimi, very wise, desirous of the good. Here the particle **yathā** means “very” and connects with *paṇḍito*, wise."}],"notas":[],"avisos_en":["block 15: 'Order, succession (paṭipāṭi)' — paṭipāṭi is not italicised in the Spanish source either; left as is."]},{"id":"yatha-ca","lema":"yathā ca","cab":{"es":"**yathā ca**, se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Correlativo de **tathā ca**.","en":"**yathā ca**, used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way. Correlative of **tathā ca**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā ca te bhagavā byākaroti, tathā naṃ dhāreyyāsi","ref":"D. i 212","es":"así como el Sublime te explica, de esta manera deberías recordarlo.","en":"as the Blessed One explains it to you, so should you remember it."}],"notas":[],"avisos_en":[]},{"id":"yatha-nama","lema":"yathā nāma","cab":{"es":"**yathā nāma**, se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Correlativo de **tathā nāma**.","en":"**yathā nāma**, used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way. Correlative of **tathā nāma**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā nāma balavā puriso āsanā vuṭṭhāya divasam pi tiṭṭheyya","ref":"Vis.i 123","es":"así como un hombre fornido, habiéndose levantado de su asiento, puede permanecer parado todo el día.","en":"just as a strong man, having risen from his seat, might remain standing even for the whole day."}],"notas":[],"avisos_en":[]},{"id":"yatha-pi","lema":"yathā pi","cab":{"es":"**yathā pi**, (*yathā + api*) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera.","en":"**yathā pi**, (*yathā + api*) Used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā pi selā vipulā nabhaṃ āhacca pabbatā","ref":"S. i 102","es":"así como una montaña de roca sólida, extensa, tocando el cielo.","en":"just as vast mountains of solid rock, reaching up to the sky,"}],"notas":[],"avisos_en":["block 0: Spanish singular ('una montaña'); selā vipulā ... pabbatā is plural."]},{"id":"yatha-hi","lema":"yathā hi","cab":{"es":"**yathā hi**, se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Correlativo de **tathā hi**.","en":"**yathā hi**, used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way. Correlative of **tathā hi**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā hi megho thanayaṃ","ref":"S. i 100","es":"así como una nube de tormenta tronando.","en":"just as a storm cloud, thundering,"}],"notas":[],"avisos_en":[]},{"id":"yath-eva","lema":"yath’ eva","cab":{"es":"**yath’ eva**, (sc. *yathā + eva*) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Lo mismo que; al igual que; así; como. Otra forma es **yathar iva**. Es el correlativo de **tath’ eva**: **yath’ eva**, como; **tath’ eva**, así.","en":"**yath’ eva**, (Skt. *yathā + eva*) Used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). The same as; just as; thus; like. Another form is **yathar iva**. It is the correlative of **tath’ eva**: **yath’ eva**, as; **tath’ eva**, so."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yath’ eva maṃ te pūjesuṃ, tath' eva tvam pi pūjaya","ref":"J. i 243","es":"como ellos me honraron, así también tú hónrame.","en":"as they honoured me, just so should you too honour me."},{"tipo":"ej","pali":"yath’ eva bhagavatā pubbe bhikkhusaṃgho anuggahito, evam eva etarahi anuggaṇhātu bhikkhusaṃghan","ref":"S. ii 75","es":"que el Sublime ayude ahora a la comunidad de bhikkhus, así como el Sublime ayudó a la comunidad de Bhikkhus en el pasado.","en":"just as the Blessed One formerly helped the community of bhikkhus, so may he now help the community of bhikkhus."},{"tipo":"ej","pali":"aho vata, mārisā, cattāro sammāsambuddhā loke uppajjeyyuṃ dhammañ ca deseyyuṃ yatha-r-iva bhagavā","ref":"D. ii 181","es":"¡oh señores, si cuatro Buddhas fueran a surgir en el mundo y enseñar el Dhamma así como el Sublime!","en":"oh, sirs, if only four Perfectly Enlightened Buddhas were to arise in the world and teach the Dhamma, just as the Blessed One does!"}],"notas":[],"avisos_en":[]},{"id":"yada","lema":"yadā","cab":{"es":"**yadā**, (= sc.) (part. usada en la 7ª inflexión —tiempo) Cuando. Correlativo de **tadā**.","en":"**yadā**, (= Skt.) (particle used in the 7th case —time) When. Correlative of **tadā**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"yadā ca paccati pāpaṃ","ref":"Dh. 23","es":"pero cuando la mala acción madura.","en":"but when the evil deed ripens."},{"tipo":"ej","pali":"yadā devo devakāyā cavati","ref":"Iti. 247","es":"cuando una divinidad muere (lit. cae) del mundo de los devas.","en":"when a deva passes away (lit. falls) from the company of the devas."},{"tipo":"ej","pali":"cātumahābhūtiko ayaṃ puriso yadā kālaṅkaroti, pathavī pathavikāyaṃ anupeti anupagacchati","ref":"D. i 52","es":"cuando este hombre, compuesto por los cuatro elementos, muere, el elemento tierra regresa, vuelve, a la masa de la tierra.","en":"when this person, made up of the four great elements, dies, earth returns to, goes back to, the mass of earth."},{"tipo":"txt","es":"Con el correlativo **tadā**:","en":"With the correlative **tadā**:"},{"tipo":"ej","pali":"yadā te vivadissanti, tadā ehinti me vasaṃ","ref":"J. i 9","es":"cuando ellos disputen, entonces vendrán bajo mi influencia.","en":"when they quarrel, then they will come under my power."}],"notas":[],"avisos_en":[]},{"id":"yada-kadaci","lema":"yadā kadāci","cab":{"es":"**yadā kadāci**, (sc. *yadā kadācid*) (part. usada en la 7ª inflexión —tiempo) Cada vez (*anavasesapariyādānavacana*).","en":"**yadā kadāci**, (Skt. *yadā kadācid*) (particle used in the 7th case —time) Whenever (*anavasesapariyādānavacana*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"yadā kadāci pana me bhayaṃ āgacchantaṃ sākhāvissaṭṭhaṭṭhānato āgamissati","ref":"JA. iii 396","es":"cada vez que me viene el miedo debido al crujir de ramas.","en":"whenever danger comes to me, it will come from the place where a branch has been let go."}],"notas":[],"avisos_en":["block 0: uncertain; Spanish 'cada vez que me viene el miedo debido al crujir de ramas'; the Pāli (bhayaṃ ... sākhāvissaṭṭhaṭṭhānato āgamissati) reads more like 'danger will come from the place where a branch is released/snaps'. Check JA. iii 396 context."]},{"id":"yadi","lema":"yadi","cab":{"es":"**yadi**, (= sc.) Usada para expresar condicionalidad, posición de duda (*saṅkāvaṭṭhāna*). Si; ya sea. A veces puede tener el mismo significado que la conjunción vā.","en":"**yadi**, (= Skt.) Used to express conditionality, a position of doubt (*saṅkāvaṭṭhāna*). If; whether. Sometimes it can have the same meaning as the conjunction vā."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"gāme vā yadi vāraññe","ref":"Dh. 27","es":"ya sea en el poblado o en el bosque.","en":"whether in a village or in the forest."},{"tipo":"ej","pali":"yadi ’haṃ tassa pakuppeyyaṃ","ref":"Cp. 401","es":"si yo me enojara con éste.","en":"if I were to become angry with him."}],"notas":[],"avisos_en":[]},{"id":"yasma","lema":"yasmā","cab":{"es":"**yasmā**, (sc. *yasmāt*) Partícula de delimitación de causa (*kāraṇacchedana*). Porque; ya que; pues; debido a que. Correlativo de **tasmā**.","en":"**yasmā**, (Skt. *yasmāt*) Particle delimiting a cause (*kāraṇacchedana*). Because; since; for; owing to the fact that. Correlative of **tasmā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yasmā ca kho, bhikkhave, rūpaṃ anattā, tasmā rūpaṃ ābādhāya saṃvattati","ref":"S. ii 55","es":"Porque, bhikkhus, la materia es no alma, ésta conduce a la aflicción.","en":"Because, bhikkhus, form is non-self, therefore form leads to affliction."}],"notas":[],"avisos_en":[]},{"id":"yava","lema":"yāva","cab":{"es":"**yāva**, (sc. *yāvat*) Partícula de delimitación (*paricchedana*). Hasta; mientras; siempre y cuando. Se usa con **tāva**; yāva puede ser usada para referirse al futuro; véase también **pure** y **purā**.","en":"**yāva**, (Skt. *yāvat*) Particle of delimitation (*paricchedana*). Until; as long as; while; provided that. It is used with **tāva**; yāva can be used to refer to the future; see also **pure** and **purā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yāv’ assa kāyo ṭhassati, tāva naṃ dakkhanti devamanussā","ref":"D. i 42","es":"mientras su cuerpo permanezca, entonces, devas y hombres lo verán.","en":"As long as his body remains, so long will devas and humans see him."},{"tipo":"ej","pali":"yāvāhaṃ āgacchāmi, tāva idh’ eva hotha","ref":"JA. ii 249","es":"esté aquí hasta que yo regrese.","en":"Stay right here until I come back."},{"tipo":"ej","pali":"yāva brahmalokā saddo abbhugacchi","ref":"S. iii 371","es":"el sonido se extendió hasta el mundo de los Brahmas.","en":"The sound rose up as far as the Brahma world."}],"notas":[],"avisos_en":["block 1: *hotha* is 2nd pl. imperative; Spanish «esté» is singular; English 'stay' covers both."]},{"id":"yavata","lema":"yāvatā","cab":{"es":"**yāvatā**, (= sc.) Partícula de delimitación (*paricchedana*). Hasta; mientras; porque. Se usa generalmente con **tāvatā**.","en":"**yāvatā**, (= Skt.) Particle of delimitation (*paricchedana*). As far as; as long as; because. Generally used with **tāvatā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yāvatā, bhikkhave, sattāvāsā, yāvatā bhavaggaṃ, ete aggo, ete seṭṭhā lokasmiṃ yadidaṃ arahanto","ref":"S. ii 68","es":"en donde hay moradas de seres, hasta la existencia más alta, los Arahants son los mejores, los superiores en el universo.","en":"As far, bhikkhus, as there are abodes of beings, as far as the peak of existence, these are the foremost, these are the best in the world, namely the arahants."},{"tipo":"ej","pali":"yāvatā, bhikkhave, dhammā saṅkhatā vā asaṅkhatā vā, virāgo tesaṃ aggam akkhāyati","ref":"Iti. 254","es":"bhikkhus, mientras haya fenómenos condicionados, incondicionados, la ausencia de pasión, entre esos [estados], es considerada superior.","en":"As far, bhikkhus, as there are things, whether conditioned or unconditioned, dispassion is declared the foremost of them."},{"tipo":"ej","pali":"na tāvatā dhammadharo, yāvatā bahu bhāsati","ref":"Dh. 50","es":"uno no es poseedor del Dhamma porque habla mucho.","en":"One is not a bearer of the Dhamma merely because one speaks much."}],"notas":[],"avisos_en":["block 1: Spanish «mientras haya» ('while there are'); the Pāḷi *yāvatā* here is extent ('as far as there are' = 'of all things'); rendered 'as far as'."]},{"id":"ratti","lema":"ratti","cab":{"es":"**ratti**, (sc. *rātri*) (part. usada en la 7ª inflexión —tiempo) Noche.","en":"**ratti**, (Skt. *rātri*) (particle used in the 7th case — time) Night."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"rahita","lema":"rahitā","cab":{"es":"**rahitā**, (del sc. *rahita*) Indica separación (*vippayoga*). Mismo significado que **vinā** y **rite**.","en":"**rahitā**, (from Skt. *rahita*) Indicates separation (*vippayoga*). Same meaning as **vinā** and **rite**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"rahitā mātujā puññaṃ katvā dānaṃ deti","ref":"Kac. §272","es":"","en":"Apart from his mother, having made merit, he gives a gift."}],"notas":[],"avisos_en":["block 0: Spanish translation is empty in the source; English supplied from the Pāḷi. Uncertain reading: *mātujā* (abl. of a stem *mātu-*? or *mātujā* 'born of a mother'?) — sense 'apart from/without the mother' is a tentative guess; please check against Kacc. §272 vutti."]},{"id":"raho","lema":"raho","cab":{"es":"**raho**, (sc. *rahas*) (part..usada en 7ª inflexión) En privado; en secreto. Es opuesto de **āvi**.","en":"**raho**, (Skt. *rahas*) (particle used in the 7th case) In private; in secret. It is the opposite of **āvi**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"āvi c’ eva raho ca","ref":"D. ii 67","es":"en público y en privado.","en":"Both openly and in secret."},{"tipo":"ej","pali":"natthi loke raho nāma, pāpakammaṃ pakubbato","ref":"A. i 147","es":"no hay secreto en el mundo cuando uno realiza una mala acción.","en":"For one who does an evil deed, there is no such thing as secrecy in the world."}],"notas":[],"avisos_en":[]},{"id":"rite","lema":"rite","cab":{"es":"**rite**, (sc. *ṛte*) Sin, excepto, aparte. Indica separación (*vippayoga*).","en":"**rite**, (Skt. *ṛte*) Without, except, apart from. Indicates separation (*vippayoga*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"rite saddhammā kuto sukhaṃ labhati","ref":"Kac. §272","es":"¿de dónde uno obtiene felicidad aparte del buen Dhamma?","en":"Without the true Dhamma, whence does one obtain happiness?"}],"notas":[],"avisos_en":[]},{"id":"re","lema":"re","cab":{"es":"**re**, (= sc.) (intj., voc., sg. y pl., m., coloquial) Partícula vocativa usada en lenguaje abusivo (*hiṃsālapana*).","en":"**re**, (= Skt.) (interj., voc., sg. and pl., m., colloquial) Vocative particle used in abusive address (*hiṃsālapana*)."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"ehi re dāsa","ref":"JA. i 242","es":"¡eh esclavo, ven!","en":"Hey, slave, come here!"}],"notas":[],"avisos_en":[]},{"id":"labbha","lema":"labbhā","cab":{"es":"**labbhā**, (sc. *labhya*) (part.,1ª inflexión) Posible; obtenible.","en":"**labbhā**, (Skt. *labhya*) (particle, 1st case) Possible; obtainable."},"caso":["1"],"nir":"","bloques":[{"tipo":"ej","pali":"Taṃ kut’ ettha, ānanda, labbhā","ref":"D. ii 99","es":"¿Ānanda, aquí, cómo es posible?","en":"How could that be possible here, Ānanda?"}],"notas":[],"avisos_en":[]},{"id":"lahu","lema":"lahu","cab":{"es":"**lahu**, Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien.","en":"**lahu**, Particle of assent; affirmative reply; acceptance (*sampaṭicchana*). Yes; good; all right."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"lahū ti","ref":"V. iii 57","es":"sí.","en":"“Yes.”"}],"notas":[],"avisos_en":["block 0: followed Nandisena's 'yes'; could not verify the context at V. iii 57."]},{"id":"lahu-2","lema":"lahu","cab":{"es":"**lahu**, (sc. *laghu*) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, de prisa, aprisa.","en":"**lahu**, (Skt. *laghu*) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, hastily, swiftly."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"lahum","lema":"lahuṃ","cab":{"es":"**lahuṃ** (sc. *laghu*) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, de prisa, aprisa.","en":"**lahuṃ** (Skt. *laghu*) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, hastily, swiftly."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"lahuṃ uppajjati","ref":"DhA. i 187","es":"surge rápidamente.","en":"It arises quickly."}],"notas":[],"avisos_en":[]},{"id":"va","lema":"va","cab":{"es":"**va**, (part.) Expletivo (*padapūraṇa*).","en":"**va**, (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"va-2","lema":"vā","cab":{"es":"**vā**, (= sc.) O. Nunca se usa al comienzo de la oración. Usualmente se repite.","en":"**vā**, (= Skt.) Or. It is never used at the beginning of a sentence. It is usually repeated."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Disyunción (*vikappana*):","en":"Disjunction (*vikappana*):"},{"tipo":"ej","pali":"devo vā māro vā","ref":"Kv. 332","es":"deva o Māra.","en":"A deva or Māra."},{"tipo":"ej","pali":"khattiyo vā brāhmaṇo vā vesso vā suddo vā","ref":"M. ii 92","es":"guerrero o brahmán o mercader o siervo.","en":"A warrior or a brahmin or a merchant or a menial."},{"tipo":"txt","es":"Comparación (*upamāna*):","en":"Comparison (*upamāna*):"},{"tipo":"ej","pali":"madhu vā maññati","ref":"Dh. 23","es":"piensa que es como la miel.","en":"[The fool] thinks it [is] like honey."},{"tipo":"txt","es":"Agrupación; agregación; colección (*samuccaya*):","en":"Grouping; aggregation; collection (*samuccaya*):"},{"tipo":"ej","pali":"Pāṭaliputtassa kho, Ānanda, tayo antarāyā bhavissanti: aggito vā udakato vā mithubhedā vā","ref":"D. ii 74","es":"Ānanda, Pāṭaliputta tendrá tres peligros: fuego, agua y disensión interna. En este ejemplo, la partícula **vā** se usa en el sentido normal de **ca**, es decir, incluye o agrupa las tres alternativas.","en":"Ānanda, there will be three dangers for Pāṭaliputta: from fire, from water, and from internal dissension. In this example the particle **vā** is used in the ordinary sense of **ca**, that is, it includes or groups together the three alternatives."},{"tipo":"txt","es":"Alternativa fija (*vavatthitavibhāsā*):","en":"Fixed option (*vavatthitavibhāsā*):"},{"tipo":"ej","pali":"vā paro asarūpā","ref":"Kac. §13","es":"opcionalmente la [vocal se elide] cuando está precedida por una [vocal] disimilar. Éste es un aforismo del primer capítulo acerca de la combinación eufónica de la antigua gramática *Kaccāyana*. La partícula **vā** aquí limita la aplicación de la regla.","en":"Optionally, the following [vowel is elided] after a dissimilar [vowel]. This is an aphorism from the first chapter, on euphonic combination, of the ancient grammar *Kaccāyana*. Here the particle **vā** limits the application of the rule."},{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."}],"notas":[],"avisos_en":["block 4: *madhu vā maññati* is Dh. 69 (*madhuvā maññati bālo*); the reference 'Dh. 23' in the source may be a page number — left unchanged."]},{"id":"vata","lema":"vata","cab":{"es":"**vata**, (= sc.) (part.) Seguramente, ciertamente, realmente, en verdad, definitivamente; ¡ay! Existe en los siguientes significados:","en":"**vata**, (= Skt.) (particle) Surely, certainly, really, truly, definitely; alas! It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Certeza, certidumbre (*ekaṃsa*):","en":"Certainty, assurance (*ekaṃsa*):"},{"tipo":"ej","pali":"accheraṃ vata lokasmiṃ, uppajjanti vicakkhaṇā","ref":"J. ii 184","es":"¡oh es ciertamente maravilloso que los sabios aparezcan en el mundo!","en":"Truly it is a marvel in the world that the wise arise!"},{"tipo":"txt","es":"Aflicción; pesar (*kheda*):","en":"Distress; sorrow (*kheda*):"},{"tipo":"ej","pali":"kicchaṃ vatāyaṃ loko āpanno","ref":"D. ii 26","es":"¡ay este mundo está en dificultad!","en":"Alas, this world has fallen into trouble!"},{"tipo":"txt","es":"Compasión (*anukampā*):","en":"Compassion (*anukampā*):"},{"tipo":"ej","pali":"Kapaṇo vatāyaṃ bhikkhu, muṇḍo saṅghāṭipāruto; amātiko apitiko, rukkhamūlasmi jhāyati","ref":"J. ii 53","es":"¡ay, este pobre bhikkhu, rapado, envuelto en su hábito, sin madre, sin padre, medita al pie del árbol!","en":"Alas, this poor bhikkhu, shaven-headed, wrapped in his outer robe, motherless, fatherless, meditates at the foot of a tree!"},{"tipo":"txt","es":"Intención, propósito, motivo (*saṅkappa*):","en":"Intention, purpose, motive (*saṅkappa*):"},{"tipo":"ej","pali":"aho vatāyaṃ dubbaṇṇo assa","ref":"Vis. i 290","es":"¡que él sea feo!","en":"Oh, may he be ugly!"}],"notas":[],"avisos_en":[]},{"id":"vatha","lema":"vatha","cab":{"es":"**vatha**, (part.) (Rū. 132). Expletivo (*padapūraṇa*).","en":"**vatha**, (particle) (Rū. 132). Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"vina","lema":"vinā","cab":{"es":"**vinā**, (= sc.) (prep., part. 3ª inflexión) Sin, excepto. Indica separación (*vippayoga*).","en":"**vinā**, (= Skt.) (prep., particle, 3rd case) Without, except. Indicates separation (*vippayoga*)."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"s anaṃ jano","ref":"Dh. 49","es":"La gente da de acuerdo con su fe y de acuerdo con su satisfacción.","en":"People indeed give according to their faith, according to their confidence."}],"notas":[],"avisos_en":["block 2: *aññāsi* is aorist ('did not know'); Spanish has present «no conoce»."]},{"id":"vo","lema":"vo","cab":{"es":"**vo**, (part.) Expletivo (*padapūraṇa*).","en":"**vo**, (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"sam","lema":"saṃ","cab":{"es":"**saṃ**, (sc. *sva, svayaṃ*) (part. usada en 3ª inflexión) Por uno mismo.","en":"**saṃ**, (Skt. *sva, svayaṃ*) (particle used in the 3rd case) By oneself."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"sammā-sam-buddho","ref":"D. ii 2","es":"el completamente Iluminado. Aquí **sammā** significa correctamente (*aviparītena*) y **sam**, por sí mismo (*attanā*).","en":"the Rightly Self-Awakened One. Here **sammā** means correctly (*aviparītena*) and **sam**, by oneself (*attanā*)."}],"notas":[],"avisos_en":["block 0: the reference (D. ii 2) sits inside the Spanish text (ref field empty); kept in the English. Spanish «el completamente Iluminado» rendered 'Rightly Self-Awakened' to match Nandisena's own gloss (sammā = correctly, sam = by oneself)."]},{"id":"sakim","lema":"sakiṃ","cab":{"es":"**sakiṃ**, (sc. *sakṛt*) sufijo usado en la partición de números (*saṅkhyāvibhāga*). Una vez.","en":"**sakiṃ**, (Skt. *sakṛt*) suffix used in the division of numbers (*saṅkhyāvibhāga*). Once."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sakiṃ nimuggo","ref":"A. ii 403","es":"sumergido una vez.","en":"Submerged once."},{"tipo":"sub","es":"**sakid eva**, sólo una vez.","en":"**sakid eva**, only once."},{"tipo":"ej","pali":"sakid eva imaṃ lokaṃ āgantvā dukkhass antaṃ karoti","ref":"A. ii 404","es":"habiendo regresado sólo una vez a este mundo, pone un fin al sufrimiento.","en":"Having come back to this world only once, he makes an end of suffering."}],"notas":
