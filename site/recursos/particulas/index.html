html{scroll-padding-top:calc(var(--cabecera-h,0px) + var(--barh,74px) + 10px)}
.sidebar a{padding:2px 18px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar a i{font-style:italic}
.sb-sec>summary::before{content:'▸';flex:0 0 10px;font-size:9px;opacity:.8}
.sb-sec[open]>summary::before{content:'▾'}
.sb-sec>summary .gl{flex:1;min-width:0;font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:14px}
.sb-sec>summary .n{color:var(--text2);font-weight:400;letter-spacing:0}
.sb-sec.on:not([open])>summary{background:var(--bg);box-shadow:inset 2px 0 0 var(--haritala)}
.sidebar a[hidden],.sb-sec[hidden]{display:none}

/* letra inicial */
.sec{margin:40px 0 6px;display:flex;align-items:baseline;gap:12px}
.sec h2{font-size:24px;margin:0;font-weight:700;font-style:italic;color:var(--haritala)}
.sec .rule{flex:1;height:1px;background:var(--border)}

/* entrada */
.card{border-top:1px solid var(--border);padding:18px 0 20px}
.ecab{font-size:17px;line-height:1.6;margin:0;max-width:78ch}
.ecab b{font-style:italic;font-size:19px}
.chips{display:inline-flex;gap:6px;margin-left:8px;vertical-align:2px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;border-radius:2px;padding:1px 6px;
  color:var(--accent);background:var(--accent-bg);white-space:nowrap;cursor:help}
.chip.nir{color:var(--text2);background:none;border:1px solid var(--border)}
.chip.nuevo{color:var(--bg2);background:var(--haritala)}
.bl{margin:6px 0 0;max-width:78ch;line-height:1.6}
.bl.n2{padding-left:22px}
ul.ejs{list-style:none;margin:4px 0 6px;padding:0 0 0 16px;border-left:1px solid var(--border)}
ul.ejs.n2{margin-left:22px}
ul.ejs li{padding:3px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px;align-items:baseline}
ul.ejs .p{font-style:italic}
ul.ejs .t{color:var(--text2)}
ul.ejs .rf{display:inline;margin-left:9px;font-family:var(--mono);font-size:10.5px;font-style:normal;color:var(--accent);white-space:nowrap;cursor:help}
@media (max-width:640px){ul.ejs li{grid-template-columns:1fr;gap:0}ul.ejs .t{padding-left:12px}}
sup.fn a{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:.75em}
.notas{margin:10px 0 0;padding:6px 0 0;border-top:1px dashed var(--border);font-size:14px;color:var(--text2);max-width:78ch}
.notas p{margin:2px 0}
.notas .nn{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-right:6px}
.fuente{margin:10px 0 0;font-size:14px;color:var(--text2);max-width:78ch;border-left:2px solid var(--haritala);padding-left:10px}
.fuente b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--haritala);margin-right:6px}
.guia-l{margin:12px 0 0;font-size:15px}
.guia-l a{color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor}
.guia-l a:hover{color:var(--haritala)}
.aviso{margin:14px 0 0;max-width:66ch;font-size:14.5px;color:var(--text2);border-left:2px solid var(--rakta);padding-left:10px}
.erratas{font-size:13.5px;border-collapse:collapse;margin:8px 0;width:100%}
.erratas td{padding:3px 8px;border-bottom:1px solid var(--border);vertical-align:baseline}
.erratas td:first-child{font-family:var(--mono);font-size:10.5px;white-space:nowrap;color:var(--text2)}
.erratas del{color:var(--rakta)}
footer.rc-pie p{max-width:78ch}
@media print{.bar,.sidebar,#top-btn{display:none!important}body{padding-left:0}}

ht."}],"notas":[],"avisos_en":[]},{"id":"ama","lema":"amā","cab":{"es":"**amā**, (= sc.) (adv., acción simultánea, asociación = *samakriyā*) Con, juntamente. Tiene el mismo significado que **saha**.","en":"**amā**, (= Skt.) (adv., simultaneous action, association = *samakriyā*) With, together. It has the same meaning as **saha**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sabbakiccesu amā vattatī ti amacco","ref":"DAA i 325","es":"un ministro es aquel que existe con todas las funciones.","en":"one who is engaged together (with the king) in all affairs is a minister."}],"notas":[],"avisos_en":[]},{"id":"ambho","lema":"ambho","cab":{"es":"**ambho**, (sc. *ham + bhos*) (intj., voc., sg. y pl., m.) Hombre; ¡oh hombre! Partícula vocativa usada para dirigirse y llamar la atención. Normalmente usada para personas laicas. De acuerdo al Rū-ṭī. se usa para dirigirse a personas importantes. Muchas veces está seguida de *purisa*, hombre.","en":"**ambho**, (Skt. *ham + bhos*) (interj., voc., sg. and pl., m.) Man; O man! A vocative particle used to address someone and to attract attention. Normally used for lay people. According to the Rū-ṭī. it is used to address important people. It is often followed by *purisa*, man."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"ehi tvaṃ, ambho purisa","ref":"M. ii 326","es":"venga usted, buen hombre.","en":"come here, good man."}],"notas":[],"avisos_en":[]},{"id":"aram","lema":"araṃ","cab":{"es":"**araṃ**, (= sc.) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, deprisa, aprisa.","en":"**araṃ**, (= Skt.) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, swiftly, rapidly."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"are","lema":"are","cab":{"es":"**are**, (= sc.) (intj., voc., sg. y pl., m., coloquial) (Rū. 133). Partícula vocativa usada en lenguaje abusivo (*hiṃsālapana*).","en":"**are**, (= Skt.) (interj., voc., sg. and pl., m., colloquial) (Rū. 133). A vocative particle used in abusive language (*hiṃsālapana*)."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"are, duṭṭhadāsi","ref":"DhA. I 134","es":"¡eh esclava malvada!","en":"hey, you wicked slave-woman!"}],"notas":[],"avisos_en":[]},{"id":"alam","lema":"alaṃ","cab":{"es":"**alaṃ**, (sc. *alam*) (adv.) ¡Basta! ¡Suficiente! Adecuado, competente, capaz; decoración, ornamento. Existe en los siguientes significados:","en":"**alaṃ**, (Skt. *alam*) (adv.) Enough! Sufficient! Fit, competent, able; decoration, ornament. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Negación, prohibición (*paṭisedhana*):","en":"Negation, prohibition (*paṭisedhana*):"},{"tipo":"ej","pali":"alaṃ te idha vāsena","ref":"V. i 280","es":"¡Suficiente con tu vivir aquí! (= ¡márchate!)","en":"Enough of your living here! (= go away!)"},{"tipo":"txt","es":"Habilidad (*pariyatti*):","en":"Ability (*pariyatti*):"},{"tipo":"ej","pali":"alaṃ mallo mallassa","ref":"","es":"el luchador puede con el (otro) luchador (= es un digno rival.)","en":"a wrestler is a match for (another) wrestler (= he is a worthy rival)."},{"tipo":"txt","es":"Ornamento (*bhūsana*):","en":"Ornament (*bhūsana*):"},{"tipo":"ej","pali":"alaṅkato","ref":"","es":"decorado.","en":"adorned."}],"notas":[],"avisos_en":[]},{"id":"alikam","lema":"alikaṃ","cab":{"es":"**alikaṃ**, (sc. *alīkam*) expresa lo que no es verdadero (*asacca*). Falsedad; falso; mentira(s). Véase también **musā** y **micchā**.","en":"**alikaṃ**, (Skt. *alīkam*) expresses what is not true (*asacca*). Falsehood; false; lie(s). See also **musā** and **micchā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"alikaṃ bhāsati","ref":"","es":"habla mentiras.","en":"he speaks lies."},{"tipo":"ej","pali":"alikaṃ bhaṇaṃ","ref":"Dh. 51","es":"hablando falsedades.","en":"speaking falsehood."}],"notas":[],"avisos_en":[]},{"id":"assu","lema":"assu","cab":{"es":"**assu**, (sc. *s+su?, sma*). Expletivo (*padapūraṇa*).","en":"**assu**, (Skt. *s+su?, sma*). Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"assudam","lema":"assudaṃ","cab":{"es":"**assudaṃ**, expletivo.","en":"**assudaṃ**, expletive."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"ahe","lema":"ahe","cab":{"es":"**ahe**, part. vocativa usada para dirigirse a iguales (muy rara).","en":"**ahe**, vocative particle used to address equals (very rare)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"tāhaṃ bhadde vareyyāhe","ref":"D. ii 213","es":"¡oh buena mujer, yo te deseo a ti!","en":"O good lady, I would choose you!"}],"notas":[],"avisos_en":["block 1: Spanish 'yo te deseo a ti' (I desire you); vareyyaṃ is 'I would choose / ask for (in marriage)'. Close in sense."]},{"id":"aho","lema":"aho","cab":{"es":"**aho**, (= sc.) (intj.) Exclamación de reproche (*garaha*), elogio (*pasaṃsana*), aspiración (*patthana*) y sorpresa. ¡Oh! ¡Ah!","en":"**aho**, (= Skt.) (interj.) Exclamation of reproach (*garaha*), praise (*pasaṃsana*), aspiration (*patthana*) and surprise. Oh! Ah!"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Reproche, censura (*garaha*):","en":"Reproach, censure (*garaha*):"},{"tipo":"ej","pali":"aho vata re amhākaṃ paṇḍitaka [^6]","ref":"D. i 100","es":"¡oh nuestro pedante!","en":"oh, our pedant!"},{"tipo":"txt","es":"Elogio (*pasaṃsana*):","en":"Praise (*pasaṃsana*):"},{"tipo":"ej","pali":"aho buddho, aho dhammo, aho saṃgho","ref":"DA. ii 230","es":"¡Oh Buddha! ¡Oh Dhamma! ¡Oh Sangha!","en":"Oh, the Buddha! Oh, the Dhamma! Oh, the Sangha!"},{"tipo":"txt","es":"Aspiración, deseo (*patthanā*):","en":"Aspiration, wish (*patthanā*):"},{"tipo":"ej","pali":"aho vatāyaṃ brāhmaṇo maṇiṃ na gaṇheyya","ref":"DhA. ii 435","es":"¡oh, que este brahmán no tome la joya!","en":"Oh, if only this brahmin would not take the jewel!"},{"tipo":"txt","es":"Sorpresa:","en":"Surprise:"},{"tipo":"ej","pali":"aho parittaṃ, bhante, sattānaṃ jīvitaṃ","ref":"DhA. i 231","es":"¡Oh, Venerable Señor, la vida de los seres es corta!","en":"Oh, Venerable Sir, how short is the life of beings!"}],"notas":[{"n":"6","es":"El comentario (D.A. i 247) indica que **aho vata** es una expresión de reproche; **re** una partícula vocativa para dirigirse en forma despectiva y **paṇḍitaka** expresa disgusto. A la voz *paṇḍita*, sabio, cuando se le coloca el sufijo “ka”, significa pedante.","en":"The commentary (D.A. i 247) indicates that **aho vata** is an expression of reproach; **re** is a vocative particle for addressing someone contemptuously; and **paṇḍitaka** expresses displeasure. When the suffix “ka” is added to the word *paṇḍita*, wise, it means pedant."}],"avisos_en":["block 2: kept the footnote marker [^6] and the reference '(D. i 100)' that the source places inside the translation field (ref is empty)."]},{"id":"anam","lema":"ānaṃ","cab":{"es":"**ānaṃ**, Expletivo (*padapūraṇa*).","en":"**ānaṃ**, Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"ama-2","lema":"āma","cab":{"es":"**āma**, (sc. *am*) Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien.","en":"**āma**, (Skt. *am*) Particle of assent; affirmative answer; acceptance (*sampaṭicchana*). Yes; good; all right."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"āma bhante","ref":"V. i 111","es":"sí, Venerable Señor.","en":"yes, Venerable Sir."}],"notas":[],"avisos_en":[]},{"id":"amo","lema":"āmo","cab":{"es":"**āmo**, Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien.","en":"**āmo**, Particle of assent; affirmative answer; acceptance (*sampaṭicchana*). Yes; good; all right."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"āmo ti so paṭissutvā, mādharo suvapaṇḍito","ref":"JA. vi 264","es":"después de consentir, el loro Mādhara dijo “sí”.","en":"having assented with “yes”, Mādhara, the wise parrot, …"}],"notas":[],"avisos_en":[]},{"id":"ayati","lema":"āyati","cab":{"es":"**āyati** (ṃ), (sc. *āyati*) (part. usada en la 7ª inflexión —tiempo) Futuro; en el futuro; en tiempo futuro (*anāgate kāle*).","en":"**āyati** (ṃ), (Skt. *āyati*) (particle used in the 7th case — time) Future; in the future; in future time (*anāgate kāle*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"āyatiṃ saṃvarāya","ref":"D. i 80","es":"para la contención en el futuro.","en":"for restraint in the future."},{"tipo":"ej","pali":"tathāgatassa kho, sīha, āyatiṃ gabbhaseyyā punabbhavābhinibbatti pahīnā","ref":"V. iii 332","es":"Sīha, reconexión en el futuro, nueva existencia, ha sido extinguida por el Tathāgata.","en":"Sīha, for the Tathāgata, future lying in a womb, the production of renewed existence, has been abandoned."},{"tipo":"ej","pali":"āyatibhavo","ref":"","es":"existencia futura.","en":"future existence."}],"notas":[],"avisos_en":["block 2: Spanish 'reconexión' (rebirth-linking) for gabbhaseyyā, literally 'lying in a womb'; English follows the Pāḷi."]},{"id":"araka","lema":"ārakā","cab":{"es":"**ārakā**, (sc. *ārakāt*) (part. usada en la 7ª inflexión) Lejos (dūre); lejano; distante; separado; remoto.","en":"**ārakā**, (Skt. *ārakāt*) (particle used in the 7th case) Far (dūre); far-off; distant; separated; remote."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ārakā udakā","ref":"M. i 307","es":"lejos del agua.","en":"far from the water."}],"notas":[],"avisos_en":[]},{"id":"ara","lema":"ārā","cab":{"es":"**ārā**, (sc. *ārāt*) (part. usada en la 7ª inflexión) Lejos (dūre); lejano; distante; separado; remoto.","en":"**ārā**, (Skt. *ārāt*) (particle used in the 7th case) Far (dūre); far-off; distant; separated; remote."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ārā so āsavakkhayā","ref":"Dh. 49","es":"él está lejos de la extinción de los contaminantes.","en":"he is far from the destruction of the taints."}],"notas":[],"avisos_en":[]},{"id":"avi","lema":"āvi","cab":{"es":"**āvi**, (sc. *āviḥ*) (part..usada en 7ª inflexión) Abierto; claro; manifiesto; a la vista; presente; en público; en frente de los ojos. Es opuesto de **raho**.","en":"**āvi**, (Skt. *āviḥ*) (particle used in the 7th case) Open; clear; manifest; in view; present; in public; before the eyes. It is the opposite of **raho**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"āvi c' eva raho ca","ref":"D. ii 67","es":"en público y en privado.","en":"both in public and in private."},{"tipo":"ej","pali":"āvikaroti","ref":"","es":"hace manifiesto.","en":"makes manifest."}],"notas":[],"avisos_en":[]},{"id":"avuso","lema":"āvuso","cab":{"es":"**āvuso**, (sc. contracción de *āyusmanto*?) (part. voc., sg. y pl., m.) ¡Amigo! ¡Señor! ¡Hermano! Partícula vocativa singular y plural usada por un monje para dirigirse a otros monjes de igual o inferior rango, a monjes en general, y a personas laicas. Durante la época del Buddha este término parece haber sido usado entre los bhikkhus para dirigirse unos a otros sin consideración de la antigüedad. Sin embargo, poco antes de morir el Buddha da instrucciones al Venerable Ānanda que después de su muerte los bhikkhus más antiguos deberán dirigirse a los más jóvenes por nombre, por el nombre de familia o mediante el término **āvuso**, mientras que los bhikkhus más jóvenes deberán dirigirse a los más antiguos mediante el término **bhante**. Véase D. ii 127.","en":"**āvuso**, (Skt. contraction of *āyusmanto*?) (voc. particle, sg. and pl., m.) Friend! Sir! Brother! A singular and plural vocative particle used by a monk to address other monks of equal or lower rank, monks in general, and lay people. During the time of the Buddha this term seems to have been used among bhikkhus to address one another regardless of seniority. However, shortly before his death the Buddha instructs the Venerable Ānanda that after his death the senior bhikkhus should address the junior ones by name, by clan name, or with the term **āvuso**, while the junior bhikkhus should address the senior ones with the term **bhante**. See D. ii 127."},"caso":["1v"],"nir":"","bloques":[{"tipo":"txt","es":"Para dirigirse a un monje de menor antigüedad.","en":"To address a monk of lesser seniority."},{"tipo":"ej","pali":"gacch’ āvuso ānanda, kusināraṃ","ref":"D. ii 130","es":"ve amigo Ānanda a Kusināra. En este ejemplo, el Venerable Anuruddha se dirige al Venerable Ānanda.","en":"go, friend Ānanda, to Kusinārā. In this example, the Venerable Anuruddha addresses the Venerable Ānanda."},{"tipo":"txt","es":"Para dirigirse a varios monjes de menor antigüedad.","en":"To address several monks of lesser seniority."},{"tipo":"ej","pali":"alaṃ āvuso mā socittha mā paridevittha","ref":"D. ii 129","es":"¡suficiente amigos, no os apesadumbréis, no os lamentéis! (Aquí el Venerable Anuruddha se dirige a los bhikkhus).","en":"enough, friends! Do not grieve, do not lament! (Here the Venerable Anuruddha addresses the bhikkhus.)"},{"tipo":"txt","es":"Para dirigirse a un asceta de otra orden.","en":"To address an ascetic of another order."},{"tipo":"ej","pali":"ap’ āvuso, amhākaṃ satthāraṃ jānāsi","ref":"D. ii 133","es":"¿amigo, conoces a nuestro maestro? Aquí el Venerable Mahākassapa se dirige a un asceta.","en":"friend, do you know our teacher? Here the Venerable Mahākassapa addresses an ascetic."},{"tipo":"txt","es":"Para dirigirse a una persona laica.","en":"To address a lay person."},{"tipo":"ej","pali":"āyāmi āvuso, āyāmi āvuso","ref":"D. iii 15","es":"voy amigo, voy amigo. En este caso, un asceta de nombre Pāthikaputta se dirige a una persona laica que lo ha ido a buscar.","en":"I'm coming, friend, I'm coming, friend. In this case, an ascetic named Pāthikaputta addresses a lay person who has gone to fetch him."}],"notas":[],"avisos_en":[]},{"id":"asum","lema":"āsuṃ","cab":{"es":"**āsuṃ**, (sc. *āśum*) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, de prisa, aprisa.","en":"**āsuṃ**, (Skt. *āśum*) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, swiftly, rapidly."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"ingha","lema":"iṅgha","cab":{"es":"**iṅgha**, (sc. *aṅga*[^7]) (interj.) Se usa para exhortar, incitar (*codana*).¡Vamos! ¡Venga! ¡Vaya!","en":"**iṅgha**, (Skt. *aṅga*[^7]) (interj.) It is used to exhort, to urge (*codana*). Come on! Come! Go on!"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"iṅgha me tvaṃ, ānanda, pānīyaṃ āhara","ref":"D. ii 107","es":"ve Ānanda y trae agua para beber.","en":"come, Ānanda, bring me drinking water."}],"notas":[{"n":"7","es":"“Partícula indeclinable que implica atención, asentimiento o deseo, y a veces impaciencia; podría ser traducida como bien, realmente, cierto; por favor; más bien... ” *A Sanskrit-English Dictionary* por Sir Monier Monier Williams, pág. 7.","en":"“An indeclinable particle implying attention, assent or desire, and sometimes impatience; it could be translated as well, indeed, true; please; rather... ” *A Sanskrit-English Dictionary* by Sir Monier Monier-Williams, p. 7."}],"avisos_en":["note 1: back-translated from Nandisena's Spanish rendering of Monier-Williams; the original English wording (s.v. aṅga, p. 7) should be checked and substituted (my recollection: 'a particle implying attention, assent or desire, and sometimes impatience, = well, well then, true, please, rather, quick'), not verified."]},{"id":"iti","lema":"iti","cab":{"es":"**iti**, (= sc.) usualmente abreviado en ti y icc antes de vocal. Así; de esta manera. Esta partícula se usa a menudo para marcar lenguaje directo o literal; es decir, se usa al final de la oración, frase o palabra para cerrar una cita.","en":"**iti**, (= Skt.) usually shortened to ti and icc before a vowel. Thus; in this way. This particle is often used to mark direct or verbatim speech; that is, it is used at the end of the sentence, phrase or word to close a quotation."},"caso":[],"nir":"1–7","bloques":[{"tipo":"txt","es":"Indicación (*nidassana*):","en":"Indication (*nidassana*):"},{"tipo":"ej","pali":"iti pi te cittaṃ","ref":"D. i 207","es":"así es tu mente.","en":"thus too is your mind."},{"tipo":"ej","pali":"iti kho, cunda, satthā pi tattha gārayho","ref":"D. iii 98","es":"realmente, Cunda, como se dijo antes, aquí el maestro es censurado.","en":"thus indeed, Cunda, as stated before, in that case the teacher too is to be censured."},{"tipo":"txt","es":"Causa (hetu). En este caso es sinónimo de **tasmā**.","en":"Cause (hetu). In this case it is synonymous with **tasmā**."},{"tipo":"txt","es":"Final de la oración (*vākyaparisamatti*):","en":"End of the sentence (*vākyaparisamatti*):"},{"tipo":"ej","pali":"attamano āyasmā upavāṇo bhagavato bhāsitaṃ abhinandī ti","ref":"D. iii 116","es":"el Venerable Upavāṇa, contento, se regocijó de las palabras del Sublime. En este caso **iti** está en su forma abreviada **ti** y tiene la función del punto al final de la oración.","en":"the Venerable Upavāṇa, pleased, delighted in the words of the Blessed One. In this case **iti** is in its shortened form **ti** and has the function of the full stop at the end of the sentence."}],"notas":[],"avisos_en":["block 3: Spanish 'realmente … aquí el maestro es censurado'; Pāḷi pi ('too') and gārayho (gerundive, 'to be censured') rendered closer to the Pāḷi."]},{"id":"iti-hi","lema":"iti hi","cab":{"es":"**iti hi**, se usa para realizar una decisión (*nicchayakaraṇa*). Ciertamente; esto es así.","en":"**iti hi**, is used to express a determination (*nicchayakaraṇa*). Certainly; it is thus."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"ittham","lema":"itthaṃ","cab":{"es":"**itthaṃ**, (sc. *ittham*) Así; de esta manera.","en":"**itthaṃ**, (Skt. *ittham*) Thus; in this way."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Para referirse a algo precedente o algo dicho anteriormente (*vuttanidassana*):","en":"To refer to something preceding or something said earlier (*vuttanidassana*):"},{"tipo":"ej","pali":"itthaṃ sakko devānamindo bhagavantaṃ pañhaṃ apucchi","ref":"D. ii 220","es":"de esta manera Sakka, el rey de los devas, le hizo una pregunta al Sublime.","en":"in this way Sakka, the king of the devas, asked the Blessed One a question."},{"tipo":"ej","pali":"ittham pi te mano","ref":"D. iii 85","es":"de esta manera es tu mente.","en":"thus too is your mind."},{"tipo":"txt","es":"En compuestos:","en":"In compounds:"},{"tipo":"ej","pali":"itthambhūto","ref":"ApA. i 235","es":"siendo de esta manera.","en":"being thus; being in this way."},{"tipo":"ej","pali":"itthannāmo","ref":"D. ii 123","es":"que tiene este nombre; que se llama de esta manera.","en":"having such a name; so named."}],"notas":[],"avisos_en":[]},{"id":"idani","lema":"idāni","cab":{"es":"**idāni**, (sc. *idānīm*) (part. usada en la 7ª inflexión —tiempo) Ahora. Forma abreviada **dāni**.","en":"**idāni**, (Skt. *idānīm*) (particle used in the 7th case — time) Now. Shortened form **dāni**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"idāni, bhante, pañcamattāni sakaṭasatāni atikkantāni","ref":"D. ii 107","es":"ahora, Venerable Señor, quinientos carros han cruzado (el río).","en":"now, Venerable Sir, some five hundred carts have crossed (the river)."},{"tipo":"ej","pali":"handa dāni, bhikkhave, āmantayāmi vo, vayadhammā saṅkhārā appamādena sampādetha","ref":"D. ii 128","es":"ahora, bhikkhus, os digo “todos los fenómenos condicionados están sujetos a un cesar”, afanaos con diligencia.","en":"now, bhikkhus, I say to you: “conditioned things are subject to passing away”; strive on with diligence."}],"notas":[],"avisos_en":[]},{"id":"idha","lema":"idha","cab":{"es":"**idha**, (sc. *iha*) (adv.) aquí, en este mundo.","en":"**idha**, (Skt. *iha*) (adv.) here, in this world."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"idha nandati","ref":"Dh. 15","es":"aquí se regocija.","en":"here he rejoices."},{"tipo":"ej","pali":"idha vassaṃ vasissāmi","ref":"Dh. 54","es":"aquí viviremos durante la estación de lluvias.","en":"here I shall spend the rains."}],"notas":[],"avisos_en":["block 2: Spanish 'viviremos' (we shall live); the Pāḷi vasissāmi is 1st sg. ('I shall dwell')."]},{"id":"iva","lema":"iva","cab":{"es":"**iva**, (= sc.) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como. Forma abreviada **‘va**.","en":"**iva**, (= Skt.) It is used in the sense of analogy; simile; comparison; resemblance (*paṭibhāga*). Thus; just as. Shortened form **‘va**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"ekam eko ’va maccānaṃ, go vajjho viya nīyati","ref":"Sn. 371","es":"cada uno de los mortales es llevado como una vaca lista para la matanza.","en":"one by one, mortals are led away like a cow to the slaughter."},{"tipo":"ej","pali":"taṇhā vaḍḍhati māluvā viya","ref":"Dh. 61","es":"el deseo crece como una enredadera.","en":"craving grows like a creeper."},{"tipo":"ej","pali":"ambaṃ iva pathe jātaṃ sītacchāyaṃ manoramaṃ","ref":"J. ii 337","es":"como un árbol de mangos, que ha crecido en el camino, de sombra fresca, delicioso.","en":"like a mango tree grown by the road, with cool shade, delightful."}],"notas":[],"avisos_en":[]},{"id":"iha","lema":"iha","cab":{"es":"**iha**, (= sc.) (adv.) aquí, en este mundo. Véase **idha**.","en":"**iha**, (= Skt.) (adv.) here, in this world. See **idha**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"isakam","lema":"īsakaṃ","cab":{"es":"**īsakaṃ**, (sc. *īṣat + ka*) denota escasez (*appa*). Poco.","en":"**īsakaṃ**, (Skt. *īṣat + ka*) denotes scantiness (*appa*). A little."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"īsakaṃ gacchati","ref":"","es":"va un poco.","en":"he goes a little way."}],"notas":[],"avisos_en":[]},{"id":"uccam","lema":"uccaṃ","cab":{"es":"**uccaṃ**, (sc. *uccais*) (part. usada en la 7ª inflexión) Arriba; alto.","en":"**uccaṃ**, (Skt. *uccais*) (particle used in the 7th case) Above; high."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"uccaṃ bhāsati","ref":"DhA. ii 429","es":"habla en voz alta.","en":"he speaks loudly."}],"notas":[],"avisos_en":[]},{"id":"uttarasuve","lema":"uttarasuve","cab":{"es":"**uttarasuve**, véase **parasuve**.","en":"**uttarasuve**, see **parasuve**."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"uda","lema":"uda","cab":{"es":"**uda**, (sc. *uta*) (part.) O.","en":"**uda**, (Skt. *uta*) (particle) Or."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"devī nu ’si tvaṃ uda mānusī nu","ref":"J. i 206","es":"¿eres tú una diosa o una mujer?","en":"are you a goddess or a human woman?"},{"tipo":"ej","pali":"kāyena vācā uda cetasā vā","ref":"Khp. 6","es":"con el cuerpo o con la palabra o con la mente.","en":"by body, or by speech, or by mind."}],"notas":[],"avisos_en":[]},{"id":"udahu","lema":"udāhu","cab":{"es":"**udāhu**, (sc. *uta, utāho*) (part.) O. Se usa en interrogaciones.","en":"**udāhu**, (Skt. *uta, utāho*) (particle) Or. It is used in questions."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sā pan’ āvuso niṭṭhā viddasuno udāhu aviddasuno","ref":"M. i 94","es":"¿amigos, la meta es para uno que tiene visión o para uno sin visión?","en":"but, friends, is that goal for one who is wise or for one who is unwise?"},{"tipo":"ej","pali":"ariyo panāyye, aṭṭhaṅgiko maggo saṅkhato udāhu asaṅkhato","ref":"M. i 375","es":"¿señora, es el Noble Óctuple Sendero condicionado o incondicionado?","en":"but, lady, is the Noble Eightfold Path conditioned or unconditioned?"}],"notas":[],"avisos_en":[]},{"id":"uddham","lema":"uddhaṃ","cab":{"es":"**uddhaṃ**, (sc. *ūrdhvam*) (part. usada en la 7ª inflexión) Arriba; hacia arriba; después.","en":"**uddhaṃ**, (Skt. *ūrdhvam*) (particle used in the 7th case) Above; upward; after."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"uddhaṃ pādatalā adho kesamatthakā","ref":"D. ii 233","es":"desde las plantas de los pies hacia arriba, desde las puntas de los cabellos hacia abajo.","en":"upward from the soles of the feet, downward from the tips of the hairs."},{"tipo":"ej","pali":"uddhaṃ catūhi māsehi kālaṃkiriyā bhavissati","ref":"Pv. 134","es":"dentro de cuatro meses moriré.","en":"four months from now (my) death will take place."}],"notas":[],"avisos_en":[]},{"id":"upari","lema":"upari","cab":{"es":"**upari**, (= sc.) (part. usada en la 7ª inflexión) Arriba; sobre; después; encima; más distante; ulterior.","en":"**upari**, (= Skt.) (particle used in the 7th case) Above; over; after; on top of; farther; further."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ambaṭṭhassa māṇavassa upari vehāsaṃ ṭhito","ref":"D. i 89","es":"parado en el firmamento encima del joven Ambaṭṭha.","en":"standing in the sky above the young brahmin Ambaṭṭha."},{"tipo":"ej","pali":"heṭṭhā acci uṭṭhahitvā upari paṭihaññati","ref":"M. iii 222","es":"la flama que ha surgido de abajo golpea arriba.","en":"the flame, having arisen below, strikes against (what is) above."},{"tipo":"ej","pali":"bhante, mā upari dhammadesanaṃ vaḍḍhayittha","ref":"DhA. i 59","es":"Venerable Señor, no continúe el discurso religioso más lejos.","en":"Venerable Sir, do not extend the Dhamma talk any further."}],"notas":[],"avisos_en":[]},{"id":"ekajjham","lema":"ekajjhaṃ","cab":{"es":"**ekajjhaṃ**, (sc. *aikadhyaṃ*) (part. usada en la 7ª inflexión) Juntos; en el mismo lugar; en conjunción (*ekatra*).","en":"**ekajjhaṃ**, (Skt. *aikadhyaṃ*) (particle used in the 7th case) Together; in the same place; in conjunction (*ekatra*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sabbe ekajjhaṃ sannipatāma","ref":"M. iii 60","es":"nos reunimos todos juntos.","en":"we all gather together."}],"notas":[],"avisos_en":[]},{"id":"ekada","lema":"ekadā","cab":{"es":"**ekadā**, (= sc.) (part. usada en la 7ª inflexión —tiempo) Una vez; en un tiempo; anteriormente.","en":"**ekadā**, (= Skt.) (particle used in the 7th case — time) Once; at one time; formerly."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"punadivasato paṭṭhāya tehi parivuto ekadā kapilavatthunagare ekadā koliyanagareti dvīsu nagaresu piṇḍāya carati","ref":"JA. v 443","es":"a partir del día siguiente, escoltado por ellos, va a buscar comida en las dos ciudades, una vez en la ciudad de Kapilavatthu y otra vez en la ciudad de Koliya.","en":"from the following day on, escorted by them, he goes for alms in the two cities, at one time in the city of Kapilavatthu, at another in the city of Koliya."}],"notas":[],"avisos_en":[]},{"id":"ekamantam","lema":"ekamantaṃ","cab":{"es":"**ekamantaṃ**, (sc. *eka + anta*)(part. usada en la 7ª inflexión) En un lado, a un lado; en un lugar adecuado (*ekasmiṃ anurūpe ṭhāne*).","en":"**ekamantaṃ**, (Skt. *eka + anta*) (particle used in the 7th case) On one side, to one side; in a suitable place (*ekasmiṃ anurūpe ṭhāne*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ekamantaṃ nisīdiṃsu","ref":"D. ii 36","es":"se sentaron a un lado.","en":"they sat down to one side."}],"notas":[],"avisos_en":[]},{"id":"etarahi","lema":"etarahi","cab":{"es":"**etarahi**, (sc. *etarhi*) (part. usada en la 7ª inflexión —tiempo) Ahora; en el presente.","en":"**etarahi**, (Skt. *etarhi*) (particle used in the 7th case — time) Now; at present."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"so ’mhi etarahi tamhā bandhanāgārā mutto","ref":"D. i 69","es":"ahora he sido liberado de esa prisión.","en":"now I am freed from that prison."}],"notas":[],"avisos_en":[]},{"id":"ettavata","lema":"ettāvatā","cab":{"es":"**ettāvatā**, Partícula de delimitación (*paricchedana*). Hasta; hasta ese grado; así; en este respecto; por todo esto. A veces se usa con **kittāvatā**.","en":"**ettāvatā**, A particle of delimitation (*paricchedana*). Up to; to that extent; thus; in this respect; by all this. It is sometimes used with **kittāvatā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na kho, ānanda, ettāvatā tathāgato sakkato vā hoti garukato vā mānito vā pūjito vā apacito vā","ref":"D. ii 114","es":"no por todo esto, Ānanda, el Tathāgata es respetado, venerado, estimado, reverenciado y honrado.","en":"not by this much, Ānanda, is the Tathāgata respected, revered, esteemed, venerated or honoured."},{"tipo":"ej","pali":"ettāvatā kho, kaccāna, sammādiṭṭhi hoti","ref":"S. i 258","es":"en este respecto, Kaccāna, hay recto entendimiento.","en":"to this extent, Kaccāna, there is right view."},{"tipo":"ej","pali":"ettāvatā kho, mahānāma, upāsako hoti","ref":"S. iii 345","es":"en este respecto, Mahānāma, uno es un seguidor laico.","en":"to this extent, Mahānāma, one is a lay follower."}],"notas":[],"avisos_en":[]},{"id":"enam","lema":"enaṃ","cab":{"es":"**enaṃ**, Expletivo (*padapūraṇa*).","en":"**enaṃ**, Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"eva","lema":"eva","cab":{"es":"**eva**, (= sc.) (adv.) Partícula de énfasis y restricción. Sólo; precisamente; exactamente; únicamente; realmente; ciertamente.","en":"**eva**, (= Skt.) (adv.) Particle of emphasis and restriction. Only; precisely; exactly; solely; really; certainly."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"ajj’ eva rattiyā pacchime yāme tathāgatassa parinibbānaṃ bhavissati","ref":"D. ii 115","es":"en este mismo día, en la última parte de la noche, será el *Parinibbāna* del Tathāgata.","en":"this very day, in the last watch of the night, the *Parinibbāna* of the Tathāgata will take place."},{"tipo":"ej","pali":"idān’ eva kho ānanda","ref":"D. ii 95","es":"ahora mismo Ānanda.","en":"just now, Ānanda."}],"notas":[],"avisos_en":[]},{"id":"evam","lema":"evaṃ","cab":{"es":"**evaṃ**, (= sc.) (adv.) Así; en esta forma; de la misma manera; sí (en respuesta); tal (en un compuesto). Se usa en los siguientes significados:","en":"**evaṃ**, (= Skt.) (adv.) Thus; in this way; in the same way; yes (in reply); such (in a compound). It is used in the following senses:"},"caso":[],"nir":"1–7","bloques":[{"tipo":"txt","es":"1. Indicación (*nidassana*):","en":"1. Indication (*nidassana*):"},{"tipo":"txt","es":"1. de lo precedente; de lo dicho (*vuttanidassana*)","en":"1. of what precedes; of what has been said (*vuttanidassana*)","nivel":2},{"tipo":"ej","pali":"yadi evaṃ sante","ref":"D. i 57","es":"si esto es así; si éste es el caso.","en":"if this is so; if this is the case."},{"tipo":"ej","pali":"evaṃ vutte","ref":"S. i 162","es":"cuando se dijo esto.","en":"when this was said."},{"tipo":"ej","pali":"evaṃ pi te mano","ref":"D. i 207","es":"así es tu mente.","en":"thus too is your mind."},{"tipo":"txt","es":"2. de lo que sigue","en":"2. of what follows","nivel":2},{"tipo":"ej","pali":"evaṃ me sutaṃ","ref":"D. i 1","es":"esto he oído. *Evaṃ me sutaṃ* es como comienzan la mayoría de los discursos del Buddha y se refiere a la narrativa siguiente.","en":"thus have I heard. *Evaṃ me sutaṃ* is how most of the Buddha's discourses begin, and it refers to the narrative that follows."},{"tipo":"txt","es":"2. Asentimiento; respuesta afirmativa (*sampaṭicchana*):","en":"2. Assent; affirmative answer (*sampaṭicchana*):"},{"tipo":"ej","pali":"evaṃ bhante","ref":"D. ii 96","es":"sí, Venerable Señor.","en":"yes, Venerable Sir."},{"tipo":"ej","pali":"evaṃ āvuso","ref":"M. i 333","es":"sí, amigo.","en":"yes, friend."},{"tipo":"txt","es":"3. Similitud, parecido; símil (*paṭibhāga-upamā*):","en":"3. Similarity, resemblance; simile (*paṭibhāga-upamā*):"},{"tipo":"ej","pali":"evaṃ jātena maccena, kattabbaṃ kusalaṃ bahuṃ","ref":"Dh. 21","es":"de la misma manera uno nacido mortal debería realizar muchas buenas acciones.","en":"even so, by one born a mortal much good should be done."},{"tipo":"txt","es":"4. Instrucción; consejo (*upadesa*):","en":"4. Instruction; advice (*upadesa*):"},{"tipo":"ej","pali":"evaṃ te abhikkamitabbaṃ, evaṃ te paṭikkamitabbaṃ","ref":"M. ii 123","es":"así debes ir hacia adelante; así debes ir hacia atrás.","en":"thus you should go forward; thus you should go back."},{"tipo":"txt","es":"5. Aprobación; para expresar satisfacción (sampahaṃsana):","en":"5. Approval; to express satisfaction (sampahaṃsana):"},{"tipo":"ej","pali":"evam etaṃ, bhagavā, evam etaṃ, sugata","ref":"D. i 174","es":"así es sublime; así es Afortunado.","en":"so it is, Blessed One; so it is, Fortunate One."},{"tipo":"txt","es":"6. Censura, reproche (garahana):","en":"6. Censure, reproach (garahana):"},{"tipo":"ej","pali":"evam evaṃ panāyaṃ vasalī yasmiṃ vā tasmiṃ vā tassa muṇḍakassa samaṇakassa vaṇṇaṃ bhāsati","ref":"S. i 27","es":"así y asá, en esto y aquello, esta paria dice elogios de este asceta rapado.","en":"just so, on every occasion, this outcaste woman speaks in praise of that shaveling ascetic!"},{"tipo":"txt","es":"7. Modo (*ākāra*):","en":"7. Manner (*ākāra*):"},{"tipo":"ej","pali":"evaṃ byā kho ahaṃ, āvuso, bhagavatā dhammaṃ desitaṃ ājānāmi","ref":"M. i 322","es":"de ese modo, amigos, yo entiendo el Dhamma enseñado por el Sublime. La partícula **byā** en este pasaje significa **iva**.","en":"in this way, friends, do I understand the Dhamma taught by the Blessed One. The particle **byā** in this passage means **iva**."},{"tipo":"txt","es":"8. Pregunta (*pañha*).","en":"8. Question (*pañha*)."},{"tipo":"ej","pali":"evaṃ bhante","ref":"","es":"¿es así, Venerable Señor?","en":"is it so, Venerable Sir?"},{"tipo":"txt","es":"9. Énfasis (*avadhāraṇa*).","en":"9. Emphasis (*avadhāraṇa*)."},{"tipo":"txt","es":"10. En compuestos:","en":"10. In compounds:"},{"tipo":"ej","pali":"evaṃdiṭṭhi","ref":"D. i 31","es":"que posee tal opinión.","en":"holding such a view."},{"tipo":"ej","pali":"evaṃvādi","ref":"D. i 31","es":"que proclama tal doctrina.","en":"professing such a doctrine."}],"notas":[],"avisos_en":[]},{"id":"evam-hi","lema":"evaṃ hi","cab":{"es":"**evaṃ hi**, = **evañ hi**.","en":"**evaṃ hi**, = **evañ hi**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"evam-etam","lema":"evam etaṃ","cab":{"es":"**evam etaṃ**, denota regocijo; apreciación (*anumodana*).","en":"**evam etaṃ**, denotes rejoicing; appreciation (*anumodana*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pa ipo":"ej","pali":"evam pi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati","ref":"D. ii 232","es":"de esta forma, bhikkhus, un bhikkhu vive contemplando el cuerpo en el cuerpo.","en":"Thus too, bhikkhus, a bhikkhu dwells contemplating the body in the body."},{"tipo":"ej","pali":"evam pi rājā pasenadi kosalo āha","ref":"D. i 97","es":"así dijo el rey Pasenadi de Kosala.","en":"Thus too did King Pasenadi of Kosala speak."}],"notas":[],"avisos_en":[]},{"id":"evan-hi","lema":"evañ hi","cab":{"es":"**evañ hi**, (sc. *evam + hi*) Es igual que **evaṃ hi**. Así; de esta manera; de esta forma.","en":"**evañ hi**, (Skt. *evam + hi*) The same as **evaṃ hi**. Thus; in this manner; in this way."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"evañ hi vo, ānanda, sikkhitabbaṃ","ref":"D. ii 114","es":"así, Ānanda, os debéis entrenar.","en":"Thus, Ānanda, should you train."}],"notas":[],"avisos_en":[]},{"id":"opayikam","lema":"opāyikaṃ","cab":{"es":"**opāyikaṃ**, (sc. de *aupāyika*) Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien.","en":"**opāyikaṃ**, (Skt. from *aupāyika*) Particle of assent; affirmative reply; acceptance (*sampaṭicchana*). Yes; good; very well."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"opāyikan ti","ref":"V. iii 57","es":"sí.","en":"“Very well.”"}],"notas":[],"avisos_en":[]},{"id":"oram","lema":"oraṃ","cab":{"es":"**oraṃ**, (sc. *avara*) (part. usada en la 7ª inflexión) Este lado; esta orilla; este flanco (*imasmiṃ passe*). Opuesto de **pāraṃ**.","en":"**oraṃ**, (Skt. *avara*) (particle used in the 7th case) This side; this shore; this flank (*imasmiṃ passe*). Opposite of **pāraṃ**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"oraṃ samuddassa atittarūpo","ref":"M. ii 259","es":"insatisfecho en este lado del océano.","en":"Unsatisfied on this side of the ocean."}],"notas":[],"avisos_en":[]},{"id":"kacci","lema":"kacci","cab":{"es":"**kacci**, (sc. *kac-cid*) Partícula de interrogación. A veces está seguida por **nu** y **nu kho**.","en":"**kacci**, (Skt. *kac-cid*) Interrogative particle. It is sometimes followed by **nu** and **nu kho**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kacci te, kassapa, khamanīyaṃ, kacci yāpanīyaṃ","ref":"S. iii 71","es":"¿cómo está usted soportando Kassapa? ¿está usted mejorando?","en":"I hope you are bearing up, Kassapa? I hope you are getting along?"},{"tipo":"ej","pali":"kacci dukkhā vedanā paṭikkamanti","ref":"S. iii 71","es":"¿las sensaciones de dolor están disminuyendo?","en":"I hope your painful feelings are subsiding?"},{"tipo":"ej","pali":"kacci pitā arogo te","ref":"J. ii 331","es":"¿tu padre está sano?","en":"Is your father well?"},{"tipo":"ej","pali":"kacci nu kho me puttaṃ ahituṇḍiko vā supaṇṇo vā gaṇheyya","ref":"JA. vii 31","es":"¿un encantador de serpientes o un Supaṇṇa habrá aprehendido a mi hijo?","en":"Could it be that a snake-charmer or a Supaṇṇa has seized my son?"}],"notas":[],"avisos_en":["block 1: Spanish renders kacci yāpanīyaṃ as '¿está usted mejorando?' (are you improving?); the Pāḷi means 'are you getting along / managing to keep going?'"]},{"id":"kate","lema":"kate","cab":{"es":"**kate**, partícula usada en el significado de “a causa de” (*paṭicca*).","en":"**kate**, particle used in the sense of “because of” (*paṭicca*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"katthaci","lema":"katthaci","cab":{"es":"**katthaci**, (sc. *kutra-cid*) (part. usada en la 7ª inflexión) Se usa para expresar lugar (*padesavācakā*). En algún lugar. Véase también **kvaci** y **kvacini**.","en":"**katthaci**, (Skt. *kutra-cid*) (particle used in the 7th case) Used to express place (*padesavācakā*). Somewhere. See also **kvaci** and **kvacini**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"na khvāhaṃ, āvuso, katthaci uppajjitukāmā","ref":"S. i 134","es":"yo, amigo, no deseo renacer en ningún lugar.","en":"I, friend, do not wish to be reborn anywhere."}],"notas":[],"avisos_en":[]},{"id":"katham","lema":"kathaṃ","cab":{"es":"**kathaṃ**, (= sc.) Partícula de interrogación. ¿Cómo? ¿De qué modo?","en":"**kathaṃ**, (= Skt.) Interrogative particle. How? In what way?"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kathaṃ su tarati oghaṃ","ref":"Sn. 306","es":"¿cómo cruza la correntada?","en":"How does one cross the flood?"},{"tipo":"ej","pali":"kathaṃ su tarati aṇṇavaṃ","ref":"Sn. 306","es":"¿cómo cruza el océano?","en":"How does one cross the ocean?"}],"notas":[],"avisos_en":[]},{"id":"kathanci","lema":"kathañci","cab":{"es":"**kathañci**, (sc. *katham + cid*) (adv.) Denota dificultad (*kiccha*). Con dificultad.","en":"**kathañci**, (Skt. *katham + cid*) (adv.) Denotes difficulty (*kiccha*). With difficulty."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"cattāro vinipātā, duve ca gatiyo kathañci labbhanti","ref":"T. ii 429","es":"los (seres en los) cuatro estados de sufrimiento obtienen con dificultad los dos destinos (el mundo humano y celestial).","en":"There are four states of ruin, and the two [good] destinations are obtained only with difficulty."}],"notas":[],"avisos_en":["block 1: Spanish makes beings in the four states of suffering the subject who 'obtain with difficulty the two destinations (human and heavenly)'; the Pāḷi reads more naturally as two clauses ('four states of ruin; and the two destinations are obtained with difficulty', labbhanti passive). Uncertain without the verse context."]},{"id":"kada","lema":"kadā","cab":{"es":"**kadā**, (= sc.) (part. usada en la 7ª inflexión —tiempo) ¿Cuándo?","en":"**kadā**, (= Skt.) (particle used in the 7th case — time) When?"},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"kadā nu kho bhikkhū gaṇetabbā","ref":"V. iii 158","es":"¿cuándo los bhikkhus deben ser contados?","en":"When, then, are the bhikkhus to be counted?"}],"notas":[],"avisos_en":[]},{"id":"kadaci","lema":"kadāci","cab":{"es":"**kadāci**, (sc. *kadācid*) A veces; en algún tiempo; tal vez, quizá. En negación **na kadāci**, nunca. A veces seguido de **karahaci**.","en":"**kadāci**, (Skt. *kadācid*) Sometimes; at some time; perhaps, maybe. In negation, **na kadāci**, never. Sometimes followed by **karahaci**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kadāci karahaci tathāgatā loke uppajjanti","ref":"D. ii 115","es":"raramente los Tathāgatas surgen en el mundo.","en":"Only rarely do Tathāgatas arise in the world."},{"tipo":"ej","pali":"na kotthuko sīhasamo kadāci","ref":"S. i 66","es":"nunca el chacal es como el león.","en":"The jackal is never the equal of the lion."}],"notas":[],"avisos_en":[]},{"id":"karahaci","lema":"karahaci","cab":{"es":"**karahaci**, (sc. *karhicid*) A veces. Generalmente se usa después de **kadāci**.","en":"**karahaci**, (Skt. *karhicid*) Sometimes. Generally used after **kadāci**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"kallam","lema":"kallaṃ","cab":{"es":"**kallaṃ**, (sc. *kalya*) (part. usada en la 7ª inflexión —tiempo) Adecuado (*patirūpaṃ*), apropiado; correcto.","en":"**kallaṃ**, (Skt. *kalya*) (particle used in the 7th case — time) Fitting (*patirūpaṃ*), proper; right."},"caso":["7"],"nir":"","bloques":[{"tipo":"sub","es":"**kallaṃ** cuando va seguido de la partícula **nu** es interrogativo","en":"**kallaṃ**, when followed by the particle **nu**, is interrogative"},{"tipo":"ej","pali":"kallaṃ nu taṃ samanupassituṃ","ref":"S. ii 55","es":"¿es correcto considerarlo?","en":"Is it proper to regard that [so]?"}],"notas":[],"avisos_en":[]},{"id":"kasma","lema":"kasmā","cab":{"es":"**kasmā**, (sc. *kasmāt*) Partícula de interrogación de causa (*kāraṇapucchana*). ¿Por qué?","en":"**kasmā**, (Skt. *kasmāt*) Particle asking for a cause (*kāraṇapucchana*). Why?"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kasmā pan’ etaṃ, bhante, bhagavatā abyākataṃ","ref":"D. i 174","es":"¿por qué, Venerable Señor, esto no ha sido declarado por el Sublime?","en":"Why, Venerable Sir, has this not been declared by the Blessed One?"},{"tipo":"ej","pali":"kasmā evaṃ karosi","ref":"DhA. i 32","es":"¿por qué haces así?","en":"Why do you act thus?"}],"notas":[],"avisos_en":[]},{"id":"kaham","lema":"kahaṃ","cab":{"es":"**kahaṃ**, (part.) Expletivo (*padapūraṇa*).","en":"**kahaṃ**, (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"kamam","lema":"kāmaṃ","cab":{"es":"**kāmaṃ**, (= sc.) (adv.) Ciertamente, definitivamente; en el significado de definitivo, certeza (*ekaṃsattha*).","en":"**kāmaṃ**, (= Skt.) (adv.) Certainly, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kāmaṃ cajāma asuresu pāṇaṃ","ref":"S. i 226","es":"ciertamente abandonemos nuestras vidas a los Asuras.","en":"Certainly, let us give up our lives to the Asuras."}],"notas":[],"avisos_en":[]},{"id":"kalam","lema":"kālaṃ","cab":{"es":"**kālaṃ**, (= sc.) (part. usada en la 7ª inflexión —tiempo) Tiempo (*kālaṃ yeva*); hora.","en":"**kālaṃ**, (= Skt.) (particle used in the 7th case — time) Time (*kālaṃ yeva*); hour."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"kālaṃ karoti","ref":"D. iii 197","es":"literalmente hace tiempo (= muere).","en":"Literally, “makes time” (= dies)."},{"tipo":"ej","pali":"bhagavato kālaṃ ārocesi","ref":"D. i 102","es":"anunció al Sublime que era la hora (de la comida).","en":"He announced to the Blessed One that it was time (for the meal)."}],"notas":[],"avisos_en":[]},{"id":"kim","lema":"kiṃ","cab":{"es":"**kiṃ**, (sc. *kiṃ*) Partícula interrogativa.¿Qué? ¿Cuál? ¿Cómo? ¿Por qué?","en":"**kiṃ**, (Skt. *kiṃ*) Interrogative particle. What? Which? How? Why?"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kiṃ tvaṃ imaṃ dhammavinayaṃ ājānissasi","ref":"D. i 8","es":"¿cómo tú entenderás esta disciplina y doctrina?","en":"How will you understand this Dhamma and discipline?"},{"tipo":"ej","pali":"kiṃ pana, bhante, saddaṃ assosi","ref":"D. ii 108","es":"¿Venerable Señor, escuchó el ruido?","en":"But, Venerable Sir, did you hear the sound?"},{"tipo":"ej","pali":"taṃ kiṃ maññasi pukkusa","ref":"D. ii 108","es":"¿qué piensas, Pukkusa?","en":"What do you think, Pukkusa?"},{"tipo":"ej","pali":"kiṃ ayaṃ rājā gahapatiko viya dhāvati","ref":"DhA. i 246","es":"¿por qué este rey corre como un amo de casa?","en":"Why does this king run like a householder?"}],"notas":[],"avisos_en":[]},{"id":"kim-nu","lema":"kiṃ nu","cab":{"es":"**kiṃ nu**, = **kinnu**.","en":"**kiṃ nu**, = **kinnu**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"kim-su","lema":"kiṃ su","cab":{"es":"**kiṃ su**, (sc. *kiṃ svid*) Partícula interrogativa.¿Qué? ¿Cuál?","en":"**kiṃ su**, (Skt. *kiṃ svid*) Interrogative particle. What? Which?"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kiṃ su narānaṃ ratanaṃ","ref":"S. i 33","es":"¿cuál es la joya de los hombres?","en":"What is the treasure of men?"},{"tipo":"ej","pali":"kiṃ su yāva jarā sādhu","ref":"S. i 33","es":"¿qué es bueno hasta la vejez?","en":"What is good until old age?"},{"tipo":"ej","pali":"kiṃ su corehi dūharan","ref":"S. i 33","es":"¿qué es difícil de llevar por los ladrones?","en":"What is hard for thieves to carry off?"},{"tipo":"ej","pali":"kiṃ su chetvā sukhaṃ seti","ref":"S. i 38","es":"¿habiendo cortado <u>qué<\/u> uno duerme en paz?","en":"Having cut <u>what<\/u> does one sleep at ease?"},{"tipo":"ej","pali":"kiṃ su chetvā na socati","ref":"S. i 38","es":"¿habiendo cortado <u>qué<\/u> uno no siente pesar?","en":"Having cut <u>what<\/u> does one not grieve?"}],"notas":[],"avisos_en":[]},{"id":"kincapi","lema":"kiñcāpi","cab":{"es":"**kiñcāpi**, (= sc.) (adv.) Denota concesión (*anuggaha*) No obstante; aunque; aun cuando; sin embargo; pero.","en":"**kiñcāpi**, (= Skt.) (adv.) Denotes concession (*anuggaha*) Nevertheless; although; even though; however; but."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kiñcāpi so kammaṃ karoti pāpakaṃ","ref":"Khp. 6","es":"aunque él cometa una mala acción.","en":"Although he does an evil deed."},{"tipo":"ej","pali":"kiñcāpi te evaṃ vadeyyuṃ","ref":"S. i 71","es":"no obstante que ellos dirían.","en":"Even though they might speak thus."},{"tipo":"ej","pali":"kiñcāpi te honti bhusaṃ pamattā","ref":"Khp. 6","es":"aunque ellos son muy negligentes.","en":"Although they are exceedingly heedless."}],"notas":[],"avisos_en":[]},{"id":"kinca","lema":"kiñca","cab":{"es":"**kiñca**[^8], (adv.) Denota concesión (*anuggaha*) y reproche o censura (*garaha*).","en":"**kiñca**[^8], (adv.) Denotes concession (*anuggaha*) and reproach or censure (*garaha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"aññe pi devo poseti, kiñca devo sakaṃ pajaṃ","ref":"J. i 2","es":"el rey alimenta a otros y no a su propia progenie.","en":"The king supports even others, and [yet does not support] his own offspring."}],"notas":[{"n":"8","es":"En otras ediciones se lee “kiñci”.","en":"Other editions read “kiñci”."}],"avisos_en":["block 1: uncertain reading; I follow Nandisena's reproach interpretation ('and not his own progeny'), but the Pāḷi could also be read concessively/a fortiori ('…how much more his own offspring'). Verse context (J. i 2) not checked."]},{"id":"kittavata","lema":"kittāvatā","cab":{"es":"**kittāvatā**, Partícula de delimitación (*paricchedana*). ¿Hasta dónde? ¿Hasta qué grado? ¿Hasta que punto? ¿Cómo? ¿Por qué? ¿Con respecto a qué? Se usa con **ettāvatā**.","en":"**kittāvatā**, Particle of delimitation (*paricchedana*). How far? To what degree? To what extent? How? Why? With respect to what? Used with **ettāvatā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kittāvatā nu kho, bhante, brāhmaṇo hoti","ref":"Ud. 80","es":"¿hasta qué punto, Venerable Señor, uno es un brahmán?","en":"To what extent, Venerable Sir, is one a brahmin?"},{"tipo":"ej","pali":"kittāvatā nu kho, āvuso, vedanā ti vuccati","ref":"M. i 367","es":"¿por qué, amigo, se denomina sensación?","en":"In what respect, friend, is it called ‘feeling’?"},{"tipo":"ej","pali":"kittāvatā nu kho, bhante, sammādiṭṭhi hoti","ref":"S. i 257","es":"¿con respecto a qué, Venerable Señor, hay recto entendimiento?","en":"In what respect, Venerable Sir, is there right view?"},{"tipo":"ej","pali":"kittāvatā nu kho, bhante, upāsako hoti","ref":"S. iii 344","es":"¿con respecto a qué, Venerable Señor, uno es un seguidor laico?","en":"In what respect, Venerable Sir, is one a lay follower?"}],"notas":[],"avisos_en":["block 2: Spanish has '¿por qué…?' (why); kittāvatā means 'to what extent / in what respect'.","block 3: the reference '(S. i 257)' sits inside the Spanish 'es' text and the 'ref' field is empty; it was dropped from the English — move it to 'ref'."]},{"id":"kinti","lema":"kinti","cab":{"es":"**kinti**, (sc. *kim iti*) (part. 3ª inflexión) ¿Cómo? ¿Qué? ¿Por qué razón? (*kena nu kho kāraṇena*); por este medio.","en":"**kinti**, (Skt. *kim iti*) (particle, 3rd case) How? What? For what reason? (*kena nu kho kāraṇena*); by this means."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"kinti me bhoge n’ eva rājāno hareyyuṃ, na corā hareyyuṃ","ref":"M. i 120","es":"¿cómo ni los reyes ni los ladrones se robarán mi riqueza?","en":"How might neither kings nor thieves carry off my wealth?"},{"tipo":"ej","pali":"kinti te, ānanda, sutaṃ","ref":"D. ii 62","es":"¿Qué, Ānanda, has oído?","en":"What, Ānanda, have you heard?"},{"tipo":"ej","pali":"kinti anāgatā ca pesalā sabrahmacārī āgaccheyyuṃ","ref":"D. ii 65","es":"por este medio aquellos compañeros practicantes de la vida de pureza, de buena conducta, que aún no han venido, vendrían.","en":"By this means, well-behaved fellow practitioners of the holy life who have not yet come might come."}],"notas":[],"avisos_en":[]},{"id":"kin-tu","lema":"kin tu","cab":{"es":"**kin tu**, pero.","en":"**kin tu**, but."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"kinnu","lema":"kinnu","cab":{"es":"**kinnu**, (sc. *kim + nu*) Partícula de interrogación.","en":"**kinnu**, (Skt. *kim + nu*) Interrogative particle."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kinnu maññasi, pāpima, na me pāpaṃ vipaccati","ref":"M. i 415","es":"¿imaginas, Malvado, que el mal no madura?","en":"Do you imagine, Evil One, that my evil does not ripen?"},{"tipo":"ej","pali":"kinnu tvaṃ, brāhmaṇa, lūkho lūkhapāvuraṇo","ref":"S. i 178","es":"¿por qué, brahmán, tú estás andrajoso, andrajosamente vestido?","en":"Why, brahmin, are you shabby, shabbily clad?"},{"tipo":"ej","pali":"kinnu kho, bhante, devānaṃ sugatigamanasaṅkhātaṃ","ref":"Iti. 246","es":"Venerable Señor, ¿qué es lo que se considera como un buen destino para los devas?","en":"What, Venerable Sir, is reckoned as going to a good destination for the devas?"},{"tipo":"ej","pali":"kiṃ nu tamhā vippavasasi","ref":"Sn. 450","es":"¿puedes estar separado de él?","en":"Why do you dwell apart from him?"}],"notas":[],"avisos_en":["block 1: Pāḷi 'na me pāpaṃ vipaccati' = 'my evil does not ripen'; Spanish drops 'me' ('el mal no madura').","block 4: Spanish '¿puedes estar separado de él?' (can you be separated from him?); the Pāḷi 'kiṃ nu tamhā vippavasasi' means 'why do you dwell apart from him?' (cf. Sn 1138). Reference 'Sn. 450' looks doubtful (likely a page number)."]},{"id":"kira","lema":"kira","cab":{"es":"**kira**, (sc. *kila*) (adv.) Se usa para reportar aquello conocido de oídas (*anussavaṇa*), aquello que no merece credibilidad (*assaddheyya*), como expletivo (*padapūraṇa*). Dicen; se dice.","en":"**kira**, (Skt. *kila*) (adv.) Used to report what is known by hearsay (*anussavaṇa*), what does not merit credence (*assaddheyya*), as an expletive (*padapūraṇa*). They say; it is said."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"satthā kira sāvatthiṃ āgato","ref":"DhA. i 41","es":"dicen que el Maestro ha arribado en Sāvatthī.","en":"They say the Teacher has arrived at Sāvatthī."},{"tipo":"ej","pali":"Buddho kira loke uppanno","ref":"S. i 213","es":"dicen que el Buddha ha aparecido en el mundo.","en":"They say a Buddha has arisen in the world."}],"notas":[],"avisos_en":[]},{"id":"kismim-viya","lema":"kismiṃ viya","cab":{"es":"**kismiṃ viya**,","en":"**kismiṃ viya**,"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kismiṃ viya rittahatthaṃ gantun","ref":"V. ii 106","es":"Aquí **kismiṃ viya** es explicado como “lajjanākāro viya” o “kileso viya”.","en":"It is somehow [unseemly] to go empty-handed. Here **kismiṃ viya** is explained as “lajjanākāro viya” or “kileso viya”."}],"notas":[],"avisos_en":["block 1: Spanish gives only the comment, no translation; my rendering of the Pāḷi is interpretive (based on the gloss lajjanākāro viya, 'as if shameful')."]},{"id":"kiva","lema":"kīva","cab":{"es":"**kīva**, (sc. *kiyat, kivat*) (adv.) ¿Cuánto? Existe en los siguientes significados:","en":"**kīva**, (Skt. *kiyat, kivat*) (adv.) How much? It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Delimitación, definición (*paricchedana*).","en":"Delimitation, definition (*paricchedana*)."},{"tipo":"ej","pali":"kīva ciraṃ vimānamhi idha vacchas’ uposathe","ref":"Vv. 29","es":"¿Cuanto tiempo, Uposatha, vivirás aquí en esta mansión celestial?","en":"How long, Uposathā, will you dwell here in this celestial mansion?"}],"notas":[],"avisos_en":["block 3: 'uposathe' is the vocative of the woman's name Uposathā; Spanish writes 'Uposatha'."]},{"id":"ku","lema":"ku","cab":{"es":"**ku**, (= sc.) Se usa como prefijo. Denota repugnancia (*jigucchā*), que es despreciable, vil (*kucchita*).","en":"**ku**, (= Skt.) Used as a prefix. Denotes disgust (*jigucchā*), what is contemptible, vile (*kucchita*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kuputto","ref":"","es":"mal hijo.","en":"A bad son."},{"tipo":"ej","pali":"kukataṃ","ref":"","es":"mal hecho.","en":"Badly done."}],"notas":[],"avisos_en":[]},{"id":"kudacanam","lema":"kudācanaṃ","cab":{"es":"**kudācanaṃ**, (sc. *kadā + cana*) (part. usada en la 7ª inflexión —tiempo) Siempre; alguna vez; en cualquier tiempo. Negación, **na kudācanaṃ**, nunca.","en":"**kudācanaṃ**, (Skt. *kadā + cana*) (particle used in the 7th case — time) Ever; at any time; at whatever time. In negation, **na kudācanaṃ**, never."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"na hi verena verāni, sammantīdha kudācanaṃ","ref":"Dh. 14","es":"la enemistad nunca se apacigua en este mundo por medio de la enemistad.","en":"For enmities are never appeased by enmity here [in this world]."}],"notas":[],"avisos_en":["block 1: this verse is Dh 5; 'Dh. 14' is probably a page number."]},{"id":"ko","lema":"ko","cab":{"es":"**ko**, (part. 7ª inflexión = **kuhiṃ** ó **kva**)","en":"**ko**, (particle, 7th case = **kuhiṃ** or **kva**)"},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"Ko te balaṃ mahārāja, ko nu te rathamaṇḍalaṃ","ref":"J. ii 330","es":"¿Dónde, oh rey, está tu fuerza? ¿Dónde está tu carroza real?","en":"Where, O king, is your strength? Where is your array of chariots?"}],"notas":[],"avisos_en":[]},{"id":"kvaci","lema":"kvaci","cab":{"es":"**kvaci**, (sc. *kva-cid*) (part. usada en la 7ª inflexión) Se usa para expresar lugar (*padesavācakā*). En algún lugar. Véase también **katthaci** y **kvacini**.","en":"**kvaci**, (Skt. *kva-cid*) (particle used in the 7th case) Used to express place (*padesavācakā*). Somewhere. See also **katthaci** and **kvacini**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"n’ ev’ ajjhagā piyataram attanā kvaci","ref":"S. i 75","es":"no encontré en alguna parte alguien más querido que mí mismo.","en":"One found no one anywhere dearer than oneself."}],"notas":[],"avisos_en":["block 1: ajjhagā is aorist 3rd sg. ('one/he found', cf. the Udāna/Saṃyutta verse); Spanish has 1st sg. 'no encontré … que mí mismo'."]},{"id":"kvacini","lema":"kvacini","cab":{"es":"**kvacini**, (part. usada en la 7ª inflexión) Véase **kvaci**.","en":"**kvacini**, (particle used in the 7th case) See **kvaci**."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"kkhattum","lema":"kkhattuṃ","cab":{"es":"**kkhattuṃ**, sufijo usado en la partición de números (*saṅkhyāvibhāga*) y para indicar ocasiones, veces (*vāra*).","en":"**kkhattuṃ**, suffix used in the partition of numbers (*saṅkhyāvibhāga*) and to indicate occasions, times (*vāra*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"ekakkhattuṃ","ref":"","es":"una vez.","en":"Once."},{"tipo":"ej","pali":"dvikkhattuṃ","ref":"","es":"dos veces.","en":"Twice."},{"tipo":"ej","pali":"tikkhattuṃ","ref":"","es":"tres veces.","en":"Three times."}],"notas":[],"avisos_en":[]},{"id":"khalu","lema":"khalu","cab":{"es":"**khalu**, (= sc.) (part.) Realmente, verdaderamente, seguramente. Existe en los siguientes significados:","en":"**khalu**, (= Skt.) (particle) Really, truly, surely. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Negación, prohibición (*paṭisedha*).","en":"Negation, prohibition (*paṭisedha*)."},{"tipo":"ej","pali":"khalupacchābhattiko","ref":"Vis. i 58","es":"uno que rehúsa (*khalu*) la comida (*bhatta*) obtenida después (*pacchā*). Ésta es una de las trece prácticas ascéticas (*dhutaṅga*). Esta práctica consiste en la promesa de rehusar cualquier comida extra a partir del momento en que uno ha indicado que ya tiene suficiente.","en":"One who refuses (*khalu*) food (*bhatta*) obtained later (*pacchā*). This is one of the thirteen ascetic practices (*dhutaṅga*). The practice consists in the undertaking to refuse any further food from the moment one has indicated that one has had enough."},{"tipo":"txt","es":"Énfasis (*avadhāraṇa*).","en":"Emphasis (*avadhāraṇa*)."},{"tipo":"ej","pali":"sādhu khalu payaso pānaṃ yaññadattena","ref":"","es":"es realmente buena la bebida de leche (hecha) por Yaññadatta. En este caso **khalu** tiene el mismo significado que **eva**.","en":"Truly good is the drinking of milk by Yaññadatta. In this case **khalu** has the same meaning as **eva**."},{"tipo":"txt","es":"Fama (*pasiddhi*).","en":"Fame (*pasiddhi*)."},{"tipo":"txt","es":"Rumor, reporte (*anussava*):","en":"Rumour, report (*anussava*):"},{"tipo":"ej","pali":"samaṇo khalu bho gotamo","ref":"V. iii 339","es":"dicen que el asceta Gotama. Aquí **khalu** tiene el mismo significado que **kira**, cuando se refiere al reporte de lo que se ha oído.","en":"They say, sirs, the ascetic Gotama… Here **khalu** has the same meaning as **kira**, when it refers to reporting what has been heard."}],"notas":[],"avisos_en":[]},{"id":"kho","lema":"kho","cab":{"es":"**kho**, (sc. *khalu*) (part.) Realmente, verdaderamente. Existe en los siguientes significados:","en":"**kho**, (Skt. *khalu*) (particle) Really, truly. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Énfasis (*avadhāraṇa*):","en":"Emphasis (*avadhāraṇa*):"},{"tipo":"ej","pali":"assosi kho verañjo brāhmaṇo","ref":"V. i 1","es":"un brahmán de Verañja escuchó. Aquí la partícula **kho** se usa para enfatizar la oración.","en":"The brahmin of Verañjā heard. Here the particle **kho** is used to give emphasis to the sentence."}],"notas":[],"avisos_en":[]},{"id":"khippam","lema":"khippaṃ","cab":{"es":"**khippaṃ**, (sc. *kṣipram*) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, de prisa, aprisa.","en":"**khippaṃ**, (Skt. *kṣipram*) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, hastily, speedily."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"khippaṃ dhammaṃ vijānāti","ref":"Dh. 22","es":"comprende rápidamente el Dhamma.","en":"He quickly understands the Dhamma."}],"notas":[],"avisos_en":[]},{"id":"ca","lema":"ca","cab":{"es":"**ca**, (= sc.) (conj.) Y; entonces; ahora; pero; aunque. Existe en los siguientes significados:","en":"**ca**, (= Skt.) (conj.) And; then; now; but; although. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Agrupación; agregación; colección (*samuccaya*):","en":"Grouping; aggregation; collection (*samuccaya*):"},{"tipo":"ej","pali":"annañ ca pānañ ca vatthasenāsanāni ca","ref":"","es":"comida y bebida y ropa-habitación.","en":"Food and drink and clothing and lodgings."},{"tipo":"txt","es":"Coordinación de diferentes acciones (*anvācaya*):","en":"Coordination of different actions (*anvācaya*):"},{"tipo":"ej","pali":"dānañ ca dehi, sīlañ ca rakkhāhi","ref":"","es":"dé limosna y proteja los preceptos. Sad. explica este uso de **ca** como la esfera de acciones separadas (*bhinnakiriyāvisaya*).","en":"Give alms and keep the precepts. Sad. explains this use of **ca** as the sphere of separate actions (*bhinnakiriyāvisaya*)."},{"tipo":"txt","es":"Conexión mutua (*itarītarayoga*):","en":"Mutual connection (*itarītarayoga*):"},{"tipo":"ej","pali":"cando ca sūriyo ca","ref":"","es":"la luna y el sol.","en":"The moon and the sun."},{"tipo":"ej","pali":"samaṇo ca tiṭṭhati, brāhmaṇo ca tiṭṭhati","ref":"","es":"el asceta está parado y el brahmán está parado. Sad. explica este uso de **ca** como la esfera de la misma acción (*samānakiriyāvisaya*).","en":"The ascetic stands and the brahmin stands. Sad. explains this use of **ca** as the sphere of the same action (*samānakiriyāvisaya*)."},{"tipo":"txt","es":"Unión, asociación para formar un todo (*samāhāra*):","en":"Union, association to form a whole (*samāhāra*):"},{"tipo":"ej","pali":"patto ca cīvarañ ca pattacīvaraṃ","ref":"","es":"tazón y manto = tazón-manto.","en":"Bowl and robe = bowl-and-robe."},{"tipo":"txt","es":"Restricción (*avadhāraṇa*):","en":"Restriction (*avadhāraṇa*):"},{"tipo":"ej","pali":"byañjanantassa co chappaccayesu ca","ref":"Kac. §472","es":"la última consonante [de la raíz] se convierte en ‘ca’ solamente cuando sigue el sufijo ‘cha’.","en":"The final consonant [of the root] becomes ‘ca’ only when the suffix ‘cha’ follows."},{"tipo":"txt","es":"Oposición o contraste (*byatireka*):","en":"Opposition or contrast (*byatireka*):"},{"tipo":"ej","pali":"yo <u>ca<\/u> Buddhañ ca Dhammañ ca","ref":"","es":".. (Khu i 42), pero aquel que [ha ido por refugio] al Buddha y al Dhamma.","en":"… <u>but<\/u> he who [has gone for refuge] to the Buddha and to the Dhamma."}],"notas":[],"avisos_en":["block 14: the reference '(Khu i 42)' sits inside the Spanish 'es' text and the 'ref' field is empty; it was dropped from the English — move it to 'ref'."]},{"id":"carahi","lema":"carahi","cab":{"es":"**carahi**, (sc. *tarhi*) (part.) Expletivo (padapūraṇa).","en":"**carahi**, (Skt. *tarhi*) (particle) Expletive (padapūraṇa)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"ciram","lema":"ciraṃ","cab":{"es":"**ciraṃ**, (= sc.) (adv.) Denota un periodo largo de tiempo (*dīghakāla*). Mucho tiempo; por mucho tiempo; que dura mucho.","en":"**ciraṃ**, (= Skt.) (adv.) Denotes a long period of time (*dīghakāla*). A long time; for a long time; long-lasting."},"caso":[],"nir":"2","bloques":[{"tipo":"ej","pali":"ciraṃ jīvantu no ñātī","ref":"Kp. 8","es":"que nuestros familiares vivan por mucho tiempo.","en":"May our relatives live long."}],"notas":[],"avisos_en":[]},{"id":"cirassam","lema":"cirassaṃ","cab":{"es":"**cirassaṃ**, (sc. *cirasya*) Denota un periodo largo de tiempo (*dīghakāla*). Después de mucho tiempo; finalmente.","en":"**cirassaṃ**, (Skt. *cirasya*) Denotes a long period of time (*dīghakāla*). After a long time; at last."},"caso":[],"nir":"2","bloques":[{"tipo":"ej","pali":"cirassaṃ vata passāmi","ref":"S. i 1","es":"después de mucho tiempo realmente veo.","en":"After a long time indeed I see…"}],"notas":[],"avisos_en":[]},{"id":"ce","lema":"ce","cab":{"es":"**ce**, (sc. *ced*) (adv.) Usada para expresar condicionalidad; posición de duda (*saṅkāvaṭṭhāna*); si. No se utiliza nunca al comienzo de la oración. Véase también **sace**.","en":"**ce**, (Skt. *ced*) (adv.) Used to express conditionality; a position of doubt (*saṅkāvaṭṭhāna*); if. It is never used at the beginning of a sentence. See also **sace**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"evaṃ ce sattā jāneyyuṃ","ref":"Iti. 207","es":"si los seres comprendieran así.","en":"If beings knew thus…"},{"tipo":"ej","pali":"manasā ce pasannena bhāsati vā karoti vā","ref":"Dh. 13","es":"si uno habla o actúa con una mente pura.","en":"If one speaks or acts with a pure mind…"}],"notas":[],"avisos_en":[]},{"id":"jatu","lema":"jātu","cab":{"es":"**jātu**, (= sc.) (adv.) Ciertamente, realmente, verdaderamente, evidentemente, definitivamente; en el significado de definitivo, certeza (*ekaṃsattha*).","en":"**jātu**, (= Skt.) (adv.) Certainly, really, truly, evidently, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"idañ hi jātu me diṭṭhaṃ","ref":"S. i 156","es":"ciertamente yo he visto esto.","en":"Certainly I have seen this."}],"notas":[],"avisos_en":[]},{"id":"jatucche","lema":"jātucche","cab":{"es":"**jātucche**, (sc. ) (adv.) Ciertamente, realmente, verdaderamente, evidentemente, definitivamente; en el significado de definitivo, certeza (*ekaṃsattha*).","en":"**jātucche**, (Skt. ) (adv.) Certainly, really, truly, evidently, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na migājina jātucche ahaṃ kañci kudācanaṃ adhammena jine ñātiṃ","ref":"J. ii 171","es":"ciertamente nunca, Migājina, yo he hecho daño a ningún familiar.","en":"Truly, Migājina, I have never at any time unrighteously despoiled any kinsman."}],"notas":[],"avisos_en":["cab: the Sanskrit form after 'sc.' is missing in the source.","block 1: Spanish omits adhammena ('unrighteously') and renders jine as 'hecho daño' (harmed); jināti is closer to 'defeat, despoil'."]},{"id":"je","lema":"je","cab":{"es":"**je**, (intj., voc., sg. f.) Partícula vocativa usada para dirigirse con autoridad a una esclava o a persona inferior.","en":"**je**, (interj., voc., sg. f.) Vocative particle used to address with authority a female slave or a person of inferior status."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"dehi, je ambapāli, etaṃ bhattaṃ satasahassena","ref":"D. ii 82","es":"dé, eh Ambapāli, esta comida por cien mil. Aquí los príncipes Licchavis se dirigen a la cortesana Ambapāli solicitándole que les deje ofrecer la comida al Buddha a cambio de cien mil unidades de dinero.","en":"Give us, hey Ambapālī, this meal for a hundred thousand. Here the Licchavi princes address the courtesan Ambapālī, asking her to let them offer the meal to the Buddha in exchange for a hundred thousand units of money."}],"notas":[],"avisos_en":[]},{"id":"tam","lema":"taṃ","cab":{"es":"**taṃ**, (sc. tad.) (part.) Expletivo (*padapūraṇa*).","en":"**taṃ**, (Skt. tad.) (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"taggha","lema":"taggha","cab":{"es":"**taggha**, (sc. tad + gha) (adv.) Ciertamente, realmente, verdaderamente, evidentemente, definitivamente; en el significado de definitivo, certeza (*ekaṃsattha*).","en":"**taggha**, (Skt. tad + gha) (adv.) Certainly, really, truly, evidently, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"taggha mayaṃ, bhante, abhiratā brahmacariye","ref":"M. ii 126","es":"realmente, Venerable Señor, nosotros nos regocijamos en la vida santa.","en":"Truly, Venerable Sir, we delight in the holy life."}],"notas":[],"avisos_en":[]},{"id":"tato","lema":"tato","cab":{"es":"**tato**, (sc. *tatas*) (part., adv.) Expletivo (*padapūraṇa*); desde allí; a partir de ese lugar; a partir de ese tiempo; después; subsecuentemente; por lo tanto.","en":"**tato**, (Skt. *tatas*) (particle, adv.) Expletive (*padapūraṇa*); from there; from that place; from that time; afterwards; subsequently; therefore."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tatha-r-iva","lema":"tatha-r-iva","cab":{"es":"**tatha-r-iva**, = *tath’ eva*. Véase ejemplos en *yath’ eva*.","en":"**tatha-r-iva**, = *tath’ eva*. See examples under *yath’ eva*."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tatha","lema":"tathā","cab":{"es":"**tathā**, (= sc.) (adv.) Así; de este modo; de la misma manera. A veces se usa junto a **yathā**.","en":"**tathā**, (= Skt.) (adv.) Thus; in this way; in the same manner. Sometimes used together with **yathā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā, bhante, devatānaṃ adhippāyo, tathā hoti","ref":"D. ii 132","es":"Venerable Señor, que sea de acuerdo con el deseo de los dioses. Traducción literal: así como, Venerable Señor, es la intención de los dioses, que así sea.","en":"Venerable Sir, let it be as the deities wish. Literal translation: just as, Venerable Sir, is the intention of the deities, so let it be."}],"notas":[],"avisos_en":[]},{"id":"tatha-ca","lema":"tathā ca","cab":{"es":"**tathā ca**, Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Véase ejemplos en **yathā ca**.","en":"**tathā ca**, Used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this manner. See examples under **yathā ca**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tatha-nama","lema":"tathā nāma","cab":{"es":"**tathā nāma**, se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Véase ejemplos en **yathā nāma**.","en":"**tathā nāma**, used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this manner. See examples under **yathā nāma**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"
