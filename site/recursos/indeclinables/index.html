y, evidently, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na migājina jātucche ahaṃ kañci kudācanaṃ adhammena jine ñātiṃ","ref":"J. ii 171","es":"ciertamente nunca, Migājina, yo he hecho daño a ningún familiar.","en":"Truly, Migājina, I have never at any time unrighteously despoiled any kinsman."}],"notas":[],"avisos_en":["cab: the Sanskrit form after 'sc.' is missing in the source.","block 1: Spanish omits adhammena ('unrighteously') and renders jine as 'hecho daño' (harmed); jināti is closer to 'defeat, despoil'."]},{"id":"je","lema":"je","cab":{"es":"**je**, (intj., voc., sg. f.) Partícula vocativa usada para dirigirse con autoridad a una esclava o a persona inferior.","en":"**je**, (interj., voc., sg. f.) Vocative particle used to address with authority a female slave or a person of inferior status."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"dehi, je ambapāli, etaṃ bhattaṃ satasahassena","ref":"D. ii 82","es":"dé, eh Ambapāli, esta comida por cien mil. Aquí los príncipes Licchavis se dirigen a la cortesana Ambapāli solicitándole que les deje ofrecer la comida al Buddha a cambio de cien mil unidades de dinero.","en":"Give us, hey Ambapālī, this meal for a hundred thousand. Here the Licchavi princes address the courtesan Ambapālī, asking her to let them offer the meal to the Buddha in exchange for a hundred thousand units of money."}],"notas":[],"avisos_en":[]},{"id":"n-tattha","lema":"tattha","nuevo":true,"cab":{"es":"**tattha**, (adv. demostrativo de lugar, 7.ª) Allí, en ello, en ese asunto (= *tasmiṃ*). Correlativo de **yattha**.","en":"**tattha**, (demonstrative adv. of place, 7th case) There, therein, in that matter (= *tasmiṃ*). Correlative of **yattha**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"na hi tattha kasi atthi, gorakkhettha na vijjati","ref":"Khp. 8","es":"pues allí no hay agricultura, ni se encuentra allí la cría de ganado.","en":"for there is no farming there, nor is cattle-keeping found there."},{"tipo":"ej","pali":"dadāti ve yathāsaddhaṃ, yathāpasādanaṃ jano; tattha yo maṅku bhavati, paresaṃ pānabhojane","ref":"Dh. 49","es":"la gente da según su fe, según su confianza; quien en ello se disgusta por la bebida y la comida [dadas] a otros…","en":"people give according to their faith, according to their confidence; whoever is discontented therein, over the drink and food [given] to others…"}],"notas":[],"fuente":{"es":"Saddanīti §494 (Suttamālā, ed. Smith, p. 681); Abhidhānappadīpikā v. 1156: «tattha tatra tahiṃ tahaṃ»; su ṭīkā (p. 603): «tatthādayo niyamaṭṭhānādivācakā». No se ha hallado un comentario que llame a *tattha* expresamente *nipāta*.","en":"Saddanīti §494 (Suttamālā, Smith ed., p. 681); Abhidhānappadīpikā v. 1156: «tattha tatra tahiṃ tahaṃ»; its ṭīkā (p. 603): «tatthādayo niyamaṭṭhānādivācakā». No commentary has been found that explicitly calls *tattha* a *nipāta*."}},{"id":"n-tatra","lema":"tatra","nuevo":true,"cab":{"es":"**tatra**, (adv. demostrativo, 7.ª) Allí, entonces (= *tasmiṃ*). Al comienzo de una frase introduce el enunciado (*vākyopaññāsana*), señalando el lugar y el momento.","en":"**tatra**, (demonstrative adv., 7th case) There, then (= *tasmiṃ*). At the beginning of a sentence it introduces the statement (*vākyopaññāsana*), indicating the place and time."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"tatra kho bhagavā bhikkhū āmantesi: bhikkhavo ti","ref":"S. i 243","es":"Allí el Bhagavā se dirigió a los bhikkhus: «¡Bhikkhus!».","en":"There the Blessed One addressed the bhikkhus: “Bhikkhus!”"}],"notas":[],"fuente":{"es":"Sāratthappakāsinī (SA. ii 1): «tatrā ti desakālaparidīpanaṃ; tañhi yaṃ samayaṃ viharati tatra samaye, yasmiñca jetavane viharati tatra jetavane ti dīpeti». Ṭīkā de Saṃyutta, Mahāvagga (M ii 429): «tatrā ti vākyopaññāsane nipāto». Abhidhānappadīpikā v. 1156. La glosa «tatrā ti vākyopaññāsane nipāto» de la ṭīkā se refiere a otro pasaje, no a la fórmula de S. ii 1; se aplica aquí por analogía.","en":"Sāratthappakāsinī (SA. ii 1): «tatrā ti desakālaparidīpanaṃ; tañhi yaṃ samayaṃ viharati tatra samaye, yasmiñca jetavane viharati tatra jetavane ti dīpeti». Saṃyutta ṭīkā, Mahāvagga (M ii 429): «tatrā ti vākyopaññāsane nipāto». Abhidhānappadīpikā v. 1156. The ṭīkā gloss «tatrā ti vākyopaññāsane nipāto» refers to another passage, not to the formula of S. ii 1; it is applied here by analogy."}},{"id":"n-tayidam","lema":"tayidaṃ","nuevo":true,"cab":{"es":"**tayidaṃ**, (ind.) Eso, esto mismo (*taṃ* + *idaṃ*); según la ṭīkā, nipāta con el sentido «ese, este» (*so ayaṃ*), sin concordancia formal con el neutro *idaṃ*.","en":"**tayidaṃ**, (ind.) That, this very thing (*taṃ* + *idaṃ*); according to the ṭīkā, a nipāta meaning «that, this» (*so ayaṃ*), without formal agreement with the neuter *idaṃ*."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"«Ese, este» (*so ayaṃ*):","en":"«That, this» (*so ayaṃ*):"},{"tipo":"ej","pali":"tayidaṃ, bhikkhave, tathāgato pajānāti – ime diṭṭhiṭṭhānā evaṃgahitā evaṃparāmaṭṭhā evaṃgatikā bhavanti evaṃabhisamparāyā","ref":"D. i 15","es":"Eso, bhikkhus, lo comprende el Tathāgata: «estas bases de opinión, así asidas, así aferradas, conducen a tal destino, a tal estado futuro».","en":"That, bhikkhus, the Tathāgata understands: «these standpoints of views, thus grasped, thus clung to, lead to such a destination, to such a future state»."}],"notas":[],"fuente":{"es":"Comentario: AṬ. i 150 y Vis-ṭ. i 104 (sobre «tayidaṃ āyasmā sāriputto/mahākassapo dhuto ceva dhutavādo ca», Vis. i 78, AA. i 127): «tayidanti nipāto, tassa so ayanti attho» (es nipāta; su sentido es «ese, este», masculino singular, referido a *āyasmā*). DA. i 228 analiza otro caso: «tayidanti taṃ idaṃ». En la mayoría de los usos canónicos *tayidaṃ* es simplemente *taṃ* + *idaṃ* (pronombres); ninguna ṭīkā comenta como nipāta el ejemplo de D. i 15.","en":"Commentary: AṬ. i 150 and Vis-ṭ. i 104 (on «tayidaṃ āyasmā sāriputto/mahākassapo dhuto ceva dhutavādo ca», Vis. i 78, AA. i 127): «tayidanti nipāto, tassa so ayanti attho» (it is a nipāta; its sense is «that, this», masculine singular, referring to *āyasmā*). DA. i 228 analyses another case: «tayidanti taṃ idaṃ». In most canonical uses *tayidaṃ* is simply *taṃ* + *idaṃ* (pronouns); no ṭīkā comments on the D. i 15 example as a nipāta."}},{"id":"n-taham","lema":"tahaṃ","nuevo":true,"cab":{"es":"**tahaṃ**, (adv. demostrativo de lugar, 7.ª) Allí (= *tasmiṃ*); variante de **tahiṃ**. Casi siempre repetido: *tahaṃ tahaṃ* «aquí y allá, por todas partes».","en":"**tahaṃ**, (demonstrative adv. of place, 7th case) There (= *tasmiṃ*); variant of **tahiṃ**. Almost always repeated: *tahaṃ tahaṃ* “here and there, all over”."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"addasa santhatāni tahaṃ tahaṃ ujjhitāni","ref":"V. i 338","es":"vio las alfombras [de fieltro] tiradas aquí y allá.","en":"he saw the [felt] rugs thrown away here and there."}],"notas":[],"fuente":{"es":"Saddanīti §501 (Suttamālā, ed. Smith, p. 682): «Tato hiṃ-haṃ: tahiṃ tahaṃ»; Abhidhānappadīpikā v. 1156: «tattha tatra tahiṃ tahaṃ». Rūpasiddhi (p. 124): «tasmin ti tahiṃ tahaṃ». Bālāvatāra (M 127): «Tamhā ce’ti hiṃhaṃ. Tahiṃ, tahaṃ». En los textos canónicos de CST no se ha hallado *tahaṃ* aislado, solo repetido (*tahaṃ tahaṃ*).","en":"Saddanīti §501 (Suttamālā, Smith ed., p. 682): «Tato hiṃ-haṃ: tahiṃ tahaṃ»; Abhidhānappadīpikā v. 1156: «tattha tatra tahiṃ tahaṃ». Rūpasiddhi (p. 124): «tasmin ti tahiṃ tahaṃ». Bālāvatāra (M 127): «Tamhā ce’ti hiṃhaṃ. Tahiṃ, tahaṃ». In the canonical texts of CST *tahaṃ* has not been found on its own, only repeated (*tahaṃ tahaṃ*)."}},{"id":"n-tahim","lema":"tahiṃ","nuevo":true,"cab":{"es":"**tahiṃ**, (adv. demostrativo de lugar, 7.ª) Allí, en ese lugar (= *tasmiṃ*). Correlativo de **yahiṃ**; repetido, *tahiṃ tahiṃ* «aquí y allá».","en":"**tahiṃ**, (demonstrative adv. of place, 7th case) There, in that place (= *tasmiṃ*). Correlative of **yahiṃ**; repeated, *tahiṃ tahiṃ* “here and there”."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ito dinnena yāpenti, petā kālaṅkatā tahiṃ","ref":"Khp. 8","es":"los petas, los que han muerto, subsisten allí con lo que se da desde aquí.","en":"the petas, those who have died, live there on what is given from here."},{"tipo":"ej","pali":"yahiṃ yahiṃ gacchati puññakammo, tahiṃ tahiṃ modati kāmakāmī","ref":"Vv. 120","es":"adondequiera que vaya quien ha hecho méritos, allí se regocija, obteniendo lo que desea.","en":"wherever the doer of merit goes, there he rejoices, getting what he desires."}],"notas":[],"fuente":{"es":"Saddanīti §501 (Suttamālā, ed. Smith, p. 682): «Tato hiṃ-haṃ: tahiṃ tahaṃ · tasmiṃ vā»; Abhidhānappadīpikā v. 1156: «tattha tatra tahiṃ tahaṃ». Rūpasiddhi (p. 124): «tasmin ti tahiṃ tahaṃ». Bālāvatāra (M 127): «Tamhā ce’ti hiṃhaṃ. Tahiṃ, tahaṃ». No se ha hallado un comentario que lo llame expresamente *nipāta*.","en":"Saddanīti §501 (Suttamālā, Smith ed., p. 682): «Tato hiṃ-haṃ: tahiṃ tahaṃ · tasmiṃ vā»; Abhidhānappadīpikā v. 1156: «tattha tatra tahiṃ tahaṃ». Rūpasiddhi (p. 124): «tasmin ti tahiṃ tahaṃ». Bālāvatāra (M 127): «Tamhā ce’ti hiṃhaṃ. Tahiṃ, tahaṃ». No commentary has been found that explicitly calls it a *nipāta*."}},{"id":"tam","lema":"taṃ","cab":{"es":"**taṃ**, (sc. tad.) (part.) Expletivo (*padapūraṇa*).","en":"**taṃ**, (Skt. tad.) (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"taggha","lema":"taggha","cab":{"es":"**taggha**, (sc. tad + gha) (adv.) Ciertamente, realmente, verdaderamente, evidentemente, definitivamente; en el significado de definitivo, certeza (*ekaṃsattha*).","en":"**taggha**, (Skt. tad + gha) (adv.) Certainly, really, truly, evidently, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"taggha mayaṃ, bhante, abhiratā brahmacariye","ref":"M. ii 126","es":"realmente, Venerable Señor, nosotros nos regocijamos en la vida santa.","en":"Truly, Venerable Sir, we delight in the holy life."}],"notas":[],"avisos_en":[]},{"id":"tato","lema":"tato","cab":{"es":"**tato**, (sc. *tatas*) (part., adv.) Expletivo (*padapūraṇa*); desde allí; a partir de ese lugar; a partir de ese tiempo; después; subsecuentemente; por lo tanto.","en":"**tato**, (Skt. *tatas*) (particle, adv.) Expletive (*padapūraṇa*); from there; from that place; from that time; afterwards; subsequently; therefore."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tatha-r-iva","lema":"tatha-r-iva","cab":{"es":"**tatha-r-iva**, = *tath’ eva*. Véase ejemplos en *yath’ eva*.","en":"**tatha-r-iva**, = *tath’ eva*. See examples under *yath’ eva*."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tatha","lema":"tathā","cab":{"es":"**tathā**, (= sc.) (adv.) Así; de este modo; de la misma manera. A veces se usa junto a **yathā**.","en":"**tathā**, (= Skt.) (adv.) Thus; in this way; in the same manner. Sometimes used together with **yathā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā, bhante, devatānaṃ adhippāyo, tathā hoti","ref":"D. ii 132","es":"Venerable Señor, que sea de acuerdo con el deseo de los dioses. Traducción literal: así como, Venerable Señor, es la intención de los dioses, que así sea.","en":"Venerable Sir, let it be as the deities wish. Literal translation: just as, Venerable Sir, is the intention of the deities, so let it be."}],"notas":[],"avisos_en":[]},{"id":"tatha-ca","lema":"tathā ca","cab":{"es":"**tathā ca**, Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Véase ejemplos en **yathā ca**.","en":"**tathā ca**, Used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this manner. See examples under **yathā ca**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tatha-nama","lema":"tathā nāma","cab":{"es":"**tathā nāma**, se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Véase ejemplos en **yathā nāma**.","en":"**tathā nāma**, used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this manner. See examples under **yathā nāma**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tatha-hi","lema":"tathā hi","cab":{"es":"**tathā hi**, (= sc.) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Correlativo de **yathā hi**. Véase ejemplos en **yathā hi**.","en":"**tathā hi**, (= Skt.) Used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this manner. Correlative of **yathā hi**. See examples under **yathā hi**."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Delimitación de causa (*kāraṇacchedana*):","en":"Delimitation of cause (*kāraṇacchedana*):"},{"tipo":"ej","pali":"tathā hi pana me, ayyaputtā, bhagavā nimantito svātanāya bhattaṃ saddhiṃ bhikkhusaṃghena","ref":"D. ii 82","es":"Porque, jóvenes señores, he invitado al Sublime junto con la comunidad de bhikkhus para la comida de mañana.","en":"For, young lords, I have invited the Blessed One together with the community of bhikkhus for tomorrow's meal."},{"tipo":"txt","es":"Confirmación; hacer firme (*daḷhīkaraṇa*):","en":"Confirmation; making firm (*daḷhīkaraṇa*):"},{"tipo":"ej","pali":"tathā hi vuttaṃ","ref":"","es":"porque se ha dicho...","en":"For it has been said…"}],"notas":[],"avisos_en":[]},{"id":"tath-eva","lema":"tath’ eva","cab":{"es":"**tath’ eva**, (sc. *tathā + eva*) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Lo mismo que; al igual que; de la misma manera; así; como. Otra forma es **tatha-r-iva**. Es el correlativo de **yath’ eva**: **yath’ eva**, como; **tath’ eva**, así. Véase ejemplos en **yath’ eva**.","en":"**tath’ eva**, (Skt. *tathā + eva*) Used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). The same as; just like; in the same manner; thus; as. Another form is **tatha-r-iva**. It is the correlative of **yath’ eva**: **yath’ eva**, as; **tath’ eva**, so. See examples under **yath’ eva**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"aḍḍhā daliddā ca phusanti phassaṃ, bālo ca dhīro ca tath’ eva phuṭṭho","ref":"M. ii 261","es":"El rico y el pobre sienten el toque [de la muerte], el necio y el sabio, de la misma manera, son tocados.","en":"The rich and the poor feel the touch [of death]; the fool and the wise are touched in just the same way."}],"notas":[],"avisos_en":[]},{"id":"tada","lema":"tadā","cab":{"es":"**tadā**, (= sc.) (part. usada en la 7ª inflexión —tiempo) Luego; entonces; después; en ese tiempo. Se usa junto con **yadā**.","en":"**tadā**, (= Skt.) (particle used in the 7th case — time) Then; at that time; afterwards; at that time. Used together with **yadā**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"tadā acelako devadatto ahosi","ref":"JA. v 91","es":"en ese tiempo el asceta desnudo era Devadatta.","en":"At that time the naked ascetic was Devadatta."},{"tipo":"ej","pali":"tadā bodhisatto tassa aggamahesiyā kucchimhi nibbatti","ref":"JA. v 23","es":"en ese tiempo el Bodhisatta reconectó en el vientre de la reina principal.","en":"At that time the Bodhisatta was reborn in the womb of his chief queen."}],"notas":[],"avisos_en":[]},{"id":"tadani","lema":"tadāni","cab":{"es":"**tadāni**, (sc. *tadānīm*) (part. usada en la 7ª inflexión —tiempo) Luego; entonces; en ese tiempo.","en":"**tadāni**, (Skt. *tadānīm*) (particle used in the 7th case — time) Then; at that time."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tasma","lema":"tasmā","cab":{"es":"**tasmā**, (sc. *tasmāt*). Partícula de delimitación de causa (*kāraṇacchedana*). Por lo tanto; a causa de. Se usa con **yasmā**.","en":"**tasmā**, (Skt. *tasmāt*). Particle of delimitation of cause (*kāraṇacchedana*). Therefore; because of. Used with **yasmā**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tave","lema":"tave","cab":{"es":"**tave**, (sufijo usado en la 4ª inflexión) Junto con el sufijo tuṃ se usa para expresar el infinitivo.","en":"**tave**, (suffix used in the 4th case) Together with the suffix tuṃ it is used to express the infinitive."},"caso":["4"],"nir":"","bloques":[{"tipo":"ej","pali":"kātave","ref":"","es":"hacer","en":"to do"},{"tipo":"ej","pali":"dātave","ref":"","es":"dar","en":"to give"}],"notas":[],"avisos_en":[]},{"id":"tava","lema":"tāva","cab":{"es":"**tāva**, (sc. *tāvat*) Partícula de delimitación (*paricchedana*). Tanto; entonces; luego. Se usa con **yāva** (ver más ejemplos).","en":"**tāva**, (Skt. *tāvat*) Particle of delimitation (*paricchedana*). So much; then; next. Used with **yāva** (see further examples)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tavata","lema":"tāvatā","cab":{"es":"**tāvatā**, (= sc.) Partícula de delimitación (*paricchedana*). Tanto; luego. Ver ejemplos en **yāvatā**.","en":"**tāvatā**, (= Skt.) Particle of delimitation (*paricchedana*). So much; then. See examples under **yāvatā**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"ti","lema":"ti","cab":{"es":"**ti**, véase **iti**.","en":"**ti**, see **iti**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tiriyam","lema":"tiriyaṃ","cab":{"es":"**tiriyaṃ**, (sc. *tiryak*) (part. usada en la 7ª inflexión) A través; a lo ancho.","en":"**tiriyaṃ**, (Skt. *tiryak*) (particle used in the 7th case) Across; crosswise."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sakim pi tiriyaṃ gacchati","ref":"M. iii 221","es":"una vez va a un lado.","en":"Even once he goes sideways."}],"notas":[],"avisos_en":[]},{"id":"tiro","lema":"tiro","cab":{"es":"**tiro**, (sc. *tiraḥ*) (part. usada en la 7ª inflexión) A través; más allá; en el otro lado; fuera. Normalmente se usa en compuestos.","en":"**tiro**, (Skt. *tiraḥ*) (particle used in the 7th case) Across; beyond; on the other side; outside. Normally used in compounds."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"tirobhāvaṃ tirokuṭṭaṃ tiropākāraṃ tiropabbataṃ asajjamāno gacchati seyyathā pi ākāse","ref":"D. i 73","es":"pasa sin obstrucción a través de paredes, a través de murallas, a través de montañas, como si fuera por el aire.","en":"[Appearing and] vanishing, he goes unobstructed through walls, through ramparts, through mountains, as if through space."}],"notas":[],"avisos_en":["block 1: Spanish leaves tirobhāvaṃ ('vanishing') untranslated; the standard formula pairs it with āvibhāvaṃ, which is not in the quoted Pāḷi — hence the bracket."]},{"id":"n-tiha","lema":"tiha","nuevo":true,"cab":{"es":"**tiha**, (part.) Partícula expletiva tras *tasmā* («por tanto»).","en":"**tiha**, (part.) Expletive particle after *tasmā* («therefore»)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Mero nipāta (*nipātamatta*), tasmātiha = tasmā:","en":"Mere particle (*nipātamatta*), tasmātiha = tasmā:"},{"tipo":"ej","pali":"tasmātiha te, bāhiya, evaṃ sikkhitabbaṃ – diṭṭhe diṭṭhamattaṃ bhavissati","ref":"Ud. 85","es":"Por tanto, Bāhiya, así debes entrenarte: en lo visto habrá solo lo visto.","en":"Therefore, Bāhiya, you should train thus: in the seen there will be merely the seen."}],"notas":[],"fuente":{"es":"Comentario: UdA. 81 (sobre este pasaje): «tasmā tihāti nipātamattaṃ. Teti tayā»; igual Vibh-mūlaṭ. 182; ItA. 142: «tasmātihāti nipātamattaṃ»; Vimativinodanī ii 93: «tihāti nipātamattaṃ, tasmāti attho».","en":"Commentary: UdA. 81 (on this passage): «tasmā tihāti nipātamattaṃ. Teti tayā»; likewise Vibh-mūlaṭ. 182; ItA. 142: «tasmātihāti nipātamattaṃ»; Vimativinodanī ii 93: «tihāti nipātamattaṃ, tasmāti attho»."}},{"id":"tu","lema":"tu","cab":{"es":"**tu**, (= sc.) (part..) Sin embargo, no obstante; pero; ahora; realmente, en verdad. Existe en los siguientes significados:","en":"**tu**, (= Skt.) (particle) However, nevertheless; but; now; really, in truth. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Excepción, distinción (*visesa*)","en":"Exception, distinction (*visesa*)"},{"tipo":"txt","es":"Causa (*hetu*).","en":"Cause (*hetu*)."},{"tipo":"txt","es":"Exclusión de término particular (*nivattana; visesanivattana*).","en":"Exclusion of a particular term (*nivattana; visesanivattana*)."},{"tipo":"txt","es":"Certeza, certidumbre (*ekaṃsa*).","en":"Certainty, certitude (*ekaṃsa*)."},{"tipo":"ej","pali":"seyyo amitto matiyā upeto, na tv eva mitto mativippahīno","ref":"J. i 11","es":"realmente es mejor un enemigo dotado de sabiduría y no un amigo carente de sabiduría.","en":"Truly better is an enemy endowed with wisdom, and not a friend devoid of wisdom."},{"tipo":"txt","es":"Ornato, adorno lingüístico (*vacanālaṅkāra*).","en":"Ornament, linguistic embellishment (*vacanālaṅkāra*)."}],"notas":[],"avisos_en":["cab: source has '(part..)' with a double full stop; rendered '(particle)'."]},{"id":"n-tuva","lema":"tuva","nuevo":true,"cab":{"es":"**tuva**, (part.) Partícula de relleno (*padapūraṇa*), según la lista de Rūpasiddhi.","en":"**tuva**, (part.) A verse-filler particle (*padapūraṇa*), according to Rūpasiddhi’s list."},"caso":[],"nir":"","bloques":[],"notas":[],"fuente":{"es":"Rūpasiddhi (p. 132), lista de *padapūraṇa*: «… taṃ vā ca tuva vo pana ha ve kīva ha tato yathā sudaṃ kho ve haṃ enaṃ seyyathidaṃ iccevamādīni padapūraṇāni». No se ha hallado en CST *tuva* usado como partícula de relleno; las formas *tuva(ṃ)* de los versos del Jātaka (p. ej. «dubbaṇṇarūpaṃ tuvam ariyavaṇṇī») son el pronombre *tvaṃ*.","en":"Rūpasiddhi (p. 132), *padapūraṇa* list: «… taṃ vā ca tuva vo pana ha ve kīva ha tato yathā sudaṃ kho ve haṃ enaṃ seyyathidaṃ iccevamādīni padapūraṇāni». *tuva* used as a verse-filler has not been found in CST; the forms *tuva(ṃ)* in the Jātaka verses (e.g. «dubbaṇṇarūpaṃ tuvam ariyavaṇṇī») are the pronoun *tvaṃ*."}},{"id":"tum","lema":"tuṃ","cab":{"es":"**tuṃ**, (sufijo usado en la 4ª inflexión) Junto con el sufijo **tave** se usa para expresar el infinitivo.","en":"**tuṃ**, (suffix used in the 4th case) Together with the suffix **tave** it is used to express the infinitive."},"caso":["4"],"nir":"","bloques":[{"tipo":"ej","pali":"kātuṃ","ref":"","es":"hacer","en":"to do"},{"tipo":"ej","pali":"dātuṃ","ref":"","es":"dar","en":"to give"}],"notas":[],"avisos_en":[]},{"id":"tunnam","lema":"tuṇṇaṃ","cab":{"es":"**tuṇṇaṃ**, (sc. tūrṇam) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, deprisa, aprisa.","en":"**tuṇṇaṃ**, (Skt. tūrṇam) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, hastily, speedily."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"tunhi","lema":"tuṇhī","cab":{"es":"**tuṇhī**, (sc. tūṣṇīm) no hablar (*abhāsana*). Silencio.","en":"**tuṇhī**, (Skt. tūṣṇīm) not speaking (*abhāsana*). Silence."},"caso":[],"nir":"1","bloques":[{"tipo":"ej","pali":"rājā māgadho ajātasattu vedehiputto tuṇhī ahosi","ref":"D. i 44","es":"el rey de Māgadha Ajātasattu, hijo de Vedehī, permaneció en silencio.","en":"King Ajātasattu of Magadha, son of Vedehī, remained silent."}],"notas":[],"avisos_en":[]},{"id":"tuna","lema":"tuna","cab":{"es":"**tuna**, (sufijo), cuando hay dos acciones en la oración, la acción primaria y la acción secundaria, este sufijo se aplica al verbo que representa la acción secundaria. Véase también **tvā** y **tvāna**.","en":"**tuna**, (suffix), when there are two actions in the sentence, the primary action and the secondary action, this suffix is applied to the verb that represents the secondary action. See also **tvā** and **tvāna**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"passituna","ref":"","es":"habiendo visto/después de haber visto.","en":"Having seen / after having seen."}],"notas":[],"avisos_en":[]},{"id":"tuvatam","lema":"tuvaṭaṃ","cab":{"es":"**tuvaṭaṃ**, (sc. *tvatitam*) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, deprisa, aprisa.","en":"**tuvaṭaṃ**, (Skt. *tvatitam*) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, hastily, speedily."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"tuvaṭaṃ kho, ayyaputta, āgaccheyyāsi","ref":"Ud. 101","es":"señor regrese pronto.","en":"Come back quickly, young master."}],"notas":[],"avisos_en":[]},{"id":"tena","lema":"tena","cab":{"es":"**tena**, (= sc.) Partícula de delimitación de causa (*kāraṇacchedana*). Por lo tanto; por esta razón; por esto.","en":"**tena**, (= Skt.) Particle of delimitation of cause (*kāraṇacchedana*). Therefore; for this reason; because of this."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"suññaṃ me agāraṃ pavisitabbaṃ ahosi, tena pāvisiṃ","ref":"M. ii 188","es":"tenía que entrar en una casa vacía, por esto entré.","en":"I had to enter an empty house; therefore I entered."}],"notas":[],"avisos_en":[]},{"id":"tena-hi","lema":"tena hi","cab":{"es":"**tena hi**, (= sc.) Por lo tanto; en ese caso.","en":"**tena hi**, (= Skt.) Therefore; in that case."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"tena hi, brāhmaṇa, tvañ ñeva bhagavato sarīrāni aṭṭhadhā samaṃ suvibhattaṃ vibhajāhi","ref":"D. ii 137","es":"en ese caso, brahmán, divida imparcialmente los restos del Sublime en ocho partes iguales.","en":"In that case, brahmin, you yourself divide the relics of the Blessed One into eight equal, well-apportioned parts."}],"notas":[],"avisos_en":[]},{"id":"to","lema":"to","cab":{"es":"**to**, (sufijo usado en la 3ª, 5ª y 7ª inflexión)","en":"**to**, (suffix used in the 3rd, 5th and 7th case)"},"caso":["3","5","7"],"nir":"","bloques":[{"tipo":"txt","es":"En la 3ª inflexión:","en":"In the 3rd case:"},{"tipo":"ej","pali":"aniccato","ref":"","es":"por el modo de impermanente.","en":"As impermanent."},{"tipo":"txt","es":"En la 5ª inflexión:","en":"In the 5th case:"},{"tipo":"ej","pali":"mātito ca pitito saṃsuddhagahaṇiko","ref":"D. i 106","es":"puro del lado de la madre y del lado del padre.","en":"Of pure descent on the mother's side and on the father's side."},{"tipo":"txt","es":"En la 7ª inflexión:","en":"In the 7th case:"},{"tipo":"ej","pali":"sīsato","ref":"","es":"en la cabeza.","en":"On the head."}],"notas":[],"avisos_en":[]},{"id":"tra","lema":"tra","cab":{"es":"**tra**, (sufijo usado en la 7ª inflexión)","en":"**tra**, (suffix used in the 7th case)"},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"yatra","ref":"","es":"donde.","en":"where."},{"tipo":"ej","pali":"tatra","ref":"","es":"allí; en ese lugar.","en":"there; in that place."}],"notas":[],"avisos_en":[]},{"id":"tva","lema":"tvā","cab":{"es":"**tvā**, (sufijo) cuando hay dos acciones en la oración, la acción primaria y la acción secundaria, este sufijo se aplica al verbo que representa la acción secundaria. Véase también **tuna** y **tvāna**.","en":"**tvā**, (suffix) when there are two actions in the sentence, the primary action and the secondary action, this suffix is applied to the verb that represents the secondary action. See also **tuna** and **tvāna**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"disvā","ref":"","es":"habiendo visto o después de haber visto.","en":"Having seen or after having seen."},{"tipo":"ej","pali":"datvā","ref":"","es":"habiendo dado o después de haber dado.","en":"Having given or after having given."}],"notas":[],"avisos_en":[]},{"id":"tvana","lema":"tvāna","cab":{"es":"**tvāna**, (sufijo), cuando hay dos acciones en la oración, la acción primaria y la acción secundaria, este sufijo se aplica al verbo que representa la acción secundaria. Véase también **tuna** y **tvā**.","en":"**tvāna**, (suffix): when there are two actions in the sentence, a primary action and a secondary action, this suffix is applied to the verb expressing the secondary action. See also **tuna** and **tvā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"disvāna","ref":"","es":"habiendo visto/después de haber visto.","en":"having seen / after having seen."},{"tipo":"ej","pali":"datvāna","ref":"","es":"habiendo dado/después de haber dado.","en":"having given / after having given."}],"notas":[],"avisos_en":[]},{"id":"tha","lema":"thā","cab":{"es":"**thā**, (sufijo usado en la 7ª inflexión) Se usa con relación a lugar y tiempo.","en":"**thā**, (suffix used in the 7th case) Used with reference to place and time."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sabbathā","ref":"","es":"en todas las formas, de todas las formas.","en":"in every way; in all ways."}],"notas":[],"avisos_en":["block 0: sabbathā is an adverb of manner ('in every way'), which does not illustrate the place/time sense stated in the heading; translated as is."]},{"id":"dani","lema":"dāni","cab":{"es":"**dāni**, véase **idāni**.","en":"**dāni**, see **idāni**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"n-dittha","lema":"diṭṭhā","nuevo":true,"cab":{"es":"**diṭṭhā**, (sc. *diṣṭyā*) (ind.) ¡Qué dicha!, ¡por fortuna! Expresa alegría.","en":"**diṭṭhā**, (Skt. *diṣṭyā*) (ind.) What joy!, how fortunate! Expresses gladness."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Alegría (*ānanda*):","en":"Joy (*ānanda*):"},{"tipo":"ej","pali":"diṭṭhā, bho, sattā jīvasi","ref":"D. iii 61","es":"¡qué dicha, buen ser, que estés vivo!","en":"what joy, good being, that you are alive!"}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1151 («ānande sañca diṭṭhā»); Abhidhānappadīpikāṭīkā v. 1151 (M 601): «Saṃsaddo diṭṭhāsaddo ānandatthe»; DA. iii 38 (P 855) llama a la frase *sammodanakathā*: «yathā ahaṃ jīvāmi diṭṭhā bho sattā, tvampi tathā jīvasīti evaṃ sammodanakathāya». Que *diṭṭhā* sea aquí la partícula de alegría es una interpretación: ningún comentario lo dice expresamente; la apoyan la falta de concordancia con el sujeto (2.ª sg. masc.; el participio sería *diṭṭho*) y que DA llama a la frase *sammodanakathā*. Otras frases con *diṭṭhā vata* (p. ej. JA. ii 54 «diṭṭhā vata me paccāmittassa piṭṭhī») son el participio que concuerda con un femenino, no esta partícula.","en":"Abhidhānappadīpikā v. 1151; Abhidhānappadīpikāṭīkā v. 1151 (M 601): «Saṃsaddo diṭṭhāsaddo ānandatthe»; DA. iii 38 (P 855) calls the phrase *sammodanakathā*: «yathā ahaṃ jīvāmi diṭṭhā bho sattā, tvampi tathā jīvasīti evaṃ sammodanakathāya». That *diṭṭhā* is here the particle of joy is an interpretation: no commentary says so explicitly; it is supported by the lack of agreement with the subject (2nd sg. masc.; the participle would be *diṭṭho*) and by DA calling the phrase *sammodanakathā*. Other phrases with *diṭṭhā vata* (e.g. JA. ii 54 «diṭṭhā vata me paccāmittassa piṭṭhī») are the participle agreeing with a feminine, not this particle."}},{"id":"diva","lema":"divā","cab":{"es":"**divā**, (= sc.) (Adv., part. 1ª , 2ª y 7ª (tiempo) inflexión) Día; durante el día; en el día.","en":"**divā**, (= Skt.) (adv., particle in the 1st, 2nd and 7th (time) case) Day; during the day; by day."},"caso":["1","2","7"],"nir":"","bloques":[{"tipo":"txt","es":"En la 1ª inflexión:","en":"In the 1st case:"},{"tipo":"ej","pali":"rattiṃ yeva samānaṃ divā ti sañjānanti","ref":"M. i 26","es":"perciben la noche, siendo noche, como día.","en":"they perceive the night, while it is night, as day."},{"tipo":"txt","es":"En la 2ª inflexión:","en":"In the 2nd case:"},{"tipo":"ej","pali":"divā yeva samānaṃ rattī ti sañjānanti","ref":"M. i 26","es":"perciben el día, siendo día, como noche.","en":"they perceive the day, while it is day, as night."},{"tipo":"txt","es":"En la 7ª inflexión:","en":"In the 7th case:"},{"tipo":"ej","pali":"yaṃ divā pāpakammaṃ kataṃ hoti, taṃ sāyaṃ nhānena pavāhemi","ref":"S. i 185","es":"la mala acción que he hecho durante el día, la elimino en la tarde por medio del baño.","en":"the evil deed that has been done by day, I wash away in the evening by bathing."}],"notas":[],"avisos_en":[]},{"id":"dutthu","lema":"duṭṭhu","cab":{"es":"**duṭṭhu**, (sc. *duṣṭhu*) Denota repugnancia (*jigucchā*), que es despreciable, vil (*kucchita*). Mal; malo.","en":"**duṭṭhu**, (Skt. *duṣṭhu*) Denotes repugnance (*jigucchā*), that which is contemptible, vile (*kucchita*). Badly; bad."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"duṭṭhu kataṃ","ref":"","es":"mal hecho.","en":"badly done."}],"notas":[],"avisos_en":[]},{"id":"n-dosa","lema":"doso","nuevo":true,"cab":{"es":"**doso**, (adv.) De noche.","en":"**doso**, (adv.) At night."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"De noche (*rajanī*):","en":"At night (*rajanī*):"}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1147: «nattaṃ doso divā tva’he» (*doso* en el texto; la nota «rattaṃ (ṭī.)» se refiere a *nattaṃ*); Abh-ṭ. 600: «nattaṃ doso ca rajanīyamiccatthe» (*nattaṃ* y *doso*, en el sentido de «noche»). Vinayālaṅkāra-ṭīkā i 11 cita Abh con la misma lectura: «nattaṃ doso divā tvahe». La forma *dosā* no aparece en CST. No se ha hallado en CST ningún ejemplo de uso.","en":"Abhidhānappadīpikā v. 1147: «nattaṃ doso divā tva’he» (*doso* in the text; the note «rattaṃ (ṭī.)» refers to *nattaṃ*); Abh-ṭ. 600: «nattaṃ doso ca rajanīyamiccatthe» (*nattaṃ* and *doso*, in the sense of “night”). Vinayālaṅkāra-ṭīkā i 11 quotes Abh with the same reading: «nattaṃ doso divā tvahe». The form *dosā* does not occur in CST. No example of use has been found in CST."}},{"id":"dha","lema":"dhā","cab":{"es":"**dhā**, (sufijo usado en la 3ª inflexión y partición de números (*saṅkhyāvibhāga*)).","en":"**dhā**, (suffix used in the 3rd case and in the distribution of numbers (*saṅkhyāvibhāga*))."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"ekadhā","ref":"","es":"en una forma; en un modo; en uno.","en":"in one way; in one manner; as one."},{"tipo":"ej","pali":"dvidhā","ref":"","es":"en dos formas; en dos modos; en dos.","en":"in two ways; in two manners; in two."}],"notas":[],"avisos_en":[]},{"id":"dhir-atthu","lema":"dhir atthu","cab":{"es":"**dhir atthu**, (sc. *dhik*) Interjección de reproche (*garaha*). ¡Vergüenza!","en":"**dhir atthu**, (Skt. *dhik*) Interjection of reproach (*garaha*). Shame!"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"dhir atthu taṃ janapadaṃ","ref":"J. i 4","es":"¡Vergüenza a ese país!","en":"Shame on that country!"}],"notas":[],"avisos_en":[]},{"id":"dhi","lema":"dhi","cab":{"es":"**dhi**, (sc. *dhik*) = **dhī**","en":"**dhi**, (Skt. *dhik*) = **dhī**"},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"dhi-2","lema":"dhī","cab":{"es":"**dhī**, (sc. *dhik*) Interjección de reproche (*garaha*).¡Vergüenza!","en":"**dhī**, (Skt. *dhik*) Interjection of reproach (*garaha*). Shame!"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"dhī, brāhmaṇassa hantāraṃ","ref":"Dh. 69","es":"¡Vergüenza a aquel que golpea a un brahmán!","en":"Shame on one who strikes a brahmin!"}],"notas":[],"avisos_en":[]},{"id":"dhuvam","lema":"dhuvaṃ","cab":{"es":"**dhuvaṃ**, (sc. *dhruva*) (adv.) Se usa en el significado de sólido, perdurable, firme (*thira*), para dar énfasis (*avadhāraṇa*) y expresar certidumbre (*ekaṃsa*). Ciertamente; constantemente; firmemente.","en":"**dhuvaṃ**, (Skt. *dhruva*) (adv.) Used in the sense of solid, lasting, firm (*thira*), for emphasis (*avadhāraṇa*), and to express certainty (*ekaṃsa*). Certainly; constantly; firmly."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yassa natthi dhuvaṃ ṭhiti","ref":"M. ii 252","es":"de éste ciertamente no hay nada estable.","en":"for which there is no lasting stability."},{"tipo":"ej","pali":"dhuvaṃ buddho bhavissati","ref":"Bv. 312","es":"ciertamente serás un Buddha","en":"he will certainly become a Buddha."}],"notas":[],"avisos_en":["block 0: Spanish takes dhuvaṃ as 'ciertamente' (certainly); in 'natthi dhuvaṃ ṭhiti' it more naturally qualifies ṭhiti ('no lasting/firm stability', the thira sense); English follows the Pāli.","block 1: Spanish 'serás' (2nd person), but bhavissati is 3rd sg.; English 'he will'. (The Bv. formula elsewhere has bhavissasi; worth checking the source reading.)"]},{"id":"na","lema":"na","cab":{"es":"**na**, (= sc.) (part. de neg.) No. Existe en los siguientes significados:","en":"**na**, (= Skt.) (negative particle) Not. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Negación (*paṭisedhana*):","en":"Negation (*paṭisedhana*):"},{"tipo":"ej","pali":"na hi verena verāni sammanti","ref":"Dh. 13","es":"el odio no se apacigua por medio del odio.","en":"for hatreds are not appeased by hatred."},{"tipo":"txt","es":"Comparación (*upamāna*):","en":"Comparison (*upamāna*):"},{"tipo":"ej","pali":"Yaṃ na kañcanadepiñcha, andhena tamasā gataṃ","ref":"J. ii 83","es":"oh ave de alas doradas, ida de la ciega oscuridad.","en":"like [you], O golden-winged bird, gone into blind darkness."}],"notas":[],"avisos_en":["block 3: uncertain reading/construal of 'Yaṃ na kañcanadepiñcha, andhena tamasā gataṃ'; Spanish 'ida de la ciega oscuridad' (gone FROM the darkness), whereas instr. andhena tamasā + gataṃ suggests 'gone into/overcome by blind darkness'. Needs checking against J. ii 83 and its commentary."]},{"id":"n-natthi","lema":"natthi","nuevo":true,"cab":{"es":"**natthi**, (part. con forma de verbo, *ākhyātapaṭirūpaka*) No hay, no existe. Según Saddanīti, *natthi* es siempre nipāta y por eso se usa igual con sujeto singular o plural.","en":"**natthi**, (part. in verbal form, *ākhyātapaṭirūpaka*) There is not, does not exist. According to Saddanīti, *natthi* is always a nipāta and is therefore used alike with a singular or plural subject."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Con sujeto singular:","en":"With a singular subject:"},{"tipo":"ej","pali":"natthi attasamaṃ pemaṃ, natthi dhaññasamaṃ dhanaṃ","ref":"S. i 6","es":"no hay amor igual al amor por uno mismo, no hay riqueza igual al grano.","en":"there is no love like love of oneself, no wealth like grain."},{"tipo":"txt","es":"Con sujeto plural:","en":"With a plural subject:"},{"tipo":"ej","pali":"natthi loke samaṇabrāhmaṇā sammaggatā sammāpaṭipannā","ref":"D. i 51","es":"no hay en el mundo ascetas ni brahmanes bien encaminados, que practiquen correctamente.","en":"there are no ascetics and brahmins in the world who have gone rightly and practise rightly."}],"notas":[],"fuente":{"es":"Saddanīti, Padamālā (pp. 396–397): «etesu hi atthisaddo ākhyātanipātavasena bhijjati … natthisaddo pana nipātoyeva»; y p. 396: «atthi natthisaddā hi nipātattā ekattepi bahuttepi pavattanti: puttā matthi dhanammatthi; natthi attasamaṃ pemaṃ; natthi samaṇabrāhmaṇā». Niruttidīpanī (p. 155): «atthi natthi sakkā labbhā siyā siyuṃ sādhu tuṇhī iccādīhi ca paṭhamāya lopo». Fuera de la gramática, *natthi* es la forma negada de *atthi* (*na* + *atthi*); su condición de nipāta es tesis de Saddanīti y Niruttidīpanī, no una descripción morfológica general.","en":"Saddanīti, Padamālā (pp. 396–397): «etesu hi atthisaddo ākhyātanipātavasena bhijjati … natthisaddo pana nipātoyeva»; and p. 396: «atthi natthisaddā hi nipātattā ekattepi bahuttepi pavattanti: puttā matthi dhanammatthi; natthi attasamaṃ pemaṃ; natthi samaṇabrāhmaṇā». Niruttidīpanī (p. 155): «atthi natthi sakkā labbhā siyā siyuṃ sādhu tuṇhī iccādīhi ca paṭhamāya lopo». Outside grammar, *natthi* is the negated form of *atthi* (*na* + *atthi*); its status as a nipāta is a thesis of Saddanīti and Niruttidīpanī, not a general morphological description."}},{"id":"n-nanu-ca","lema":"nanu ca","nuevo":true,"cab":{"es":"**nanu ca**, (part.) ¿Acaso no…?, pero ¿no es cierto que…? Introduce una objeción en abierta contradicción (*accantavirodha*) con lo dicho.","en":"**nanu ca**, (part.) Is it not so that…?, but surely…? Introduces an objection in outright contradiction (*accantavirodha*) to what has been said."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"nanu ca ‘imasmiṃ sati idaṃ hotī’ti-ādi bhagavato eva vacanaṃ bhavituṃ arahati, na hi satthāraṃ muñcitvā añño paṭiccasamuppādaṃ desetuṃ samattho hotīti? saccametaṃ","ref":"UdA. 27","es":"¿Acaso [el pasaje] «cuando esto existe, aquello se da», etc., no debería ser palabra del propio Bhagavā, puesto que nadie salvo el Maestro es capaz de enseñar el origen dependiente? — Es verdad.","en":"But surely [the passage] “when this exists, that comes to be,” etc., ought to be the Blessed One’s own words, since no one but the Teacher is able to teach dependent origination? — That is true."}],"notas":[],"fuente":{"es":"Saddanīti, Suttamālā XXVII: «nanu ca iti accantavirodhe: nanu ca bho saddakkamānurūpena atthena bhavitabbaṃ» (Mmd.) (Suttamālā, ed. Smith, p. 902). Saddanīti (Padamālā) usa la misma fórmula: «nanu ca bho …» (p. 123). En CST *nanu ca* no aparece en los textos canónicos (mūla), solo en aṭṭhakathā, ṭīkā y gramáticas; el ejemplo es de comentario.","en":"Saddanīti, Suttamālā XXVII: «nanu ca iti accantavirodhe: nanu ca bho saddakkamānurūpena atthena bhavitabbaṃ» (Mmd.) (Suttamālā, Smith ed., p. 902). Saddanīti (Padamālā) uses the same formula: «nanu ca bho …» (p. 123). In CST *nanu ca* does not occur in the canonical (mūla) texts, only in aṭṭhakathā, ṭīkā and grammars; the example is from a commentary."}},{"id":"n-nahi","lema":"nahi","nuevo":true,"cab":{"es":"**nahi**, (sc. *nahi*) (ind.) Pues no; ciertamente no. Negación (*na* + *hi*).","en":"**nahi**, (Skt. *nahi*) (ind.) For not; surely not. Negation (*na* + *hi*)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Negación (*nisedha*):","en":"Negation (*nisedha*):"},{"tipo":"ej","pali":"Nahi parittakaṃ udakaṃ udakakkhandhoti vuccati, bahukameva vuccati","ref":"VbhA. 2","es":"pues no se llama «masa de agua» a una pequeña cantidad de agua; solo se le llama así a mucha.","en":"for a small amount of water is not called “a mass of water”; only a great deal is so called."},{"tipo":"ej","pali":"Na hi verena verāni, sammantīdha kudācanaṃ","ref":"Dh. 14","es":"pues aquí los odios nunca se apaciguan con el odio.","en":"for here hatreds are never appeased by hatred."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1147 («nisedhe na anomā’laṃ, nahi»); Abhidhānappadīpikāṭīkā v. 1147 (M 600): «Na a no mā alaṃ nahi iccete cha nisedhe». En los textos canónicos, CST escribe casi siempre *na hi* en dos palabras (como en Dh. 14); la grafía *nahi* en una sola palabra aparece en aṭṭhakathās y obras posteriores (p. ej. VbhA. 2).","en":"Abhidhānappadīpikā v. 1147; Abhidhānappadīpikāṭīkā v. 1147 (M 600): «Na a no mā alaṃ nahi iccete cha nisedhe». In the canonical texts CST almost always writes *na hi* as two words (as at Dh. 14); the spelling *nahi* as one word appears in the aṭṭhakathās and later works (e.g. VbhA. 2)."}},{"id":"nam","lema":"naṃ","cab":{"es":"**naṃ**, (sc. *nū-naṃ*?) (part.) Expletivo (*padapūraṇa*).","en":"**naṃ**, (Skt. *nū-naṃ*?) (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"nattam","lema":"nattaṃ","cab":{"es":"**nattaṃ**, (sc. *naktam*) (part. usada en la 7ª inflexión —tiempo) Noche (*ratti*).","en":"**nattaṃ**, (Skt. *naktam*) (particle used in the 7th case —time) Night (*ratti*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"taṇhakkhayaṃ nattamahābhipassa","ref":"Sn. 440","es":"perciba la extinción del deseo día y noche. El compuesto *nattamahābhipassa* se descompone en *nattaṃ*, noche, *aho*, día, y *abhipassa*, imperativo 2ª persona singular de *abhipassati*, ver, considerar, buscar, esforzarse.","en":"contemplate the destruction of craving night and day. The compound *nattamahābhipassa* is analysed into *nattaṃ*, night, *aho*, day, and *abhipassa*, 2nd person singular imperative of *abhipassati*, to see, to consider, to seek, to strive."}],"notas":[],"avisos_en":[]},{"id":"nanu","lema":"nanu","cab":{"es":"**nanu**, (= sc.) Partícula de interrogación. Generalmente para hacer una pregunta donde se espera una respuesta afirmativa. ¿No es... ?","en":"**nanu**, (= Skt.) Interrogative particle. Generally used to ask a question to which an affirmative answer is expected. Is it not...?"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"nanu passasi devate","ref":"J. ii 160","es":"¿no ves, deva?","en":"do you not see, O deity?"},{"tipo":"ej","pali":"nanu tvaṃ, phagguna, kulaputto saddhā agārasmā anagāriyaṃ pabbajito","ref":"M. i 174","es":"¿no eres tú, Phagguna, un hijo de buena familia que ha abandonado por fe el hogar por el no-hogar?","en":"are you not, Phagguna, a son of good family who has gone forth out of faith from the home into homelessness?"}],"notas":[],"avisos_en":[]},{"id":"namo","lema":"namo","cab":{"es":"**namo**, (sc. *namas*) (part. de reverencia 1ª y 2ª inflexión) Homenaje; honor; respeto.","en":"**namo**, (Skt. *namas*) (particle of reverence, 1st and 2nd case) Homage; honour; respect."},"caso":["1","2"],"nir":"","bloques":[{"tipo":"txt","es":"En la 1ª inflexión:","en":"In the 1st case:"},{"tipo":"ej","pali":"namo te buddha vīr’ atthu, vippamutto ’si sabbadhi","ref":"S. i 48","es":"homenaje a ti, el Buddha; héroe, liberado en todas partes.","en":"homage be to you, Buddha, O hero; you are released in every respect."},{"tipo":"txt","es":"En la 2ª inflexión:","en":"In the 2nd case:"},{"tipo":"ej","pali":"namo karohi nāgassa","ref":"M. i 196","es":"hágale honor a la serpiente.","en":"pay homage to the nāga."}],"notas":[],"avisos_en":["block 3: Spanish 'serpiente'; English keeps 'nāga' (in M. i 143-4 the nāga in the anthill is a cobra standing for the arahant bhikkhu)."]},{"id":"nama","lema":"nāma","cab":{"es":"**nāma**, (= sc.) Partícula usada para expresar reproche (*garaha*), elogio (*pasaṃsana*), nombre (*saññā*), pregunta (*pañha*), énfasis.","en":"**nāma**, (= Skt.) Particle used to express reproach (*garaha*), praise (*pasaṃsana*), name (*saññā*), question (*pañha*), emphasis."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"atthi nāma, ānanda, theraṃ bhikkhuṃ vihesiyamānaṃ ajjhupekkhissatha","ref":"A. ii 170","es":"Ānanda, seréis indiferentes del venerable bhikkhu que está siendo puesto en dificultad.[^9]","en":"Ānanda, will you really look on with indifference while an elder bhikkhu is being harassed?[^9]"},{"tipo":"ej","pali":"ahaṃ bhante nāgo nāma","ref":"","es":"Venerable Señor, mi nombre es Nāga.","en":"Venerable Sir, I am called Nāga."},{"tipo":"ej","pali":"kiṃ nāma etaṃ","ref":"","es":"¿cuál es el nombre de esto?","en":"what is this called?"}],"notas":[{"n":"9","es":"**Atthi nāma** es una partícula que significa “no soportar” (*amarisanattha* = *asahanattha*). AA. iii 59.","en":"**Atthi nāma** is a particle meaning “not tolerating” (*amarisanattha* = *asahanattha*). AA. iii 59."}],"avisos_en":["block 0: Spanish is a plain statement ('seréis indiferentes'); English renders atthi nāma as an indignant question, in line with note 9 and the 'reproach' sense."]},{"id":"nanam","lema":"nānaṃ","cab":{"es":"**nānaṃ**, (sc. nānānam?) Partícula usada para significar diferenciación (*asadisa*).","en":"**nānaṃ**, (Skt. nānānam?) Particle used to signify differentiation (*asadisa*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"ekatthaṃ, byañjanam eva nānaṃ","ref":"S. i 291","es":"un mismo significado, pero diferentes nombres.","en":"the meaning is one; only the wording differs."}],"notas":[],"avisos_en":["block 0: Spanish 'diferentes nombres'; byañjana is 'wording/phrasing' rather than 'names'."]},{"id":"nana","lema":"nānā","cab":{"es":"**nānā**, (= sc.) Partícula que indica variedad de formas (*bahuppakāra*). Varias; diferentes.","en":"**nānā**, (= Skt.) Particle indicating a variety of kinds (*bahuppakāra*). Various; different."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"tumhe khvattha, vāseṭṭha, nānājaccā, nānānāmā, nānāgottā, nānākulā, agārasmā anagāriyaṃ pabbajitā","ref":"D. iii 69","es":"vosotros, Vāseṭṭha, de diferentes países, de diferentes nombres, de diferentes clanes, de diferentes familias, han renunciado del hogar a la vida sin hogar.","en":"you, Vāseṭṭha, of different births, different names, different clans, different families, have gone forth from the home into homelessness."}],"notas":[],"avisos_en":["block 0: Spanish 'de diferentes países' for nānājaccā; jacca = birth/caste, not country."]},{"id":"niccam","lema":"niccaṃ","cab":{"es":"**niccaṃ**, (sc. *nityam*) (part. usada en la 7ª inflexión —tiempo) Siempre; continuamente; constantemente (*satataṃ*).","en":"**niccaṃ**, (Skt. *nityam*) (particle used in the 7th case —time) Always; continually; constantly (*satataṃ*)."},"caso":["7"],"nir":"2","bloques":[{"tipo":"ej","pali":"niccaṃ daḷhaparakkamā","ref":"Dh. 16","es":"que siempre se esfuerzan.","en":"always firm in exertion."}],"notas":[],"avisos_en":[]},{"id":"nicam","lema":"nīcaṃ","cab":{"es":"**nīcaṃ**, (sc. *nīca*) (part. usada en la 7ª inflexión) Bajo; abajo; debajo.","en":"**nīcaṃ**, (Skt. *nīca*) (particle used in the 7th case) Low; below; beneath."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"nīcaṃ āsanaṃ gahetvā ekamantaṃ nisīdiṃsu","ref":"D. ii 75","es":"después de tomar un asiento bajo, se sentaron a un lado.","en":"having taken a low seat, they sat down to one side."}],"notas":[],"avisos_en":[]},{"id":"nu","lema":"nu","cab":{"es":"**nu**, (= sc.) (part. interrogativa) Se usa en los siguientes significados:","en":"**nu**, (= Skt.) (interrogative particle) It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Duda (*saṃsaya*):","en":"Doubt (*saṃsaya*):"},{"tipo":"ej","pali":"ahosiṃ nu kho ahaṃ atītam addhānaṃ","ref":"M. i 10","es":"¿existí en el pasado?","en":"did I exist in the past?"},{"tipo":"txt","es":"Pregunta (*pucchana*):","en":"Question (*pucchana*):"},{"tipo":"ej","pali":"ko nu tvam asi mārisa","ref":"D. ii 193","es":"¿quién es usted señor?","en":"who are you, sir?"},{"tipo":"ej","pali":"devī nu ’si tvaṃ uda mānusī nu","ref":"J. i 206","es":"¿eres tú una diosa o una mujer?","en":"are you a goddess or a human woman?"},{"tipo":"txt","es":"En el significado de la partícula **eva**, para dar énfasis:","en":"In the sense of the particle **eva**, for emphasis:"},{"tipo":"ej","pali":"māra diṭṭhigataṃ nu te","ref":"S. i 137","es":"Māra, ésta sólo es una concepción errónea tuya.","en":"Māra, this is just a wrong view of yours."},{"tipo":"txt","es":"En el significado de la partícula **nāma**:","en":"In the sense of the particle **nāma**:"},{"tipo":"ej","pali":"yaṃ nu gijjho yojanasataṃ, kuṇapāni avekkhati","ref":"J. i 41","es":"un buitre, verdaderamente, ve los cuerpos a más de cien leguas.","en":"a vulture, indeed, sees corpses a hundred yojanas away."}],"notas":[],"avisos_en":[]},{"id":"nuna","lema":"nūna","cab":{"es":"**nūna**, (sc. *nūnam*) Denota inferencia (*anumāna*), recuerdo (*anussaraṇa*), reflexión (*parivitakkana*), certeza (*ekaṃsa*). Ciertamente; realmente; supongo.","en":"**nūna**, (Skt. *nūnam*) Denotes inference (*anumāna*), recollection (*anussaraṇa*), reflection (*parivitakkana*), certainty (*ekaṃsa*). Certainly; truly; I suppose."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Inferencia (*anumāna*):","en":"Inference (*anumāna*):"},{"tipo":"ej","pali":"na hi nūna so orako dhammavinayo","ref":"D. ii 25","es":"ciertamente ésta no es una doctrina y disciplina inferior.","en":"surely that is no inferior doctrine and discipline."},{"tipo":"txt","es":"Recuerdo (*anussaraṇa*):","en":"Recollection (*anussaraṇa*):"},{"tipo":"ej","pali":"aho nūna bhagavā, aho nūna sugato, yo imesaṃ dhammānaṃ sukusalo","ref":"D. i 169","es":"¡ah, realmente, el Sublime!, ¡ah realmente el Afortunado!, él es hábil en estas doctrinas. En este contexto la persona que pronuncia estas palabras, al escuchar otras doctrinas, está recordando la enseñanza del Buddha.","en":"ah, surely the Blessed One! Ah, surely the Well-Gone One, who is so skilled in these teachings! In this context the person uttering these words, on hearing other doctrines, is recalling the teaching of the Buddha."},{"tipo":"txt","es":"Reflexión (*parivitakkana*):","en":"Reflection (*parivitakkana*):"},{"tipo":"ej","pali":"yaṃ nūnāhaṃ imaṃ samaṇaṃ jīvitā voropeyyaṃ","ref":"M. ii 302","es":"y si tomo la vida [= lo mato] de este asceta.","en":"what if I were to deprive this ascetic of life [= kill him]?"},{"tipo":"txt","es":"Certeza (*ekaṃsa*):","en":"Certainty (*ekaṃsa*):"},{"tipo":"ej","pali":"nirayaṃ nūna gacchāmi, ettha me natthi saṃsayo","ref":"J. ii 177","es":"ciertamente voy al infierno. No tengo duda de esto.","en":"surely I am going to hell; of this I have no doubt."}],"notas":[],"avisos_en":[]},{"id":"no","lema":"no","cab":{"es":"**no**, (= sc.) (part. de neg.) No. Existe en los siguientes significados:","en":"**no**, (= Skt.) (negative particle) Not. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Negación (*paṭisedhana*):","en":"Negation (*paṭisedhana*):"},{"tipo":"ej","pali":"no h’ etaṃ bhante","ref":"D. i 57","es":"ciertamente no Señor.","en":"indeed not, Venerable Sir."},{"tipo":"txt","es":"Pregunta (*pucchā*):","en":"Question (*pucchā*):"},{"tipo":"ej","pali":"Abhijānāsi no tvaṃ, mahārāja, imaṃ pañhaṃ aññe samaṇabrāhmaṇe pucchitā ti","ref":"D. i 48","es":"¿usted recuerda, oh rey, haber hecho esta pregunta a otros ascetas y brahmanes?","en":"do you recall, great king, having asked this question of other ascetics and brahmins?"},{"tipo":"txt","es":"Énfasis (*avadhāraṇa*):","en":"Emphasis (*avadhāraṇa*):"},{"tipo":"ej","pali":"na no samaṃ atthi Tathāgatena","ref":"Khu i 5","es":"no hay ninguno igual al Tathāgata. Aquí hay dos partículas negativas, **na** y **no**; **no** se usa para dar énfasis.","en":"there is none equal to the Tathāgata. Here there are two negative particles, **na** and **no**; **no** is used for emphasis."}],"notas":[],"avisos_en":[]},{"id":"n-page","lema":"page","nuevo":true,"cab":{"es":"**page**, (sc. *prage*) (ind.) Temprano, de mañana; equivale a *pāto*.","en":"**page**, (Skt. *prage*) (ind.) Early, in the morning; equivalent to *pāto*."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Temprano, en la mañana (= *pāto*):","en":"Early, in the morning (= *pāto*):"},{"tipo":"ej","pali":"Page pubbaṇhasamaye pācīnalokadhātuto uggatanti attho. Pāto page pācīnalokadhātuto udeti uggacchatīti pātodayo, sūriyo","ref":"Namak-ṭ 42","es":"el sentido es: surgido temprano, en la mañana, de la región del este. Lo que asoma, se eleva, temprano (*pāto*, *page*) desde la región del este es *pātodaya*: el sol.","en":"the meaning is: risen early, in the forenoon, from the eastern quarter. What rises, comes up, early (*pāto*, *page*) from the eastern quarter is *pātodaya*: the sun."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1152 («atha pāto page samā»); Namakkāraṭīkā (M 42) glosa *pāto* con *page* (citado en el ejemplo). No se ha hallado *page* en el canon, las aṭṭhakathās ni las ṭīkās de CST; el único uso es esta glosa de Namakkāraṭīkā (obra tardía).","en":"Abhidhānappadīpikā v. 1152; Namakkāraṭīkā (M 42) glosses *pāto* with *page* (quoted in the example). *page* has not been found in the canon, aṭṭhakathās or ṭīkās of CST; the only use is this gloss in the Namakkāraṭīkā (a late work)."}},{"id":"n-pageva","lema":"pageva","nuevo":true,"cab":{"es":"**pageva**, (ind.) Cuánto más, cuánto menos; con mayor razón. También: muy temprano (*pāto eva*).","en":"**pageva**, (ind.) How much more, how much less; all the more. Also: early (*pāto eva*)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Rechazo a fortiori (*paṭikkhepa*):","en":"Rejection a fortiori (*paṭikkhepa*):"},{"tipo":"ej","pali":"kullūpamaṃ vo, bhikkhave, dhammaṃ desitaṃ ājānantehi dhammāpi vo pahātabbā, pageva adhammā","ref":"M. i 188","es":"Bhikkhus, comprendiendo que el Dhamma os ha sido enseñado como semejante a una balsa, debéis abandonar incluso los dhammas, cuánto más los no-dhammas.","en":"Bhikkhus, understanding the Dhamma taught as similar to a raft, you should abandon even dhammas, how much more non-dhammas."}],"notas":[],"fuente":{"es":"Comentario: Sīlakkhandhavagga-abhinavaṭīkā (Sīl-abhinavaṭ. ii 49): «pagevāti paṭikkhepatthe nipāto, mokkhasaṅkhātaṃ pana nibbānaṃ gantuṃ kā nāma kathāti attho. Apica pagevāti pā eva, paṭhamatarameva…»; Sīl-abhinavaṭ. ii 84: «pagevāti pātoyeva». No se ha hallado ejemplo del sentido «temprano» fuera de esta glosa de la ṭīkā.","en":"Commentary: Sīlakkhandhavagga-abhinavaṭīkā (Sīl-abhinavaṭ. ii 49): «pagevāti paṭikkhepatthe nipāto, mokkhasaṅkhātaṃ pana nibbānaṃ gantuṃ kā nāma kathāti attho. Apica pagevāti pā eva, paṭhamatarameva…»; Sīl-abhinavaṭ. ii 84: «pagevāti pātoyeva». No example of the sense “early” has been found outside this ṭīkā gloss."}},{"id":"paccattam","lema":"paccattaṃ","cab":{"es":"**paccattaṃ**, (sc. *pratyātmam*) (adv., part. 3ª inflexión) Individualmente, por uno mismo; separadamente.","en":"**paccattaṃ**, (Skt. *pratyātmam*) (adv., particle in the 3rd case) Individually, by oneself; separately."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"paccattaṃ veditabbo viññūhi","ref":"D. ii 80","es":"puede ser experimentado por los sabios individualmente.","en":"to be experienced by the wise, each for himself."},{"tipo":"ej","pali":"suddhī asuddhi paccattaṃ","ref":"Dh. 38","es":"la pureza o la contaminación dependen de uno mismo.","en":"purity and impurity depend on oneself."}],"notas":[],"avisos_en":[]},{"id":"paccha","lema":"pacchā","cab":{"es":"**pacchā**, (sc. *paścāt*) (part. usada en la 7ª inflexión) Después; en seguida; no antes (*apure*).","en":"**pacchā**, (Skt. *paścāt*) (particle used in the 7th case) After; afterwards; not before (*apure*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"mā pacchā vippaṭisārino ahuvattha","ref":"D. ii 122","es":"que vosotros no tengáis remordimiento después.","en":"do not be remorseful afterwards."}],"notas":[],"avisos_en":[]},{"id":"patirupam","lema":"paṭirūpaṃ","cab":{"es":"**paṭirūpaṃ**, véase **patirūpaṃ**.","en":"**paṭirūpaṃ**, see **patirūpaṃ**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"patirupam-2","lema":"patirūpaṃ","cab":{"es":"**patirūpaṃ**, Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien.","en":"**patirūpaṃ**, Particle of assent; affirmative answer; acceptance (*sampaṭicchana*). Yes; good; very well."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"**patirūpan** ti (V. iii 57), sí.","en":"**patirūpan** ti (V. iii 57), yes."}],"notas":[],"avisos_en":[]},{"id":"pana","lema":"pana","cab":{"es":"**pana**, (sc. *punar*) (adv.) Y; ahora; además; pero; sin embargo. Existe en los siguientes significados:","en":"**pana**, (Skt. *punar*) (adv.) And; now; moreover; but; however. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Excepción (*visesa* = pero; *visesajotana*).","en":"Exception (*visesa* = but; *visesajotana*)."},{"tipo":"ej","pali":"kiṃ pana kāraṇaṃ","ref":"","es":"¿pero cuál es el motivo?","en":"but what is the reason?"},{"tipo":"ej","pali":"ṭīkāyaṃ pana vuttaṃ","ref":"","es":"pero en el Sub-comentario se dice.","en":"but in the Subcommentary it is said."},{"tipo":"txt","es":"Ornato (*vacanālaṅkāra*).","en":"Ornament of speech (*vacanālaṅkāra*)."},{"tipo":"ej","pali":"kasmā pan’ etaṃ vuttaṃ","ref":"","es":"¿por qué se dice esto?","en":"why is this said?"}],"notas":[],"avisos_en":[]},{"id":"parajja","lema":"parajja","cab":{"es":"**parajja**, (part. usada en la 7ª inflexión —tiempo) En el próximo día, en el día siguiente (*paradine*). Solamente se encuentra en Rū. 134. No hay ejemplos.","en":"**parajja**, (particle used in the 7th case —time) On the next day, on the following day (*paradine*). Found only in Rū. 134. There are no examples."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"parajju","lema":"parajju","cab":{"es":"**parajju**, véase **parajja**.","en":"**parajju**, see **parajja**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"parammukha","lema":"parammukhā","cab":{"es":"**parammukhā**, (sc. *parāṅ-mukha*) (part. usada en la 7ª inflexión) En la ausencia; lo opuesto de cara a cara.","en":"**parammukhā**, (Skt. *parāṅ-mukha*) (particle used in the 7th case) In [someone's] absence; the opposite of face to face."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"parammukhā dūtaṃ vā sāsanaṃ vā pesento anusāsati nāma","ref":"DhA. i 349","es":"cuando uno habla indirectamente (*parammukhā*), enviando un mensaje o mensajero, uno aconseja.","en":"when one, in [the person's] absence (*parammukhā*), sends a messenger or a message, one is said to advise."}],"notas":[],"avisos_en":[]},{"id":"parasuve","lema":"parasuve","cab":{"es":"**parasuve**, (sc. paraśvas) (part. usada en la 7ª inflexión —tiempo) Pasado mañana.","en":"**parasuve**, (Skt. paraśvas) (particle used in the 7th case —time) The day after tomorrow."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sve vā parasuve vā sāmāvatiyā pāsādatalaṃ gamissati","ref":"DhA. i 138","es":"mañana o pasado mañana él irá al piso superior de la mansión de Sāmāvatī.","en":"tomorrow or the day after tomorrow he will go to the upper floor of Sāmāvatī's mansion."}],"notas":[],"avisos_en":[]},{"id":"parito","lema":"parito","cab":{"es":"**parito**, (sc. *paritaḥ*) (part. usada en la 7ª inflexión) En todas partes (*samantato*); todo alrededor; en todos los lados. Véase **sāmantā**.","en":"**parito**, (Skt. *paritaḥ*) (particle used in the 7th case) Everywhere (*samantato*); all around; on all sides. See **sāmantā**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"api ’ssudam parito gāmesu manussā evam āhaṃsu","ref":"D. ii 212","es":"hasta tal grado que los hombres en los poblados de alrededor decían...","en":"so much so that people in the surrounding villages said..."}],"notas":[],"avisos_en":[]},{"id":"pare","lema":"pare","cab":{"es":"**pare**, (sc. ?) (part. usada en la 7ª inflexión —tiempo) Ayer; en el día pasado (*atītadine*).","en":"**pare**, (Skt. ?) (particle used in the 7th case —time) Yesterday; on the past day (*atītadine*)."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"n-pasayha","lema":"pasayha","nuevo":true,"cab":{"es":"**pasayha**, (sc. *prasahya*) (ind.) Por la fuerza, violentamente; sometiendo.","en":"**pasayha**, (Skt. *prasahya*) (ind.) By force, violently; overpowering."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Por la fuerza (*balakkāra*):","en":"By force (*balakkāra*):"},{"tipo":"ej","pali":"vajjī yā tā kulitthiyo kulakumāriyo, tā na okkassa pasayha vāsenti","ref":"D. ii 63","es":"los vajjis no retienen consigo, arrebatándolas por la fuerza, a las mujeres y a las doncellas de buena familia.","en":"the Vajjis do not abduct the women and maidens of good families and keep them by force."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1149 («balakkāre pasayha ca»); DA. ii 110 (P 520): «Okkassa pasayhāti ettha ‘okkassā’ti vā ‘pasayhā’ti vā pasayhākārassevetaṃ nāmaṃ … Pasayhāti abhibhavitvā ajjhottharitvāti ayaṃ vacanattho … balakkārena gahetvā». Morfológicamente es el absolutivo de *pa* + √*sah*: Niruttidīpanī (M 53, 504) lo da como «pasayha pasahitvā». Es nipāta solo en el uso adverbial que registra Abhidhānappadīpikā; la ṭīkā de Abhidhānappadīpikā no lo comenta.","en":"Abhidhānappadīpikā v. 1149; DA. ii 110 (P 520): «Okkassa pasayhāti ettha ‘okkassā’ti vā ‘pasayhā’ti vā pasayhākārassevetaṃ nāmaṃ … Pasayhāti abhibhavitvā ajjhottharitvāti ayaṃ vacanattho … balakkārena gahetvā». Morphologically it is the absolutive of *pa* + √*sah*: the Niruttidīpanī (M 53, 504) gives it as «pasayha pasahitvā». It is a nipāta only in the adverbial use recorded by the Abhidhānappadīpikā; the Abhidhānappadīpikā’s ṭīkā does not comment on it."}},{"id":"patam","lema":"pātaṃ","cab":{"es":"**pātaṃ**, véase **pāto**.","en":"**pātaṃ**, see **pāto**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"n-patu","lema":"pātu","nuevo":true,"cab":{"es":"**pātu**, (sc. *prādus*) (ind.) Manifiestamente, a la vista; solo con *bhavati* y *karoti* (*pātubhavati*: aparecer; *pātukaroti*: manifestar).","en":"**pātu**, (Skt. *prādus*) (ind.) Manifestly, into view; only with *bhavati* and *karoti* (*pātubhavati*: to appear; *pātukaroti*: to make manifest)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Manifiesto (*pākaṭa*):","en":"Manifest (*pākaṭa*):"},{"tipo":"ej","pali":"evameva brahmaloke antarahito mama purato pāturahosi","ref":"D. i 212","es":"así también, desapareciendo del mundo de Brahmā, apareció delante de mí.","en":"just so, vanishing from the Brahmā world, he appeared in front of me."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1149 («tuṇhī tu mone thā’vi pātu ca») y v. 1157 («sammukhā tvā’vi pātu ca»); Abhidhānappadīpikāṭīkā v. 1149 (M 601): «Āvi, pātu ca pākaṭatthe»; v. 1157 (M 603): «Sammukhā, āvi, pātu ca samānatthā»; Saddanīti, Padamālā (M 5): «Ettha pātuiti nipāto, so ‘āvibhavati tirobhavatī’tiādīsu āvi tironipātā viya …».","en":"Abhidhānappadīpikā vv. 1149 and 1157; Abhidhānappadīpikāṭīkā v. 1149 (M 601): «Āvi, pātu ca pākaṭatthe»; v. 1157 (M 603): «Sammukhā, āvi, pātu ca samānatthā»; Saddanīti, Padamālā (M 5): «Ettha pātuiti nipāto, so ‘āvibhavati tirobhavatī’tiādīsu āvi tironipātā viya …»."}},{"id":"pato","lema":"pāto","cab":{"es":"**pāto**, (sc. *prātar*) (part. usada en la 7ª inflexión —tiempo) Amanecer; en el amanecer (*pabhāte*).","en":"**pāto**, (Skt. *prātar*) (particle used in the 7th case —time) Dawn; at dawn (*pabhāte*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sāyaṃ sāyamāsāya pāto pātarāsāya bhikkhaṃ pariyesanti","ref":"A. ii 196","es":"ellos buscan la comida para la cena en el atardecer y para el almuerzo en el amanecer.","en":"in the evening they seek alms for the evening meal, and at dawn for the morning meal."},{"tipo":"sub","es":"**pāto ’va**, bien temprano.","en":"**pāto ’va**, very early."},{"tipo":"ej","pali":"atha satthā pāto ’va mahāmoggallānattheraṃ āmantesi","ref":"JA. i 368","es":"entonces, el Maestro bien temprano se dirigió al monje Mahāmoggallana.","en":"then the Teacher, very early, addressed the Elder Mahāmoggallāna."},{"tipo":"sub","es":"**pātar** antes de una vocal.","en":"**pātar** before a vowel."},{"tipo":"ej","pali":"pātarāso","ref":"","es":"la comida de la mañana, el desayuno.","en":"the morning meal, breakfast."}],"notas":[],"avisos_en":[]},{"id":"n-payo","lema":"pāyo","nuevo":true,"cab":{"es":"**pāyo**, (sc. *prāyas*) (ind.) Por lo general, en su mayor parte, mayormente.","en":"**pāyo**, (Skt. *prāyas*) (ind.) Generally, for the most part, mostly."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Abundancia, predominio (*bāhulya*):","en":"Abundance, predominance (*bāhulya*):"},{"tipo":"ej","pali":"Uttama ppakatippāyo, itthipurisahetuko","ref":"Abh. 10, v. 104","es":"(el sentimiento erótico) se da mayormente en personas de naturaleza elevada y tiene por causa a la mujer y al hombre.","en":"(the erotic sentiment) occurs mostly among people of noble nature and has woman and man as its cause."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1153 («pāyo, bāhulye»); Abhidhānappadīpikāṭīkā vv. 1152–1153 (M 602): «Pāyo, bāhulyañca samā»; sobre el ejemplo (v. 104), Abhidhānappadīpikāṭīkā (M 81–82): «Uttamānaṃ itthipurisānaṃ pakati … sā ettha siṅgāre pāyo bahulanti uttamapakatippāyo, yebhuyyena …». En el ejemplo, *pāya* es final de compuesto (bahubbīhi *uttamappakatippāyo*), no el indeclinable libre; no se ha hallado *pāyo* suelto como adverbio en CST.","en":"Abhidhānappadīpikā v. 1153; Abhidhānappadīpikāṭīkā vv. 1152–1153 (M 602): «Pāyo, bāhulyañca samā»; on the example (v. 104), Abhidhānappadīpikāṭīkā (M 81–82): «Uttamānaṃ itthipurisānaṃ pakati … sā ettha siṅgāre pāyo bahulanti uttamapakatippāyo, yebhuyyena …». In the example, *pāya* is the final member of a compound (the bahubbīhi *uttamappakatippāyo*), not the free indeclinable; *pāyo* on its own as an adverb has not been found in CST."}},{"id":"param","lema":"pāraṃ","cab":{"es":"**pāraṃ**, (sc. *pāra*) (part. usada en la 7ª inflexión) Otro lado; otra orilla; otro flanco (*parasmiṃ passe*). Opuesto de **oraṃ**.","en":"**pāraṃ**, (Skt. *pāra*) (particle used in the 7th case) The other side; the other shore; the far flank (*parasmiṃ passe*). Opposite of **oraṃ**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pāraṃ samuddassa pi patthayetha","ref":"M. ii 259","es":"y anhela el otro lado del océano.","en":"he would long even for the far side of the ocean."}],"notas":[],"avisos_en":[]},{"id":"pi","lema":"pi","cab":{"es":"**pi**, forma abreviada de **api**.","en":"**pi**, shortened form of **api**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"n-pire","lema":"pire","nuevo":true,"cab":{"es":"**pire**, (ind.) ¡Fuera!, lejos de aquí; o vocativo «¡extraño!».","en":"**pire**, (ind.) Away!, far from here; or vocative «stranger!»."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Con *cara*, expulsión:","en":"With *cara*, expulsion:"},{"tipo":"ej","pali":"cara pire, mallike, vinassā","ref":"M. ii 310","es":"¡Vete lejos, Mallikā, desaparece!","en":"Go away, Mallikā, get lost!"}],"notas":[],"fuente":{"es":"Comentario: MA. iii 237: «cara pireti apehi, amhākaṃ pare anajjhattikabhūteti attho. Atha vā cara pireti parato gaccha, mā idha tiṭṭhātipi attho»; MṬ. ii 160 y Sārattha-ṭ. ii 346: «pireti vā ‘parato’ti iminā samānatthaṃ nipātapadaṃ»; Sārattha-ṭ. iii 89: «pireti nipātapadaṃ. Sambodhane vattamānaṃ para-saddena samānatthaṃ vadanti». Los comentarios dan dos análisis: vocativo equivalente a *para* («¡oh extraño!») o nipāta = *parato* («lejos»); en el ejemplo la traducción sigue el segundo.","en":"Commentary: MA. iii 237: «cara pireti apehi, amhākaṃ pare anajjhattikabhūteti attho. Atha vā cara pireti parato gaccha, mā idha tiṭṭhātipi attho»; MṬ. ii 160 and Sārattha-ṭ. ii 346: «pireti vā ‘parato’ti iminā samānatthaṃ nipātapadaṃ»; Sārattha-ṭ. iii 89: «pireti nipātapadaṃ. Sambodhane vattamānaṃ para-saddena samānatthaṃ vadanti». The commentaries give two analyses: a vocative equivalent to *para* (“O stranger!”) or a nipāta = *parato* (“away”); in the example the translation follows the second."}},{"id":"puthu","lema":"puthu","cab":{"es":"**puthu**, (sc. *pṛthu*) Partícula que indica variedad de formas (*bahuppakāra*) y separación (*asaṅghāta*).","en":"**puthu**, (Skt. *pṛthu*) Particle indicating a variety of kinds (*bahuppakāra*) and separateness (*asaṅghāta*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"puthu kilese janetī ti puthujjano","ref":"DA. i 59","es":"un ser ordinario (*puthujjana*) es aquel que genera muchas impurezas mentales.","en":"one who generates many defilements is an ordinary person (*puthujjana*)."},{"tipo":"ej","pali":"sabbakāmehi puthubhūto","ref":"SnA. ii 261","es":"que está separado de todos los placeres sensuales.","en":"who is separated from all sensual pleasures."}],"notas":[],"avisos_en":["block 0: the reference (DA. i 59) sits inside the Spanish translation (ref field empty); kept at the start of the English as in the source. Consider moving it to the ref field."]},{"id":"puna","lema":"puna","cab":{"es":"**puna**, (sc. *punar*) (adv.) Denota lo que no es primero (*appaṭhama*). Otra vez; de nuevo; nuevamente.","en":"**puna**, (Skt. *punar*) (adv.) Denotes what is not first (*appaṭhama*). Again; once more; anew."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"puna vadāmi","ref":"","es":"hablo de nuevo.","en":"I speak again."},{"tipo":"ej","pali":"puna gehaṃ na kāhasi","ref":"Dh. 36","es":"no construirás nuevamente la casa.","en":"you will not build the house again."},{"tipo":"sub","es":"**puna c’ aparaṃ**, y de nuevo; y de nuevo además.","en":"**puna c’ aparaṃ**, and again; and furthermore."},{"tipo":"ej","pali":"puna c’ aparaṃ, mahārājā, bhikkhu vitakkavicārānaṃ vūpasamā","ref":"D. i 70","es":"y de nuevo, Gran Rey, el bhikkhu al haber eliminado la aplicación inicial y la aplicación sostenida.","en":"and again, great king, a bhikkhu, with the stilling of applied and sustained thought..."}],"notas":[],"avisos_en":[]},{"id":"punam","lema":"punaṃ","cab":{"es":"**punaṃ**, = **puna**","en":"**punaṃ**, = **puna**"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na punaṃ jātijaraṃ upehisi","ref":"Dh. 48","es":"no volverás de nuevo al nacimiento y la vejez.","en":"you will not come again to birth and old age."}],"notas":[],"avisos_en":[]},{"id":"punappunam","lema":"punappunaṃ","cab":{"es":"**punappunaṃ**, (sc. *punar + punar*) Denota repetición, continuidad (*abhiṇha*). Una y otra vez.","en":"**punappunaṃ**, (Skt. *punar + punar*) Denotes repetition, continuity (*abhiṇha*). Again and again."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"dukkhā jāti punappunaṃ","ref":"Dh. 36","es":"nacer una y otra vez es sufrimiento.","en":"painful is birth again and again."}],"notas":[],"avisos_en":[]},{"id":"punar","lema":"punar","cab":{"es":"**punar**, = **puna**","en":"**punar**, = **puna**"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na hi jātu ggabbhaseyya punar eti","ref":"Kp. 11","es":"en verdad no regresa otra vez al vientre.","en":"truly, he does not come again to lying in a womb."}],"notas":[],"avisos_en":[]},{"id":"puno","lema":"puno","cab":{"es":"**puno**, = **puna**","en":"**puno**, = **puna**"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"na puno edisakaṃ bhavissati","ref":"T. i 424","es":"no será nuevamente tal.","en":"it will not be such again."}],"notas":[],"avisos_en":[]},{"id":"n-purato","lema":"purato","nuevo":true,"cab":{"es":"**purato**, (sc. *puratas*) (ind.) Delante, enfrente; delante de (con genitivo).","en":"**purato**, (Skt. *puratas*) (ind.) In front, before; in front of (with genitive)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Delante (*pure*, *aggato*):","en":"In front (*pure*, *aggato*):"},{"tipo":"ej","pali":"apehi, bhikkhu, mā me purato aṭṭhāsī","ref":"D. ii 114","es":"apártate, bhikkhu, no te quedes delante de mí.","en":"move aside, bhikkhu, do not stand in front of me."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1148 («pure ggato tu purato»); Abhidhānappadīpikāṭīkā v. 1148 (M 601): «Aggato, purato ca pureiccatthe»; Rūpasiddhi §265 (M 122): *to* en sentido de 7.ª: «ādito. Evaṃ majjhato, ekato, purato, pacchato …». Gramaticalmente es *pura* + *to* (Rūpasiddhi §265, M 122), un *vibhattipaccayanta*. Rūpasiddhi (vibhattippaccayavidhāna, M 120) dice de estas formas: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («por carecer de género y ser nipātas, su forma es la misma en los tres géneros y en ambos números»).","en":"Abhidhānappadīpikā v. 1148; Abhidhānappadīpikāṭīkā v. 1148 (M 601): «Aggato, purato ca pureiccatthe»; Rūpasiddhi §265 (M 122): *to* in the locative sense: «ādito. Evaṃ majjhato, ekato, purato, pacchato …». Grammatically it is *pura* + *to* (Rūpasiddhi §265, M 122), a *vibhattipaccayanta*. Rūpasiddhi (vibhattippaccayavidhāna, M 120) says of these forms: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («because they are genderless and are nipātas, their form is the same in the three genders and both numbers»)."}},{"id":"pura","lema":"purā","cab":{"es":"**purā**, (= sc.) (part. usada en la 7ª inflexión —tiempo). Anteriormente; en el pasado; antes. Esta partícula puede ser usada para referirse al futuro como también **pure** y **yāva**.","en":"**purā**, (= Skt.) (particle used in the 7th case —time). Formerly; in the past; before. This particle can also be used to refer to the future, as can **pure** and **yāva**."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"pure","lema":"pure","cab":{"es":"**pure**, (sc. *puras*) (part. usada en la 7ª inflexión) Antes; en frente; previamente. Opuesto de **pacchā**. Esta partícula puede ser usada para significar el futuro (ver ejemplo).","en":"**pure**, (Skt. *puras*) (particle used in the 7th case) Before; in front; previously. Opposite of **pacchā**. This particle can be used to signify the future (see example)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pacchāvacanīyaṃ pure avaca","ref":"D. i 8","es":"aquello que debería decirse después, lo dice antes.","en":"what should be said afterwards, you said before."},{"tipo":"ej","pali":"pure adhammo dippati","ref":"V. iv 481","es":"en el futuro lo contrario al Dhamma brillará. Aquí **pure** se usa para referirse al futuro. El comentario explica que otra lectura sería: “tal vez lo contrario al Dhamma brilla”.","en":"in the future what is contrary to the Dhamma will shine. Here **pure** is used to refer to the future. The commentary explains that another reading would be: “perhaps what is contrary to the Dhamma shines”."}],"notas":[],"avisos_en":["block 0: Spanish 'lo dice' (3rd sg. present); avaca is aorist, here 2nd sg. ('you said')."]},{"id":"pecca","lema":"pecca","cab":{"es":"**pecca**, (sc. *pretya*) (part. usada en la 7ª inflexión) Después de la muerte; en el más allá; en el otro mundo (*paraloke*).","en":"**pecca**, (Skt. *pretya*) (particle used in the 7th case) After death; in the hereafter; in the other world (*paraloke*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"idha modati, pecca modati","ref":"Dh. 15","es":"en este mundo se regocija, en el otro mundo se regocija.","en":"here he rejoices, hereafter he rejoices."}],"notas":[],"avisos_en":[]},{"id":"bahi","lema":"bahi","cab":{"es":"**bahi**, (sc. *bahis*) (part. usada en la 7ª inflexión) Fuera, afuera; externo.","en":"**bahi**, (Skt. *bahis*) (particle used in the 7th case) Outside, without; external."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"anto jaṭā, bahi jaṭā","ref":"S. i 13","es":"enredo interno, enredo externo.","en":"a tangle within, a tangle without."}],"notas":[],"avisos_en":[]},{"id":"bahiddha","lema":"bahiddhā","cab":{"es":"**bahiddhā**, (sc. *bahirdhā*) (part. usada en la 7ª inflexión) Fuera, afuera; externo; externamente.","en":"**bahiddhā**, (Skt. *bahirdhā*) (particle used in the 7th case) Outside, without; external; externally."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"bahiddhā vā dhammesu dhammānupassī viharati","ref":"D. ii 251","es":"o permanece contemplando los dhammas en los dhammas externamente.","en":"or he dwells contemplating dhammas in dhammas externally."}],"notas":[],"avisos_en":[]},{"id":"bahira","lema":"bāhirā","cab":{"es":"**bāhirā**, (sc. *bāhya*) (part. usada en la 7ª inflexión) Afuera, fuera; externo; externamente.","en":"**bāhirā**, (Skt. *bāhya*) (particle used in the 7th case) Outside, without; external; externally."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pathavīdhātu siyā ajjhattikā, siyā bāhirā","ref":"M. i 242","es":"el elemento tierra puede ser interno o externo.","en":"the earth element may be internal or external."}],"notas":[],"avisos_en":[]},{"id":"bahiram","lema":"bāhiraṃ","cab":{"es":"**bāhiraṃ**, (part. usada en la 7ª inflexión) Afuera, fuera; externo; externamente.","en":"**bāhiraṃ**, (particle used in the 7th case) Outside, without; external; externally."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"bāhiraṃ parimajjasi","ref":"Dh. 69","es":"limpias afuera.","en":"you clean the outside."}],"notas":[],"avisos_en":[]},{"id":"bya","lema":"byā","cab":{"es":"**byā**, = **iva**","en":"**byā**, = **iva**"},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"evaṃ byā kho ti evaṃ viya kho","ref":"MA ii 10","es":"","en":"*evaṃ byā kho* means *evaṃ viya kho*, “just so, as it were”."}],"notas":[],"avisos_en":["block 0: Spanish gives no translation (empty); English supplied as a gloss explanation."]},{"id":"bhane","lema":"bhaṇe","cab":{"es":"**bhaṇe**, (1ª per. sg. pres. de *bhaṇati* = hablar) (part. voc., sg. y pl, m.) Partícula vocativa masculina singular y plural usada para dirigirse a inferiores.","en":"**bhaṇe**, (1st pers. sg. pres. of *bhaṇati* = to speak) (voc. particle, sg. and pl., m.) Masculine singular and plural vocative particle used to address inferiors."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"gaccha, bhaṇe, ciravāsiṃ kumāraṃ jānāhi","ref":"S. ii 512","es":"vaya hombre y averigüe ac
