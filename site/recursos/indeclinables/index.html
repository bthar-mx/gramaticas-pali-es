abhi**, **pati**, **su**, **ā**, **ati**, **api**, **apa**, **upa**.[^14] + nota 14"},{"id":"C-306","antes":"*paññā*, comprender en diferentes modos.","despues":"*paññā*, sabiduría (lo que conoce de diversos modos)."},{"id":"C-310","antes":"*pavāsī*, uno que vive solo.","despues":"*pavāsī*, el que vive fuera (de su hogar), ausente (Rū. p. 126 y Payog.: *pavāsī*; Nir. p. 157 da *pavāso*)."},{"id":"C-311","antes":"Después de ése (*tappara*):[^3] / nota 3: *Tappara* significa anterior en tiempo.","despues":"Más allá de ése, el siguiente en la serie (*tappara*):[^3] / nota 3: *Para*, ‘más allá, ulterior’. Rū. (samāsa): *ācariyato paro pācariyo*, el que está más allá del maestro; en la línea de maestros, el anterior en el tiempo."},{"id":"C-312","antes":"*pavuddhakāyo*, cuerpo grande.","despues":"*pavuddhakāyo*, de cuerpo muy crecido (*bahubbīhi*).[^15] + nota 15"},{"id":"C-313","antes":"*pahūtavitto*, abundante riqueza.","despues":"*pahūtavitto*, que tiene abundante riqueza (Sn. v. 102; CST p. 296, PTS p. 19). Ejemplo tomado de Sad. (Smith p. 882), no de Rūpasiddhi."},{"id":"C-314","antes":"*pa-hūtaṃ annaṃ*, mucha comida \\[satisfecho con lo que uno ha comido\\].","despues":"*pahūtam annaṃ*, mucha comida \\[satisfecho con lo que uno ha comido\\]."},{"id":"C-315","antes":"nota 2: Sad. iii 362 tiene *abhinipphanna*, llevar a cabo; ejecutar.","despues":"nota 2: Sad. (Smith p. 881) tiene *abhinipphanne pakataṃ* (*abhinipphanna*, llevar a cabo; ejecutar). Saddanīti asigna *vippakataṃ* a **vi** (*ādikamme vippakataṃ*, Smith p. 885)."},{"id":"C-316","antes":"(no figura)","despues":"Sucesión (de generaciones) (*tadanubandha*): *paputto*, nieto (hijo del hijo); *panattā*, bisnieto. + nota 16"},{"id":"D-pa-1","antes":"","despues":"(véase C-311)"},{"id":"D-pa-4","antes":"","despues":"(véase C-316)"},{"id":"C-319","antes":"Fortaleza (*vikkama*):","despues":"Esfuerzo, denuedo (*vikkama*):"},{"id":"C-320","antes":"*aṅgassa parāmasanaṃ*, masajeando el miembro.","despues":"*aṅgassa par minación (*pariccheda*):"},{"id":"C-362","antes":"*pāricariyā*, honor.","despues":"*pāricariyā*, servicio, atención (honrar sirviendo) (D. iii 154, PTS iii 189; M. ii 388, PTS ii 177)."},{"id":"C-363","antes":"*paribhāsati*, reprende.","despues":"*paribhāsati*, insulta, injuria."},{"id":"C-364","antes":"*rukkhaṃ pari vijjotate vijju*, el rayo ilumina el árbol.","despues":"*rukkhaṃ pari vijjotate vijju*, el relámpago resplandece cubriendo \\[con su luz\\] el árbol (Niruttidīpanī: *parī ti pharitvā*). + itthambhūtakkhāna, bhāga, vicchā (nuevos) + nota 24"},{"id":"C-365","antes":"Supremacía (*issariya*):","despues":"Señorío, dominio (*issara*):"},{"id":"C-366","antes":"*adhi Brahmadatte Pañcālā*, Los Pañcālas son gobernados por Brahmadatta.","despues":"*adhi Brahmadatte Pañcālā*, los Pañcālas son gobernados por Brahmadatta."},{"id":"C-367","antes":"*adhirohati*, crece hacia arriba.","despues":"*adhirohati*, sube, asciende."},{"id":"D-adhi-1","antes":"(no figura)","despues":"Especificación (*visesana*): (sin ejemplo en la fuente) + nota 25"},{"id":"C-370","antes":"*abhimukho*, estar cara a cara; *abhikkamati*, procede.","despues":"*abhimukho*, que está de frente, vuelto hacia; *abhikkamati*, avanza, va hacia adelante (D. ii 269, PTS ii 338)."},{"id":"C-372","antes":"*Abhidhammo*, Tercera Canasta.","despues":"*abhidhammo*, el Dhamma distinguido (nombre de la tercera canasta)."},{"id":"C-373","antes":"Trabajo arriba (*uddhakamma*):","despues":"Acción hacia arriba (*uddhakamma*):"},{"id":"C-374","antes":"Parte, porción (*bhāga*): *yad ettha maṃ abhi siyā taṃ dīyatu*, dé eso que es mi parte aquí.","despues":"(suprimido)"},{"id":"C-375","antes":"*rukkhaṃ abhi vijjotate vijju*, el rayo ilumina el árbol. / la luna ilumina en cada árbol.","despues":"*rukkhaṃ abhi vijjotate vijju*, el relámpago resplandece cubriendo \\[con su luz\\] el árbol (Niruttidīpanī: *rukkhaṃ abhibyāpetvā vijjotate*). / la luna resplandece bañando árbol tras árbol (Niruttidīpanī: *byāpetvā vijjotate*)."}, s el correlativo de **tath’ eva**: **yath’ eva**, como; **tath’ eva**, así."},{"id":"C-119","antes":"aṭṭhadhā samaṃ savibhattaṃ","despues":"aṭṭhadhā samaṃ suvibhattaṃ"},{"id":"C-120","antes":"*tatra*, allí; en es lugar.","despues":"*tatra*, allí; en ese lugar."},{"id":"C-121","antes":"a través montañas","despues":"a través de montañas"},{"id":"C-124a","antes":"*rattiṃ yeva samānaṃ divā ti sañjānanti* (M. i 26), perciben el día como la noche.","despues":"*rattiṃ yeva samānaṃ divā ti sañjānanti* (M. i 26), perciben la noche, siendo noche, como día."},{"id":"C-124b","antes":"*divā yeva samānaṃ rattī ti sañjānanti* (M. i 26), perciben la noche como el día.","despues":"*divā yeva samānaṃ rattī ti sañjānanti* (M. i 26), perciben el día, siendo día, como noche."},{"id":"C-126","antes":"*na hi verena verāni sammanti* (Dh. v. 5)","despues":"*na hi verena verāni sammanti* (Dh. 13)"},{"id":"C-128","antes":"*taṅhakkhayaṃ nattamahābhipassa*","despues":"*taṇhakkhayaṃ nattamahābhipassa*"},{"id":"C-129","antes":"**nāna**, (= sc.) Partícula usada para expresar reproche","despues":"**nāma**, (= sc.) Partícula usada para expresar reproche"},{"id":"C-130","antes":"diferenciación (*asadissa*)","despues":"diferenciación (*asadisa*)"},{"id":"C-135","antes":"cuando uno habla indirectamente (*paramukkhā*)","despues":"cuando uno habla indirectamente (*parammukhā*)"},{"id":"C-136a","antes":"**parito**, (sc. *paritaḥ*) (part. usada en la 7ª inflexión) En todas todas partes","despues":"**parito**, (sc. *paritaḥ*) (part. usada en la 7ª inflexión) En todas partes"},{"id":"C-136b","antes":"**sāmantā**, (sc. *samanta*) (part. usada en la 7ª inflexión) En todas todas partes","despues":"**sāmantā**, (sc. *samanta*) (part. usada en la 7ª inflexión) En todas partes"},{"id":"C-140","antes":"haré de tal forma que haya disminución de mi riqueza","despues":"haré de tal forma que no haya disminución de mi riqueza"},{"id":"C-141","antes":"*vuḍḍhānaṃ paṭipāti yathāvuḍḍhaṃ*","despues":"*vuḍḍhānaṃ paṭipāṭi yathāvuḍḍhaṃ*"},{"id":"C-143","antes":"vendrán bajo de mi influencia","despues":"vendrán bajo mi influencia"},{"id":"C-144","antes":"si yo me enojaría con éste","despues":"si yo me enojara con éste"},{"id":"C-149","antes":"*madhu vā maññati* (Dh. v 69)","despues":"*madhu vā maññati* (Dh. 23)"},{"id":"C-151","antes":"*Kapaṇo vatayaṃ bhikkhu,","despues":"*Kapaṇo vatāyaṃ bhikkhu,"},{"id":"C-152","antes":"¡qué él sea feo!","despues":"¡que él sea feo!"},{"id":"C-153","antes":"*dadāti ve yathāsaddham yathāpasādanaṃ jano*","despues":"*dadāti ve yathāsaddhaṃ yathāpasādanaṃ jano*"},{"id":"C-157","antes":"*sahassena samaṃ mitā* (S. i 21)","despues":"*sahassena samaṃ mitā* (S. i 18)"},{"id":"C-159a","antes":"bien hecho por ti \\[haz hecho bien\\]","despues":"bien hecho por ti \\[has hecho bien\\]"},{"id":"C-159b","antes":"¡bien, muy bien¡","despues":"¡bien, muy bien!"},{"id":"C-160","antes":"*sve ’dāni mayaṃ bhagavato sarīraṃ jhāpessama* (D. ii 159)","despues":"*sve ’dāni mayaṃ bhagavato sarīraṃ jhāpessāma* (D. ii 131)"},{"id":"C-161","antes":"**seyyatthā pi nāma**,","despues":"**seyyathā pi nāma**,"},{"id":"C-163","antes":"*jivavacanayuttaṃ hi* (Kac. §52)","despues":"*jinavacanayuttaṃ hi* (Kac. §52)"},{"id":"C-165","antes":"*he je kāḷī,* (M. I 176)","despues":"*he je kāḷī,* (M. i 176)"}]},"definicion":[{"tipo":"txt","es":"(*Avyaya*)[^1]","en":"(*Avyaya*)[^1]"},{"tipo":"txt","es":"Se denominan indeclinables (*avyaya*) porque no están sujetos a cambios, son inmodificables; no presentan diferencia en cuanto al género (*liṅga*), número (*saṅkhyā*) e inflexión (*vibhatti*).","en":"They are called indeclinables (*avyaya*) because they are not subject to change; they are unmodifiable; they show no difference as to gender (*liṅga*), number (*saṅkhyā*) and inflection (*vibhatti*)."},{"tipo":"txt","es":"Hay seis clases de indeclinables: (1) prefijos (*upasagga*) y (2) partículas (*nipāta*), (3) voces terminadas en sufijos que representan inflexiones, (4) compuestos adverbiales, (5) voces terminadas en sufijos secundarios indeclinables y (6) voces terminadas en los sufijos tvā, etc.","en":"There are six classes of indeclinables: (1) prefixes (*upasagga*) and (2) particles (*nipāta*), (3) words ending in suffixes that represent inflections, (4) adverbial compounds, (5) words ending in indeclinable secondary suffixes, and (6) words ending in the suffixes tvā, etc."}],"notas_indeclinables":{"1":{"es":"En los textos birmanos se lee *abyaya*.","en":"In the Burmese texts it reads *abyaya*."},"2":{"es":"Sad. (Smith p. 881) tiene *abhinipphanne pakataṃ* (*abhinipphanna*, llevar a cabo; ejecutar). Saddanīti asigna *vippakataṃ* a **vi** (*ādikamme vippakataṃ*: Sad. (Smith p. 885)).","en":"Sad. (Smith p. 881) has *abhinipphanne pakataṃ* (*abhinipphanna*, to accomplish; to carry out). Saddanīti assigns *vippakataṃ* to **vi** (*ādikamme vippakataṃ*: Sad. (Smith p. 885))."},"3":{"es":"*Para*, ‘más allá, ulterior’. Rū. (samāsa): *ācariyato paro pācariyo*, el que está más allá del maestro; en la línea de maestros, el anterior en el tiempo.","en":"*Para*, ‘beyond, further’. Rū. (samāsa): *ācariyato paro pācariyo*, the one who is beyond the teacher; in the line of teachers, the earlier in time."},"4":{"es":"Sad. iii 364: *kaliggāha*, derrota, mala consecuencia.","en":"Sad. iii 364: *kaliggāha*, defeat, bad consequence."},"5":{"es":"*Parā* + √*kam* > *parakkamati*: se abrevia ā (Kacc. §26) y se duplica k (Kacc. §28); cf. Kacc. §51.","en":"*Parā* + √*kam* > *parakkamati*: ā is shortened (Kacc. §26) and k is doubled (Kacc. §28); cf. Kacc. §51."},"6":{"es":"Diferencia entre *uddesa*, enunciación; introducción y *niddesa*, descripción detallada.","en":"Difference between *uddesa*, statement; introduction, and *niddesa*, detailed description."},"7":{"es":"La voz *samādhi* consta de **saṃ** + **ā** + **dhā**. **Saṃ** tiene dos significados: correctamente (*sammā*) y en forma pareja (*sama*). Poner la mente correctamente y en forma pareja en el objeto.","en":"The word *samādhi* consists of **saṃ** + **ā** + **dhā**. **Saṃ** has two meanings: rightly (*sammā*) and evenly (*sama*). Placing the mind rightly and evenly on the object."},"8":{"es":"Hablar acerca del objeto; uno quiere un objeto pero no dice “yo quiero esto”; entonces uno habla indirectamente. Véase Vibh. 366 (PTS p. 352), definición de *lapanā*, donde aparece *samullapanā*.","en":"Talking around the object; one wants an object but does not say “I want this”; so one speaks indirectly. See Vibh. 366 (PTS p. 352), the definition of *lapanā*, where *samullapanā* occurs."},"9":{"es":"El término original es *saṃ-ratto*. La ‘ṃ’ se elide y la vocal ‘a’ se convierte en larga. Véase Rū. §53–54 (= Kacc. §38–39).","en":"The original term is *saṃ-ratto*. The ‘ṃ’ is elided and the vowel ‘a’ becomes long. See Rū. §53–54 (= Kacc. §38–39)."},"10":{"es":"*vi + ava + dā*.","en":"*vi + ava + dā*."},"11":{"es":"Lit. *anu*, siempre, y *saya*, yace; que siempre yace.","en":"Lit. *anu*, always, and *saya*, lies; that which always lies."},"12":{"es":"*Doṇa* y *khāri* son medidas de capacidad; el *doṇa* es la decimosexta parte del *khāri* (Vin-ṭ.).","en":"*Doṇa* and *khāri* are measures of capacity; the *doṇa* is the sixteenth part of the *khāri* (Vin-ṭ.)."},"13":{"es":"Véase Rū. §569.","en":"See Rū. §569."},"14":{"es":"El orden es el de Rūpasiddhi (Rū. p. 126). Saddanīti los ordena empezando por **ā**: ā, u, ati, pati, pa, pari, ava, parā, adhi, abhi, anu, upa, apa, api, saṃ, vi, ni, nī, su, du: Sad. (Smith p. 880). Payogasiddhi y Niruttidīpanī sustituyen **nī** por **o**: consideran **nī** mero alargamiento de **ni** (Nir. p. 157).","en":"The order is that of Rūpasiddhi (Rū. p. 126). Saddanīti orders them beginning with **ā**: ā, u, ati, pati, pa, pari, ava, parā, adhi, abhi, anu, upa, apa, api, saṃ, vi, ni, nī, su, du: Sad. (Smith p. 880). Payogasiddhi and Niruttidīpanī replace **nī** with **o**: they regard **nī** as a mere lengthening of **ni** (Nir. p. 157)."},"15":{"es":"Saddanīti lee *pavaddhakāyo* (Cp. II 5:1; CST *pavaḍḍhakāyo*).","en":"Saddanīti reads *pavaddhakāyo* (Cp. II 5:1; CST *pavaḍḍhakāyo*)."},"16":{"es":"Nir. p. 157 (*tadanubandhe putto paputto nattā panattā*); samāsa, p. 279.","en":"Nir. p. 157 (*tadanubandhe putto paputto nattā panattā*); samāsa, p. 279."},"17":{"es":"Saddanīti la pone bajo *nīharaṇa*: Sad. (Smith p. 885).","en":"Saddanīti places it under *nīharaṇa*: Sad. (Smith p. 885)."},"18":{"es":"*nī* es *ni* con vocal alargada; por eso Niruttidīpanī (Nir. p. 157) y Payogasiddhi («*nīharati, issa dīgho*») lo excluyen de la lista y ponen *o*.","en":"*nī* is *ni* with the vowel lengthened; that is why Niruttidīpanī (Nir. p. 157) and Payogasiddhi («*nīharati, issa dīgho*») leave it out of the list and put *o*."},"19":{"es":"Sad. (Smith p. 885).","en":"Sad. (Smith p. 885)."},"20":{"es":"Rū. (CST) y Nir. leen *atthalābha* (Nir.: *rūpassa uppādo*); Payog., Sad. (Smith p. 881) y Abh. leen *attalābha*; Abh-ṭ.: *atthalābho uppatti*.","en":"Rū. (CST) and Nir. read *atthalābha* (Nir.: *rūpassa uppādo*); Payog., Sad. (Smith p. 881) and Abh. read *attalābha*; Abh-ṭ.: *atthalābho uppatti*."},"21":{"es":"Niruttidīpanī (Nir. p. 158) y Abh-ṭ. añaden bajo *abhāva* *dussīlo*, *duppañño*.","en":"Niruttidīpanī (Nir. p. 158) and Abh-ṭ. add under *abhāva* *dussīlo*, *duppañño*."},"22":{"es":"*viyoga*: Rū. p. 128 (*viyoge vippayutto*); Nir. p. 158. *ādikamma*: Sad. (Smith p. 885) (*ādikamme vippakataṃ*); Rū. p. 126 da el mismo ejemplo bajo **pa**.","en":"*viyoga*: Rū. p. 128 (*viyoge vippayutto*); Nir. p. 158. *ādikamma*: Sad. (Smith p. 885) (*ādikamme vippakataṃ*); Rū. p. 126 gives the same example under **pa**."},"23":{"es":"Nir. pp. 159–160.","en":"Nir. pp. 159–160."},"24":{"es":"Rū. p. 129 (*lakkhaṇādīsu … iccādi*); Rū. (kārakakaṇḍa): *lakkhaṇitthambhūtakkhānabhāgavicchāsu pati pari anū*.","en":"Rū. p. 129 (*lakkhaṇādīsu … iccādi*); Rū. (kārakakaṇḍa): *lakkhaṇitthambhūtakkhānabhāgavicchāsu pati pari anū*."},"25":{"es":"Abh. (Abyayavagga), p. 95; Abh-ṭ.","en":"Abh. (Abyayavagga), p. 95; Abh-ṭ."},"26":{"es":"Se mantiene *ativuddhi* (Rūpasiddhi, Payogasiddhi). Saddanīti lee *ativuṭṭhī*, «lluvia excesiva», palabra atestiguada en los comentarios (p. ej. MA. iii 302).","en":"*ativuddhi* is kept (Rūpasiddhi, Payogasiddhi). Saddanīti reads *ativuṭṭhī*, “excessive rain”, a word attested in the commentaries (e.g. MA. iii 302)."},"27":{"es":"Nir. p. 159 (*antokamme mañcaṃ vā pīṭhaṃ vā atiharitvā ṭhapeti*); Abh. (Abyayavagga), p. 95.","en":"Nir. p. 159 (*antokamme mañcaṃ vā pīṭhaṃ vā atiharitvā ṭhapeti*); Abh. (Abyayavagga), p. 95."},"28":{"es":"Kacc. §247 (Rū. §261) los denomina *vibhattisaññā* (‘to’ … ‘dāni’). Rū. (al final de §422) añade que estos mismos sufijos se incluyen también entre los *abyaya-taddhita* (véase la clase 5); en §423 (Kacc. §391) da además, por *nipātana*, ‘jja’ (*ajja*) y ‘jju’ (*sajju*, *aparajju*), que también recoge Abhidhānappadīpikā (último verso del Abyayavagga). Niruttidīpanī (Nir. p. 154) agrega ‘raha’ (*karaha*) y analiza *kuhiñcanaṃ* y *kudācanaṃ* como *kuhiṃ*/*kudā* + partícula *cana*.","en":"Kacc. §247 (Rū. §261) calls them *vibhattisaññā* (‘to’ … ‘dāni’). Rū. (at the end of §422) adds that these same suffixes are also included among the *abyaya-taddhita* (see class 5); in §423 (Kacc. §391) it also gives, by *nipātana*, ‘jja’ (*ajja*) and ‘jju’ (*sajju*, *aparajju*), which Abhidhānappadīpikā also records (last verse of the Abyayavagga). Niruttidīpanī (Nir. p. 154) adds ‘raha’ (*karaha*) and analyses *kuhiñcanaṃ* and *kudācanaṃ* as *kuhiṃ*/*kudā* + the particle *cana*."},"29":{"es":"Rū. §420 lo obtiene del ‘ca’ de Kacc. §397 (cuya vutti solo deriva ‘so’); Abh. también da ‘jjha’. ‘jjhaṃ’ según Moggallāna, Payog. y Nir.","en":"Rū. §420 derives it from the ‘ca’ of Kacc. §397 (whose vutti derives only ‘so’); Abh. also gives ‘jjha’. ‘jjhaṃ’ according to Moggallāna, Payog. and Nir."},"30":{"es":"‘thattā’ se obtiene por ‘tu’ de Kacc. §398 (Rū. §421): *tathattā*, *yathattā*, *aññathattā*. No debe confundirse con el sustantivo neutro *aññathattaṃ*, ‘alteración’. Kacc. §398 lee ‘thatthā’ (Sī ‘tathattā’, Sad. ‘tatthā’); Abh. y su ṭīkā dan ‘thattaṃ’ (*aññathattaṃ*).","en":"‘thattā’ is obtained by the ‘tu’ of Kacc. §398 (Rū. §421): *tathattā*, *yathattā*, *aññathattā*. It should not be confused with the neuter noun *aññathattaṃ*, ‘alteration’. Kacc. §398 reads ‘thatthā’ (Sī ‘tathattā’, Sad. ‘tatthā’); Abh. and its ṭīkā give ‘thattaṃ’ (*aññathattaṃ*)."},"31":{"es":"Kacc. §399 / Rū. §422 *Kim-imehi thaṃ* (‘ka’ por ‘kiṃ’ en virtud de ‘ca’ de Kacc. §227 / Rū. §270; ‘i’ por ‘ima’ y duplicación: Kacc. §234 / Rū. §265).","en":"Kacc. §399 / Rū. §422 *Kim-imehi thaṃ* (‘ka’ for ‘kiṃ’ by virtue of the ‘ca’ of Kacc. §227 / Rū. §270; ‘i’ for ‘ima’ and doubling: Kacc. §234 / Rū. §265)."},"32":{"es":"Sustituto de ‘tuna’, etc. (Kacc. §598 / Rū. §643, que lo extiende a √*i* por *yogavibhāga*: *paṭicca*, *avecca*, *upecca*).","en":"Substitute for ‘tuna’, etc. (Kacc. §598 / Rū. §643, which extends it to √*i* by *yogavibhāga*: *paṭicca*, *avecca*, *upecca*)."},"33":{"es":"Según Kacc. §601 (Rū. §334), las formas en *tave*, *tuna*, etc. no reciben el tratamiento de nombre; Niruttidīpanī (Nir. p. 162) precisa que tras *tvā*/*tvāna* se elide la primera inflexión y tras *tuṃ*/*tave* la cuarta.","en":"According to Kacc. §601 (Rū. §334), forms in *tave*, *tuna*, etc. do not receive the treatment of a noun; Niruttidīpanī (Nir. p. 162) specifies that after *tvā*/*tvāna* the first inflection is elided and after *tuṃ*/*tave* the fourth."}},"clases":[{"id":"upasagga","n":1,"titulo":{"es":"**1. prefijos** **(*upasagga*)**","en":"**1. prefixes** **(*upasagga*)**"},"intro":[{"tipo":"txt","es":"Se anteponen a los verbos y nombres. Tienen tres modos de funcionar (*upasaggagati*): (1) alterar (*bādhati*) el significado de la raíz, (2) seguirlo (*anuvattati*) y (3) especificarlo (*viseseti*). Estrofa: «*dhātvatthaṃ bādhate koci, koci tam anuvattate, tam evañño viseseti, upasaggagatī tidhā*» (Rū. p. 132).","en":"They are placed before verbs and nouns. They have three modes of operation (*upasaggagati*): (1) to alter (*bādhati*) the meaning of the root, (2) to follow it (*anuvattati*) and (3) to specify it (*viseseti*). Stanza: «*dhātvatthaṃ bādhate koci, koci tam anuvattate, tam evañño viseseti, upasaggagatī tidhā*» (Rū. p. 132)."},{"tipo":"txt","es":"Ejemplos:","en":"Examples:"},{"tipo":"ej","es":"va. Si se le coloca el prefijo **ā**, *ā-gacchati*, viene. En este caso el significado es el opuesto.","en":"goes. If the prefix **ā** is placed before it, *ā-gacchati*, comes. In this case the meaning is the opposite.","pali":"gacchati"},{"tipo":"ej","es":"de pie. Si se le coloca el prefijo **pati**, *pati-ṭṭhito*, establecido, firme. En este caso no se modifica el significado.","en":"standing. If the prefix **pati** is placed before it, *pati-ṭṭhito*, established, firm. In this case the meaning is not modified.","pali":"ṭhito"},{"tipo":"ej","es":"conoce. Si se le coloca el prefijo **pa**, *pajānāti*, conoce bien, de diversos modos. En este caso se modifica el significado.","en":"knows. If the prefix **pa** is placed before it, *pajānāti*, knows well, in various ways. In this case the meaning is modified.","pali":"jānāti"},{"tipo":"txt","es":"Hay veinte prefijos: **pa**, **parā**, **ni**, **nī**, **u**, **du**, **saṃ**, **vi**, **ava**, **anu**, **pari**, **adhi**, **abhi**, **pati**, **su**, **ā**, **ati**, **api**, **apa**, **upa**.[^14]","en":"There are twenty prefixes: **pa**, **parā**, **ni**, **nī**, **u**, **du**, **saṃ**, **vi**, **ava**, **anu**, **pari**, **adhi**, **abhi**, **pati**, **su**, **ā**, **ati**, **api**, **apa**, **upa**.[^14]"}],"entradas":[{"id":"u-pa","lema":"pa","bloques":[{"tipo":"txt","es":"Modo (*pakāra*):","en":"Mode (*pakāra*):"},{"tipo":"ej","es":"sabiduría (lo que conoce de diversos modos).","en":"wisdom (that which knows in various ways).","pali":"paññā"},{"tipo":"txt","es":"Comienzo (*ādikamma*):[^2]","en":"Beginning (*ādikamma*):[^2]"},{"tipo":"ej","es":"comenzado pero no finalizado.","en":"begun but not finished.","pali":"vippakataṃ"},{"tipo":"txt","es":"Prominente; principal (*padhāna*):","en":"Prominent; principal (*padhāna*):"},{"tipo":"ej","es":"excelente; *padhānaṃ*, lo principal; *padhānattaṃ*, preeminencia.","en":"excellent; *padhānaṃ*, the principal; *padhānattaṃ*, pre-eminence.","pali":"paṇītaṃ"},{"tipo":"txt","es":"Supremacía (*issariya*):","en":"Supremacy (*issariya*):"},{"tipo":"ej","es":"éste es el jefe supremo de esta región.","en":"this one is the supreme chief of this region.","pali":"pa-bhū ayaṃ desassa"},{"tipo":"txt","es":"Dentro (*antobhāva*):","en":"Inside (*antobhāva*):"},{"tipo":"ej","es":"arrojado o puesto dentro.","en":"thrown or put inside.","pali":"pakkhittaṃ"},{"tipo":"txt","es":"Separación (*viyoga*):","en":"Separation (*viyoga*):"},{"tipo":"ej","es":"el que vive fuera (de su hogar), ausente (Rū. p. 126 y Payog.: *pavāsī*; Nir. p. 157 da *pavāso*).","en":"one who lives away (from home), absent (Rū. p. 126 and Payog.: *pavāsī*; Nir. p. 157 has *pavāso*).","pali":"pavāsī"},{"tipo":"txt","es":"Más allá de ése, el siguiente en la serie (*tappara*):[^3]","en":"Beyond that, the next in the series (*tappara*):[^3]"},{"tipo":"ej","es":"el maestro del maestro.","en":"the teacher's teacher.","pali":"pācariyo"},{"tipo":"txt","es":"Sucesión (de generaciones) (*tadanubandha*):[^16]","en":"Succession (of generations) (*tadanubandha*):[^16]","nuevo":true},{"tipo":"ej","es":"nieto (hijo del hijo).","en":"grandson (son of the son).","pali":"paputto"},{"tipo":"ej","es":"bisnieto.","en":"great-grandson.","pali":"panattā"},{"tipo":"txt","es":"En el significado de mucho, abundancia (*bhusattha*):","en":"In the sense of much, abundance (*bhusattha*):"},{"tipo":"ej","es":"de cuerpo muy crecido (*bahubbīhi*).[^15]","en":"with a greatly grown body (*bahubbīhi*).[^15]","pali":"pavuddhakāyo"},{"tipo":"txt","es":"Origen (*sambhava*):","en":"Origin (*sambhava*):"},{"tipo":"ej","es":"el Ganges se eaning."},{"tipo":"txt","es":"El primer grupo de partículas puede estar asociado con una inflexión determinada (*vibhattiyutta*) o disociado de inflexión (*avibhattiyutta*).","en":"The first group of particles may be associated with a particular inflection (*vibhattiyutta*) or dissociated from inflection (*avibhattiyutta*)."}],"entradas":[{"id":"a","lema":"a","cab":{"es":"**a**, (= sc.) (pref. de neg.) *an* antes de una vocal. Existe en los siguientes significados:","en":"**a**, (= Skt.) (negative prefix) *an* before a vowel. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Negación (*paṭisedhana*):","en":"Negation (*paṭisedhana*):"},{"tipo":"ej","pali":"asuta","ref":"","es":"no oído.","en":"not heard."},{"tipo":"txt","es":"Incremento (*vuddhi*):","en":"Increase (*vuddhi*):"},{"tipo":"ej","pali":"asekkhā dhammā","ref":"","es":"estados de no aprendices.","en":"states of those beyond training (non-trainees)."},{"tipo":"txt","es":"Ese estado (*tabbhāva*):","en":"That state (*tabbhāva*):"},{"tipo":"ej","pali":"anavajjaṃ","ref":"","es":"irreprochable.","en":"blameless."},{"tipo":"txt","es":"Otro (*añña*):","en":"Other (*añña*):"},{"tipo":"ej","pali":"abyākatā dhammā","ref":"Dhs. 1","es":"estados indeterminados.","en":"indeterminate states."},{"tipo":"txt","es":"Parecido, semejante (*sadisa*):","en":"Similar, alike (*sadisa*):"},{"tipo":"ej","pali":"amanusso","ref":"D. ii 196","es":"parecido a un humano = un espíritu o deva.","en":"non-human, i.e. one resembling a human = a spirit or deva."},{"tipo":"txt","es":"Opuesto (*viruddha*):","en":"Opposite (*viruddha*):"},{"tipo":"ej","pali":"akusalā dhammā","ref":"Dhs. 1","es":"estados insanos.","en":"unwholesome states."},{"tipo":"txt","es":"Reproche (*garaha*):","en":"Reproach (*garaha*):"},{"tipo":"ej","pali":"arājā","ref":"","es":"no rey.","en":"a non-king (i.e. not a true king)."},{"tipo":"txt","es":"Vacío (*suñña*):","en":"Emptiness (*suñña*):"},{"tipo":"ej","pali":"abhāvo","ref":"Vis. i 330","es":"inexistencia, ausencia.","en":"non-existence, absence."},{"tipo":"txt","es":"Carente (*viraha*):","en":"Lacking (*viraha*):"},{"tipo":"ej","pali":"aputtakaṃ","ref":"V. i 20","es":"sin hijo.","en":"sonless, without a son."},{"tipo":"txt","es":"Poco (*appaka*):","en":"Little (*appaka*):"},{"tipo":"ej","pali":"anudarā kaññā","ref":"Vis-ṭ ii 264","es":"muchacha con poco vientre.","en":"a girl with a small belly."}],"notas":[],"avisos_en":[]},{"id":"n-anga","lema":"aṅga","nuevo":true,"cab":{"es":"**aṅga**, (sc. *aṅga*) (ind.) Partícula de llamada (vocativa): ¡eh!, ¡oye!","en":"**aṅga**, (Skt. *aṅga*) (ind.) Particle of calling (vocative): hey!, listen!"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Llamada, invocación (*avhāna*).","en":"Calling, summoning (*avhāna*)."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1139 («avhāne bho are ambho, hambho re je’ṅga āvuso»); Abhidhānappadīpikāṭīkā v. 1139 (M 598): «bho are ambho hambho re je aṅga āvuso he hare ete dasa avhāne»; Bālāvatāra (lista de nipātas, M 130) incluye *aṅga*. No se ha hallado en CST ningún ejemplo de *aṅga* como partícula vocativa: las ocurrencias revisadas son el sustantivo *aṅga* (miembro, factor, causa) o el país Aṅga.","en":"Abhidhānappadīpikā v. 1139; Abhidhānappadīpikāṭīkā v. 1139 (M 598): «bho are ambho hambho re je aṅga āvuso he hare ete dasa avhāne»; Bālāvatāra (list of nipātas, M 130) includes *aṅga*. No example of *aṅga* as a vocative particle has been found in CST: the occurrences checked are the noun *aṅga* (limb, factor, cause) or the country Aṅga."}},{"id":"aciram","lema":"aciraṃ","cab":{"es":"**aciraṃ**, (= sc.) (adv.) en el significado de rápido (*sīghattha*). 1) rápidamente, pronto, deprisa, aprisa; 2) dentro de poco, en breve.","en":"**aciraṃ**, (= Skt.) (adv.) in the sense of quick (*sīghattha*). 1) quickly, soon, swiftly, rapidly; 2) before long, shortly."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"aciraṃ vat’ ayaṃ kāyo pathaviṃ adhisessati","ref":"Dh. 19","es":"dentro de poco, ciertamente, este cuerpo yacerá en la tierra.","en":"Before long, indeed, this body will lie upon the earth."}],"notas":[],"avisos_en":[]},{"id":"ajja","lema":"ajja","cab":{"es":"**ajja**, (sc. *adya*) (part. usada en la 7ª inflexión —tiempo) Hoy, hoy día, hoy en día, ahora, en este día (*asmiṃ dine*).","en":"**ajja**, (Skt. *adya*) (particle used in the 7th case — time) Today, this day, nowadays, now, on this day (*asmiṃ dine*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"idān’ eva kho, ānanda, ajja cāpāle cetiye māro pāpimā yenāhaṃ ten’ upasaṅkami","ref":"D. ii 95","es":"Ānanda, ahora mismo, hoy día, Māra, el Malvado, vino a mí en el templo Cāpāla.","en":"Just now, Ānanda, today, at the Cāpāla shrine, Māra the Evil One came to me."},{"tipo":"ej","pali":"Tayājja guttā viharemu divasaṃ","ref":"J. i 38","es":"por usted hoy día protegidos, viviremos durante el día.","en":"Protected by you today, may we live through the day."}],"notas":[],"avisos_en":["block 2: Spanish renders viharemu as future ('viviremos', we shall live); the Pāḷi is optative 1st pl. ('may we live')."]},{"id":"ajju","lema":"ajju","cab":{"es":"**ajju**,[^1] véase *ajja*.","en":"**ajju**,[^1] see *ajja*."},"caso":["7"],"nir":"","bloques":[],"notas":[{"n":"1","es":"Sad. 381.","en":"Sad. 381."}],"avisos_en":[]},{"id":"ajjhattam","lema":"ajjhattaṃ","cab":{"es":"**ajjhattaṃ**, (sc. *adhyātman*) (adv. 7ª inflexión) Internamente, personalmente; dentro, adentro.","en":"**ajjhattaṃ**, (Skt. *adhyātman*) (adv. 7th case) Internally, personally; within, inside."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ajjhattaṃ sampasādanaṃ","ref":"D. i 34","es":"serenidad interna.","en":"internal serenity."}],"notas":[],"avisos_en":[]},{"id":"annatra","lema":"aññatra","cab":{"es":"**aññatra**, (sc. *anyatra*) (adv.) Excepto, aparte, sin; cuando no; de otro modo; en otro lugar; en otro momento.","en":"**aññatra**, (Skt. *anyatra*) (adv.) Except, apart from, without; when not; otherwise; elsewhere; at another time."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"aññatra buddhuppādā abhisamayo natthi","ref":"","es":"cuando no hay surgimiento de Buddha no hay penetración (de las verdades).","en":"apart from (i.e. without) the arising of a Buddha there is no penetration (of the truths)."},{"tipo":"ej","pali":"aññatra upalāpanāya, aññatra mithubhedā","ref":"D. ii 64","es":"excepto por medio de la persuasión, excepto rompiendo su unidad.","en":"except by means of persuasion, except by breaking their unity."}],"notas":[],"avisos_en":[]},{"id":"annadatthu","lema":"aññadatthu","cab":{"es":"**aññadatthu**, (sc. *anyadastu*) (adv.) Ciertamente, realmente, verdaderamente; en el significado de certeza, definitivo (*ekaṃsattha*).","en":"**aññadatthu**, (Skt. *anyadastu*) (adv.) Certainly, really, truly; in the sense of certainty, definiteness (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"aññadatthu samaṇass’ eva gotamassa sāvakā sampajjanti","ref":"M. i 234","es":"ciertamente, se convirtieron en discípulos del asceta Gotama.","en":"certainly, they become disciples of the ascetic Gotama himself."}],"notas":[],"avisos_en":["block 1: Spanish has past tense ('se convirtieron'); the Pāḷi sampajjanti is present ('they become')."]},{"id":"annada","lema":"aññadā","cab":{"es":"**aññadā**, (sc. *anyadā*) (part. usada en la 7ª inflexión —tiempo) En otro momento; en otro día; antes","en":"**aññadā**, (Skt. *anyadā*) (particle used in the 7th case — time) At another time; on another day; formerly"},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ayaṃ aññadā nakkhattayogaṃ na vadati","ref":"JA. iv 204","es":"éste antes no hablaba acerca de la conjunción planetaria.","en":"formerly this man did not speak about the conjunction of the stars (lit. at other times he does not speak…)."}],"notas":[],"avisos_en":[]},{"id":"n-ati","lema":"ati","nuevo":true,"cab":{"es":"**ati**, (part.) Absolutamente, completamente (*accanta*).","en":"**ati**, (part.) Absolutely, completely (*accanta*)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Absoluto (*accanta*):","en":"Absolute (*accanta*):"},{"tipo":"ej","pali":"atha vā pa-iti pakāre, atīti accantatthe nipāto, tasmā pakārehi accantaṃ mokkhetīti pātimokkhaṃ","ref":"Vis-ṭ. i 40","es":"O bien: pa [está] en el sentido de «modo», ati es un nipāta en el sentido de «absolutamente»; por tanto, pātimokkha es lo que libera absolutamente de diversos modos.","en":"Or else: pa [is] in the sense of «mode», ati is a nipāta in the sense of «absolutely»; therefore pātimokkha is what liberates absolutely in various modes."}],"notas":[],"fuente":{"es":"Comentario: Vis-ṭ. i 40, Vibh-mūlaṭ. 179, MṬ. i 258, AṬ. ii 36, AṬ. iii 272, Sārattha-ṭ. ii 60, UdA. 203 (P 224) e ItA. 291 (P ii 128), todos en la etimología de pātimokkha: «atīti accantatthe nipāto». *ati* es ante todo un *upasagga*; la única evidencia hallada de su tratamiento como nipāta es esta etimología de *pātimokkha*, y el ejemplo es la propia ṭīkā.","en":"Commentary: Vis-ṭ. i 40, Vibh-mūlaṭ. 179, MṬ. i 258, AṬ. ii 36, AṬ. iii 272, Sārattha-ṭ. ii 60, UdA. 203 (P 224) and ItA. 291 (P ii 128), all in the etymology of pātimokkha: «atīti accantatthe nipāto». *ati* is above all an *upasagga*; the only evidence found of its treatment as a nipāta is this etymology of *pātimokkha*, and the example is the ṭīkā itself."}},{"id":"n-ativa","lema":"atīva","nuevo":true,"cab":{"es":"**atīva**, (adv.) Muy, mucho, en exceso (*atisaya*); = *ativiya*, *bhusaṃ*.","en":"**atīva**, (adv.) Very, much, exceedingly (*atisaya*); = *ativiya*, *bhusaṃ*."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"petāni bhoti puttāni, khādamānā tuvaṃ pure; tuvaṃ divā ca ratto ca, atīva paritappasi","ref":"T. i 414","es":"Antes, señora, tú que «devorabas» a tus hijos muertos, día y noche te atormentabas en exceso. [Según ThīA. 241, «devorar a los hijos» es expresión popular de reproche (*khuṃsanavacana*) para la mujer a quien se le mueren los hijos.]","en":"Formerly, lady, you who “devoured” your dead sons tormented yourself exceedingly day and night. [According to ThīA. 241, “devouring one’s sons” is a popular term of reproach (*khuṃsanavacana*) for a woman whose children die.]"},{"tipo":"ej","pali":"suvaṇṇarājīhi atīva saṅgataṃ, veḷuriyarājīva atīva sobhati","ref":"Vv. 91","es":"[el adorno de la cabeza, con su media luna de joyas,] unido estrechamente con franjas de oro, resplandece en extremo como una franja de berilo.","en":"[the head ornament, with its jewelled crescent,] closely joined with bands of gold, shines exceedingly like a band of beryl."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1138: «balavaṃ suṭṭhu cā’tīvā, tisaye kimuta sva’ti»; su ṭīkā (pp. 597–598): «balavaṃ suṭṭhu atīva kimuta su ati ete cha atisayatthe». Therīgāthā-aṭṭhakathā (ThīA. 241): «atīvā ti ativiya bhusaṃ».","en":"Abhidhānappadīpikā v. 1138: «balavaṃ suṭṭhu cā’tīvā, tisaye kimuta sva’ti»; its ṭīkā (pp. 597–598): «balavaṃ suṭṭhu atīva kimuta su ati ete cha atisayatthe». Therīgāthā-aṭṭhakathā (ThīA. 241): «atīvā ti ativiya bhusaṃ»."}},{"id":"n-attham","lema":"atthaṃ","nuevo":true,"cab":{"es":"**atthaṃ**, (sc. *astam*) (ind.) Desaparición, ocaso; solo con verbos de movimiento: *atthaṃ gacchati*, *atthaṃ paleti* (desaparecer, ponerse [el sol]).","en":"**atthaṃ**, (Skt. *astam*) (ind.) Disappearance, setting; only with verbs of motion: *atthaṃ gacchati*, *atthaṃ paleti* (to disappear, to set [of the sun])."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Desaparición (*adassana*):","en":"Disappearance (*adassana*):"},{"tipo":"ej","pali":"Accī yathā vātavegena khittā, atthaṃ paleti na upeti saṅkhaṃ","ref":"Sn. 440","es":"como una llama arrojada por la fuerza del viento se extingue y ya no entra en cómputo.","en":"as a flame flung by the force of the wind goes out and cannot be reckoned."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1154 («atthaṃ adassane»); SnA. ii 309 (P 594), sobre este verso: «atthaṃ paletīti atthaṃ gacchati. Na upeti saṅkhanti asukaṃ nāma disaṃ gatoti vohāraṃ na gacchati». La ṭīkā de Abhidhānappadīpikā no comenta *atthaṃ*. Por su forma es un acusativo (de *attha*, «ocaso, hogar») fijado con verbos de movimiento; ninguna fuente consultada lo llama nipāta, salvo su inclusión en la sección de indeclinables de Abhidhānappadīpikā.","en":"Abhidhānappadīpikā v. 1154; SnA. ii 309 (P 594), on this verse: «atthaṃ paletīti atthaṃ gacchati. Na upeti saṅkhanti asukaṃ nāma disaṃ gatoti vohāraṃ na gacchati». The Abhidhānappadīpikā’s ṭīkā does not comment on *atthaṃ*. In form it is an accusative (of *attha*, “setting, home”) fixed with verbs of motion; no source consulted calls it a nipāta, apart from its inclusion in the indeclinables section of the Abhidhānappadīpikā."}},{"id":"n-atthu","lema":"atthu","nuevo":true,"cab":{"es":"**atthu**, (sc. *astu*) (ind.) ¡Sea!, ¡así sea!: concesión hecha con desagrado o envidia (*usūyopagama*).","en":"**atthu**, (Skt. *astu*) (ind.) Let it be!, so be it!: a concession made with displeasure or envy (*usūyopagama*)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Uso como forma verbal (imperativo de √*as*, «que haya, sea»), del cual procede el uso como partícula:","en":"Use as a verb form (imperative of √*as*, “let there be”), from which the particle use derives:"},{"tipo":"ej","pali":"Dhī taṃ jammi jare atthu, dubbaṇṇakaraṇī jare","ref":"S. iii 191","es":"¡vergüenza sobre ti, vil vejez; vejez que causas fealdad!","en":"shame be upon you, wretched old age; old age that brings ugliness!"}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1151 («usūyopagame’tthu ca»); Abhidhānappadīpikāṭīkā v. 1151 (M 601–602): «Usūyopagame usūyāpubbake upagame. ‘Kāmānumatiyaṃ kāmo, usūyopagamepi cā’ti ruddo. Usūyopagamānuññāṇepicāyaṃ attho dissate». *atthu* es el imperativo de √*as* (Kaccāyana, Rūpasiddhi y Moggallāna lo derivan así), es decir, un *ākhyātapaṭirūpaka*; Abhidhānappadīpikā lo trata como nipāta solo en el sentido de *usūyopagama*. No se ha hallado en CST ejemplo de este sentido específico: el ejemplo de S. iii 191 (S v 217) ilustra el uso verbal corriente («sea [vergüenza] sobre ti»), no la concesión con desagrado.","en":"Abhidhānappadīpikā v. 1151; Abhidhānappadīpikāṭīkā v. 1151 (M 601–602): «Usūyopagame usūyāpubbake upagame. ‘Kāmānumatiyaṃ kāmo, usūyopagamepi cā’ti ruddo. Usūyopagamānuññāṇepicāyaṃ attho dissate». *atthu* is the imperative of √*as* (Kaccāyana, Rūpasiddhi and Moggallāna derive it so), i.e. an *ākhyātapaṭirūpaka*; the Abhidhānappadīpikā treats it as a nipāta only in the sense of *usūyopagama*. No example of this specific sense has been found in CST: the example from S. iii 191 (S v 217) illustrates the ordinary verbal use (“[shame] be upon you”), not the grudging concession."}},{"id":"n-atra","lema":"atra","nuevo":true,"cab":{"es":"**atra**, (sc. *atra*) (ind.) Aquí, en este lugar; en esto.","en":"**atra**, (Skt. *atra*) (ind.) Here, in this place; in this."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Lugar (*okāsa*):","en":"Place (*okāsa*):"},{"tipo":"ej","pali":"atra pattaṃ nikkhipāhi, atra cīvaraṃ nikkhipāhi, idaṃ āsanaṃ, nisīdāhī","ref":"V. iv 377","es":"deja aquí el cuenco, deja aquí el hábito; este es el asiento, siéntate.","en":"put the bowl down here, put the robe down here; this is the seat, sit down."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1161 («ihe’dhā’tra tu etthā’ttha»); Abhidhānappadīpikāṭīkā v. 1161 (M 604): «Iha idha atra ettha attha ete okāsatthādivācakā»; Kaccāyana §232 *Tre niccaṃ* (M 125): «Sabbassa etasaddassa akāro hoti niccaṃ trapaccaye pare. Atra»; Rūpasiddhi §267 (M 123). Gramaticalmente es *eta* + *tra* (Kaccāyana §232, Rūpasiddhi §267), un *vibhattipaccayanta*. Rūpasiddhi (vibhattippaccayavidhāna, M 120) dice de estas formas: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («por carecer de género y ser nipātas, su forma es la misma en los tres géneros y en ambos números»). *atra* es raro en el canon de CST (en mūla, sobre todo en el Vinaya y en los versos del Jātaka); la forma corriente es *ettha*.","en":"Abhidhānappadīpikā v. 1161; Abhidhānappadīpikāṭīkā v. 1161 (M 604): «Iha idha atra ettha attha ete okāsatthādivācakā»; Kaccāyana §232 *Tre niccaṃ* (M 125): «Sabbassa etasaddassa akāro hoti niccaṃ trapaccaye pare. Atra»; Rūpasiddhi §267 (M 123). Grammatically it is *eta* + *tra* (Kaccāyana §232, Rūpasiddhi §267), a *vibhattipaccayanta*. Rūpasiddhi (vibhattippaccayavidhāna, M 120) says of these forms: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («because they are genderless and are nipātas, their form is the same in the three genders and both numbers»). *atra* is rare in the CST canon (in the mūla, mainly in the Vinaya and the Jātaka verses); the usual form is *ettha*."}},{"id":"atha","lema":"atha","cab":{"es":"**atha**, (= sc.) (adv.) Y; también; ahora; pero; luego, después. Existe en los siguientes significados:","en":"**atha**, (= Skt.) (adv.) And; also; now; but; then, afterwards. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Pregunta (*pañha*):","en":"Question (*pañha*):"},{"tipo":"ej","pali":"atha tvaṃ kena vaṇṇena, kena vā pana hetunā; kena vā atthajātena, attānaṃ parimocayi","ref":"J. ii 220","es":"¿por qué motivo o causa o propósito, tú te liberaste a ti mismo? Aquí *atha* sirve para introducir la pregunta y podría traducirse como “y” o “pero”. La pregunta es realizada por *kena vaṇṇena*, ¿por qué motivo?; *kena vā hetunā*, ¿o por qué causa?; *kena vā atthajātena*, ¿o por qué propósito?","en":"Now, for what reason, or for what cause, or for what purpose did you set yourself free? Here *atha* serves to introduce the question and could be translated as “and” or “but”. The question is posed by *kena vaṇṇena*, for what reason?; *kena vā hetunā*, or for what cause?; *kena vā atthajātena*, or for what purpose?"},{"tipo":"txt","es":"Sucesión o secuencia (*ānantariya*):","en":"Succession or sequence (*ānantariya*):"},{"tipo":"ej","pali":"atha naṃ āha","ref":"Khu ii 426","es":"luego le dijo.","en":"then he said to him."},{"tipo":"txt","es":"Cambio de tópico (*adhikāra* o *adhikārantara*):","en":"Change of topic (*adhikāra* or *adhikārantara*):"},{"tipo":"ej","pali":"atha pubbassaralopo","ref":"","es":"después hay elisión de la vocal previa.","en":"next, there is elision of the preceding vowel."},{"tipo":"txt","es":"Ocurrencia ininterrumpida (*avicchinna*):[^2]","en":"Uninterrupted occurrence (*avicchinna*):[^2]"},{"tipo":"ej","pali":"atha kho Bhagavā rattiyā paṭhamaṃ yāmaṃ paṭiccasamuppādaṃ anulomapaṭilomaṃ manasākāsi","ref":"V. iii 1","es":"el Sublime reflexionó en el origen condicionado en orden directo y contrario durante toda la primera parte de la noche.","en":"Then the Blessed One, throughout the first watch of the night, attended to dependent origination in forward and reverse order."}],"notas":[{"n":"2","es":"Sad. iii 377.","en":"Sad. iii 377."}],"avisos_en":[]},{"id":"athava","lema":"athavā","cab":{"es":"**athavā** = **atha vā**, (adv.) o.[^3]","en":"**athavā** = **atha vā**, (adv.) or.[^3]"},"caso":[],"nir":"","bloques":[],"notas":[{"n":"3","es":"*Pakkhantaropadassanatthe nipāto* (Mogp. 181).","en":"*Pakkhantaropadassanatthe nipāto* (Mogp. 181)."}],"avisos_en":[]},{"id":"atho","lema":"atho","cab":{"es":"**atho**, (= sc.) (adv.) Y; también; luego; entonces.","en":"**atho**, (= Skt.) (adv.) And; also; then; thereupon."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Referencia a lo previamente dicho (*anvādesa*):","en":"Reference to what was previously said (*anvādesa*):"},{"tipo":"ej","pali":"svāgatan te mahārāja, atho te adurāgataṃ","ref":"J. i 329","es":"bienvenido a ti, gran rey, entonces, tú no eres mal venido.","en":"Welcome to you, great king; and your coming is no ill-coming."}],"notas":[],"avisos_en":[]},{"id":"atthi","lema":"atthi","cab":{"es":"**atthi**, (sc. as) (adv., part., 1ª inflexión) Existe; hay.","en":"**atthi**, (Skt. as) (adv., particle, 1st case) It exists; there is."},"caso":["1"],"nir":"","bloques":[{"tipo":"ej","pali":"atthi dinnaṃ, atthi yiṭṭhaṃ","ref":"Dhs. i 263","es":"existe lo que es dado, existe lo que es ofrecido.","en":"there is what is given, there is what is offered."},{"tipo":"ej","pali":"atthi imasmiṃ kāye kesā","ref":"Khp. i 2","es":"hay en este cuerpo cabellos.","en":"in this body there are head-hairs."}],"notas":[],"avisos_en":[]},{"id":"n-adu","lema":"adu","nuevo":true,"cab":{"es":"**adu**, (part.) Entonces, pues; enfático en preguntas retóricas («¿para qué entonces…?»).","en":"**adu**, (part.) Then, so; emphatic in rhetorical questions («what use then…?»)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"En el sentido de *nāma* (enfático):","en":"In the sense of *nāma* (emphatic):"},{"tipo":"ej","pali":"adu paññā kimatthiyā, amacco vāpi tādiso, yo taṃ sambādhapakkhandaṃ, dukkhā na parimocaye","ref":"J. ii 213","es":"¿Para qué sirve entonces la sabiduría, o un ministro semejante, si no te libra del sufrimiento cuando has caído en este aprieto?","en":"What use then is wisdom, or such a minister, who would not free you from suffering when you have fallen into this strait?"}],"notas":[],"fuente":{"es":"Comentario: JA. vi 292 (sobre esta estrofa): «adūti nāmatthe nipāto, paññā nāma kimatthiyāti attho»; JA. iii 475 (sobre «adu paññā kimatthiyā, nipuṇā sādhucintinī»): «tattha adūti nipāto». La estrofa comentada en JA. iii 475 es J. i 191 (CST lee *adu*, var. *ādu* sī. pī.).","en":"Commentary: JA. vi 292 (on this verse): «adūti nāmatthe nipāto, paññā nāma kimatthiyāti attho»; JA. iii 475 (on «adu paññā kimatthiyā, nipuṇā sādhucintinī»): «tattha adūti nipāto». The stanza commented on at JA. iii 475 is J. i 191 (CST reads *adu*, var. *ādu* sī. pī.)."}},{"id":"addha","lema":"addhā","cab":{"es":"**addhā**, (= sc.) (adv.) Ciertamente, realmente, verdaderamente, evidentemente, definitivamente; en el significado de definitivo, certeza (*ekaṃsattha*).","en":"**addhā**, (= Skt.) (adv.) Certainly, really, truly, evidently, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"addhā, āvuso … bhagavā jānaṃ jānāti, passaṃ passati","ref":"M. i 157","es":"ciertamente, amigo, el Sublime conociendo conoce, viendo ve.","en":"certainly, friend, … the Blessed One, knowing, knows; seeing, sees."},{"tipo":"ej","pali":"addhā āḷāro kālāmo imaṃ dhammaṃ jānaṃ passaṃ viharati","ref":"M. i 304","es":"ciertamente, Āḷāra Kālāma vive viendo y conociendo este dhamma.","en":"certainly, Āḷāra Kālāma dwells knowing and seeing this Dhamma."},{"tipo":"ej","pali":"addhā tvaṃ buddho bhavissasi","ref":"JA. i 78","es":"definitivamente tú serás el Buddha.","en":"certainly you will become a Buddha."}],"notas":[],"avisos_en":[]},{"id":"adhuna","lema":"adhunā","cab":{"es":"**adhunā**,[^4] (= sc.) (part. usada en la 7ª inflexión —tiempo) Ahora.","en":"**adhunā**,[^4] (= Skt.) (particle used in the 7th case — time) Now."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ajito pi nāma licchavīnaṃ senāpati adhunā kālaṅkato tāvatiṃsakāyaṃ upapanno","ref":"D. iii 11","es":"Ajita, el general de los Licchavis ha muerto ahora y reconectado en Tāvatiṃsa.","en":"Ajita too, the general of the Licchavis, who has just now died, has been reborn in the Tāvatiṃsa host."}],"notas":[{"n":"4","es":"Sad. iii 381.","en":"Sad. iii 381."}],"avisos_en":[]},{"id":"adho","lema":"adho","cab":{"es":"**adho**, (sc. *adhas*) (adv.,7ª inflexión) Abajo, debajo, bajo; hacia abajo. Opuesto de *uddhaṃ*.","en":"**adho**, (Skt. *adhas*) (adv., 7th case) Below, beneath, under; downward. Opposite of *uddhaṃ*."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"uddhaṃ pādatalā adho kesamatthakā","ref":"D. ii 233","es":"desde las plantas de los pies hacia arriba, desde las puntas de los cabellos hacia abajo.","en":"upward from the soles of the feet, downward from the tips of the hairs."},{"tipo":"ej","pali":"na adho oloketi","ref":"M. ii 338","es":"no mira hacia abajo.","en":"he does not look down."}],"notas":[],"avisos_en":[]},{"id":"an","lema":"an","cab":{"es":"**an**, véase **a**.","en":"**an**, see **a**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"antaram","lema":"antaraṃ","cab":{"es":"**antaraṃ**,[^5] (= sc.) (adv., 7ª inflexión) Dentro, entre, en.","en":"**antaraṃ**,[^5] (= Skt.) (adv., 7th case) Within, between, in."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"gāviṃ saṅkanteyya anupahacca antaraṃ maṃsakāyaṃ anupahacca bāhiraṃ cammakāyaṃ","ref":"M. iii 318","es":"sin dañar la masa de carne interna y sin dañar el cuero externo, cortaría la vaca.","en":"he would carve up the cow without damaging the inner mass of flesh and without damaging the outer hide."}],"notas":[{"n":"5","es":"Sad. 380.","en":"Sad. 380."}],"avisos_en":[]},{"id":"antara","lema":"antarā","cab":{"es":"**antarā**, (= sc.) (adv., 7ª inflexión) En el medio, entre, dentro.","en":"**antarā**, (= Skt.) (adv., 7th case) In the middle, between, within."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ekaṃ samayaṃ bhagavā antarā ca rājagahaṃ antarā ca nāḷandaṃ addhānamaggappaṭipanno hoti","ref":"D. i 1","es":"en una ocasión el Sublime estaba viajando por el camino entre Nāḷanda y Rājagaha.","en":"on one occasion the Blessed One was travelling along the highway between Rājagaha and Nāḷandā."}],"notas":[],"avisos_en":[]},{"id":"n-antarena","lema":"antarena","nuevo":true,"cab":{"es":"**antarena**, (part., prep.) 1) Entre, en medio de (con genitivo); 2) sin, excepto, excluyendo (*vajjana*; = *vinā*).","en":"**antarena**, (part., prep.) 1) Between, in the midst of (with the genitive); 2) without, except, excluding (*vajjana*; = *vinā*)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Entre, en medio (*abbhantara*):","en":"Between, in the midst (*abbhantara*):"},{"tipo":"ej","pali":"iṅgha me tvaṃ, ānanda, antarena yamakasālānaṃ uttarasīsakaṃ mañcakaṃ paññapehi","ref":"D. ii 113","es":"Vamos, Ānanda, prepárame entre los dos árboles sāla gemelos un lecho con la cabecera hacia el norte.","en":"Come, Ānanda, prepare a couch for me between the twin sāla trees, with its head to the north."},{"tipo":"txt","es":"Exclusión (*vajjana*), según Niruttidīpanī:","en":"Exclusion (*vajjana*), according to Niruttidīpanī:"},{"tipo":"ej","pali":"nevidha na huraṃ na ubhayamantarena, esevanto dukkhassa","ref":"Ud. 86","es":"ni aquí ni allá ni [en otro lugar] excepto ambos: éste es el fin del sufrimiento.","en":"neither here nor beyond nor [anywhere] apart from both: this is the end of suffering."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1137: «vajjane tu vinā nānā, antarena rite puthu»; v. 1150: «antarena’ntarā anto»; su ṭīkā (p. 597): «vinādayo pañca vajjanatthā»; p. 601: «antarena antarā anto cā ti ete abbhantare iccatthe». Niruttidīpanī (p. 172), sobre la 2.ª: «… nevidha na huraṃ na ubhayamantarena esevanto dukkhassā ti … tattha antarenā ti nipātapadametaṃ, vajjetvā ty attho». La lectura de Ud. 86 como «excepto ambos» es la de Niruttidīpanī; UdA. 83 lo entiende de otro modo («antarenā ti vacanaṃ vikappantaradīpanaṃ») y rechaza que indique un estado intermedio (*antarābhava*); la traducción habitual es «ni en medio de ambos». No se ha hallado en CST otro ejemplo canónico claro de *antarena* = *vinā*.","en":"Abhidhānappadīpikā v. 1137: «vajjane tu vinā nānā, antarena rite puthu»; v. 1150: «antarena’ntarā anto»; its ṭīkā (p. 597): «vinādayo pañca vajjanatthā»; p. 601: «antarena antarā anto cā ti ete abbhantare iccatthe». Niruttidīpanī (p. 172), on the 2nd case: «… nevidha na huraṃ na ubhayamantarena esevanto dukkhassā ti … tattha antarenā ti nipātapadametaṃ, vajjetvā ty attho». The reading of Ud. 86 as “except both” is that of the Niruttidīpanī; UdA. 83 understands it otherwise («antarenā ti vacanaṃ vikappantaradīpanaṃ») and rejects that it indicates an intermediate state (*antarābhava*); the usual translation is “nor in between both”. No other clear canonical example of *antarena* = *vinā* has been found in CST."}},{"id":"antam","lema":"antaṃ","cab":{"es":"**antaṃ**, (sc. *antar*) (adv., 7ª inflexión) Dentro, en, entre, adentro.","en":"**antaṃ**, (Skt. *antar*) (adv., 7th case) Within, in, among, inside."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"anto","lema":"anto","cab":{"es":"**anto**, (sc. *antar*) (adv., 7ª inflexión) Dentro, en, adentro.","en":"**anto**, (Skt. *antar*) (adv., 7th case) Within, in, inside."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"anto kaḷopiyā kummāsaṃ gahetvā pariyogā sūpaṃ gahetvā paribhuñjā","ref":"M. ii 242","es":"después de tomar arroz de dentro de la olla y salsa de la cacerola, coma.","en":"having taken gruel from inside the pot and sauce from the pan, eat."}],"notas":[],"avisos_en":["block 1: Spanish has 'arroz' (rice); the Pāḷi kummāsaṃ is gruel/junket (PED 'junket'), not rice (rice would be odana)."]},{"id":"aparajja","lema":"aparajja","cab":{"es":"**aparajja**, véase **aparajju**.","en":"**aparajja**, see **aparajju**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"aparajju","lema":"aparajju","cab":{"es":"**aparajju**, (sc. *apare-dyus*) (part. usada en la 7ª inflexión —tiempo) En el próximo día, en el día siguiente.","en":"**aparajju**, (Skt. *apare-dyus*) (particle used in the 7th case — time) On the next day, on the following day."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sāyaṃ vā nikkhamati aparajju vā kāle","ref":"S. i 187","es":"sale en la tarde o en el día siguiente.","en":"he goes out in the evening or at the (proper) time on the following day."}],"notas":[],"avisos_en":[]},{"id":"apacinam","lema":"apācīnaṃ","cab":{"es":"**apācīnaṃ**, (sc. *apācīna*) (part., usada en 7ª inflexión) En el oeste.","en":"**apācīnaṃ**, (Skt. *apācīna*) (particle, used in the 7th case) In the west."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"uddhaṃ tiriyaṃ apācīnaṃ, nandī tesaṃ na vijjati","ref":"S. ii 69","es":"","en":"above, across, and below: delight is not found in them."}],"notas":[],"avisos_en":["block 1: the Spanish translation ('es') is empty in the source; English supplied from the Pāḷi.","block 1 / cab: heading gives 'in the west', but in the formula uddhaṃ tiriyaṃ apācīnaṃ the word is usually explained as 'below' (DPD); I rendered 'below'. Uncertain which sense Nandisena intended here."]},{"id":"api","lema":"api","cab":{"es":"**api**, (= sc.) es uno de los 20 prefijos. Y; aun; y luego.","en":"**api**, (= Skt.) is one of the 20 prefixes. And; even; and then."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"n-apissu","lema":"apissu","nuevo":true,"cab":{"es":"**apissu**, (ind.) Y además, y también (*api* + *su*).","en":"**apissu**, (ind.) And moreover, and also (*api* + *su*)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Ampliación, adición (*anubrūhana*; según Sāratthadīpanī, *sampiṇḍana*):","en":"Amplification, addition (*anubrūhana*; according to Sāratthadīpanī, *sampiṇḍana*):"},{"tipo":"ej","pali":"apissu bhagavantaṃ imā anacchariyā gāthāyo paṭibhaṃsu pubbe assutapubbā","ref":"S. i 138","es":"Y además se le presentaron al Bhagavā estas estrofas maravillosas, nunca antes oídas.","en":"And moreover these marvellous verses, never heard before, occurred to the Blessed One."}],"notas":[],"fuente":{"es":"Comentario: SA. i 180 (P i 196), sobre este pasaje: «apissū ti anubrūhanatthe nipāto, so na kevalaṃ ayaṃ parivitakko udapādi, imāpi gāthā paṭibhaṃsūti dīpeti»; igual DA. ii 56 y MA. ii 81. Los tres glosan *anacchariyā* como «anuacchariyā» (maravillosas una tras otra). Sāratthadīpanī (Sārattha-ṭ. iii 153) sobre el mismo pasaje en Mahāvagga: «apissūti sampiṇḍanatthe nipāto. So na kevalaṃ etadahosi, imāpi gāthā paṭibhaṃsūti dīpeti»; igual Vimativinodanī ii 87. Sārattha-ṭ. iii 366 (sobre «apissu bhikkhū pakatā», Cūḷavagga, niyassakamma): «su-iti nipātamattaṃ». El mismo pasaje está en V. iii 5 (Vin i 5), que es el que comenta Sāratthadīpanī.","en":"Commentary: SA. i 180 (P i 196), on this passage: «apissū ti anubrūhanatthe nipāto, so na kevalaṃ ayaṃ parivitakko udapādi, imāpi gāthā paṭibhaṃsūti dīpeti»; likewise DA. ii 56 and MA. ii 81. All three gloss *anacchariyā* as «anuacchariyā» (marvellous one after another). Sāratthadīpanī (Sārattha-ṭ. iii 153) on the same passage in the Mahāvagga: «apissūti sampiṇḍanatthe nipāto. So na kevalaṃ etadahosi, imāpi gāthā paṭibhaṃsūti dīpeti»; likewise Vimativinodanī ii 87. Sārattha-ṭ. iii 366 (on «apissu bhikkhū pakatā», Cūḷavagga, niyassakamma): «su-iti nipātamattaṃ». The same passage occurs at V. iii 5 (Vin i 5), which is the one Sāratthadīpanī comments on."}},{"id":"api-ca","lema":"api ca","cab":{"es":"**api ca**, (= sc.) (adv.). Pero; además.","en":"**api ca**, (= Skt.) (adv.). But; moreover."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"api-ca-kho","lema":"api ca kho","cab":{"es":"**api ca kho**, (adv.) colección de partículas (*nipātasamudāya*) Sin embargo, no obstante; todavía, aún; además.","en":"**api ca kho**, (adv.) a collection of particles (*nipātasamudāya*) Nevertheless, however; still, yet; moreover."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"api-tu-khalu","lema":"api tu khalu","cab":{"es":"**api tu khalu**, (adv.) colección de partículas (*nipātasamudāya*) Pero; sin embargo.","en":"**api tu khalu**, (adv.) a collection of particles (*nipātasamudāya*) But; however."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"api-nama","lema":"api nāma","cab":{"es":"**api nāma**, (= sc.) (adv.). Tal vez.","en":"**api nāma**, (= Skt.) (adv.). Perhaps."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"api nāma tadā gaccheyyaṃ","ref":"JA. iii 452","es":"tal vez después (yo) iría.","en":"perhaps I might go then."}],"notas":[],"avisos_en":[]},{"id":"api-nu","lema":"api nu","cab":{"es":"**api nu**, (= sc.) (adv.) usado para expresar interrogación.","en":"**api nu**, (= Skt.) (adv.) used to express interrogation."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"api nu so puriso imaṃ mahāpathaviṃ apathaviṃ kareyya","ref":"M. i 179","es":"¿podría este hombre hacer la gran tierra sin tierra?","en":"could that man make this great earth into non-earth?"}],"notas":[],"avisos_en":[]},{"id":"api-nu-kho","lema":"api nu kho","cab":{"es":"**api nu kho**, (= sc.) (adv.) usado para expresar interrogación.","en":"**api nu kho**, (= Skt.) (adv.) used to express interrogation."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"api nu kho te āgacchanti mittāmaccā ñātisālohitā atithiyo","ref":"S. i 163","es":"¿amigos y compañeros, familiares y parientes, y huéspedes vienen a visitarte?","en":"do friends and colleagues, relatives and kinsmen, and guests come to you?"}],"notas":[],"avisos_en":[]},{"id":"app-eva","lema":"app eva","cab":{"es":"**app eva**, (sc. *api + eva*) (adv., duda = *saṃsaya*) Tal vez, acaso, quizá (quizás).","en":"**app eva**, (Skt. *api + eva*) (adv., doubt = *saṃsaya*) Perhaps, maybe, perchance, possibly."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"app eva maṃ bhagavā aṭṭhitaṃ ovadeyya","ref":"Sn. 438","es":"quizá el Sublime me exhortaría siempre.","en":"perhaps the Blessed One might exhort me constantly."}],"notas":[],"avisos_en":["block 1: meaning of aṭṭhitaṃ uncertain (followed the Spanish 'siempre'); not verified."]},{"id":"app-eva-nama","lema":"app eva nāma","cab":{"es":"**app eva nāma**, (sc. *api + eva + nāma*) (adv., duda = *saṃsaya*) Tal vez, acaso, quizá (quizás); sería bueno si.","en":"**app eva nāma**, (Skt. *api + eva + nāma*) (adv., doubt = *saṃsaya*) Perhaps, maybe, perchance, possibly; it would be good if."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"app eva nāma ahampi sakkuṇeyyaṃ acelaṃ pāthikaputtaṃ imaṃ parisaṃ ānetun","ref":"D. iii 16","es":"quizá yo pueda traer al asceta Pāthikaputta a esta congregación.","en":"perhaps I too might be able to bring the naked ascetic Pāthikaputta to this assembly."},{"tipo":"ej","pali":"app eva nāma kusalaṃ dhammaṃ adhigaccheyyaṃ","ref":"S. ii 518","es":"tal vez alcanzaría un estado sano.","en":"perhaps I might attain a wholesome state."}],"notas":[],"avisos_en":[]},{"id":"abhikkhanam","lema":"abhikkhaṇaṃ","cab":{"es":"**abhikkhaṇaṃ**, (sc. *abhīkṣṇam*) (part. usada en la 7ª inflexión —tiempo) Constantemente, repetidamente, frecuentemente.","en":"**abhikkhaṇaṃ**, (Skt. *abhīkṣṇam*) (particle used in the 7th case — time) Constantly, repeatedly, frequently."},"caso":["7"],"nir":"2","bloques":[{"tipo":"ej","pali":"tasmā tiha, bhikkhave, imaṃ kakacūpamaṃ ovādaṃ abhikkhaṇaṃ manasikarotha","ref":"M. i 181","es":"por lo tanto bhikkhus, debéis tener constantemente en mente este consejo del símil de la sierra.","en":"therefore, bhikkhus, you should constantly bear in mind this advice of the simile of the saw."}],"notas":[],"avisos_en":[]},{"id":"abhinham","lema":"abhiṇhaṃ","cab":{"es":"**abhiṇhaṃ**, (sc. *abhīkṣṇam*) (part. usada en la 7ª inflexión —tiempo) Constantemente, repetidamente, frecuentemente.","en":"**abhiṇhaṃ**, (Skt. *abhīkṣṇam*) (particle used in the 7th case — time) Constantly, repeatedly, frequently."},"caso":["7"],"nir":"2","bloques":[{"tipo":"ej","pali":"vajjī abhiṇhaṃ sannipātā sannipātabahulā","ref":"D. ii 62","es":"los Vajjīs se reúnen frecuentemente y tienen muchas juntas. En el texto original esto es una pregunta que el Buddha le hace al Venerable Ānanda.","en":"the Vajjīs meet frequently and hold many assemblies. In the original text this is a question that the Buddha puts to the Venerable Ānanda."}],"notas":[],"avisos_en":[]},{"id":"abhito","lema":"abhito","cab":{"es":"**abhito**, (sc. *abhitas*) (adv.,7ª inflexión) Alrededor, en ambos lados; cerca; en la presencia.","en":"**abhito**, (Skt. *abhitas*) (adv., 7th case) Around, on both sides; near; in the presence (of)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"bhattāyaṃ abhito rame","ref":"J. ii 91","es":"éste es mi esposo, soy feliz cerca de él.","en":"this is my husband; near him I delight."}],"notas":[],"avisos_en":[]},{"id":"ama","lema":"amā","cab":{"es":"**amā**, (= sc.) (adv., acción simultánea, asociación = *samakriyā*) Con, juntamente. Tiene el mismo significado que **saha**.","en":"**amā**, (= Skt.) (adv., simultaneous action, association = *samakriyā*) With, together. It has the same meaning as **saha**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sabbakiccesu amā vattatī ti amacco","ref":"DAA i 325","es":"un ministro es aquel que existe con todas las funciones.","en":"one who is engaged together (with the king) in all affairs is a minister."}],"notas":[],"avisos_en":[]},{"id":"n-amutra","lema":"amutra","nuevo":true,"cab":{"es":"**amutra**, (sc. *amutra*) (ind.) Allí, en tal lugar; en la otra existencia, en el más allá.","en":"**amutra**, (Skt. *amutra*) (ind.) There, in such a place; in the other existence, in the hereafter."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"En otra existencia (*bhavantara*):","en":"In another existence (*bhavantara*):"},{"tipo":"ej","pali":"so tato cuto amutra udapādiṃ","ref":"D. i 12","es":"fallecido de allí, surgí en tal otro lugar.","en":"passing away from there, I arose in such another place."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1148 («peccā’mutrabhavantare»); Abhidhānappadīpikāṭīkā v. 1148 (M 601): «Pecca amutrasaddā bhavantare»; Rūpasiddhi §266 *Tratha sattamiyā sabbanāmehi* (M 123): «… kattha, amutra amuttha». Gramaticalmente es *amu* + *tra* (Rūpasiddhi §266), un *vibhattipaccayanta*. Rūpasiddhi (vibhattippaccayavidhāna, M 120) dice de estas formas: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («por carecer de género y ser nipātas, su forma es la misma en los tres géneros y en ambos números»). En D. i 12 *amutra* significa sobre todo «en tal lugar» (en otra existencia del pasado).","en":"Abhidhānappadīpikā v. 1148; Abhidhānappadīpikāṭīkā v. 1148 (M 601): «Pecca amutrasaddā bhavantare»; Rūpasiddhi §266 *Tratha sattamiyā sabbanāmehi* (M 123): «… kattha, amutra amuttha». Grammatically it is *amu* + *tra* (Rūpasiddhi §266), a *vibhattipaccayanta*. Rūpasiddhi (vibhattippaccayavidhāna, M 120) says of these forms: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («because they are genderless and are nipātas, their form is the same in the three genders and both numbers»). At D. i 12 *amutra* means above all “in such a place” (in another, past existence)."}},{"id":"ambho","lema":"ambho","cab":{"es":"**ambho**, (sc. *ham + bhos*) (intj., voc., sg. y pl., m.) Hombre; ¡oh hombre! Partícula vocativa usada para dirigirse y llamar la atención. Normalmente usada para personas laicas. De acuerdo al Rū-ṭī. se usa para dirigirse a personas importantes. Muchas veces está seguida de *purisa*, hombre.","en":"**ambho**, (Skt. *ham + bhos*) (interj., voc., sg. and pl., m.) Man; O man! A vocative particle used to address someone and to attract attention. Normally used for lay people. According to the Rū-ṭī. it is used to address important people. It is often followed by *purisa*, man."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"ehi tvaṃ, ambho purisa","ref":"M. ii 326","es":"venga usted, buen hombre.","en":"come here, good man."}],"notas":[],"avisos_en":[]},{"id":"aram","lema":"araṃ","cab":{"es":"**araṃ**, (= sc.) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, deprisa, aprisa.","en":"**araṃ**, (= Skt.) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, swiftly, rapidly."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"are","lema":"are","cab":{"es":"**are**, (= sc.) (intj., voc., sg. y pl., m., coloquial) (Rū. 133). Partícula vocativa usada en lenguaje abusivo (*hiṃsālapana*).","en":"**are**, (= Skt.) (interj., voc., sg. and pl., m., colloquial) (Rū. 133). A vocative particle used in abusive language (*hiṃsālapana*)."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"are, duṭṭhadāsi","ref":"DhA. I 134","es":"¡eh esclava malvada!","en":"hey, you wicked slave-woman!"}],"notas":[],"avisos_en":[]},{"id":"alam","lema":"alaṃ","cab":{"es":"**alaṃ**, (sc. *alam*) (adv.) ¡Basta! ¡Suficiente! Adecuado, competente, capaz; decoración, ornamento. Existe en los siguientes significados:","en":"**alaṃ**, (Skt. *alam*) (adv.) Enough! Sufficient! Fit, competent, able; decoration, ornament. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Negación, prohibición (*paṭisedhana*):","en":"Negation, prohibition (*paṭisedhana*):"},{"tipo":"ej","pali":"alaṃ te idha vāsena","ref":"V. i 280","es":"¡Suficiente con tu vivir aquí! (= ¡márchate!)","en":"Enough of your living here! (= go away!)"},{"tipo":"txt","es":"Habilidad (*pariyatti*):","en":"Ability (*pariyatti*):"},{"tipo":"ej","pali":"alaṃ mallo mallassa","ref":"","es":"el luchador puede con el (otro) luchador (= es un digno rival.)","en":"a wrestler is a match for (another) wrestler (= he is a worthy rival)."},{"tipo":"txt","es":"Ornamento (*bhūsana*):","en":"Ornament (*bhūsana*):"},{"tipo":"ej","pali":"alaṅkato","ref":"","es":"decorado.","en":"adorned."}],"notas":[],"avisos_en":[]},{"id":"alikam","lema":"alikaṃ","cab":{"es":"**alikaṃ**, (sc. *alīkam*) expresa lo que no es verdadero (*asacca*). Falsedad; falso; mentira(s). Véase también **musā** y **micchā**.","en":"**alikaṃ**, (Skt. *alīkam*) expresses what is not true (*asacca*). Falsehood; false; lie(s). See also **musā** and **micchā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"alikaṃ bhāsati","ref":"","es":"habla mentiras.","en":"he speaks lies."},{"tipo":"ej","pali":"alikaṃ bhaṇaṃ","ref":"Dh. 51","es":"hablando falsedades.","en":"speaking falsehood."}],"notas":[],"avisos_en":[]},{"id":"assu","lema":"assu","cab":{"es":"**assu**, (sc. *s+su?, sma*). Expletivo (*padapūraṇa*).","en":"**assu**, (Skt. *s+su?, sma*). Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"assudam","lema":"assudaṃ","cab":{"es":"**assudaṃ**, expletivo.","en":"**assudaṃ**, expletive."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"n-aham","lema":"ahaṃ","nuevo":true,"cab":{"es":"**ahaṃ**, (part.) Mera partícula expletiva (*nipātamatta*), homófona del pronombre *ahaṃ* «yo».","en":"**ahaṃ**, (part.) A mere expletive particle (*nipātamatta*), homophonous with the pronoun *ahaṃ* “I”."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Como relleno métrico, según los comentarios:","en":"As a metrical filler, according to the commentaries:"},{"tipo":"ej","pali":"kaṇḍako sahajo ahaṃ","ref":"Vv. 110","es":"[yo era] Kaṇḍaka, nacido el mismo día [que el hijo de Suddhodana].","en":"[I was] Kaṇḍaka, born on the same day [as Suddhodana’s son]."},{"tipo":"ej","pali":"api cāhaṃ sīlarakkhāya, nibbāpetvāna mānasaṃ","ref":"Cp. 405","es":"pero, para proteger la virtud, apagando [la ira de] mi mente…","en":"but, to guard my virtue, quenching [the anger in] my mind…"}],"notas":[],"fuente":{"es":"Vimānavatthu-aṭṭhakathā (VvA. 297): «kaṇḍako sahajo ahan ti ettha ahan ti nipātamattaṃ. ‘ahū’ti keci paṭhanti»; también VvA. 196 («brāhmaṇassahan ti … ahan ti nipātamattaṃ»). Cariyāpiṭaka-aṭṭhakathā (CpA. 161): «api cāhan ti ettha ahan ti nipātamattaṃ»; CpA. 226: «dutiyañcettha ahan ti nipātamattaṃ daṭṭhabbaṃ». Bālāvatāra (M 130), lista de nipātas: «… huraṃ ahaṃ sahaṃ …». En la vutti de Kaccāyana §221, CST lee *abhaṃ* donde se esperaría *ahaṃ*: «vā vo haṃ abhaṃ alaṃ eva ho aho…» (p. 121). La clasificación como nipāta de los ejemplos es la de VvA y CpA; en estos versos la palabra podría entenderse también como el pronombre.","en":"Vimānavatthu-aṭṭhakathā (VvA. 297): «kaṇḍako sahajo ahan ti ettha ahan ti nipātamattaṃ. ‘ahū’ti keci paṭhanti»; also VvA. 196 («brāhmaṇassahan ti … ahan ti nipātamattaṃ»). Cariyāpiṭaka-aṭṭhakathā (CpA. 161): «api cāhan ti ettha ahan ti nipātamattaṃ»; CpA. 226: «dutiyañcettha ahan ti nipātamattaṃ daṭṭhabbaṃ». Bālāvatāra (M 130), list of nipātas: «… huraṃ ahaṃ sahaṃ …». In the vutti of Kaccāyana §221, CST reads *abhaṃ* where *ahaṃ* would be expected: «vā vo haṃ abhaṃ alaṃ eva ho aho…» (p. 121). The classification of the examples as nipāta is that of VvA and CpA; in these verses the word could also be understood as the pronoun."}},{"id":"ahe","lema":"ahe","cab":{"es":"**ahe**, part. vocativa usada para dirigirse a iguales (muy rara).","en":"**ahe**, vocative particle used to address equals (very rare)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"tāhaṃ bhadde vareyyāhe","ref":"D. ii 213","es":"¡oh buena mujer, yo te deseo a ti!","en":"O good lady, I would choose you!"}],"notas":[],"avisos_en":["block 1: Spanish 'yo te deseo a ti' (I desire you); vareyyaṃ is 'I would choose / ask for (in marriage)'. Close in sense."]},{"id":"aho","lema":"aho","cab":{"es":"**aho**, (= sc.) (intj.) Exclamación de reproche (*garaha*), elogio (*pasaṃsana*), aspiración (*patthana*) y sorpresa. ¡Oh! ¡Ah!","en":"**aho**, (= Skt.) (interj.) Exclamation of reproach (*garaha*), praise (*pasaṃsana*), aspiration (*patthana*) and surprise. Oh! Ah!"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Reproche, censura (*garaha*):","en":"Reproach, censure (*garaha*):"},{"tipo":"ej","pali":"aho vata re amhākaṃ paṇḍitaka [^6]","ref":"D. i 100","es":"¡oh nuestro pedante!","en":"oh, our pedant!"},{"tipo":"txt","es":"Elogio (*pasaṃsana*):","en":"Praise (*pasaṃsana*):"},{"tipo":"ej","pali":"aho buddho, aho dhammo, aho saṃgho","ref":"DA. ii 230","es":"¡Oh Buddha! ¡Oh Dhamma! ¡Oh Sangha!","en":"Oh, the Buddha! Oh, the Dhamma! Oh, the Sangha!"},{"tipo":"txt","es":"Aspiración, deseo (*patthanā*):","en":"Aspiration, wish (*patthanā*):"},{"tipo":"ej","pali":"aho vatāyaṃ brāhmaṇo maṇiṃ na gaṇheyya","ref":"DhA. ii 435","es":"¡oh, que este brahmán no tome la joya!","en":"Oh, if only this brahmin would not take the jewel!"},{"tipo":"txt","es":"Sorpresa:","en":"Surprise:"},{"tipo":"ej","pali":"aho parittaṃ, bhante, sattānaṃ jīvitaṃ","ref":"DhA. i 231","es":"¡Oh, Venerable Señor, la vida de los seres es corta!","en":"Oh, Venerable Sir, how short is the life of beings!"}],"notas":[{"n":"6","es":"El comentario (D.A. i 247) indica que **aho vata** es una expresión de reproche; **re** una partícula vocativa para dirigirse en forma despectiva y **paṇḍitaka** expresa disgusto. A la voz *paṇḍita*, sabio, cuando se le coloca el sufijo “ka”, significa pedante.","en":"The commentary (D.A. i 247) indicates that **aho vata** is an expression of reproach; **re** is a vocative particle for addressing someone contemptuously; and **paṇḍitaka** expresses displeasure. When the suffix “ka” is added to the word *paṇḍita*, wise, it means pedant."}],"avisos_en":["block 2: kept the footnote marker [^6] and the reference '(D. i 100)' that the source places inside the translation field (ref is empty)."]},{"id":"n-a","lema":"ā","nuevo":true,"cab":{"es":"**ā**, (part.) Mera partícula (*nipātamatta*) de relleno (*padapūraṇa*), sin significado propio.","en":"**ā**, (part.) A mere particle (*nipātamatta*) used as a verse-filler (*padapūraṇa*), without meaning of its own."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Según el análisis de Saddanīti (*yad ā naṃ* = *yaṃ ā naṃ*):","en":"According to Saddanīti's analysis (*yad ā naṃ* = *yaṃ ā naṃ*):"},{"tipo":"ej","pali":"yadā naṃ maññati bālo, bhayā myāyaṃ titikkhati","ref":"S. i 223","es":"porque (*yaṃ* = *yasmā*) el necio piensa de él: «éste me soporta por miedo».","en":"since (*yaṃ* = *yasmā*) the fool thinks of him: “he puts up with me out of fear.”"}],"notas":[],"fuente":{"es":"Saddanīti, Suttamālā XXVII, lista de *padapūraṇa* «… seyyathīdaṃ ā naṃ taṃ», y comentario al verso: «yadānaṃmaññatī ti yaṃ ā naṃ maññatī ti padacchedo, ā ti nipātamattaṃ, yasmā taṃ maññatī ti attho; ettha ca yadi āsaddo upasaggo bhaveyya, dhātuto pubbo siyā» (Suttamālā, ed. Smith, pp. 890–891). CST lee «yadā naṃ» (S. i 223, 225). SA. i 313 (P i 343) glosa «yadā naṃ maññatī ti yasmā taṃ maññati», y SṬ. i 333 precisa «yadāsaddo hetuattho na kālattho»: el comentario da el mismo sentido causal, pero sin segmentar *yaṃ ā*. La segmentación *yaṃ ā naṃ* es exclusiva de Saddanīti.","en":"Saddanīti, Suttamālā XXVII, *padapūraṇa* list «… seyyathīdaṃ ā naṃ taṃ», and its comment on the verse: «yadānaṃmaññatī ti yaṃ ā naṃ maññatī ti padacchedo, ā ti nipātamattaṃ, yasmā taṃ maññatī ti attho; ettha ca yadi āsaddo upasaggo bhaveyya, dhātuto pubbo siyā» (Suttamālā, Smith ed., pp. 890–891). CST reads «yadā naṃ» (S. i 223, 225). SA. i 313 (P i 343) glosses «yadā naṃ maññatī ti yasmā taṃ maññati», and SṬ. i 333 specifies «yadāsaddo hetuattho na kālattho»: the commentary gives the same causal sense, but without segmenting *yaṃ ā*. The segmentation *yaṃ ā naṃ* is peculiar to Saddanīti."}},{"id":"anam","lema":"ānaṃ","cab":{"es":"**ānaṃ**, Expletivo (*padapūraṇa*).","en":"**ānaṃ**, Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"ama-2","lema":"āma","cab":{"es":"**āma**, (sc. *am*) Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien.","en":"**āma**, (Skt. *am*) Particle of assent; affirmative answer; acceptance (*sampaṭicchana*). Yes; good; all right."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"āma bhante","ref":"V. i 111","es":"sí, Venerable Señor.","en":"yes, Venerable Sir."}],"notas":[],"avisos_en":[]},{"id":"amo","lema":"āmo","cab":{"es":"**āmo**, Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien.","en":"**āmo**, Particle of assent; affirmative answer; acceptance (*sampaṭicchana*). Yes; good; all right."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"āmo ti so paṭissutvā, mādharo suvapaṇḍito","ref":"JA. vi 264","es":"después de consentir, el loro Mādhara dijo “sí”.","en":"having assented with “yes”, Mādhara, the wise parrot, …"}],"notas":[],"avisos_en":[]},{"id":"ayati","lema":"āyati","cab":{"es":"**āyati** (ṃ), (sc. *āyati*) (part. usada en la 7ª inflexión —tiempo) Futuro; en el futuro; en tiempo futuro (*anāgate kāle*).","en":"**āyati** (ṃ), (Skt. *āyati*) (particle used in the 7th case — time) Future; in the future; in future time (*anāgate kāle*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"āyatiṃ saṃvarāya","ref":"D. i 80","es":"para la contención en el futuro.","en":"for restraint in the future."},{"tipo":"ej","pali":"tathāgatassa kho, sīha, āyatiṃ gabbhaseyyā punabbhavābhinibbatti pahīnā","ref":"V. iii 332","es":"Sīha, reconexión en el futuro, nueva existencia, ha sido extinguida por el Tathāgata.","en":"Sīha, for the Tathāgata, future lying in a womb, the production of renewed existence, has been abandoned."},{"tipo":"ej","pali":"āyatibhavo","ref":"","es":"existencia futura.","en":"future existence."}],"notas":[],"avisos_en":["block 2: Spanish 'reconexión' (rebirth-linking) for gabbhaseyyā, literally 'lying in a womb'; English follows the Pāḷi."]},{"id":"araka","lema":"ārakā","cab":{"es":"**ārakā**, (sc. *ārakāt*) (part. usada en la 7ª inflexión) Lejos (dūre); lejano; distante; separado; remoto.","en":"**ārakā**, (Skt. *ārakāt*) (particle used in the 7th case) Far (dūre); far-off; distant; separated; remote."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ārakā udakā","ref":"M. i 307","es":"lejos del agua.","en":"far from the water."}],"notas":[],"avisos_en":[]},{"id":"ara","lema":"ārā","cab":{"es":"**ārā**, (sc. *ārāt*) (part. usada en la 7ª inflexión) Lejos (dūre); lejano; distante; separado; remoto.","en":"**ārā**, (Skt. *ārāt*) (particle used in the 7th case) Far (dūre); far-off; distant; separated; remote."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ārā so āsavakkhayā","ref":"Dh. 49","es":"él está lejos de la extinción de los contaminantes.","en":"he is far from the destruction of the taints."}],"notas":[],"avisos_en":[]},{"id":"avi","lema":"āvi","cab":{"es":"**āvi**, (sc. *āviḥ*) (part..usada en 7ª inflexión) Abierto; claro; manifiesto; a la vista; presente; en público; en frente de los ojos. Es opuesto de **raho**.","en":"**āvi**, (Skt. *āviḥ*) (particle used in the 7th case) Open; clear; manifest; in view; present; in public; before the eyes. It is the opposite of **raho**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"āvi c' eva raho ca","ref":"D. ii 67","es":"en público y en privado.","en":"both in public and in private."},{"tipo":"ej","pali":"āvikaroti","ref":"","es":"hace manifiesto.","en":"makes manifest."}],"notas":[],"avisos_en":[]},{"id":"avuso","lema":"āvuso","cab":{"es":"**āvuso**, (sc. contracción de *āyusmanto*?) (part. voc., sg. y pl., m.) ¡Amigo! ¡Señor! ¡Hermano! Partícula vocativa singular y plural usada por un monje para dirigirse a otros monjes de igual o inferior rango, a monjes en general, y a personas laicas. Durante la época del Buddha este término parece haber sido usado entre los bhikkhus para dirigirse unos a otros sin consideración de la antigüedad. Sin embargo, poco antes de morir el Buddha da instrucciones al Venerable Ānanda que después de su muerte los bhikkhus más antiguos deberán dirigirse a los más jóvenes por nombre, por el nombre de familia o mediante el término **āvuso**, mientras que los bhikkhus más jóvenes deberán dirigirse a los más antiguos mediante el término **bhante**. Véase D. ii 127.","en":"**āvuso**, (Skt. contraction of *āyusmanto*?) (voc. particle, sg. and pl., m.) Friend! Sir! Brother! A singular and plural vocative particle used by a monk to address other monks of equal or lower rank, monks in general, and lay people. During the time of the Buddha this term seems to have been used among bhikkhus to address one another regardless of seniority. However, shortly before his death the Buddha instructs the Venerable Ānanda that after his death the senior bhikkhus should address the junior ones by name, by clan name, or with the term **āvuso**, while the junior bhikkhus should address the senior ones with the term **bhante**. See D. ii 127."},"caso":["1v"],"nir":"","bloques":[{"tipo":"txt","es":"Para dirigirse a un monje de menor antigüedad.","en":"To address a monk of lesser seniority."},{"tipo":"ej","pali":"gacch’ āvuso ānanda, kusināraṃ","ref":"D. ii 130","es":"ve amigo Ānanda a Kusināra. En este ejemplo, el Venerable Anuruddha se dirige al Venerable Ānanda.","en":"go, friend Ānanda, to Kusinārā. In this example, the Venerable Anuruddha addresses the Venerable Ānanda."},{"tipo":"txt","es":"Para dirigirse a varios monjes de menor antigüedad.","en":"To address several monks of lesser seniority."},{"tipo":"ej","pali":"alaṃ āvuso mā socittha mā paridevittha","ref":"D. ii 129","es":"¡suficiente amigos, no os apesadumbréis, no os lamentéis! (Aquí el Venerable Anuruddha se dirige a los bhikkhus).","en":"enough, friends! Do not grieve, do not lament! (Here the Venerable Anuruddha addresses the bhikkhus.)"},{"tipo":"txt","es":"Para dirigirse a un asceta de otra orden.","en":"To address an ascetic of another order."},{"tipo":"ej","pali":"ap’ āvuso, amhākaṃ satthāraṃ jānāsi","ref":"D. ii 133","es":"¿amigo, conoces a nuestro maestro? Aquí el Venerable Mahākassapa se dirige a un asceta.","en":"friend, do you know our teacher? Here the Venerable Mahākassapa addresses an ascetic."},{"tipo":"txt","es":"Para dirigirse a una persona laica.","en":"To address a lay person."},{"tipo":"ej","pali":"āyāmi āvuso, āyāmi āvuso","ref":"D. iii 15","es":"voy amigo, voy amigo. En este caso, un asceta de nombre Pāthikaputta se dirige a una persona laica que lo ha ido a buscar.","en":"I'm coming, friend, I'm coming, friend. In this case, an ascetic named Pāthikaputta addresses a lay person who has gone to fetch him."}],"notas":[],"avisos_en":[]},{"id":"asum","lema":"āsuṃ","cab":{"es":"**āsuṃ**, (sc. *āśum*) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, de prisa, aprisa.","en":"**āsuṃ**, (Skt. *āśum*) (adv.) In the sense of quick (*sīghattha*). Quic
