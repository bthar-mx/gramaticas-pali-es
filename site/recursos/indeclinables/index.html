ear! A familiar term for addressing friends, equals and inferiors."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"ehi tvaṃ samma vissakamma","ref":"D. ii 148","es":"venga amigo Vissakamma.","en":"Come, friend Vissakamma."},{"tipo":"ej","pali":"ajjatagge, samma dovārika, āvarāmi dvāraṃ nigaṇṭhānaṃ nigaṇṭhīnaṃ","ref":"M. ii 43","es":"Buen portero, a partir de hoy, cierro la puerta a los Nigaṇṭhas y las Nigaṇṭhīs. Aquí **samma** es usado por un superior a un inferior.","en":"From today on, good doorkeeper, I close the door to the Nigaṇṭhas and the Nigaṇṭhīs. Here **samma** is used by a superior to an inferior."}],"notas":[],"avisos_en":[]},{"id":"samma-2","lema":"sammā","cab":{"es":"**sammā**,<sup>1<\/sup> (sc. *śam*) (part. voc., pl.) ¡Amigos! ¡Queridos! Término familiar para dirigirse a amigos, iguales e inferiores.","en":"**sammā**,<sup>1<\/sup> (Skt. *śam*) (particle, voc., pl.) Friends! Dear ones! A familiar term for addressing friends, equals and inferiors."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"sammā mayaṃ aññaṃ kiñci na karissāma","ref":"DhA. i 287","es":"amigos, nosotros no haremos ninguna otra cosa.","en":"Friends, we will not do anything else."}],"notas":[],"avisos_en":[]},{"id":"samma-3","lema":"sammā","cab":{"es":"**sammā**,<sup>2<\/sup> (sc. *samyak*) (part. 3ª inflexión) correctamente; propiamente; adecuadamente; debidamente; completamente; claramente.","en":"**sammā**,<sup>2<\/sup> (Skt. *samyak*) (particle, 3rd case) correctly; properly; fittingly; duly; completely; clearly."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"sammā-sam-buddho","ref":"D. ii 2","es":"el completamente Iluminado. Aquí **sammā** significa correctamente (*aviparītena*) y **sam**, por sí mismo (*attanā*).","en":"the Rightly Self-Awakened One. Here **sammā** means correctly (*aviparītena*) and **sam**, by oneself (*attanā*)."},{"tipo":"ej","pali":"sammā dhammaṃ vipassato","ref":"Dh. 67","es":"de aquel que penetra el dhamma claramente.","en":"Of one who rightly sees the Dhamma with insight."}],"notas":[],"avisos_en":["block 0: reference (D. ii 2) sits inside the Spanish text (ref field empty); kept in the English. Rendering as in entry 'sam'."]},{"id":"sammukha","lema":"sammukhā","cab":{"es":"**sammukhā**, (= sc.) (part. 7ª inflexión) Cara a cara; de frente; en la presencia.","en":"**sammukhā**, (= Skt.) (particle, 7th case) Face to face; in front; in the presence."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sammukhā m’ etaṃ, bhante, bhagavato sutaṃ","ref":"D. ii 96","es":"Venerable Señor he oído esto en la presencia del Sublime (lit. cara a cara).","en":"Venerable Sir, I heard this in the presence of the Blessed One (lit. face to face)."}],"notas":[],"avisos_en":[]},{"id":"sayam","lema":"sayaṃ","cab":{"es":"**sayaṃ**, (sc. *svayaṃ*) (adv., part. 3ª inflexión) Uno mismo; por uno mismo. También **sāmaṃ**.","en":"**sayaṃ**, (Skt. *svayaṃ*) (adv., particle, 3rd case) Oneself; by oneself. Also **sāmaṃ**."},"caso":["3"],"nir":"1·3","bloques":[{"tipo":"ej","pali":"sayaṃ abhiññāya kam uddiseyyaṃ","ref":"M. i 227","es":"habiendo realizado por mí mismo, ¿a quién señalaría (como mi maestro)?.","en":"Having directly known [it] by myself, whom should I point to [as my teacher]?"}],"notas":[],"avisos_en":[]},{"id":"sasakkam","lema":"sasakkaṃ","cab":{"es":"**sasakkaṃ**, (sc. *sa + sakkaṃ*) (adv.) Ciertamente, realmente, verdaderamente, evidentemente, definitivamente; en el significado de definitivo, certeza (*ekaṃsattha*).","en":"**sasakkaṃ**, (Skt. *sa + sakkaṃ*) (adv.) Certainly, really, truly, evidently, definitely; in the sense of definiteness, certainty (*ekaṃsattha*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"evarūpaṃ te, rāhula, kāyena kammaṃ sasakkaṃ na karaṇīyaṃ","ref":"M. ii 79","es":"ciertamente Rāhula, tú no debes realizar este tipo de acción corporal.","en":"Certainly, Rāhula, you should not do a bodily action of such a kind."}],"notas":[],"avisos_en":[]},{"id":"saha","lema":"saha","cab":{"es":"**saha**, (= sc.) (prep., part. 3ª inflexión) Con, junto a. Puede formar la primera parte de un compuesto. Existe en los siguientes significados:","en":"**saha**, (= Skt.) (prep., particle, 3rd case) With, together with. It can form the first member of a compound. It is used in the following senses:"},"caso":["3"],"nir":"","bloques":[{"tipo":"txt","es":"Acción simultánea (*samakriyā*):","en":"Simultaneous action (*samakriyā*):"},{"tipo":"ej","pali":"puttena saha āgato","ref":"","es":"ha venido con su hijo.","en":"He has come with his son."},{"tipo":"txt","es":"Dotado con (*sampanna*):","en":"Endowed with (*sampanna*):"},{"tipo":"ej","pali":"saha vatthehi sobhati","ref":"T. i 325","es":"resplandece con los atuendos.","en":"It shines with [its] garments."},{"tipo":"txt","es":"En el sentido de la tercera inflexión:","en":"In the sense of the third case:"},{"tipo":"ej","pali":"saṃgho saha vā gaggena vinā vā gaggena uposathaṃ karissati","ref":"V. iii 166","es":"La Orden hará Uposatha con Gagga o sin Gagga.","en":"The Order will hold the Uposatha with Gagga or without Gagga."},{"tipo":"txt","es":"En forma abreviada como primera parte de un compuesto:","en":"In abbreviated form as the first member of a compound:"},{"tipo":"ej","pali":"saphala","ref":"","es":"con fruto; fructífero. Aquí **saha** está presente en su forma abreviada **sa**.","en":"With fruit; fruitful. Here **saha** is present in its abbreviated form **sa**."},{"tipo":"ej","pali":"sahaseyyā","ref":"","es":"compartiendo el cuarto.","en":"Sharing a sleeping place."}],"notas":[],"avisos_en":[]},{"id":"sadhu","lema":"sādhu","cab":{"es":"**sādhu**, (= sc.) Bien; muy bien; excelente; sí; está bien; sería bueno. Existe en los siguientes significados:","en":"**sādhu**, (= Skt.) Good; very good; excellent; yes; all right; it would be good. It is used in the following senses:"},"caso":[],"nir":"1","bloques":[{"tipo":"txt","es":"Asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*):","en":"Assent; affirmative reply; acceptance (*sampaṭicchana*):"},{"tipo":"ej","pali":"sādhū ti vatvāna pahūtakāmo, pakkāmi yakkho vidhurena saddhiṃ","ref":"J. ii 288","es":"habiendo dicho “sí”, el Yakkha, deseoso de abundancia, se marchó con Vidhura.","en":"Having said “Very well”, the yakkha, rich in sense pleasures, departed together with Vidhura."},{"tipo":"txt","es":"Elogio (*pasaṃsana*):","en":"Praise (*pasaṃsana*):"},{"tipo":"ej","pali":"sādhu sādhu, sāriputta","ref":"D. iii 226","es":"¡muy bien, muy bien, Sāriputta!","en":"Excellent, excellent, Sāriputta!"},{"tipo":"txt","es":"Petición, solicitud (*yācana*):","en":"Request, entreaty (*yācana*):"},{"tipo":"ej","pali":"sādhu me, bhante, bhagavā saṃkhittena dhammaṃ desetu","ref":"S. ii 61","es":"Venerable Señor, sería bueno que el Sublime me enseñe el Dhamma en breve.","en":"Venerable Sir, it would be good if the Blessed One would teach me the Dhamma in brief."},{"tipo":"txt","es":"Regocijo; apreciación (*anumodana*):","en":"Rejoicing; appreciation (*anumodana*):"},{"tipo":"ej","pali":"sādhu te kataṃ","ref":"DhA. ii 195","es":"bien hecho por ti [has hecho bien].","en":"Well done by you [you have done well]."}],"notas":[],"avisos_en":["block 1: *pahūtakāmo* — Spanish «deseoso de abundancia» ('desirous of abundance'); I take it as 'having abundant sense pleasures/wealth' (bahuvrīhi); uncertain."]},{"id":"samam-2","lema":"sāmaṃ","cab":{"es":"**sāmaṃ**, (adv., part. 3ª inflexión) Uno mismo; por uno mismo. Véase **sayaṃ**.","en":"**sāmaṃ**, (adv., particle, 3rd case) Oneself; by oneself. See **sayaṃ**."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"sāmaṃ saccāni abhisambujjhi","ref":"Ps. 172","es":"descubrió las verdades por sí mismo.","en":"He fully awakened to the truths by himself."}],"notas":[],"avisos_en":[]},{"id":"samanta-2","lema":"sāmantā","cab":{"es":"**sāmantā**, (sc. *samanta*) (part. usada en la 7ª inflexión) En todas partes (*samantato*); todo alrededor; en todos los lados; cerca. Véase **samantā** y **parito**.","en":"**sāmantā**, (Skt. *samanta*) (particle used in the 7th case) Everywhere (*samantato*); all around; on all sides; near. See **samantā** and **parito**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"assamassa sāmantā ekarattiṃ vasitvā pakkāmi","ref":"D. ii 270","es":"después de residir por una noche cerca de la morada del ermitaño se marchó.","en":"Having stayed one night near the hermitage, he departed."}],"notas":[],"avisos_en":[]},{"id":"sayam-2","lema":"sāyaṃ","cab":{"es":"**sāyaṃ** (= sc.) (part. usada en la 7ª inflexión —tiempo) Atardecer; en el atardecer (*atthaṅgatasamaye*).","en":"**sāyaṃ** (= Skt.) (particle used in the 7th case — time) Evening; in the evening (*atthaṅgatasamaye*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pāto anusiṭṭho sāyaṃ visesaṃ adhigamissati","ref":"M. ii 300","es":"instruido en el amanecer obtendrá distinción en el atardecer.","en":"Instructed in the morning, he will attain distinction in the evening."}],"notas":[],"avisos_en":[]},{"id":"sahu","lema":"sāhu","cab":{"es":"**sāhu**, (sc. de *sādhu*) Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien. Véase **sādhu**.","en":"**sāhu**, (Skt. from *sādhu*) Particle of assent; affirmative reply; acceptance (*sampaṭicchana*). Yes; good; all right. See **sādhu**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sāhū ti","ref":"V. iii 57","es":"sí.","en":"“Yes.”"}],"notas":[],"avisos_en":["block 0: reference (V. iii 57) sits inside the Spanish text (ref field empty); kept in the English."]},{"id":"n-siya","lema":"siyā","nuevo":true,"cab":{"es":"**siyā**, (part. con forma de verbo, *ākhyātapaṭirūpaka*) Quizá, puede que; a veces (*kadāci*). Las ṭīkās lo tratan como nipāta equivalente a *appeva* o *kadāci*.","en":"**siyā**, (part. in verbal form, *ākhyātapaṭirūpaka*) Perhaps, it may be that; sometimes (*kadāci*). The ṭīkās treat it as a nipāta equivalent to *appeva* or *kadāci*."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Posibilidad (= *appeva*, *kadāci*):","en":"Possibility (= *appeva*, *kadāci*):"},{"tipo":"ej","pali":"siyā kho pana te, brāhmaṇa, evamassa: ‘ajjāpi nūna samaṇo gotamo avītarāgo avītadoso avītamoho, tasmā araññavanapatthāni pantāni senāsanāni paṭisevatī’ti","ref":"M. i 28","es":"Quizá, brahmán, pienses así: «Seguramente el asceta Gotama todavía no está libre de apego, de aversión ni de ofuscación, y por eso frecuenta moradas remotas en la selva y el bosque».","en":"Perhaps, brahmin, you might think thus: “Surely the ascetic Gotama is even now not free from lust, hate and delusion, and that is why he resorts to remote forest and jungle lodgings.”"}],"notas":[],"fuente":{"es":"Papañcasūdanī (MA. i 132): «siyā kho pana te brāhmaṇa evamassā ti brāhmaṇa kadāci tuyhaṃ evaṃ bhaveyya». Ṭīkā (MṬ, M i 228): «siyā kho pana te brāhmaṇā ti ettha siyā ti ‘appevā’ti iminā samānattho nipāto … yaṃ pana aṭṭhakathāyaṃ ‘kadācī’ti vuttaṃ, tampi imamevatthaṃ sandhāya». Kaṅkhāvitaraṇī-purāṇaṭīkā (p. 188): «‘siyā karontassā’ti-ādīsu siyā ti ‘siyā kho pana te brāhmaṇa evamassā’ti-ādīsu viya ‘kadācī’ti iminā samānattho nipāto». Niruttidīpanī (p. 155): con 1.ª elidida. Morfológicamente es el optativo 3.ª sg. de *atthi*; solo en el uso adverbial («quizá», «a veces», p. ej. «siyā karontassa, siyā akarontassa» del Vinaya) lo tratan las ṭīkās como nipāta.","en":"Papañcasūdanī (MA. i 132): «siyā kho pana te brāhmaṇa evamassā ti brāhmaṇa kadāci tuyhaṃ evaṃ bhaveyya». Ṭīkā (MṬ, M i 228): «siyā kho pana te brāhmaṇā ti ettha siyā ti ‘appevā’ti iminā samānattho nipāto … yaṃ pana aṭṭhakathāyaṃ ‘kadācī’ti vuttaṃ, tampi imamevatthaṃ sandhāya». Kaṅkhāvitaraṇī-purāṇaṭīkā (p. 188): «‘siyā karontassā’ti-ādīsu siyā ti ‘siyā kho pana te brāhmaṇa evamassā’ti-ādīsu viya ‘kadācī’ti iminā samānattho nipāto». Niruttidīpanī (p. 155): with the 1st case elided. Morphologically it is the optative 3rd sg. of *atthi*; only in the adverbial use (“perhaps”, “sometimes”, e.g. «siyā karontassa, siyā akarontassa» in the Vinaya) do the ṭīkās treat it as a nipāta."}},{"id":"n-siyum","lema":"siyuṃ","nuevo":true,"cab":{"es":"**siyuṃ**, (part. con forma de verbo, *ākhyātapaṭirūpaka*) Habría, existirían. Niruttidīpanī lo incluye con *siyā* entre las palabras tras las cuales se elide la 1.ª.","en":"**siyuṃ**, (part. in verbal form, *ākhyātapaṭirūpaka*) There would be, they would exist. Niruttidīpanī lists it with *siyā* among the words after which the 1st case ending is elided."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"kiṃ kayirā udapānena, āpā ce sabbadā siyuṃ","ref":"Ud. 176","es":"¿Qué haría uno con un pozo si hubiera agua en todo tiempo?","en":"What would one do with a well if there were water at all times?"}],"notas":[],"fuente":{"es":"Niruttidīpanī (p. 155): «atthi natthi sakkā labbhā siyā siyuṃ sādhu tuṇhī iccādīhi ca paṭhamāya lopo». En el ejemplo, y en todos los casos hallados en CST, *siyuṃ* es simplemente el optativo 3.ª pl. de *atthi*, con sujeto plural; ningún comentario hallado lo llama nipāta, y su condición de tal descansa solo en Niruttidīpanī. En M. iii 27 CST lee *siyaṃsu*, con la variante *siyuṃ* y la nota «saddanīti oloketabbā».","en":"Niruttidīpanī (p. 155): «atthi natthi sakkā labbhā siyā siyuṃ sādhu tuṇhī iccādīhi ca paṭhamāya lopo». In the example, and in every case found in CST, *siyuṃ* is simply the optative 3rd pl. of *atthi*, with a plural subject; no commentary found calls it a nipāta, and its status as one rests solely on the Niruttidīpanī. At M. iii 27 CST reads *siyaṃsu*, with the variant *siyuṃ* and the note «saddanīti oloketabbā»."}},{"id":"su","lema":"su","cab":{"es":"**su**, prefijo usado en el significado de rápido (*sīgha*). También usado como mera partícula (*nipātamatta*) o expletivo (*padapūraṇa*).","en":"**su**, prefix used in the sense of quick (*sīgha*). Also used as a mere particle (*nipātamatta*) or expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"sutthu","lema":"suṭṭhu","cab":{"es":"**suṭṭhu**, (sc. *suṣṭhu*) Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*) y para expresar regocijo. Sí; bien; muy bien; ¡qué bien!; está bien.","en":"**suṭṭhu**, (Skt. *suṣṭhu*) Particle of assent; affirmative reply; acceptance (*sampaṭicchana*), and for expressing rejoicing. Yes; good; very good; how good!; all right."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*):","en":"Assent; affirmative reply; acceptance (*sampaṭicchana*):"},{"tipo":"ej","pali":"sādhu suṭṭhu saṃvarissāmi","ref":"VA. iii 345","es":"bien, muy bien, me contendré.","en":"Good, very well, I will restrain myself."},{"tipo":"txt","es":"Regocijo; apreciación (*anumodana*):","en":"Rejoicing; appreciation (*anumodana*):"},{"tipo":"ej","pali":"sādhu suṭṭhū ti","ref":"DA. iii 182","es":"¡bien, muy bien!","en":"“Good, very good!”"}],"notas":[],"avisos_en":[]},{"id":"sudam","lema":"sudaṃ","cab":{"es":"**sudaṃ**, (sc. *svid*) (part.) Expletivo (*padapūraṇa*).","en":"**sudaṃ**, (Skt. *svid*) (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"suvatthi","lema":"suvatthi","cab":{"es":"**suvatthi**, (sc. *svasti*) part. usada para expresar un deseo, aspiración o bendición (*āsīsanattha*). Bienestar; felicidad. Véase **sotthi**.","en":"**suvatthi**, (Skt. *svasti*) particle used to express a wish, aspiration or blessing (*āsīsanattha*). Well-being; happiness. See **sotthi**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"etena saccena suvatthi hotu","ref":"Khp. 5","es":"por esta verdad que haya felicidad.","en":"By this truth may there be well-being."}],"notas":[],"avisos_en":[]},{"id":"suve","lema":"suve","cab":{"es":"**suve**, (sc. *śvas*) (part. usada en la 7ª inflexión —tiempo) Mañana. Véase **sve**.","en":"**suve**, (Skt. *śvas*) (particle used in the 7th case — time) Tomorrow. See **sve**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"ko jaññā maraṇaṃ suve","ref":"M. iii 226","es":"mañana la muerte, ¿quién sabe?","en":"Who knows whether death [will come] tomorrow?"}],"notas":[],"avisos_en":[]},{"id":"n-se","lema":"se","nuevo":true,"cab":{"es":"**se**, (part.) Partícula expletiva, en verso (*gatā se*).","en":"**se**, (part.) Expletive particle, in verse (*gatā se*)."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Mero nipāta (*nipātamatta*):","en":"Mere particle (*nipātamatta*):"},{"tipo":"ej","pali":"ye keci buddhaṃ saraṇaṃ gatāse, na te gamissanti apāyabhūmiṃ; pahāya mānusaṃ dehaṃ, devakāyaṃ paripūressanti","ref":"D. ii 204","es":"Quienes han ido al Buddha como refugio no irán a un estado de privación; abandonando el cuerpo humano, llenarán las filas de los devas.","en":"Those who have gone to the Buddha for refuge will not go to a state of deprivation; having left the human body, they will fill the ranks of the devas."}],"notas":[],"fuente":{"es":"Comentario: Sīl-abhinavaṭ. ii 185 (citando esta estrofa): «gatā seti ettha se-iti nipātamattaṃ». Lingüísticamente *gatāse* es nominativo plural en *-āse* (arcaico); la ṭīkā lo segmenta *gatā* + *se*. *se* es también pronombre (= *tassa*/*so*); solo en este uso lo trata la ṭīkā como nipāta.","en":"Commentary: Sīl-abhinavaṭ. ii 185 (quoting this verse): «gatā seti ettha se-iti nipātamattaṃ». Linguistically *gatāse* is a nominative plural in *-āse* (archaic); the ṭīkā segments it as *gatā* + *se*. *se* is also a pronoun (= *tassa*/*so*); only in this use does the ṭīkā treat it as a nipāta."}},{"id":"seyyatha-pi","lema":"seyyathā pi","cab":{"es":"**seyyathā pi**, (sc. *taṃ + yathā*) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera.","en":"**seyyathā pi**, (Skt. *taṃ + yathā*) It is used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"seyyathā pi, bhikkhave, mahārukkho","ref":"S. i 314","es":"bhikkhus, así como un gran árbol.","en":"Just as, bhikkhus, a great tree…"}],"notas":[],"avisos_en":[]},{"id":"seyyatha-pi-nama","lema":"seyyathā pi nāma","cab":{"es":"**seyyathā pi nāma**, Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera.","en":"**seyyathā pi nāma**, It is used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"seyyathā pi nāma balavā puriso samiñjitaṃ vā bāhaṃ pasāreyya, pasāritaṃ vā bāhaṃ samiñjeyya","ref":"D. ii 76","es":"así como un hombre fornido extendiera su brazo doblado o encogiera su brazo extendido.","en":"Just as a strong man might stretch out his bent arm or bend his outstretched arm."}],"notas":[],"avisos_en":[]},{"id":"seyyathidam","lema":"seyyathidaṃ","cab":{"es":"**seyyathidaṃ**, **seyyathīdaṃ**, (part.) Como sigue; es decir; a saber. Existe en los siguientes significados:","en":"**seyyathidaṃ**, **seyyathīdaṃ**, (particle) As follows; that is; namely. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Cuál es éste *(taṃ katamaṃ*). En este uso esta partícula puede significar cualquiera de los tres géneros y de los dos números.","en":"Which is this *(taṃ katamaṃ*). In this use the particle can stand for any of the three genders and either of the two numbers."},{"tipo":"ej","pali":"santi, bhante, aññāni mahānagarāni, seyyathidaṃ: campā rājagahaṃ sāvatthī sāketaṃ kosambī bārāṇasī","ref":"D. ii 121","es":"hay, Venerable Señor, otras grandes ciudades, a saber, Campā, Rājagaha, Sāvatthī, Sāketa, Kosambī y Bārāṇasī.","en":"There are, Venerable Sir, other great cities, namely: Campā, Rājagaha, Sāvatthī, Sāketa, Kosambī and Bārāṇasī."}],"notas":[],"avisos_en":[]},{"id":"sve","lema":"sve","cab":{"es":"**sve**, (sc. *śvas* ) (part. usada en la 7ª inflexión —tiempo) Mañana.","en":"**sve**, (Skt. *śvas* ) (particle used in the 7th case — time) Tomorrow."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sve ’dāni mayaṃ bhagavato sarīraṃ jhāpessāma","ref":"D. ii 131","es":"mañana cremaremos el cuerpo del Sublime","en":"Tomorrow, then, we shall cremate the body of the Blessed One."}],"notas":[],"avisos_en":[]},{"id":"so","lema":"so","cab":{"es":"**so**, (sufijo usado en la 3ª, 5ª y 7ª inflexión)","en":"**so**, (suffix used in the 3rd, 5th and 7th cases)"},"caso":["3","5"],"nir":"","bloques":[{"tipo":"txt","es":"En la 3ª inflexión:","en":"In the 3rd case:"},{"tipo":"ej","pali":"suttaso","ref":"","es":"de acuerdo con los discursos.","en":"In accordance with the discourses."},{"tipo":"txt","es":"En la 5ª inflexión:","en":"In the 5th case:"},{"tipo":"ej","pali":"dīghaso","ref":"","es":"de largo.","en":"By length (lengthwise)."},{"tipo":"ej","pali":"oraso","ref":"","es":"de este lado.","en":"From this side."}],"notas":[],"avisos_en":["header announces 3rd, 5th and 7th cases, but the source gives no 7th-case example.","block 4: *oraso* — followed Spanish «de este lado» ('from this side'); note that *oraso* is more commonly the adjective/noun *orasa* ('born of one's breast, own son'); uncertain."]},{"id":"sotthi","lema":"sotthi","cab":{"es":"**sotthi**, (sc. *svasti*) part. usada para expresar un deseo o bendición (*āsīsanattha*). Bienestar; felicidad. Véase **suvatthi**.","en":"**sotthi**, (Skt. *svasti*) particle used to express a wish or blessing (*āsīsanattha*). Well-being; happiness. See **suvatthi**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sotthi hotu sabbasattānaṃ","ref":"Rū. 155","es":"que haya bienestar para todos los seres.","en":"May there be well-being for all beings."}],"notas":[],"avisos_en":[]},{"id":"ha","lema":"ha","cab":{"es":"**ha**, (=sc.) (part..) Expletivo (*padapūraṇa*).","en":"**ha**, (=Skt.) (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"handa","lema":"handa","cab":{"es":"**handa**, (sc. *hanta*) (interj.) Se usa para exhortar, incitar (*codana*) y resolución (*vavassagga*).¡Vamos! ¡Venga! ¡Vaya! Ahora.","en":"**handa**, (Skt. *hanta*) (interj.) It is used for exhorting, urging (*codana*) and for resolution (*vavassagga*). Come! Come on! Well! Now."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"handa ’dāni, bhikkhave, āmantayāmi vo, vayadhammā saṅkhārā appamādena sampādetha","ref":"D. ii 128","es":"ahora, bhikkhus, os digo, “todos los fenómenos condicionados están sujetos a un cesar”, afanaos con diligencia.","en":"Now, bhikkhus, I address you: conditioned things are subject to passing away; strive on with diligence."},{"tipo":"ej","pali":"handa, mayam pi appamattā viharāma","ref":"S. i 89","es":"¡vamos, que nosotros también vigilantes vivamos!","en":"Come, let us too dwell heedful!"}],"notas":[],"avisos_en":[]},{"id":"hambho","lema":"hambho","cab":{"es":"**hambho**, (sc. haṃho) (part. voc., sg. y pl., m.) Véase **ambho**.","en":"**hambho**, (Skt. haṃho) (particle, voc., sg. and pl., m.) See **ambho**."},"caso":["1v"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"hare","lema":"hare","cab":{"es":"**hare**, (Cf. are) (intj., voc., sg. y pl., m., coloquial) Partícula vocativa usada en lenguaje abusivo (*hiṃsālapana*).","en":"**hare**, (cf. are) (interj., voc., sg. and pl., m., colloquial) Vocative particle used in abusive address (*hiṃsālapana*)."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"hare duṭṭhadhuttā","ref":"JA. I 286","es":"¡eh pillos corruptos!","en":"Hey, you wicked rogues!"}],"notas":[],"avisos_en":[]},{"id":"halam","lema":"halaṃ","cab":{"es":"**halaṃ**, (Cf. *alaṃ*) (part. de neg.). Véase alaṃ en el significado de negación (*paṭisedhana*).","en":"**halaṃ**, (cf. *alaṃ*) (negative particle). See alaṃ in the sense of negation (*paṭisedhana*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"have","lema":"have","cab":{"es":"**have**, (sc. *ha va guientes significados:","en":"**hi**, (= Skt.) (particle) Because; certainly, really. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Causa (*hetu*):","en":"Cause (*hetu*):"},{"tipo":"ej","pali":"maraṇantaṃ hi jīvitaṃ","ref":"S. i 98","es":"porque la vida termina en la muerte.","en":"For life ends in death."},{"tipo":"txt","es":"Énfasis (*avadhāraṇa*):","en":"Emphasis (*avadhāraṇa*):"},{"tipo":"ej","pali":"jinavacanayuttaṃ hi","ref":"Kac. §52","es":"en conformidad con la Palabra del Conquistador (= el Buddha).","en":"[It is] indeed in accordance with the word of the Conqueror (= the Buddha)."},{"tipo":"txt","es":"Afirmación, confirmación, hacer firme (*daḷhīkaraṇa*) (Sad. iii 391):","en":"Affirmation, confirmation, making firm (*daḷhīkaraṇa*) (Sad. iii 391):"},{"tipo":"ej","pali":"vuttañ hi","ref":"S. i 13","es":"porque se dijo.","en":"For it has been said."}],"notas":[],"avisos_en":[]},{"id":"hiyyo","lema":"hiyyo","cab":{"es":"**hiyyo**, (sc. *hyas*) (part. usada en la 7ª inflexión —tiempo) Ayer; en el día pasado (*atītadine*).","en":"**hiyyo**, (Skt. *hyas*) (particle used in the 7th case — time) Yesterday; on the past day (*atītadine*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"tiṇṇo hiyyo rājā gaṅgaṃ","ref":"J. ii 216","es":"ayer el rey cruzó el Ganges.","en":"Yesterday the king crossed the Ganges."}],"notas":[],"avisos_en":[]},{"id":"hiyo","lema":"hīyo","cab":{"es":"**hīyo**, véase **hiyyo**.","en":"**hīyo**, see **hiyyo**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"huram","lema":"huraṃ","cab":{"es":"**huraṃ**, (sc. *huras*) (part. usada en la 7ª inflexión) En el otro mundo; en otra existencia; en el más allá; en otro lugar (*paratthe*).","en":"**huraṃ**, (Skt. *huras*) (particle used in the 7th case) In the other world; in another existence; in the hereafter; elsewhere (*paratthe*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"idha vā huraṃ vā","ref":"Khp. 5","es":"en este mundo o en el más allá.","en":"Here or hereafter."}],"notas":[],"avisos_en":[]},{"id":"he","lema":"he","cab":{"es":"**he**, (= sc.) (intj., voc., sg. y pl.) Partícula vocativa singular y plural.","en":"**he**, (= Skt.) (interj., voc., sg. and pl.) Vocative particle, singular and plural."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"he je kāḷī,","ref":"M. i 176","es":"¡eh Kāḷī! En este caso se usa para dirigirse a una mujer esclava junto con je.","en":"Hey, Kāḷī! In this case it is used, together with je, to address a female slave."}],"notas":[],"avisos_en":[]},{"id":"hettha","lema":"heṭṭhā","cab":{"es":"**heṭṭhā**, (sc. *adhastāt*) (part. usada en la 7ª inflexión) Abajo; debajo (*adho*).","en":"**heṭṭhā**, (Skt. *adhastāt*) (particle used in the 7th case) Below; beneath (*adho*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"eko sahāyako heṭṭhā pabbatapāde tiṭṭheyya","ref":"M. iii 171","es":"un amigo estaría parado abajo al pie de la montaña.","en":"One friend might stand below, at the foot of the mountain."}],"notas":[],"avisos_en":[]},{"id":"n-hevam","lema":"hevaṃ","nuevo":true,"cab":{"es":"**hevaṃ**, véase *ha*. (= *ha* + *evaṃ*; los comentarios llaman a *ha* «nipātamatta»; Niruttidīpanī (p. 44) explica la *h* como aumento ante vocal: «*sare pare bahulaṃ hāgamo*».)","en":"**hevaṃ**, see *ha*. (= *ha* + *evaṃ*; the commentaries call *ha* «nipātamatta»; Niruttidīpanī (p. 44) explains the *h* as an augment before a vowel: «*sare pare bahulaṃ hāgamo*».)"},"caso":[],"nir":"","bloques":[],"notas":[],"fuente":{"es":"Comentario: DA. ii 76 y SA. ii 81: «mā hevanti ha-kāro nipātamattaṃ, evaṃ mā bhaṇīti attho»; SṬ. i 188 da otro análisis: «māhevanti mā aha evanti chedo, ahāti nipātamattaṃ, māti paṭisedhe nipāto». Los comentarios llaman nipāta a *ha* (o *aha*), no a *hevaṃ* entero; *hevaṃ* es *ha* + *evaṃ*.","en":"Commentary: DA. ii 76 and SA. ii 81: «mā hevanti ha-kāro nipātamattaṃ, evaṃ mā bhaṇīti attho»; SṬ. i 188 gives another analysis: «māhevanti mā aha evanti chedo, ahāti nipātamattaṃ, māti paṭisedhe nipāto». The commentaries call *ha* (or *aha*) a nipāta, not *hevaṃ* as a whole; *hevaṃ* is *ha* + *evaṃ*."}},{"id":"n-ho","lema":"ho","nuevo":true,"cab":{"es":"**ho**, (part.) Partícula incluida en la lista de nipātas de Kaccāyana §221 junto a *aho*, *he*, *ahe*, *re*, *are*.","en":"**ho**, (part.) A particle included in Kaccāyana §221’s list of nipātas together with *aho*, *he*, *ahe*, *re*, *are*."},"caso":[],"nir":"","bloques":[],"notas":[],"fuente":{"es":"Kaccāyana §221, vutti (p. 121): «… eva ho aho he ahe re are evamādīhi nipātehi ca yojetabbāni». No se ha hallado en CST *ho* como palabra independiente con valor de partícula (solo dentro de *aho*, *bho*, *hoti*).","en":"Kaccāyana §221, vutti (p. 121): «… eva ho aho he ahe re are evamādīhi nipātehi ca yojetabbāni». *ho* has not been found in CST as an independent word with the value of a particle (only within *aho*, *bho*, *hoti*)."}}]},{"id":"vibhatti","n":3,"titulo":{"es":"**3. voces terminadas en sufijos que representan inflexiones (*vibhatti-paccaya-pada*)**","en":"**3. words ending in suffixes that represent inflections (*vibhatti-paccaya-pada*)**"},"intro":[{"tipo":"txt","es":"Estos sufijos tienen la misma forma en los tres géneros y dos números (singular y plural). Hay quince mencionados en el *Padarūpasiddhi*: to, tra, tha, dā, dācanaṃ, dāni, dha, dhi, dhunā, rahi, va, ha, haṃ, hiṃ, hiñcanaṃ.[^28]","en":"These suffixes have the same form in the three genders and two numbers (singular and plural). Fifteen are mentioned in the *Padarūpasiddhi*: to, tra, tha, dā, dācanaṃ, dāni, dha, dhi, dhunā, rahi, va, ha, haṃ, hiṃ, hiñcanaṃ.[^28]"}],"tabla":[[{"es":"1","en":"1"},{"es":"to","en":"to"},{"es":"260","en":"260"},{"es":"- quinta (*pañcamī*)\n\n- séptima (*sattamī*) (lugar y tiempo)\n\n- tercera (*tatiyā*)","en":"- fifth (*pañcamī*)\n\n- seventh (*sattamī*) (place and time)\ agaraṃ*); si no termina en ‘a’, la vocal final se abrevia y la inflexión se elide (*adhikumāri*, *upavadhu*). Ejemplos, *upa-nagaraṃ*, cerca de la ciudad; *niddarathaṃ*, ausencia de aflicción; *yathāvuḍḍhaṃ*, según la antigüedad; *yāvajīvaṃ*, mientras dure la vida; *adhicittaṃ*, (con referencia a la) mente superior; *tiropabbataṃ*, a través de la montaña; *antopāsādaṃ*, dentro de la mansión; *upagaṅgaṃ*, cerca del Ganges; *adhikumāri*, (charla) acerca de las doncellas; *upavadhu*, cerca de la nuera.","en":"The first member of the compound is a prefix (*upasagga*) or a particle (*nipāta*); the second, a noun. The compound is of neuter gender: if it ends in ‘a’, the inflections generally (*kvaci*) become ‘aṃ’ (*upanagaraṃ*); if it does not end in ‘a’, the final vowel is shortened and the inflection is elided (*adhikumāri*, *upavadhu*). Examples, *upa-nagaraṃ*, near the city; *niddarathaṃ*, absence of affliction; *yathāvuḍḍhaṃ*, according to seniority; *yāvajīvaṃ*, as long as life lasts; *adhicittaṃ*, (concerning) the higher mind; *tiropabbataṃ*, across the mountain; *antopāsādaṃ*, inside the mansion; *upagaṅgaṃ*, near the Ganges; *adhikumāri*, (talk) about the maidens; *upavadhu*, near the daughter-in-law."}]},{"id":"taddhita","n":5,"titulo":{"es":"**5. voces terminadas en sufijos secundarios indeclinables (*ab(v)yaya-taddhita-paccaya-pada*)**","en":"**5. words ending in indeclinable secondary suffixes (*ab(v)yaya-taddhita-paccaya-pada*)**"},"intro":[{"tipo":"txt","es":"Los siguientes sufijos secundarios son indeclinables:","en":"The following secondary suffixes are indeclinable:"},{"tipo":"txt","es":"1)  *kkhattuṃ*, tras numerales, en lugar de *sakiṃ*, en el sentido de ‘vez’ (*vāra*) (Kacc. §646 / Rū. §419); Rū. lo cuenta entre las voces de distribución numérica (*saṅkhyāvibhāga*).","en":"1)  *kkhattuṃ*, after numerals, in place of *sakiṃ*, in the sense of ‘time’ (*vāra*) (Kacc. §646 / Rū. §419); Rū. counts it among the words of numerical distribution (*saṅkhyāvibhāg       const ref=b.ref?`<span class="rf" title="${esc(t.ref_tit)}">${esc(b.ref)}</span>`:'';
      ul+=`<li><span class="p">${md(b.pali,id)}${ref}</span><span class="t">${md(b[L]||b.es,id)}</span></li>`;
    }else{cerrar();h+=`<p class="bl${b.nivel===2?' n2':''}">${md(b[L]||b.es,id)}${b.nuevo?` <span class="chip nuevo" title="${esc(t.nuevo_s_tit)}">${t.nuevo}</span>`:''}</p>`}
  });
  cerrar();return h;
}
function particula(x){
  const t=T[lang],L=lang;
  let chips=(x.caso||[]).map(c=>`<span class="chip" title="${esc(t.caso_tit)}">${esc(t.caso[c])}</span>`).join('');
  if(x.nir) chips+=`<span class="chip nir" title="${esc(t.nir_tit(x.nir))}">Nir. ${esc(x.nir)}</span>`;
  if(x.nuevo) chips+=`<span class="chip nuevo" title="${esc(t.nuevo_tit)}">${t.nuevo}</span>`;
  let h=`<article class="card" id="${x.id}" data-c="${(x.caso||[]).join(' ')||'sin'}"><p class="ecab">${md(x.cab[L]||x.cab.es,x.id)}${chips?`<span class="chips">${chips}</span>`:''}</p>`;
  h+=bloques(x.bloques,x.id);
  if(x.fuente) h+=`<p class="fuente"><b>${t.fuente}</b>${md(x.fuente[L]||x.fuente.es)}</p>`;
  if(x.notas&&x.notas.length) h+='<div class="notas">'+x.notas.map(n=>`<p id="${x.id}-n${n.n}"><span class="nn">${esc(n.n)}</span>${md(n[L]||n.es)}</p>`).join('')+'</div>';
  return h+'</article>';
}
/* ---- notas de «Indeclinables» ([^n] en las clases 1, 3-6) ---- */
const GN=D.notas_indeclinables||{};
function notasDe(txt){
  const ns=[...new Set([...txt.matchAll(/\[\^(\d+)\]/g)].map(m=>m[1]))];
  if(!ns.length)return '';
  return `<div class="gnotas"><b>${T[lang].notas_h}</b>`+ns.map(n=>{const v=GN[n];if(!v)return '';const s=typeof v==='string'?v:(v[lang]||v.es);
    return `<p id="in-n${n}"><span class="nn">${n}</span>${md(s)}</p>`}).join('')+'</div>';
}
function intro(c){
  if(!c.intro||!c.intro.length)return '';
  return `<div class="cintro"><h2>${md(c.titulo[lang]||c.titulo.es)}</h2>${bloques(c.intro,'in')}</div>`;
}
function cellTxt(v){return typeof v==='string'?v:(v[lang]||v.es||'')}
function celda(v){
  const s=cellTxt(v);
  if(/^\s*- /m.test(s))return '<ul>'+s.split(/\n+/).filter(x=>x.trim()).map(x=>`<li>${md(x.replace(/^\s*- /,''),'in')}</li>`).join('')+'</ul>';
  return s.split(/\n+/).map(x=>md(x,'in')).join('<br>');
}
const abiertos={};
function render(){
  const t=T[lang],c=byId[cl];let h='',sb='',todo='';
  if(cl==='nipata'){
    const g=[];NP.forEach(x=>{const i=inicial(x.lema);let u=g[g.length-1];if(!u||u.i!==i){u={i,xs:[]};g.push(u)}u.xs.push(x)});
    h+=intro(c);
    g.forEach(u=>{
      h+=`<section class="grp" id="l-${encodeURIComponent(u.i)}"><div class="sec"><h2>${esc(u.i)}</h2><span class="rule"></span></div>`+u.xs.map(particula).join('')+'</section>';
      sb+=`<details class="sb-sec" data-g="${esc(u.i)}"${abiertos[u.i]?' open':''}><summary><span class="gl">${esc(u.i)}</span><span class="n">${u.xs.length}</span></summary>`+
        u.xs.map(x=>`<a href="#${x.id}" data-c="${x.id}"><i>${md(x.lema)}</i></a>`).join('')+'</details>';
    });
  }else if(cl==='upasagga'){
    h+=intro(c);todo+=JSON.stringify(c.intro);
    h+='<section class="grp">'+c.entradas.map(x=>{todo+=JSON.stringify(x.bloques);
      return `<article class="card" id="${x.id}" data-c="sin"><p class="ecab"><b>${esc(x.lema)}</b></p>${bloques(x.bloques,'in')}</article>`}).join('')+'</section>';
    sb+=c.entradas.map(x=>`<a href="#${x.id}" data-c="${x.id}"><i>${esc(x.lema)}</i></a>`).join('');
  }else if(cl==='vibhatti'){
    h+=intro(c);todo+=JSON.stringify(c.intro);
    h+=`<div class="rc-desliza"><table class="ptab"><thead><tr>${t.cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>`;
    c.tabla.forEach((r,i)=>{todo+=JSON.stringify(r);
      const rid='vibhatti-'+(i+1);const ks=(c.kacc||{})[cellTxt(r[1])]||[];
      const rf=celda(r[2])+(ks.length?'<br>'+ks.map(k=>`<a href="../../s/${k}/${lang==='en'?'?lang=en':''}" title="${esc(t.kacc)}">Kacc. §${k}</a>`).join(' '):'');
      h+=`<tr class="card" id="${rid}" data-c="sin"><td>${celda(r[0])}</td><td class="sf">${celda(r[1])}</td><td class="rf">${rf}</td><td>${celda(r[3])}</td><td>${celda(r[4])}</td></tr>`;
      sb+=`<a href="#${rid}" data-c="${rid}"><i>${esc(cellTxt(r[1]))}</i></a>`;
    });
    h+='</tbody></table></div>';
  }else{
    h+=`<article class="card" id="${cl}-1" data-c="sin">${intro(c)}</article>`;todo+=JSON.stringify(c.intro);
  }
  if(cl!=='nipata') h+=notasDe(todo);
  document.getElementById('out').innerHTML=h;document.getElementById('sb-list').innerHTML=sb;
  document.querySelectorAll('#sb-list .sb-sec').forEach(d=>d.addEventListener('toggle',()=>{abiertos[d.dataset.g]=d.open}));
  document.querySelectorAll('#out .card').forEach(e=>{e.dataset.t=norm(e.textContent).replace(/\s+/g,' ')});
  document.getElementById('f-caso').hidden=cl!=='nipata';
  pestañas();filtrar();
}
/* recuento de coincidencias por clase, para las pestañas */
const TXT={};
function textoClase(id){if(TXT[id+lang])return TXT[id+lang];const c=byId[id];
  const v=JSON.stringify(c,(k,x)=>(k==='en'&&lang==='es')||(k==='es'&&lang==='en'&&false)?undefined:x);return TXT[id+lang]=norm(v)}
function pestañas(){
  const t=T[lang],q=norm(document.getElementById('q').value.trim());
  document.getElementById('tabs').innerHTML=CL.map(c=>{const [a,b]=t.tabs[c.id];
    const hit=q?(textoClase(c.id).includes(q)?' ·':''):'';
    return `<button role="tab" data-c="${c.id}" aria-selected="${c.id===cl}"><span class="tn">${c.n}</span>${esc(a)} <span class="tp">${esc(b)}</span><span class="hits">${hit}</span></button>`}).join('');
}
let caso='all';
function filtrar(){
  const q=norm(document.getElementById('q').value.trim());let n=0;
  document.querySelectorAll('#out .card').forEach(c=>{const ok=(cl!=='nipata'||caso==='all'||c.dataset.c.split(' ').includes(caso))&&(!q||c.dataset.t.includes(q));c.hidden=!ok;if(ok)n++});
  document.querySelectorAll('#out section.grp').forEach(s=>{s.hidden=!s.querySelector('.card:not([hidden])')});
  document.querySelectorAll('#out .cintro').forEach(s=>{if(!s.closest('.card'))s.hidden=!!q});
  document.querySelectorAll('#sb-list .sb-sec').forEach(d=>{let v=0;d.querySelectorAll('a[data-c]').forEach(a=>{const el=document.getElementById(a.dataset.c);const ok=!!el&&!el.hidden;a.hidden=!ok;if(ok)v++});d.hidden=!v;d.querySelector('.n').textContent=v});
  document.querySelectorAll('#sb-list > a[data-c]').forEach(a=>{const el=document.getElementById(a.dataset.c);a.hidden=!el||el.hidden});
  document.getElementById('count').textContent=T[lang].rows(n,cl);
  document.getElementById('empty').hidden=!!n;
  pestañas();espiar();
}
function textos(){
  const t=T[lang];root.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);
  document.getElementById('q').placeholder=t.search;
  document.title=lang==='en'?'Indeclinables (abyaya)':'Indeclinables (abyaya)';
  document.getElementById('h1').textContent=document.title;
  document.getElementById('entradilla').innerHTML=t.entradilla;
  document.getElementById('aviso').innerHTML=t.aviso;
  document.getElementById('def-txt').innerHTML=bloques(D.definicion||[],'in');
  const gl=document.getElementById('guia-l');gl.textContent=t.guia;gl.href='guia/?lang='+lang;
  document.getElementById('hero').innerHTML=t.hero(NU.length,NP.length,byId.vibhatti.tabla.length);
  document.getElementById('lic').innerHTML=t.lic;
  document.getElementById('vbadge').innerHTML=`v${esc(M.version)} · <time datetime="${M.fecha}">${M.fecha}</time>`;
  document.getElementById('vfoot').innerHTML=`<strong>${t.ver} ${esc(M.version)}</strong> — <time datetime="${M.fecha}">${M.fecha}</time>. ${esc(M.nota_version[lang])}`;
  const tabla=l=>'<table class="erratas"><tbody>'+l.map(r=>`<tr><td>${esc(r.id)}</td><td><del>${md(r.antes.replace(/<\/?em>/g,'*').replace(/<\/?td>/g,''))}</del></td><td>${md(r.despues.replace(/<\/?em>/g,'*').replace(/<\/?td>/g,''))}</td></tr>`).join('')+'</tbody></table>';
  const EI=M.erratas_indeclinables||[];
  document.getElementById('notas-pie').innerHTML=t.notas(M.erratas.length,EI.length)+
    `<p class="erratas-h">${t.erratas_p}</p>`+tabla(M.erratas)+`<p class="erratas-h">${t.erratas_i}</p>`+tabla(EI)+
    ((M.correcciones_indeclinables||[]).length?`<p class="erratas-h">${t.correc_i}</p>`+tabla(M.correcciones_indeclinables):'');
  document.getElementById('f-caso').innerHTML=`<button data-v="all" aria-pressed="${caso==='all'}">${t.todas}</button>`+
    CASOS.map(c=>`<button data-v="${c}" aria-pressed="${caso===c}">${esc(t.caso[c])}</button>`).join('');
  document.getElementById('f-caso').setAttribute('aria-label',t.caso_tit);
  const lb=document.getElementById('lang-btn');lb.querySelectorAll('.lang-seg').forEach(s=>s.classList.toggle('lang-cur',s.dataset.l===lang));
  lb.title=lang==='en'?'Ver esta página en español':'View this page in English';lb.setAttribute('aria-label',lb.title);
}
document.getElementById('q').addEventListener('input',filtrar);
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cl=b.dataset.c;
  try{history.replaceState(null,'','?c='+cl+(lang==='en'?'&lang=en':''))}catch(_){}render();scrollTo({top:document.getElementById('bar').offsetTop})});
document.getElementById('f-caso').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;caso=b.dataset.v;
  document.querySelectorAll('#f-caso button').forEach(x=>x.setAttribute('aria-pressed',x===b));filtrar()});
document.getElementById('lang-btn').onclick=()=>{lang=lang==='en'?'es':'en';store.set('pali_lang',lang);textos();render()};
const saved=store.get('pali_dark');
if(saved==='1'||(saved===null&&mq('(prefers-color-scheme: dark)'))) root.dataset.theme='dark';
document.getElementById('theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'':'dark';store.set('pali_dark',root.dataset.theme==='dark'?'1':'0')};
const sbEl=document.getElementById('sidebar'),scr=document.getElementById('scrim'),burger=document.getElementById('burger'),barEl=document.getElementById('bar');
const ancha=()=>innerWidth>900;
function medirBarra(){root.style.setProperty('--barh',barEl.offsetHeight+'px')}
medirBarra();addEventListener('resize',medirBarra);
if(window.ResizeObserver)new ResizeObserver(medirBarra).observe(barEl);
const cerrarSb=()=>{sbEl.classList.remove('open');scr.classList.remove('on')};
function pintarBarra(oc){root.classList.toggle('sin-barra',oc)}
burger.onclick=()=>{if(ancha())pintarBarra(!root.classList.contains('sin-barra'));else{sbEl.classList.toggle('open');scr.classList.toggle('on')}};
document.getElementById('sbclose').onclick=()=>{if(ancha())pintarBarra(true);else cerrarSb()};
document.getElementById('volver-barra').onclick=()=>pintarBarra(false);
document.getElementById('sb-abrir').onclick=()=>document.querySelectorAll('#sb-list .sb-sec').forEach(d=>d.open=true);
document.getElementById('sb-plegar').onclick=()=>document.querySelectorAll('#sb-list .sb-sec').forEach(d=>d.open=false);
addEventListener('resize',()=>{if(!ancha())root.classList.remove('sin-barra')});
scr.onclick=cerrarSb;
addEventListener('keydown',e=>{if(e.key==='Escape')cerrarSb()});
sbEl.addEventListener('click',e=>{if(e.target.closest('a')&&!ancha())cerrarSb()});
let spyF=0;
function espiar(){
  const links=document.querySelectorAll('#sb-list a[data-c]');let cur=null;const lim=barEl.getBoundingClientRect().bottom+40;
  for(const a of links){if(a.hidden)continue;const el=document.getElementById(a.dataset.c);if(!el)continue;if(el.getBoundingClientRect().top<=lim)cur=a;else break}
  links.forEach(a=>a.classList.toggle('on',a===cur));
  document.querySelectorAll('#sb-list .sb-sec').forEach(d=>d.classList.toggle('on',!!cur&&d.contains(cur)));
}
const topBtn=document.getElementById('top-btn');
addEventListener('scroll',()=>{topBtn.classList.toggle('show',scrollY>600);if(!spyF)spyF=requestAnimationFrame(()=>{spyF=0;espiar()})},{passive:true});
topBtn.onclick=()=>scrollTo({top:0});
textos();render();
function irAncla(){const id=decodeURIComponent(location.hash.slice(1));if(!id)return;const c=claseDe(id);if(c&&c!==cl){cl=c;render()}
  const t=document.getElementById(id);if(t)setTimeout(()=>t.scrollIntoView(),0)}
addEventListener('hashchange',irAncla);irAncla();
})();

</script>
