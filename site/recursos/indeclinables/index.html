erca del niño Ciravāsī.","en":"go, my man, and find out about the boy Ciravāsī."}],"notas":[],"avisos_en":[]},{"id":"n-bhante","lema":"bhante","nuevo":true,"cab":{"es":"**bhante**, (part. de vocativo, *āmantana-nipāta*) ¡Venerable señor!, ¡venerables señores! Tratamiento respetuoso que expresa deferencia (*sādara*); se usa igual en singular y en plural.","en":"**bhante**, (vocative part., *āmantana-nipāta*) Venerable sir!, venerable sirs! A respectful form of address expressing deference (*sādara*); used alike in singular and plural."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Dirigido a una persona:","en":"Addressed to one person:"},{"tipo":"ej","pali":"handa ca dāni mayaṃ, bhante, gacchāma, bahukiccā mayaṃ bahukaraṇīyā","ref":"D. i 81","es":"Y ahora, venerable señor, nos vamos: tenemos muchos asuntos, mucho que hacer.","en":"And now, venerable sir, we must go: we have many duties, much to do."},{"tipo":"txt","es":"Dirigido a varias personas:","en":"Addressed to several persons:"},{"tipo":"ej","pali":"sve amhākaṃ bhikkhaṃ gaṇhatha, bhante","ref":"MA. ii 290","es":"Mañana, venerables señores, aceptad nuestra comida.","en":"Tomorrow, venerable sirs, accept alms-food from us."}],"notas":[],"fuente":{"es":"Pācityādiyojanā (p. 535): «bhante ti nipātopi paccekaṃ yojetabbo … bhante ti nipātena sādarassa pakāsakattā saṇhena vadati nāma». Niruttidīpanī (p. 155): «āvuso bho bhante iccādīhi āmantananipātehi … paṭhamāya lopo». Saddanīti §448: «ehi bhante · etha bhante» (Suttamālā, ed. Smith, p. 673). Históricamente es un vocativo (de *bhadanta*); se trata como nipāta por su invariabilidad de número.","en":"Pācityādiyojanā (p. 535): «bhante ti nipātopi paccekaṃ yojetabbo … bhante ti nipātena sādarassa pakāsakattā saṇhena vadati nāma». Niruttidīpanī (p. 155): «āvuso bho bhante iccādīhi āmantananipātehi … paṭhamāya lopo». Saddanīti §448: «ehi bhante · etha bhante» (Suttamālā, Smith ed., p. 673). Historically it is a vocative (of *bhadanta*); it is treated as a nipāta because it does not vary for number."}},{"id":"bhiyyo","lema":"bhiyyo","cab":{"es":"**bhiyyo**, (sc. bhūyas) (adv., part. 1ª y 2ª inflexión) Más; mucho.","en":"**bhiyyo**, (Skt. bhūyas) (adv., particle in the 1st and 2nd case) More; much."},"caso":["1","2"],"nir":"","bloques":[{"tipo":"txt","es":"En la 1ª inflexión:","en":"In the 1st case:"},{"tipo":"ej","pali":"uppajjati sukhaṃ, sukhā bhiyyo somanassaṃ","ref":"D. ii 173","es":"agrado surge y del agrado más placer.","en":"pleasure arises, and from pleasure, still more joy."},{"tipo":"txt","es":"En la 2ª inflexión:","en":"In the 2nd case:"},{"tipo":"ej","pali":"bhiyyo pallomam āpādiṃ araññe vihārāya","ref":"M. i 21","es":"alcancé más seguridad morando en el bosque.","en":"I gained even greater confidence for dwelling in the forest."}],"notas":[],"avisos_en":[]},{"id":"bhutapubbam","lema":"bhūtapubbaṃ","cab":{"es":"**bhūtapubbaṃ**, (sc. *bhūtapūrva*) (part. usada en la 7ª inflexión —tiempo) En el pasado; en tiempos pasados; en otros tiempos; antiguamente.","en":"**bhūtapubbaṃ**, (Skt. *bhūtapūrva*) (particle used in the 7th case —time) In the past; in times past; in former times; formerly."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"bhūtapubbaṃ, bhikkhave, rājā ahosi aruṇavā nāma","ref":"S. i 157","es":"en tiempos pasados, bhikkhus, había un rey llamado Aruṇavā.","en":"in times past, bhikkhus, there was a king named Aruṇavā."}],"notas":[],"avisos_en":[]},{"id":"bho","lema":"bho","cab":{"es":"**bho**, (sc. *bhos*) (part. voc., sg. y pl., m. y f.) Partícula vocativa singular y plural usada para dirigirse a hombres o mujeres. Es un término que denota familiaridad y se usa para iguales e inferiores.","en":"**bho**, (Skt. *bhos*) (voc. particle, sg. and pl., m. and f.) Singular and plural vocative particle used to address men or women. It is a term denoting familiarity and is used towards equals and inferiors."},"caso":["1v"],"nir":"","bloques":[{"tipo":"txt","es":"Un ministro para dirigirse al Buddha:","en":"A minister addressing the Buddha:"},{"tipo":"ej","pali":"rājā, bho gotama, māgadho ajātasattu vedehiputto vajjī abhiyātukāmo","ref":"D. ii 62","es":"Venerable Gotama, el rey de Māgadha Ajātasattu, hijo de la reina Vedhi, desea aniquilar a los Vajjis.","en":"Master Gotama, the king of Magadha, Ajātasattu, son of the Videhan queen, wishes to march against the Vajjis."},{"tipo":"txt","es":"Al público en general:","en":"To the public in general:"},{"tipo":"ej","pali":"jitamha vata bho ambakāya","ref":"D. ii 82","es":"¡oh señores hemos sido derrotados por una mujer!","en":"alas, sirs, we have been defeated by a mere woman!"}],"notas":[],"avisos_en":["block 1: Spanish 'Venerable Gotama' for bho gotama (English 'Master Gotama', matching the familiar register the heading describes); Spanish 'aniquilar' for abhiyātukāmo, which means 'wishes to march against / attack'."]},{"id":"manam","lema":"manaṃ","cab":{"es":"**manaṃ**, (sc. *manāk*) Casi; un poco.","en":"**manaṃ**, (Skt. *manāk*) Almost; a little."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"nadiṃ taranto manaṃ vūḷho ahosi","ref":"V. iii 147","es":"cruzando el río, fue casi arrastrado [por la correntada].","en":"crossing the river, he was almost swept away [by the current]."},{"tipo":"ej","pali":"atipaṇḍitena puttena, manam hi upakūḷito","ref":"J. i 23","es":"fui casi quemado por su muy sabio hijo.","en":"I was almost burnt by an over-clever son."},{"tipo":"ej","pali":"manaṃ vata, bho, panassāma","ref":"M. i 234","es":"casi desaparecemos.","en":"we very nearly perished, sirs!"}],"notas":[],"avisos_en":["block 1: Spanish 'su muy sabio hijo' ('his/your very wise son'); the Pāli has no possessive and atipaṇḍita suggests 'over-clever'."]},{"id":"ma","lema":"mā","cab":{"es":"**mā**, (= sc.) (part. de neg.) No. Partícula de negación y prohibición (*paṭisedhana*).","en":"**mā**, (= Skt.) (negative particle) Not. Particle of negation and prohibition (*paṭisedhana*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"mā bhāyi","ref":"D. i 47","es":"no tema.","en":"do not be afraid."}],"notas":[],"avisos_en":[]},{"id":"marisa","lema":"mārisa","cab":{"es":"**mārisa**, (sc. *māriṣa*, *mādṛśa* = colega) (part. voc., sg.) ¡Señor! Vocativo de respeto.","en":"**mārisa**, (Skt. *māriṣa*, *mādṛśa* = colleague) (voc. particle, sg.) Sir! Vocative of respect."},"caso":["1v"],"nir":"","bloques":[{"tipo":"txt","es":"Un deva se dirige a un humano:","en":"A deva addresses a human:"},{"tipo":"ej","pali":"ahaṃ kho, mārisa, sakko devānamindo","ref":"D. ii 226","es":"yo, señor, soy Sakka, rey de los devas.","en":"I, sir, am Sakka, lord of the devas."},{"tipo":"txt","es":"Un grupo de devas a otro deva:","en":"A group of devas to another deva:"},{"tipo":"ej","pali":"icchāma mayaṃ mārisa... sotuṃ","ref":"D. ii 179","es":"nosotros señor deseamos escuchar.","en":"we, sir, wish ... to hear."}],"notas":[],"avisos_en":[]},{"id":"marisa-2","lema":"mārisā","cab":{"es":"**mārisā**, (sc. *māriṣa*, *mādṛśa* = colega) (part. voc., pl.)¡Señores! Vocativo de respeto.","en":"**mārisā**, (Skt. *māriṣa*, *mādṛśa* = colleague) (voc. particle, pl.) Sirs! Vocative of respect."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"nikkhantaṃ kho, mārisā, ekaṃ vassaṃ","ref":"D. ii 41","es":"señores, un año ha pasado.","en":"sirs, one year has gone by."}],"notas":[],"avisos_en":[]},{"id":"miccha","lema":"micchā","cab":{"es":"**micchā**, (sc. *mithyā*) (adv., part. 3ª inflexión y sin inflexión) Falsamente, erróneamente, equivocadamente; incorrectamente; mal; falsedad (*asacca*). Véase también **musā** y **alikaṃ**.","en":"**micchā**, (Skt. *mithyā*) (adv., particle in the 3rd case and uninflected) Falsely, erroneously, mistakenly; incorrectly; wrongly; falsehood (*asacca*). See also **musā** and **alikaṃ**."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"micchā paṇihitaṃ cittaṃ","ref":"Dh. 19","es":"una mente mal dirigida.","en":"a wrongly directed mind."},{"tipo":"ej","pali":"idaṃ te micchā","ref":"Kv. 4","es":"ésta es una falsedad tuya.","en":"this [claim] of yours is false."}],"notas":[],"avisos_en":[]},{"id":"n-mudha","lema":"mudhā","nuevo":true,"cab":{"es":"**mudhā**, (sc. *mudhā*) (ind.) En vano, inútilmente; gratis, sin precio.","en":"**mudhā**, (Skt. *mudhā*) (ind.) In vain, uselessly; gratis, for nothing."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Sin fruto, en vano (*nipphala*):","en":"Fruitless, in vain (*nipphala*):"},{"tipo":"ej","pali":"te moghaṃ mudhā amūlakaṃ pasaṃsanti","ref":"ThagA. i 360","es":"ellos (lo) alaban vanamente, en vano, sin fundamento.","en":"they praise (him) idly, in vain, groundlessly."},{"tipo":"txt","es":"Sin precio, gratuitamente (*amūla*):","en":"Without price, gratis (*amūla*):"},{"tipo":"ej","pali":"Te pattipattā amataṃ vigayha, laddhā mudhā nibbutiṃ bhuñjamānā","ref":"Khp. 5","es":"ellos, habiendo alcanzado lo que ha de alcanzarse, inmersos en lo inmortal, gozan de la extinción obtenida gratuitamente.","en":"they, having attained what is to be attained, plunged into the deathless, enjoy the quenching obtained for nothing."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1145 («nipphale tu mudhā bhave»); Abhidhānappadīpikāṭīkā v. 1145 (M 600): «Mudhāsaddo nipphale phalarahite, nippayojanetyattho. Amūlepi ca mudhā»; KhpA. 154 (P 185) glosa: «Mudhāti abyayena kākaṇikamattampi byayaṃ akatvā»; Bālāvatāra (lista de nipātas, M 130) incluye *mudhā*. El verso del Ratanasutta está también en Sn. 313 (P 40). En la glosa de KhpA, *abyayena* significa «sin gasto», no «como indeclinable».","en":"Abhidhānappadīpikā v. 1145; Abhidhānappadīpikāṭīkā v. 1145 (M 600): «Mudhāsaddo nipphale phalarahite, nippayojanetyattho. Amūlepi ca mudhā»; KhpA. 154 (P 185) glosses: «Mudhāti abyayena kākaṇikamattampi byayaṃ akatvā»; Bālāvatāra (list of nipātas, M 130) includes *mudhā*. The Ratanasutta verse is also at Sn. 313 (P 40). In the KhpA gloss, *abyayena* means “without expense”, not “as an indeclinable”."}},{"id":"musa","lema":"musā","cab":{"es":"**musā**, (sc. *mṛṣā*) (adv.) expresa aquello que no es verdadero (*asacca*). Mentira; falsedad; falso.","en":"**musā**, (Skt. *mṛṣā*) (adv.) expresses what is not true (*asacca*). Lie; falsehood; false."},"caso":[],"nir":"3","bloques":[{"tipo":"ej","pali":"na musā bhaṇati","ref":"D. iii 40","es":"no dice lo que es falso.","en":"he does not speak falsely."}],"notas":[],"avisos_en":[]},{"id":"muhum","lema":"muhuṃ","cab":{"es":"**muhuṃ**, (sc. *muhur*) (part. usada en la 7ª inflexión —tiempo) Rápido; repetidamente.","en":"**muhuṃ**, (Skt. *muhur*) (particle used in the 7th case —time) Quickly; repeatedly."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"muhuṃ muhuṃ hadayaṃ vedhamānaṃ","ref":"S. i 112","es":"perforando el corazón momento a momento.","en":"the heart trembling again and again."}],"notas":[],"avisos_en":["block 0: Spanish 'perforando' (piercing); vedhamāna is from vedhati 'to tremble, quiver', so 'trembling'."]},{"id":"muhuttam","lema":"muhuttaṃ","cab":{"es":"**muhuttaṃ**, (sc. *muhūrta*) (part. usada en la 7ª inflexión —tiempo) Un momento, un segundo, instante.","en":"**muhuttaṃ**, (Skt. *muhūrta*) (particle used in the 7th case —time) A moment, a second, an instant."},"caso":["7"],"nir":"2","bloques":[{"tipo":"ej","pali":"sādhu, bhante, bhagavā muhuttaṃ nisīdatu anukampaṃ upādāya","ref":"M. i 300","es":"sería bueno que el Sublime por compasión se siente un momento.","en":"it would be good, Venerable Sir, if the Blessed One would sit for a moment, out of compassion."}],"notas":[],"avisos_en":[]},{"id":"yagghe","lema":"yagghe","cab":{"es":"**yagghe**, (part.) Expletivo (*padapūraṇa*).","en":"**yagghe**, (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"yan-ce","lema":"yañ ce","cab":{"es":"**yañ ce**, expresa oposición (*paṭisedha*). En estos ejemplos se puede traducir como “que”.","en":"**yañ ce**, expresses opposition (*paṭisedha*). In these examples it can be translated as “than”."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"daṇḍo ’va kira me seyyo yañ ce puttā anassavā","ref":"S. i 177","es":"es mejor para mí el bastón que hijos desleales.","en":"better for me, it seems, is a staff than disobedient sons."},{"tipo":"ej","pali":"sā yeva pūjanā seyyo yañ ce vassasataṃ hutaṃ","ref":"Dh. 29","es":"este homenaje es mejor que cien años de sacrificios.","en":"that very homage is better than a hundred years of sacrifice."}],"notas":[],"avisos_en":[]},{"id":"n-yattha","lema":"yattha","nuevo":true,"cab":{"es":"**yattha**, (adv. relativo de lugar, 7.ª) Donde, en el que (= *yasmiṃ*). Según Saddanīti, tras *ya-* también puede tener sentido de 1.ª (nominativo).","en":"**yattha**, (relative adv. of place, 7th case) Where, in which (= *yasmiṃ*). According to Saddanīti, after *ya-* it may also have the sense of the 1st case (nominative)."},"caso":["7"],"nir":"","bloques":[{"tipo":"txt","es":"Lugar (7.ª):","en":"Place (7th case):"},{"tipo":"ej","pali":"mayampi kho, bhikkhu, na jānāma yattha vā brahmā yena vā brahmā yahiṃ vā brahmā","ref":"D. i 211","es":"tampoco nosotros, bhikkhu, sabemos dónde está Brahmā, por dónde, ni en qué lugar.","en":"we too, bhikkhu, do not know where Brahmā is, by what way, or in what place."},{"tipo":"txt","es":"En sentido de 1.ª, según Saddanīti:","en":"In the sense of the 1st case, according to Saddanīti:"},{"tipo":"ej","pali":"yattha etādiso satthā, loke appaṭipuggalo, tathāgato balappatto, sambuddho parinibbuto","ref":"D. ii 129","es":"ya que (incluso) un Maestro tal, sin igual en el mundo, el Tathāgata, dotado de los poderes, el plenamente Despierto, se ha extinguido por completo.","en":"since (even) such a Teacher, without equal in the world, the Tathāgata, endowed with the powers, the fully Awakened One, has attained final nibbāna."}],"notas":[],"fuente":{"es":"Saddanīti §494–495 (Suttamālā, ed. Smith, p. 681): *tra*/*tha* tras pronombre en 7.ª, y tras *ya-* también en 1.ª («yattha etādiso satthā»); Saddanīti cita el mismo verso en Dhātumālā, p. 14. Abhidhānappadīpikā v. 1156; su ṭīkā (p. 603): «yatthādayo tayo aniyamaṭṭhānādivācakā, tatthādayo niyamaṭṭhānādivācakā».","en":"Saddanīti §494–495 (Suttamālā, Smith ed., p. 681): *tra*/*tha* after a pronoun in the 7th case, and after *ya-* also in the 1st («yattha etādiso satthā»); Saddanīti quotes the same verse in Dhātumālā, p. 14. Abhidhānappadīpikā v. 1156; its ṭīkā (p. 603): «yatthādayo tayo aniyamaṭṭhānādivācakā, tatthādayo niyamaṭṭhānādivācakā»."}},{"id":"yattha-katthaci","lema":"yattha katthaci","cab":{"es":"**yattha katthaci**, (part. usada en la 7ª inflexión) Éste es un término que incluye todo (*anavasesapariyādānavacana*).","en":"**yattha katthaci**, (particle used in the 7th case) This is an all-inclusive term (*anavasesapariyādānavacana*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"tasmā tesu yattha katthaci ekādasavidhena nimittaṃ uggahetvā","ref":"Vis. i 186","es":"por lo tanto habiendo aprehendido el signo en cada uno de éstos de acuerdo con los once modos.","en":"therefore, having grasped the sign in any one of these in the eleven ways..."}],"notas":[],"avisos_en":["block 0: Spanish 'en cada uno de éstos' (in each); yattha katthaci = 'in whichever/any one'."]},{"id":"yato-kutoci","lema":"yato kutoci","cab":{"es":"**yato kutoci**, (part. usada en la 5ª inflexión) Éste es un término que incluye todo (*anavasesapariyādānavacana*).","en":"**yato kutoci**, (particle used in the 5th case) This is an all-inclusive term (*anavasesapariyādānavacana*)."},"caso":["5"],"nir":"","bloques":[{"tipo":"ej","pali":"yato kutoci ce pi naṃ puriso ādittāya tiṇukkāya upasaṅkameyya","ref":"S. ii 392","es":"si un hombre con una antorcha ardiente hecha de paja se acercara desde cualquier dirección.","en":"if a man were to approach it from any direction whatsoever with a blazing grass torch."}],"notas":[],"avisos_en":[]},{"id":"n-yatra","lema":"yatra","nuevo":true,"cab":{"es":"**yatra**, (adv. relativo, 7.ª) Donde. En la locución *yatra hi nāma* expresa asombro, alabanza, curiosidad, risa o confianza, y está en sentido de 1.ª; rige futuro con valor de pasado.","en":"**yatra**, (relative adv., 7th case) Where. In the phrase *yatra hi nāma* it expresses wonder, praise, curiosity, laughter or confidence, and stands in the sense of the 1st case; it takes a future with past meaning."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"acchariyaṃ vata bho, abbhutaṃ vata bho, tathāgatassa mahiddhikatā mahānubhāvatā, yatra hi nāmāyaṃ suppavāsā koliyadhītā saha vacanā bhagavato sukhinī arogā arogaṃ puttaṃ vijāyissati","ref":"Ud. 95","es":"¡Qué maravilla, qué prodigio, el gran poder y la gran majestad del Tathāgata, que esta Suppavāsā, la hija de los Koliya, con sólo la palabra del Bhagavā, haya dado a luz feliz y sana a un hijo sano!","en":"How wonderful, how marvellous is the great power and majesty of the Tathāgata, that this Suppavāsā, the Koliyan daughter, at the mere word of the Blessed One, should have given birth, happy and well, to a healthy son!"}],"notas":[],"fuente":{"es":"Paramatthadīpanī sobre Udāna (UdA. 138): «yatrā ti acchariyapasaṃsākotuhalahāsapasādiko paccattatthe nipāto, tena yuttattā vijāyissatī ti anāgatakālavacanaṃ, attho pana atītakāloyeva». Saddanīti §494–495 (Suttamālā, ed. Smith, p. 681): «yatra hi nāma sāvako pi…» (1.ª).","en":"Paramatthadīpanī on the Udāna (UdA. 138): «yatrā ti acchariyapasaṃsākotuhalahāsapasādiko paccattatthe nipāto, tena yuttattā vijāyissatī ti anāgatakālavacanaṃ, attho pana atītakāloyeva». Saddanīti §494–495 (Suttamālā, Smith ed., p. 681): «yatra hi nāma sāvako pi…» (1st case)."}},{"id":"yatha-r-iva","lema":"yatha-r-iva","cab":{"es":"**yatha-r-iva**, = **yath’ eva**.","en":"**yatha-r-iva**, = **yath’ eva**."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"yatha","lema":"yathā","cab":{"es":"**yathā**, (= sc.) (part., adv.) Como; tal como; al igual que; con relación a; de acuerdo a; así como; lo mismo que. Correlativo de **tathā**. Existe en los siguientes significados:","en":"**yathā**, (= Skt.) (particle, adv.) As; just as; like; in relation to; according to; even as; the same as. Correlative of **tathā**. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Analogía; símil; semejanza (*paṭibhāga*):","en":"Analogy; simile; likeness (*paṭibhāga*):"},{"tipo":"ej","pali":"vaṃso visālo ’va yathā visatto puttesu dāresu ca yā apekkhā","ref":"Sn. 285","es":"el apego por hijos y esposas es como [un bosque de] bambú difuso y enredado.","en":"longing for sons and wives is like a wide-spreading [clump of] bamboo, entangled."},{"tipo":"ej","pali":"yathā me dhanacchedo na hoti, tathā karissāmi","ref":"DhA. i 16","es":"haré de tal forma que no haya disminución de mi riqueza.","en":"I will act in such a way that there is no loss of my wealth."},{"tipo":"ej","pali":"karoti so tath’ attānaṃ, yathā naṃ icchatī diso","ref":"Dh. 37","es":"él se hace a sí mismo lo que sólo un enemigo desea para uno.","en":"he does to himself what an enemy would wish for him."},{"tipo":"txt","es":"Adecuación, conformidad (*yogattā*):","en":"Suitability, conformity (*yogattā*):"},{"tipo":"ej","pali":"yathānurūpaṃ upasaṃharati","ref":"","es":"los reúne de acuerdo a lo adecuado.","en":"he brings them together as is fitting."},{"tipo":"txt","es":"Repetición, difusión (*vicchā*):","en":"Repetition, distribution (*vicchā*):"},{"tipo":"ej","pali":"ye ye vuḍḍhā yathāvuḍḍhaṃ","ref":"","es":"cada uno de los que son mayores de acuerdo a la antigüedad.","en":"whoever are senior, each according to seniority."},{"tipo":"txt","es":"No trascendiendo el significado de la palabra (*padatthānativatta*):","en":"Not exceeding the meaning of the word (*padatthānativatta*):"},{"tipo":"ej","pali":"yathākkamaṃ","ref":"","es":"en orden, en sucesión.","en":"in order, in sequence."},{"tipo":"txt","es":"Ilustración, ejemplo (*nidassana*):","en":"Illustration, example (*nidassana*):"},{"tipo":"ej","pali":"yathā kulūpako","ref":"A ii 120","es":"así como uno que frecuenta una familia.","en":"like one who frequents families."},{"tipo":"txt","es":"Orden, sucesión (paṭipāṭi):","en":"Order, succession (paṭipāṭi):"},{"tipo":"ej","pali":"vuḍḍhānaṃ paṭipāṭi yathāvuḍḍhaṃ","ref":"","es":"en orden de los mayores, de acuerdo a la antigüedad.","en":"the order of the seniors: according to seniority."},{"tipo":"txt","es":"Muy mucho, sumamente, extremadamente (*ativiya*):","en":"Very much, exceedingly, extremely (*ativiya*):"},{"tipo":"ej","pali":"yathā ayaṃ nimirājā paṇḍito kusalatthiko","ref":"J. ii 186","es":"este rey Nimi muy sabio, deseoso del bien. Aquí la partícula **yathā** significa “muy” y se conecta con *paṇḍito*, sabio.","en":"this King Nimi, very wise, desirous of the good. Here the particle **yathā** means “very” and connects with *paṇḍito*, wise."}],"notas":[],"avisos_en":["block 15: 'Order, succession (paṭipāṭi)' — paṭipāṭi is not italicised in the Spanish source either; left as is."]},{"id":"yatha-ca","lema":"yathā ca","cab":{"es":"**yathā ca**, se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Correlativo de **tathā ca**.","en":"**yathā ca**, used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way. Correlative of **tathā ca**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā ca te bhagavā byākaroti, tathā naṃ dhāreyyāsi","ref":"D. i 212","es":"así como el Sublime te explica, de esta manera deberías recordarlo.","en":"as the Blessed One explains it to you, so should you remember it."}],"notas":[],"avisos_en":[]},{"id":"yatha-nama","lema":"yathā nāma","cab":{"es":"**yathā nāma**, se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Correlativo de **tathā nāma**.","en":"**yathā nāma**, used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way. Correlative of **tathā nāma**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā nāma balavā puriso āsanā vuṭṭhāya divasam pi tiṭṭheyya","ref":"Vis.i 123","es":"así como un hombre fornido, habiéndose levantado de su asiento, puede permanecer parado todo el día.","en":"just as a strong man, having risen from his seat, might remain standing even for the whole day."}],"notas":[],"avisos_en":[]},{"id":"yatha-pi","lema":"yathā pi","cab":{"es":"**yathā pi**, (*yathā + api*) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera.","en":"**yathā pi**, (*yathā + api*) Used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā pi selā vipulā nabhaṃ āhacca pabbatā","ref":"S. i 102","es":"así como una montaña de roca sólida, extensa, tocando el cielo.","en":"just as vast mountains of solid rock, reaching up to the sky,"}],"notas":[],"avisos_en":["block 0: Spanish singular ('una montaña'); selā vipulā ... pabbatā is plural."]},{"id":"yatha-hi","lema":"yathā hi","cab":{"es":"**yathā hi**, se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera. Correlativo de **tathā hi**.","en":"**yathā hi**, used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way. Correlative of **tathā hi**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yathā hi megho thanayaṃ","ref":"S. i 100","es":"así como una nube de tormenta tronando.","en":"just as a storm cloud, thundering,"}],"notas":[],"avisos_en":[]},{"id":"yath-eva","lema":"yath’ eva","cab":{"es":"**yath’ eva**, (sc. *yathā + eva*) Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Lo mismo que; al igual que; así; como. Otra forma es **yathar iva**. Es el correlativo de **tath’ eva**: **yath’ eva**, como; **tath’ eva**, así.","en":"**yath’ eva**, (Skt. *yathā + eva*) Used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). The same as; just as; thus; like. Another form is **yathar iva**. It is the correlative of **tath’ eva**: **yath’ eva**, as; **tath’ eva**, so."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yath’ eva maṃ te pūjesuṃ, tath' eva tvam pi pūjaya","ref":"J. i 243","es":"como ellos me honraron, así también tú hónrame.","en":"as they honoured me, just so should you too honour me."},{"tipo":"ej","pali":"yath’ eva bhagavatā pubbe bhikkhusaṃgho anuggahito, evam eva etarahi anuggaṇhātu bhikkhusaṃghan","ref":"S. ii 75","es":"que el Sublime ayude ahora a la comunidad de bhikkhus, así como el Sublime ayudó a la comunidad de Bhikkhus en el pasado.","en":"just as the Blessed One formerly helped the community of bhikkhus, so may he now help the community of bhikkhus."},{"tipo":"ej","pali":"aho vata, mārisā, cattāro sammāsambuddhā loke uppajjeyyuṃ dhammañ ca deseyyuṃ yatha-r-iva bhagavā","ref":"D. ii 181","es":"¡oh señores, si cuatro Buddhas fueran a surgir en el mundo y enseñar el Dhamma así como el Sublime!","en":"oh, sirs, if only four Perfectly Enlightened Buddhas were to arise in the world and teach the Dhamma, just as the Blessed One does!"}],"notas":[],"avisos_en":[]},{"id":"yada","lema":"yadā","cab":{"es":"**yadā**, (= sc.) (part. usada en la 7ª inflexión —tiempo) Cuando. Correlativo de **tadā**.","en":"**yadā**, (= Skt.) (particle used in the 7th case —time) When. Correlative of **tadā**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"yadā ca paccati pāpaṃ","ref":"Dh. 23","es":"pero cuando la mala acción madura.","en":"but when the evil deed ripens."},{"tipo":"ej","pali":"yadā devo devakāyā cavati","ref":"Iti. 247","es":"cuando una divinidad muere (lit. cae) del mundo de los devas.","en":"when a deva passes away (lit. falls) from the company of the devas."},{"tipo":"ej","pali":"cātumahābhūtiko ayaṃ puriso yadā kālaṅkaroti, pathavī pathavikāyaṃ anupeti anupagacchati","ref":"D. i 52","es":"cuando este hombre, compuesto por los cuatro elementos, muere, el elemento tierra regresa, vuelve, a la masa de la tierra.","en":"when this person, made up of the four great elements, dies, earth returns to, goes back to, the mass of earth."},{"tipo":"txt","es":"Con el correlativo **tadā**:","en":"With the correlative **tadā**:"},{"tipo":"ej","pali":"yadā te vivadissanti, tadā ehinti me vasaṃ","ref":"J. i 9","es":"cuando ellos disputen, entonces vendrán bajo mi influencia.","en":"when they quarrel, then they will come under my power."}],"notas":[],"avisos_en":[]},{"id":"yada-kadaci","lema":"yadā kadāci","cab":{"es":"**yadā kadāci**, (sc. *yadā kadācid*) (part. usada en la 7ª inflexión —tiempo) Cada vez (*anavasesapariyādānavacana*).","en":"**yadā kadāci**, (Skt. *yadā kadācid*) (particle used in the 7th case —time) Whenever (*anavasesapariyādānavacana*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"yadā kadāci pana me bhayaṃ āgacchantaṃ sākhāvissaṭṭhaṭṭhānato āgamissati","ref":"JA. iii 396","es":"cada vez que me viene el miedo debido al crujir de ramas.","en":"whenever danger comes to me, it will come from the place where a branch has been let go."}],"notas":[],"avisos_en":["block 0: uncertain; Spanish 'cada vez que me viene el miedo debido al crujir de ramas'; the Pāli (bhayaṃ ... sākhāvissaṭṭhaṭṭhānato āgamissati) reads more like 'danger will come from the place where a branch is released/snaps'. Check JA. iii 396 context."]},{"id":"yadi","lema":"yadi","cab":{"es":"**yadi**, (= sc.) Usada para expresar condicionalidad, posición de duda (*saṅkāvaṭṭhāna*). Si; ya sea. A veces puede tener el mismo significado que la conjunción vā.","en":"**yadi**, (= Skt.) Used to express conditionality, a position of doubt (*saṅkāvaṭṭhāna*). If; whether. Sometimes it can have the same meaning as the conjunction vā."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"gāme vā yadi vāraññe","ref":"Dh. 27","es":"ya sea en el poblado o en el bosque.","en":"whether in a village or in the forest."},{"tipo":"ej","pali":"yadi ’haṃ tassa pakuppeyyaṃ","ref":"Cp. 401","es":"si yo me enojara con éste.","en":"if I were to become angry with him."}],"notas":[],"avisos_en":[]},{"id":"n-yadidam","lema":"yadidaṃ","nuevo":true,"cab":{"es":"**yadidaṃ**, (ind.) A saber, es decir, esto es; introduce la identificación de lo dicho.","en":"**yadidaṃ**, (ind.) Namely, that is, i.e.; introduces the identification of what was said."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Identificación (*yaṃ idaṃ*, «lo que es esto»), concordando en sentido con el género y caso del término al que se refiere:","en":"Identification (*yaṃ idaṃ*, «that which is this»), agreeing in sense with the gender and case of the term it refers to:"},{"tipo":"ej","pali":"duddasaṃ idaṃ ṭhānaṃ yadidaṃ idappaccayatā paṭiccasamuppādo","ref":"D. ii 31","es":"Difícil de ver es este asunto, a saber: la condicionalidad específica, el surgimiento dependiente.","en":"Hard to see is this matter, namely: specific conditionality, dependent origination."}],"notas":[],"fuente":{"es":"Comentario: DA. ii 55 (sobre este pasaje): «yadidanti nipāto, tassa ṭhānaṃ sandhāya ‘yaṃ idan’ti… attho»; DA. ii 88: «yadidaṃ jātīti ettha yadidanti nipāto, tassa sabbapadesu liṅgānurūpato attho veditabbo»; MA. i 98 (P i 95) y Sārattha-ṭ. i 193: «yadidanti nipāto. Sabbaliṅgavibhattivacanesu tādisova, tattha tattha atthato pariṇāmetabbo»; Vis-ṭ. i 12: «yadidanti nipāto, ye imeti attho».","en":"Commentary: DA. ii 55 (on this passage): «yadidanti nipāto, tassa ṭhānaṃ sandhāya ‘yaṃ idan’ti… attho»; DA. ii 88: «yadidaṃ jātīti ettha yadidanti nipāto, tassa sabbapadesu liṅgānurūpato attho veditabbo»; MA. i 98 (P i 95) and Sārattha-ṭ. i 193: «yadidanti nipāto. Sabbaliṅgavibhattivacanesu tādisova, tattha tattha atthato pariṇāmetabbo»; Vis-ṭ. i 12: «yadidanti nipāto, ye imeti attho»."}},{"id":"n-yadipi","lema":"yadipi","nuevo":true,"cab":{"es":"**yadipi**, (ind.) Aunque, aun si. Sinónimo de *kiñcāpi*.","en":"**yadipi**, (ind.) Although, even if. Synonym of *kiñcāpi*."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Concesión:","en":"Concession:"},{"tipo":"ej","pali":"yadipi, mahārāja, lokadhātusatasahassesu ye keci sattanikāyapariyāpannā sabbepi te sattihatthā ekaṃ arahantaṃ upadhāvitvā tāseyyuṃ, na bhaveyya arahato cittassa kiñci aññathattaṃ","ref":"Mil. 205","es":"Aunque, gran rey, todos los seres comprendidos en cien mil sistemas de mundos, lanza en mano, corrieran contra un solo arahant para aterrorizarlo, no habría en la mente del arahant alteración alguna.","en":"Even if, great king, all beings included in a hundred thousand world-systems, spear in hand, were to rush at a single arahant to terrify him, there would be no alteration whatever in the arahant's mind."}],"notas":[],"fuente":{"es":"Comentario: MṬ. i 186: «kiñcāpīti ayaṃ ‘yadipī’ti iminā samānattho nipāto»; MA. i 99 glosa kiñcāpi con yadipi: «idaṃ vuttaṃ hoti – yadipi so bhikkhu…». La ṭīkā llama nipāta a *kiñcāpi* y dice que equivale a *yadipi*; de *yadipi* mismo no se ha hallado que se diga «nipāto». *yadipi* = *yadi* + *pi*.","en":"Commentary: MṬ. i 186: «kiñcāpīti ayaṃ ‘yadipī’ti iminā samānattho nipāto»; MA. i 99 glosses kiñcāpi with yadipi: «idaṃ vuttaṃ hoti – yadipi so bhikkhu…». The ṭīkā calls *kiñcāpi* a nipāta and says it is equivalent to *yadipi*; it has not been found said of *yadipi* itself that it is a «nipāto». *yadipi* = *yadi* + *pi*."}},{"id":"n-yannuna","lema":"yannūna","nuevo":true,"cab":{"es":"**yannūna**, (ind.) ¿Y si…?, ¿qué tal si…?; expresa una reflexión o deliberación, con optativo.","en":"**yannūna**, (ind.) What if…?, suppose…; expresses reflection or deliberation, with the optative."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Exposición de una reflexión (*parivitakkadassana*):","en":"Showing a reflection (*parivitakkadassana*):"},{"tipo":"ej","pali":"yaṃnūnāhaṃ kesamassuṃ ohāretvā kāsāyāni vatthāni acchādetvā agārasmā anagāriyaṃ pabbajeyyaṃ","ref":"D. i 56","es":"¿Y si yo, rapándome cabello y barba y vistiendo ropas ocres, saliera del hogar a la vida sin hogar?","en":"What if I were to shave off my hair and beard, put on ochre robes and go forth from home into homelessness?"}],"notas":[],"fuente":{"es":"Comentario: VinA. i 211: «yaṃnūnāti parivitakkadassane nipāto. Idaṃ vuttaṃ hoti – sacāhaṃ buddhaṃ paccakkheyyaṃ, sādhu vata me siyāti»; DṬ. ii 57 y Sārattha-ṭ. ii 2: «yannūnāti parivitakkanatthe nipāto»; DṬ. i 362: «kiriyāpadena vuccamāno eva hi attho yannūnāti nipātapadena jotīyati».","en":"Commentary: VinA. i 211: «yaṃnūnāti parivitakkadassane nipāto. Idaṃ vuttaṃ hoti – sacāhaṃ buddhaṃ paccakkheyyaṃ, sādhu vata me siyāti»; DṬ. ii 57 and Sārattha-ṭ. ii 2: «yannūnāti parivitakkanatthe nipāto»; DṬ. i 362: «kiriyāpadena vuccamāno eva hi attho yannūnāti nipātapadena jotīyati»."}},{"id":"yasma","lema":"yasmā","cab":{"es":"**yasmā**, (sc. *yasmāt*) Partícula de delimitación de causa (*kāraṇacchedana*). Porque; ya que; pues; debido a que. Correlativo de **tasmā**.","en":"**yasmā**, (Skt. *yasmāt*) Particle delimiting a cause (*kāraṇacchedana*). Because; since; for; owing to the fact that. Correlative of **tasmā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yasmā ca kho, bhikkhave, rūpaṃ anattā, tasmā rūpaṃ ābādhāya saṃvattati","ref":"S. ii 55","es":"Porque, bhikkhus, la materia es no alma, ésta conduce a la aflicción.","en":"Because, bhikkhus, form is non-self, therefore form leads to affliction."}],"notas":[],"avisos_en":[]},{"id":"n-yahim","lema":"yahiṃ","nuevo":true,"cab":{"es":"**yahiṃ**, (adv. relativo de lugar, 7.ª) Donde, en el lugar en que (= *yasmiṃ*). Correlativo de **tahiṃ**.","en":"**yahiṃ**, (relative adv. of place, 7th case) Where, in the place in which (= *yasmiṃ*). Correlative of **tahiṃ**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"mayampi kho, bhikkhu, na jānāma yattha vā brahmā yena vā brahmā yahiṃ vā brahmā","ref":"D. i 211","es":"Tampoco nosotros, bhikkhu, sabemos dónde está Brahmā, por dónde, ni en qué lugar.","en":"We too, bhikkhu, do not know where Brahmā is, by what way, or in what place."},{"tipo":"txt","es":"Con el correlativo **tahiṃ**:","en":"With the correlative **tahiṃ**:"},{"tipo":"ej","pali":"yahiṃ yahiṃ gacchati puññakammo, tahiṃ tahiṃ modati kāmakāmī","ref":"Vv. 120","es":"Adondequiera que vaya quien ha hecho méritos, allí se regocija, obteniendo lo que desea.","en":"Wherever the doer of merit goes, there he rejoices, getting what he desires."}],"notas":[],"fuente":{"es":"Saddanīti §504 (Suttamālā, ed. Smith, p. 682): «Yasmā hiṃ: yahiṃ · yasmiṃ yesu vā»; Abhidhānappadīpikā v. 1156. Rūpasiddhi (p. 124): «yato hiṃ … yasmin ti yahiṃ». Moggallāna (p. 167): «yato hiṃ vā hoti: yahiṃ yatra». Bālāvatāra (M 127): «Yato hiṃ’ti hiṃ. Yahiṃ». No se ha hallado un comentario que lo llame expresamente *nipāta*; las gramáticas lo derivan con el sufijo *hiṃ* del pronombre *ya*.","en":"Saddanīti §504 (Suttamālā, Smith ed., p. 682): «Yasmā hiṃ: yahiṃ · yasmiṃ yesu vā»; Abhidhānappadīpikā v. 1156. Rūpasiddhi (p. 124): «yato hiṃ … yasmin ti yahiṃ». Moggallāna (p. 167): «yato hiṃ vā hoti: yahiṃ yatra». Bālāvatāra (M 127): «Yato hiṃ’ti hiṃ. Yahiṃ». No commentary has been found that explicitly calls it a *nipāta*; the grammars derive it from the pronoun *ya* with the suffix *hiṃ*."}},{"id":"n-yam","lema":"yaṃ","nuevo":true,"cab":{"es":"**yaṃ**, (ind.) Porque, puesto que; que (expletivo); en reproche, «¡que tú…!».","en":"**yaṃ**, (ind.) Because, since; that (expletive); in reproach, «that you…!»."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Desprecio (*hīḷana*):","en":"Contempt (*hīḷana*):"},{"tipo":"ej","pali":"tattha nāma tvaṃ, moghapurisa, yaṃ tvaṃ asaddhammaṃ gāmadhammaṃ vasaladhammaṃ duṭṭhullaṃ odakantikaṃ rahassaṃ dvayaṃdvayasamāpattiṃ samāpajjissasi","ref":"V. i 24","es":"¡Que en ello, hombre necio, tú —¡precisamente tú!— hayas ido a entregarte a lo contrario a la buena conducta, a la costumbre aldeana, vulgar, burda, que acaba en lavado, secreta, a la unión en pareja!","en":"That in this, foolish man, you — you of all people! — should have engaged in what is contrary to the true teaching, the village custom, vulgar, coarse, ending in ablution, secret, coupling in pairs!"},{"tipo":"txt","es":"Causa (*hetu*), = *yasmā*:","en":"Cause (*hetu*), = *yasmā*:"},{"tipo":"ej","pali":"yaṃ taṃ ariyā ācikkhanti – upekkhako satimā sukhavihārī","ref":"D. i 34","es":"por lo cual los nobles declaran: «ecuánime, atento, vive felizmente».","en":"on account of which the noble ones declare: «equanimous, mindful, one dwells happily»."}],"notas":[],"fuente":{"es":"Comentarios: VinA. i 185 (sobre el primer ejemplo): «yaṃ tvanti ettha yanti hīḷanatthe nipāto. Tvanti taṃ-saddassa vevacanaṃ. Dvīhipi yaṃ vā taṃ vā hīḷitaṃ avaññātanti vuttaṃ hoti»; Vis-ṭ. i 188 (sobre la fórmula del tercer jhāna): «yanti hetu-atthe nipāto, yasmāti attho. Tenāha ‘yaṃjhānahetū’ti»; DṬ. i 21: «yaṃ pāpabhikkhūti ettha yanti nipātamattaṃ, kāraṇaniddeso vā»; DA. i 101: «yanti nipātamattaṃ». Abhidhānappadīpikā v. 1145: «yaṃ taṃ yato tato yena, tene’ti kāraṇe siyuṃ». Bālāvatāra (M 130) incluye *yaṃ* en su lista de nipātas. *yaṃ* es normalmente el relativo neutro (*ya-*); los comentarios lo tratan como nipāta solo en estos usos adverbiales o expletivos.","en":"Commentaries: VinA. i 185 (on the first example): «yaṃ tvanti ettha yanti hīḷanatthe nipāto. Tvanti taṃ-saddassa vevacanaṃ. Dvīhipi yaṃ vā taṃ vā hīḷitaṃ avaññātanti vuttaṃ hoti»; Vis-ṭ. i 188 (on the third-jhāna formula): «yanti hetu-atthe nipāto, yasmāti attho. Tenāha ‘yaṃjhānahetū’ti»; DṬ. i 21: «yaṃ pāpabhikkhūti ettha yanti nipātamattaṃ, kāraṇaniddeso vā»; DA. i 101: «yanti nipātamattaṃ». Abhidhānappadīpikā v. 1145: «yaṃ taṃ yato tato yena, tene’ti kāraṇe siyuṃ». Bālāvatāra (M 130) includes *yaṃ* in its list of nipātas. *yaṃ* is normally the neuter relative (*ya-*); the commentaries treat it as a nipāta only in these adverbial or expletive uses."}},{"id":"yava","lema":"yāva","cab":{"es":"**yāva**, (sc. *yāvat*) Partícula de delimitación (*paricchedana*). Hasta; mientras; siempre y cuando. Se usa con **tāva**; yāva puede ser usada para referirse al futuro; véase también **pure** y **purā**.","en":"**yāva**, (Skt. *yāvat*) Particle of delimitation (*paricchedana*). Until; as long as; while; provided that. It is used with **tāva**; yāva can be used to refer to the future; see also **pure** and **purā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yāv’ assa kāyo ṭhassati, tāva naṃ dakkhanti devamanussā","ref":"D. i 42","es":"mientras su cuerpo permanezca, entonces, devas y hombres lo verán.","en":"As long as his body remains, so long will devas and humans see him."},{"tipo":"ej","pali":"yāvāhaṃ āgacchāmi, tāva idh’ eva hotha","ref":"JA. ii 249","es":"esté aquí hasta que yo regrese.","en":"Stay right here until I come back."},{"tipo":"ej","pali":"yāva brahmalokā saddo abbhugacchi","ref":"S. iii 371","es":"el sonido se extendió hasta el mundo de los Brahmas.","en":"The sound rose up as far as the Brahma world."}],"notas":[],"avisos_en":["block 1: *hotha* is 2nd pl. imperative; Spanish «esté» is singular; English 'stay' covers both."]},{"id":"yavata","lema":"yāvatā","cab":{"es":"**yāvatā**, (= sc.) Partícula de delimitación (*paricchedana*). Hasta; mientras; porque. Se usa generalmente con **tāvatā**.","en":"**yāvatā**, (= Skt.) Particle of delimitation (*paricchedana*). As far as; as long as; because. Generally used with **tāvatā**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"yāvatā, bhikkhave, sattāvāsā, yāvatā bhavaggaṃ, ete aggo, ete seṭṭhā lokasmiṃ yadidaṃ arahanto","ref":"S. ii 68","es":"en donde hay moradas de seres, hasta la existencia más alta, los Arahants son los mejores, los superiores en el universo.","en":"As far, bhikkhus, as there are abodes of beings, as far as the peak of existence, these are the foremost, these are the best in the world, namely the arahants."},{"tipo":"ej","pali":"yāvatā, bhikkhave, dhammā saṅkhatā vā asaṅkhatā vā, virāgo tesaṃ aggam akkhāyati","ref":"Iti. 254","es":"bhikkhus, mientras haya fenómenos condicionados, incondicionados, la ausencia de pasión, entre esos [estados], es considerada superior.","en":"As far, bhikkhus, as there are things, whether conditioned or unconditioned, dispassion is declared the foremost of them."},{"tipo":"ej","pali":"na tāvatā dhammadharo, yāvatā bahu bhāsati","ref":"Dh. 50","es":"uno no es poseedor del Dhamma porque habla mucho.","en":"One is not a bearer of the Dhamma merely because one speaks much."}],"notas":[],"avisos_en":["block 1: Spanish «mientras haya» ('while there are'); the Pāḷi *yāvatā* here is extent ('as far as there are' = 'of all things'); rendered 'as far as'."]},{"id":"n-rattam","lema":"rattaṃ","nuevo":true,"cab":{"es":"**rattaṃ**, (adv.) De noche. Variante de lectura de *nattaṃ* en Abhidhānappadīpikā v. 1147.","en":"**rattaṃ**, (adv.) At night. Variant reading for *nattaṃ* in Abhidhānappadīpikā v. 1147."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"De noche (*rajanī*):","en":"At night (*rajanī*):"}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1147 lee en el texto «nattaṃ doso divā tva’he»; *rattaṃ* es solo una variante de lectura de *nattaṃ*, señalada en nota como «rattaṃ (ṭī.)», es decir, atribuida a la tradición de la ṭīkā (aunque la ṭīkā en CST, Abh-ṭ. 600, lee «nattaṃ doso ca rajanīyamiccatthe»). Payogasiddhi (M 105) incluye «divā rattaṃ» entre los nipātas de tiempo, donde Rūpasiddhi (M 134) lee «divā nattaṃ». No se ha hallado en CST *rattaṃ* con el sentido «de noche»: sus ocurrencias son el participio de √*rañj* («teñido, apegado»).","en":"Abhidhānappadīpikā v. 1147 reads in the text «nattaṃ doso divā tva’he»; *rattaṃ* is only a variant reading for *nattaṃ*, noted as «rattaṃ (ṭī.)», i.e. attributed to the ṭīkā tradition (although the ṭīkā in CST, Abh-ṭ. 600, reads «nattaṃ doso ca rajanīyamiccatthe»). Payogasiddhi (M 105) lists «divā rattaṃ» among the nipātas of time, where Rūpasiddhi (M 134) reads «divā nattaṃ». *rattaṃ* in the sense “at night” has not been found in CST: its occurrences are the participle of √*rañj* (“dyed, attached”)."}},{"id":"ratti","lema":"ratti","cab":{"es":"**ratti**, (sc. *rātri*) (part. usada en la 7ª inflexión —tiempo) Noche.","en":"**ratti**, (Skt. *rātri*) (particle used in the 7th case — time) Night."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"rahita","lema":"rahitā","cab":{"es":"**rahitā**, (del sc. *rahita*) Indica separación (*vippayoga*). Mismo significado que **vinā** y **rite**.","en":"**rahitā**, (from Skt. *rahita*) Indicates separation (*vippayoga*). Same meaning as **vinā** and **rite**."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"rahitā mātujā puññaṃ katvā dānaṃ deti","ref":"Kac. §272","es":"","en":"Apart from his mother, having made merit, he gives a gift."}],"notas":[],"avisos_en":["block 0: Spanish translation is empty in the source; English supplied from the Pāḷi. Uncertain reading: *mātujā* (abl. of a stem *mātu-*? or *mātujā* 'born of a mother'?) — sense 'apart from/without the mother' is a tentative guess; please check against Kacc. §272 vutti."]},{"id":"raho","lema":"raho","cab":{"es":"**raho**, (sc. *rahas*) (part..usada en 7ª inflexión) En privado; en secreto. Es opuesto de **āvi**.","en":"**raho**, (Skt. *rahas*) (particle used in the 7th case) In private; in secret. It is the opposite of **āvi**."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"āvi c’ eva raho ca","ref":"D. ii 67","es":"en público y en privado.","en":"Both openly and in secret."},{"tipo":"ej","pali":"natthi loke raho nāma, pāpakammaṃ pakubbato","ref":"A. i 147","es":"no hay secreto en el mundo cuando uno realiza una mala acción.","en":"For one who does an evil deed, there is no such thing as secrecy in the world."}],"notas":[],"avisos_en":[]},{"id":"rite","lema":"rite","cab":{"es":"**rite**, (sc. *ṛte*) Sin, excepto, aparte. Indica separación (*vippayoga*).","en":"**rite**, (Skt. *ṛte*) Without, except, apart from. Indicates separation (*vippayoga*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"rite saddhammā kuto sukhaṃ labhati","ref":"Kac. §272","es":"¿de dónde uno obtiene felicidad aparte del buen Dhamma?","en":"Without the true Dhamma, whence does one obtain happiness?"}],"notas":[],"avisos_en":[]},{"id":"re","lema":"re","cab":{"es":"**re**, (= sc.) (intj., voc., sg. y pl., m., coloquial) Partícula vocativa usada en lenguaje abusivo (*hiṃsālapana*).","en":"**re**, (= Skt.) (interj., voc., sg. and pl., m., colloquial) Vocative particle used in abusive address (*hiṃsālapana*)."},"caso":["1v"],"nir":"","bloques":[{"tipo":"ej","pali":"ehi re dāsa","ref":"JA. i 242","es":"¡eh esclavo, ven!","en":"Hey, slave, come here!"}],"notas":[],"avisos_en":[]},{"id":"labbha","lema":"labbhā","cab":{"es":"**labbhā**, (sc. *labhya*) (part.,1ª inflexión) Posible; obtenible.","en":"**labbhā**, (Skt. *labhya*) (particle, 1st case) Possible; obtainable."},"caso":["1"],"nir":"","bloques":[{"tipo":"ej","pali":"Taṃ kut’ ettha, ānanda, labbhā","ref":"D. ii 99","es":"¿Ānanda, aquí, cómo es posible?","en":"How could that be possible here, Ānanda?"}],"notas":[],"avisos_en":[]},{"id":"lahu","lema":"lahu","cab":{"es":"**lahu**, Partícula de asentimiento; respuesta afirmativa; aceptación (*sampaṭicchana*). Sí; bien; está bien.","en":"**lahu**, Particle of assent; affirmative reply; acceptance (*sampaṭicchana*). Yes; good; all right."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"lahū ti","ref":"V. iii 57","es":"sí.","en":"“Yes.”"}],"notas":[],"avisos_en":["block 0: followed Nandisena's 'yes'; could not verify the context at V. iii 57."]},{"id":"lahu-2","lema":"lahu","cab":{"es":"**lahu**, (sc. *laghu*) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, de prisa, aprisa.","en":"**lahu**, (Skt. *laghu*) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, hastily, swiftly."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"lahum","lema":"lahuṃ","cab":{"es":"**lahuṃ** (sc. *laghu*) (adv.) En el significado de rápido (*sīghattha*). Rápidamente, pronto, de prisa, aprisa.","en":"**lahuṃ** (Skt. *laghu*) (adv.) In the sense of quick (*sīghattha*). Quickly, soon, hastily, swiftly."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"lahuṃ uppajjati","ref":"DhA. i 187","es":"surge rápidamente.","en":"It arises quickly."}],"notas":[],"avisos_en":[]},{"id":"va","lema":"va","cab":{"es":"**va**, (part.) Expletivo (*padapūraṇa*).","en":"**va**, (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"n-vassam","lema":"vassaṃ","nuevo":true,"cab":{"es":"**vassaṃ**, (ind.) Ciertamente, necesariamente, sin falta (*nicchaya*); = *avassaṃ*.","en":"**vassaṃ**, (ind.) Certainly, necessarily, without fail (*nicchaya*); = *avassaṃ*."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Certeza (*nicchaya*). Con la forma *avassaṃ* (la que explica la ṭīkā):","en":"Certainty (*nicchaya*). With the form *avassaṃ* (the one explained by the ṭīkā):"},{"tipo":"ej","pali":"āsā nāma vuccati yā bhavissassa atthassa āsīsanā, avassaṃ āgamissatīti āsāssa uppajjati","ref":"Netti. 45","es":"Se llama *āsā* (esperanza) al anhelo de una cosa futura: surge en él la esperanza de que «vendrá sin falta».","en":"What is called *āsā* (hope) is the longing for a future thing: the hope arises in him that “it will certainly come.”"},{"tipo":"ej","pali":"Yañhi akātumpi vaṭṭati, taṃ kiccanti vuccati, yaṃ avassaṃ kātabbameva, taṃ karaṇīyaṃ nāma","ref":"DA. i 276","es":"lo que también es admisible no hacer se llama *kicca*; lo que ha de hacerse necesariamente se llama *karaṇīya*.","en":"what may also be left undone is called *kicca*; what must necessarily be done is called *karaṇīya*."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1150, texto principal: «antarena’ntarā anto, vassaṃ nūna ca nicchaye». Su ṭīkā (Abh-ṭ., M 601) explica en cambio *avassaṃ*: «antarena antarā anto cā ti ete abbhantare iccatthe; avassaṃ nūna ca nicchayatthe». No se ha hallado en CST *vassaṃ* suelto con este sentido; los ejemplos tienen la forma *avassaṃ*.","en":"Abhidhānappadīpikā v. 1150, main text: «antarena’ntarā anto, vassaṃ nūna ca nicchaye». Its ṭīkā (Abh-ṭ., M 601) explains *avassaṃ* instead: «antarena antarā anto cā ti ete abbhantare iccatthe; avassaṃ nūna ca nicchayatthe». *vassaṃ* on its own in this sense has not been found in CST; the examples have the form *avassaṃ*."}},{"id":"va-2","lema":"vā","cab":{"es":"**vā**, (= sc.) O. Nunca se usa al comienzo de la oración. Usualmente se repite.","en":"**vā**, (= Skt.) Or. It is never used at the beginning of a sentence. It is usually repeated."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Disyunción (*vikappana*):","en":"Disjunction (*vikappana*):"},{"tipo":"ej","pali":"devo vā māro vā","ref":"Kv. 332","es":"deva o Māra.","en":"A deva or Māra."},{"tipo":"ej","pali":"khattiyo vā brāhmaṇo vā vesso vā suddo vā","ref":"M. ii 92","es":"guerrero o brahmán o mercader o siervo.","en":"A warrior or a brahmin or a merchant or a menial."},{"tipo":"txt","es":"Comparación (*upamāna*):","en":"Comparison (*upamāna*):"},{"tipo":"ej","pali":"madhu vā maññati","ref":"Dh. 23","es":"piensa que es como la miel.","en":"[The fool] thinks it [is] like honey."},{"tipo":"txt","es":"Agrupación; agregación; colección (*samuccaya*):","en":"Grouping; aggregation; collection (*samuccaya*):"},{"tipo":"ej","pali":"Pāṭaliputtassa kho, Ānanda, tayo antarāyā bhavissanti: aggito vā udakato vā mithubhedā vā","ref":"D. ii 74","es":"Ānanda, Pāṭaliputta tendrá tres peligros: fuego, agua y disensión interna. En este ejemplo, la partícula **vā** se usa en el sentido normal de **ca**, es decir, incluye o agrupa las tres alternativas.","en":"Ānanda, there will be three dangers for Pāṭaliputta: from fire, from water, and from internal dissension. In this example the particle **vā** is used in the ordinary sense of **ca**, that is, it includes or groups together the three alternatives."},{"tipo":"txt","es":"Alternativa fija (*vavatthitavibhāsā*):","en":"Fixed option (*vavatthitavibhāsā*):"},{"tipo":"ej","pali":"vā paro asarūpā","ref":"Kac. §13","es":"opcionalmente la [vocal se elide] cuando está precedida por una [vocal] disimilar. Éste es un aforismo del primer capítulo acerca de la combinación eufónica de la antigua gramática *Kaccāyana*. La partícula **vā** aquí limita la aplicación de la regla.","en":"Optionally, the following [vowel is elided] after a dissimilar [vowel]. This is an aphorism from the first chapter, on euphonic combination, of the ancient grammar *Kaccāyana*. Here the particle **vā** limits the application of the rule."},{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."}],"notas":[],"avisos_en":["block 4: *madhu vā maññati* is Dh. 69 (*madhuvā maññati bālo*); the reference 'Dh. 23' in the source may be a page number — left unchanged."]},{"id":"vata","lema":"vata","cab":{"es":"**vata**, (= sc.) (part.) Seguramente, ciertamente, realmente, en verdad, definitivamente; ¡ay! Existe en los siguientes significados:","en":"**vata**, (= Skt.) (particle) Surely, certainly, really, truly, definitely; alas! It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Certeza, certidumbre (*ekaṃsa*):","en":"Certainty, assurance (*ekaṃsa*):"},{"tipo":"ej","pali":"accheraṃ vata lokasmiṃ, uppajjanti vicakkhaṇā","ref":"J. ii 184","es":"¡oh es ciertamente maravilloso que los sabios aparezcan en el mundo!","en":"Truly it is a marvel in the world that the wise arise!"},{"tipo":"txt","es":"Aflicción; pesar (*kheda*):","en":"Distress; sorrow (*kheda*):"},{"tipo":"ej","pali":"kicchaṃ vatāyaṃ loko āpanno","ref":"D. ii 26","es":"¡ay este mundo está en dificultad!","en":"Alas, this world has fallen into trouble!"},{"tipo":"txt","es":"Compasión (*anukampā*):","en":"Compassion (*anukampā*):"},{"tipo":"ej","pali":"Kapaṇo vatāyaṃ bhikkhu, muṇḍo saṅghāṭipāruto; amātiko apitiko, rukkhamūlasmi jhāyati","ref":"J. ii 53","es":"¡ay, este pobre bhikkhu, rapado, envuelto en su hábito, sin madre, sin padre, medita al pie del árbol!","en":"Alas, this poor bhikkhu, shaven-headed, wrapped in his outer robe, motherless, fatherless, meditates at the foot of a tree!"},{"tipo":"txt","es":"Intención, propósito, motivo (*saṅkappa*):","en":"Intention, purpose, motive (*saṅkappa*):"},{"tipo":"ej","pali":"aho vatāyaṃ dubbaṇṇo assa","ref":"Vis. i 290","es":"¡que él sea feo!","en":"Oh, may he be ugly!"}],"notas":[],"avisos_en":[]},{"id":"vatha","lema":"vatha","cab":{"es":"**vatha**, (part.) (Rū. 132). Expletivo (*padapūraṇa*).","en":"**vatha**, (particle) (Rū. 132). Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"vina","lema":"vinā","cab":{"es":"**vinā**, (= sc.) (prep., part. 3ª inflexión) Sin, excepto. Indica separación (*vippayoga*).","en":"**vinā**, (= Skt.) (prep., particle, 3rd case) Without, except. Indicates separation (*vippayoga*)."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"saṃgho saha vā gaggena vinā vā gaggena uposathaṃ karissati","ref":"V. iii 166","es":"La Orden hará Uposatha con Gagga o sin Gagga.","en":"The Order will hold the Uposatha with Gagga or without Gagga."}],"notas":[],"avisos_en":[]},{"id":"viya","lema":"viya","cab":{"es":"**viya**, = **iva**. Se usa en el sentido de analogía; símil; comparación; semejanza (*paṭibhāga*). Así; así como; de esta manera.","en":"**viya**, = **iva**. It is used in the sense of analogy; simile; comparison; likeness (*paṭibhāga*). Thus; just as; in this way."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"visum","lema":"visuṃ","cab":{"es":"**visuṃ**, (sc. *viṣu*) Particula que denota diferenciación, separación (*asaṅghāta*). Separadamente; individualmente; aparte.","en":"**visuṃ**, (Skt. *viṣu*) Particle denoting differentiation, separation (*asaṅghāta*). Separately; individually; apart."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sace pan’ ettha bahū bhikkhū visuṃ visuṃ kammaṃ karonti","ref":"VA. iii 334","es":"si aquí muchos bhikkhus realizan el acto separadamente.","en":"If here many bhikkhus perform the act each separately."}],"notas":[],"avisos_en":[]},{"id":"ve","lema":"ve","cab":{"es":"**ve**, (sc. *vai*) (part., adv., Cf. **have**) Ciertamente, realmente, verdaderamente. Existe en los siguientes significados:","en":"**ve**, (Skt. *vai*) (particle, adv., cf. **have**) Certainly, really, truly. It is used in the following senses:"},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Expletivo (*padapūraṇa*).","en":"Expletive (*padapūraṇa*)."},{"tipo":"txt","es":"Certidumbre, certeza (*ekaṃsa*):","en":"Certainty, assurance (*ekaṃsa*):"},{"tipo":"ej","pali":"na vāyaṃ kumārako mattam aññāsi","ref":"S. i 418","es":"este joven ciertamente no conoce su medida.","en":"This boy certainly did not know his measure."},{"tipo":"txt","es":"Resolución, decisión (*vavassagga*):","en":"Resolution, decision (*vavassagga*):"},{"tipo":"ej","pali":"dadāti ve yathāsaddhaṃ yathāpasādanaṃ jano","ref":"Dh. 49","es":"La gente da de acuerdo con su fe y de acuerdo con su satisfacción.","en":"People indeed give according to their faith, according to their confidence."}],"notas":[],"avisos_en":["block 2: *aññāsi* is aorist ('did not know'); Spanish has present «no conoce»."]},{"id":"vo","lema":"vo","cab":{"es":"**vo**, (part.) Expletivo (*padapūraṇa*).","en":"**vo**, (particle) Expletive (*padapūraṇa*)."},"caso":[],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"n-sanam","lema":"sanaṃ","nuevo":true,"cab":{"es":"**sanaṃ**, (ind.) Siempre, perpetuamente.","en":"**sanaṃ**, (ind.) Always, perpetually."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Perpetuidad (*nicca*).","en":"Perpetuity (*nicca*)."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1153 («nicce sadā sanaṃ sanā (ka.)»); Abhidhānappadīpikāṭīkā vv. 1152–1153 (M 602): «Sadāsaddo, sanaṃsaddo cāti nicce. Sanasaddopyatra». No se ha hallado en CST *sanaṃ* ni *sanā* con este sentido.","en":"Abhidhānappadīpikā v. 1153; Abhidhānappadīpikāṭīkā vv. 1152–1153 (M 602): «Sadāsaddo, sanaṃsaddo cāti nicce. Sanasaddopyatra». Neither *sanaṃ* nor *sanā* in this sense has been found in CST."}},{"id":"n-sapadi","lema":"sapadi","nuevo":true,"cab":{"es":"**sapadi**, (sc. *sapadi*) (ind.) Al instante, inmediatamente.","en":"**sapadi**, (Skt. *sapadi*) (ind.) Instantly, immediately."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"En ese mismo instante (*taṅkhaṇa*):","en":"At that very moment (*taṅkhaṇa*):"},{"tipo":"ej","pali":"Aññāsuṃ maggadhammaṃ parimitarahite cakkavāḷe uḷāro, obhāso pātubhuto sapadi bahuvidhaṃ āsi accherakañca","ref":"Dāṭh. v. 62","es":"comprendieron el dhamma del sendero; en los sistemas de mundos sin límite se manifestó al instante un gran resplandor, y hubo maravillas de muchas clases.","en":"they understood the Dhamma of the path; in the boundless world-systems a vast radiance instantly appeared, and there were marvels of many kinds."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1149 («taṅkhaṇe sajju sapadi»); Abhidhānappadīpikāṭīkā v. 1149 (M 601): «Sajju sapadisaddā taṅkhaṇetyatthe». No se ha hallado *sapadi* en el canon, las aṭṭhakathās ni las ṭīkās de CST; solo en Dāṭhāvaṃsa (poema tardío; el fichero de CST no da paginación M ni PTS, por lo que se cita por verso).","en":"Abhidhānappadīpikā v. 1149; Abhidhānappadīpikāṭīkā v. 1149 (M 601): «Sajju sapadisaddā taṅkhaṇetyatthe». *sapadi* has not been found in the canon, aṭṭhakathās or ṭīkās of CST; only in the Dāṭhāvaṃsa (a late poem; the CST file gives no M or PTS pagination, so it is cited by verse)."}},{"id":"n-sabbato","lema":"sabbato","nuevo":true,"cab":{"es":"**sabbato**, (adv.) Por todas partes, por todos lados; desde todo. Sinónimo de *samantato*, *parito*, *samantā*.","en":"**sabbato**, (adv.) On all sides, all around; from everything. Synonym of *samantato*, *parito*, *samantā*."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"Por todos lados (*samantato*):","en":"On all sides (*samantato*):"},{"tipo":"ej","pali":"viññāṇaṃ anidassanaṃ, anantaṃ sabbato pabhaṃ","ref":"D. i 213","es":"La conciencia invisible, sin fin, accesible por todos lados.","en":"Consciousness that is invisible, endless, accessible on all sides."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1146 («sabbato ca samantato, parito ca samantā»); Abh-ṭ. 600: «sabbato samantato parito samantā cāti cattāro tulyatthā». Kaccāyana, Nāmakappa «kvaci to pañcamyatthe» (Kacc. M 129: sabbato yato tato…); Rūpasiddhi M 120. Rūpasiddhi (vibhattippaccayavidhāna, M 120–123) dice de estas formas en -to, -tra/-tha, -dhi: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («por carecer de género y ser nipātas, su forma es la misma en los tres géneros y en ambos números»). Para el ejemplo, DA. i 325 explica: «sabbato pabhamassāti sabbatopabhaṃ» (pabha = vado, tittha: el nibbāna tiene acceso por todos lados). En «sabbato pabhaṃ» la interpretación varía: DA lo toma como «con vados por todos lados»; MA. ii 310, como «sabbaso pabhāsampannaṃ» (luminoso en todo); se sigue la de DA por corresponder al pasaje de D. *sabbato* es también ablativo adverbial de *sabba* («desde todo, como todo», p. ej. M. i 4 «sabbaṃ sabbato sañjānāti»); Abhidhānappadīpikā lo registra solo en el sentido de *samantato*.","en":"Abhidhānappadīpikā v. 1146 («sabbato ca samantato, parito ca samantā»); Abh-ṭ. 600: «sabbato samantato parito samantā cāti cattāro tulyatthā». Kaccāyana, Nāmakappa «kvaci to pañcamyatthe» (Kacc. M 129: sabbato yato tato…); Rūpasiddhi M 120. Rūpasiddhi (vibhattippaccayavidhāna, M 120–123) says of these forms in -to, -tra/-tha, -dhi: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («because they are genderless and are nipātas, their form is the same in the three genders and both numbers»). For the example, DA. i 325 explains: «sabbato pabhamassāti sabbatopabhaṃ» (pabha = ford, tittha: nibbāna is accessible on all sides). In «sabbato pabhaṃ» the interpretation varies: DA takes it as “with fords on all sides”; MA. ii 310 as «sabbaso pabhāsampannaṃ» (luminous throughout); DA’s is followed as it belongs to the D passage. *sabbato* is also the adverbial ablative of *sabba* (“from all, as all”, e.g. M. i 4 «sabbaṃ sabbato sañjānāti»); the Abhidhānappadīpikā records it only in the sense of *samantato*."}},{"id":"n-sabbatra","lema":"sabbatra","nuevo":true,"cab":{"es":"**sabbatra**, (adv.) En todas partes; en todo (lugar, tiempo, caso). Sinónimo de *sabbattha*.","en":"**sabbatra**, (adv.) Everywhere; in every (place, time, case). Synonym of *sabbattha*."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"En todo (*sabbasmiṃ*):","en":"In all (*sabbasmiṃ*):"},{"tipo":"ej","pali":"āgato yathā tathā āgato ti sabbatra sambandho","ref":"Sīl-abhinavaṭ. i 246","es":"«Así como llegó [Vipassī, etc.], así llegó [el Bhagavā]»: tal es la construcción en todos [los miembros].","en":"“As [Vipassī, etc.] came, so [the Blessed One] came”: such is the construction in every [clause]."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1161 («sabbatra sabbadhi»); Abh-ṭ. 604: «sabbasmiṃ kālādike sabbatrādidvayaṃ» (el par sabbatra y sabbadhi, en el sentido de «en todo tiempo, etc.»). Kaccāyana, Nāmakappa «tratha sattamiyā sabbanāmehi» (Kacc. M 130: sabbatra sabbattha); Rūpasiddhi M 123; Niruttidīpanī M 152. Rūpasiddhi (vibhattippaccayavidhāna, M 120–123) dice de estas formas en -to, -tra/-tha, -dhi: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («por carecer de género y ser nipātas, su forma es la misma en los tres géneros y en ambos números»). No se ha hallado *sabbatra* en los textos canónicos (mūla) de CST, solo en gramáticas, nīti y ṭīkās.","en":"Abhidhānappadīpikā v. 1161 («sabbatra sabbadhi»); Abh-ṭ. 604: «sabbasmiṃ kālādike sabbatrādidvayaṃ» (the pair sabbatra and sabbadhi, in the sense «in every time, etc.»). Kaccāyana, Nāmakappa «tratha sattamiyā sabbanāmehi» (Kacc. M 130: sabbatra sabbattha); Rūpasiddhi M 123; Niruttidīpanī M 152. Rūpasiddhi (vibhattippaccayavidhāna, M 120–123) says of these forms in -to, -tra/-tha, -dhi: «tesaṃ panāliṅgattā nipātattā ca tiliṅge vacanadvaye ca samānaṃ rūpaṃ» («because they are genderless and are nipātas, their form is the same in the three genders and both numbers»). *sabbatra* has not been found in the canonical (mūla) texts of CST, only in grammars, nīti works and ṭīkās."}},{"id":"n-sabbatha","lema":"sabbathā","nuevo":true,"cab":{"es":"**sabbathā**, (adv.) De todos los modos, en todos los aspectos (*sabbākārena*); en la fórmula *sabbena sabbaṃ sabbathā sabbaṃ* «total y absolutamente».","en":"**sabbathā**, (adv.) In every way, in every respect (*sabbākārena*); in the formula *sabbena sabbaṃ sabbathā sabbaṃ* “totally and absolutely”."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"jāti ca hi, ānanda, nābhavissa sabbena sabbaṃ sabbathā sabbaṃ kassaci kimhici","ref":"D. ii 48","es":"si no hubiera, Ānanda, total y absolutamente nacimiento alguno, de nadie en ninguna parte…","en":"if, Ānanda, there were no birth at all, in any way, of anyone anywhere…"}],"notas":[],"fuente":{"es":"Sumaṅgalavilāsinī (DA. ii 87): «sabbena sabbaṃ sabbathā sabban ti nipātadvayametaṃ, tassattho sabbākārena sabbā sabbena sabhāvena sabbā jāti nāma yadi na bhaveyyā ti». Niruttidīpanī (p. 155): con 3.ª elidida. Sumaṅgalavilāsinī llama nipāta al par *sabbena sabbaṃ* / *sabbathā sabbaṃ* («nipātadvayaṃ»), no a *sabbathā* aislado.","en":"Sumaṅgalavilāsinī (DA. ii 87): «sabbena sabbaṃ sabbathā sabban ti nipātadvayametaṃ, tassattho sabbākārena sabbā sabbena sabhāvena sabbā jāti nāma yadi na bhaveyyā ti». Niruttidīpanī (p. 155): with the 3rd case elided. The Sumaṅgalavilāsinī calls the pair *sabbena sabbaṃ* / *sabbathā sabbaṃ* a nipāta («nipātadvayaṃ»), not *sabbathā* on its own."}},{"id":"n-sabbadhi","lema":"sabbadhi","nuevo":true,"cab":{"es":"**sabbadhi**, (adv.) En todas partes; en todo; en todos los respectos.","en":"**sabbadhi**, (adv.) Everywhere; in everything; in every respect."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"En todo (*sabbasmiṃ*):","en":"In all (*sabbasmiṃ*):"},{"tipo":"ej","pali":"gataddhino visokassa, vippamuttassa sabbadhi; sabbaganthappahīnassa, pariḷāho na vijjati","ref":"Dh. 26","es":"Para quien ha completado el viaje, libre de pesar, liberado en todo, que ha abandonado todos los nudos, no existe la fiebre [de las pasiones].","en":"For one who has completed the journey, sorrowless, released in every respect, who has abandoned all ties, no fever [of passion] exists."},{"tipo":"ej","pali":"namo te buddha vīratthu, vippamuttosi sabbadhi","ref":"S. i 48","es":"¡Homenaje a ti, Buddha, héroe! Estás liberado en todo.","en":"Homage to you, Buddha, hero! You are released in every respect."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1161; Abh-ṭ. 604 («sabbasmiṃ kālādike sabbatrādidvayaṃ»). Kaccāyana, Nāmakappa «sabbato dhi» («sabba iccetasmā dhi paccayo hoti kvaci sattamyatthe»; Kacc. M 130); Rūpasiddhi M 123; Moggallāna M 167 («sabbā vā sattamyantato sabbasmā dhi vā hoti»). Comentarios: DhA. i 383 «sabbadhīti sabbesu khandhādidhammesu»; SA. i 100 «sabbadhīti sabbesu khandha-āyatanādīsu».","en":"Abhidhānappadīpikā v. 1161; Abh-ṭ. 604 («sabbasmiṃ kālādike sabbatrādidvayaṃ»). Kaccāyana, Nāmakappa «sabbato dhi» («sabba iccetasmā dhi paccayo hoti kvaci sattamyatthe»; Kacc. M 130); Rūpasiddhi M 123; Moggallāna M 167. Commentaries: DhA. i 383 «sabbadhīti sabbesu khandhādidhammesu»; SA. i 100 «sabbadhīti sabbesu khandha-āyatanādīsu»."}},{"id":"n-sabbaso","lema":"sabbaso","nuevo":true,"cab":{"es":"**sabbaso**, (adv.) Completamente, en todos sus aspectos (*sabbākārena*); de todos sin excepción (*anavasesa*).","en":"**sabbaso**, (adv.) Completely, in every respect (*sabbākārena*); of all without exception (*anavasesa*)."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sabbaso bhave asati bhavanirodhā api nu kho jāti paññāyethā","ref":"D. ii 49","es":"si no hubiera en absoluto existencia, por la cesación de la existencia, ¿se discerniría acaso el nacimiento?","en":"if there were no becoming at all, with the cessation of becoming, would birth be discerned?"},{"tipo":"ej","pali":"sabbaso rūpasaññānaṃ samatikkamā","ref":"D. i 170","es":"por la completa superación de las percepciones de forma.","en":"through the complete surmounting of perceptions of form."}],"notas":[],"fuente":{"es":"Niruttidīpanī (p. 155): «yathā tathā sabbathā sabbaso musā micchā iccādīhi tatiyāya [lopo]». Aṭṭhasālinī (DhsA. 245): «sabbaso ti sabbākārena, sabbāsaṃ vā anavasesānan ti attho». No se ha hallado un comentario que lo llame expresamente *nipāta*; Niruttidīpanī lo trata como indeclinable tras el cual se elide la 3.ª.","en":"Niruttidīpanī (p. 155): «yathā tathā sabbathā sabbaso musā micchā iccādīhi tatiyāya [lopo]». Aṭṭhasālinī (DhsA. 245): «sabbaso ti sabbākārena, sabbāsaṃ vā anavasesānan ti attho». No commentary has been found that explicitly calls it a *nipāta*; the Niruttidīpanī treats it as an indeclinable after which the 3rd case is elided."}},{"id":"n-sahasa","lema":"sahasā","nuevo":true,"cab":{"es":"**sahasā**, (sc. *sahasā*) (ind.) De repente, de improviso; precipitadamente, sin reflexionar.","en":"**sahasā**, (Skt. *sahasā*) (ind.) Suddenly, unexpectedly; rashly, without reflection."},"caso":[],"nir":"","bloques":[{"tipo":"txt","es":"De improviso (*atakkita*):","en":"Unexpectedly (*atakkita*):"},{"tipo":"ej","pali":"sakuṇagghi lāpaṃ sakuṇaṃ sahasā ajjhappattā aggahesi","ref":"S. iii 127","es":"un halcón, abalanzándose de repente sobre una codorniz, la atrapó.","en":"a hawk, swooping down suddenly on a quail, seized it."},{"tipo":"txt","es":"Precipitadamente, sin reflexionar:","en":"Rashly, without reflection:"},{"tipo":"ej","pali":"Addhāyasmantehi nigaṇṭhehi sahasā appaṭisaṅkhā vācā bhāsitā","ref":"M. i 131","es":"ciertamente, los venerables nigaṇṭhas pronunciaron (esas) palabras precipitadamente, sin reflexionar.","en":"surely the venerable Nigaṇṭhas spoke (those) words rashly, without reflection."}],"notas":[],"fuente":{"es":"Abhidhānappadīpikā v. 1148 («sahasā tu atakkite»); Abhidhānappadīpikāṭīkā v. 1148 (M 601): «Atakkite avitakkite. Balakkāre tu sāhasaṃ»; MA. i 369 (P ii 65), sobre M. i 131: «Sahasā appaṭisaṅkhāti sāhasaṃ katvā, appaccavekkhitvāva»; MṬ (M ii 48): «Sahasāti ravā». Ninguna de las fuentes consultadas lo llama expresamente nipāta; figura solo en la sección de indeclinables de Abhidhānappadīpikā.","en":"Abhidhānappadīpikā v. 1148; Abhidhānappadīpikāṭīkā v. 1148 (M 601): «Atakkite avitakkite. Balakkāre tu sāhasaṃ»; MA. i 369 (P ii 65), on M. i 131: «Sahasā appaṭisaṅkhāti sāhasaṃ katvā, appaccavekkhitvāva»; MṬ (M ii 48): «Sahasāti ravā». None of the sources consulted explicitly calls it a nipāta; it appears only in the indeclinables section of the Abhidhānappadīpikā."}},{"id":"sam","lema":"saṃ","cab":{"es":"**saṃ**, (sc. *sva, svayaṃ*) (part. usada en 3ª inflexión) Por uno mismo.","en":"**saṃ**, (Skt. *sva, svayaṃ*) (particle used in the 3rd case) By oneself."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"sammā-sam-buddho","ref":"D. ii 2","es":"el completamente Iluminado. Aquí **sammā** significa correctamente (*aviparītena*) y **sam**, por sí mismo (*attanā*).","en":"the Rightly Self-Awakened One. Here **sammā** means correctly (*aviparītena*) and **sam**, by oneself (*attanā*)."}],"notas":[],"avisos_en":["block 0: the reference (D. ii 2) sits inside the Spanish text (ref field empty); kept in the English. Spanish «el completamente Iluminado» rendered 'Rightly Self-Awakened' to match Nandisena's own gloss (sammā = correctly, sam = by oneself)."]},{"id":"sakim","lema":"sakiṃ","cab":{"es":"**sakiṃ**, (sc. *sakṛt*) sufijo usado en la partición de números (*saṅkhyāvibhāga*). Una vez.","en":"**sakiṃ**, (Skt. *sakṛt*) suffix used in the division of numbers (*saṅkhyāvibhāga*). Once."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sakiṃ nimuggo","ref":"A. ii 403","es":"sumergido una vez.","en":"Submerged once."},{"tipo":"sub","es":"**sakid eva**, sólo una vez.","en":"**sakid eva**, only once."},{"tipo":"ej","pali":"sakid eva imaṃ lokaṃ āgantvā dukkhass antaṃ karoti","ref":"A. ii 404","es":"habiendo regresado sólo una vez a este mundo, pone un fin al sufrimiento.","en":"Having come back to this world only once, he makes an end of suffering."}],"notas":[],"avisos_en":[]},{"id":"sakka","lema":"sakkā","cab":{"es":"**sakkā**, (sc. *śakyāt*) (part., 1ª inflexión) Es posible.","en":"**sakkā**, (Skt. *śakyāt*) (particle, 1st case) It is possible."},"caso":["1"],"nir":"","bloques":[{"tipo":"ej","pali":"sakkā, bhikkhave, akusalaṃ pajahituṃ","ref":"A. i 59","es":"es posible, bhikkhus, abandonar los estados insanos.","en":"it is possible, bhikkhus, to abandon the unwholesome."}],"notas":[],"avisos_en":["block 0: reference (A. i 59) sits inside the Spanish text (ref field empty); kept in the English."]},{"id":"sakkhi","lema":"sakkhi","cab":{"es":"**sakkhi**, (sc. sākṣin) (part. 3ª inflexión) Cara a cara; con los propios ojos; por uno mismo.","en":"**sakkhi**, (Skt. sākṣin) (particle, 3rd case) Face to face; with one's own eyes; by oneself."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"sāhaṃ dāni sakkhi jānāmi","ref":"S. i 27","es":"ahora yo conozco con mí misma.","en":"Now I myself know [it] at first hand."}],"notas":[],"avisos_en":["block 0: *sā 'haṃ* is feminine ('I, she'); Spanish «con mí misma» marks this; English cannot."]},{"id":"sace","lema":"sace","cab":{"es":"**sace**, (*sa + ce*) Si. Tiene el mismo significado que **ce** y a diferencia de éste se utiliza al comienzo de la oración.","en":"**sace**, (*sa + ce*) If. It has the same meaning as **ce** and, unlike it, is used at the beginning of the sentence."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"sace labhetha nipakaṃ sahāyaṃ","ref":"Dh. 60","es":"si uno encontrara un compañero sagaz.","en":"If one should find a prudent companion."}],"notas":[],"avisos_en":[]},{"id":"sacchi","lema":"sacchi","cab":{"es":"**sacchi**, (sc. de *sākṣāt*) partícula que expresa aquello que ha sido puesto en frente de los ojos (*paccakkha*), es decir, experimentado, realizado, alcanzado.","en":"**sacchi**, (Skt. from *sākṣāt*) particle expressing what has been placed before the eyes (*paccakkha*), that is, experienced, realized, attained."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"paṇḍito nibbānaṃ sacchi karoti","ref":"DhA. ii 171","es":"el sabio experimenta el Nibbāna.","en":"The wise one realizes Nibbāna."}],"notas":[],"avisos_en":[]},{"id":"sajja","lema":"sajja","cab":{"es":"**sajja**, véase **sajju**.","en":"**sajja**, see **sajju**."},"caso":["7"],"nir":"","bloques":[],"notas":[],"avisos_en":[]},{"id":"sajju","lema":"sajju","cab":{"es":"**sajju** (sc. *sadyas*) (part. usada en la 7ª inflexión —tiempo) Inmediatamente; ahora mismo; en seguida; de repente; en ese momento (*taṅkhaṇe*).","en":"**sajju** (Skt. *sadyas*) (particle used in the 7th case — time) Immediately; right now; at once; suddenly; at that moment (*taṅkhaṇe*)."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"na hi pāpaṃ kataṃ kammaṃ, sajju khīraṃ ’va muccati","ref":"Dh. 23","es":"una mala acción no madura inmediatamente, como la leche no se coagula de repente.","en":"For an evil deed, once done, does not [bear fruit] at once, just as fresh milk does not [curdle at once]."}],"notas":[],"avisos_en":["block 0: *muccati* (lit. 'is released/turns') is elliptical; bracketed words supplied from the traditional reading (Dh. 71), agreeing with Nandisena."]},{"id":"sancicca","lema":"sañcicca","cab":{"es":"**sañcicca**, (*saṃ + citya; saṃ + cintya*) partícula que expresa intención. Intencionalmente; con intención; con propósito.","en":"**sañcicca**, (*saṃ + citya; saṃ + cintya*) particle expressing intention. Intentionally; deliberately; on purpose."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"abhabbo, āvuso, khīṇāsavo bhikkhu sañcicca pāṇaṃ jīvitā voropetuṃ","ref":"D. iii 110","es":"amigos, no es posible que el bhikkhu que ha extinguido los contaminantes despoje intencionalmente de la vida a un ser viviente.","en":"Friends, a bhikkhu whose taints are destroyed is incapable of intentionally depriving a living being of life."}],"notas":[],"avisos_en":[]},{"id":"sanikam","lema":"saṇikaṃ","cab":{"es":"**saṇikaṃ**, (sc. de *śanaiḥ*) En el significado de lento (*manda*). Lentamente; despacio.","en":"**saṇikaṃ**, (Skt. from *śanaiḥ*) In the sense of slow (*manda*). Slowly; gently."},"caso":[],"nir":"","bloques":[{"tipo":"ej","pali":"saṇikaṃ kilissati","ref":"JA. i 11","es":"se contamina lentamente.","en":"It becomes defiled slowly."}],"notas":[],"avisos_en":[]},{"id":"satatam","lema":"satataṃ","cab":{"es":"**satataṃ**, (= sc.) (part. usada en la 7ª inflexión —tiempo) Continuamente, constantemente, siempre.","en":"**satataṃ**, (= Skt.) (particle used in the 7th case — time) Continually, constantly, always."},"caso":["7"],"nir":"2","bloques":[{"tipo":"ej","pali":"bhikkhu satataṃ appamatto hoti","ref":"Vis. i 231","es":"el bhikkhu es siempre vigilante.","en":"The bhikkhu is constantly heedful."}],"notas":[],"avisos_en":[]},{"id":"sada","lema":"sadā","cab":{"es":"**sadā**, (= sc.) (part. usada en la 7ª inflexión —tiempo) Siempre.","en":"**sadā**, (= Skt.) (particle used in the 7th case — time) Always."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"pamādo garahito sadā","ref":"Dh. 17","es":"la negligencia es siempre censurada.","en":"Negligence is always censured."}],"notas":[],"avisos_en":[]},{"id":"saddhim","lema":"saddhiṃ","cab":{"es":"**saddhiṃ**, (sc. *sārdham*) (prep., part. 3ª inflexión) Con, junto a. Indica acción simultánea (*samakriyā*).","en":"**saddhiṃ**, (Skt. *sārdham*) (prep., particle, 3rd case) With, together with. Indicates simultaneous action (*samakriyā*)."},"caso":["3"],"nir":"","bloques":[{"tipo":"ej","pali":"puttena saddhiṃ avippavāsaṃ","ref":"","es":"no separación con su hijo.","en":"Not being separated from [one's] son."},{"tipo":"ej","pali":"mayā saddhiṃ gamissati","ref":"AA. i 237","es":"irá conmigo.","en":"He will go with me."},{"tipo":"ej","pali":"bhagavā mahatā bhikkhusaṃghena saddhiṃ","ref":"D. ii 69","es":"el Sublime junto a la gran comunidad de bhikkhus.","en":"The Blessed One together with a large community of bhikkhus."}],"notas":[],"avisos_en":[]},{"id":"sabbada","lema":"sabbadā","cab":{"es":"**sabbadā**, (sc. *sarvadā*) (part. usada en la 7ª inflexión —tiempo) Siempre.","en":"**sabbadā**, (Skt. *sarvadā*) (particle used in the 7th case — time) Always."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"dukkho bālehi saṃvāso, amitten eva sabbadā","ref":"Dh. 44","es":"La asociación con los necios es siempre sufrimiento, como vivir con un enemigo.","en":"Living with fools is always painful, as [is living] with an enemy."}],"notas":[],"avisos_en":[]},{"id":"samam","lema":"samaṃ","cab":{"es":"**samaṃ**, (= sc.) (adv., part. 3ª inflexión) Igualmente; igual, similar; junto con.","en":"**samaṃ**, (= Skt.) (adv., particle, 3rd case) Equally; equal, similar; together with."},"caso":["3"],"nir":"","bloques":[{"tipo":"txt","es":"En la tercera inflexión:","en":"In the third case:"},{"tipo":"ej","pali":"sahassena samaṃ mitā","ref":"S. i 18","es":"un valor similar a mil.","en":"Measured as equal to a thousand."},{"tipo":"ej","pali":"tassābhisekena samaṃ","ref":"Mahāvaṃsa V 23","es":"a partir de su consagración.","en":"Simultaneously with his consecration."},{"tipo":"txt","es":"Acción simultánea (*samakriyā*).","en":"Simultaneous action (*samakriyā*)."},{"tipo":"ej","pali":"samaṃ devehi","ref":"D.ii 229","es":"junto con devas. Aquí **samaṃ** tiene el mismo significado que **saddhiṃ**.","en":"Together with the devas. Here **samaṃ** has the same meaning as **saddhiṃ**."}],"notas":[],"avisos_en":["block 2: Spanish «a partir de su consagración» ('from his consecration onward'); *samaṃ* + instr. means 'at the same time as / together with his consecration'."]},{"id":"samantato","lema":"samantato","cab":{"es":"**samantato**, (sc. *samanta*) (part. usada en la 7ª inflexión) En todas partes; todo alrededor; en todos los lados; cerca (*samīpa*).","en":"**samantato**, (Skt. *samanta*) (particle used in the 7th case) Everywhere; all around; on all sides; near (*samīpa*)."},"caso":["7"],"nir":"5","bloques":[{"tipo":"ej","pali":"samantato dvādasa yojanāni","ref":"D. ii 115","es":"doce leguas todo alrededor.","en":"Twelve yojanas all around."}],"notas":[],"avisos_en":[]},{"id":"samanta","lema":"samantā","cab":{"es":"**samantā**, (sc. *samanta*) (part. usada en la 7ª inflexión) En todas partes (*sabbadhi*); todo alrededor; en todos los lados. Véase **sāmantā**.","en":"**samantā**, (Skt. *samanta*) (particle used in the 7th case) Everywhere (*sabbadhi*); all around; on all sides. See **sāmantā**."},"caso":["7"],"nir":"5","bloques":[{"tipo":"ej","pali":"samantā vesāliṃ","ref":"D. ii 84","es":"alrededor de Vesālī.","en":"All around Vesālī."},{"tipo":"ej","pali":"samantā yojanaṃ passati divā c’ eva rattiñ ca","ref":"D. ii 17","es":"ve por una legua todo alrededor día y noche.","en":"He sees for a yojana all around, by day and by night."}],"notas":[],"avisos_en":[]},{"id":"sampati","lema":"sampati","cab":{"es":"**sampati**, (sc. *samprati*) (part. usada en la 7ª inflexión —tiempo) Ahora (*idāni*); ahora mismo; en este momento; recién.","en":"**sampati**, (Skt. *samprati*) (particle used in the 7th case — time) Now (*idāni*); right now; at this moment; just."},"caso":["7"],"nir":"","bloques":[{"tipo":"ej","pali":"sampatijāto bodhisatto","ref":"D. ii 13","es":"el Bodhisatta recién nacido.","en":"The Bodhisatta, just born."}],"notas":[],"avisos_en":[]},{"id":"samma","lema":"samma","cab":{"es":"**samma**, (sc. śam) (part. voc., sg.) ¡Amigo! ¡Querido! Término familiar para dirigirse a amigos, iguales e inferiores.","en":"**samma**, (Skt. śam) (particle, voc., sg.) Friend! D
