<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml">
<title>__ES_TITULO__</title>
<meta name="version" content="__VERSION__">
<!-- La letra birmana de las citas del libro; las tres del sitio las pone cabecera.insertar. -->
<link href="https://fonts.googleapis.com/css2?family=Padauk&display=swap" rel="stylesheet">
<style>
/* Guía para el estudiante del análisis de los suttas. La paleta, la letra,
   el bloque del título y el pie son comunes: site/assets/base.css y
   site/assets/recursos.css (etapa 4b). Aquí, lo de una página de prosa. */
:root{--mya:"Padauk","Myanmar Text","Noto Sans Myanmar",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{line-height:1.6}
.wrap{max-width:780px}
/* el texto de la guía */
.guia{padding:10px 0 20px}
.guia h2{font-size:24px;line-height:1.2;margin:34px 0 8px;font-weight:700}
.guia h3{font-size:19px;margin:26px 0 6px;font-weight:700}
.guia h4,.guia h5{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin:22px 0 4px}
.guia p{margin:0 0 12px}
.guia a{color:var(--accent)}
.guia ul{margin:0 0 12px;padding-left:22px}
.guia li{margin:0 0 4px}
.guia ul.num{list-style:none;padding-left:0}
.guia code{font-family:var(--mono);font-size:.86em;background:var(--accent-bg);border-radius:2px;padding:0 3px}
.guia blockquote{margin:0 0 12px;border-left:2px solid var(--haritala);padding-left:12px;color:var(--text2)}
.guia hr{border:0;border-top:1px solid var(--border);margin:26px 0}
.guia .my{font-family:var(--mya);font-size:.92em}
.doc-tabla-wrap{margin:6px 0 16px}
.doc-tabla{width:100%;border-collapse:collapse;font-size:15px}
.doc-tabla th{text-align:left;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);
  padding:8px;border-bottom:1px solid var(--text2);vertical-align:bottom}
.doc-tabla td{padding:8px;border-bottom:1px solid var(--border);vertical-align:baseline}
@media (max-width:760px){.wrap{padding:0 16px}}
</style>
</head>
<body>
<rc-titulo>
  <rc-volver id="volver" href="../">← Análisis de los suttas de Kaccāyana</rc-volver>
  <rc-ceja>Instituto de Estudios Buddhistas Hispano</rc-ceja>
  <rc-h1 id="h1">__ES_H1__</rc-h1>
  <rc-insignias><span class="borrador" id="etiqueta">Borrador</span><button type="button" id="lang-btn"><span class="lang-seg" data-l="es">ES</span><span class="lang-seg" data-l="en">EN</span></button><button type="button" class="icon-btn" id="theme" aria-label="Claro / oscuro">◐</button></rc-insignias>
</rc-titulo>

<main class="wrap">
<article class="guia" id="guia-es" lang="es">
__ES__
</article>
<article class="guia" id="guia-en" lang="en" hidden>
__EN__
</article>
</main>

<rc-pie>
<rc-extra><p><a href="../" id="volver-pie">← Análisis de los suttas de Kaccāyana</a></p></rc-extra>
<rc-licencia><span id="lic">Material de estudio del Instituto de Estudios Buddhistas Hispano (IEBH). Copyright © 2026 IEBH.</span></rc-licencia>
</rc-pie>

<script>
(function(){
/* Las dos lenguas viajan en la página; el interruptor enseña una u otra, con
   la misma regla que el análisis (?lang= o la clave pali_lang del sitio). */
const H=/*__TITULOS__*/{}/*__FIN__*/;
const T={
  es:{titulo:H.es.titulo,h1:H.es.h1,volver:'← Análisis de los suttas de Kaccāyana',draft:'Borrador',
    lic:'Material de estudio del Instituto de Estudios Buddhistas Hispano (IEBH). Copyright © 2026 IEBH.',
    otra:'View this page in English',tema:'Claro / oscuro'},
  en:{titulo:H.en.titulo,h1:H.en.h1,volver:'← Analysis of the Kaccāyana suttas',draft:'Draft',
    lic:'Study material of the Instituto de Estudios Buddhistas Hispano (IEBH). Copyright © 2026 IEBH.',
    otra:'Ver esta página en español',tema:'Light / dark'}};
const root=document.documentElement;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const mq=c=>{try{return !!(window.matchMedia&&matchMedia(c).matches)}catch(e){return false}};
function paliLang(){const g=store.get('pali_lang');if(g==='en'||g==='es')return g;
  const n=(navigator.languages&&navigator.languages[0])||navigator.language||'';return /^en\b/i.test(n)?'en':'es'}
let lang=(new URLSearchParams(location.search).get('lang')||paliLang())==='en'?'en':'es';
function pintar(){
  const t=T[lang];root.lang=lang;document.title=t.titulo;
  document.getElementById('h1').textContent=t.h1;
  document.getElementById('guia-es').hidden=lang!=='es';
  document.getElementById('guia-en').hidden=lang!=='en';
  ['volver','volver-pie'].forEach(id=>{const a=document.getElementById(id);a.textContent=t.volver;a.href='../?lang='+lang});
  document.getElementById('etiqueta').textContent=t.draft;
  document.getElementById('lic').textContent=t.lic;
  document.getElementById('theme').setAttribute('aria-label',t.tema);
  const lb=document.getElementById('lang-btn');
  lb.querySelectorAll('.lang-seg').forEach(x=>x.classList.toggle('lang-cur',x.dataset.l===lang));
  lb.title=t.otra;lb.setAttribute('aria-label',t.otra);
}
document.getElementById('lang-btn').onclick=()=>{lang=lang==='en'?'es':'en';store.set('pali_lang',lang);pintar()};
/* tema, compartido con el sitio (pali_dark) */
const saved=store.get('pali_dark');
if(saved==='1'||(saved===null&&mq('(prefers-color-scheme: dark)')))root.dataset.theme='dark';
document.getElementById('theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'':'dark';store.set('pali_dark',root.dataset.theme==='dark'?'1':'0')};
pintar();
})();
</script>
</body>
</html>
