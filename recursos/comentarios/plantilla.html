<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<title>Comentarios de la escuela de Kaccāyana</title>
<meta name="version" content="__VERSION__">
<meta name="version-date" content="__VERSION_DATE__">
<meta name="description" content="Tabla de referencia de los comentarios y tratados de la escuela gramatical de Kaccāyana: autor, fecha, lugar, relación con Kaccāyana, sección de Ñāṇatusita y texto en línea.">
<style>
/* La paleta, la letra, el bloque del título, el índice lateral, la barra
   de mandos, el globo, el ↑ y el pie son comunes: site/assets/base.css y
   site/assets/recursos.css (etapa 4b). Aquí, lo que sólo tiene esta página. */
html{scroll-padding-top:calc(var(--cabecera-h,0px) + var(--barh,74px) + 10px)}

/* índice lateral: una línea por sutta; los capítulos (.sb-ch) contienen kaṇḍas (.sb-sec) */
.sidebar a{padding:2px 18px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar a b{display:inline-block;min-width:3.2em}
.sidebar a i{font-style:italic}
.sb-ch>summary{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text);padding:12px 14px 4px 8px;cursor:pointer;list-style:none;user-select:none}
.sb-ch>summary::-webkit-details-marker{display:none}
.sb-ch>summary::before{content:'▸';flex:0 0 12px;font-size:10px;opacity:.8}
.sb-ch[open]>summary::before{content:'▾'}
.sb-ch>summary .gl{flex:1;min-width:0}
.sb-ch>summary .n,.sb-ch>summary .rg,.sb-sec>summary .n,.sb-sec>summary .rg{color:var(--text2);font-weight:400;letter-spacing:0;text-transform:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.sb-ch>summary .n:empty,.sb-sec>summary .n:empty{display:none}
.sb-ch>summary .n,.sb-sec>summary .n{color:var(--haritala)}
/* con filtro activo: el número de aforismos visibles sustituye al rango */
.sb-ch.flt>summary .rg,.sb-sec.flt>summary .rg{display:none}
.sb-ch>summary:hover{background:var(--bg)}
.sb-ch>summary:focus-visible,.sb-sec>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sb-ch .sb-sec>summary{padding-left:20px}
.sb-ch.on:not([open])>summary{background:var(--bg);box-shadow:inset 2px 0 0 var(--haritala)}
.sb-sec>summary .gl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-sec.on:not([open])>summary{background:var(--bg);box-shadow:inset 2px 0 0 var(--haritala)}

.aviso{margin:0 0 16px;max-width:66ch;font-size:14.5px;color:var(--text2);border-left:2px solid var(--rakta);padding-left:10px}

#ftog{display:none}
.ext{display:contents}

.gl{border-bottom:1px dotted var(--accent);cursor:help}
.gl:focus-visible{outline:2px solid var(--haritala);outline-offset:1px}
#tip.glosa{pointer-events:auto}
#tip .gd{margin:0;font-size:15px}
#tip .te a{color:var(--accent)}
#tip.llano i{font-weight:700}
footer.rc-pie p{max-width:78ch}

@media print{.bar,.sidebar,#top-btn,.mas{display:none!important}body{padding-left:0}tr.det-row[hidden]{display:table-row!important}}

.tag a,main a{color:var(--accent)}
.sidebar a.sec-l{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 18px 3px;white-space:normal}
/* secciones */
section.sec{margin:34px 0 0}
section.sec h2{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
section.sec[hidden]{display:none}
/* la tabla se desplaza dentro de su caja, nunca la página */
.tabla-caja{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:2px;background:var(--bg2);margin-top:10px;max-width:100%}
table.co{border-collapse:separate;border-spacing:0;font-size:14.5px;min-width:1040px;width:100%}
table.co thead th{position:sticky;top:0;text-align:left;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text2);background:var(--bg2);padding:9px 10px 7px;border-bottom:1.5px solid var(--text);vertical-align:bottom}
table.co td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45}
table.co tr:last-child td{border-bottom:0}
table.co td.ob{width:20%;min-width:190px}
table.co td.au{width:15%}
table.co td.fe,table.co td.lu{width:9%}
table.co td.re{width:18%}
table.co td.nn{font-family:var(--mono);font-size:11.5px;color:var(--text2);white-space:nowrap;width:1%}
table.co td.tx{width:20%;min-width:210px;font-size:14px}
/* la primera columna queda fija al desplazar en horizontal */
table.co th:first-child,table.co td.ob{position:sticky;left:0;z-index:1;background:var(--bg2);box-shadow:1px 0 0 var(--border)}
table.co thead th:first-child{z-index:2}
table.co tr.r:hover td{background:var(--bg)}
table.co tr.r.marca td{background:var(--hl)}
table.co tr.r[hidden]{display:none}
.propio{display:inline-block;padding-left:8px;border-left:2px solid var(--haritala);margin:1px 0}
.propio.prep{color:var(--text2);font-style:italic}
details.plegable{margin:14px 0 0;max-width:86ch;border-top:1px solid var(--border)}
details.plegable>summary{cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);padding:9px 0 7px;list-style:none}
details.plegable>summary::-webkit-details-marker{display:none}
details.plegable>summary::before{content:'▸ '}
details.plegable[open]>summary::before{content:'▾ '}
details.plegable>div{font-size:15px;line-height:1.5;padding:0 0 12px}
details.plegable p{margin:0 0 8px}
.prosa{max-width:86ch;font-size:15.5px}
.prosa ol,.prosa ul{padding-left:1.4em;margin:8px 0}
.prosa li{margin:0 0 8px}
.prosa p{margin:8px 0}
.atrib{max-width:86ch;margin:0 0 10px}
@media (max-width:760px){
  .wrap{padding:0 16px}
  table.co{font-size:14px;min-width:900px}
  /* la columna fija deja ver, al lado, casi dos tercios de la caja */
  table.co th:first-child,table.co td.ob{width:40vw;min-width:130px;max-width:40vw;font-size:13.5px;padding-left:8px;padding-right:8px;overflow-wrap:break-word}
}
</style>
</head>
<body>
<nav class="sidebar" id="sidebar" aria-label="Índice">
  <button class="sb-close" id="sbclose" aria-label="Ocultar el índice">☰</button>
  <div class="sb-brand"><b data-t="title_short">Comentarios de Kaccāyana</b><span class="lbl" data-t="sb_sub">Tabla de referencia</span></div>
  <div id="sb-list"></div>
</nav>
<div class="scrim" id="scrim"></div>
<button id="volver-barra" aria-label="Mostrar el índice">☰</button>

<rc-titulo>
  <rc-ceja>Instituto de Estudios Buddhistas Hispano</rc-ceja>
  <rc-h1 id="h1">Comentarios y tratados de la escuela gramatical de Kaccāyana</rc-h1>
  <rc-desc id="entradilla"></rc-desc>
  <rc-insignias><span class="borrador" data-t="draft">Borrador</span><span class="version-badge" id="vbadge"></span><button type="button" id="lang-btn"><span class="lang-seg" data-l="es">ES</span><span class="lang-seg" data-l="en">EN</span></button></rc-insignias>
  <rc-debajo>
  <details class="plegable"><summary data-t="how_sum">Cómo leer esta tabla</summary><div data-t-html="how"></div></details>
  </rc-debajo>
</rc-titulo>

<div class="bar" id="bar"><div class="wrap">
  <button class="icon-btn" id="burger" aria-label="Índice">☰</button>
  <input type="search" id="q" aria-label="Buscar">
  <button class="icon-btn" id="theme" aria-label="Claro / oscuro">◐</button>
  <span class="count" id="count"></span>
</div></div>

<main class="wrap" id="out"></main>
<div class="wrap"><div class="empty" id="empty" hidden><p data-t="empty">Ninguna obra coincide.</p></div></div>
<button id="top-btn" aria-label="↑">↑</button>
<div id="tip" role="tooltip" aria-hidden="true"></div>

<rc-pie>
<rc-extra>
  <p class="aviso" data-t-html="aviso"></p>
  <p class="atrib" id="atrib"></p>
  <p class="version-foot" id="vfoot"></p>
</rc-extra>
<rc-licencia><span data-t-html="lic"></span></rc-licencia>
</rc-pie>

<script>
(function(){
const D=/*__DATOS__*/{}/*__FIN__*/;
const T={
es:{title_short:'Comentarios de Kaccāyana',sb_sub:'Tabla de referencia',back:'← Recursos · Gramáticas Pāḷi',draft:'Borrador',
  search:'Buscar obra, autor, lugar o fecha',empty:'Ninguna obra coincide.',ver:'Versión',
  rows:n=>n+(n===1?' obra':' obras'),
  how_sum:'Cómo leer esta tabla',
  how:'<p>Cada fila es una obra de la escuela de Kaccāyana. La columna «Ñ» da el número de sección de Bhikkhu Ñāṇatusita, <i>Reference Table of Pāli Literature</i> (2008); «?» marca lo dudoso. En «Texto en línea» va primero el material de este sitio, con filete a la izquierda (lo que está en preparación, sin enlace), y después los enlaces externos. En el móvil, la tabla se desplaza en horizontal dentro de su caja; la columna de la obra queda fija.</p><p>El buscador mira todas las columnas de la tabla en la lengua de la página, sin distinguir acentos ni mayúsculas.</p>',
  aviso:'<b>Borrador.</b> Tabla de referencia en revisión: fechas y atribuciones según las fuentes citadas; donde discrepan se dan las alternativas.',
  lic:'Material del Instituto de Estudios Buddhistas Hispano (IEBH).<br>Este material puede ser reproducido para uso personal y distribuido de forma gratuita.<br>Copyright © 2026 Instituto de Estudios Buddhistas Hispano (IEBH). Publicado bajo licencia <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.es" rel="license noopener" target="_blank">CC&nbsp;BY-NC-ND&nbsp;4.0</a>.'},
en:{title_short:'Kaccāyana commentaries',sb_sub:'Reference table',back:'← Resources · Pāḷi Grammars',draft:'Draft',
  search:'Search work, author, place or date',empty:'No work matches.',ver:'Version',
  rows:n=>n+(n===1?' work':' works'),
  how_sum:'How to read this table',
  how:'<p>Each row is a work of the Kaccāyana school. The «Ñ» column gives the section number in Bhikkhu Ñāṇatusita, <i>Reference Table of Pāli Literature</i> (2008); «?» marks what is doubtful. Under «Online text», this site\'s own material comes first, with a rule on its left (what is in preparation, without a link), followed by the external links. On a phone the table scrolls sideways inside its box; the work column stays in place.</p><p>Search covers every column of the table in the page language, ignoring diacritics and case.</p>',
  aviso:'<b>Draft.</b> Reference table under review: dates and attributions follow the sources cited; where they disagree, the alternatives are given.',
  lic:'Material of the Instituto de Estudios Buddhistas Hispano (IEBH).<br>This material may be reproduced for personal use and distributed free of charge.<br>Copyright © 2026 Instituto de Estudios Buddhistas Hispano (IEBH). Published under the <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" rel="license noopener" target="_blank">CC&nbsp;BY-NC-ND&nbsp;4.0</a> licence.'}};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFC').normalize('NFD').replace(/\p{M}/gu,'').replace(/[ŋŊ]/g,'n').toLowerCase();
const root=document.documentElement;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const mq=c=>{try{return !!(window.matchMedia&&matchMedia(c).matches)}catch(e){return false}};
/* Lengua: la misma regla que en todo el sitio (clave pali_lang). */
function paliLang(){const g=store.get('pali_lang');if(g==='en'||g==='es')return g;
  const n=(navigator.languages&&navigator.languages[0])||navigator.language||'';return /^en\b/i.test(n)?'en':'es'}
let lang=(new URLSearchParams(location.search).get('lang')||paliLang())==='en'?'en':'es';
const CLS=['ob','au','fe','lu','re','nn','tx'];

/* ---------- glosario de los globos (recursos/terminos/terminos.json) ----------
   Como en /recursos/analisis/: primera aparición de cada término por celda o
   párrafo; nunca dentro de un enlace. Los nombres de obra llevan su globo
   «obra» (sólo la descripción). */
const GL=D.terminos||[],GK={},GF=[];
GL.forEach(t=>{GK[t.clave]=t;t.formas.forEach(f=>GF.push([f,t.clave]))});
GF.sort((a,b)=>b[0].length-a[0].length);
const GFK={};GF.forEach(([f,k])=>GFK[f.toLowerCase()]=k);
/* Sólo nombres enteros (2026-10-03): una forma pegada a un guion o a un
   paréntesis forma parte de otro título —«Mukhamattadīpanī-purāṇaṭīkā» es una
   ṭīkā sobre el Nyāsa, no el Nyāsa; «Bālāvatāra-(purāṇa)ṭīkā», «Rūpasiddhi-
   sannaya»— y no lleva el globo de la obra. */
const GRE=GF.length?new RegExp('(?<![\\p{L}\\p{M}\\-‐)])('+GF.map(([f])=>f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{M}\\-‐(])','giu'):null;
function glosar(el){
  if(!GRE||!el)return;
  const vistos=new Set();
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:x=>x.parentElement.closest('a,button,[data-g]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodos=[];while(w.nextNode())nodos.push(w.currentNode);
  nodos.forEach(nd=>{
    const t=nd.nodeValue;let m,frag=null,ult=0;GRE.lastIndex=0;
    while((m=GRE.exec(t))){
      const k=GFK[m[1].toLowerCase()];if(!k||vistos.has(k))continue;
      vistos.add(k);
      frag=frag||document.createDocumentFragment();
      frag.appendChild(document.createTextNode(t.slice(ult,m.index)));
      const s=document.createElement('span');s.className='gl';s.dataset.g=k;s.tabIndex=0;s.textContent=m[1];
      frag.appendChild(s);ult=m.index+m[1].length;
    }
    if(frag){frag.appendChild(document.createTextNode(t.slice(ult)));nd.parentNode.replaceChild(frag,nd)}
  });
}
function glosaHTML(k){
  const t=GK[k];if(!t)return '';const e=t.ejemplo;
  const cab=`<span class="tn">${esc(t.termino)}</span><p class="gd">${esc(t.def[lang])}</p>`;
  if(!e)return cab;  /* obras: sólo la descripción */
  const href=(lang==='en'?'../../en/kaccayana/':'../../kaccayana/')+e.cap+'/#s'+e.n;
  return cab+
    `<p class="te">${lang==='en'?'Example':'Ejemplo'}: <a href="${href}">§${e.n}</a> <i>${esc(e.sutta||'')}</i>`+
    `${e.nota?' — '+esc(e.nota[lang]):''}${e.tr&&e.tr[lang]?` · «${esc(e.tr[lang])}»`:''}</p>`;
}

function textos(){
  const t=T[lang];root.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);
  document.querySelectorAll('[data-t-html]').forEach(el=>el.innerHTML=t[el.dataset.tHtml]);
  document.getElementById('q').placeholder=t.search;
  document.title=D.titulo[lang];
  document.getElementById('h1').textContent=D.titulo[lang];
  document.getElementById('entradilla').innerHTML=D.entradilla[lang];
  const m=D.meta;
  document.getElementById('atrib').innerHTML=m.atribucion[lang];
  document.getElementById('vbadge').innerHTML=`v${esc(m.version)} · <time datetime="${m.fecha}">${m.fecha}</time>`;
  document.getElementById('vfoot').innerHTML=`<strong>${t.ver} ${esc(m.version)}</strong> — <time datetime="${m.fecha}">${m.fecha}</time>. ${esc(m.nota_version[lang])}`;
  const lb=document.getElementById('lang-btn');lb.querySelectorAll('.lang-seg').forEach(x=>x.classList.toggle('lang-cur',x.dataset.l===lang));
  lb.title=lang==='en'?'Ver esta página en español':'View this page in English';lb.setAttribute('aria-label',lb.title);
  ['#entradilla','[data-t-html="how"]','#atrib','.aviso'].forEach(s=>document.querySelectorAll(s).forEach(glosar));
}
function prosa(bl){
  let h='',abierta='';
  bl.forEach(b=>{
    if(b.t!==abierta){if(abierta)h+=`</${abierta}>`;abierta=(b.t==='p')?'':b.t;if(abierta)h+=`<${abierta}>`}
    h+=b.t==='p'?`<p>${b.html}</p>`:`<li>${b.html}</li>`;
  });
  if(abierta)h+=`</${abierta}>`;
  return h;
}
function render(){
  let h='',sb='';
  D.secciones.forEach(s=>{
    sb+=`<a class="sec-l" href="#${s.id}" data-c="${s.id}">${esc(s.titulo[lang])}</a>`;
    if(s.filas){
      const cab=s.cabecera[lang];
      h+=`<section class="sec tabla" id="${s.id}"><h2>${esc(s.titulo[lang])}</h2><div class="tabla-caja" tabindex="0" role="region" aria-label="${esc(s.titulo[lang])}"><table class="co"><thead><tr>${cab.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
      s.filas.forEach(f=>{
        h+=`<tr class="r" id="${f.id}">${f[lang].map((c,i)=>`<td class="${CLS[i]}">${c}</td>`).join('')}</tr>`;
        sb+=`<a href="#${f.id}" data-c="${f.id}"><i>${esc(f.nombre.replace(/\s+\(.*$/,''))}</i></a>`;
      });
      h+='</tbody></table></div></section>';
    }else{
      h+=`<section class="sec prosa-sec" id="${s.id}"><h2>${esc(s.titulo[lang])}</h2><div class="prosa">${prosa(s.prosa[lang])}</div></section>`;
    }
  });
  document.getElementById('out').innerHTML=h;document.getElementById('sb-list').innerHTML=sb;
  /* el globo se cierra también al desplazar la tabla en horizontal */
  document.querySelectorAll('#out .tabla-caja').forEach(c=>c.addEventListener('scroll',()=>hideTip(),{passive:true}));
  document.querySelectorAll('#out td.ob, #out td.re, #out .prosa p, #out .prosa li').forEach(glosar);
  document.querySelectorAll('#out tr.r').forEach(r=>{r.dataset.t=norm(r.textContent).replace(/\s+/g,' ')});
  filtrar();
}
/* La búsqueda filtra las filas de las tablas; las secciones en prosa (notas,
   cambios, cobertura) se ocultan mientras hay búsqueda. */
function filtrar(){
  const q=norm(document.getElementById('q').value.trim());let n=0;
  document.querySelectorAll('#out tr.r').forEach(r=>{const ok=!q||r.dataset.t.includes(q);r.hidden=!ok;if(ok)n++});
  document.querySelectorAll('#out section.tabla').forEach(s=>{s.hidden=!s.querySelector('tr.r:not([hidden])')});
  document.querySelectorAll('#out section.prosa-sec').forEach(s=>{s.hidden=!!q});
  document.querySelectorAll('#sb-list a[data-c]').forEach(a=>{const el=document.getElementById(a.dataset.c);a.hidden=!el||el.hidden||!!el.closest('[hidden]')});
  document.getElementById('count').textContent=T[lang].rows(n);
  document.getElementById('empty').hidden=!!n;
  espiar();
}
document.getElementById('q').addEventListener('input',filtrar);
document.getElementById('lang-btn').onclick=()=>{lang=lang==='en'?'es':'en';store.set('pali_lang',lang);textos();render()};
/* tema, compartido con el sitio (pali_dark) */
const saved=store.get('pali_dark');
if(saved==='1'||(saved===null&&mq('(prefers-color-scheme: dark)'))) root.dataset.theme='dark';
document.getElementById('theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'':'dark';store.set('pali_dark',root.dataset.theme==='dark'?'1':'0')};

/* barra lateral (como en /recursos/analisis/) */
const sbEl=document.getElementById('sidebar'),scr=document.getElementById('scrim'),burger=document.getElementById('burger'),barEl=document.getElementById('bar');
const ancha=()=>innerWidth>900;
function medirBarra(){root.style.setProperty('--barh',barEl.offsetHeight+'px')}
medirBarra();addEventListener('resize',medirBarra);
/* la barra crece al pintarse sus filtros y su cuenta: se vuelve a medir (etapa 4b) */
if(window.ResizeObserver)new ResizeObserver(medirBarra).observe(barEl);
const cerrar=()=>{sbEl.classList.remove('open');scr.classList.remove('on')};
function pintarBarra(oc){root.classList.toggle('sin-barra',oc)} /* aria-label y aria-expanded de los tres ☰: cabecera.js (rotularIndice) */
burger.onclick=()=>{if(ancha())pintarBarra(!root.classList.contains('sin-barra'));else{sbEl.classList.toggle('open');scr.classList.toggle('on')}};
document.getElementById('sbclose').onclick=()=>{if(ancha())pintarBarra(true);else cerrar()};
/* plegado, el ☰ se queda en la esquina, donde estaba (recursos.css) */
document.getElementById('volver-barra').onclick=()=>pintarBarra(false);
addEventListener('resize',()=>{if(!ancha())root.classList.remove('sin-barra')});
scr.onclick=cerrar;
addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});
sbEl.addEventListener('click',e=>{if(e.target.closest('a')&&!ancha())cerrar()});
let spyF=0;
function espiar(){
  const links=document.querySelectorAll('#sb-list a[data-c]');let cur=null;const lim=barEl.getBoundingClientRect().bottom+40;
  for(const a of links){if(a.hidden)continue;const el=document.getElementById(a.dataset.c);if(!el)continue;if(el.getBoundingClientRect().top<=lim)cur=a;else break}
  links.forEach(a=>a.classList.toggle('on',a===cur));
}
const topBtn=document.getElementById('top-btn');
addEventListener('scroll',()=>{topBtn.classList.toggle('show',scrollY>600);if(!spyF)spyF=requestAnimationFrame(()=>{spyF=0;espiar()})},{passive:true});
topBtn.onclick=()=>scrollTo({top:0});

/* globos del glosario (como en /recursos/analisis/): ratón, toque y teclado */
const tip=document.getElementById('tip');let tipT=null,tipDe=null,ocultarT=null,puntero='mouse';
addEventListener('pointerdown',e=>{puntero=e.pointerType||'mouse'},{capture:true,passive:true});
const conRaton=()=>puntero==='mouse'&&mq('(hover: hover)');
function placeTip(el){const r=el.getBoundingClientRect();tip.style.visibility='hidden';tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=r.left,y=r.bottom+8;
  if(x+w>innerWidth-12)x=innerWidth-w-12;if(x<12)x=12;if(y+h>innerHeight-12)y=r.top-h-8;if(y<8)y=8;
  tip.style.left=x+'px';tip.style.top=y+'px';tip.style.visibility=''}
function abrirTip(el){clearTimeout(ocultarT);const h=glosaHTML(el.dataset.g);if(!h)return;tip.innerHTML=h;tip.classList.add('glosa');tip.setAttribute('aria-hidden','false');placeTip(el);tipDe=el}
function hideTip(){clearTimeout(tipT);clearTimeout(ocultarT);tip.classList.remove('on','glosa');tip.setAttribute('aria-hidden','true');tipDe=null}
const programarOcultar=()=>{clearTimeout(ocultarT);ocultarT=setTimeout(hideTip,250)};
tip.addEventListener('mouseenter',()=>clearTimeout(ocultarT));tip.addEventListener('mouseleave',programarOcultar);
document.addEventListener('mouseover',e=>{if(!conRaton())return;const a=e.target.closest('[data-g]');if(!a)return;clearTimeout(tipT);tipT=setTimeout(()=>abrirTip(a),110)});
document.addEventListener('mouseout',e=>{if(conRaton()&&e.target.closest('[data-g]')){clearTimeout(tipT);programarOcultar()}});
document.addEventListener('focusin',e=>{const a=e.target.closest('[data-g]');if(a&&a.matches(':focus-visible'))abrirTip(a)});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-g]'))programarOcultar()});
document.addEventListener('click',e=>{const a=e.target.closest('[data-g]');if(a){if(conRaton())return;if(tipDe===a)hideTip();else abrirTip(a);return}if(!e.target.closest('#tip'))hideTip()});
addEventListener('scroll',()=>{if(!tip.matches(':hover'))hideTip()},{passive:true});addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});

textos();render();
/* una fila en la dirección (#o12) se resalta */
(function(){const m=/^#(o\d+)$/.exec(location.hash);if(!m)return;const r=document.getElementById(m[1]);if(!r)return;
  r.classList.add('marca');setTimeout(()=>r.scrollIntoView(),0)})();
})();
</script>
</body>
